ard.folder,\n                    defaultEnvironment: wizard.environment, configJSON: wizard.editing?.configJSON ?? \"{}\",\n                    lastSyncedAt: wizard.editing?.lastSyncedAt,\n                    lastFingerprint: wizard.editing?.lastFingerprint)\n            }\n            let plan = try InventoryFile.plan(\n                source: source, loaded: wizard.loaded, parsed: parsed, existingHosts: app.hosts,\n                credentialSets: app.credentialSets)\n            var secretPlan: InventorySecretImport.Plan?\n            if wizard.keepPassword, (wizard.loaded.secrets?.count ?? 0) == 0 {\n                notice = \"Đã bật lưu mật khẩu nhưng không có mật khẩu nào trong cột đã chọn (hoặc dữ liệu đã bị xoá).\"\n            }\n            if wizard.keepPassword, let secrets = wizard.loaded.secrets, !wizard.isTemplate {\n                secretPlan = InventorySecretImport.plan(\n                    for: plan, secrets: secrets, sheet: parsed.sheet.name, existingHosts: app.hosts,\n                    overwrite: wizard.overwritePassword)\n            }\n            route = .preview(\n                InventoryPreview(\n                    plan: plan, wizard: wizard, title: wizard.url.lastPathComponent, secretPlan: secretPlan))\n        } catch { app.show(error, title: \"Không dựng được bản xem trước\") }\n    }\n\n    // MARK: - Thao tác trên nguồn đã lưu\n\n    func resync(_ source: InventorySource, newFile: URL? = nil) async {\n        guard let app else { return }\n        busy = true\n        defer { busy = false }\n        let hosts = app.hosts\n        let sets = app.credentialSets\n        if InventoryStructured.supports(source.kind) {\n            do {\n                let plan = try await Task.detached {\n                    try InventoryStructured.resync(\n                        source: source, pathOverride: newFile, existingHosts: hosts, credentialSets: sets)\n                }.value\n                route = .preview(InventoryPreview(plan: plan, wizard: nil, title: source.name))\n                showHub = true\n            } catch { app.show(error, title: \"Không đồng bộ được\") }\n            return\n        }\n        do {\n            let outcome = try await Task.detached {\n                try InventoryFile.resync(\n                    source: source, pathOverride: newFile, existingHosts: hosts, credentialSets: sets)\n            }.value\n            switch outcome {\n            case .ready(_, let plan):\n                route = .preview(InventoryPreview(plan: plan, wizard: nil, title: source.name))\n                showHub = true\n            case .needsRemap(let loaded, _, _, let reason):\n                let wizard = InventoryWizard(\n                    url: newFile ?? URL(fileURLWithPath: source.path), loaded: loaded, editing: source,\n                    suggestedNote: \"\\(reason) Hãy ghép lại cột.\")\n                // Gợi ý theo tiêu đề mới, không dùng cách ghép cũ đã hỏng.\n                if let sheet = wizard.sheet {\n                    wizard.mapping = TableMapping.guess(sheet: sheet, restrictTo: InventoryField.freeMappingFields)\n                    wizard.mapping.sheet = loaded.kind == .csv ? nil : sheet.name\n                }\n                route = .wizard(wizard)\n                showHub = true\n            }\n        } catch { app.show(error, title: \"Không đồng bộ được\") }\n    }\n\n    func chooseNewFile(for source: InventorySource) {\n        guard let url = pickFile(title: \"Chọn file mới cho nguồn “\\(source.name)”\", kind: source.kind) else { return }\n        Task { await resync(source, newFile: url) }\n    }\n\n    func editMapping(_ source: InventorySource) {\n        if InventoryStructured.supports(source.kind) {\n            Task { await openStructured(url: URL(fileURLWithPath: source.path), kind: source.kind, editing: source) }\n            return\n        }\n        Task { await open(url: URL(fileURLWithPath: source.path), editing: source) }\n    }\n\n    func delete(_ source: InventorySource) async {\n        guard let app, let service = app.service else { return }\n        do {\n            let n = try await service.deleteInventorySource(id: source.id)\n            await app.reload()\n            await refreshData()\n            app.showToast(\"Đã xoá nguồn “\\(source.name)” (giữ nguyên \\(n) máy chủ)\")\n        } catch { app.show(error, title: \"Không xoá được nguồn\") }\n    }\n\n    func apply(_ preview: InventoryPreview) async -> Bool {\n        // Giá trị cột mật khẩu không được tồn tại sau khi áp dụng (xong hay lỗi), và kế hoạch lưu\n        // mật khẩu không được sống lâu hơn dữ liệu của nó.\n        let hadSecretPlan = preview.secretPlan.map { !$0.isEmpty } ?? false\n        defer {\n            busy = false\n            preview.wizard?.discardSecrets()\n            preview.secretPlan = nil\n        }\n        guard let app, let service = app.service else { return false }\n        busy = true\n        do {\n            try await service.applyInventory(preview.plan)\n            if hadSecretPlan, preview.wizard?.loaded.secrets == nil {\n                notice =\n                    \"Chưa lưu mật khẩu: dữ liệu mật khẩu không còn trong bộ nhớ. Hãy nhập lại file và bật “Lưu mật khẩu từ cột”.\"\n            }\n            if let sp = preview.secretPlan, let wizard = preview.wizard, let secrets = wizard.loaded.secrets,\n                !sp.entries.isEmpty\n            {\n                let sheet = wizard.sheetName\n                let outcome = await InventorySecretImport.save(sp, secrets: secrets, sheet: sheet) { id, pw in\n                    _ = try await service.savePassword(hostID: id, password: pw)\n                }\n                var parts: [String] = []\n                if outcome.saved > 0 {\n                    parts.append(\n                        \"Đã lưu mật khẩu cho \\(outcome.saved) máy. Hãy xoá hoặc bảo vệ file Excel gốc — nó chứa mật khẩu dạng rõ.\"\n                    )\n                }\n                if outcome.failed > 0 { parts.append(\"\\(outcome.failed) máy không lưu được mật khẩu vào kho.\") }\n                if !sp.invalidRows.isEmpty {\n                    parts.append(\n                        \"Mật khẩu ở \\(sp.invalidRows.count) dòng không hợp lệ (dòng \\(sp.invalidRows.sorted().prefix(10).map(String.init).joined(separator: \", \"))).\"\n                    )\n                }\n                notice = parts.joined(separator: \"\\n\")\n            }\n            await app.reload()\n            await refreshData()\n            if let id = preview.plan.source?.id { changes[id] = nil }\n            let p = preview.plan\n            app.showToast(\n                \"Đã áp dụng: thêm \\(p.additions.count), đổi \\(p.updates.count), không còn trong nguồn \\(p.missing.count)\"\n            )\n            route = .list\n            return true\n        } catch {\n            app.show(error, title: \"Không áp dụng được (chưa ghi gì)\")\n            if hadSecretPlan {\n                notice = \"Chưa lưu mật khẩu — bật lại “Lưu mật khẩu từ cột” ở bước ghép cột để thử lại.\"\n            }\n            await app.reload()\n            return false\n        }\n    }\n\n    func detach(_ host: HostProfile) async {\n        guard let app, let service = app.service else { return }\n        do {\n            try await service.detachFromSource(hostID: host.id)\n            await app.reload()\n            await refreshData()\n            app.showToast(\"Đã tách “\\(host.displayName)” khỏi nguồn\")\n        } catch { app.show(error, title: \"Không tách được khỏi nguồn\") }\n    }\n\n    // MARK: - File mẫu\n\n    func saveTemplate() {\n        let panel = NSSavePanel()\n        panel.title = \"Tải file Excel mẫu\"\n        panel.message = \"File mẫu có sheet “Máy chủ” và “Hướng dẫn”. Không có cột mật khẩu.\"\n        panel.nameFieldStringValue = \"sshdesk-hosts-template.xlsx\"\n        if let x = UTType(filenameExtension: \"xlsx\") { panel.allowedContentTypes = [x] }\n        panel.canCreateDirectories = true\n        guard panel.runModal() == .OK, let url = panel.url else { return }\n        Task {\n            do {\n                try await Task.detached { try InventoryTemplate.write(to: url) }.value\n                app?.showToast(\"Đã lưu file mẫu → \\(url.lastPathComponent)\")\n                NSWorkspace.shared.activateFileViewerSelecting([url])\n            } catch {\n                app?.show(error, title: \"Không lưu được file mẫu\")\n            }\n        }\n    }\n}\n"}, "Sources/SSHDesk/InventoryViews.swift": {"group": "Giao diện", "text": "import SSHDeskCore\nimport SwiftUI\n\n// MARK: - Banner \"Nguồn có thay đổi\"\n\nstruct InventoryChangeBanner: View {\n    @Bindable var inventory: InventoryModel\n\n    var body: some View {\n        let list = inventory.bannerSources\n        if !list.isEmpty || !inventory.autoAdded.isEmpty {\n            VStack(spacing: 6) {\n                ForEach(inventory.autoAdded) { notice in\n                    HStack(spacing: 10) {\n                        Image(systemName: \"plus.circle\").foregroundStyle(Theme.amber)\n                        Text(\"Đã thêm \\(notice.count) máy từ “\\(notice.record.sourceName)”.\")\n                        Spacer(minLength: 0)\n                        Button(\"Xem\") { inventory.showAutoAdded(notice) }\n                        Button(\"Hoàn tác\") { Task { await inventory.undoAutoAdded(notice) } }\n                        Button(\"Đóng\") { inventory.dismissAutoAdded(notice) }\n                    }\n                    .controlSize(.small)\n                    .font(.system(size: 12.5))\n                    .padding(.horizontal, 14).padding(.vertical, 7)\n                    .background(Theme.amber.opacity(0.14))\n                }\n                ForEach(list) { s in\n                    HStack(spacing: 10) {\n                        Image(systemName: \"arrow.triangle.2.circlepath\").foregroundStyle(Theme.amber)\n                        if inventory.changes[s.id] == .fileMissing {\n                            Text(\"Không thấy file của nguồn “\\(s.name)”. Có thể đã đổi tên hoặc chuyển chỗ.\")\n                        } else {\n                            Text(\"Nguồn có thay đổi: “\\(s.name)”. Chưa áp dụng gì cả — xem trước rồi mới đồng bộ.\")\n                        }\n                        Spacer(minLength: 0)\n                        if inventory.changes[s.id] == .fileMissing {\n                            Button(\"Chọn file mới…\") {\n                                inventory.openHub()\n                                inventory.chooseNewFile(for: s)\n                            }\n                        } else {\n                            Button(\"Xem trước\") {\n                                inventory.showHub = true\n                                Task { await inventory.resync(s) }\n                            }\n                        }\n                        Button(\"Bỏ qua\") { inventory.dismissedBanner.insert(s.id) }\n                    }\n                    .controlSize(.small)\n                    .font(.system(size: 12.5))\n                    .padding(.horizontal, 14).padding(.vertical, 7)\n                    .background(Theme.amber.opacity(0.14))\n                }\n            }\n        }\n    }\n}\n\n// MARK: - Huy hiệu trên host\n\nstruct SourceBadge: View {\n    let host: HostProfile\n    let sourceName: String?\n\n    var body: some View {\n        if host.sourceID != nil {\n            if host.sourceMissing {\n                Text(\"Không còn trong nguồn\")\n                    .font(.system(size: 10.5, weight: .semibold))\n                    .padding(.horizontal, 6).padding(.vertical, 2)\n                    .foregroundStyle(Theme.amber)\n                    .background(Theme.amber.opacity(0.15), in: Capsule())\n                    .help(\"Máy vẫn được giữ lại; nguồn “\\(sourceName ?? \"?\")” không còn dòng này.\")\n            } else {\n                Image(systemName: \"link\").font(.system(size: 10.5))\n                    .foregroundStyle(Theme.textSecondary)\n                    .help(\"Đồng bộ từ nguồn “\\(sourceName ?? \"?\")”\")\n                    .accessibilityLabel(\"Từ nguồn \\(sourceName ?? \"\")\")\n            }\n        }\n    }\n}\n\n/// Thẻ trong chi tiết host: nguồn + \"Tách khỏi nguồn\".\nstruct HostSourceCard: View {\n    @Bindable var model: AppModel\n    let host: HostProfile\n    @Local private var confirmDetach = false\n\n    var body: some View {\n        if host.sourceID != nil {\n            VStack(alignment: .leading, spacing: 8) {\n                Text(\"Nguồn\").font(.system(size: 14, weight: .semibold))\n                HStack {\n                    Label(\n                        \"Đồng bộ từ “\\(model.inventory.sourceName(for: host) ?? \"nguồn đã xoá\")”\",\n                        systemImage: \"link\"\n                    )\n                    .font(.system(size: 13))\n                    Spacer(minLength: 0)\n                    Button(\"Tách khỏi nguồn\") { confirmDetach = true }.controlSize(.small)\n                }\n                if host.sourceMissing {\n                    Label(\n                        \"Không còn trong nguồn — máy vẫn được giữ, không tự xoá.\",\n                        systemImage: \"exclamationmark.triangle.fill\"\n                    )\n                    .font(.system(size: 12.5)).foregroundStyle(Theme.amber)\n                }\n                Text(\"Tên, IP, port, user, môi trường, thư mục, jump host do nguồn quản lý và chỉ đọc.\")\n                    .font(.system(size: 12)).foregroundStyle(Theme.textSecondary)\n            }\n            .padding(14)\n            .frame(maxWidth: .infinity, alignment: .leading)\n            .cardStyle()\n            .confirmationDialog(\n                \"Tách “\\(host.displayName)” khỏi nguồn?\", isPresented: $confirmDetach, titleVisibility: .visible\n            ) {\n                Button(\"Tách khỏi nguồn\") { Task { await model.inventory.detach(host) } }\n            } message: {\n                Text(\"Máy giữ nguyên mọi giá trị, trở thành máy tạo tay; các lần đồng bộ sau không đụng tới nó nữa.\")\n            }\n        }\n    }\n}\n\n// MARK: - Hub\n\nstruct InventoryHubSheet: View {\n    @Bindable var model: AppModel\n    @Bindable var inventory: InventoryModel\n\n    var body: some View {\n        VStack(spacing: 0) {\n            switch inventory.route {\n            case .list: InventorySourceList(model: model, inventory: inventory)\n            case .structured(let t): StructuredSetupView(inventory: inventory, setup: t)\n            case .wizard(let w): InventoryWizardView(model: model, inventory: inventory, wizard: w)\n            case .preview(let p): InventoryPreviewView(model: model, inventory: inventory, preview: p)\n            }\n        }\n        .frame(width: 780, height: 640)\n        .overlay { if inventory.busy { ProgressView().controlSize(.large) } }\n        .alert(\n            \"Lưu ý về mật khẩu\",\n            isPresented: Binding(get: { inventory.notice != nil }, set: { if !$0 { inventory.notice = nil } })\n        ) {\n            Button(\"Đã hiểu\") { inventory.notice = nil }\n        } message: {\n            Text(inventory.notice ?? \"\")\n        }\n    }\n}\n\n// MARK: - Danh sách nguồn\n\nstruct InventorySourceList: View {\n    @Bindable var model: AppModel\n    @Bindable var inventory: InventoryModel\n\n    var body: some View {\n        VStack(alignment: .leading, spacing: 12) {\n            HStack {\n                Text(\"Nguồn máy chủ\").font(.title2.bold())\n                Spacer()\n                Button(\"Tải file mẫu…\") { inventory.saveTemplate() }\n                    .help(\"Tải file Excel mẫu (có dropdown Môi trường / Loại, sheet Hướng dẫn)\")\n                Menu(\"Thêm nguồn\") {\n                    Button(\"Excel / CSV…\") { inventory.addSource() }\n                    Button(\"JSON (.sshdesk.json)…\") { inventory.addStructuredSource(kind: .json) }\n                    Button(\"Ansible inventory (INI/YAML)…\") { inventory.addStructuredSource(kind: .ansible) }\n                }\n                .menuStyle(.borderedButton).fixedSize()\n            }\n            Text(\n                \"Đồng bộ một chiều từ file Excel/CSV, JSON hoặc Ansible inventory tĩnh: thêm, đổi, đánh dấu “Không còn trong nguồn” (không bao giờ tự xoá máy). \"\n                    + \"Luôn xem trước rồi mới áp dụng. Cột/biến mật khẩu trong file bị bỏ qua.\"\n            )\n            .font(.callout).foregroundStyle(.secondary)\n            if inventory.sources.isEmpty {\n                VStack(spacing: 8) {\n                    Image(systemName: \"tablecells\").font(.system(size: 34)).foregroundStyle(.secondary)\n                    Text(\"Chưa có nguồn nào\").font(.headline)\n                    Text(\"Bấm “Tải file mẫu…” để lấy file Excel chuẩn, điền rồi “Thêm nguồn”.\")\n                        .foregroundStyle(.secondary)\n                }\n                .frame(maxWidth: .infinity, maxHeight: .infinity)\n            } else {\n                List {\n                    ForEach(inventory.sources) { s in sourceRow(s) }\n                }\n                .listStyle(.inset)\n            }\n            HStack {\n                Spacer()\n                Button(\"Đóng\") { inventory.close() }.keyboardShortcut(.cancelAction)\n            }\n        }\n        .padding(18)\n        .confirmationDialog(\n            \"Xoá nguồn “\\(inventory.confirmDelete?.name ?? \"\")”?\",\n            isPresented: Binding(\n                get: { inventory.confirmDelete != nil }, set: { if !$0 { inventory.confirmDelete = nil } }),\n            titleVisibility: .visible\n        ) {\n            Button(\"Xoá nguồn\", role: .destructive) {\n                if let s = inventory.confirmDelete { Task { await inventory.delete(s) } }\n                inventory.confirmDelete = nil\n            }\n        } message: {\n            Text(\"Các máy chủ KHÔNG bị xoá; chúng chỉ bị gỡ khỏi nguồn (thành máy tạo tay).\")\n        }\n    }\n\n    private func sourceRow(_ s: InventorySource) -> some View {\n        let usage = inventory.usage[s.id]\n        return VStack(alignment: .leading, spacing: 6) {\n            HStack {\n                Image(\n                    systemName: s.kind == .excel ? \"tablecells\" : (s.kind.isTabular ? \"doc.plaintext\" : \"shippingbox\"))\n                Text(s.name).font(.headline)\n                Text(s.kind.title).font(.caption).foregroundStyle(.secondary)\n                Spacer()\n                switch inventory.changes[s.id] {\n                case .changed?:\n                    Label(\"Có thay đổi\", systemImage: \"arrow.triangle.2.circlepath\").foregroundStyle(Theme.amber)\n                case .fileMissing?:\n                    Label(\"Không thấy file\", systemImage: \"exclamationmark.triangle\").foregroundStyle(Theme.amber)\n                case .unreadable?:\n                    Label(\"Không đọc được\", systemImage: \"exclamationmark.triangle\").foregroundStyle(Theme.red)\n                default: EmptyView()\n                }\n            }\n            .font(.system(size: 12.5))\n            Text(s.path).font(.caption.monospaced()).foregroundStyle(.secondary).lineLimit(1).truncationMode(.middle)\n            Toggle(\n                \"Tự thêm máy mới (khi file chỉ có máy mới; không lưu mật khẩu)\",\n                isOn: Binding(\n                    get: { s.autoAddNew },\n                    set: { on in Task { await inventory.setAutoAdd(s, enabled: on) } })\n            )\n            .toggleStyle(.checkbox).controlSize(.small).font(.caption)\n            HStack {\n                Text(\n                    \"\\(usage?.hosts ?? 0) máy\"\n                        + ((usage?.missing ?? 0) > 0 ? \" · \\(usage?.missing ?? 0) không còn trong nguồn\" : \"\")\n                        + \" · Đồng bộ lần cuối: \"\n                        + (s.lastSyncedAt.map { $0.formatted(date: .abbreviated, time: .shortened) } ?? \"chưa\")\n                )\n                .font(.caption).foregroundStyle(.secondary)\n                Spacer()\n                Button(\"Đồng bộ lại\") { Task { await inventory.resync(s) } }\n                Button(\"Chọn file mới…\") { inventory.chooseNewFile(for: s) }\n                Button(s.kind.isTabular ? \"Sửa ghép cột\" : \"Sửa nguồn\") { inventory.editMapping(s) }\n                Button(\"Xoá nguồn\", role: .destructive) { inventory.confirmDelete = s }\n            }\n            .controlSize(.small)\n        }\n        .padding(.vertical, 6)\n    }\n}\n\n// MARK: - Nguồn JSON / Ansible (không ghép cột)\n\nstruct StructuredSetupView: View {\n    @Bindable var inventory: InventoryModel\n    @Bindable var setup: StructuredSetup\n\n    var body: some View {\n        let result = setup.loaded.result\n        VStack(alignment: .leading, spacing: 12) {\n            Text(setup.editing == nil ? \"Thêm nguồn \\(setup.kind.title)\" : \"Sửa nguồn \\(setup.kind.title)\")\n                .font(.title2.bold())\n            Text(setup.url.lastPathComponent).font(.callout.monospaced()).foregroundStyle(.secondary)\n            Text(\"Đọc được \\(result.records.count) máy, \\(result.errorCount) lỗi.\").font(.callout)\n            ForEach(result.warnings, id: \\.self) {\n                Label($0, systemImage: \"lock.shield\").font(.callout).foregroundStyle(Theme.amber)\n            }\n            if setup.kind == .ansible {\n                Text(\n                    \"Tên group được dùng làm tag. Chỉ đọc ansible_host/port/user; không chạy Ansible, không đọc host_vars/group_vars.\"\n                )\n                .font(.caption).foregroundStyle(.secondary)\n            }\n            Form {\n                Toggle(\"Lưu làm nguồn để đồng bộ lại\", isOn: $setup.saveAsSource)\n                if setup.saveAsSource { TextField(\"Tên nguồn\", text: $setup.sourceName) }\n                TextField(\"Thư mục mặc định (máy không có thư mục)\", text: $setup.folder)\n                Picker(\"Môi trường mặc định\", selection: $setup.environment) {\n                    Text(\"OTHER\").tag(HostEnvironment?.none)\n                    ForEach(HostEnvironment.allCases, id: \\.self) { Text($0.rawValue).tag(HostEnvironment?.some($0)) }\n                }\n            }\n            .formStyle(.grouped)\n            Spacer(minLength: 0)\n            HStack {\n                Button(\"Huỷ\") { inventory.route = .list }.keyboardShortcut(.cancelAction)\n                Spacer()\n                Button(\"Xem trước\") { inventory.showPreview(from: setup) }.keyboardShortcut(.defaultAction)\n            }\n        }\n        .padding(18)\n    }\n}\n\n// MARK: - Ghép cột\n\nstruct InventoryWizardView: View {\n    @Bindable var model: AppModel\n    @Bindable var inventory: InventoryModel\n    @Bindable var wizard: InventoryWizard\n\n    @ViewBuilder\n    private var secretToggles: some View {\n        if !wizard.isTemplate {\n            VStack(alignment: .leading, spacing: 4) {\n                if wizard.passwordHeaders.count > 1 {\n                    Picker(\"Cột mật khẩu\", selection: $wizard.secretHeader) {\n                        ForEach(wizard.passwordHeaders, id: \\.self) { Text($0).tag($0) }\n                    }\n                    .disabled(wizard.keepPassword || wizard.reloading)\n                }\n                Toggle(\n                    \"Lưu mật khẩu từ cột \\(wizard.secretHeader) vào kho\",\n                    isOn: Binding(\n                        get: { wizard.keepPassword },\n                        set: { on in Task { await inventory.setKeepPassword(wizard, on) } })\n                )\n                .disabled(wizard.reloading || wizard.secretHeader.isEmpty)\n                if wizard.keepPassword {\n                    Toggle(\"Ghi đè mật khẩu đã lưu\", isOn: $wizard.overwritePassword).padding(.leading, 16)\n                    Text(\n                        \"Chỉ áp dụng lần này, không lưu lại. Mật khẩu chỉ ghi vào kho mã hoá, không vào file hay CSDL.\"\n                    )\n                    .font(.caption).foregroundStyle(.secondary)\n                }\n            }\n        }\n    }\n\n    var body: some View {\n        VStack(alignment: .leading, spacing: 12) {\n            Text(wizard.editing == nil ? \"Thêm nguồn\" : \"Sửa ghép cột\").font(.title2.bold())\n            Text(wizard.url.lastPathComponent).font(.callout.monospaced()).foregroundStyle(.secondary)\n            if let note = wizard.note {\n                Label(note, systemImage: \"exclamationmark.triangle.fill\").foregroundStyle(Theme.amber)\n                    .font(.callout)\n            }\n            if !wizard.passwordHeaders.isEmpty {\n                Label(\n                    \"Phát hiện cột mật khẩu — sẽ bỏ qua (\\(wizard.passwordHeaders.joined(separator: \", \"))). Mặc định giá trị không được đọc vào app.\",\n                    systemImage: \"lock.shield\"\n                )\n                .font(.callout).foregroundStyle(Theme.amber)\n                secretToggles\n            }\n            Form {\n                if wizard.loaded.workbook.sheets.count > 1 {\n                    Picker(\n                        \"Sheet\",\n                        selection: Binding(get: { wizard.sheetName }, set: { inventory.changeSheet(wizard, to: $0) })\n                    ) {\n                        ForEach(wizard.loaded.workbook.sheets, id: \\.name) { Text($0.name).tag($0.name) }\n                    }\n                }\n                Stepper(\n                    \"Dòng tiêu đề: \\(wizard.headerRow)\",\n                    value: Binding(\n                        get: { wizard.headerRow },\n                        set: { v in Task { await inventory.changeHeaderRow(wizard, to: v) } }),\n                    in: 1...30\n                )\n                .disabled(wizard.reloading)\n                Section(\"Ghép cột\") {\n                    ForEach(InventoryField.freeMappingFields, id: \\.self) { field in\n                        Picker(\n                            field.title,\n                            selection: Binding(\n                                get: { wizard.header(for: field) }, set: { wizard.setHeader($0, for: field) })\n                        ) {\n                            Text(\"— bỏ qua —\").tag(\"\")\n                            ForEach(wizard.headerChoices, id: \\.self) { Text($0).tag($0) }\n                        }\n                    }\n                    Picker(\"Cột khoá\", selection: $wizard.mapping.keyField) {\n                        Text(\"Tên\").tag(InventoryField.name).disabled(wizard.mapping.header(for: .name) == nil)\n                        Text(\"IP/Hostname\").tag(InventoryField.hostName)\n                    }\n                    .help(\"Dùng để nhận ra cùng một máy khi đồng bộ lại. Mặc định là Tên (đổi IP vẫn là cùng máy).\")\n                }\n                Section(\"Nguồn\") {\n                    Toggle(\"Lưu làm nguồn để đồng bộ lại\", isOn: $wizard.saveAsSource)\n                    if wizard.saveAsSource {\n                        TextField(\"Tên nguồn\", text: $wizard.sourceName)\n                    }\n                    TextField(\"Thư mục mặc định (nếu file không có cột thư mục)\", text: $wizard.folder)\n                    Picker(\"Môi trường mặc định\", selection: $wizard.environment) {\n                        Text(\"OTHER\").tag(HostEnvironment?.none)\n                        ForEach(HostEnvironment.allCases, id: \\.self) {\n                            Text($0.rawValue).tag(HostEnvironment?.some($0))\n                        }\n                    }\n                }\n            }\n            .formStyle(.grouped)\n            samplePreview\n            HStack {\n                Button(\"Huỷ\") { inventory.cancelToList() }.keyboardShortcut(.cancelAction)\n                Spacer()\n                Button(\"Xem trước\") { inventory.showPreview(from: wizard) }\n                    .keyboardShortcut(.defaultAction)\n                    .disabled(wizard.mapping.header(for: .hostName) == nil || wizard.reloading)\n            }\n        }\n        .padding(18)\n    }\n\n    /// 3 dòng đầu theo cách ghép — chỉ các cột đã ghép, không bao giờ cột mật khẩu.\n    @ViewBuilder\n    private var samplePreview: some View {\n        if let sheet = wizard.sheet {\n            let resolved = wizard.mapping.resolve(in: sheet)\n            let fields = InventoryField.freeMappingFields.filter { resolved.columns[$0] != nil }\n            if !fields.isEmpty {\n                VStack(alignment: .leading, spacing: 2) {\n                    Text(\"Dòng đầu tiên\").font(.caption.bold()).foregroundStyle(.secondary)\n                    ForEach(Array(sheet.dataRows.prefix(3)), id: \\.number) { row in\n                        Text(\n                            \"Dòng \\(row.number): \"\n                                + fields.map { row.cell(resolved.columns[$0] ?? -1) }.joined(separator: \"  ·  \")\n                        )\n                        .font(.caption.monospaced()).lineLimit(1).truncationMode(.tail)\n                    }\n                }\n            }\n        }\n    }\n}\n\n// MARK: - Xem trước\n\nstruct InventoryPreviewView: View {\n    @Bindable var model: AppModel\n    @Bindable var inventory: InventoryModel\n    let preview: InventoryPreview\n    @Local private var confirmSecrets = false\n\n    private let cap = 150\n\n    var body: some View {\n        let plan = preview.plan\n        VStack(alignment: .leading, spacing: 10) {\n            Text(\"Xem trước đồng bộ\").font(.title2.bold())\n            Text(summary(plan)).font(.callout).foregroundStyle(.secondary)\n            if plan.source == nil {\n                Label(\"Nhập một lần: không lưu nguồn, lần sau sẽ không đồng bộ lại.\", systemImage: \"info.circle\")\n                    .font(.callout).foregroundStyle(.secondary)\n            }\n            ScrollView {\n                LazyVStack(alignment: .leading, spacing: 4) {\n                    if !plan.additions.isEmpty {\n                        header(\"Thêm \\(plan.additions.count) máy\")\n                        ForEach(Array(plan.additions.prefix(cap))) { a in\n                            VStack(alignment: .leading, spacing: 1) {\n                                Text(\"＋ \\(a.host.displayName)  \\(HostPresentation.addressText(a.host))\")\n                                if let s = a.credentialSetName {\n                                    Text(\"   Bộ đăng nhập “\\(s)” — tạm tắt tự điền mật khẩu tới khi bạn xác nhận\")\n                                        .font(.caption).foregroundStyle(Theme.amber)\n                                }\n                            }\n                        }\n                        more(plan.additions.count)\n                    }\n                    if !plan.setsToCreate.isEmpty {\n                        header(\"Sẽ tạo bộ đăng nhập rỗng (nhập mật khẩu sau)\")\n                        ForEach(plan.setsToCreate, id: \\.self) { Text(\"• \\($0) — sẽ tạo bộ rỗng\") }\n                    }\n                    if !plan.updates.isEmpty {\n                        header(\"Đổi \\(plan.updates.count) máy\")\n                        ForEach(Array(plan.updates.prefix(cap))) { u in\n                            VStack(alignment: .leading, spacing: 1) {\n                                Text(\"✎ \\(u.displayName)\\(u.restored ? \"  (có lại trong nguồn)\" : \"\")\")\n                                ForEach(u.changes, id: \\.label) { c in\n                                    Text(\"   \\(c.text)\").font(.caption.monospaced()).foregroundStyle(.secondary)\n                                }\n                                if let r = u.holdReason {\n                                    Text(\"   Sẽ tạm tắt tự điền mật khẩu: \\(r)\").font(.caption).foregroundStyle(\n                                        Theme.amber)\n                                }\n                            }\n                        }\n                        more(plan.updates.count)\n                    }\n                    if !plan.missing.isEmpty {\n                        header(\"Không còn trong nguồn \\(plan.missing.count) máy (giữ lại, không xoá)\")\n                        ForEach(Array(plan.missing.prefix(cap))) { Text(\"− \\($0.displayName)\") }\n                        more(plan.missing.count)\n                    }\n                    let errors = plan.issues.filter { $0.severity == .error }\n                    let warnings = plan.issues.filter { $0.severity == .warning }\n                    if !errors.isEmpty {\n                        header(\"Lỗi \\(errors.count) dòng (bỏ qua, các dòng khác vẫn nhập)\")\n                        ForEach(Array(errors.prefix(cap))) { Text($0.text).foregroundStyle(Theme.red).font(.callout) }\n                        more(errors.count)\n                    }\n                    if !warnings.isEmpty || !plan.warnings.isEmpty {\n                        header(\"Cảnh báo\")\n                        ForEach(plan.warnings, id: \\.self) { Text($0).foregroundStyle(Theme.amber).font(.callout) }\n                        ForEach(Array(warnings.prefix(cap))) {\n                            Text($0.text).foregroundStyle(Theme.amber).font(.callout)\n                        }\n                    }\n                    if !plan.hasChanges && plan.errorCount == 0 {\n                        Text(\"Không có gì thay đổi.\").foregroundStyle(.secondary).padding(.top, 8)\n                    }\n                }\n                .font(.system(size: 13))\n                .frame(maxWidth: .infinity, alignment: .leading)\n            }\n            .padding(10)\n            .background(Theme.control, in: RoundedRectangle(cornerRadius: 8))\n            if let sp = preview.secretPlan {\n                VStack(alignment: .leading, spacing: 2) {\n                    Label(\n                        \"Mật khẩu sẽ lưu cho \\(sp.newCount) máy mới\"\n                            + (sp.replaceCount > 0 ? \", ghi đè \\(sp.replaceCount) máy\" : \"\")\n                            + (sp.skippedExisting > 0 ? \"; bỏ qua \\(sp.skippedExisting) máy đã có mật khẩu riêng\" : \"\")\n                            + \".  Mỗi dòng: ••••\",\n                        systemImage: \"lock.fill\"\n                    )\n                    .font(.callout).foregroundStyle(Theme.amber)\n                    ForEach(sp.invalidMessages.prefix(10), id: \\.self) {\n                        Text($0).font(.caption).foregroundStyle(Theme.red)\n                    }\n                }\n            } else {\n                Text(\"Không đụng tới ~/.ssh/config. Mật khẩu không nằm trong file nguồn và không được nhập.\")\n                    .font(.caption).foregroundStyle(.secondary)\n            }\n            HStack {\n                Button(\"Huỷ\") { inventory.cancelToList() }.keyboardShortcut(.cancelAction)\n                if let w = preview.wizard, !w.isTemplate {\n                    Button(\"Quay lại ghép cột\") { inventory.route = .wizard(w) }\n                }\n                Spacer()\n                Button(\"Áp dụng\") {\n                    if let sp = preview.secretPlan, !sp.isEmpty {\n                        confirmSecrets = true\n                    } else {\n                        Task { _ = await inventory.apply(preview) }\n                    }\n                }\n                .keyboardShortcut(.defaultAction)\n                .disabled((!plan.hasChanges && plan.source == nil) || inventory.busy)\n            }\n        }\n        .padding(18)\n        .confirmationDialog(\n            \"Lưu mật khẩu cho \\(preview.secretPlan?.count ?? 0) máy vào kho mã hoá?\", isPresented: $confirmSecrets,\n            titleVisibility: .visible\n        ) {\n            Button(\"Lưu mật khẩu và áp dụng\") { Task { _ = await inventory.apply(preview) } }\n            Button(\"Huỷ\", role: .cancel) {}\n        } message: {\n            Text(\"Mật khẩu được đọc từ file Excel/CSV và chỉ ghi vào kho mã hoá của app.\")\n        }\n    }\n\n    private func summary(_ p: InventorySyncPlan) -> String {\n        \"\\(preview.title): thêm \\(p.additions.count) · đổi \\(p.updates.count) · không còn trong nguồn \\(p.missing.count) · \"\n            + \"không đổi \\(p.unchangedCount) · lỗi \\(p.errorCount) · cảnh báo \\(p.warningCount)\"\n    }\n\n    private func header(_ text: String) -> some View {\n        Text(text).font(.system(size: 13, weight: .semibold)).padding(.top, 8)\n    }\n\n    @ViewBuilder\n    private func more(_ total: Int) -> some View {\n        if total > cap { Text(\"… và \\(total - cap) mục khác\").foregroundStyle(.secondary) }\n    }\n}\n"}, "Sources/SSHDesk/KeysModel.swift": {"group": "Giao diện", "text": "import AppKit\nimport Foundation\nimport Observation\nimport SSHDeskCore\n\n/// Việc đang chạy của màn SSH Keys (tạo key hoặc cài key). Một lúc chỉ một việc.\nstruct KeyTaskInfo: Equatable {\n    enum Kind: Equatable {\n        case generate(name: String)\n        case install(keyName: String, hostName: String)\n    }\n    let kind: Kind\n\n    var title: String {\n        switch kind {\n        case .generate(let n): return \"Đang tạo key “\\(n)”…\"\n        case .install(let k, let h): return \"Đang cài key “\\(k)” lên “\\(h)”…\"\n        }\n    }\n\n    /// Dòng nguồn trên thẻ prompt.\n    var context: String {\n        switch kind {\n        case .generate(let n): return \"\\(n) · Tạo key\"\n        case .install(let k, let h): return \"\\(h) · Cài key \\(k)\"\n        }\n    }\n}\n\n/// Đề nghị đổi host sang xác thực bằng key vừa cài.\nstruct KeyAdoptionOffer: Identifiable {\n    let id = UUID()\n    let host: HostProfile\n    let key: SSHKeyInfo\n}\n\n@MainActor @Observable\nfinal class KeysModel {\n    unowned let app: AppModel\n    private let inventory: SSHKeyInventory\n    private let secureEnclave: SecureEnclaveKeyService\n\n    var keys: [SSHKeyInfo] = []\n    var loaded = false\n    var selectionName: String?\n    var task: KeyTaskInfo?\n    var pendingPrompt: PromptKind?\n    /// Form tạo key.\n    var showGenerate = false\n    /// Menu ⋯ của host: chọn key để cài lên host này.\n    var pickKeyForHost: HostProfile?\n    /// PROD: chờ xác nhận trước khi cài.\n    var confirmProdInstall: (key: SSHKeyInfo, host: HostProfile)?\n    var adoptionOffer: KeyAdoptionOffer?\n\n    /// Agent đang xem ở mục \"Key trong agent\": nil = mặc định trong Cài đặt (hoặc hệ thống).\n    var agentPreset: IdentityAgentPreset?\n    var agentListing: AgentKeyListing?\n    var agentLoading = false\n\n    /// Khoá Secure Enclave (ADR-027). Mục bị ẩn khi máy thiếu dylib/sc_auth.\n    var seIdentities: [SecureEnclaveIdentity] = []\n    var seBusy = false\n    var showCreateSE = false\n    var pendingDeleteSE: SecureEnclaveIdentity?\n    /// Tạo identity xong nhưng xuất file handle lỗi: đề nghị xoá (không tự xoá im lặng).\n    var seFailedLabel: (label: String, reason: String)?\n\n    private var session: KeyTaskSession?\n\n    init(app: AppModel, directory: URL = SSHKeyInventory.defaultDirectory) {\n        self.app = app\n        inventory = SSHKeyInventory(directory: directory)\n        secureEnclave = SecureEnclaveKeyService(\n            directory: directory, helper: ControllingTTYHelper.defaultURL())\n    }\n\n    var seAvailable: Bool { secureEnclave.isAvailable }\n\n    var selected: SSHKeyInfo? { keys.first { $0.name == selectionName } }\n    var isBusy: Bool { task != nil || seBusy }\n\n    func refresh() async {\n        keys = await inventory.list()\n        await refreshSecureEnclave()\n        loaded = true\n        if let s = selectionName, !keys.contains(where: { $0.name == s }) { selectionName = nil }\n    }\n\n    // MARK: - Khoá Secure Enclave (ADR-027)\n\n    func refreshSecureEnclave() async {\n        guard seAvailable else {\n            seIdentities = []\n            return\n        }\n        seIdentities = (try? await secureEnclave.list()) ?? []\n    }\n\n    /// Có cặp file handle (cả hai file thường) trong thư mục khoá.\n    func seHasHandle(_ identity: SecureEnclaveIdentity) -> Bool {\n        secureEnclave.hasHandleFiles(label: identity.label)\n    }\n\n    /// Cặp key E1 tương ứng với handle (để cài lên server / đổi xác thực host).\n    func seKeyInfo(_ identity: SecureEnclaveIdentity) -> SSHKeyInfo? {\n        let name = SecureEnclaveKeyService.handleName(label: identity.label)\n        return keys.first { $0.name == name && !$0.isSymlink }\n    }\n\n    var seErrorLabels: Set<String> { Set(seIdentities.map(\\.label)) }\n\n    /// true nếu đã tạo xong (form đóng).\n    func createSecureEnclave(label: String, protection: SecureEnclaveProtection) async -> Bool {\n        guard !isBusy else { return false }\n        seBusy = true\n        defer { seBusy = false }\n        do {\n            try await secureEnclave.create(label: label, protection: protection)\n            await refresh()\n            selectionName = SecureEnclaveKeyService.handleName(label: label)\n            app.showToast(\"Đã tạo khoá Secure Enclave “\\(label)”\")\n            return true\n        } catch SecureEnclaveError.handleExportFailed(let label, let reason) {\n            await refresh()\n            seFailedLabel = (label, reason)\n            return true\n        } catch {\n            app.show(error, title: \"Không tạo được khoá Secure Enclave\")\n            return false\n        }\n    }\n\n    func deleteSecureEnclave(label: String) async {\n        guard !isBusy else { return }\n        seBusy = true\n        defer { seBusy = false }\n        do {\n            try await secureEnclave.delete(label: label)\n            app.showToast(\"Đã xoá khoá Secure Enclave “\\(label)”\")\n        } catch {\n            app.show(error, title: \"Không xoá được khoá Secure Enclave\")\n        }\n        await refresh()\n    }\n\n    // MARK: - Key trong agent (ADR-024)\n\n    /// Giá trị agent đang xem (đường dẫn/`SSH_AUTH_SOCK`); nil = agent hệ thống.\n    var agentValue: String? {\n        IdentityAgentResolution.effective(\n            host: agentPreset?.path, settingsDefault: app.settings.defaultIdentityAgent)\n    }\n\n    /// Chạy `ssh-add -L` (chỉ đọc public key). Không thêm/xoá key.\n    func refreshAgent() async {\n        agentLoading = true\n        let value = agentValue\n        agentListing = await AgentKeyLister.list(agent: value)\n        agentLoading = false\n    }\n\n    // MARK: - Public key / Finder\n\n    /// Copy nội dung file `.pub` (public, không bí mật). Không bao giờ đụng private key.\n    func copyPublicKey(_ key: SSHKeyInfo) {\n        guard let text = inventory.publicKeyText(key) else {\n            app.alert = AppAlert(title: \"Không đọc được public key\", message: key.publicKeyPath)\n            return\n        }\n        NSPasteboard.general.clearContents()\n        NSPasteboard.general.setString(text, forType: .string)\n        app.showToast(\"Đã copy public key “\\(key.name)”\")\n    }\n\n    func revealInFinder(_ key: SSHKeyInfo) {\n        NSWorkspace.shared.activateFileViewerSelecting([URL(fileURLWithPath: key.publicKeyPath)])\n    }\n\n    // MARK: - Tạo key\n\n    /// Trả true nếu tác vụ đã bắt đầu (form đóng). Lỗi validate/đã tồn tại → alert.\n    func generate(name: String, comment: String) async -> Bool {\n        guard !isBusy else { return false }\n        do {\n            let generator = try SSHKeyGenerator(\n                directory: inventory.directory, name: name, comment: comment,\n                helper: ControllingTTYHelper.defaultURL())\n            let session = try await generator.start()\n            run(session, info: KeyTaskInfo(kind: .generate(name: name))) { [weak self] outcome in\n                guard let self else { return }\n                await self.refresh()\n                if case .success = outcome { self.selectionName = name }\n            }\n            return true\n        } catch {\n            app.show(error, title: \"Không tạo được key\")\n            return false\n        }\n    }\n\n    // MARK: - Cài key\n\n    /// PROD cần xác nhận; còn lại cài ngay.\n    func requestInstall(key: SSHKeyInfo, host: HostProfile) {\n        guard !isBusy else {\n            app.showToast(\"Đang có một tác vụ khoá khác chạy\")\n            return\n        }\n        if host.environment == .prod {\n            confirmProdInstall = (key, host)\n        } else {\n            Task { await install(key: key, host: host) }\n        }\n    }\n\n    func install(key: SSHKeyInfo, host: HostProfile) async {\n        guard !isBusy, let service = app.service else { return }\n        do {\n            guard let alias = host.sshAlias else { throw ConnectionServiceError.missingAlias }\n            // Config có thể cũ so với hồ sơ: sinh lại trước khi ssh-copy-id đọc.\n            try await service.regenerateSSHConfig()\n            // Host đã cấu hình key khác: bước lọc của ssh-copy-id sẽ nhầm (đăng nhập được bằng key cũ).\n            let force = host.connectionMode == .managed && host.authMethod == .keyFile\n            let installer = try SSHKeyInstaller(\n                configPath: app.paths.sshConfigURL.path, publicKeyPath: key.publicKeyPath, alias: alias,\n                host: host, credentials: app.autofillCredentials, helper: ControllingTTYHelper.defaultURL(),\n                force: force)\n            let session = try await installer.start()\n            run(session, info: KeyTaskInfo(kind: .install(keyName: key.name, hostName: host.displayName))) {\n                [weak self] outcome in\n                guard let self, case .success = outcome else { return }\n                self.offerAdoption(host: host, key: key)\n            }\n        } catch {\n            app.show(error, title: \"Không cài được key\")\n        }\n    }\n\n    private func offerAdoption(host: HostProfile, key: SSHKeyInfo) {\n        guard key.hasPrivateKey else { return }\n        if host.connectionMode == .managed {\n            adoptionOffer = KeyAdoptionOffer(host: host, key: key)\n        } else {\n            app.showToast(\n                \"Máy chủ import từ SSH config: app không sửa, hãy tự thêm IdentityFile cho “\\(host.displayName)”.\")\n        }\n    }\n\n    func confirmAdoption(_ offer: KeyAdoptionOffer) async {\n        adoptionOffer = nil\n        guard let service = app.service, let path = offer.key.privateKeyPath else { return }\n        do {\n            try await service.useKey(hostID: offer.host.id, privateKeyPath: path)\n            await app.reload()\n            app.showToast(\"Đã đổi “\\(offer.host.displayName)” sang xác thực bằng key “\\(offer.key.name)”\")\n        } catch {\n            app.show(error, title: \"Không đổi được cách xác thực\")\n        }\n    }\n\n    // MARK: - Phiên tác vụ\n\n    func respond(text: String, isSecret: Bool) {\n        pendingPrompt = nil\n        guard let session else { return }\n        Task { await session.respond(text: text, isSecret: isSecret) }\n    }\n\n    func cancelTask() {\n        pendingPrompt = nil\n        guard let session else { return }\n        Task { await session.cancel() }\n    }\n\n    private func run(\n        _ session: KeyTaskSession, info: KeyTaskInfo,\n        onFinish: @escaping @MainActor (KeyTaskOutcome) async -> Void\n    ) {\n        self.session = session\n        task = info\n        pendingPrompt = nil\n        Task { [weak self] in\n            var result: KeyTaskOutcome = .cancelled\n            for await event in session.events {\n                switch event {\n                case .authPrompt(let kind): self?.pendingPrompt = kind\n                case .finished(let outcome): result = outcome\n                }\n            }\n            guard let self else { return }\n            self.session = nil\n            self.task = nil\n            self.pendingPrompt = nil\n            switch result {\n            case .success(let message): self.app.showToast(message)\n            case .failure(let reason):\n                self.app.alert = AppAlert(title: \"Tác vụ khoá thất bại\", message: reason)\n            case .cancelled: self.app.showToast(\"Đã huỷ tác vụ\")\n            }\n            await onFinish(result)\n        }\n    }\n\n    /// Thoát app: dừng tác vụ đang chạy.\n    func shutdown() async {\n        await session?.cancel()\n    }\n}\n"}, "Sources/SSHDesk/MonitorModel.swift": {"group": "Giao diện", "text": "import Foundation\nimport Observation\nimport SSHDeskCore\n\n/// Prompt xác thực đang chờ của một server khi Monitor mở phiên.\nstruct MonitorPendingPrompt {\n    let id = UUID()\n    let host: HostProfile\n    let kind: PromptKind\n    let respond: SessionConnector.Respond\n}\n\n/// Trạng thái màn Monitor (ADR-019). Vòng làm mới chỉ chạy khi màn đang hiện; quyết định nằm ở Core.\n@MainActor @Observable\nfinal class MonitorModel {\n    static let intervals = [5, 10, 30]\n\n    weak var app: AppModel?\n\n    private(set) var folder: String?\n    var expanded: Set<String> = []\n    var intervalSeconds = 5\n    /// Chu kỳ khi dùng nguồn metrics (15/30/60 giây, ADR-028).\n    var metricsIntervalSeconds = MetricsMonitorCoordinator.defaultInterval\n    /// Mọi nguồn số liệu đã cấu hình (nạp lại mỗi lần màn hiện).\n    private(set) var metricSourceList: [MetricsSource] = []\n    /// Nguồn của thư mục đang chọn; nil = đo qua SSH (mặc định).\n    private(set) var activeSource: MetricsSource?\n    private var metricsCoordinator: MetricsMonitorCoordinator?\n    private(set) var isRunning = false\n    private(set) var states: [UUID: MonitorHostState] = [:]\n    var prodConfirm: AnalystProdConfirm?\n    private(set) var pendingPrompts: [MonitorPendingPrompt] = []\n    private var coordinator: MonitorCoordinator?\n    private var token = UUID()\n\n    init(app: AppModel) { self.app = app }\n\n    var hosts: [HostProfile] {\n        guard let folder, let app else { return [] }\n        return HostPresentation.sortedByName(\n            HostPresentation.sshHosts(app.hosts).filter { $0.project == folder }, ascending: true)\n    }\n\n    /// Đang đọc từ Prometheus/Zabbix (không mở SSH).\n    var usesMetricsSource: Bool { activeSource != nil }\n\n    var intervalChoices: [Int] {\n        usesMetricsSource ? MetricsMonitorCoordinator.intervalChoices : Self.intervals\n    }\n\n    var currentInterval: Int { usesMetricsSource ? metricsIntervalSeconds : intervalSeconds }\n\n    /// Nạp danh sách nguồn + nguồn gán cho thư mục hiện tại (đọc DB nhỏ, đồng bộ).\n    func reloadSources() {\n        guard let repo = app?.metricSources?.repository else {\n            metricSourceList = []\n            activeSource = nil\n            return\n        }\n        metricSourceList = (try? repo.all()) ?? []\n        if let folder, let id = try? repo.assignedSourceID(folder: folder) {\n            activeSource = metricSourceList.first { $0.id == id }\n        } else {\n            activeSource = nil\n        }\n    }\n\n    /// Chọn nguồn cho thư mục (nil = SSH). Dừng vòng hiện tại rồi chạy lại với nguồn mới.\n    func setSource(_ id: UUID?) {\n        guard let folder, let repo = app?.metricSources?.repository else { return }\n        stop()\n        do { try repo.assign(folder: folder, sourceID: id) } catch {\n            app?.show(error, title: \"Không lưu được nguồn số liệu\")\n        }\n        states = [:]\n        reloadSources()\n        requestStart()\n    }\n\n    // MARK: - Chọn thư mục\n\n    func select(_ name: String) {\n        app?.sidebar = .monitor\n        guard folder != name else { return }\n        stop()\n        folder = name\n        expanded.insert(name)\n        states = [:]\n        reloadSources()\n        requestStart()\n    }\n\n    func foldersChanged() {\n        guard let f = folder, !(app?.folders.contains(f) ?? false),\n            !(app?.hosts.contains { $0.project == f } ?? false)\n        else { return }\n        stop()\n        folder = nil\n        states = [:]\n        if app?.sidebar == .monitor { enter() }\n    }\n\n    /// Màn hiện ra: chọn thư mục đầu tiên nếu chưa có, rồi bắt đầu theo dõi.\n    func enter() {\n        if folder == nil || !(app?.folders.contains(folder ?? \"\") ?? false) {\n            if let first = app?.folderCounts.first { select(first.name) }\n            return\n        }\n        reloadSources()\n        if !isRunning { requestStart() }\n    }\n\n    /// Màn ẩn đi: dừng và đóng phiên tự mở.\n    func leave() {\n        prodConfirm = nil\n        stop()\n    }\n\n    // MARK: - Điều khiển\n\n    /// PROD thì hỏi xác nhận trước khi chạy lệnh trên server.\n    func requestStart() {\n        guard !isRunning, !hosts.isEmpty else { return }\n        // Nguồn metrics không chạy lệnh nào trên server -> không cần xác nhận PROD (ADR-028).\n        if let source = activeSource {\n            startMetrics(source: source)\n            return\n        }\n        if hosts.contains(where: { $0.environment == .prod }) {\n            let prodNames = hosts.filter { $0.environment == .prod }.map(\\.displayName)\n            prodConfirm = AnalystProdConfirm(\n                message: MonitorProdGuard.message(hosts: hosts, intervalSeconds: intervalSeconds),\n                prodNames: prodNames)\n            return\n        }\n        start()\n    }\n\n    func confirmProd() {\n        prodConfirm = nil\n        start()\n    }\n\n    private func start() {\n        guard let app, !isRunning else { return }\n        let hosts = self.hosts\n        guard !hosts.isEmpty else { return }\n        let myToken = UUID()\n        token = myToken\n        states = [:]\n        isRunning = true\n        let vault = app.ephemeralVault\n        let connector = SessionConnector(\n            configPath: app.paths.sshConfigURL.path, credentials: app.autofillCredentials,\n            helper: ControllingTTYHelper.defaultURL(), hostAdjuster: { vault.adjusted($0) })\n        let provider = PooledMonitorSessions(pool: app.sessionPool, connector: connector) {\n            [weak self] host, kind, respond in\n            Task { @MainActor in\n                guard self?.token == myToken else { return }\n                self?.pendingPrompts.append(\n                    MonitorPendingPrompt(host: host, kind: kind, respond: respond))\n            }\n        }\n        let coord = MonitorCoordinator(\n            sessions: provider,\n            onUpdate: { [weak self] state in\n                Task { @MainActor in self?.apply(state, token: myToken) }\n            })\n        coordinator = coord\n        let seconds = TimeInterval(intervalSeconds)\n        Task {\n            do { try await app.service?.regenerateSSHConfig() } catch {\n                app.show(error, title: \"Không ghi được SSH config\")\n                if token == myToken { stop() }\n                return\n            }\n            guard token == myToken, isRunning else { return }\n            // ADR-029/019: máy chưa lưu mật khẩu -> hỏi TUẦN TỰ (không bật nhiều sheet); huỷ = bỏ qua máy đó.\n            let (runnable, skipped) = await app.preparePasswords(for: hosts, owner: Self.passwordOwner)\n            guard token == myToken, isRunning else {\n                app.ephemeralVault.releaseAll(owner: Self.passwordOwner)\n                return\n            }\n            for host in skipped {\n                states[host.id] = MonitorHostState(\n                    hostID: host.id, status: .failed(\"Bỏ qua — chưa nhập mật khẩu\"))\n            }\n            guard !runnable.isEmpty else {\n                stop()\n                return\n            }\n            await coord.start(hosts: runnable, interval: seconds)\n        }\n    }\n\n    private func startMetrics(source: MetricsSource) {\n        guard let app, !isRunning else { return }\n        let hosts = self.hosts\n        guard !hosts.isEmpty else { return }\n        let myToken = UUID()\n        token = myToken\n        states = [:]\n        isRunning = true\n        let provider = MetricsClientFactory.make(source: source, credentials: app.credentials)\n        let coord = MetricsMonitorCoordinator(\n            provider: provider,\n            onUpdate: { [weak self] state in\n                Task { @MainActor in self?.apply(state, token: myToken) }\n            })\n        metricsCoordinator = coord\n        let seconds = TimeInterval(metricsIntervalSeconds)\n        Task { await coord.start(hosts: hosts, interval: seconds) }\n    }\n\n    private func apply(_ state: MonitorHostState, token t: UUID) {\n        guard t == token else { return }\n        states[state.hostID] = state\n        if state.status != .connecting {\n            pendingPrompts.removeAll { $0.host.id == state.hostID }\n        }\n    }\n\n    /// Dừng vòng và đóng phiên Monitor tự mở. Trạng thái cuối vẫn hiển thị.\n    func stop() {\n        guard isRunning || coordinator != nil || metricsCoordinator != nil else { return }\n        isRunning = false\n        pendingPrompts = []\n        token = UUID()\n        let metrics = metricsCoordinator\n        metricsCoordinator = nil\n        Task { await metrics?.stop() }\n        let coord = coordinator\n        coordinator = nil\n        // Mật khẩu không tích lưu bỏ cùng phiên Monitor (ADR-029).\n        let vault = app?.ephemeralVault\n        Task {\n            await coord?.stop()\n            vault?.releaseAll(owner: Self.passwordOwner)\n        }\n    }\n\n    private static let passwordOwner = \"monitor\"\n\n    /// Chu kỳ mặc định từ Cài đặt (ADR-021); đang chạy thì áp dụng luôn.\n    func applyDefaultInterval(_ seconds: Int) { setInterval(seconds) }\n\n    func setInterval(_ seconds: Int) {\n        if usesMetricsSource {\n            guard MetricsMonitorCoordinator.intervalChoices.contains(seconds) else { return }\n            metricsIntervalSeconds = seconds\n            let metrics = metricsCoordinator\n            if isRunning { Task { await metrics?.setInterval(TimeInterval(seconds)) } }\n            return\n        }\n        guard Self.intervals.contains(seconds) else { return }\n        intervalSeconds = seconds\n        let coord = coordinator\n        if isRunning { Task { await coord?.setInterval(TimeInterval(seconds)) } }\n    }\n\n    func retry(_ hostID: UUID) {\n        let coord = coordinator\n        let metrics = metricsCoordinator\n        Task {\n            await coord?.retry(hostID: hostID)\n            await metrics?.retry(hostID: hostID)\n        }\n    }\n\n    /// Thoát app: dừng và đóng phiên (chờ xong).\n    func shutdown() async {\n        isRunning = false\n        pendingPrompts = []\n        token = UUID()\n        let coord = coordinator\n        coordinator = nil\n        let metrics = metricsCoordinator\n        metricsCoordinator = nil\n        await metrics?.stop()\n        await coord?.stop()\n        app?.ephemeralVault.releaseAll(owner: Self.passwordOwner)\n    }\n\n    // MARK: - Prompt xác thực\n\n    var activePrompt: ActivePrompt? {\n        guard let p = pendingPrompts.first else { return nil }\n        return ActivePrompt(\n            id: \"monitor-\" + p.id.uuidString, kind: p.kind,\n            context: \"\\(p.host.displayName) · \\(BrowserTabPresentation.identity(p.host)) (Monitor)\",\n            waiting: pendingPrompts.count - 1, cancelTitle: \"Dừng Monitor\",\n            send: { [weak self] text, secret in self?.answer(p, text: text, secret: secret) },\n            cancel: { [weak self] in self?.stop() })\n    }\n\n    private func answer(_ p: MonitorPendingPrompt, text: String, secret: Bool) {\n        pendingPrompts.removeAll { $0.id == p.id }\n        let respond = p.respond\n        Task { await respond(text, secret) }\n    }\n}\n"}, "Sources/SSHDesk/SSHDeskApp.swift": {"group": "Giao diện", "text": "import AppKit\nimport SSHDeskCore\nimport SwiftUI\n\n/// Đảm bảo app chạy như ứng dụng thường (Dock, focus) cả khi chạy từ `swift run`.\n@MainActor\nfinal class AppDelegate: NSObject, NSApplicationDelegate {\n    /// Nhận `sshdesk://` bằng Apple Event (chạy được cả khi app đang tắt: URL tới khi khởi động). ADR-025.\n    func applicationWillFinishLaunching(_ notification: Notification) {\n        registerURLHandler()\n    }\n\n    private func registerURLHandler() {\n        NSAppleEventManager.shared().setEventHandler(\n            self, andSelector: #selector(handleGetURL(_:withReplyEvent:)),\n            forEventClass: AEEventClass(kInternetEventClass), andEventID: AEEventID(kAEGetURL))\n    }\n\n    @objc func handleGetURL(_ event: NSAppleEventDescriptor, withReplyEvent reply: NSAppleEventDescriptor) {\n        guard let text = event.paramDescriptor(forKeyword: keyDirectObject)?.stringValue,\n            let url = URL(string: text)\n        else { return }\n        AppModel.shared.receive(url: url)\n    }\n\n    func applicationDidFinishLaunching(_ notification: Notification) {\n        // Đăng ký lại sau khi SwiftUI dựng xong để chắc handler của ta là handler cuối.\n        registerURLHandler()\n        NSApplication.shared.setActivationPolicy(.regular)\n        // Chạy bằng `swift run` thì không có AppIcon.icns; đặt icon Dock từ logo đóng gói trong resource.\n        if Bundle.main.bundleURL.pathExtension != \"app\", let logo = AppLogo.image {\n            NSApplication.shared.applicationIconImage = logo\n        }\n        NSApplication.shared.activate(ignoringOtherApps: true)\n    }\n\n    /// App được kích hoạt lại: kiểm tra file nguồn có đổi không (ADR-026). Không tự áp dụng.\n    func applicationDidBecomeActive(_ notification: Notification) {\n        let model = AppModel.shared\n        guard model.isReady else { return }\n        Task { await model.inventory.checkChanges() }\n    }\n\n    func applicationWillTerminate(_ notification: Notification) {\n        AppModel.shared.secretClipboard.clearNowIfOwned()\n    }\n\n    /// Chính sách đóng cửa sổ (ADR-021): \"Thoát app\" -> đóng cửa sổ cuối đi qua đường thoát có xác nhận;\n    /// \"Giữ chạy nền\" -> app sống tiếp, mở lại cửa sổ bằng Dock.\n    func applicationShouldTerminateAfterLastWindowClosed(_ sender: NSApplication) -> Bool {\n        WindowCloseDecision.quitsOnLastWindowClose(AppModel.shared.settings)\n    }\n\n    /// Bấm Dock khi không còn cửa sổ: để SwiftUI dựng lại cửa sổ chính (job nền vẫn chạy).\n    func applicationShouldHandleReopen(_ sender: NSApplication, hasVisibleWindows flag: Bool) -> Bool {\n        true\n    }\n\n    /// Thoát (⌘Q hoặc đóng cửa sổ cuối khi chính sách là Thoát), ADR-022:\n    /// còn job truyền/tunnel/Monitor/Analyst/tác vụ Keys -> hộp xác nhận liệt kê từng loại. Đồng ý -> huỷ job\n    /// (job chờ thành \"Bị gián đoạn\"), dừng tunnel, dừng Analyst/Monitor, đóng mọi master (`ssh -O exit`),\n    /// xoá clipboard password rồi thoát. Tab duyệt file rảnh đóng im lặng.\n    func applicationShouldTerminate(_ sender: NSApplication) -> NSApplication.TerminateReply {\n        let model = AppModel.shared\n        let activity = model.quitActivity\n        guard activity.needsConfirmation || model.hasOpenSessions else {\n            return .terminateNow\n        }\n        Task { @MainActor in\n            if activity.needsConfirmation {\n                let alert = NSAlert()\n                alert.messageText = QuitActivity.title\n                alert.informativeText = activity.message\n                alert.addButton(withTitle: QuitActivity.cancelButton)\n                alert.addButton(withTitle: QuitActivity.confirmButton)\n                if alert.runModal() == .alertFirstButtonReturn {\n                    sender.reply(toApplicationShouldTerminate: false)\n                    return\n                }\n            }\n            model.secretClipboard.clearNowIfOwned()\n            await model.shutdownTransfers(cancelRunning: true)\n            await model.keys.shutdown()\n            await model.closeAllSessions()\n            sender.reply(toApplicationShouldTerminate: true)\n        }\n        return .terminateLater\n    }\n}\n\n@main\nstruct SSHDeskApp: App {\n    @NSApplicationDelegateAdaptor(AppDelegate.self) private var appDelegate\n    @Local private var model = AppModel.shared\n\n    var body: some Scene {\n        WindowGroup(\"SSH Desk\") {\n            RootView(model: model)\n                .frame(minWidth: 1020, minHeight: 600)\n                .task { await model.start() }\n        }\n        .windowToolbarStyle(.unified(showsTitle: false))\n        .commands {\n            CommandGroup(after: .textEditing) {\n                Button(\"Tìm máy chủ\") { model.searchFocusTick += 1 }\n                    .keyboardShortcut(\"k\", modifiers: .command)\n                    .disabled(!model.isReady)\n                Button(\"Tìm máy chủ (⌘F)\") { model.searchFocusTick += 1 }\n                    .keyboardShortcut(\"f\", modifiers: .command)\n                    .disabled(!model.isReady)\n            }\n            CommandGroup(replacing: .newItem) {\n                Button(\"Thêm máy chủ…\") { model.form = .new }\n                    .keyboardShortcut(\"n\", modifiers: .command)\n                    .disabled(!model.isReady)\n                Button(\"Import từ SSH config…\") { model.showImport = true }\n                    .keyboardShortcut(\"i\", modifiers: [.command, .shift])\n                    .disabled(!model.isReady)\n                Divider()\n                Button(\"Xuất danh sách máy chủ…\") { model.exportHosts(.all) }\n                    .disabled(!model.isReady || model.hosts.isEmpty)\n                Button(\"Nhập danh sách máy chủ…\") { model.beginImportFile() }\n                    .disabled(!model.isReady)\n                Button(\"Nguồn máy chủ…\") { model.inventory.openHub() }\n                    .disabled(!model.isReady)\n            }\n            // Thao tác trên máy chủ đang chọn (ADR-022). Xoá dùng ⌘⌫ (không dùng ⌫ trần để khỏi tranh phím\n            // với ô nhập); trong bảng máy chủ phím ⌫ cũng hỏi xoá.\n            CommandMenu(\"Máy chủ\") {\n                Button(\"Mở (Warp / Windows App)\") { model.openSelected() }\n                    .keyboardShortcut(.return, modifiers: .command)\n                    .disabled(!model.hasSelectedHost)\n                Button(\"Sửa…\") { model.editSelected() }\n                    .keyboardShortcut(\"e\", modifiers: .command)\n                    .disabled(!model.hasSelectedHost)\n                Button(\"Nhân bản…\") { model.duplicateSelected() }\n                    .keyboardShortcut(\"d\", modifiers: .command)\n                    .disabled(!model.hasSelectedHost)\n                Divider()\n                Button(\"Xoá…\") { model.deleteSelected() }\n                    .keyboardShortcut(.delete, modifiers: .command)\n                    .disabled(!model.hasSelectedHost)\n            }\n            CommandGroup(after: .sidebar) {\n                ForEach(Array(AppModel.shortcutSections.enumerated()), id: \\.offset) { index, entry in\n                    Button(entry.title) { model.sidebar = entry.item }\n                        .keyboardShortcut(KeyEquivalent(Character(\"\\(index + 1)\")), modifiers: .command)\n                        .disabled(!model.isReady)\n                }\n            }\n        }\n\n        Settings {\n            SettingsWindowContent(model: model)\n        }\n    }\n}\n\n/// Nội dung cửa sổ Cài đặt (⌘,). Dữ liệu chưa sẵn sàng thì chờ.\nprivate struct SettingsWindowContent: View {\n    @Bindable var model: AppModel\n\n    var body: some View {\n        Group {\n            if model.isReady {\n                SettingsView(model: model)\n            } else {\n                ProgressView(\"Đang mở dữ liệu…\")\n            }\n        }\n        .frame(width: 680, height: 620)\n    }\n}\n\nextension AppModel {\n    var isReady: Bool {\n        if case .ready = phase { return true }\n        return false\n    }\n}\n"}, "Sources/SSHDesk/SettingsView.swift": {"group": "Giao diện", "text": "import AppKit\nimport SSHDeskCore\nimport SwiftUI\n\n/// Màn \"Cài đặt\" (ADR-021): dùng chung cho mục sidebar và cửa sổ Settings (⌘,). Giá trị đi qua\n/// `AppModel.updateSettings` (chuẩn hoá + lưu + áp dụng ngay); logic kẹp phạm vi nằm ở `AppSettings` (Core).\nstruct SettingsView: View {\n    @Bindable var model: AppModel\n\n    @FocusState private var configPathFocused: Bool\n    @Local private var configPathText = \"\"\n    @Local private var configPathError: String?\n    @Local private var agentCustomText = \"\"\n    @Local private var agentCustomMode = false\n    @Local private var agentError: String?\n    @FocusState private var agentFocused: Bool\n    @Local private var confirmClearPasswords = false\n    @Local private var savedPasswordCount = 0\n\n    private var s: AppSettings { model.settings }\n\n    var body: some View {\n        ScrollView {\n            VStack(alignment: .leading, spacing: 16) {\n                Text(\"Cài đặt\").font(.system(size: 22, weight: .bold))\n                general\n                warp\n                transfer\n                sshConfig\n                security\n                analyst\n                monitor\n                windows\n                data\n            }\n            .padding(24)\n            .frame(maxWidth: 760, alignment: .leading)\n            .frame(maxWidth: .infinity, alignment: .center)\n        }\n        .background(Theme.windowBackground)\n        .onAppear {\n            configPathText = s.userSSHConfigPath\n            agentCustomText = s.defaultIdentityAgent\n            agentCustomMode =\n                !s.defaultIdentityAgent.isEmpty\n                && IdentityAgentPreset.matching(s.defaultIdentityAgent) == .custom\n        }\n        .confirmationDialog(\n            \"Xoá mọi mật khẩu đã lưu?\", isPresented: $confirmClearPasswords, titleVisibility: .visible\n        ) {\n            Button(\"Xoá \\(savedPasswordCount) mật khẩu\", role: .destructive) {\n                Task { await model.clearAllPasswords() }\n            }\n            Button(\"Huỷ\", role: .cancel) {}\n        } message: {\n            Text(\n                \"Xoá \\(savedPasswordCount) mục (mật khẩu của máy, password và passphrase của các bộ đăng nhập, token/password của nguồn số liệu) khỏi Keychain. Bộ đăng nhập, việc gán bộ và hồ sơ máy chủ được giữ nguyên; lần sau đăng nhập sẽ phải nhập lại mật khẩu.\"\n            )\n        }\n    }\n\n    // MARK: - Nhóm\n\n    private var general: some View {\n        SettingsGroup(\"Chung\") {\n            SettingsRow(\"Thư mục local mặc định\", hint: \"Khung Local và hộp thoại tải về dùng thư mục này.\") {\n                Text(shortPath(s.resolvedLocalDirectory())).lineLimit(1).truncationMode(.middle)\n                    .foregroundStyle(Theme.textSecondary).frame(maxWidth: 220, alignment: .trailing)\n                Button(\"Chọn…\") { chooseLocalDirectory() }\n                Button(\"Mặc định\") { model.updateSettings { $0.defaultLocalDirectory = \"\" } }\n                    .disabled(s.defaultLocalDirectory.isEmpty)\n            }\n            SettingsRow(\"Khi đóng cửa sổ chính\") {\n                Picker(\"\", selection: bind(\\.closeBehavior)) {\n                    Text(\"Thoát app\").tag(AppSettings.CloseBehavior.quit)\n                    Text(\"Giữ chạy nền\").tag(AppSettings.CloseBehavior.keepRunning)\n                }\n                .labelsHidden().pickerStyle(.segmented).frame(width: 220)\n            }\n        }\n    }\n\n    private var warp: some View {\n        SettingsGroup(\"Warp\") {\n            SettingsRow(\"Mở máy chủ trong Warp bằng\") {\n                Picker(\"\", selection: bind(\\.warpOpenMode)) {\n                    Text(\"Tab mới\").tag(AppSettings.WarpOpenMode.tab)\n                    Text(\"Cửa sổ mới\").tag(AppSettings.WarpOpenMode.window)\n                }\n                .labelsHidden().pickerStyle(.segmented).frame(width: 220)\n            }\n        }\n    }\n\n    private var transfer: some View {\n        SettingsGroup(\"Truyền file\") {\n            SettingsRow(\"Số tác vụ chạy đồng thời\", hint: \"Tăng có hiệu lực ngay; giảm không ngắt tác vụ đang chạy.\") {\n                Picker(\"\", selection: bind(\\.transferConcurrency)) {\n                    ForEach(Array(AppSettings.transferConcurrencyRange), id: \\.self) { Text(\"\\($0)\").tag($0) }\n                }\n                .labelsHidden().frame(width: 80)\n            }\n            SettingsRow(\n                \"Giữ lịch sử truyền file\", hint: \"Áp dụng từ lần truyền kế tiếp; tác vụ đang chạy không bị xoá.\"\n            ) {\n                Picker(\"\", selection: bind(\\.transferHistoryLimit)) {\n                    ForEach(AppSettings.transferHistoryChoices, id: \\.self) {\n                        Text($0 == 0 ? \"Không giới hạn\" : \"\\($0) mục\").tag($0)\n                    }\n                }\n                .labelsHidden().frame(width: 150)\n            }\n        }\n    }\n\n    private var sshConfig: some View {\n        SettingsGroup(\"SSH config\") {\n            SettingsRow(\n                \"File config của bạn được Include\",\n                hint:\n                    \"Đường dẫn tuyệt đối tới file có sẵn. Lưu khi nhấn Return hoặc rời khỏi ô; đường dẫn sai thì giữ giá trị cũ. Đổi thì config của app được sinh lại; app không sửa file này.\"\n            ) {\n                TextField(\"~/.ssh/config\", text: $configPathText)\n                    .textFieldStyle(.roundedBorder).frame(width: 260)\n                    .focused($configPathFocused)\n                    .onSubmit { commitConfigPath() }\n                    .onChange(of: configPathFocused) { _, focused in\n                        if !focused { commitConfigPath() }\n                    }\n                Button(\"Chọn…\") { chooseConfigFile() }\n                Button(\"Mặc định\") {\n                    configPathText = \"\"\n                    commitConfigPath()\n                }\n            }\n            if let configPathError {\n                Text(configPathError).font(.caption).foregroundStyle(Theme.red)\n            }\n            Text(\n                model.effectiveUserConfigPath.map { \"Đang Include: \\($0)\" }\n                    ?? \"Hiện không Include file nào (file chưa tồn tại).\"\n            )\n            .font(.caption).foregroundStyle(Theme.textSecondary)\n            agentRow\n            SettingsRow(\"Config do app sinh (chỉ xem)\") {\n                Text(shortPath(model.paths.sshConfigURL.path)).lineLimit(1).truncationMode(.middle)\n                    .foregroundStyle(Theme.textSecondary).frame(maxWidth: 260, alignment: .trailing)\n                    .textSelection(.enabled)\n                Button(\"Mở trong Finder\") { model.revealSSHConfigFolder() }\n            }\n        }\n    }\n\n    /// Lựa chọn trong picker mặc định Agent: nil = không đặt; `.custom` = đang nhập đường dẫn.\n    private var agentSelection: Binding<IdentityAgentPreset?> {\n        Binding(\n            get: {\n                if agentCustomMode { return .custom }\n                let v = s.defaultIdentityAgent\n                return v.isEmpty ? nil : IdentityAgentPreset.matching(v)\n            },\n            set: { choice in\n                agentError = nil\n                switch choice {\n                case nil:\n                    agentCustomMode = false\n                    model.updateSettings { $0.defaultIdentityAgent = \"\" }\n                case .custom?:\n                    agentCustomMode = true\n                    agentCustomText =\n                        IdentityAgentPreset.matching(s.defaultIdentityAgent) == .custom ? s.defaultIdentityAgent : \"\"\n                    agentFocused = true\n                case let preset?:\n                    agentCustomMode = false\n                    model.updateSettings { $0.defaultIdentityAgent = preset.path ?? \"\" }\n                }\n            })\n    }\n\n    private var agentRow: some View {\n        VStack(alignment: .leading, spacing: 6) {\n            SettingsRow(\n                \"Agent mặc định (IdentityAgent)\",\n                hint:\n                    \"Áp cho mọi máy managed chưa chọn agent riêng. Không đặt = không ghi directive (dùng agent hệ thống). Đổi thì config của app được sinh lại.\"\n            ) {\n                Picker(\"\", selection: agentSelection) {\n                    Text(\"Không đặt (hệ thống)\").tag(IdentityAgentPreset?.none)\n                    ForEach(IdentityAgentPreset.allCases.filter { $0 != .system }, id: \\.self) {\n                        Text($0.title).tag(IdentityAgentPreset?.some($0))\n                    }\n                }\n                .labelsHidden().frame(width: 190)\n            }\n            if agentCustomMode {\n                TextField(\"~/.../agent.sock\", text: $agentCustomText)\n                    .textFieldStyle(.roundedBorder)\n                    .focused($agentFocused)\n                    .onSubmit { commitAgent() }\n                    .onChange(of: agentFocused) { _, focused in\n                        if !focused { commitAgent() }\n                    }\n                if agentError == nil\n                    && agentCustomText.trimmingCharacters(in: .whitespacesAndNewlines) != s.defaultIdentityAgent\n                {\n                    Text(\"Chưa lưu — nhập đường dẫn rồi nhấn Return hoặc rời khỏi ô.\")\n                        .font(.caption).foregroundStyle(Theme.amber)\n                }\n            }\n            if let agentError {\n                Text(agentError).font(.caption).foregroundStyle(Theme.red)\n            }\n            if !s.defaultIdentityAgent.isEmpty {\n                ForEach(IdentityAgentPath.warnings(for: s.defaultIdentityAgent), id: \\.self) { w in\n                    Text(w.message).font(.caption).foregroundStyle(Theme.amber)\n                }\n            }\n        }\n    }\n\n    /// Lưu đường dẫn tuỳ chỉnh khi Return; sai thì giữ giá trị cũ và báo lỗi.\n    private func commitAgent() {\n        let text = agentCustomText.trimmingCharacters(in: .whitespacesAndNewlines)\n        if text.isEmpty {\n            agentError = \"Chưa lưu — nhập đường dẫn socket của agent.\"\n            return\n        }\n        do {\n            try IdentityAgentPath.validate(text)\n            agentError = nil\n            model.updateSettings { $0.defaultIdentityAgent = text }\n        } catch {\n            agentError =\n                \"Đường dẫn phải bắt đầu bằng '/' hoặc '~/' (hoặc SSH_AUTH_SOCK), tối đa 1024 byte, không chứa '%', '$' hay ký tự điều khiển.\"\n        }\n    }\n\n    private var security: some View {\n        SettingsGroup(\"Bảo mật\") {\n            SettingsRow(\n                \"Tự điền mật khẩu đã lưu\",\n                hint:\n                    \"Tắt: Warp, truyền file, tunnel, Analyst, Monitor và Windows App đều không dùng mật khẩu đã lưu; ssh sẽ hỏi bạn. Áp dụng cho kết nối mở sau đó; tab Warp đã mở giữ cách cũ tới khi đóng.\"\n            ) {\n                Toggle(\"\", isOn: bind(\\.autofillEnabled)).labelsHidden().toggleStyle(.switch)\n            }\n            SettingsRow(\n                \"Hỏi mật khẩu khi máy chưa lưu\",\n                hint:\n                    \"Bật: máy dùng mật khẩu mà chưa lưu sẽ hiện hộp nhập mật khẩu (có thể kiểm tra đăng nhập rồi lưu). Chỉ có tác dụng khi “Tự điền mật khẩu đã lưu” bật.\"\n            ) {\n                Toggle(\"\", isOn: bind(\\.promptMissingPassword)).labelsHidden().toggleStyle(.switch)\n                    .disabled(!s.autofillEnabled)\n            }\n            SettingsRow(\"Tự xoá clipboard mật khẩu Windows sau\") {\n                Picker(\"\", selection: bind(\\.clipboardClearSeconds)) {\n                    ForEach(AppSettings.clipboardChoices, id: \\.self) { Text(\"\\($0) giây\").tag($0) }\n                }\n                .labelsHidden().frame(width: 110)\n            }\n            CredentialSetsSection(model: model)\n            SettingsRow(\"Mật khẩu đã lưu trong Keychain\") {\n
