ext < targets.count, !Task.isCancelled { launch() }\n            }\n        }\n    }\n\n    private func publish(_ state: MonitorHostState, generation gen: Int) {\n        guard gen == generation else { return }\n        states[state.hostID] = state\n        onUpdate(state)\n    }\n\n    private func setStatus(_ id: UUID, _ status: MonitorHostStatus, generation gen: Int) {\n        var s = states[id] ?? MonitorHostState(hostID: id, status: status)\n        s.status = status\n        publish(s, generation: gen)\n    }\n\n    private func refreshHost(_ host: HostProfile, generation gen: Int) async {\n        guard gen == generation else { return }\n        let executor: any MonitorCommandExecuting\n        if let existing = executors[host.id] {\n            executor = existing\n        } else {\n            setStatus(host.id, .connecting, generation: gen)\n            do {\n                executor = try await sessions.executor(for: host)\n            } catch is CancellationError {\n                return\n            } catch let e as SessionConnectError {\n                blocked.insert(host.id)\n                setStatus(host.id, .failed(Self.clean(e.message)), generation: gen)\n                return\n            } catch {\n                blocked.insert(host.id)\n                setStatus(host.id, .failed(Self.clean(String(describing: error))), generation: gen)\n                return\n            }\n            guard gen == generation else { return }\n            executors[host.id] = executor\n        }\n\n        let procResult: RemoteCommandResult\n        do {\n            procResult = try await executor.execute(.procFiles)\n        } catch RemoteCommandError.toolMissing {\n            blocked.insert(host.id)\n            setStatus(host.id, .unsupported, generation: gen)\n            return\n        } catch RemoteCommandError.sessionLost {\n            executors[host.id] = nil\n            setStatus(host.id, .failed(\"Mất phiên SSH\"), generation: gen)\n            return\n        } catch RemoteCommandError.connectionFailed(let m) {\n            setStatus(host.id, .failed(m.isEmpty ? \"Lỗi kênh SSH\" : Self.clean(m)), generation: gen)\n            return\n        } catch is CancellationError {\n            return\n        } catch {\n            setStatus(host.id, .failed(Self.clean(String(describing: error))), generation: gen)\n            return\n        }\n        if procResult.timedOut {\n            setStatus(host.id, .failed(\"Hết thời gian chờ\"), generation: gen)\n            return\n        }\n        if procResult.exitStatus != 0 {\n            if procResult.exitStatus == 127 || procResult.stderr.contains(\"No such file\") {\n                blocked.insert(host.id)\n                setStatus(host.id, .unsupported, generation: gen)\n            } else {\n                setStatus(host.id, .failed(\"Lệnh thoát với mã \\(procResult.exitStatus)\"), generation: gen)\n            }\n            return\n        }\n        let proc = MonitorParser.parseProc(procResult.stdout)\n        guard proc.cpu != nil || proc.memory != nil else {\n            blocked.insert(host.id)\n            setStatus(host.id, .unsupported, generation: gen)\n            return\n        }\n\n        // Số nhân và đĩa chỉ là phụ: lỗi thì bỏ qua phần đó.\n        var cores: Int?\n        if let r = try? await executor.execute(.cpuCount), r.exitStatus == 0, !r.timedOut {\n            cores = MonitorParser.parseCPUCount(r.stdout)\n        }\n        var disks: [DiskUsage] = []\n        if let r = try? await executor.execute(.diskUsage), r.exitStatus == 0, !r.timedOut {\n            disks = MonitorParser.parseDf(r.stdout)\n        }\n        guard gen == generation else { return }\n\n        let snapshot = MonitorSnapshot.make(\n            proc: proc, cores: cores, disks: disks, previousCPU: previousCPU[host.id], at: now())\n        if let cpu = proc.cpu { previousCPU[host.id] = cpu }\n        var state = states[host.id] ?? MonitorHostState(hostID: host.id, status: .ok)\n        state.status = .ok\n        state.snapshot = snapshot\n        if let p = snapshot.cpuPercent { state.cpuHistory.append(p) }\n        if let p = snapshot.memoryPercent { state.memoryHistory.append(p) }\n        publish(state, generation: gen)\n    }\n\n    /// Lý do lỗi: bỏ ký tự điều khiển, cắt 200 ký tự.\n    static func clean(_ s: String) -> String {\n        let scalars = s.unicodeScalars.filter { $0.value >= 0x20 && $0.value != 0x7F }\n        return String(String.UnicodeScalarView(scalars).prefix(200))\n    }\n}\n"}, "Sources/SSHDeskCore/Process/ControllingTTYHelper.swift": {"group": "Core · Process", "text": "import Foundation\n\n/// Tìm helper `sshdesk-ctty` (xem `PTYProcess`). Thứ tự:\n/// 1. cạnh executable chính (`.app/Contents/MacOS`, `swift run`, `.build/<config>`);\n/// 2. cạnh thư mục chứa test bundle (`swift test`: `.build/<triple>/debug/`);\n/// 3. `.build/{debug,release}` của package theo `#filePath` (chạy test từ xctest runner).\npublic enum ControllingTTYHelper {\n    public static let name = \"sshdesk-ctty\"\n\n    public static func defaultURL() -> URL? { HelperLocator.url(named: name) }\n}\n\n/// Tìm helper `sshdesk-askpass` (cùng quy tắc tìm như `sshdesk-ctty`).\npublic enum AskpassHelper {\n    public static let name = \"sshdesk-askpass\"\n    public static func defaultURL() -> URL? { HelperLocator.url(named: name) }\n}\n\nenum HelperLocator {\n    static func url(named name: String) -> URL? {\n        let filePath = #filePath\n        let fm = FileManager.default\n        var dirs: [URL] = []\n        if let exe = Bundle.main.executableURL { dirs.append(exe.deletingLastPathComponent()) }\n        for b in Bundle.allBundles {\n            dirs.append(b.bundleURL.deletingLastPathComponent())\n        }\n        // .../Sources/SSHDeskCore/Process/<file> -> gốc package\n        let root = URL(fileURLWithPath: filePath)\n            .deletingLastPathComponent().deletingLastPathComponent()\n            .deletingLastPathComponent().deletingLastPathComponent()\n        for config in [\"debug\", \"release\"] {\n            dirs.append(root.appendingPathComponent(\".build/\\(config)\"))\n        }\n        for d in dirs {\n            let url = d.appendingPathComponent(name)\n            if fm.isExecutableFile(atPath: url.path) { return url }\n        }\n        return nil\n    }\n}\n"}, "Sources/SSHDeskCore/Process/PTYProcess.swift": {"group": "Core · Process", "text": "import Darwin\nimport Foundation\n\n/// Chạy một executable (argv, không shell) trên PTY với slave là controlling terminal của con.\n///\n/// - `posix_spawn` + `POSIX_SPAWN_SETSID`: con là leader của session/process group mới (pgid == pid).\n///   Trên Darwin file action `addopen` chạy trước setsid nên slave KHÔNG thành controlling tty. Vì vậy\n///   ta spawn helper `sshdesk-ctty` (không phải shell): nó mở slave, `TIOCSCTTY`, dup2 lên 0/1/2 rồi\n///   `execv` chương trình đích. exec giữ pid => pid/pgid trả về vẫn là của chương trình đích.\n/// - ECHO tắt trên slave: thứ ta `send` không bị tty echo lại.\n/// - Một thread đọc riêng (poll) nên không chặn UI/actor; đọc cạn output cuối trước khi báo exit.\n/// - Password/passphrase chỉ đi qua `send`; không bao giờ vào argv/env.\npublic final class PTYProcess: @unchecked Sendable {\n    public let pid: pid_t\n    public let events: AsyncStream<ProcessEvent>\n\n    private let continuation: AsyncStream<ProcessEvent>.Continuation\n    private let lock = NSLock()\n    private var master: Int32\n    private var cancelled = false\n    private var reaped = false\n    private var secrets: [String] = []\n\n    /// Thời gian chờ SIGTERM trước khi SIGKILL cả process group.\n    public static let killGrace: TimeInterval = 3\n\n    private init(\n        pid: pid_t, master: Int32, events: AsyncStream<ProcessEvent>,\n        continuation: AsyncStream<ProcessEvent>.Continuation\n    ) {\n        self.pid = pid\n        self.master = master\n        self.events = events\n        self.continuation = continuation\n    }\n\n    /// `helper`: đường dẫn `sshdesk-ctty`; nil = tự tìm (`ControllingTTYHelper.defaultURL`).\n    /// `currentDirectory`: thư mục làm việc của con (nil = thừa kế).\n    public static func start(\n        executable: URL, arguments: [String], environment: [String: String],\n        helper: URL? = nil, currentDirectory: URL? = nil\n    ) throws -> PTYProcess {\n        let path = executable.path\n        guard FileManager.default.isExecutableFile(atPath: path) else {\n            throw PTYProcessError.spawnFailed(ENOENT)\n        }\n        guard let helperURL = helper ?? ControllingTTYHelper.defaultURL() else {\n            throw PTYProcessError.helperNotFound\n        }\n        let helperPath = helperURL.path\n        guard FileManager.default.isExecutableFile(atPath: helperPath) else {\n            throw PTYProcessError.helperNotFound\n        }\n        let argv = [path] + arguments\n        for s in argv where s.utf8.contains(0) { throw PTYProcessError.invalidArgument(\"NUL trong argv\") }\n        for (k, v) in environment {\n            if k.isEmpty || k.contains(\"=\") || k.utf8.contains(0) || v.utf8.contains(0) {\n                throw PTYProcessError.invalidArgument(\"environment không hợp lệ: \\(k)\")\n            }\n        }\n\n        var masterFD: Int32 = -1\n        var slaveFD: Int32 = -1\n        var nameBuf = [CChar](repeating: 0, count: 128)\n        var ws = winsize(ws_row: 24, ws_col: 120, ws_xpixel: 0, ws_ypixel: 0)\n        guard openpty(&masterFD, &slaveFD, &nameBuf, nil, &ws) == 0 else {\n            throw PTYProcessError.ptyFailed(errno)\n        }\n        _ = fcntl(masterFD, F_SETFD, FD_CLOEXEC)\n        _ = fcntl(slaveFD, F_SETFD, FD_CLOEXEC)\n        _ = fcntl(masterFD, F_SETFL, fcntl(masterFD, F_GETFL) | O_NONBLOCK)\n\n        // Tắt echo trước khi spawn.\n        var tio = termios()\n        if tcgetattr(slaveFD, &tio) == 0 {\n            tio.c_lflag &= ~tcflag_t(ECHO | ECHOE | ECHOK | ECHONL | ECHOCTL | ECHOKE)\n            _ = tcsetattr(slaveFD, TCSANOW, &tio)\n        }\n\n        var fa: posix_spawn_file_actions_t? = nil\n        var attr: posix_spawnattr_t? = nil\n        posix_spawn_file_actions_init(&fa)\n        posix_spawnattr_init(&attr)\n        defer {\n            posix_spawn_file_actions_destroy(&fa)\n            posix_spawnattr_destroy(&attr)\n        }\n        // Slave làm 0/1/2 cho helper; helper tự gán controlling tty. CLOEXEC_DEFAULT: con không\n        // thừa kế bất kỳ fd nào ngoài 0/1/2.\n        posix_spawn_file_actions_addopen(&fa, 0, nameBuf, O_RDWR, 0)\n        if let currentDirectory {\n            // Chạy sau addopen; helper và chương trình đích thừa kế cwd này.\n            let rc = posix_spawn_file_actions_addchdir_np(&fa, currentDirectory.path)\n            guard rc == 0 else {\n                close(masterFD)\n                close(slaveFD)\n                throw PTYProcessError.spawnFailed(rc)\n            }\n        }\n        posix_spawn_file_actions_adddup2(&fa, 0, 1)\n        posix_spawn_file_actions_adddup2(&fa, 0, 2)\n        var allSignals = sigset_t()\n        sigfillset(&allSignals)\n        var noSignals = sigset_t()\n        sigemptyset(&noSignals)\n        posix_spawnattr_setsigdefault(&attr, &allSignals)\n        posix_spawnattr_setsigmask(&attr, &noSignals)\n        let flags = Int32(\n            POSIX_SPAWN_SETSID | POSIX_SPAWN_CLOEXEC_DEFAULT | POSIX_SPAWN_SETSIGDEF | POSIX_SPAWN_SETSIGMASK)\n        posix_spawnattr_setflags(&attr, Int16(flags))\n\n        // helper argv: [helper, ttyPath, executable, args...]\n        let ttyPath = String(cString: nameBuf)\n        let helperArgv = [helperPath, ttyPath] + argv\n        let cArgv: [UnsafeMutablePointer<CChar>?] = helperArgv.map { strdup($0) } + [nil]\n        let cEnv: [UnsafeMutablePointer<CChar>?] = environment.map { strdup(\"\\($0.key)=\\($0.value)\") } + [nil]\n        defer {\n            for p in cArgv { free(p) }\n            for p in cEnv { free(p) }\n        }\n\n        var childPID: pid_t = 0\n        let rc = posix_spawn(&childPID, helperPath, &fa, &attr, cArgv, cEnv)\n        close(slaveFD)  // con đã có bản riêng; cha không giữ slave.\n        guard rc == 0 else {\n            close(masterFD)\n            throw PTYProcessError.spawnFailed(rc)\n        }\n\n        let (stream, cont) = AsyncStream<ProcessEvent>.makeStream(bufferingPolicy: .unbounded)\n        let fdForThread = masterFD\n        let proc = PTYProcess(pid: childPID, master: fdForThread, events: stream, continuation: cont)\n        let thread = Thread { proc.readLoop(fd: fdForThread) }\n        thread.name = \"PTYProcess.read.\\(childPID)\"\n        thread.start()\n        return proc\n    }\n\n    /// Ghi `input` + \"\\n\" vào master. `redact`: che chuỗi này nếu con in lại trong output\n    /// (đặt false cho phản hồi không bí mật như \"yes\").\n    public func send(_ input: String, redact: Bool = true) {\n        lock.lock()\n        defer { lock.unlock() }\n        guard master >= 0 else { return }\n        if redact, !input.isEmpty { secrets.append(input) }\n        let bytes = Array((input + \"\\n\").utf8)\n        var offset = 0\n        var stalls = 0\n        while offset < bytes.count, stalls < 50 {\n            let n = bytes[offset...].withUnsafeBytes { write(master, $0.baseAddress, $0.count) }\n            if n > 0 {\n                offset += n\n                stalls = 0\n            } else if n < 0, errno == EAGAIN || errno == EINTR {\n                stalls += 1\n                var p = pollfd(fd: master, events: Int16(POLLOUT), revents: 0)\n                _ = poll(&p, 1, 100)\n            } else {\n                return\n            }\n        }\n    }\n\n    /// SIGTERM tới process group của job; sau `killGrace` giây chưa xong thì SIGKILL group.\n    /// Chỉ nhắm đúng `-pgid` của job này.\n    public func cancel() {\n        lock.lock()\n        defer { lock.unlock() }\n        guard !reaped, !cancelled else { return }\n        cancelled = true\n        kill(-pid, SIGTERM)\n        let pgid = pid\n        DispatchQueue.global().asyncAfter(deadline: .now() + Self.killGrace) { [self] in\n            lock.lock()\n            defer { lock.unlock() }\n            // `reaped` chặn việc bắn vào một pgid đã được hệ thống tái sử dụng.\n            if !reaped { kill(-pgid, SIGKILL) }\n        }\n    }\n\n    // MARK: - Đọc\n\n    private func readLoop(fd: Int32) {\n        var sanitizer = OutputSanitizer()\n        var buffer = [UInt8](repeating: 0, count: 8192)\n        var status: Int32 = 0\n        var exited = false\n        var eof = false\n\n        func emit(_ text: String) {\n            guard !text.isEmpty else { return }\n            let redacted = redact(text)\n            if !redacted.isEmpty { continuation.yield(.output(redacted)) }\n        }\n\n        while true {\n            var p = pollfd(fd: fd, events: Int16(POLLIN), revents: 0)\n            // Đã thoát: chỉ đọc nốt phần còn trong buffer của pty (không chờ).\n            // Sau EOF không poll nữa (POLLHUP sẽ trả về ngay mãi mãi).\n            let r = eof ? 0 : poll(&p, 1, exited ? 0 : 50)\n            if r > 0, p.revents & Int16(POLLIN | POLLHUP | POLLERR) != 0 {\n                let n = buffer.withUnsafeMutableBytes { read(fd, $0.baseAddress, $0.count) }\n                if n > 0 {\n                    emit(sanitizer.feed(Array(buffer[0..<n])))\n                    continue\n                }\n                if n < 0, errno == EAGAIN || errno == EINTR { continue }\n                eof = true  // 0 hoặc EIO: slave đã đóng hết.\n                continue\n            }\n            if r < 0, errno == EINTR { continue }\n            // Không còn dữ liệu sẵn sàng.\n            if exited { break }\n            var st: Int32 = 0\n            let w = waitpid(pid, &st, WNOHANG)\n            if w == pid {\n                status = st\n                exited = true\n                lock.lock()\n                reaped = true\n                // Quét nốt thành viên còn sót của group (chỉ khi do cancel); pid vừa reap nên chưa tái sử dụng.\n                if cancelled { kill(-pid, SIGKILL) }\n                lock.unlock()\n            } else if w < 0, errno != EINTR {\n                exited = true  // mất dấu con (không nên xảy ra)\n                lock.lock()\n                reaped = true\n                lock.unlock()\n            } else if eof {\n                usleep(20_000)\n            }\n        }\n\n        emit(sanitizer.finish())\n        lock.lock()\n        close(master)\n        master = -1\n        let wasCancelled = cancelled\n        secrets.removeAll()\n        lock.unlock()\n\n        let exit: ProcessExit\n        if wasCancelled {\n            exit = .cancelled\n        } else if status & 0x7F == 0 {\n            exit = .exited((status >> 8) & 0xFF)\n        } else {\n            exit = .signaled(status & 0x7F)\n        }\n        continuation.yield(.exit(exit))\n        continuation.finish()\n    }\n\n    private func redact(_ text: String) -> String {\n        lock.lock()\n        let list = secrets.sorted { $0.count > $1.count }\n        lock.unlock()\n        var result = text\n        for s in list where result.contains(s) {\n            result = result.replacingOccurrences(of: s, with: \"•••\")\n        }\n        return result\n    }\n}\n"}, "Sources/SSHDeskCore/Process/PromptDetector.swift": {"group": "Core · Process", "text": "import Foundation\n\npublic enum PromptKind: Sendable, Equatable {\n    case password(String)\n    case passphrase(String)\n    case keyboardInteractive(String)\n    case hostKeyConfirm(fingerprint: String?, text: String)\n    /// Lỗi dừng, KHÔNG phải prompt: không được cho người dùng \"tiếp tục\".\n    case hostKeyChanged(String)\n    /// Dòng cuối chưa kết thúc, trông như prompt (kết thúc bằng `:`/`?`) nhưng không nhận ra loại.\n    /// UI hiển thị text đã làm sạch (fallback), không tự điền credential.\n    case unknown(String)\n}\n\n/// Nhận chunk output (đã bỏ ANSI và `\\r`), giữ bộ đệm cuối, phát hiện prompt xác thực của OpenSSH.\n/// Pure: không I/O. Mỗi prompt chỉ được báo một lần (bộ đệm được xóa sau khi báo).\npublic struct PromptDetector: Sendable {\n    public static let maxPromptLength = 300\n    private static let maxBuffer = 4000\n\n    private var buffer = \"\"\n\n    public init() {}\n\n    public mutating func feed(_ chunk: String) -> PromptKind? {\n        // Phòng thủ: dù đầu vào được nói là đã sạch, vẫn bỏ escape/ký tự điều khiển.\n        buffer += OutputSanitizer.clean(chunk.replacingOccurrences(of: \"\\r\", with: \"\"))\n        // Dòng quá dài (độc hại) bị rút gọn nhưng giữ đầu và đuôi để vẫn nhận ra prompt.\n        buffer = buffer.split(separator: \"\\n\", omittingEmptySubsequences: false).map { line in\n            line.count > 1000 ? String(line.prefix(500)) + \"…\" + String(line.suffix(400)) : String(line)\n        }.joined(separator: \"\\n\")\n        if buffer.count > Self.maxBuffer { buffer = String(buffer.suffix(Self.maxBuffer)) }\n\n        if let range = buffer.range(of: \"REMOTE HOST IDENTIFICATION HAS CHANGED\") {\n            let line = Self.lineContaining(range, in: buffer)\n            buffer = \"\"\n            return .hostKeyChanged(Self.clip(line))\n        }\n\n        // Prompt chỉ có thể nằm ở dòng cuối chưa kết thúc bằng newline.\n        guard !buffer.hasSuffix(\"\\n\") else { return nil }\n        let lines = buffer.split(separator: \"\\n\", omittingEmptySubsequences: false).map(String.init)\n        guard let lastRaw = lines.last else { return nil }\n        let last = lastRaw.trimmingCharacters(in: .whitespaces)\n        guard !last.isEmpty else { return nil }\n        let lower = last.lowercased()\n\n        // `enter passphrase for <key>:` (ssh) và `Enter passphrase (empty for no passphrase):` /\n        // `Enter same passphrase again:` (ssh-keygen khi tạo key).\n        if lower.hasPrefix(\"enter passphrase\") || lower.hasPrefix(\"enter same passphrase\"),\n            last.hasSuffix(\":\")\n        {\n            buffer = \"\"\n            return .passphrase(Self.clip(last))\n        }\n        if lower.contains(\"are you sure you want to continue connecting\"), last.hasSuffix(\"?\") {\n            let fingerprint = Self.extractFingerprint(lines.dropLast())\n            let text = Self.hostKeyText(lines)\n            buffer = \"\"\n            return .hostKeyConfirm(fingerprint: fingerprint, text: text)\n        }\n        guard last.hasSuffix(\":\") else { return nil }\n        if lower.hasSuffix(\"password:\") || lower.hasPrefix(\"password for\")\n            || lower.contains(\"]'s password:\") || lower.contains(\"'s password:\")\n        {\n            buffer = \"\"\n            return .password(Self.clip(last))\n        }\n        if lower.range(of: #\"verification code|otp|token|code\"#, options: .regularExpression) != nil {\n            buffer = \"\"\n            return .keyboardInteractive(Self.clip(last))\n        }\n        buffer = \"\"\n        return .unknown(Self.clip(last))\n    }\n\n    public mutating func reset() { buffer = \"\" }\n\n    // MARK: - Helpers\n\n    /// Cắt tối đa 300 ký tự (giữ phần đầu), bỏ ký tự điều khiển.\n    static func clip(_ s: String) -> String {\n        let cleaned = OutputSanitizer.clean(s).unicodeScalars.filter { $0.value >= 0x20 && $0.value != 0x7F }\n        let text = String(String.UnicodeScalarView(cleaned)).trimmingCharacters(in: .whitespaces)\n        return String(text.prefix(maxPromptLength))\n    }\n\n    private static func lineContaining(_ range: Range<String.Index>, in s: String) -> String {\n        let start = s[..<range.lowerBound].lastIndex(of: \"\\n\").map { s.index(after: $0) } ?? s.startIndex\n        let end = s[range.upperBound...].firstIndex(of: \"\\n\") ?? s.endIndex\n        return String(s[start..<end])\n    }\n\n    private static func extractFingerprint<S: Sequence>(_ lines: S) -> String? where S.Element == String {\n        var found: String?\n        for line in lines {\n            if let r = line.range(of: #\"(SHA256|MD5):[A-Za-z0-9+/=:]+\"#, options: .regularExpression) {\n                found = String(line[r])\n            }\n        }\n        return found\n    }\n\n    /// Khối thông tin host key + câu hỏi; giữ phần cuối nếu dài quá để câu hỏi không bị cắt mất.\n    private static func hostKeyText(_ lines: [String]) -> String {\n        var start = 0\n        if let i = lines.lastIndex(where: { $0.contains(\"authenticity of host\") }) { start = i }\n        let block = lines[start...].joined(separator: \"\\n\")\n        let cleaned = clipKeepingTail(block)\n        return cleaned\n    }\n\n    private static func clipKeepingTail(_ s: String) -> String {\n        let scalars = OutputSanitizer.clean(s).unicodeScalars.filter {\n            $0.value == 0x0A || ($0.value >= 0x20 && $0.value != 0x7F)\n        }\n        let text = String(String.UnicodeScalarView(scalars)).trimmingCharacters(in: .whitespacesAndNewlines)\n        return text.count <= maxPromptLength ? text : \"…\" + String(text.suffix(maxPromptLength - 1))\n    }\n}\n"}, "Sources/SSHDeskCore/Remote/SessionConnector.swift": {"group": "Core · Remote", "text": "import Foundation\n\npublic enum SessionConnectError: Error, Equatable, Sendable {\n    case noAlias\n    case failed(String)\n\n    public var message: String {\n        switch self {\n        case .noAlias: return \"hồ sơ thiếu alias SSH\"\n        case .failed(let m): return m\n        }\n    }\n}\n\n/// Mở một `RemoteSession` tới host: tự điền password đã lưu theo `PasswordAutofillPolicy`, prompt còn lại\n/// chuyển cho `onPrompt` (UI). Không lưu/log nội dung người dùng nhập.\npublic struct SessionConnector: Sendable {\n    public typealias Respond = @Sendable (String, Bool) async -> Void\n    public typealias PromptHandler = @Sendable (PromptKind, @escaping Respond) -> Void\n\n    private let configPath: String\n    private let credentials: any CredentialStore\n    private let helper: URL?\n    private let socketDirectory: @Sendable () throws -> SocketDirectory\n    private let sshPath: String\n    private let hostAdjuster: (@Sendable (HostProfile) -> HostProfile)?\n\n    /// `hostAdjuster`: đổi bản sao host dùng để kết nối (vd gắn mật khẩu tạm trong bộ nhớ, ADR-029).\n    public init(\n        configPath: String, credentials: any CredentialStore, helper: URL?,\n        sshPath: String = \"/usr/bin/ssh\",\n        socketDirectory: @escaping @Sendable () throws -> SocketDirectory = { try SocketDirectory.ensure() },\n        hostAdjuster: (@Sendable (HostProfile) -> HostProfile)? = nil\n    ) {\n        self.hostAdjuster = hostAdjuster\n        self.configPath = configPath\n        self.credentials = credentials\n        self.helper = helper\n        self.sshPath = sshPath\n        self.socketDirectory = socketDirectory\n    }\n\n    /// Trả phiên đã `connected`. Huỷ task → đóng phiên và ném `CancellationError`.\n    public func connect(host original: HostProfile, onPrompt: @escaping PromptHandler) async throws\n        -> RemoteSession\n    {\n        let host = hostAdjuster?(original) ?? original\n        guard let alias = host.sshAlias else { throw SessionConnectError.noAlias }\n        let dir: SocketDirectory\n        do { dir = try socketDirectory() } catch {\n            throw SessionConnectError.failed(\"không tạo được thư mục socket (\\(error))\")\n        }\n        let session = RemoteSession(\n            alias: alias, configPath: configPath, hostID: host.id, socketDirectory: dir,\n            sshPath: sshPath, helper: helper)\n        let events = session.events\n        do { try await session.start() } catch let e as RemoteSessionError {\n            // Không close(): phiên chưa chạy master, close() sẽ xoá socket của master khác.\n            switch e {\n            case .socketInUse:\n                throw SessionConnectError.failed(\"đã có phiên SSH khác đang dùng kết nối của máy này\")\n            default: throw SessionConnectError.failed(\"không khởi chạy được ssh (\\(e))\")\n            }\n        }\n        let store = credentials\n        return try await withTaskCancellationHandler {\n            var filled = false\n            for await event in events {\n                switch event {\n                case .connected:\n                    return session\n                case .disconnected(let reason):\n                    throw SessionConnectError.failed(reason)\n                case .authPrompt(let kind):\n                    if PasswordAutofillPolicy.shouldAutofill(\n                        prompt: kind, host: host, alreadyFilled: filled),\n                        let ref = host.autofillCredentialReference\n                    {\n                        filled = true\n                        let password = await Task.detached { store.read(ref: ref) }.value\n                        if let password, !password.isEmpty {\n                            await session.respond(text: password, isSecret: true)\n                            continue\n                        }\n                    }\n                    onPrompt(kind) { text, secret in\n                        await session.respond(text: text, isSecret: secret)\n                    }\n                }\n            }\n            if Task.isCancelled { throw CancellationError() }\n            throw SessionConnectError.failed(\"phiên SSH kết thúc bất ngờ\")\n        } onCancel: {\n            Task { await session.close() }\n        }\n    }\n}\n"}, "Sources/SSHDeskCore/Remote/SftpBatch.swift": {"group": "Core · Remote", "text": "import Foundation\n\npublic enum SftpBatchError: Error, Equatable {\n    /// Đường dẫn/tên chứa ký tự điều khiển (U+0000–U+001F, U+007F).\n    case controlCharacter(String)\n    case emptyPath\n}\n\n/// Dựng script batch cho `sftp -b -`. Pure.\npublic enum SftpBatch {\n    /// `\"` + escape `\\`→`\\\\`, `\"`→`\\\"` + `\"`. Từ chối ký tự điều khiển.\n    public static func quote(_ path: String) throws -> String {\n        guard !path.isEmpty else { throw SftpBatchError.emptyPath }\n        for u in path.unicodeScalars where u.value < 0x20 || u.value == 0x7F {\n            throw SftpBatchError.controlCharacter(path)\n        }\n        var out = \"\\\"\"\n        for ch in path.unicodeScalars {\n            if ch == \"\\\\\" || ch == \"\\\"\" { out.unicodeScalars.append(\"\\\\\") }\n            out.unicodeScalars.append(ch)\n        }\n        return out + \"\\\"\"\n    }\n\n    public static func list(_ dir: String) throws -> String { \"cd \\(try quote(dir))\\nls -la\\n\" }\n    public static func mkdir(_ dir: String) throws -> String { \"mkdir \\(try quote(dir))\\n\" }\n    public static func rename(_ from: String, _ to: String) throws -> String {\n        \"rename \\(try quote(from)) \\(try quote(to))\\n\"\n    }\n    public static func rm(_ file: String) throws -> String { \"rm \\(try quote(file))\\n\" }\n    public static func rmdir(_ dir: String) throws -> String { \"rmdir \\(try quote(dir))\\n\" }\n    public static var pwd: String { \"pwd\\n\" }\n}\n"}, "Sources/SSHDeskCore/Remote/SocketDirectory.swift": {"group": "Core · Remote", "text": "import Darwin\nimport Foundation\n\n/// Thư mục chứa socket ControlMaster: `/tmp/sshdesk-<uid>` (ADR-013).\n/// Không dùng `$TMPDIR`/Application Support vì `sun_path` giới hạn ~104 byte.\npublic struct SocketDirectory: Sendable, Equatable {\n    public enum Failure: Error, Equatable {\n        case createFailed(path: String, errno: Int32)\n        case notDirectory(String)\n        case wrongOwner(path: String, owner: UInt32, expected: UInt32)\n        case wrongMode(path: String, mode: UInt16)\n        case pathTooLong(path: String, bytes: Int)\n    }\n\n    /// Độ dài tối đa của thư mục (byte): + \"/\" + 32 hex + hậu tố tạm của ssh (17) phải < 104.\n    public static let maxDirectoryBytes = 42\n\n    public let path: String\n\n    /// `base` chỉ để test; mặc định `/tmp`.\n    public static func ensure(base: String = \"/tmp\", uid: uid_t = getuid()) throws -> SocketDirectory {\n        let path = base + \"/sshdesk-\\(uid)\"\n        let bytes = path.utf8.count\n        guard bytes <= maxDirectoryBytes else { throw Failure.pathTooLong(path: path, bytes: bytes) }\n\n        if mkdir(path, 0o700) != 0 {\n            guard errno == EEXIST else { throw Failure.createFailed(path: path, errno: errno) }\n        }\n        // lstat: không đi theo symlink.\n        var st = stat()\n        guard lstat(path, &st) == 0 else { throw Failure.createFailed(path: path, errno: errno) }\n        guard (st.st_mode & S_IFMT) == S_IFDIR else { throw Failure.notDirectory(path) }\n        guard st.st_uid == uid else {\n            throw Failure.wrongOwner(path: path, owner: UInt32(st.st_uid), expected: UInt32(uid))\n        }\n        let perm = UInt16(st.st_mode & 0o7777)\n        guard perm == 0o700 else { throw Failure.wrongMode(path: path, mode: perm) }\n        return SocketDirectory(path: path)\n    }\n\n    /// `<dir>/<32 hex của hostID>`; không dùng `%C` nên app biết chính xác đường dẫn socket.\n    public func socketPath(hostID: UUID) -> String {\n        path + \"/\" + hostID.uuidString.replacingOccurrences(of: \"-\", with: \"\").lowercased()\n    }\n}\n"}, "Sources/SSHDeskCore/SSHConfig/SSHConfigWriter.swift": {"group": "Core · SSHConfig", "text": "import Darwin\nimport Foundation\n\n/// Một host do app quản lý, sẽ được sinh thành khối `Host <alias>` trong file SSH config của app.\npublic struct SSHHostSpec: Sendable, Equatable {\n    public var alias: String\n    public var hostName: String\n    public var port: Int\n    public var user: String\n    /// Đường dẫn tuyệt đối (caller phải tự mở rộng `~`).\n    public var identityFile: String?\n    /// Giá trị `IdentityAgent` hiệu lực (đã chọn host > mặc định); nil = không ghi directive. Validate khi sinh.\n    public var identityAgent: String?\n    /// Alias bastion do app sinh hoặc alias có sẵn trong config của người dùng.\n    public var jumpAlias: String?\n    /// identityFile là khoá Secure Enclave (ADR-027): ghi `SecurityKeyProvider` trong Host block này.\n    public var usesSecureEnclaveProvider: Bool\n\n    public init(\n        alias: String, hostName: String, port: Int = 22, user: String,\n        identityFile: String? = nil, jumpAlias: String? = nil, identityAgent: String? = nil,\n        usesSecureEnclaveProvider: Bool = false\n    ) {\n        self.usesSecureEnclaveProvider = usesSecureEnclaveProvider\n        self.alias = alias\n        self.hostName = hostName\n        self.port = port\n        self.user = user\n        self.identityFile = identityFile\n        self.identityAgent = identityAgent\n        self.jumpAlias = jumpAlias\n    }\n}\n\npublic enum SSHConfigError: Error, Equatable {\n    case invalidAlias(String)\n    case invalidHostName(String)\n    case invalidPort(Int)\n    case invalidUser(String)\n    /// Giá trị chứa newline, CR, NUL hoặc ký tự điều khiển. `field` là tên trường.\n    case controlCharacter(field: String)\n    /// Đường dẫn không tuyệt đối (gồm cả dạng `~`).\n    case pathNotAbsolute(field: String)\n    /// Đường dẫn chứa `%` (ssh diễn giải token), bị từ chối.\n    case unsupportedPathCharacter(field: String)\n    case duplicateAlias(String)\n    case selfJump(String)\n    case jumpCycle([String])\n    case invalidIdentityAgent(IdentityAgentError)\n}\n\n/// Sinh file SSH config do app sở hữu (ADR-006). Thuần logic: không chạy ssh, không mạng.\npublic enum SSHConfigWriter {\n    /// Đường dẫn cố định của provider SK của macOS (ADR-027); không nhận từ input người dùng.\n    public static let secureEnclaveProvider = \"/usr/lib/ssh-keychain.dylib\"\n    public static let header = \"# Do SSH Desk sinh — không sửa tay\"\n\n    public static func render(hosts: [SSHHostSpec], userConfigPath: String?) throws -> String {\n        var seen = Set<String>()\n        for host in hosts {\n            try validate(host)\n            guard seen.insert(host.alias).inserted else {\n                throw SSHConfigError.duplicateAlias(host.alias)\n            }\n        }\n        if let userConfigPath {\n            try validatePath(userConfigPath, field: \"userConfigPath\")\n        }\n        try checkJumpCycles(hosts)\n\n        var lines = [header]\n        for host in hosts {\n            lines.append(\"Host \\(host.alias)\")\n            lines.append(\"    HostName \\(quote(host.hostName))\")\n            lines.append(\"    Port \\(host.port)\")\n            lines.append(\"    User \\(quote(host.user))\")\n            if let identityFile = host.identityFile {\n                lines.append(\"    IdentityFile \\(quote(identityFile))\")\n                lines.append(\"    IdentitiesOnly yes\")\n                if host.usesSecureEnclaveProvider {\n                    lines.append(\"    SecurityKeyProvider \\(quote(secureEnclaveProvider))\")\n                }\n            }\n            if let agent = host.identityAgent {\n                lines.append(\"    IdentityAgent \\(quote(agent))\")\n            }\n            if let jump = host.jumpAlias {\n                lines.append(\"    ProxyJump \\(jump)\")\n            }\n        }\n        if let userConfigPath {\n            lines.append(\"Match all\")\n            lines.append(\"Include \\(quote(userConfigPath))\")\n        }\n        return lines.joined(separator: \"\\n\") + \"\\n\"\n    }\n\n    /// Ghi atomically, file 0600; tạo thư mục cha 0700 nếu thiếu.\n    public static func write(\n        to url: URL, hosts: [SSHHostSpec], userConfigPath: String?\n    ) throws {\n        let content = try render(hosts: hosts, userConfigPath: userConfigPath)\n        let fm = FileManager.default\n        let dir = url.deletingLastPathComponent()\n        if !fm.fileExists(atPath: dir.path) {\n            try fm.createDirectory(\n                at: dir, withIntermediateDirectories: true,\n                attributes: [.posixPermissions: 0o700])\n        }\n        // Ghi ra file tạm 0600 cùng thư mục rồi rename: không có thời điểm nào file lộ quyền rộng.\n        let tmp = dir.appendingPathComponent(\".sshdesk-config-\\(UUID().uuidString).tmp\")\n        guard\n            fm.createFile(\n                atPath: tmp.path, contents: Data(content.utf8),\n                attributes: [.posixPermissions: 0o600])\n        else {\n            throw CocoaError(.fileWriteUnknown)\n        }\n        do {\n            _ = try fm.replaceItemAt(url, withItemAt: tmp)\n            try fm.setAttributes([.posixPermissions: 0o600], ofItemAtPath: url.path)\n        } catch {\n            try? fm.removeItem(at: tmp)\n            throw error\n        }\n    }\n\n    /// argv (không gồm executable) để chạy `/usr/bin/ssh`. Không nối chuỗi shell.\n    public static func sshInvocation(configPath: String, alias: String) throws -> [String] {\n        try validatePath(configPath, field: \"configPath\")\n        try validateAlias(alias)\n        return [\"-F\", configPath, alias]\n    }\n\n    // MARK: - Validation\n\n    static func validate(_ host: SSHHostSpec) throws {\n        try validateAlias(host.alias)\n        try validateHostName(host.hostName)\n        guard (1...65535).contains(host.port) else { throw SSHConfigError.invalidPort(host.port) }\n        try rejectControl(host.user, field: \"user\")\n        guard matches(host.user, #\"^[A-Za-z0-9._][A-Za-z0-9._-]*$\"#) else {\n            throw SSHConfigError.invalidUser(host.user)\n        }\n        if let identityFile = host.identityFile {\n            try validatePath(identityFile, field: \"identityFile\")\n        }\n        if let agent = host.identityAgent {\n            do { try IdentityAgentPath.validate(agent) } catch let e as IdentityAgentError {\n                throw SSHConfigError.invalidIdentityAgent(e)\n            }\n        }\n        if let jump = host.jumpAlias {\n            try validateAlias(jump, field: \"jumpAlias\")\n            if jump == host.alias { throw SSHConfigError.selfJump(jump) }\n        }\n    }\n\n    static func validateAlias(_ alias: String, field: String = \"alias\") throws {\n        try rejectControl(alias, field: field)\n        guard matches(alias, #\"^[A-Za-z0-9][A-Za-z0-9._-]*$\"#) else {\n            throw SSHConfigError.invalidAlias(alias)\n        }\n    }\n\n    static func validateHostName(_ name: String) throws {\n        try rejectControl(name, field: \"hostName\")\n        if name.isEmpty || name.hasPrefix(\"-\") || name.contains(where: { $0.isWhitespace }) {\n            throw SSHConfigError.invalidHostName(name)\n        }\n        if matches(name, #\"^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$\"#) { return }\n        if name.contains(\":\") {\n            var addr = in6_addr()\n            if inet_pton(AF_INET6, name, &addr) == 1 { return }\n        }\n        throw SSHConfigError.invalidHostName(name)\n    }\n\n    static func validatePath(_ path: String, field: String) throws {\n        try rejectControl(path, field: field)\n        guard path.hasPrefix(\"/\") else { throw SSHConfigError.pathNotAbsolute(field: field) }\n        guard !path.contains(\"%\") else {\n            throw SSHConfigError.unsupportedPathCharacter(field: field)\n        }\n    }\n\n    static func rejectControl(_ value: String, field: String) throws {\n        for scalar in value.unicodeScalars\n        where scalar.value < 0x20 || scalar.value == 0x7F\n            || (0x80...0x9F).contains(scalar.value)\n        {\n            throw SSHConfigError.controlCharacter(field: field)\n        }\n    }\n\n    static func checkJumpCycles(_ hosts: [SSHHostSpec]) throws {\n        let next = Dictionary(\n            hosts.compactMap { h in h.jumpAlias.map { (h.alias, $0) } },\n            uniquingKeysWith: { first, _ in first })\n        for start in hosts.map(\\.alias) {\n            var path = [start]\n            var current = start\n            while let n = next[current] {\n                if let idx = path.firstIndex(of: n) {\n                    throw SSHConfigError.jumpCycle(Array(path[idx...]))\n                }\n                path.append(n)\n                current = n\n            }\n        }\n    }\n\n    // MARK: - Helpers\n\n    /// Bọc trong \"...\" và escape `\\` rồi `\"` (cú pháp ssh_config).\n    static func quote(_ value: String) -> String {\n        let escaped = value.replacingOccurrences(of: \"\\\\\", with: \"\\\\\\\\\")\n            .replacingOccurrences(of: \"\\\"\", with: \"\\\\\\\"\")\n        return \"\\\"\" + escaped + \"\\\"\"\n    }\n\n    private static func matches(_ value: String, _ pattern: String) -> Bool {\n        value.range(of: pattern, options: .regularExpression) != nil\n    }\n}\n"}, "Sources/SSHDeskCore/Settings/SettingsRepository.swift": {"group": "Core · Settings", "text": "import Foundation\n\n/// Lưu cài đặt trong bảng `settings` (migration v7). Chỉ khoá/giá trị văn bản, không bí mật.\npublic final class SettingsRepository: @unchecked Sendable {\n    private let db: Database\n\n    public init(database: Database) { self.db = database }\n\n    /// Đọc mọi cài đặt; giá trị hỏng/khoá lạ → mặc định. Lỗi đọc DB → mặc định (không crash).\n    public func load() -> AppSettings {\n        guard let rows = try? db.query(\"SELECT key, value FROM settings\") else { return .default }\n        var values: [String: String] = [:]\n        for row in rows {\n            if case .text(let k) = row[0], case .text(let v) = row[1] { values[k] = v }\n        }\n        return AppSettings(values: values)\n    }\n\n    /// Cờ nội bộ (vd migration một lần). Khoá không thuộc `AppSettings`, nên không bị `save` ghi đè.\n    public func flag(_ key: String) -> Bool {\n        guard let rows = try? db.query(\"SELECT value FROM settings WHERE key = ?\", [.text(key)]),\n            let first = rows.first, case .text(let v) = first[0]\n        else { return false }\n        return v == \"1\"\n    }\n\n    public func setFlag(_ key: String) throws {\n        try db.execute(\n            \"INSERT INTO settings(key, value) VALUES (?, '1') ON CONFLICT(key) DO UPDATE SET value = '1'\",\n            [.text(key)])\n    }\n\n    /// Ghi (đã chuẩn hoá) trong một transaction; trả cài đặt đã chuẩn hoá.\n    @discardableResult\n    public func save(_ settings: AppSettings) throws -> AppSettings {\n        let normalized = settings.normalized\n        try db.transaction {\n            for (key, value) in normalized.values {\n                try db.execute(\n                    \"INSERT INTO settings(key, value) VALUES (?, ?) ON CONFLICT(key) DO UPDATE SET value = excluded.value\",\n                    [.text(key), .text(value)])\n            }\n        }\n        return normalized\n    }\n}\n\n/// Bản cài đặt hiện hành dùng chung giữa UI và các service (đọc mỗi lần dùng, nên đổi có hiệu lực ngay).\npublic final class SettingsStore: @unchecked Sendable {\n    private let lock = NSLock()\n    private var value: AppSettings\n\n    public init(_ initial: AppSettings = .default) { value = initial.normalized }\n\n    public var current: AppSettings {\n        lock.lock()\n        defer { lock.unlock() }\n        return value\n    }\n\n    public func update(_ settings: AppSettings) {\n        lock.lock()\n        defer { lock.unlock() }\n        value = settings.normalized\n    }\n}\n\n/// Bọc kho bí mật: khi tự điền bị tắt (ADR-021) thì `read` trả nil → mọi chỗ tự điền (PTY, tunnel, phiên SFTP,\n/// cài key) rơi về hỏi người dùng. `exists/save/delete` giữ nguyên để UI vẫn thấy \"đã lưu mật khẩu\".\npublic struct AutofillGatedCredentialStore: CredentialStore {\n    private let base: any CredentialStore\n    private let isEnabled: @Sendable () -> Bool\n\n    public init(base: any CredentialStore, isEnabled: @escaping @Sendable () -> Bool) {\n        self.base = base\n        self.isEnabled = isEnabled\n    }\n\n    public func save(ref: String, password: String) throws { try base.save(ref: ref, password: password) }\n    public func read(ref: String) -> String? { isEnabled() ? base.read(ref: ref) : nil }\n    public func delete(ref: String) throws { try base.delete(ref: ref) }\n    public func exists(ref: String) -> Bool { base.exists(ref: ref) }\n    public func status(ref: String) -> CredentialStatus { base.status(ref: ref) }\n}\n"}, "Sources/SSHDeskCore/Transfer/ScpCommandBuilder.swift": {"group": "Core · Transfer", "text": "import Foundation\n\npublic enum ScpBuildError: Error, Equatable {\n    case invalidConfigPath\n    case invalidAlias(String)\n    /// Đường dẫn local không tuyệt đối (sẽ làm `a:b` bị hiểu là remote).\n    case localPathNotAbsolute(String)\n    /// NUL, newline hoặc ký tự điều khiển trong đường dẫn local.\n    case invalidLocalPath(String)\n    case emptyRemotePath\n    /// Ký tự không chứng minh được là truyền literal qua scp/SFTP → từ chối thay vì truyền nhầm.\n    case unsupportedRemotePathCharacter(String)\n    case localNameMissing\n    case invalidControlPath(String)\n}\n\npublic struct ScpInvocation: Sendable, Equatable {\n    public let executable: String\n    public let arguments: [String]\n    /// Chỉ download: đích tạm cạnh đích thật (`.<tên>.sshdesk-<jobid>.part`).\n    public let tempPartialPath: String?\n}\n\n/// Dựng argv cho `/usr/bin/scp` (ADR-008). Thuần logic, không chạy process.\n///\n/// Kết quả thí nghiệm (fake ssh + sftp-server, OpenSSH 10.x, scp mặc định SFTP):\n/// - Remote SOURCE (download) bị glob: `* ? [ ]` phải escape bằng `\\`, và `\\` cũng phải escape.\n///   Sau khi escape, mọi tên trong bộ thử (khoảng trắng, Unicode, ' \" $ ; & ( ) { } ~ # ! % ` | < > :,\n///   tab, tên bắt đầu bằng `-`) đều tải đúng nội dung; `*`/`?`/`[a]` không escape thì khớp nhầm.\n/// - Remote DESTINATION (upload) KHÔNG bị glob: truyền literal. Nếu escape sẽ tạo file tên có `\\`\n///   → upload tuyệt đối không escape đích.\npublic enum ScpCommandBuilder {\n    public static let executable = \"/usr/bin/scp\"\n    public static let connectTimeoutSeconds = 15\n\n    /// `controlPath`: socket của ControlMaster đang sống (tab duyệt file) → scp đi qua master đó.\n    public static func build(for job: TransferJob, controlPath: String? = nil) throws\n        -> ScpInvocation\n    {\n        try validateConfig(job.configPathSnapshot)\n        try validateAlias(job.sshAliasSnapshot)\n\n        var args = [\"-F\", job.configPathSnapshot, \"-o\", \"ConnectTimeout=\\(connectTimeoutSeconds)\"]\n        if let controlPath {\n            try validateControlPath(controlPath)\n            args += [\"-o\", \"ControlPath=\\(controlPath)\"]\n        }\n        if job.itemKind == .directory { args.append(\"-r\") }\n        args.append(\"--\")\n\n        switch job.direction {\n        case .upload:\n            try validateLocal(job.sourcePath)\n            let remote = try validateRemote(job.destinationPath)\n            // Đích upload không bị glob → không escape.\n            args += [job.sourcePath, \"\\(job.sshAliasSnapshot):\\(remote)\"]\n            return ScpInvocation(executable: executable, arguments: args, tempPartialPath: nil)\n        case .download:\n            let remote = try validateRemote(job.sourcePath)\n            try validateLocal(job.destinationPath)\n            let partial = try partialPath(for: job.destinationPath, jobID: job.id)\n            args += [\"\\(job.sshAliasSnapshot):\\(escapeRemoteSource(remote))\", partial]\n            return ScpInvocation(executable: executable, arguments: args, tempPartialPath: partial)\n        }\n    }\n\n    /// `/dir/name` → `/dir/.name.sshdesk-<uuid>.part`\n    public static func partialPath(for destination: String, jobID: UUID) throws -> String {\n        try validateLocal(destination)\n        let url = URL(fileURLWithPath: destination)\n        let name = url.lastPathComponent\n        guard !name.isEmpty, name != \"/\" else { throw ScpBuildError.localNameMissing }\n        return url.deletingLastPathComponent().appendingPathComponent(\n            partialName(for: name, jobID: jobID)\n        ).path\n    }\n\n    static func partialName(for name: String, jobID: UUID) -> String {\n        \".\\(name).sshdesk-\\(jobID.uuidString).part\"\n    }\n\n    /// Chèn `\\` trước `\\ * ? [ ]` (chỉ dùng cho remote nguồn của download).\n    public static func escapeRemoteSource(_ path: String) -> String {\n        var out = \"\"\n        for ch in path {\n            if ch == \"\\\\\" || ch == \"*\" || ch == \"?\" || ch == \"[\" || ch == \"]\" { out.append(\"\\\\\") }\n            out.append(ch)\n        }\n        return out\n    }\n\n    // MARK: - Kiểm tra\n\n    private static func hasControl(_ s: String) -> Bool {\n        s.unicodeScalars.contains { $0.value < 0x20 || $0.value == 0x7f }\n    }\n\n    private static func validateConfig(_ p: String) throws {\n        guard p.hasPrefix(\"/\"), !hasControl(p) else { throw ScpBuildError.invalidConfigPath }\n    }\n\n    /// Tuyệt đối, không ký tự điều khiển, không khoảng trắng/`%` (ssh sẽ expand token).\n    public static func validateControlPath(_ p: String) throws {\n        guard p.hasPrefix(\"/\"), !hasControl(p), !p.contains(\" \"), !p.contains(\"%\"), !p.contains(\"\\\"\")\n        else { throw ScpBuildError.invalidControlPath(p) }\n    }\n\n    private static func validateAlias(_ a: String) throws {\n        guard a.range(of: #\"^[A-Za-z0-9][A-Za-z0-9._-]*$\"#, options: .regularExpression) != nil\n        else { throw ScpBuildError.invalidAlias(a) }\n    }\n\n    private static func validateLocal(_ p: String) throws {\n        guard !hasControl(p) else { throw ScpBuildError.invalidLocalPath(p) }\n        guard p.hasPrefix(\"/\") else { throw ScpBuildError.localPathNotAbsolute(p) }\n    }\n\n    private static func validateRemote(_ p: String) throws -> String {\n        guard !p.isEmpty else { throw ScpBuildError.emptyRemotePath }\n        if let bad = p.unicodeScalars.first(where: { $0.value < 0x20 || $0.value == 0x7f }) {\n            throw ScpBuildError.unsupportedRemotePathCharacter(\n                String(format: \"U+%04X\", bad.value))\n        }\n        return p\n    }\n}\n"}, "Sources/SSHDeskCore/Transfer/TransferManager.swift": {"group": "Core · Transfer", "text": "import Foundation\n\n/// Sự kiện cho UI. Không bao giờ chứa password/OTP: `PromptKind` chỉ là câu hỏi của ssh.\npublic enum TransferEvent: Sendable, Equatable {\n    case jobUpdated(TransferJob)\n    /// Job đang ở `awaitingUserInput`; UI hỏi người dùng rồi gọi `respond`.\n    case authPrompt(jobID: UUID, PromptKind)\n    /// Job đã sang trạng thái kết thúc (phát sau `jobUpdated` cuối).\n    case jobFinished(TransferJob)\n}\n\npublic enum TransferManagerError: Error, Equatable {\n    case hostNotFound(UUID)\n    /// Alias hiện tại của host khác alias trong snapshot của job.\n    case hostChanged(String)\n    case localSourceMissing(String)\n    /// Upload: nguồn là symlink hoặc cây chứa symlink (danh sách tương đối, `\".\"` = chính nguồn).\n    case symlinksNotSupported([String])\n    /// Download: đích đổi tên đã tồn tại.\n    case localConflict(String)\n    case jobNotFound(UUID)\n    case notAwaitingInput(UUID)\n    case notCancellable(TransferState)\n}\n\n/// Hàng đợi truyền file chạy thật (ADR-008): `scp` qua PTY, một job một process.\n///\n/// Heuristic `connecting → transferring`: dòng progress đầu tiên parse được bằng `ScpProgressParser`.\n/// Không dùng \"output đầu tiên\" vì banner/`Permission denied, please try again` cũng là output.\n/// Nếu scp thoát 0 mà chưa từng có dòng progress (file rỗng...), job đi qua `transferring` rồi mới\n/// `finalizing` để đúng máy trạng thái. Chỉ nhận diện prompt khi đang `connecting`.\npublic actor TransferManager {\n    private final class Run: @unchecked Sendable {\n        let job: TransferJob\n        var state: TransferState = .queued\n        var process: PTYProcess?\n        var task: Task<Void, Never>?\n        var chain: Task<Void, Never> = Task {}\n        var cancelRequested = false\n        var fatalReason: String?\n        var detector = PromptDetector()\n        var lineBuffer = \"\"\n        var tail: [String] = []\n        var secrets: [String] = []\n        /// Hồ sơ host hiện tại (để áp `PasswordAutofillPolicy`); nil = không tự điền.\n        var autoFillHost: HostProfile?\n        /// ControlPath của master còn sống lúc bắt đầu chạy (nil = scp tự kết nối).\n        var controlPath: String?\n        /// Đã tự điền (hoặc thử điền) password một lần: lần sau luôn hỏi người dùng.\n        var autoFilled = false\n        var progress = TransferProgress()\n        var lastProgressWrite = Date.distantPast\n        var progressDirty = false\n        init(job: TransferJob) { self.job = job }\n    }\n\n    public nonisolated let events: AsyncStream<TransferEvent>\n    private let continuation: AsyncStream<TransferEvent>.Continuation\n\n    private let repository: TransferRepository\n    private let hosts: HostRepository\n    private var concurrency: Int\n    private let extraSSHProgram: URL?\n    private let environment: [String: String]\n    private let progressInterval: TimeInterval\n    private let ctty: URL?\n    private let credentials: (any CredentialStore)?\n    private let hostAdjuster: (@Sendable (HostProfile) -> HostProfile)?\n\n    private var queue: [TransferJob] = []\n    private var running: [UUID: Run] = [:]\n    private var shuttingDown = false\n    /// jobID → ControlPath mong muốn (trong bộ nhớ).\n    private var controlPaths: [UUID: String] = [:]\n\n    /// `extraSSHProgram`: CHỈ để test (thêm `-S <program>` cho scp). Production luôn nil.\n    public init(\n        repository: TransferRepository, hosts: HostRepository, concurrency: Int = 1,\n        extraSSHProgram: URL? = nil,\n        environment: [String: String] = ProcessEnvironment.inherited(),\n        progressInterval: TimeInterval = 0.5,\n        controllingTTYHelper: URL? = nil,\n        credentials: (any CredentialStore)? = nil,\n        hostAdjuster: (@Sendable (HostProfile) -> HostProfile)? = nil\n    ) {\n        self.hostAdjuster = hostAdjuster\n        self.credentials = credentials\n        self.ctty = controllingTTYHelper\n        self.repository = repository\n        self.hosts = hosts\n        self.concurrency = max(1, concurrency)\n        self.extraSSHProgram = extraSSHProgram\n        self.environment = environment\n        self.progressInterval = progressInterval\n        (events, continuation) = AsyncStream<TransferEvent>.makeStream(bufferingPolicy: .unbounded)\n    }\n\n    /// Đổi số tác vụ chạy song song (1–4 ở Cài đặt). Tăng → chạy thêm job đang chờ ngay; giảm → job đang chạy\n    /// không bị ngắt, chỉ không khởi động thêm cho tới khi số job đang chạy xuống dưới mức mới.\n    public func setConcurrency(_ n: Int) {\n        concurrency = max(1, n)\n        pump()\n    }\n\n    public var hasActiveJobs: Bool { !running.isEmpty || !queue.isEmpty }\n\n    // MARK: - API\n\n    /// Kiểm tra lại rồi lưu job (queued) và đưa vào hàng đợi.\n    ///\n    /// `controlPath`: socket ControlMaster của tab duyệt file; scp dùng lại master đó nếu lúc chạy nó còn sống.\n    /// Chỉ giữ trong bộ nhớ (không lưu DB): job khôi phục sau khi mở lại app luôn chạy không ControlPath.\n    @discardableResult\n    public func enqueue(_ job: TransferJob, controlPath: String? = nil) async throws -> TransferJob {\n        var job = job\n        job.state = .queued\n        if let controlPath { try ScpCommandBuilder.validateControlPath(controlPath) }\n        try await validate(job)\n        try await repository.insert(job)\n        if let controlPath { controlPaths[job.id] = controlPath }\n        schedule(job)\n        return job\n    }\n\n    /// Tạo job mới từ job lỗi/huỷ/gián đoạn (job cũ giữ nguyên), kiểm tra lại rồi xếp hàng.\n    @discardableResult\n    public func retry(jobID: UUID) async throws -> TransferJob {\n        guard let old = try await repository.job(id: jobID) else {\n            throw TransferManagerError.jobNotFound(jobID)\n        }\n        var probe = old\n        probe.state = .queued\n        try await validate(probe)\n        let new = try await repository.retry(jobID: jobID)\n        // Retry kiểm tra lại master lúc chạy: chết rồi thì tự bỏ ControlPath.\n        if let cp = controlPaths[jobID] { controlPaths[new.id] = cp }\n        schedule(new)\n        return new\n    }\n\n    public func cancel(jobID: UUID) async throws {\n        if let i = queue.firstIndex(where: { $0.id == jobID }) {\n            queue.remove(at: i)\n            let j = try await repository.transition(id: jobID, to: .cancelled, exit: .cancelled)\n            publish(j)\n            return\n        }\n        guard let run = running[jobID] else {\n            guard let j = try await repository.job(id: jobID) else {\n                throw TransferManagerError.jobNotFound(jobID)\n            }\n            throw TransferManagerError.notCancellable(j.state)\n        }\n        switch run.state {\n        case .cancelling: return\n        case .connecting, .awaitingUserInput, .transferring:\n            run.cancelRequested = true\n            apply(run, to: .cancelling)\n            run.process?.cancel()\n        default:\n            throw TransferManagerError.notCancellable(run.state)\n        }\n    }\n\n    /// Trả lời prompt đang chờ. `isSecret`: che chuỗi này nếu con in lại. Không lưu `text` ở đâu cả\n    /// (trừ danh sách che trong bộ nhớ, bị xoá khi job kết thúc).\n    public func respond(jobID: UUID, text: String, isSecret: Bool) async throws {\n        guard let run = running[jobID], run.state == .awaitingUserInput, let p = run.process else {\n            throw TransferManagerError.notAwaitingInput(jobID)\n        }\n        apply(run, to: .connecting)\n        if isSecret, !text.isEmpty { run.secrets.append(text) }\n        p.send(text, redact: isSecret)\n    }\n\n    /// Khởi động app: job dở dang → `interrupted`, dọn `.part` của chúng.\n    @discardableResult\n    public func recoverInterrupted() async throws -> [TransferJob] {\n        var out: [TransferJob] = []\n        for var job in try await repository.recoverInterrupted() {\n            if let p = job.tempPartialPath, LocalFinalizer.localConflict(p) {\n                if !LocalFinalizer.cleanupPartial(path: p, jobID: job.id) {\n                    job.failureReason = TransferJob.sanitizeReason(\n                        (job.failureReason ?? \"\") + \" (không xoá được file tạm)\")\n                }\n            }\n            publish(job)\n            out.append(job)\n        }\n        return out\n    }\n\n    /// Vòng đời app. Luôn ngừng khởi động job mới. `cancelRunning`: huỷ job đang chạy và chờ\n    /// chúng dọn xong (job còn chờ thành `interrupted` ngay).\n    public func shutdown(cancelRunning: Bool) async {\n        shuttingDown = true\n        guard cancelRunning else { return }\n        let runs = Array(running.values)\n        for run in runs {\n            switch run.state {\n            case .connecting, .awaitingUserInput, .transferring:\n                run.cancelRequested = true\n                apply(run, to: .cancelling)\n                run.process?.cancel()\n            default: break\n            }\n        }\n        for run in runs { await run.task?.value }\n        // Job còn chờ (chưa chạy) không thể chạy nữa: đánh dấu \"Bị gián đoạn\" ngay (ADR-022), dọn .part.\n        queue.removeAll()\n        _ = try? await recoverInterrupted()\n        continuation.finish()\n    }\n\n    // MARK: - Kiểm tra trước khi xếp hàng\n\n    private func validate(_ job: TransferJob) async throws {\n        guard let host = try await hosts.host(id: job.hostID) else {\n            throw TransferManagerError.hostNotFound(job.hostID)\n        }\n        guard let alias = host.sshAlias, alias == job.sshAliasSnapshot else {\n            throw TransferManagerError.hostChanged(job.sshAliasSnapshot)\n        }\n        // Chặn đường dẫn/alias/config hỏng sớm (cùng bộ kiểm tra lúc chạy).\n        _ = try ScpCommandBuilder.build(for: job)\n\n        switch job.direction {\n        case .upload:\n            guard LocalFinalizer.localConflict(job.sourcePath) else {\n                throw TransferManagerError.localSourceMissing(job.sourcePath)\n            }\n            let links = LocalTreeInspector.symlinks(at: job.sourcePath)\n            if !links.isEmpty { throw TransferManagerError.symlinksNotSupported(links) }\n        case .download:\n            if case .rename(let name) = job.overwritePolicy {\n                guard LocalFinalizer.validName(name) else {\n                    throw LocalFinalizeError.invalidNewName(name)\n                }\n                let target = URL(fileURLWithPath: job.destinationPath)\n                    .deletingLastPathComponent().appendingPathComponent(name).path\n                if LocalFinalizer.localConflict(target) {\n                    throw TransferManagerError.localConflict(target)\n                }\n            }\n        }\n    }\n\n    // MARK: - Hàng đợi\n\n    private func schedule(_ job: TransferJob) {\n        queue.append(job)\n        publish(job)\n        pump()\n    }\n\n    private func pump() {\n        guard !shuttingDown else { return }\n        while running.count < concurrency, !queue.isEmpty {\n            let job = queue.removeFirst()\n            let run = Run(job: job)\n            running[job.id] = run\n            apply(run, to: .connecting)\n            run.task = Task { await self.execute(run) }\n        }\n    }\n\n    private func publish(_ job: TransferJob) {\n        continuation.yield(.jobUpdated(job))\n        if job.state.isTerminal { continuation.yield(.jobFinished(job)) }\n    }\n\n    /// Đổi state trong bộ nhớ ngay (đồng bộ), ghi DB theo đúng thứ tự qua `chain`.\n    @discardableResult\n    private func apply(\n        _ run: Run, to new: TransferState, exit: TransferExitStatus? = nil,\n        reason: String? = nil\n    ) -> Bool {\n        guard run.state != new, TransferStateMachine.isValid(from: run.state, to: new) else {\n            return false\n        }\n        run.state = new\n        let id = run.job.id\n        let prev = run.chain\n        run.chain = Task {\n            await prev.value\n            if let j = try? await self.repository.transition(\n                id: id, to: new, exit: exit, failureReason: reason)\n            {\n                self.publish(j)\n            }\n        }\n        return true\n    }\n\n    private func chainOp(\n        _ run: Run, _ op: @escaping @Sendable (isolated TransferManager) async -> Void\n    ) {\n        let prev = run.chain\n        run.chain = Task {\n            await prev.value\n            await op(self)\n        }\n    }\n\n    // MARK: - Chạy một job\n\n    /// `ssh -O check` đúng master của tab. Lỗi/hết giờ = coi như chết.\n    private func masterIsAlive(controlPath: String, job: TransferJob) async -> Bool {\n        let ssh = \"/usr/bin/ssh\"\n        let out = try? await SimpleProcess.run(\n            executable: ssh,\n            arguments: [\n                \"-F\", job.configPathSnapshot, \"-o\", \"ControlPath=\\(controlPath)\", \"-O\", \"check\",\n                \"--\", job.sshAliasSnapshot,\n            ], environment: environment, timeout: 5)\n        guard let out else { return false }\n        return out.status == 0 && !out.timedOut\n    }\n\n    private func execute(_ run: Run) async {\n        await runProcess(run)\n        await run.chain.value\n        run.secrets.removeAll()\n        running[run.job.id] = nil\n        pump()\n    }\n\n    private func runProcess(_ run: Run) async {\n        let job = run.job\n        if run.cancelRequested { return finishCancelled(run, partial: nil) }\n\n        // Dùng lại master của tab nếu còn sống; chết rồi thì chạy không ControlPath (xác thực lại).\n        if let wanted = controlPaths[job.id] {\n            run.controlPath = await masterIsAlive(controlPath: wanted, job: job) ? wanted : nil\n            if run.cancelRequested { return finishCancelled(run, partial: nil) }\n        }\n        let inv: ScpInvocation\n        do { inv = try ScpCommandBuilder.build(for: job, controlPath: run.controlPath) } catch {\n            return finishFailed(run, reason: \"Tham số không hợp lệ: \\(error)\", partial: nil)\n        }\n        let partial = inv.tempPartialPath\n\n        if job.direction == .download, job.overwritePolicy == .skip,\n            LocalFinalizer.localConflict(job.destinationPath)\n        {\n            // Người dùng chọn bỏ qua và đích đã tồn tại: không cần tải.\n            apply(run, to: .transferring)\n            apply(run, to: .finalizing)\n            apply(run, to: .completed, exit: .exited(0), reason: TransferJob.skippedReason)\n            return\n        }\n\n        if credentials != nil {\n            run.autoFillHost = (try? await hosts.host(id: job.hostID)).map { hostAdjuster?($0) ?? $0 }\n        }\n\n        if let partial { try? await repository.setTempPartialPath(id: job.id, partial) }\n        if run.cancelRequested { return finishCancelled(run, partial: partial) }\n\n        let process: PTYProcess\n        do {\n            let args = (extraSSHProgram.map { [\"-S\", $0.path] } ?? []) + inv.arguments\n            process = try PTYProcess.start(\n                executable: URL(fileURLWithPath: inv.executable), arguments: args,\n                environment: environment, helper: ctty)\n        } catch {\n            return finishFailed(run, reason: \"Không chạy được scp: \\(error)\", partial: partial)\n        }\n        run.process = process\n        if run.cancelRequested { process.cancel() }\n\n        var exit: ProcessExit = .exited(-1)\n        for await ev in process.events {\n            switch ev {\n            case .output(let text): handleOutput(run, text)\n            case .exit(let e): exit = e\n            }\n        }\n        run.process = nil\n        flushRemainder(run)\n\n        // Thứ tự ưu tiên: huỷ > lỗi dứt khoát (host key đổi) > mã thoát.\n        if run.cancelRequested || run.state == .cancelling {\n            return finishCancelled(run, partial: partial)\n        }\n        if let fatal = run.fatalReason {\n            return finishFailed(run, reason: fatal, partial: partial, exit: exit)\n        }\n        guard case .exited(0) = exit else {\n            return finishFailed(\n                run, reason: failureReason(run, exit: exit), partial: partial, exit: exit)\n        }\n\n        // scp báo thành công.\n        apply(run, to: .transferring)\n        if job.itemKind == .file { run.progress.fraction = 1 }\n        run.progressDirty = true\n        writeProgress(run, force: true)\n        apply(run, to: .finalizing)\n        if let partial {\n            do {\n                var policy = job.overwritePolicy\n                if policy == .skip {\n                    // Không có xung đột lúc bắt đầu: vẫn đặt file vào đích, nhưng không ghi đè.\n                    policy = .rename(URL(fileURLWithPath: job.destinationPath).lastPathComponent)\n                }\n                try LocalFinalizer.finalize(\n                    partialPath: partial, destination: job.destinationPath, policy: policy,\n                    jobID: job.id)\n            } catch {\n                return finishFailed(\n                    run, reason: \"Không hoàn tất được file đã tải: \\(error)\", partial: partial,\n                    exit: exit)\n            }\n        }\n        apply(run, to: .completed, exit: TransferExitStatus(exit))\n    }\n\n    private func finishFailed(\n        _ run: Run, reason: String, partial: String?, exit: ProcessExit? = nil\n    ) {\n        let text = scrub(run, reason + cleanup(run, partial))\n        apply(run, to: .failed, exit: exit.map(TransferExitStatus.init), reason: text)\n    }\n\n    private func finishCancelled(_ run: Run, partial: String?) {\n        let note = cleanup(run, partial)\n        apply(run, to: .cancelling)  // no-op nếu đã ở cancelling\n        apply(\n            run, to: .cancelled, exit: .cancelled,\n            reason: note.isEmpty ? nil : TransferJob.sanitizeReason(note))\n    }\n\n    /// Dọn `.part`; trả ghi chú nếu còn sót.\n    private func cleanup(_ run: Run, _ partial: String?) -> String {\n        guard let partial, LocalFinalizer.localConflict(partial) else { return \"\" }\n        if LocalFinalizer.cleanupPartial(path: partial, jobID: run.job.id) { return \"\" }\n        let name = URL(fileURLWithPath: partial).lastPathComponent\n        return \" (Không xoá được file tạm: \\(name))\"\n    }\n\n    // MARK: - Output\n\n    private func handleOutput(_ run: Run, _ text: String) {\n        guard\n            run.state == .connecting || run.state == .awaitingUserInput\n                || run.state == .transferring\n        else { return }\n\n        run.lineBuffer += text\n        while let nl = run.lineBuffer.firstIndex(of: \"\\n\") {\n            let line = String(run.lineBuffer[..<nl])\n            run.lineBuffer.removeSubrange(...nl)\n            handleLine(run, line)\n        }\n        // scp vẽ progress bằng \"\\r\" và dòng cuối chưa có \"\\n\" → thử parse cả phần dở.\n        if let p = ScpProgressParser.parse(run.lineBuffer) { noteProgress(run, p) }\n\n        guard run.state == .connecting else {\n            run.detector.reset()\n            return\n        }\n        guard let kind = run.detector.feed(text) else { return }\n        if case .hostKeyChanged = kind {\n            // Không bao giờ trả lời; dừng process, job thành failed khi process thoát.\n            run.fatalReason = \"Host key đã thay đổi — dừng lại; kiểm tra known_hosts thủ công\"\n            run.process?.cancel()\n            return\n        }\n        // Password lần ĐẦU, khớp `PasswordAutofillPolicy` (không bastion, đúng user@host): tự điền,\n        // không hiện prompt. Lần sau (sai) hoặc prompt của bastion hỏi UI. Passphrase / MFA / host key luôn hỏi UI.\n        if let host = run.autoFillHost, let ref = host.autofillCredentialReference,\n            PasswordAutofillPolicy.shouldAutofill(\n                prompt: kind, host: host, alreadyFilled: run.autoFilled)\n        {\n            run.autoFilled = true\n            Task { self.autoFillPassword(run, ref: ref, fallback: kind) }\n            return\n        }\n        presentPrompt(run, kind)\n    }\n\n    private func presentPrompt(_ run: Run, _ kind: PromptKind) {\n        if apply(run, to: .awaitingUserInput) {\n            let id = run.job.id\n            chainOp(run) { m in m.continuation.yield(.authPrompt(jobID: id, kind)) }\n        }\n    }\n\n    private func autoFillPassword(_ run: Run, ref: String, fallback: PromptKind) {\n        guard run.state == .connecting, let p = run.process else { return }\n        guard let password = credentials?.read(ref: ref), !password.isEmpty else {\n            presentPrompt(run, fallback)  // Không đọc được Keychain: hỏi người dùng.\n            return\n        }\n        run.secrets.append(password)\n        p.send(password, redact: true)\n    }\n\n    private func handleLine(_ run: Run, _ line: String) {\n        let t = line.trimmingCharacters(in: .whitespaces)\n        if t.isEmpty { return }\n        if let p = ScpProgressParser.parse(t) {\n            noteProgress(run, p)\n            return\n        }\n        run.tail.append(t)\n        if run.tail.count > 30 { run.tail.removeFirst() }\n    }\n\n    private func flushRemainder(_ run: Run) {\n        let rest = run.lineBuffer\n        run.lineBuffer = \"\"\n        handleLine(run, rest)\n    }\n\n    private func noteProgress(_ run: Run, _ p: ScpProgress) {\n        if run.state == .connecting { apply(run, to: .transferring) }\n        guard run.state == .transferring else { return }\n        if run.job.itemKind == .directory {\n            // scp -r báo % theo từng file: không có tổng → indeterminate.\n            run.progress = TransferProgress(bytesPerSecond: p.bytesPerSecond)\n        } else {\n            run.progress = TransferProgress(\n                bytes: p.bytes, fraction: p.fraction, bytesPerSecond: p.bytesPerSecond)\n        }\n        run.progressDirty = true\n        writeProgress(run, force: false)\n    }\n\n    /// Throttle: tối đa một lần ghi DB mỗi `progressInterval` giây (trừ khi `force`).\n    private func writeProgress(_ run: Run, force: Bool) {\n        guard run.progressDirty else { return }\n        let now = Date()\n        guard force || now.timeIntervalSince(run.lastProgressWrite) >= progressInterval else {\n            return\n        }\n        run.lastProgressWrite = now\n        run.progressDirty = false\n        let id = run.job.id\n        let progress = run.progress\n        chainOp(run) { m in\n            try? await m.repository.updateProgress(id: id, progress)\n            if let j = try? await m.repository.job(id: id) { m.publish(j) }\n        }\n    }\n\n    // MARK: - Lý do lỗi\n\n    /// Theo thứ tự ưu tiên: lỗi cụ thể trước, \"Connection closed\" (scp luôn in sau cùng) để sau.\n    private static let knownErrors = [\n        \"permission denied\", \"host key verification failed\", \"no such file\",\n        \"connection refused\", \"could not resolve hostname\", \"connection timed out\",\n        \"operation timed out\", \"no route to host\", \"network is unreachable\", \"not a regular file\",\n        \"is a directory\", \"too many authentication failures\", \"disk quota\", \"no space left\",\n        \"read-only file system\", \"connection reset\", \"connection closed\",\n    ]\n\n    private func failureReason(_ run: Run, exit: ProcessExit) -> String {\n        let lines = run.tail\n        for pattern in Self.knownErrors {\n            if let l = lines.last(where: { $0.lowercased().contains(pattern) }) { return l }\n        }\n        if let l = lines.last(where: { !$0.hasSuffix(\":\") }) { return l }\n        switch exit {\n        case .exited(let c): return \"scp thoát với mã \\(c)\"\n        case .signaled(let s): return \"scp bị dừng bởi tín hiệu \\(s)\"\n        case .cancelled: return \"Đã huỷ\"\n        }\n    }\n\n    /// Che bất kỳ thứ gì người dùng đã nhập có thể lọt vào lý do lỗi, rồi làm sạch.\n    private func scrub(_ run: Run, _ reason: String) -> String {\n        var s = reason\n        for secret in run.secrets.sorted(by: { $0.count > $1.count }) where !secret.isEmpty {\n            s = s.replacingOccurrences(of: secret, with: \"•••\")\n        }\n        return TransferJob.sanitizeReason(s)\n    }\n}\n"}, "Sources/SSHDeskCore/Tunnel/PortForward.swift": {"group": "Core · Tunnel", "text": "import Darwin\nimport Foundation\n\npublic enum PortForwardError: Error, Equatable {\n    /// Cổng local phải trong 1024–65535.\n    case invalidLocalPort(Int)\n    case invalidRemotePort(Int)\n    case invalidRemoteHost(String)\n    case invalidName\n    /// Cổng local đã được một forward khác của app dùng (`usedBy` = id forward đó).\n    case localPortTaken(port: Int, usedBy: UUID)\n    case hostNotFound(UUID)\n    /// Máy Windows không có forward.\n    case hostNotSupported(UUID)\n    case notFound(UUID)\n}\n\n/// Một local forward đã lưu: `127.0.0.1:localPort` → `remoteHost:remotePort` (phía server). ADR-011.\npublic struct PortForward: Codable, Sendable, Identifiable, Equatable {\n    public static let defaultRemoteHost = \"localhost\"\n    public static let minLocalPort = 1024\n    public static let maxNameLength = 100\n    public static let maxRemoteHostLength = 253\n\n    public var id: UUID\n    public var hostID: UUID\n    public var name: String\n    public var localPort: Int\n    public var remoteHost: String\n    public var remotePort: Int\n    public var createdAt: Date\n\n    public init(\n        id: UUID = UUID(), hostID: UUID, name: String = \"\", localPort: Int,\n        remoteHost: String = PortForward.defaultRemoteHost, remotePort: Int,\n        createdAt: Date = Date()\n    ) {\n        self.id = id\n        self.hostID = hostID\n        self.name = name\n        self.localPort = localPort\n        self.remoteHost = remoteHost\n        self.remotePort = remotePort\n        self.createdAt = createdAt\n    }\n\n    /// Địa chỉ người dùng nối vào, vd `127.0.0.1:5432`.\n    public var localAddress: String { \"127.0.0.1:\\(localPort)\" }\n\n    /// Mô tả ngắn `127.0.0.1:5432 → db.internal:5432`.\n    public var summary: String { \"\\(localAddress) → \\(remoteHost):\\(remotePort)\" }\n\n    /// Bản đã chuẩn hoá (trim, remoteHost rỗng → `localhost`) và đã kiểm tra. Ném `PortForwardError`.\n    public func validated() throws -> PortForward {\n        var f = self\n        f.name = name.trimmingCharacters(in: .whitespacesAndNewlines)\n        f.remoteHost = remoteHost.trimmingCharacters(in: .whitespacesAndNewlines)\n        if f.remoteHost.isEmpty { f.remoteHost = Self.defaultRemoteHost }\n        if f.name.count > Self.maxNameLength\n            || f.name.unicodeScalars.contains(where: Self.isControl)\n        {\n            throw PortForwardError.invalidName\n        }\n        guard (Self.minLocalPort...65535).contains(f.localPort) else {\n            throw PortForwardError.invalidLocalPort(f.localPort)\n        }\n        guard (1...65535).contains(f.remotePort) else {\n            throw PortForwardError.invalidRemotePort(f.remotePort)\n        }\n        guard Self.isValidRemoteHost(f.remoteHost) else {\n            throw PortForwardError.invalidRemoteHost(f.remoteHost)\n        }\n        return f\n    }\n\n    /// Hostname / IPv4 (`[A-Za-z0-9._-]`, không bắt đầu hay kết thúc bằng `.`/`-`), hoặc IPv6 literal\n    /// BẮT BUỘC nằm trong `[ ]`. Cấm khoảng trắng, ký tự điều khiển, `:` ngoài `[ ]`, `,` `/` `@` `%`...\n    /// (các ký tự này có thể làm lệch cú pháp `-L bind:port:host:port`).\n    public static func isValidRemoteHost(_ host: String) -> Bool {\n        guard !host.isEmpty, host.count <= maxRemoteHostLength else { return false }\n        if host.unicodeScalars.contains(where: { isControl($0) || $0.properties.isWhitespace }) {\n            return false\n        }\n        if host.hasPrefix(\"[\") {\n            guard host.hasSuffix(\"]\"), host.count > 2 else { return false }\n            let inner = String(host.dropFirst().dropLast())\n            guard inner.contains(\":\"), !inner.contains(\"%\") else { return false }\n            var addr = in6_addr()\n            return inet_pton(AF_INET6, inner, &addr) == 1\n        }\n        return host.range(\n            of: #\"^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$\"#, options: .regularExpression) != nil\n    }\n\n    static func isControl(_ s: Unicode.Scalar) -> Bool {\n        s.value < 0x20 || s.value == 0x7F || (0x80...0x9F).contains(s.value)\n            || s.value == 0x2028 || s.value == 0x2029\n    }\n}\n"}, "Sources/SSHDeskCore/Tunnel/TunnelManager.swift": {"group": "Core · Tunnel", "text": "import Darwin\nimport Foundation\n\n/// Trạng thái một tunnel (ADR-011): Dừng / Đang kết nối / Đang chạy / Lỗi (kèm lý do đã làm sạch).\npublic enum TunnelStatus: Sendable, Equatable {\n    case stopped\n    case connecting\n    case running\n    case failed(String)\n\n    public var isActive: Bool {\n        switch self {\n        case .connecting, .running: return true\n        case .stopped, .failed: return false\n        }\n    }\n}\n\npublic enum TunnelEvent: Sendable, Equatable {\n    case statusChanged(forwardID: UUID, hostID: UUID, status: TunnelStatus)\n    /// ssh cần người dùng trả lời (host key, passphrase, OTP...). Trả lời bằng `TunnelManager.respond`.\n    case authPrompt(forwardID: UUID, hostID: UUID, kind: PromptKind)\n}\n\n/// Dựng argv của phiên tunnel. Không shell; mọi giá trị là một phần tử argv riêng.\npublic enum TunnelCommand {\n    /// `-F <cfg> -N -o ExitOnForwardFailure=yes -o ControlMaster=no -o ControlPath=none\n    ///  -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -L 127.0.0.1:<lp>:<rh>:<rp> -- <alias>` (đúng ADR-011).\n    /// Không `BatchMode`: prompt xác thực đi qua PTY. Bind luôn `127.0.0.1` (không mở ra LAN).\n    public static func arguments(configPath: String, alias: String, forward: PortForward) throws\n
