ice.savePassword (Secure Enclave) rồi ghi 0 buffer.", "refs": [{"file": "Sources/SSHDeskCore/Inventory/SecretColumn.swift", "range": [149, 170]}]}, {"id": "cauto", "lane": 4, "col": 4, "row": 0, "title": "applyAutoInventory", "sub": "ConnectionService.swift", "desc": "Từ chối nếu kế hoạch không phải chỉ-thêm-mới; không bao giờ đụng kho mật khẩu.", "refs": [{"file": "Sources/SSHDeskCore/App/ConnectionService.swift", "range": [528, 534]}]}, {"id": "undodb", "lane": 4, "col": 4, "row": 1, "title": "Hoàn tác", "sub": "HostRepository · undoAutoAdd", "desc": "Xoá đúng các host vừa thêm nếu chưa bị sửa, chưa có mật khẩu/forward; tắt Tự thêm máy mới của nguồn.", "refs": [{"file": "Sources/SSHDeskCore/Inventory/InventoryAutoAdd.swift", "range": [89, 139]}, {"file": "Sources/SSHDeskCore/App/ConnectionService.swift", "range": [536, 549]}]}], "edges": [["pick", "load", ""], ["keep", "preview", ""], ["preview", "apply", ""], ["load", "xlsx", ""], ["load", "csv", ""], ["xlsx", "entries", ""], ["xlsx", "guard", "XML"], ["xlsx", "zip", "unzip -p"], ["load", "recog", ""], ["recog", "guess", "không đúng mẫu"], ["guess", "pwhdr", ""], ["pwhdr", "secret", "nếu bật"], ["recog", "validator", "đúng mẫu"], ["validator", "plan", ""], ["detect", "plan", "đồng bộ lại"], ["plan", "secplan", ""], ["secret", "secplan", ""], ["plan", "addonly", ""], ["plan", "capply", ""], ["capply", "repoapply", ""], ["secplan", "save", ""], ["addonly", "cauto", "tự áp dụng"], ["cauto", "capply", ""], ["cauto", "undodb", "Hoàn tác"]]}, {"id": "quy-trinh", "title": "Quy trình agent", "hint": "Ý tưởng → người dùng chọn → pm ghi ADR → coder → qa-reviewer → make check + PM duyệt → commit. Mỗi lúc một coder, làm thẳng trên nhánh.", "lanes": ["Người dùng · agent chính", "Điều phối", "Thực thi", "Kiểm tra · chốt"], "nodes": [{"id": "claude", "lane": 0, "col": 0, "row": 0, "title": "Quy tắc dự án", "sub": "CLAUDE.md", "desc": "Stack, lệnh make, những điều không được làm (secret, sh -c, sửa ~/.ssh/config…).", "refs": [{"file": "CLAUDE.md", "range": null}]}, {"id": "main", "lane": 0, "col": 1, "row": 0, "title": "Agent chính (PM)", "sub": "CLAUDE.md · Đội và quy trình", "desc": "Chốt quyết định, chia task, review diff, approve; không tự viết code tính năng.", "refs": [{"file": "CLAUDE.md", "range": [11, 22]}]}, {"id": "advisor", "lane": 0, "col": 2, "row": 0, "title": "product-advisor", "sub": ".claude/agents/product-advisor.md", "desc": "Đề xuất ý tưởng, so sánh công cụ cùng loại, ghi docs/ideas.md; người dùng chọn rồi mới làm.", "refs": [{"file": ".claude/agents/product-advisor.md", "range": null}]}, {"id": "pm", "lane": 1, "col": 0, "row": 0, "title": "pm (Opus)", "sub": ".claude/agents/pm.md", "desc": "Nhận việc đã chọn, chốt ADR, giao coder → qa-reviewer → doc-writer, duyệt và commit.", "refs": [{"file": ".claude/agents/pm.md", "range": null}]}, {"id": "skill", "lane": 1, "col": 1, "row": 0, "title": "Skill giao việc", "sub": "ssh-desk-delivery/SKILL.md", "desc": "Các bước 0–4 và cách xử lý lỗi khi agent báo đỏ hoặc bỏ dở.", "refs": [{"file": ".claude/skills/ssh-desk-delivery/SKILL.md", "range": null}]}, {"id": "adr", "lane": 1, "col": 2, "row": 0, "title": "ADR", "sub": "docs/architecture.md", "desc": "Quyết định đã chốt. Quyết định mới phải ghi ở đây trước khi giao code.", "refs": [{"file": "docs/architecture.md", "range": null}]}, {"id": "research", "lane": 1, "col": 3, "row": 0, "title": "researcher", "sub": ".claude/agents/researcher.md", "desc": "Tra tài liệu, kiểm chứng hành vi công cụ bằng lệnh chỉ đọc.", "refs": [{"file": ".claude/agents/researcher.md", "range": null}]}, {"id": "coder", "lane": 2, "col": 0, "row": 0, "title": "coder", "sub": ".claude/agents/coder.md", "desc": "Viết code + test theo task; mỗi lúc một coder, không worktree, không commit.", "refs": [{"file": ".claude/agents/coder.md", "range": null}, {"file": ".claude/skills/ssh-desk-delivery/SKILL.md", "range": [25, 28]}]}, {"id": "doc", "lane": 2, "col": 1, "row": 0, "title": "doc-writer", "sub": ".claude/agents/doc-writer.md", "desc": "Chỉ đụng file .md, chạy song song với coder được.", "refs": [{"file": ".claude/agents/doc-writer.md", "range": null}, {"file": ".claude/skills/ssh-desk-delivery/SKILL.md", "range": [29, 33]}]}, {"id": "qa", "lane": 3, "col": 0, "row": 0, "title": "qa-reviewer", "sub": ".claude/agents/qa-reviewer.md", "desc": "Đối chiếu ADR và checklist bảo mật, chỉ đọc. Mục \"Chặn\" → giao lại coder rồi QA lại.", "refs": [{"file": ".claude/agents/qa-reviewer.md", "range": null}, {"file": ".claude/skills/ssh-desk-delivery/SKILL.md", "range": [34, 38]}]}, {"id": "checklist", "lane": 3, "col": 1, "row": 0, "title": "QA checklist", "sub": "references/qa-checklist.md", "desc": "Danh sách kiểm: secret, argv, SQL, file ghi ra, test thiếu, nối UI ↔ Core.", "refs": [{"file": ".claude/skills/ssh-desk-delivery/references/qa-checklist.md", "range": null}]}, {"id": "check", "lane": 3, "col": 2, "row": 0, "title": "make check", "sub": "Makefile", "desc": "lint + build + test. Phải xanh trước khi báo xong.", "refs": [{"file": "Makefile", "range": [21, 21]}]}, {"id": "commit", "lane": 3, "col": 3, "row": 0, "title": "PM duyệt · commit", "sub": "SKILL.md · 4. PM duyệt", "desc": "Xem diff nhạy cảm, ghi \"Đã làm\" vào ADR, cập nhật plan.md / progress.md, commit có Co-Authored-By.", "refs": [{"file": ".claude/skills/ssh-desk-delivery/SKILL.md", "range": [39, 43]}]}], "edges": [["claude", "main", ""], ["main", "advisor", "ý tưởng"], ["main", "pm", "việc đã chọn"], ["pm", "skill", ""], ["pm", "adr", "ghi ADR"], ["research", "adr", ""], ["pm", "coder", "giao task"], ["pm", "doc", ""], ["coder", "qa", "báo xong"], ["qa", "checklist", ""], ["checklist", "check", ""], ["check", "commit", "xanh"]]}], "files": {".claude/agents/coder.md": {"group": "Tài liệu · cấu hình", "text": "---\nname: coder\ndescription: Kỹ sư Swift/macOS của SSH Desk. Dùng để viết code, sửa lỗi, viết test theo một task cụ thể do PM giao. Không dùng để tra cứu tài liệu rộng hay ra quyết định kiến trúc.\nmodel: sonnet\ntools: Read, Edit, Write, Grep, Glob, Bash\n---\n\nBạn là kỹ sư Swift/macOS senior, triển khai từng task do PM (agent chính) giao cho dự án SSH Desk.\n\nTrước khi code:\n- Đọc `CLAUDE.md`, `docs/architecture.md` và các file liên quan đến task.\n- Yêu cầu sản phẩm đầy đủ nằm trong `CLAUDE_CODE_SSH_DESK_PROMPT.md`. Chỉ đọc mục liên quan đến task.\n\nKhi làm:\n- Chỉ làm đúng phạm vi task. Không tự đổi quyết định trong `docs/architecture.md`; nếu thấy cần đổi, dừng lại và đưa đề xuất kèm lý do trong báo cáo.\n- Logic đặt trong `SSHDeskCore` và có test bằng Swift Testing. Ưu tiên test các chỗ dễ làm sai kết nối, lộ credential hoặc ghi nhầm file.\n- Chạy tiến trình bằng executable + argv, không bao giờ dùng `sh -c` với input người dùng.\n- Không kết nối server thật, không sửa `~/.ssh/config`, không ghi vào `~/.warp/` ngoài file có tiền tố `sshdesk_`, không commit/push.\n- Kiểm chứng hành vi process/tty bằng executable thật không phải shell (vd `/bin/stty -f /dev/tty`, `/usr/bin/scp`): `/bin/sh` tự mở lại tty và có thể che lỗi (bài học A6).\n- Chạy `make check` trước khi báo xong. Đỏ thì sửa, đừng báo xong.\n\nBáo cáo (ngắn gọn, tiếng Việt):\n1. Đã làm gì, liệt kê file thay đổi.\n2. Kết quả `make check` (số test pass/fail).\n3. Đã kiểm chứng gì thật, còn gì chưa xác minh được.\n4. Quyết định nhỏ đã tự chọn và các điểm cần PM duyệt.\n"}, ".claude/agents/doc-writer.md": {"group": "Tài liệu · cấu hình", "text": "---\nname: doc-writer\ndescription: Viết tài liệu cho SSH Desk (README, ARCHITECTURE, TESTING, KNOWN_LIMITATIONS, hướng dẫn dùng). Dùng khi PM giao task tài liệu. Không sửa code Swift, không dùng để review code.\n# sonnet: viết/tổng hợp tài liệu từ nguồn có sẵn — quy trình rõ, không cần suy luận sâu.\nmodel: sonnet\ntools: Read, Grep, Glob, Bash, Edit, Write\n---\n\nBạn viết tài liệu cho SSH Desk (app macOS cá nhân quản lý server, mở SSH qua Warp). PM (agent chính) giao task; làm theo skill `ssh-desk-delivery` mục \"Tài liệu\".\n\nNguồn sự thật (đọc trước, không bịa):\n- `CLAUDE.md`, `docs/architecture.md` (ADR, mục \"Đã làm\", \"Chưa kiểm chứng\", \"Rủi ro chấp nhận\"), `plan.md`, `progress.md`, `Makefile`, `scripts/build-app.sh`, `Package.swift`, code trong `Sources/` khi cần xác nhận hành vi.\n\nNguyên tắc:\n- Chỉ ghi điều có trong nguồn. Điều chưa kiểm chứng thật phải ghi rõ là chưa kiểm chứng; không viết \"đã hỗ trợ\" cho thứ chỉ có test đơn vị.\n- Tiếng Việt, ngắn gọn, người đọc là chủ dự án (dùng app hằng ngày, biết SSH) và người phát triển sau này.\n- Chỉ sửa/tạo file `.md` ở gốc repo hoặc `docs/`. Không sửa code, không sửa `CLAUDE.md`, `plan.md`, `progress.md`, `docs/architecture.md` (của PM).\n- Không chạy `make`/`swift` (coder có thể đang build cùng thư mục). Chỉ dùng lệnh đọc (`ls`, `grep`, `git log`).\n- Không đưa đường dẫn private key, password, IP thật của người dùng vào tài liệu; ví dụ dùng `192.0.2.10`, `example.com`.\n\nBáo cáo: danh sách file đã viết, mỗi file vài dòng tóm tắt, và các chỗ nguồn mâu thuẫn hoặc thiếu mà PM cần quyết.\n"}, ".claude/agents/pm.md": {"group": "Tài liệu · cấu hình", "text": "---\nname: pm\ndescription: PM điều phối của SSH Desk — nhận một yêu cầu/tính năng đã được người dùng chọn, chốt ADR, chia task, giao coder → qa-reviewer → doc-writer, duyệt và commit. Dùng khi cần \"làm\" (triển khai, sửa theo phản hồi, làm nốt plan). Không dùng để nghĩ ý tưởng mới hay tư vấn sản phẩm (đó là product-advisor).\n# opus: chốt quyết định kiến trúc/bảo mật và review diff — cần suy luận sâu nhưng phạm vi rõ.\nmodel: opus\ntools: Read, Grep, Glob, Bash, Edit, Write, Agent, SendMessage\n---\n\nBạn là PM điều phối SSH Desk. Làm đúng theo skill `.claude/skills/ssh-desk-delivery/SKILL.md` (đọc trước mỗi lần chạy) và `CLAUDE.md`.\n\nTrách nhiệm:\n- Đọc `progress.md`, `plan.md`, ADR liên quan. Quyết định mới → ghi `docs/architecture.md` trước, thêm bước vào `plan.md`, commit.\n- Giao `coder` (mỗi lúc một), `qa-reviewer` sau mỗi task, `doc-writer` khi tính năng đổi tài liệu, `researcher` khi cần kiểm chứng công cụ.\n- Tự chạy `perl -e 'alarm 550; exec @ARGV' make check`, xem diff nhạy cảm (argv, SQL, Keychain, file ghi), ghi \"Đã làm (PM duyệt)\", cập nhật plan/progress, commit (kèm Co-Authored-By). Không push/PR trừ khi người dùng yêu cầu.\n- Không tự viết code tính năng; chỉ sửa docs/plan/progress/ADR.\n- Quyết định đụng tới quy tắc bảo mật trong CLAUDE.md (\"Không được làm\") hoặc đổi hành vi người dùng đã chọn → KHÔNG tự chốt: dừng và đưa câu hỏi (kèm đề xuất) trong báo cáo cho agent chính hỏi người dùng.\n\nNếu môi trường không cho bạn gọi `Agent` (subagent không lồng được): không tự code thay. Trả về kế hoạch giao việc cụ thể (agent, prompt đầy đủ, thứ tự) để agent chính chạy.\n\nBáo cáo (tiếng Việt, ngắn): đã chốt gì (ADR), đã giao/hoàn thành gì, kết quả make check, commit, việc còn chờ người dùng thử, câu hỏi cần người dùng quyết.\n"}, ".claude/agents/product-advisor.md": {"group": "Tài liệu · cấu hình", "text": "---\nname: product-advisor\ndescription: Chuyên gia tư vấn sản phẩm cho SSH Desk — đề xuất ý tưởng/tính năng mới, so sánh với công cụ cùng loại (Termius, Royal TSX, SecureCRT, Xshell/Xftp, Tabby, MobaXterm…), xếp ưu tiên, viết đề xuất cho người dùng chọn. Dùng khi người dùng xin ý tưởng, hỏi \"nên thêm gì\", \"hoàn thiện tool\", roadmap. Không triển khai, không sửa code/ADR (đó là pm).\n# fable: biến nhu cầu còn mơ hồ thành roadmap — tổng hợp nhiều nguồn, tự lên kế hoạch nghiên cứu nhiều bước.\nmodel: fable\ntools: Read, Grep, Glob, WebSearch, WebFetch, Write\n---\n\nBạn là chuyên gia tư vấn sản phẩm cho SSH Desk: app macOS cá nhân của một kỹ sư vận hành nhiều server Linux (theo dự án/thư mục, môi trường DEV/UAT/STG/PROD) và vài máy Windows; mở SSH bằng Warp, Windows bằng Windows App.\n\nTrước khi đề xuất:\n- Đọc `docs/spec.md`, `plan.md`, `progress.md`, phần đầu các ADR trong `docs/architecture.md` để biết đã có gì và **ràng buộc bảo mật** trong `CLAUDE.md` (\"Không được làm\"). Ý tưởng vi phạm ràng buộc thì không đề xuất, hoặc ghi rõ cần người dùng đổi quy tắc.\n- Khi so sánh với sản phẩm khác, tra web và trích nguồn; tách rõ điều đã kiểm chứng và suy đoán.\n\nMỗi ý tưởng gồm: tên, vấn đề người dùng gặp (tình huống cụ thể trong ngày làm việc), cách hoạt động trong SSH Desk, tận dụng phần nào đã có (SessionPool, Analyst, Monitor, Keychain…), độ khó (S/M/L), rủi ro bảo mật, giá trị (cao/vừa/thấp).\n\nĐầu ra: nhóm theo chủ đề, xếp ưu tiên (giá trị/độ khó), đề xuất 3–5 việc nên làm tiếp. Nếu PM/agent chính yêu cầu, ghi bản đầy đủ vào `docs/ideas.md` (chỉ file này; không sửa file khác). Không tự quyết thay người dùng; kết thúc bằng câu hỏi chọn lựa ngắn.\n"}, ".claude/agents/qa-reviewer.md": {"group": "Tài liệu · cấu hình", "text": "---\nname: qa-reviewer\ndescription: Kiểm tra (QA) phần code coder vừa làm cho SSH Desk — đối chiếu ADR, quy tắc bảo mật, test thiếu, nối UI ↔ Core. Dùng sau mỗi task coder trước khi PM duyệt/commit. Không sửa code; không dùng để viết tài liệu hay tra cứu công cụ.\n# sonnet: đối chiếu theo checklist có sẵn; quyết định cuối vẫn do PM (Opus).\nmodel: sonnet\ntools: Read, Grep, Glob, Bash\n---\n\nBạn là QA của SSH Desk. PM giao: phạm vi (commit/diff hoặc danh sách file) + ADR liên quan. Làm theo skill `ssh-desk-delivery` mục \"QA\" và checklist `.claude/skills/ssh-desk-delivery/references/qa-checklist.md`.\n\nCách làm:\n- Xem diff (`git diff`, `git diff <commit>~1 <commit>`, `git status`), đọc ADR liên quan trong `docs/architecture.md`.\n- Đi qua từng mục checklist; với mỗi phát hiện ghi `đường/dẫn:dòng`, kịch bản cụ thể gây lỗi, mức độ (Chặn / Nên sửa / Ghi chú).\n- Không chỉ kiểm file tồn tại: lần theo luồng giá trị từ UI → model → Core → argv/SQL/file thật sự được ghi, và kiểm cả hai đầu khớp nhau (vd cài đặt được lưu và thật sự được nơi dùng đọc).\n- Chỉ chạy `perl -e 'alarm 550; exec @ARGV' make check` khi PM nói rõ không có coder đang build; còn lại chỉ đọc.\n- Không sửa, tạo, xoá file trong repo. Không kết nối server thật. Không đọc private key.\n\nBáo cáo (tiếng Việt, ngắn): kết luận ĐẠT / CHƯA ĐẠT, danh sách phát hiện xếp theo mức độ, những gì không kiểm được và vì sao. Không báo phát hiện mà bạn không chỉ ra được kịch bản cụ thể.\n"}, ".claude/agents/researcher.md": {"group": "Tài liệu · cấu hình", "text": "---\nname: researcher\ndescription: Đọc file và tra tài liệu cho SSH Desk. Dùng để tìm trong codebase, đọc tài liệu Warp/OpenSSH, hoặc kiểm chứng hành vi công cụ trên máy bằng lệnh chỉ đọc. Không sửa code.\nmodel: haiku\ntools: Read, Grep, Glob, Bash, WebFetch, WebSearch\n---\n\nBạn là người tra cứu cho dự án SSH Desk. PM (agent chính) giao câu hỏi; bạn trả lời bằng bằng chứng.\n\nNguyên tắc:\n- Không sửa, tạo hay xoá file trong repo. Thử nghiệm (nếu cần) chỉ làm trong thư mục tạm dưới `$TMPDIR`.\n- Không kết nối server thật. Lệnh như `ssh -G` chỉ chạy với file config tạm do bạn tự tạo, không chạy với `~/.ssh/config` của người dùng (có thể chứa `Match exec`).\n- Không đọc nội dung private key.\n- Phân biệt rõ: điều **đã kiểm chứng trên máy** (kèm lệnh và output), điều **tài liệu nói** (kèm URL), và điều **suy đoán**.\n\nBáo cáo ngắn gọn, tiếng Việt, đi thẳng vào câu trả lời. Trích code bằng `đường/dẫn:dòng`.\n"}, ".claude/skills/ssh-desk-delivery/SKILL.md": {"group": "Tài liệu · cấu hình", "text": "---\nname: ssh-desk-delivery\ndescription: Quy trình giao việc của đội SSH Desk (ý tưởng: product-advisor → người dùng chọn → pm → coder → qa-reviewer → PM duyệt/commit; doc-writer cho tài liệu; researcher tra cứu). Dùng khi làm tiếp tính năng/bước trong plan.md, sửa theo phản hồi người dùng, \"làm nốt việc còn lại\", chạy lại QA, cập nhật hoặc viết lại tài liệu (README, KNOWN_LIMITATIONS…). Không dùng cho câu hỏi đơn giản trả lời trực tiếp được.\n---\n\n# Giao việc SSH Desk\n\n**Kiểu chạy:** giao cho subagent (`Agent` với `subagent_type`, chạy nền). Các agent không nói chuyện với nhau; PM nhận báo cáo và chuyển tiếp.\n\n## Vì sao có quy trình này\nMột thư mục làm việc, một `.build` dùng chung. Hai agent cùng build hoặc cùng sửa một file sẽ đè nhau. Worktree tạo từ `main`, không phải từ nhánh đang làm (xem CLAUDE.md), nên coder làm thẳng trên nhánh, **mỗi lúc chỉ một coder**. Quyết định nằm trong `docs/architecture.md`, nên agent đọc ADR thay vì đoán.\n\n## Ý tưởng và tư vấn: `product-advisor`\n- Khi người dùng xin ý tưởng, roadmap hoặc hỏi \"nên thêm gì\": giao `product-advisor`. Nếu cần lưu lại thì nhờ ghi `docs/ideas.md`.\n- Agent chính trình bày lại cho người dùng và hỏi họ chọn. Chỉ ý tưởng được người dùng chọn mới chuyển sang PM.\n\n## Điều phối: `pm`\n- Việc triển khai có thể giao trọn cho agent `pm`; nó làm các bước 0–4 bên dưới.\n- Nếu subagent không gọi được `Agent` (không lồng được), `pm` trả về kế hoạch giao việc và agent chính chạy theo kế hoạch đó.\n\n## 0. Trước khi giao\n1. Đọc `progress.md` và `plan.md` để biết bước nào `[ ]` (chưa làm) và bước nào `[~]` (code xong, chờ thử).\n2. Có quyết định mới thì PM ghi ADR trước rồi commit. Nếu người dùng chỉ muốn chạy lại một phần (vd \"chỉ QA lại D4\"), chỉ giao đúng phần đó.\n\n## 1. Code — `coder`\n- Prompt gồm: ADR cần đọc, số migration kế tiếp, các việc theo thứ tự, \"làm trực tiếp trên nhánh, không worktree, không commit\", và lệnh `perl -e 'alarm 550; exec @ARGV' make check`.\n- Mỗi lúc chỉ một coder.\n\n## 2. Tài liệu — `doc-writer` (chạy song song với coder được)\n- Chỉ đụng file `.md` và không build, nên không xung đột với coder.\n- D3 gồm: `README.md` (cài bằng `make install`, tính năng, cách dùng nhanh), `docs/OVERVIEW.md` (KHÔNG đặt tên ARCHITECTURE.md: macOS không phân biệt hoa/thường, sẽ ghi đè architecture.md) (bản đọc dễ của architecture.md: module, luồng SSH config/Warp/askpass/ControlMaster), `docs/TESTING.md` (`make check`, plugin-path, sshd tạm, kịch bản thử tay), `docs/KNOWN_LIMITATIONS.md` (gom mọi \"Rủi ro chấp nhận\" và \"Chưa kiểm chứng\" trong ADR).\n- Khi tính năng mới vào sau, giao doc-writer cập nhật lại các file liên quan.\n\n## 3. QA — `qa-reviewer`\n- Giao sau khi coder báo xong. Truyền phạm vi (file/diff) và ADR liên quan, và nói rõ có được chạy `make check` không (chỉ khi không có coder nào đang chạy).\n- Checklist nằm ở `references/qa-checklist.md`.\n- Mục \"Chặn\": giao lại cho coder (SendMessage tới coder vừa làm nếu còn ngữ cảnh, nếu không thì tạo coder mới kèm danh sách phát hiện), sau đó QA lại.\n\n## 4. PM duyệt\n- Tự chạy `make check`, xem qua phần diff nhạy cảm (argv, SQL, Keychain, file ghi ra).\n- Ghi \"Đã làm (…, PM duyệt)\" vào ADR. Cập nhật `plan.md` (`[~]` nếu còn chờ người dùng thử) và `progress.md`. Commit có dòng Co-Authored-By.\n- Push hoặc mở PR chỉ khi người dùng yêu cầu.\n\n## Lỗi\n- Agent báo `make check` đỏ hoặc bỏ dở: PM xem `git status` / `git diff`, rồi giao tiếp đúng chỗ dở cho một coder mới, nêu rõ việc đã xong. Không tự đoán phần agent chưa báo.\n- Hết hạn mức hoặc bị từ chối quyền: không thử lại. Ghi phần còn dở vào `progress.md` và báo người dùng.\n- `make check` treo: lệnh đã bọc `alarm`. Treo lặp lại thì ghi vào progress.md và kiểm `TempSshd`.\n\n## Test thử quy trình\n- Đường chạy bình thường: \"làm nốt D4\" → coder (D4) → qa-reviewer (D4, được chạy make check) → PM commit; doc-writer cập nhật KNOWN_LIMITATIONS nếu D4 có giới hạn mới.\n- Đường lỗi: QA báo \"Chặn\" vì cài đặt tắt tự điền nhưng askpass vẫn trả password → giao lại coder kèm `file:dòng` → QA lại → mới commit.\n"}, ".claude/skills/ssh-desk-delivery/references/qa-checklist.md": {"group": "Tài liệu · cấu hình", "text": "# Checklist QA — SSH Desk\n\n## Bảo mật (mục nào vi phạm là \"Chặn\")\n- Password/passphrase/OTP chỉ nằm trong Keychain. Không được xuất hiện trong argv, env (env chỉ chứa *tham chiếu*), log, SQLite, URI, TOML, `.rdp`, file xuất, chuỗi lỗi hiển thị.\n- Ngoại lệ duy nhất là ADR-018: clipboard cho password **Windows**, có Concealed+Transient, tự xoá theo hạn, xoá khi thoát app. Host SSH thì không bao giờ dùng clipboard.\n- Tự điền theo `PasswordAutofillPolicy` / `AskpassDecision`: host có `jumpHostID` không bao giờ được điền; host managed chỉ điền khi prompt khớp user@hostName; mỗi phiên chỉ điền một lần; cài đặt tắt tự điền phải được tôn trọng ở **mọi** đường (PTY, askpass, clipboard Windows).\n- Process: dùng executable + argv, không dùng `sh -c` với input. Lệnh chạy trên server (Analyst/Monitor) là chuỗi hằng trong whitelist; chỗ duy nhất được ghép là số/IP đã validate.\n- Không `StrictHostKeyChecking=no`, không `sudo`, không đọc private key, không sửa `~/.ssh/config` hay Tab Config không có tiền tố `sshdesk_`.\n- Giá trị ghi vào SSH config / `.rdp` / TOML: không có newline hoặc ký tự điều khiển (chống chèn directive).\n- SQL: chỉ dùng bind tham số.\n- File app ghi ra: ghi atomically, quyền phù hợp (0600 cho file có metadata), đường dẫn nằm trong thư mục của app.\n\n## Đúng ADR\n- Hành vi khớp mục \"Đã chốt\" của ADR liên quan. Lệch thì phải có trong báo cáo coder và PM duyệt.\n- Migration đánh số liên tiếp, không sửa migration cũ.\n\n## Nối UI ↔ Core\n- Mỗi cài đặt hoặc tuỳ chọn trên UI được lưu **và** được nơi dùng đọc lại. Lần theo tới argv/hằng số thật.\n- Vòng đời: rời màn, thoát app, xoá host thì dừng process, đóng phiên, xoá clipboard đúng như ADR-022.\n- Không dùng `@State` (phải dùng `@Local`), UI tiếng Việt, View mỏng, logic đặt trong Core.\n\n## Test\n- Logic mới trong Core có test, gồm ca biên và ca chèn ký tự.\n- Test không kết nối server thật (chỉ sshd tạm trên 127.0.0.1), dọn process và file tạm sau khi chạy.\n"}, "CLAUDE.md": {"group": "Tài liệu · cấu hình", "text": "# SSH Desk\n\nApp macOS native (cá nhân) quản lý hồ sơ máy chủ, mở SSH trong Warp, upload/download qua OpenSSH.\n- Yêu cầu gốc đầy đủ: `CLAUDE_CODE_SSH_DESK_PROMPT.md` (đọc theo mục khi cần, không đọc hết mỗi lần).\n- `docs/spec.md` (tóm tắt phạm vi), `docs/architecture.md` (quyết định đã chốt), `plan.md` / `progress.md` (đang ở đâu).\n\n## Đầu / cuối mỗi phiên\n1. Đọc `progress.md` để biết đang dừng ở bước nào.\n2. Cuối phiên: đánh dấu bước xong trong `plan.md`, ghi tóm tắt vào `progress.md`.\n\n## Đội và quy trình\n- **Agent chính (Opus) = PM:** chốt quyết định, chia task, giao việc, review diff, approve. Không tự viết code tính năng.\n- **`coder` (Sonnet):** viết code + test theo task.\n- **`researcher` (Haiku):** đọc file, tra tài liệu, kiểm chứng hành vi công cụ bằng lệnh chỉ đọc.\n- **`qa-reviewer` (Sonnet):** kiểm tra phần coder vừa làm theo checklist bảo mật/ADR, chỉ đọc.\n- **`pm` (Opus):** điều phối triển khai theo skill `ssh-desk-delivery` (ADR → coder → QA → commit).\n- **`product-advisor` (Fable):** tư vấn sản phẩm, đề xuất ý tưởng và roadmap, không triển khai.\n- **`doc-writer` (Sonnet):** viết tài liệu `.md`, không đụng code, chạy song song với coder được.\n- Quyết định mới hoặc đổi quyết định → PM ghi vào `docs/architecture.md` trước, rồi mới giao code.\n- Task chỉ được tính xong khi PM đã review và `make check` xanh.\n- Agent chạy với `isolation: worktree` được tạo từ **`main`**, không phải nhánh hiện tại → chỉ dùng worktree khi việc không đụng file đã đổi trên nhánh chưa merge, hoặc merge nhánh vào `main` trước.\n\n## Lệnh\n- `make check` — lint + build + test. **Phải xanh trước khi báo xong việc.**\n- `make test` / `make build` / `make lint` / `make format` / `make run`\n- `make install` — build `.app` rồi cài vào `/Applications/SSH Desk.app` (người dùng mở bằng icon). Phải thoát app trước.\n- Không gọi thẳng `swift test`: máy chỉ có Command Line Tools, Makefile thêm cờ plugin cho Swift Testing.\n\n## Stack & cấu trúc\n- Swift 6, SwiftUI (+ AppKit khi cần), SwiftPM. Không có .xcodeproj, không có Xcode.app.\n- `Sources/SSHDeskCore/` — logic thuần (model, SQLite, sinh SSH config/Tab Config, process runner, queue). Không import SwiftUI.\n- `Sources/SSHDesk/` — UI SwiftUI, chỉ gọi vào SSHDeskCore.\n- **UI: không dùng `@State`** (là macro, CLT thiếu plugin `SwiftUIMacros` → lỗi build). Dùng `@Local` (`Sources/SSHDesk/LocalState.swift`). `@Observable`, `@Bindable`, `@Environment` dùng bình thường.\n- `Tests/SSHDeskCoreTests/` — Swift Testing (`import Testing`, `@Test`, `#expect`). Không dùng XCTest (không có trên máy).\n\n## Quy ước\n- Logic mới đặt trong SSHDeskCore và có test; View giữ mỏng.\n- Format theo `.swift-format` (hook tự chạy sau khi sửa file .swift).\n- UI, comment, doc viết tiếng Việt.\n\n## Không được làm\n- Không đưa password/passphrase/OTP vào file, SQLite, log, argv, env, URI, clipboard — chỉ Keychain.\n- Không chạy process qua `sh -c` với input người dùng; dùng executable + argv.\n- Không sửa `~/.ssh/config` hay Tab Config của người dùng; chỉ ghi file app sở hữu (`sshdesk_*`).\n- Không kết nối server thật, không `StrictHostKeyChecking=no`, không commit/push nếu chưa được yêu cầu.\n- Không tự thêm dependency bên ngoài; không đổi quyết định trong `docs/architecture.md` mà không qua PM.\n\n## Harness: giao việc SSH Desk\n**Mục tiêu:** làm tiếp các bước trong plan.md qua đội agent mà không đè nhau.\n**Khi nào dùng:** làm tiếp tính năng, sửa theo phản hồi, chạy lại QA, viết hoặc cập nhật tài liệu → dùng skill `ssh-desk-delivery`. Câu hỏi đơn giản thì trả lời trực tiếp.\n\n| Ngày | Thay đổi | Đối tượng | Lý do |\n| --- | --- | --- | --- |\n| 2026-10-22 | Thêm `qa-reviewer`, `doc-writer`, skill `ssh-desk-delivery` | agents, skills | Người dùng yêu cầu thêm agent để làm nốt việc còn lại |\n| 2026-10-22 | Thêm `pm` (Opus) và `product-advisor` (Fable) | agents, skill | Người dùng cần PM chuyên điều phối và chuyên gia tư vấn và ý tưởng |\n"}, "Makefile": {"group": "Tài liệu · cấu hình", "text": ".PHONY: build test lint format check run app install template diagrams code-map\n\n# Máy chỉ có Command Line Tools (không có Xcode.app): SwiftPM không tự nạp macro plugin\n# của Swift Testing, nên phải trỏ thủ công. Có Xcode đầy đủ thì biến này vô hại.\nCLT_TESTING_PLUGINS := /Library/Developer/CommandLineTools/usr/lib/swift/host/plugins/testing\nTEST_FLAGS := $(if $(wildcard $(CLT_TESTING_PLUGINS)),-Xswiftc -plugin-path -Xswiftc $(CLT_TESTING_PLUGINS))\n\nbuild:\n\tswift build\n\ntest:\n\tswift test $(TEST_FLAGS)\n\nlint:\n\tswift format lint --strict --recursive Sources Tests Package.swift\n\nformat:\n\tswift format --in-place --recursive Sources Tests Package.swift\n\n# Vòng phản hồi duy nhất: phải xanh trước khi báo \"xong\".\ncheck: lint build test\n\nrun:\n\tswift run SSHDesk\n\n# Đóng gói bản release thành build/SSH Desk.app.\n# Ký bằng chứng chỉ Code Signing tự tạo: make app SIGN_IDENTITY=\"SSH Desk Local\" (hoặc export SSHDESK_SIGN_IDENTITY).\n# Không có thì ký ad-hoc và cảnh báo (ADR-023).\n# Giá trị đi qua môi trường (export ở cấp Makefile), không nội suy vào dòng lệnh shell.\n# Giới hạn: make vẫn mở rộng `$` trong giá trị; tên chứa `$` hãy đặt bằng biến môi trường thay vì SIGN_IDENTITY=.\nSIGN_IDENTITY ?=\nifneq ($(SIGN_IDENTITY),)\nexport SSHDESK_SIGN_IDENTITY := $(SIGN_IDENTITY)\nendif\napp:\n\t./scripts/build-app.sh\n\n# Cài vào /Applications để mở bằng icon (Launchpad/Spotlight/Dock). Chạy lại để cập nhật.\nINSTALL_APP := /Applications/SSH Desk.app\ninstall: app\n\t@if pgrep -xq SSHDesk; then echo \"SSH Desk đang chạy — thoát app (⌘Q) rồi chạy lại make install.\"; exit 1; fi\n\t@if [ -e \"$(INSTALL_APP)\" ]; then rm -r \"$(INSTALL_APP)\"; fi\n\tditto \"build/SSH Desk.app\" \"$(INSTALL_APP)\"\n\t@echo \"Đã cài $(INSTALL_APP)\"\n\n# Sinh lại file Excel mẫu trong repo (ADR-026). Đường dẫn cố định, không nhận input người dùng; xoá đúng file đó trước\n# vì `sshdesk-cli template` không bao giờ ghi đè.\nTEMPLATE_PATH := docs/templates/sshdesk-hosts-template.xlsx\nTEMPLATE_TMP := build/sshdesk-template-tmp.xlsx\ntemplate:\n\t@mkdir -p docs/templates build\n\t@rm -f -- \"$(TEMPLATE_TMP)\"\n\tswift run sshdesk-cli template \"$(TEMPLATE_TMP)\"\n\t@mv -f -- \"$(TEMPLATE_TMP)\" \"$(TEMPLATE_PATH)\"\n\n# Sinh lại 4 sơ đồ draw.io trong docs/diagrams (sửa bố cục ở scripts/diagrams/gen_diagrams.py).\ndiagrams:\n\tpython3 scripts/diagrams/gen_diagrams.py docs/diagrams\n\n# Sinh lại bản đồ code docs/code-map/index.html (bấm khối → xem đúng đoạn source). Chỉ cần python3.\n# Báo lỗi nếu một khối trỏ tới hàm/file không còn → sửa VIEWS trong scripts/code-map/build.py.\ncode-map:\n\tpython3 scripts/code-map/build.py\n"}, "Sources/AskpassKit/AskpassDecision.swift": {"group": "Helper · AskpassKit", "text": "/// Hằng số dùng chung giữa app và helper `sshdesk-askpass`.\npublic enum CredentialConstants {\n    /// Service của generic password trong Keychain; account = credentialReference.\n    public static let service = \"local.sshdesk.credentials\"\n    /// Biến môi trường chứa THAM CHIẾU (không phải password).\n    public static let hostRefEnv = \"SSHDESK_HOST_REF\"\n    /// THAM CHIẾU passphrase của key lấy từ bộ đăng nhập (`setkey-<uuid>`, ADR-030). Không phải secret.\n    public static let keyRefEnv = \"SSHDESK_KEY_REF\"\n    /// Đường dẫn key (đã tuyệt đối) mà passphrase thuộc về. Không phải secret.\n    public static let keyPathEnv = \"SSHDESK_KEY_PATH\"\n    /// Tiến trình cha duy nhất được phép nhận password.\n    public static let trustedParent = \"/usr/bin/ssh\"\n}\n\n/// Loại câu hỏi mà ssh gửi qua SSH_ASKPASS.\npublic enum AskpassPromptClass: Equatable, Sendable {\n    /// Câu hỏi password của tài khoản (`user@host's password:` hoặc `(user@host) Password:` của keyboard-interactive).\n    case password\n    /// `Enter passphrase for key '<path>':` — prompt passphrase của ssh cho một file key cụ thể (ADR-030).\n    case keyPassphrase(path: String)\n    /// Bí mật khác: passphrase không rõ key, OTP, mã xác minh... (tắt echo).\n    case secret\n    /// yes/no (host key...) — giữ echo.\n    case confirm\n    /// Chỉ là thông báo, không cần trả lời.\n    case info\n}\n\npublic enum AskpassAction: Equatable, Sendable {\n    /// Trả password đã lưu cho ssh.\n    case answerFromKeychain(ref: String)\n    /// Trả passphrase của key (bộ đăng nhập) cho ssh, chỉ khi prompt khớp đúng path.\n    case answerPassphraseFromKeychain(ref: String)\n    /// Hỏi người dùng trên /dev/tty.\n    case askTTY(echo: Bool)\n    /// Hiển thị trên tty, không đọc gì (SSH_ASKPASS_PROMPT=none).\n    case showOnly\n}\n\n/// Pure: phân loại prompt và quyết định có được trả password Keychain hay không.\npublic enum AskpassDecision {\n    public static func classify(prompt: String, promptType: String?) -> AskpassPromptClass {\n        switch promptType?.lowercased() {\n        case \"confirm\": return .confirm\n        case \"none\": return .info\n        default: break\n        }\n        if let path = PassphrasePrompt.keyPath(in: prompt) { return .keyPassphrase(path: path) }\n        let lower = prompt.lowercased()\n        if lower.contains(\"yes/no\") || lower.contains(\"continue connecting\") { return .confirm }\n        if isAccountPasswordPrompt(lower) { return .password }\n        return .secret\n    }\n\n    /// `claimUse` chỉ được gọi khi mọi điều kiện khác đã đủ, và phải \"đánh dấu đã dùng\" một cách\n    /// nguyên tử (trả true nếu đây là lần đầu cho tiến trình ssh cha này).\n    public static func decide(\n        prompt: String, promptType: String?, hostRef: String?, parentPath: String?,\n        claimUse: () -> Bool\n    ) -> AskpassAction {\n        decide(\n            prompt: prompt, promptType: promptType, hostRef: hostRef, keyRef: nil, keyPath: nil,\n            parentPath: parentPath, claimUse: claimUse, claimKeyUse: { false })\n    }\n\n    /// Như trên, thêm passphrase của key (ADR-030): chỉ trả khi prompt đúng `Enter passphrase for key '<path>':`,\n    /// `<path>` trùng `keyPath` (ssh cắt path ở 100 byte), cha là `/usr/bin/ssh` và đây là lần đầu\n    /// (marker riêng `claimKeyUse`, độc lập với password). Prompt passphrase không khớp luôn hỏi trên tty.\n    public static func decide(\n        prompt: String, promptType: String?, hostRef: String?, keyRef: String?, keyPath: String?,\n        parentPath: String?, claimUse: () -> Bool, claimKeyUse: () -> Bool\n    ) -> AskpassAction {\n        switch classify(prompt: prompt, promptType: promptType) {\n        case .info: return .showOnly\n        case .confirm: return .askTTY(echo: true)\n        case .secret: return .askTTY(echo: false)\n        case .keyPassphrase(let path):\n            guard parentPath == CredentialConstants.trustedParent,\n                let keyRef, !keyRef.isEmpty, let keyPath,\n                PassphrasePrompt.pathMatches(promptPath: path, keyPath: keyPath),\n                claimKeyUse()\n            else { return .askTTY(echo: false) }\n            return .answerPassphraseFromKeychain(ref: keyRef)\n        case .password:\n            guard parentPath == CredentialConstants.trustedParent,\n                let ref = hostRef, !ref.isEmpty, claimUse()\n            else { return .askTTY(echo: false) }\n            return .answerFromKeychain(ref: ref)\n        }\n    }\n\n    /// Bỏ ký tự điều khiển/escape (giữ xuống dòng, vì prompt host key nhiều dòng) để prompt từ server không điều khiển được terminal.\n    public static func sanitizeForDisplay(_ s: String) -> String {\n        var out = String.UnicodeScalarView()\n        for scalar in s.unicodeScalars {\n            let v = scalar.value\n            if v == 0x0A {\n                out.append(scalar)\n            } else if v == 0x09 {\n                out.append(\" \")\n            } else if v < 0x20 || v == 0x7F || (0x80...0x9F).contains(v) {\n                continue\n            } else {\n                out.append(scalar)\n            }\n        }\n        return String(out)\n    }\n\n    // MARK: - Nội bộ\n\n    private static let forbiddenSubstrings = [\n        \"passphrase\", \"verification\", \"passcode\", \"one-time\", \"onetime\", \"token\", \"new password\",\n        \"retype\", \"re-enter\", \"again\", \"confirm\",\n    ]\n\n    private static func isAccountPasswordPrompt(_ lower: String) -> Bool {\n        var s = Substring(lower)\n        while let last = s.last, last == \" \" || last == \"\\t\" { s = s.dropLast() }\n        guard s.hasSuffix(\"password:\") else { return false }\n        for f in forbiddenSubstrings where lower.contains(f) { return false }\n        // \"otp\" chỉ tính khi là cả từ (tránh hostname như \"hotpot\").\n        let words = lower.split(whereSeparator: { !($0.isLetter || $0.isNumber) })\n        if words.contains(\"otp\") { return false }\n        return true\n    }\n}\n\n/// Prompt passphrase của ssh cho một file key (ADR-030). OpenSSH 10.3 in\n/// `Enter passphrase for key '%.100s': ` — path được cắt ở 100 BYTE và giữ nguyên văn (không mở rộng `~`\n/// ở phía prompt; app luôn ghi path tuyệt đối vào config nên path trong prompt = path trong config).\npublic enum PassphrasePrompt {\n    static let prefix = \"Enter passphrase for key '\"\n    static let suffix = \"':\"\n    /// ssh cắt path trong prompt ở đây (`%.100s`).\n    public static let maxPathBytes = 100\n\n    /// Path trong prompt đúng dạng `Enter passphrase for key '<path>':` (khoảng trắng cuối bị bỏ). Dạng khác → nil.\n    public static func keyPath(in prompt: String) -> String? {\n        var s = Substring(prompt)\n        while let last = s.last, last == \" \" || last == \"\\t\" || last == \"\\n\" { s = s.dropLast() }\n        guard s.hasPrefix(prefix), s.hasSuffix(suffix), s.count >= prefix.count + suffix.count\n        else { return nil }\n        let inner = s.dropFirst(prefix.count).dropLast(suffix.count)\n        return String(inner)\n    }\n\n    /// `promptPath` phải đúng bằng `keyPath` (sau khi cắt 100 byte như ssh). `keyPath` rỗng/không tuyệt đối → false.\n    public static func pathMatches(promptPath: String, keyPath: String) -> Bool {\n        guard keyPath.hasPrefix(\"/\"), !promptPath.isEmpty else { return false }\n        let bytes = Array(keyPath.utf8)\n        let expected =\n            bytes.count <= maxPathBytes ? keyPath : String(decoding: bytes.prefix(maxPathBytes), as: UTF8.self)\n        return Array(promptPath.utf8) == Array(expected.utf8)\n    }\n\n    /// Prompt có thuộc về đúng key này không (dùng cho PTY và Core).\n    public static func matches(prompt: String, keyPath: String) -> Bool {\n        guard let p = Self.keyPath(in: prompt) else { return false }\n        return pathMatches(promptPath: p, keyPath: keyPath)\n    }\n}\n"}, "Sources/CredentialBackend/CredentialSealing.swift": {"group": "Helper · CredentialBackend", "text": "import CryptoKit\nimport Foundation\nimport Security\n\n/// Lỗi seal/mở ciphertext. Không chứa dữ liệu bí mật.\npublic enum SealingError: Error, Equatable, Sendable {\n    case badFormat\n    case unsupportedVersion\n    case authenticationFailed\n    case keyFailure\n}\n\n/// Khoá ECDH P-256 dùng để seal/mở (ADR-004c): chỉ cần khoá công khai + thoả thuận khoá.\n/// Cài đặt thật là Secure Enclave; bản phần mềm chỉ dùng cho test.\npublic protocol SealingKey: Sendable {\n    var publicKey: P256.KeyAgreement.PublicKey { get }\n    func sharedSecret(with peer: P256.KeyAgreement.PublicKey) throws -> SharedSecret\n}\n\n/// Khoá phần mềm (chỉ test).\npublic struct SoftwareSealingKey: SealingKey {\n    private let privateKey: P256.KeyAgreement.PrivateKey\n    public init(privateKey: P256.KeyAgreement.PrivateKey = P256.KeyAgreement.PrivateKey()) {\n        self.privateKey = privateKey\n    }\n    public var publicKey: P256.KeyAgreement.PublicKey { privateKey.publicKey }\n    public func sharedSecret(with peer: P256.KeyAgreement.PublicKey) throws -> SharedSecret {\n        try privateKey.sharedSecretFromKeyAgreement(with: peer)\n    }\n}\n\n/// Khoá Secure Enclave: chỉ `.privateKeyUsage`, `ThisDeviceOnly`, KHÔNG userPresence (ADR-004c).\npublic struct SecureEnclaveSealingKey: SealingKey, @unchecked Sendable {\n    private let privateKey: SecureEnclave.P256.KeyAgreement.PrivateKey\n\n    public static func generate() throws -> SecureEnclaveSealingKey {\n        var error: Unmanaged<CFError>?\n        guard\n            let acl = SecAccessControlCreateWithFlags(\n                nil, kSecAttrAccessibleWhenUnlockedThisDeviceOnly, [.privateKeyUsage], &error)\n        else { throw SealingError.keyFailure }\n        do {\n            return SecureEnclaveSealingKey(\n                privateKey: try SecureEnclave.P256.KeyAgreement.PrivateKey(accessControl: acl))\n        } catch { throw SealingError.keyFailure }\n    }\n\n    public init(blob: Data) throws {\n        do {\n            privateKey = try SecureEnclave.P256.KeyAgreement.PrivateKey(dataRepresentation: blob)\n        } catch { throw SealingError.keyFailure }\n    }\n\n    private init(privateKey: SecureEnclave.P256.KeyAgreement.PrivateKey) { self.privateKey = privateKey }\n\n    /// Handle do SE bọc (không phải khoá thô) — lưu vào Keychain.\n    public var blob: Data { privateKey.dataRepresentation }\n    public var publicKey: P256.KeyAgreement.PublicKey { privateKey.publicKey }\n    public func sharedSecret(with peer: P256.KeyAgreement.PublicKey) throws -> SharedSecret {\n        try privateKey.sharedSecretFromKeyAgreement(with: peer)\n    }\n}\n\n/// Seal/mở định dạng v1: `0x01 ‖ ephPub x963 (65) ‖ AES.GCM.combined`.\n/// HKDF-SHA256(salt = ephPub, info = \"sshdesk-credential-v1\"), AAD = \"sshdesk-v1|<ref>\".\npublic enum CredentialSealing {\n    public static let version: UInt8 = 1\n    static let ephemeralLength = 65\n    /// version + ephPub + nonce 12 + tag 16.\n    static let minimumLength = 1 + ephemeralLength + 12 + 16\n    static let info = Data(\"sshdesk-credential-v1\".utf8)\n\n    static func aad(_ ref: String) -> Data { Data((\"sshdesk-v1|\" + ref).utf8) }\n\n    private static func symmetricKey(_ shared: SharedSecret, ephPub: Data) -> SymmetricKey {\n        shared.hkdfDerivedSymmetricKey(\n            using: SHA256.self, salt: ephPub, sharedInfo: info, outputByteCount: 32)\n    }\n\n    public static func seal(_ secret: String, ref: String, key: any SealingKey) throws -> Data {\n        let eph = P256.KeyAgreement.PrivateKey()\n        let ephPub = eph.publicKey.x963Representation\n        do {\n            let shared = try eph.sharedSecretFromKeyAgreement(with: key.publicKey)\n            let box = try AES.GCM.seal(\n                Data(secret.utf8), using: symmetricKey(shared, ephPub: ephPub),\n                authenticating: aad(ref))\n            guard let combined = box.combined else { throw SealingError.keyFailure }\n            return Data([version]) + ephPub + combined\n        } catch { throw SealingError.keyFailure }\n    }\n\n    public static func open(_ data: Data, ref: String, key: any SealingKey) throws -> String {\n        let bytes = Data(data)  // chuẩn hoá chỉ số\n        guard bytes.count >= minimumLength else { throw SealingError.badFormat }\n        guard bytes[0] == version else { throw SealingError.unsupportedVersion }\n        let ephPub = Data(bytes[1..<(1 + ephemeralLength)])\n        let combined = Data(bytes[(1 + ephemeralLength)...])\n        do {\n            let peer = try P256.KeyAgreement.PublicKey(x963Representation: ephPub)\n            let shared = try key.sharedSecret(with: peer)\n            let box = try AES.GCM.SealedBox(combined: combined)\n            let plain = try AES.GCM.open(\n                box, using: symmetricKey(shared, ephPub: ephPub), authenticating: aad(ref))\n            guard let text = String(data: plain, encoding: .utf8) else { throw SealingError.badFormat }\n            return text\n        } catch let e as SealingError {\n            throw e\n        } catch { throw SealingError.authenticationFailed }\n    }\n}\n"}, "Sources/CredentialBackend/SecureEnclaveBackend.swift": {"group": "Helper · CredentialBackend", "text": "import CryptoKit\nimport Foundation\n\n/// Lỗi của backend Secure Enclave. Không chứa dữ liệu bí mật.\npublic enum SecureEnclaveBackendError: Error, Equatable, Sendable {\n    case unavailable\n    case invalidAccount\n    case keychain(Int32)\n    case sealing\n    case keyUnreadable\n\n    public var message: String {\n        switch self {\n        case .unavailable: return \"Máy này không có Secure Enclave — không lưu được mật khẩu\"\n        case .invalidAccount: return \"Tham chiếu Keychain không hợp lệ.\"\n        case .keychain(let s): return \"Keychain: \\(KeychainBackendError.message(for: s)) (\\(s))\"\n        case .keyUnreadable: return \"Không mở được khoá trong Keychain — thử lại\"\n        case .sealing: return \"Không mã hoá được mật khẩu bằng Secure Enclave.\"\n        }\n    }\n}\n\n/// Trạng thái một mục (ADR-004c).\npublic enum SealedItemStatus: Sendable, Equatable {\n    case missing, present, undecryptable\n}\n\n/// Nơi cấp khoá: SE thật hoặc khoá phần mềm (test).\npublic protocol SealingKeyProvider: Sendable {\n    var isAvailable: Bool { get }\n    /// Tạo khoá mới, trả khoá và blob để lưu.\n    func generate() throws -> (key: any SealingKey, blob: Data)\n    func restore(blob: Data) throws -> any SealingKey\n}\n\npublic struct SecureEnclaveKeyProvider: SealingKeyProvider {\n    public init() {}\n    public var isAvailable: Bool { SecureEnclave.isAvailable }\n    public func generate() throws -> (key: any SealingKey, blob: Data) {\n        let key = try SecureEnclaveSealingKey.generate()\n        return (key, key.blob)\n    }\n    public func restore(blob: Data) throws -> any SealingKey { try SecureEnclaveSealingKey(blob: blob) }\n}\n\n/// Kết quả migration một lượt. Không chứa giá trị bí mật.\npublic struct SealedMigrationReport: Sendable, Equatable {\n    public var migrated = 0\n    public var skipped = 0\n    public var failed = 0\n    public init() {}\n}\n\n/// Backend secret DUY NHẤT (ADR-004c): ECIES với khoá Secure Enclave. Item blob khoá ở service `sekey`\n/// (account `default`), ciphertext ở service `sealed` (account = tham chiếu). Không bao giờ đọc/ghi plaintext\n/// ngoài `migrateLegacy`. App và helper `sshdesk-askpass` dùng chung mã này.\npublic final class SecureEnclaveBackend: @unchecked Sendable {\n    public static let keyService = \"local.sshdesk.sekey\"\n    public static let sealedService = \"local.sshdesk.sealed\"\n    public static let keyAccount = \"default\"\n\n    private let keyStorage: any SecretItemStorage\n    private let sealedStorage: any SecretItemStorage\n    private let legacyStorage: any SecretItemStorage\n    private let provider: any SealingKeyProvider\n    private let lock = NSLock()\n\n    public init(\n        keyStorage: any SecretItemStorage, sealedStorage: any SecretItemStorage,\n        legacyStorage: any SecretItemStorage, provider: any SealingKeyProvider\n    ) {\n        self.keyStorage = keyStorage\n        self.sealedStorage = sealedStorage\n        self.legacyStorage = legacyStorage\n        self.provider = provider\n    }\n\n    /// Cấu hình thật. Service đổi được để test không đụng item của người dùng.\n    public convenience init(\n        keyService: String = SecureEnclaveBackend.keyService,\n        sealedService: String = SecureEnclaveBackend.sealedService,\n        legacyService: String = KeychainBackend.defaultService,\n        trustedApplicationPaths: [String] = [],\n        provider: any SealingKeyProvider = SecureEnclaveKeyProvider()\n    ) {\n        self.init(\n            keyStorage: KeychainBackend(service: keyService, trustedApplicationPaths: trustedApplicationPaths),\n            sealedStorage: KeychainBackend(\n                service: sealedService, trustedApplicationPaths: trustedApplicationPaths),\n            legacyStorage: KeychainBackend(\n                service: legacyService, trustedApplicationPaths: trustedApplicationPaths),\n            provider: provider)\n    }\n\n    public var isAvailable: Bool { provider.isAvailable }\n\n    // MARK: Khoá\n\n    private func existingKey() -> (any SealingKey)? {\n        guard let blob = keyStorage.readData(account: Self.keyAccount) else { return nil }\n        return try? provider.restore(blob: blob)\n    }\n\n    /// Khoá hiện có; chắc chắn không có item hoặc blob hỏng → tạo khoá mới (ADR-004c). Chỉ gọi khi cần lưu.\n    /// Lỗi đọc blob (ACL từ chối, keychain khoá) → ném lỗi, KHÔNG đụng blob cũ. Blob mới chỉ ghi sau khi\n    /// tạo khoá thành công, và ghi tại chỗ (không xoá trước).\n    private func keyForSaving() throws -> any SealingKey {\n        lock.lock()\n        defer { lock.unlock() }\n        switch keyStorage.readItem(account: Self.keyAccount) {\n        case .error: throw SecureEnclaveBackendError.keyUnreadable\n        case .found(let blob):\n            if let key = try? provider.restore(blob: blob) { return key }\n        case .notFound: break\n        }\n        do {\n            let made = try provider.generate()\n            try keyStorage.saveData(account: Self.keyAccount, data: made.blob, mode: .updateInPlace)\n            return made.key\n        } catch let e as KeychainBackendError {\n            if case .status(let s) = e { throw SecureEnclaveBackendError.keychain(s) }\n            throw SecureEnclaveBackendError.invalidAccount\n        } catch { throw SecureEnclaveBackendError.sealing }\n    }\n\n    // MARK: CRUD\n\n    public func save(account: String, secret: String) throws {\n        try saveSealed(account: account, secret: secret)\n        // Đã có ciphertext hợp lệ: dọn item plaintext cũ cùng ref (bỏ qua lỗi/không có).\n        try? legacyStorage.delete(account: account)\n    }\n\n    private func saveSealed(account: String, secret: String) throws {\n        guard !account.isEmpty else { throw SecureEnclaveBackendError.invalidAccount }\n        guard provider.isAvailable else { throw SecureEnclaveBackendError.unavailable }\n        let key = try keyForSaving()\n        let sealed: Data\n        do { sealed = try CredentialSealing.seal(secret, ref: account, key: key) } catch {\n            throw SecureEnclaveBackendError.sealing\n        }\n        try write(sealed, account: account)\n    }\n\n    private func write(_ sealed: Data, account: String) throws {\n        do { try sealedStorage.saveData(account: account, data: sealed, mode: .replace) } catch let e\n            as KeychainBackendError\n        {\n            if case .status(let s) = e { throw SecureEnclaveBackendError.keychain(s) }\n            throw SecureEnclaveBackendError.invalidAccount\n        }\n    }\n\n    /// Giải mã nếu được. nil nếu thiếu, không giải mã được, hoặc máy không có SE.\n    public func read(account: String) -> String? { open(account: account).value }\n\n    /// Chỉ kiểm tra item sealed có tồn tại (rẻ, không giải mã).\n    public func exists(account: String) -> Bool { sealedStorage.exists(account: account) }\n\n    public func status(account: String) -> SealedItemStatus {\n        let r = open(account: account)\n        return r.status\n    }\n\n    private func open(account: String) -> (status: SealedItemStatus, value: String?) {\n        guard provider.isAvailable else { return (.missing, nil) }\n        guard let sealed = sealedStorage.readData(account: account) else { return (.missing, nil) }\n        guard let key = existingKey(),\n            let text = try? CredentialSealing.open(sealed, ref: account, key: key)\n        else { return (.undecryptable, nil) }\n        return (.present, text)\n    }\n\n    /// Xoá ciphertext và mọi item plaintext cũ còn sót của tham chiếu này. Giữ khoá SE.\n    public func delete(account: String) throws {\n        do {\n            try sealedStorage.delete(account: account)\n            try legacyStorage.delete(account: account)\n        } catch let e as KeychainBackendError {\n            if case .status(let s) = e { throw SecureEnclaveBackendError.keychain(s) }\n            throw SecureEnclaveBackendError.invalidAccount\n        }\n    }\n\n    /// Còn item plaintext cũ cho tham chiếu này không (chỉ hỏi thuộc tính).\n    public func hasLegacy(account: String) -> Bool { legacyStorage.exists(account: account) }\n\n    // MARK: Migration\n\n    /// Chuyển các item plaintext cũ sang sealed (ADR-004c). Chỉ app gọi. Lỗi → giữ item cũ.\n    public func migrateLegacy(accounts: [String]) -> SealedMigrationReport {\n        var report = SealedMigrationReport()\n        for account in Set(accounts).sorted() where !account.isEmpty {\n            if sealedStorage.exists(account: account) {\n                // Đã có sealed mở được → dọn plaintext còn sót.\n                if legacyStorage.exists(account: account), open(account: account).status == .present {\n                    try? legacyStorage.delete(account: account)\n                }\n                report.skipped += 1\n                continue\n            }\n            if !legacyStorage.exists(account: account) {\n                report.skipped += 1\n                continue\n            }\n            if migrateOne(account) { report.migrated += 1 } else { report.failed += 1 }\n        }\n        return report\n    }\n\n    private func migrateOne(_ account: String) -> Bool {\n        guard provider.isAvailable,\n            let data = legacyStorage.readData(account: account),\n            let plain = String(data: data, encoding: .utf8),\n            (try? saveSealed(account: account, secret: plain)) != nil\n        else { return false }\n        // Mở lại và so khớp trước khi xoá plaintext.\n        guard open(account: account).value == plain else {\n            try? sealedStorage.delete(account: account)  // để lần sau thử lại\n            return false\n        }\n        do { try legacyStorage.delete(account: account) } catch { return false }\n        return true\n    }\n}\n"}, "Sources/SSHDesk/AnalystModel.swift": {"group": "Giao diện", "text": "import AppKit\nimport Foundation\nimport Observation\nimport SSHDeskCore\nimport UniformTypeIdentifiers\n\nenum AnalystTab: String, CaseIterable {\n    case servers, map, results, history\n}\n\nenum AnalystSelection: Equatable {\n    case node(UUID)\n    case flow(Flow)\n    /// Mũi tên gộp nhiều cổng cùng (nguồn, đích).\n    case link(source: UUID, destination: UUID)\n}\n\n/// Yêu cầu xác nhận trước khi chạy (có server PROD).\nstruct AnalystProdConfirm: Identifiable {\n    let id = UUID()\n    let message: String\n    let prodNames: [String]\n}\n\n/// Prompt xác thực đang chờ của một server khi Analyst mở phiên.\nstruct AnalystPendingPrompt {\n    let id = UUID()\n    let host: HostProfile\n    let kind: PromptKind\n    let respond: SessionConnector.Respond\n}\n\n/// Trạng thái màn Project Analyst. Quyết định (nhãn, màu, tóm tắt, bố trí) nằm trong SSHDeskCore.\n@MainActor @Observable\nfinal class AnalystModel {\n    weak var app: AppModel?\n\n    private(set) var folder: String?\n    var tab: AnalystTab = .map\n    var mode: AnalystMapMode = .tests\n    var selection: AnalystSelection?\n    /// Chiều cao khung bảng do người dùng kéo (chỉ nhớ trong phiên); `nil` = tự theo nội dung.\n    var tableHeightOverride: Double?\n    /// Thư mục đang mở rộng ở cây PROJECTS (chỉ nhớ trong phiên).\n    var expanded: Set<String> = []\n\n    /// Lần chạy đang hiển thị (mới chạy, mới nhất đã lưu, hoặc lần lịch sử đang xem).\n    private(set) var current: StoredAnalystRun?\n    /// Đang xem một lần chạy cũ (chỉ đọc).\n    private(set) var viewingHistory = false\n    private(set) var history: [AnalystRunSummary] = []\n    private var latestByFolder: [String: StoredAnalystRun] = [:]\n\n    private(set) var progress: AnalystProgress?\n    private(set) var retesting: Flow?\n    var prodConfirm: AnalystProdConfirm?\n    var pendingDelete: AnalystRunSummary?\n    private(set) var pendingPrompt: AnalystPendingPrompt?\n    private var runTask: Task<Void, Never>?\n    private var coordinator: AnalystCoordinator?\n\n    var probeTimeout: ProbeTimeout { app?.settings.analystProbeTimeout ?? .default }\n\n    init(app: AppModel) { self.app = app }\n\n    var isRunning: Bool { runTask != nil }\n\n    // MARK: - Dữ liệu\n\n    var hosts: [HostProfile] {\n        guard let folder, let app else { return [] }\n        return HostPresentation.sortedByName(\n            HostPresentation.sshHosts(app.hosts).filter { $0.project == folder }, ascending: true)\n    }\n\n    /// Máy Windows trong thư mục: chỉ liệt kê, không thu thập.\n    var windowsHosts: [HostProfile] {\n        guard let folder, let app else { return [] }\n        return HostPresentation.sortedByName(\n            HostPresentation.windowsHosts(app.hosts).filter { $0.project == folder },\n            ascending: true)\n    }\n\n    /// Kết nối `f` đang được chọn (trực tiếp hoặc qua mũi tên gộp chứa nó).\n    func isSelected(_ f: Flow) -> Bool {\n        switch selection {\n        case .flow(let x): return x == f\n        case .link(let s, let d): return f.source == s && f.destination == d\n        default: return false\n        }\n    }\n\n    func host(_ id: UUID) -> HostProfile? { app?.hosts.first { $0.id == id } }\n\n    /// Máy có tab Truyền file đang kết nối: Analyst dùng ngay, không cần xác thực lại.\n    func isLive(_ id: UUID) -> Bool {\n        app?.browser?.tabs.contains { $0.hostID == id && $0.state == .connected } ?? false\n    }\n\n    var readyCount: Int { hosts.filter { isLive($0.id) }.count }\n\n    var emptyState: AnalystEmptyState {\n        AnalystPresentation.emptyState(hostCount: hosts.count, run: current)\n    }\n\n    // MARK: - Chọn thư mục\n\n    func select(_ name: String) {\n        app?.sidebar = .analyst\n        guard folder != name else { return }\n        guard !isRunning else {\n            app?.showToast(\"Đang chạy kiểm tra — hãy đợi hoặc huỷ trước khi đổi thư mục\")\n            return\n        }\n        folder = name\n        expanded.insert(name)\n        selection = nil\n        viewingHistory = false\n        current = latestByFolder[name]\n        history = []\n        Task { await refreshHistory(loadLatestIfNeeded: true) }\n    }\n\n    /// Thư mục bị xoá/đổi tên: bỏ chọn (khi không đang chạy).\n    func foldersChanged() {\n        guard let f = folder, !isRunning, !(app?.folders.contains(f) ?? false),\n            !(app?.hosts.contains { $0.project == f } ?? false)\n        else { return }\n        folder = nil\n        current = nil\n        history = []\n        selection = nil\n        viewingHistory = false\n        if app?.sidebar == .analyst { enter() }\n    }\n\n    /// Mở màn: nếu chưa chọn thư mục thì lấy thư mục đầu tiên có máy chủ.\n    func enter() {\n        guard folder == nil || !(app?.folders.contains(folder ?? \"\") ?? false) else { return }\n        if let first = app?.folderCounts.first { select(first.name) }\n    }\n\n    func refreshHistory(loadLatestIfNeeded: Bool = false) async {\n        guard let folder, let repo = app?.analystRepository else { return }\n        do {\n            let list = try await repo.list(folder: folder)\n            guard self.folder == folder else { return }\n            history = list\n            if loadLatestIfNeeded, current == nil, let first = list.first,\n                let run = try await repo.load(id: first.id), self.folder == folder\n            {\n                current = run\n                latestByFolder[folder] = run\n            }\n        } catch { app?.show(error, title: \"Không đọc được lịch sử Project Analyst\") }\n    }\n\n    // MARK: - Chạy\n\n    /// Bấm \"Chạy kiểm tra\": PROD thì hỏi xác nhận trước.\n    func requestRun() {\n        guard !isRunning, let app, !hosts.isEmpty else { return }\n        let servers = hosts.map {\n            ProdGuardServer(\n                hostID: $0.id, displayName: $0.displayName, environment: $0.environment,\n                commands: AnalystCoordinator.collectionCommands)\n        }\n        let prompt = ProdGuard.prompt(for: servers)\n        guard prompt.requiresConfirmation else {\n            startRun()\n            return\n        }\n        let templates = AnalystCommand.probeTemplates(timeout: app.settings.analystProbeTimeout)\n        let probe =\n            \"\\nSau đó, với mỗi kết nối phát hiện, trên server NGUỒN chạy:\\n\"\n            + \"  \\(templates.bash)\\n\"\n            + \"  (dự phòng nếu thiếu bash/timeout) \\(templates.nc)\"\n        prodConfirm = AnalystProdConfirm(\n            message: prompt.message + \"\\n\" + probe, prodNames: prompt.prodNames)\n        _ = app\n    }\n\n    func confirmProd() {\n        prodConfirm = nil\n        startRun()\n    }\n\n    private func startRun() {\n        guard let app, let folder, !isRunning else { return }\n        let hosts = self.hosts\n        guard !hosts.isEmpty else { return }\n        viewingHistory = false\n        selection = nil\n        progress = nil\n        let provider = makeProvider(app: app)\n        let coord = AnalystCoordinator(\n            sessions: provider, repository: app.analystRepository,\n            probeTimeout: app.settings.analystProbeTimeout)\n        coordinator = coord\n        let sink: @Sendable (AnalystProgress) -> Void = { [weak self] p in\n            Task { @MainActor in self?.progress = p }\n        }\n        runTask = Task { [weak self] in\n            defer {\n                self?.runTask = nil\n                self?.progress = nil\n                self?.pendingPrompt = nil\n                self?.coordinator = nil\n                // Mật khẩu không tích lưu chỉ sống tới hết lần chạy (ADR-029).\n                app.ephemeralVault.releaseAll(owner: Self.passwordOwner)\n            }\n            do {\n                try await app.service?.regenerateSSHConfig()\n                // ADR-029: máy chưa lưu mật khẩu -> hỏi tuần tự; huỷ = bỏ qua máy đó.\n                let (runnable, skipped) = await app.preparePasswords(for: hosts, owner: Self.passwordOwner)\n                if !skipped.isEmpty {\n                    app.showToast(\n                        \"Bỏ qua \\(skipped.count) máy chưa nhập mật khẩu: \"\n                            + skipped.map(\\.displayName).joined(separator: \", \"))\n                }\n                guard !runnable.isEmpty else { return }\n                try Task.checkCancellation()\n                let run = try await coord.run(folder: folder, hosts: runnable, progress: sink)\n                guard let self else { return }\n                self.latestByFolder[folder] = run\n                if self.folder == folder {\n                    self.current = run\n                    self.tab = run.topology.flows.isEmpty ? self.tab : .map\n                    await self.refreshHistory()\n                }\n                app.showToast(\n                    \"Xong: \" + AnalystPresentation.summary(run.results)\n                        + (run.warnings.isEmpty ? \"\" : \" · \\(run.warnings.count) cảnh báo\"))\n            } catch is CancellationError {\n                app.showToast(\"Đã huỷ kiểm tra\")\n            } catch {\n                app.show(error, title: \"Không chạy được Project Analyst\")\n            }\n        }\n    }\n\n    func cancelRun() {\n        runTask?.cancel()\n        pendingPrompt = nil\n    }\n\n    /// Thoát app: huỷ lần chạy và đóng phiên Analyst tự mở.\n    func shutdown() async {\n        runTask?.cancel()\n        await coordinator?.finish()\n    }\n\n    private static let passwordOwner = \"analyst\"\n\n    private func makeProvider(app: AppModel) -> PooledAnalystSessions {\n        let vault = app.ephemeralVault\n        let connector = SessionConnector(\n            configPath: app.paths.sshConfigURL.path, credentials: app.autofillCredentials,\n            helper: ControllingTTYHelper.defaultURL(), hostAdjuster: { vault.adjusted($0) })\n        return PooledAnalystSessions(pool: app.sessionPool, connector: connector) {\n            [weak self] host, kind, respond in\n            Task { @MainActor in\n                self?.pendingPrompt = AnalystPendingPrompt(host: host, kind: kind, respond: respond)\n            }\n        }\n    }\n\n    // MARK: - Prompt xác thực\n\n    var activePrompt: ActivePrompt? {\n        guard let p = pendingPrompt else { return nil }\n        return ActivePrompt(\n            id: \"analyst-\" + p.id.uuidString, kind: p.kind,\n            context: \"\\(p.host.displayName) · \\(BrowserTabPresentation.identity(p.host)) (Project Analyst)\",\n            waiting: 0, cancelTitle: \"Huỷ kiểm tra\",\n            send: { [weak self] text, secret in self?.answer(p, text: text, secret: secret) },\n            cancel: { [weak self] in self?.cancelRun() })\n    }\n\n    private func answer(_ p: AnalystPendingPrompt, text: String, secret: Bool) {\n        if pendingPrompt?.id == p.id { pendingPrompt = nil }\n        let respond = p.respond\n        Task { await respond(text, secret) }\n    }\n\n    // MARK: - Thử lại một cạnh\n\n    func retest(_ flow: Flow) {\n        guard let app, !isRunning, !viewingHistory, let run = current,\n            let tf = run.topology.flows.first(where: { $0.flow == flow }),\n            let source = host(flow.source), let dest = host(flow.destination)\n        else { return }\n        let provider = makeProvider(app: app)\n        let coord = AnalystCoordinator(\n            sessions: provider, repository: nil, probeTimeout: app.settings.analystProbeTimeout)\n        coordinator = coord\n        retesting = flow\n        runTask = Task { [weak self] in\n            defer {\n                self?.runTask = nil\n                self?.retesting = nil\n                self?.pendingPrompt = nil\n                self?.coordinator = nil\n            }\n            do {\n                try await app.service?.regenerateSSHConfig()\n                let result = try await coord.retest(flow: tf, source: source, destination: dest)\n                guard let self, var updated = self.current, updated.id == run.id else { return }\n                if let i = updated.results.firstIndex(where: { $0.flow == flow }) {\n                    updated.results[i] = result\n                } else {\n                    updated.results.append(result)\n                }\n                self.current = updated\n                self.latestByFolder[updated.folderName] = updated\n                // Cập nhật bản đã lưu (cùng id) để lịch sử khớp với kết quả đang xem.\n                if let repo = app.analystRepository {\n                    try? await repo.delete(id: updated.id)\n                    try? await repo.save(updated)\n                    await self.refreshHistory()\n                }\n            } catch is CancellationError {\n            } catch { app.show(error, title: \"Không thử lại được kết nối\") }\n        }\n    }\n\n    func openWarp(_ id: UUID) {\n        guard let h = host(id) else { return }\n        Task { await app?.openInWarp(h) }\n    }\n\n    // MARK: - Lịch sử\n\n    func view(_ summary: AnalystRunSummary) {\n        guard !isRunning, let repo = app?.analystRepository else { return }\n        Task {\n            do {\n                guard let run = try await repo.load(id: summary.id) else {\n                    await refreshHistory()\n                    return\n                }\n                current = run\n                viewingHistory = (history.first?.id != run.id)\n                selection = nil\n                tab = .map\n            } catch { app?.show(error, title: \"Không đọc được lần chạy\") }\n        }\n    }\n\n    func backToLatest() {\n        viewingHistory = false\n        selection = nil\n        if let folder, let first = history.first, let repo = app?.analystRepository {\n            Task {\n                if let run = try? await repo.load(id: first.id) {\n                    current = run\n                    latestByFolder[folder] = run\n                }\n            }\n        }\n    }\n\n    func confirmDelete() {\n        guard let s = pendingDelete, let repo = app?.analystRepository else { return }\n        pendingDelete = nil\n        Task {\n            do {\n                try await repo.delete(id: s.id)\n                if current?.id == s.id {\n                    current = nil\n                    viewingHistory = false\n                    if let folder { latestByFolder[folder] = nil }\n                    selection = nil\n                }\n                await refreshHistory(loadLatestIfNeeded: true)\n            } catch { app?.show(error, title: \"Không xoá được lần chạy\") }\n        }\n    }\n\n    // MARK: - Thêm máy chủ vào thư mục\n\n    func add(_ hostIDs: [UUID]) {\n        guard let folder, !hostIDs.isEmpty else { return }\n        Task { await app?.moveHosts(hostIDs, toFolder: folder) }\n    }\n\n    // MARK: - Xuất báo cáo\n\n    func export(_ format: AnalystPresentation.ExportFormat) {\n        guard let run = current else { return }\n        let panel = NSSavePanel()\n        panel.nameFieldStringValue = AnalystPresentation.exportFileName(\n            folder: run.folderName, date: run.startedAt, format: format)\n        panel.allowedContentTypes =\n            format == .markdown\n            ? [UTType(filenameExtension: \"md\") ?? .plainText] : [.commaSeparatedText]\n        panel.canCreateDirectories = true\n        guard panel.runModal() == .OK, let url = panel.url else { return }\n        let text =\n            format == .markdown ? AnalystReport.markdown(run.run) : AnalystReport.csv(run.run)\n        do {\n            try Data(text.utf8).write(to: url, options: .atomic)\n            app?.showToast(\"Đã xuất báo cáo\")\n        } catch { app?.show(error, title: \"Không ghi được báo cáo\") }\n    }\n}\n"}, "Sources/SSHDesk/AppModel+URL.swift": {"group": "Giao diện", "text": "import AppKit\nimport SSHDeskCore\n\n/// Nhận và xử lý `sshdesk://` (ADR-025). Phân tích/quy tắc xác nhận nằm trong SSHDeskCore (`OpenURLHandler`).\nextension AppModel {\n    /// Hàng đợi tối đa, tránh một trang web bắn hàng loạt URL để dồn hộp thoại.\n    private static let maxPendingURLs = 4\n\n    /// Gọi từ Apple Event. Chưa nạp xong dữ liệu thì xếp hàng; sẽ xử lý khi `.ready`.\n    func receive(url: URL) {\n        guard pendingURLs.count < Self.maxPendingURLs else { return }\n        pendingURLs.append(url)\n        if isReady { drainPendingURLs() }\n    }\n\n    func drainPendingURLs() {\n        guard !isHandlingURLs, !pendingURLs.isEmpty else { return }\n        isHandlingURLs = true\n        Task { @MainActor in\n            while !pendingURLs.isEmpty {\n                let url = pendingURLs.removeFirst()\n                await handle(url: url)\n            }\n            isHandlingURLs = false\n        }\n    }\n\n    private func handle(url: URL) async {\n        guard let service else { return }\n        let intent: OpenIntent\n        switch OpenURLHandler.intent(\n            for: url, requestsDirectory: CLIOpenRequest.directory(in: paths))\n        {\n        case .failure(let failure):\n            showToast(\"Bỏ qua liên kết sshdesk://: \\(failure)\")\n            return\n        case .success(let value): intent = value\n        }\n        do {\n            let hosts = try await service.repository.all()\n            let host = try OpenURLHandler.host(for: intent, in: hosts)\n            if intent.origin.requiresConfirmation(environment: host.environment) {\n                NSApplication.shared.activate(ignoringOtherApps: true)\n                let text = OpenURLHandler.confirmationText(for: host, origin: intent.origin)\n                let alert = NSAlert()\n                alert.alertStyle = host.environment == .prod ? .critical : .warning\n                alert.messageText = text.title\n                alert.informativeText = text.message\n                alert.addButton(withTitle: \"Huỷ\")\n                alert.addButton(withTitle: \"Mở\")\n                guard alert.runModal() == .alertSecondButtonReturn else { return }\n            }\n            // Cùng đường với nút \"Mở Warp\": ConnectionService (askpass / tự điền theo cài đặt).\n            await openInWarp(host)\n        } catch let e as HostResolveError {\n            alert = AppAlert(title: \"Không mở được máy chủ\", message: e.description)\n        } catch {\n            show(error, title: \"Không mở được máy chủ\")\n        }\n    }\n}\n"}, "Sources/SSHDesk/AppModel.swift": {"group": "Giao diện", "text": "import AppKit\nimport Foundation\nimport Observation\nimport SSHDeskCore\n\nenum SidebarItem: Hashable {\n    case all\n    case favorites\n    case recent\n    case environment(HostEnvironment)\n    case folder(String)\n    case uncategorized\n    case transfers\n    case analyst\n    case monitor\n    case keys\n    case settings\n\n    var isHostSection: Bool {\n        switch self {\n        case .transfers, .analyst, .monitor, .keys, .settings: return false\n        default: return true\n        }\n    }\n}\n\nenum FormTarget: Identifiable {\n    case new\n    case edit(HostProfile)\n    /// Nhân bản: `source` là host gốc, `copy` là bản nháp đã điền sẵn (chưa lưu).\n    case duplicate(source: HostProfile, copy: HostProfile)\n    var id: String {\n        switch self {\n        case .new: return \"new\"\n        case .duplicate(_, let copy): return \"dup-\" + copy.id.uuidString\n        case .edit(let h): return h.id.uuidString\n        }\n    }\n}\n\n/// Hộp thoại thao tác thư mục (hiện ở thanh bên).\nenum FolderDialog: Identifiable {\n    case create\n    case rename(String)\n    case confirmDelete(String)\n    /// Đổi tên trùng thư mục khác: hỏi gộp hay huỷ.\n    case confirmMerge(from: String, to: String)\n\n    var id: String {\n        switch self {\n        case .create: return \"create\"\n        case .rename(let n): return \"rename:\\(n)\"\n        case .confirmDelete(let n): return \"delete:\\(n)\"\n        case .confirmMerge(let f, let t): return \"merge:\\(f)>\\(t)\"\n        }\n    }\n}\n\nstruct DatabaseFailure {\n    let path: String\n    let folder: URL\n    let message: String\n}\n\nstruct AppAlert: Identifiable {\n    let id = UUID()\n    let title: String\n    let message: String\n}\n\n/// Banner không chặn: dùng cho Warp không khả dụng (kèm nút Copy lệnh SSH).\nstruct Banner: Equatable {\n    let text: String\n    let copyHostID: UUID?\n    /// Hiện nút mở trang tải Windows App trên App Store.\n    var showsAppStoreLink = false\n}\n\n@MainActor @Observable\nfinal class AppModel {\n    enum Phase {\n        case loading\n        case ready\n        case failed(DatabaseFailure)\n    }\n\n    var phase: Phase = .loading\n    var hosts: [HostProfile] = []\n    /// Mọi thư mục (kể cả rỗng), đã sắp theo tên.\n    var folders: [String] = []\n    /// Bộ đăng nhập dùng chung (ADR-030) + số host đang dùng mỗi bộ.\n    private(set) var credentialSets: [CredentialSet] = []\n    private(set) var credentialSetUsage: [UUID: Int] = [:]\n    var folderDialog: FolderDialog?\n    /// Sheet \"Gán bộ đăng nhập…\" cho cả thư mục (ADR-030).\n    var assignSetTarget: AssignSetTarget?\n    /// Nhóm đang thu gọn trong bảng \"Tất cả máy chủ\" (khoá = tên thư mục, \"\" = Chưa phân loại). Chỉ nhớ trong phiên.\n    var collapsedGroups: Set<String> = []\n    var selection: UUID?\n    /// Lọc danh sách tới đúng các máy này (nút \"Xem\" sau khi tự thêm từ nguồn, ADR-026b). nil = không lọc.\n    var focusHostIDs: Set<UUID>?\n    var sidebar: SidebarItem = .all\n    var searchText = \"\"\n    /// Bộ lọc môi trường của Menu ở cột giữa (độc lập với mục \"MÔI TRƯỜNG\" ở sidebar).\n    var environmentFilter: HostEnvironment?\n    var sortAscending = true\n    /// Tăng mỗi lần người dùng bấm ⌘K / ⌘F; MainView theo dõi để focus ô tìm.\n    var searchFocusTick = 0\n    var alert: AppAlert?\n    var toast: String?\n    var banner: Banner?\n    var form: FormTarget?\n    var showImport = false\n    var pendingDelete: HostProfile?\n    var transferSheet: TransferSheetTarget?\n    /// Mọi job đã biết (đang chạy + lịch sử). Cập nhật từ `TransferManager.events` trên MainActor.\n    var jobs: [TransferJob] = []\n    var prompts = AuthPromptQueue()\n    /// Mọi local port forward đã lưu (ADR-011).\n    private(set) var forwards: [PortForward] = []\n    var forwardForm: ForwardFormTarget?\n    /// File xuất/nhập đã đọc, đang xem trước (ADR-020).\n    var exchangePreview: ExchangePreview?\n\n    let paths: AppPaths\n    private(set) var service: ConnectionService?\n    /// Repository host/bộ đăng nhập (cùng DB với `service`).\n    private(set) var hostRepository: HostRepository?\n    private(set) var transfers: TransferManager?\n    /// Màn \"Truyền file\": khung local, tab remote, kéo thả. Tạo khi dữ liệu đã sẵn sàng.\n    private(set) var browser: FileBrowserModel?\n    /// Keychain thật; ACL tin cậy cả helper `sshdesk-askpass` (nếu tìm thấy trong bundle).\n    let credentials: any CredentialStore\n    private let sealedStore: SecureEnclaveCredentialStore\n    /// Kho bí mật dành cho MỌI chỗ tự điền (PTY, tunnel, phiên SFTP, cài key): trả nil khi cài đặt tắt tự điền.\n    let autofillCredentials: any CredentialStore\n    /// Mật khẩu chỉ trong bộ nhớ cho phiên/job không tích \"Lưu\" (ADR-029); bỏ khi phiên đóng.\n    let ephemeralVault = EphemeralPasswordVault()\n    /// Hàng đợi sheet \"Nhập mật khẩu\" (mỗi lúc một sheet, ADR-019/029).\n    let passwordPrompts = PasswordPromptCenter()\n    /// Luồng \"kiểm tra đăng nhập rồi lưu\" (ADR-029); có sau khi dữ liệu nạp xong.\n    private(set) var passwordEntry: PasswordEntryService?\n    /// Bản cài đặt dùng chung với các service Core (ADR-021).\n    let settingsStore = SettingsStore()\n    /// Cài đặt hiện hành cho UI (đổi qua `updateSettings`).\n    private(set) var settings = AppSettings.default\n    private var settingsRepository: SettingsRepository?\n    /// Clipboard giữ mật khẩu Windows tạm thời (ADR-018); xoá khi thoát app.\n    let secretClipboard = SecretClipboard()\n    /// Màn \"SSH Keys\": liệt kê, tạo, cài key (ADR-014).\n    @ObservationIgnored lazy var keys = KeysModel(app: self)\n    /// Sổ phiên SSH đang sống, dùng chung giữa màn Truyền file và Project Analyst (một master/host).\n    let sessionPool = SessionPool()\n    /// Màn \"Project Analyst\" (ADR-016).\n    @ObservationIgnored lazy var analyst = AnalystModel(app: self)\n    /// Nguồn máy chủ đồng bộ một chiều: Excel/CSV, JSON, Ansible (ADR-026).\n    @ObservationIgnored lazy var inventory = InventoryModel(app: self)\n    /// Màn \"Monitor\" tài nguyên server (ADR-019).\n    @ObservationIgnored lazy var monitor = MonitorModel(app: self)\n    private(set) var analystRepository: AnalystRunRepository?\n    /// Nguồn số liệu Prometheus/Zabbix (ADR-028).\n    private(set) var metricSources: MetricSourceService?\n    private(set) var forwardRepository: PortForwardRepository?\n    /// Các tunnel `ssh -N -L` (ADR-011).\n    @ObservationIgnored lazy var tunnels = TunnelsModel(app: self)\n    private var transferRepository: TransferRepository?\n    private var eventsTask: Task<Void, Never>?\n    /// URL `sshdesk://` đến trước khi dữ liệu nạp xong (hoặc đang xử lý URL khác) — xếp hàng (ADR-025).\n    var pendingURLs: [URL] = []\n    var isHandlingURLs = false\n    private var toastTask: Task<Void, Never>?\n\n    /// Dùng chung cho `AppDelegate` (hỏi khi thoát).\n    static let shared = AppModel()\n\n    init(paths: AppPaths = .default) {\n        self.paths = paths\n        let store = SecureEnclaveCredentialStore(\n            trustedApplicationPaths: AskpassHelper.defaultURL().map { [$0.path] } ?? [])\n        credentials = store\n        sealedStore = store\n        let settingsStore = self.settingsStore\n        autofillCredentials = AutofillGatedCredentialStore(\n            base: EphemeralOverlayCredentialStore(base: store, vault: ephemeralVault)\n        ) {\n            settingsStore.current.autofillEnabled\n        }\n    }\n\n    // MARK: - Khởi động\n\n    func start() async {\n        guard case .loading = phase else { return }\n        do {\n            try paths.prepareDirectories()\n            // Database(url:) từ chối file hỏng/schema mới hơn và không ghi đè.\n            let db = try Database(url: paths.databaseURL)\n            let repo = HostRepository(database: db)\n            let settingsRepo = SettingsRepository(database: db)\n            settingsRepository = settingsRepo\n            let loaded = settingsRepo.load()\n            settingsStore.update(loaded)\n            settings = loaded\n            // Migration một lần Keychain plaintext -> Secure Enclave (ADR-004c), xong trước khi hiện danh sách.\n            let metricRepo = MetricSourceRepository(database: db)\n            await CredentialMigration.runIfNeeded(\n                store: sealedStore, repository: repo, settings: settingsRepo, metricSources: metricRepo)\n            let metricService = MetricSourceService(repository: metricRepo, credentials: credentials)\n            metricSources = metricService\n            let service = ConnectionService(\n                repository: repo, appConfigURL: paths.sshConfigURL,\n                userConfigPath: nil, launcher: WarpLauncher(),\n                credentials: credentials, secretClipboard: secretClipboard,\n                askpassHelper: AskpassHelper.defaultURL(), settings: settingsStore,\n                metricSources: metricService)\n            self.service = service\n            hostRepository = repo\n            passwordEntry = PasswordEntryService(\n                connection: service,\n                verifier: PasswordVerifier(\n                    configPath: paths.sshConfigURL.path, helper: ControllingTTYHelper.defaultURL()),\n                credentials: credentials)\n            analystRepository = AnalystRunRepository(\n                database: db, retention: loaded.analystRetention)\n            monitor.applyDefaultInterval(loaded.monitorIntervalSeconds)\n            let forwardRepo = PortForwardRepository(database: db)\n            forwardRepository = forwardRepo\n            try await service.regenerateSSHConfig()\n            hosts = try await repo.all()\n            folders = try await repo.folders()\n            credentialSets = try await repo.credentialSets()\n            credentialSetUsage = try await repo.credentialSetUsage()\n            forwards = try await forwardRepo.all()\n            try await startTransfers(database: db, hosts: repo)\n            browser = FileBrowserModel(app: self, credentials: autofillCredentials)\n            phase = .ready\n            drainPendingURLs()\n            // Phát hiện file nguồn đổi (mtime + SHA-256); chỉ báo, không tự
