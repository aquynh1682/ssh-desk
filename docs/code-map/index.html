áp dụng.\n            Task { await inventory.checkChanges() }\n        } catch {\n            phase = .failed(\n                DatabaseFailure(\n                    path: paths.databaseURL.path, folder: paths.baseDirectory,\n                    message: Self.message(for: error)))\n        }\n    }\n\n    private func startTransfers(database: Database, hosts repo: HostRepository) async throws {\n        let repository = TransferRepository(\n            database: database, retention: settings.transferHistoryLimit)\n        let manager = TransferManager(\n            repository: repository, hosts: repo, concurrency: settings.transferConcurrency,\n            controllingTTYHelper: ControllingTTYHelper.defaultURL(),\n            credentials: autofillCredentials,\n            hostAdjuster: { [vault = ephemeralVault] host in vault.adjusted(host) })\n        transferRepository = repository\n        transfers = manager\n        // Job dở dang của lần chạy trước → \"Bị gián đoạn\" (hiện trong lịch sử).\n        _ = try await manager.recoverInterrupted()\n        jobs = try await repository.history(limit: nil)\n        eventsTask = Task { [weak self] in\n            for await event in manager.events {\n                self?.handle(event)\n            }\n        }\n    }\n\n    private func handle(_ event: TransferEvent) {\n        switch event {\n        case .jobUpdated(let job), .jobFinished(let job):\n            if let i = jobs.firstIndex(where: { $0.id == job.id }) {\n                jobs[i] = job\n            } else {\n                jobs.insert(job, at: 0)\n            }\n            prompts.reconcile(job)\n            if case .jobFinished = event {\n                ephemeralVault.release(hostID: job.hostID, owner: \"job-\" + job.id.uuidString)\n                browser?.jobFinished(job)\n            }\n        case .authPrompt(let id, let kind):\n            prompts.enqueue(jobID: id, kind: kind)\n        }\n    }\n\n    var hasActiveTransfers: Bool { jobs.contains { !$0.state.isTerminal } }\n\n    func revealDataFolder() {\n        NSWorkspace.shared.open(paths.baseDirectory)\n    }\n\n    // MARK: - Dữ liệu hiển thị\n\n    var folderCounts: [HostFolders.FolderCount] {\n        HostFolders.counts(hosts, emptyFolders: folders)\n    }\n\n    var uncategorizedCount: Int { HostFolders.uncategorizedCount(hosts) }\n\n    /// Có chia nhóm theo thư mục trong bảng không (chỉ ở \"Tất cả máy chủ\", không lọc/tìm).\n    var isGroupedTable: Bool {\n        sidebar == .all && environmentFilter == nil\n            && searchText.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty\n    }\n\n    var tableGroups: [HostGroup] {\n        HostFolders.group(visibleHosts, emptyFolders: folders)\n    }\n\n    /// Host điều hướng được bằng ↑/↓ (bỏ qua host trong nhóm đang thu gọn).\n    var navigableHosts: [HostProfile] {\n        guard isGroupedTable else { return visibleHosts }\n        return tableGroups.filter { !collapsedGroups.contains($0.name) }.flatMap(\\.hosts)\n    }\n\n    func toggleGroup(_ name: String) {\n        if collapsedGroups.contains(name) { collapsedGroups.remove(name) } else { collapsedGroups.insert(name) }\n    }\n\n    /// Dùng đúng cách viết của thư mục đã có nếu trùng tên (không phân biệt hoa thường/dấu).\n    func canonicalFolder(_ name: String) -> String {\n        let t = name.trimmingCharacters(in: .whitespacesAndNewlines)\n        return folders.first { HostFolders.sameFolder($0, t) } ?? t\n    }\n\n    /// Môi trường đang lọc: ưu tiên mục sidebar, nếu không thì Menu lọc.\n    var effectiveEnvironment: HostEnvironment? {\n        if case .environment(let e) = sidebar { return e }\n        return environmentFilter\n    }\n\n    var visibleHosts: [HostProfile] {\n        var list = hosts\n        if let ids = focusHostIDs { list = list.filter { ids.contains($0.id) } }\n        var byRecency = false\n        switch sidebar {\n        case .all, .environment: break\n        case .favorites: list = list.filter(\\.isFavorite)\n        case .recent:\n            list = HostPresentation.recent(list)\n            byRecency = true\n        case .folder(let p): list = list.filter { $0.project == p }\n        case .uncategorized: list = list.filter { $0.project.isEmpty }\n        case .transfers, .analyst, .monitor, .keys, .settings: break\n        }\n        list = HostPresentation.filter(list, environment: effectiveEnvironment)\n        let q = searchText.trimmingCharacters(in: .whitespacesAndNewlines)\n        if !q.isEmpty {\n            let opts: String.CompareOptions = [.caseInsensitive, .diacriticInsensitive]\n            func hit(_ s: String) -> Bool { s.range(of: q, options: opts) != nil }\n            list = list.filter {\n                hit($0.displayName) || hit($0.hostName) || hit($0.user) || hit($0.project)\n                    || hit($0.rdpUsername) || hit($0.sshConfigAlias ?? \"\") || $0.tags.contains(where: hit)\n            }\n        }\n        return byRecency ? list : HostPresentation.sortedByName(list, ascending: sortAscending)\n    }\n\n    var columnTitle: String {\n        switch sidebar {\n        case .all, .environment, .transfers, .analyst, .monitor, .keys, .settings: return \"Máy chủ\"\n        case .favorites: return \"Yêu thích\"\n        case .recent: return \"Gần đây\"\n        case .folder(let p): return p\n        case .uncategorized: return HostFolders.uncategorizedTitle\n        }\n    }\n\n    /// Chọn môi trường ở Menu lọc. Đang ở mục môi trường của sidebar thì quay về \"Tất cả\".\n    func setEnvironmentFilter(_ env: HostEnvironment?) {\n        if case .environment = sidebar { sidebar = .all }\n        environmentFilter = env\n    }\n\n    var selectedHost: HostProfile? {\n        guard let selection else { return nil }\n        return hosts.first { $0.id == selection }\n    }\n\n    func name(of id: UUID?) -> String? {\n        guard let id else { return nil }\n        return hosts.first { $0.id == id }?.displayName\n    }\n\n    // MARK: - Thao tác\n\n    func reload() async {\n        guard let service else { return }\n        do {\n            hosts = try await service.repository.all()\n            folders = try await service.repository.folders()\n            credentialSets = try await service.repository.credentialSets()\n            credentialSetUsage = try await service.repository.credentialSetUsage()\n            await inventory.refreshData()\n            forwards = try await forwardRepository?.all() ?? []\n            if case .folder(let f) = sidebar, !folders.contains(f) { sidebar = .all }\n            browser?.hostsChanged(hosts)\n            analyst.foldersChanged()\n            monitor.foldersChanged()\n            if let s = selection, !hosts.contains(where: { $0.id == s }) { selection = nil }\n        } catch { show(error, title: \"Không đọc được dữ liệu\") }\n    }\n\n    /// Trả true nếu lưu thành công (form đóng).\n    /// `password`: nếu có thì ghi vào Keychain sau khi lưu hồ sơ (chuỗi này không được giữ lại ở đâu cả).\n    func save(\n        _ host: HostProfile, isNew: Bool, password: String? = nil, copyPasswordFrom: UUID? = nil\n    ) async -> Bool {\n        guard let service else { return false }\n        do {\n            if isNew { try await service.add(host) } else { try await service.update(host) }\n            if password == nil, let copyPasswordFrom {\n                do { try await service.copyPassword(from: copyPasswordFrom, to: host.id) } catch {\n                    show(error, title: \"Đã lưu hồ sơ nhưng không sao chép được mật khẩu\")\n                }\n            }\n            if let password, !password.isEmpty {\n                do { try await service.savePassword(hostID: host.id, password: password) } catch {\n                    show(error, title: \"Đã lưu hồ sơ nhưng không lưu được mật khẩu vào Keychain\")\n                }\n            }\n            await reload()\n            selection = host.id\n            return true\n        } catch {\n            show(error, title: \"Không lưu được hồ sơ\")\n            return false\n        }\n    }\n\n    /// Xoá mật khẩu đã lưu của host; trả hồ sơ đã cập nhật.\n    func clearPassword(hostID: UUID) async -> HostProfile? {\n        guard let service else { return nil }\n        do {\n            let updated = try await service.clearPassword(hostID: hostID)\n            await reload()\n            showToast(\"Đã xoá mật khẩu đã lưu\")\n            return updated\n        } catch {\n            show(error, title: \"Không xoá được mật khẩu\")\n            return nil\n        }\n    }\n\n    /// Mở form nhân bản (chưa tạo gì; Keychain chỉ được chạm khi bấm Lưu).\n    func beginDuplicate(_ host: HostProfile) {\n        let copy = host.duplicated(existingNames: hosts.map(\\.displayName))\n        form = .duplicate(source: host, copy: copy)\n    }\n\n    /// Có password hiệu lực đã lưu không (riêng hoặc từ bộ đăng nhập). Chỉ để hiển thị.\n    func hasStoredPassword(_ host: HostProfile) -> Bool {\n        guard let ref = host.effectiveCredentialReference else { return false }\n        return credentials.exists(ref: ref)\n    }\n\n    /// Mật khẩu hiệu lực đã lưu nhưng không giải mã được (khoá SE mất/đổi máy) → cần nhập lại (ADR-004c).\n    func needsReauth(_ host: HostProfile) -> Bool {\n        guard let ref = host.effectiveCredentialReference else { return false }\n        return credentials.status(ref: ref) == .undecryptable\n    }\n\n    /// Bộ đăng nhập có password/passphrase không giải mã được.\n    func setNeedsReauth(_ id: UUID) -> Bool {\n        [CredentialSet.passwordReference(for: id), CredentialSet.passphraseReference(for: id)]\n            .contains { credentials.status(ref: $0) == .undecryptable }\n    }\n\n    /// Host có mật khẩu RIÊNG trong Keychain (form dùng để xoá/giữ mật khẩu riêng).\n    func hasOwnPassword(_ host: HostProfile) -> Bool {\n        guard let ref = host.credentialReference, !ref.isEmpty else { return false }\n        return credentials.exists(ref: ref)\n    }\n\n    /// Nguồn thông tin đăng nhập hiệu lực của UI/service Core (bộ đăng nhập, ADR-030).\n    var credentialResolver: CredentialResolver? {\n        let store = settingsStore\n        return hostRepository?.credentialResolver { store.current.defaultIdentityAgent }\n    }\n\n    func credentialSet(id: UUID?) -> CredentialSet? {\n        guard let id else { return nil }\n        return credentialSets.first { $0.id == id }\n    }\n\n    func setHasPassword(_ id: UUID) -> Bool { credentials.exists(ref: CredentialSet.passwordReference(for: id)) }\n    func setHasPassphrase(_ id: UUID) -> Bool { credentials.exists(ref: CredentialSet.passphraseReference(for: id)) }\n\n    func toggleFavorite(_ host: HostProfile) async {\n        guard let service else { return }\n        do {\n            try await service.repository.setFavorite(id: host.id, !host.isFavorite)\n            await reload()\n        } catch { show(error, title: \"Không đổi được yêu thích\") }\n    }\n\n    func confirmDelete() async {\n        guard let host = pendingDelete, let service else { return }\n        pendingDelete = nil\n        do {\n            await tunnels.stopTunnels(hostID: host.id)\n            try await service.delete(id: host.id)\n            if selection == host.id { selection = nil }\n            await reload()\n        } catch HostRepositoryError.referencedAsJumpHost(let ids) {\n            let names = ids.compactMap { name(of: $0) }.joined(separator: \", \")\n            alert = AppAlert(\n                title: \"Không xoá được “\\(host.displayName)”\",\n                message: \"Máy này đang là bastion của: \\(names). Hãy đổi bastion của các máy đó trước.\")\n            await reload()\n        } catch {\n            show(error, title: \"Không xoá được hồ sơ\")\n            await reload()\n        }\n    }\n\n    // MARK: - Thư mục\n\n    func createFolder(_ rawName: String) async -> Bool {\n        guard let service else { return false }\n        do {\n            let name = try await service.repository.createFolder(rawName)\n            await reload()\n            sidebar = .folder(name)\n            return true\n        } catch {\n            show(error, title: \"Không tạo được thư mục\")\n            return false\n        }\n    }\n\n    /// Trả true nếu xong (hoặc đã chuyển sang hỏi gộp); false nếu lỗi.\n    func renameFolder(_ old: String, to rawName: String, merge: Bool = false) async -> Bool {\n        guard let service else { return false }\n        do {\n            let name = try await service.repository.renameFolder(from: old, to: rawName, merge: merge)\n            if sidebar == .folder(old) { sidebar = .folder(name) }\n            await reload()\n            return true\n        } catch HostRepositoryError.folderNameExists(let existing) {\n            folderDialog = .confirmMerge(from: old, to: existing)\n            return true\n        } catch {\n            show(error, title: \"Không đổi được tên thư mục\")\n            return false\n        }\n    }\n\n    func deleteFolder(_ name: String) async {\n        guard let service else { return }\n        do {\n            let n = try await service.repository.deleteFolder(name)\n            if sidebar == .folder(name) { sidebar = .all }\n            await reload()\n            showToast(n > 0 ? \"Đã xoá thư mục; \\(n) máy chủ về “Chưa phân loại”\" : \"Đã xoá thư mục\")\n        } catch { show(error, title: \"Không xoá được thư mục\") }\n    }\n\n    /// `folder == nil`: bỏ thư mục (Chưa phân loại).\n    func moveHosts(_ ids: [UUID], toFolder folder: String?) async {\n        guard let service, !ids.isEmpty else { return }\n        do {\n            try await service.repository.moveHosts(ids: ids, toFolder: folder)\n            await reload()\n            showToast(folder.map { \"Đã chuyển vào “\\($0)”\" } ?? \"Đã chuyển về “Chưa phân loại”\")\n        } catch { show(error, title: \"Không chuyển được máy chủ\") }\n    }\n\n    func openInWarp(_ original: HostProfile, newWindow: Bool = false) async {\n        guard let service else { return }\n        // ADR-029: máy chưa lưu mật khẩu -> sheet hỏi (sau xác nhận PROD của đường URL/CLI, vì xác nhận nằm ở người gọi).\n        let answer = await requestMissingPassword(for: original, purpose: .warp, owner: nil)\n        if case .cancelled = answer { return }\n        let host = hosts.first(where: { $0.id == original.id }) ?? original\n        banner = nil\n        let report = await service.openInWarpReport(host, newWindow: newWindow)\n        switch report.result {\n        case .requested:\n            showToast(\n                report.notice\n                    ?? (hasStoredPassword(host)\n                        ? \"Đã yêu cầu Warp mở phiên — đăng nhập bằng mật khẩu đã lưu\"\n                        : \"Đã yêu cầu Warp mở phiên — đăng nhập diễn ra trong Warp\"))\n            await reload()\n        case .warpUnavailable:\n            banner = Banner(\n                text: \"Không tìm thấy Warp trên máy này. Bạn có thể copy lệnh SSH và chạy trong terminal khác.\",\n                copyHostID: host.id)\n        case .failed(let reason):\n            alert = AppAlert(title: \"Không mở được Warp\", message: reason)\n        }\n    }\n\n    /// Mở máy theo loại: Windows -> Windows App, còn lại -> Warp.\n    func open(_ host: HostProfile) async {\n        if host.kind == .windowsRDP { await openInWindowsApp(host) } else { await openInWarp(host) }\n    }\n\n    func openInWindowsApp(_ original: HostProfile) async {\n        guard let service else { return }\n        let answer = await requestMissingPassword(for: original, purpose: .windows, owner: nil)\n        if case .cancelled = answer { return }\n        let host = hosts.first(where: { $0.id == original.id }) ?? original\n        banner = nil\n        let report = await service.openInWindowsAppReport(host)\n        switch report.result {\n        case .requested:\n            // Không tích lưu (ADR-029/018): copy MỘT lần, tự xoá; password không được lưu ở đâu.\n            if case .windowsCopy(let password) = answer {\n                secretClipboard.copy(password, clearAfter: TimeInterval(settings.clipboardClearSeconds))\n                showToast(passwordCopiedToast)\n                await reload()\n                return\n            }\n            switch report.passwordCopy {\n            case .none: showToast(\"Đã yêu cầu Windows App mở kết nối — nhập mật khẩu trong Windows App\")\n            case .copied: showToast(passwordCopiedToast)\n            case .disabled:\n                showToast(\"Đã mở Windows App — đang tắt tự điền mật khẩu (Cài đặt), nhập mật khẩu trong Windows App\")\n            case .held:\n                showToast(\n                    \"Đã mở Windows App — đang tạm tắt tự điền cho máy này (chờ bạn xác nhận), nhập mật khẩu trong Windows App\"\n                )\n            case .failed(let why): showToast(\"Đã mở Windows App nhưng không copy được mật khẩu: \\(why)\")\n            }\n            await reload()\n        case .appUnavailable:\n            banner = Banner(text: \"Chưa cài Windows App.\", copyHostID: nil, showsAppStoreLink: true)\n        case .failed(let reason):\n            alert = AppAlert(title: \"Không mở được Windows App\", message: reason)\n        }\n    }\n\n    var passwordCopiedToast: String {\n        \"Đã copy mật khẩu — dán (⌘V) vào Windows App. Tự xoá sau \\(settings.clipboardClearSeconds) giây.\"\n    }\n\n    /// Menu \"Copy mật khẩu\" của máy Windows có mật khẩu lưu.\n    func copyWindowsPassword(_ host: HostProfile) async {\n        guard let service else { return }\n        switch await service.copyStoredWindowsPassword(host) {\n        case .none: showToast(\"Máy này chưa lưu mật khẩu\")\n        case .copied: showToast(\"Đã copy mật khẩu. Tự xoá sau \\(settings.clipboardClearSeconds) giây.\")\n        case .disabled: showToast(\"Đang tắt tự điền mật khẩu đã lưu (Cài đặt) nên không copy.\")\n        case .held: showToast(\"Máy này đang tạm tắt tự điền — mở chi tiết máy và bấm “Xác nhận” trước.\")\n        case .failed(let why): showToast(\"Không copy được mật khẩu: \\(why)\")\n        }\n    }\n\n    func openWindowsAppStore() {\n        NSWorkspace.shared.open(SystemWindowsAppHandler.appStoreURL)\n    }\n\n    /// Ghi file .rdp rồi hiện trong Finder.\n    func revealRDPFile(_ host: HostProfile) async {\n        guard let service else { return }\n        do {\n            let url = try await service.prepareRDPFile(for: host)\n            NSWorkspace.shared.activateFileViewerSelecting([url])\n        } catch { show(error, title: \"Không tạo được file .rdp\") }\n    }\n\n    /// Copy một giá trị hiển thị (địa chỉ, port...). Chỉ dùng cho dữ liệu không bí mật.\n    func copyValue(_ value: String, label: String) {\n        NSPasteboard.general.clearContents()\n        NSPasteboard.general.setString(value, forType: .string)\n        showToast(\"Đã copy \\(label)\")\n    }\n\n    func copySSHCommand(_ host: HostProfile) async {\n        guard let service else { return }\n        do {\n            let cmd = try await service.copyableSSHCommand(for: host)\n            NSPasteboard.general.clearContents()\n            NSPasteboard.general.setString(cmd, forType: .string)\n            showToast(\"Đã copy lệnh SSH (không chứa mật khẩu)\")\n        } catch { show(error, title: \"Không tạo được lệnh SSH\") }\n    }\n\n    func importSelected(_ candidates: [ImportCandidate], sourcePath: String) async -> Bool {\n        guard let service else { return false }\n        do {\n            let outcome = try await service.importAliases(candidates, sourcePath: sourcePath)\n            await reload()\n            var text = \"Đã import \\(outcome.imported.count) máy chủ\"\n            if !outcome.skippedAliases.isEmpty {\n                text += \"; bỏ qua \\(outcome.skippedAliases.count) alias đã import\"\n            }\n            showToast(text)\n            return true\n        } catch {\n            show(error, title: \"Không import được\")\n            await reload()\n            return false\n        }\n    }\n\n    // MARK: - Truyền file\n\n    private var configPath: String { paths.sshConfigURL.path }\n\n    /// Trả true nếu job đã vào hàng đợi (sheet đóng).\n    func startDownload(_ form: DownloadForm, host: HostProfile) async -> Bool {\n        do { return try await enqueue(form.makeJob(host: host, configPath: configPath), host: host) } catch {\n            show(error, title: \"Không bắt đầu được tải về\")\n            return false\n        }\n    }\n\n    func startUpload(_ form: UploadForm, host: HostProfile) async -> Bool {\n        do { return try await enqueue(form.makeJob(host: host, configPath: configPath), host: host) } catch {\n            show(error, title: \"Không bắt đầu được tải lên\")\n            return false\n        }\n    }\n\n    private func enqueue(_ job: TransferJob, host: HostProfile) async throws -> Bool {\n        guard let transfers else { return false }\n        // ADR-029: máy chưa lưu mật khẩu -> hỏi (sheet lồng trong sheet Tải về/Tải lên). Huỷ = sheet vẫn mở.\n        let owner = \"job-\" + job.id.uuidString\n        guard await preparePasswordForSession(host, owner: owner, presenter: .transferSheet) else {\n            return false\n        }\n        do {\n            // Config có thể cũ so với hồ sơ: sinh lại trước khi scp đọc.\n            try await service?.regenerateSSHConfig()\n            try await transfers.enqueue(job)\n        } catch {\n            ephemeralVault.release(hostID: host.id, owner: owner)\n            throw error\n        }\n        sidebar = .transfers\n        return true\n    }\n\n    /// Job tạo từ màn Truyền file: dùng lại master của tab (`controlPath`). Không chuyển màn.\n    /// Trả số job đã vào hàng đợi; lỗi giữa chừng → ném lỗi (các job trước đó vẫn đã xếp hàng).\n    func enqueueBrowserJobs(_ jobs: [TransferJob], controlPath: String) async throws -> Int {\n        guard let transfers else { return 0 }\n        try await service?.regenerateSSHConfig()\n        var queued = 0\n        for job in jobs {\n            try await transfers.enqueue(job, controlPath: controlPath)\n            queued += 1\n        }\n        return queued\n    }\n\n    func cancel(_ job: TransferJob) async { await cancelJob(id: job.id) }\n\n    func cancelJob(id: UUID) async {\n        do { try await transfers?.cancel(jobID: id) } catch {\n            show(error, title: \"Không huỷ được tác vụ\")\n        }\n    }\n\n    func retry(_ job: TransferJob) async {\n        do {\n            try await service?.regenerateSSHConfig()\n            try await transfers?.retry(jobID: job.id)\n            sidebar = .transfers\n        } catch { show(error, title: \"Không thử lại được\") }\n    }\n\n    /// Gửi câu trả lời cho prompt. Caller đã xoá giá trị khỏi state; ở đây chỉ chuyển tiếp, không lưu/log.\n    func respond(jobID: UUID, text: String, isSecret: Bool) {\n        prompts.remove(jobID: jobID)\n        guard let transfers else { return }\n        Task {\n            do { try await transfers.respond(jobID: jobID, text: text, isSecret: isSecret) } catch {\n                show(error, title: \"Không gửi được câu trả lời\")\n            }\n        }\n    }\n\n    func clearHistory() async {\n        do {\n            _ = try await transferRepository?.clearHistory()\n            jobs = jobs.filter { !$0.state.isTerminal }\n        } catch { show(error, title: \"Không xoá được lịch sử\") }\n    }\n\n    var hasOpenSessions: Bool {\n        (browser?.hasOpenSessions ?? false) || analyst.isRunning || tunnels.activeCount > 0\n    }\n\n    /// Dùng khi thoát: đóng mọi master của tab duyệt file (`ssh -O exit`), sau khi job đã xử lý xong.\n    func closeAllSessions() async {\n        await tunnels.shutdown()\n        await analyst.shutdown()\n        await monitor.shutdown()\n        await browser?.closeAll()\n    }\n\n    /// Dùng khi thoát: huỷ job đang chạy rồi dừng manager.\n    func shutdownTransfers(cancelRunning: Bool) async {\n        await transfers?.shutdown(cancelRunning: cancelRunning)\n    }\n\n    // MARK: - Phím tắt & vòng đời (ADR-022)\n\n    /// Mục sidebar ứng với ⌘1…⌘6 (theo thứ tự trên sidebar).\n    static let shortcutSections: [(title: String, item: SidebarItem)] = [\n        (\"Tất cả máy chủ\", .all), (\"Yêu thích\", .favorites), (\"Truyền file\", .transfers),\n        (\"Gần đây\", .recent), (\"Project Analyst\", .analyst), (\"Monitor\", .monitor),\n    ]\n\n    var hasSelectedHost: Bool { isReadyForCommands && selectedHost != nil && sidebar.isHostSection }\n\n    private var isReadyForCommands: Bool {\n        if case .ready = phase { return form == nil && pendingDelete == nil }\n        return false\n    }\n\n    func openSelected() {\n        guard hasSelectedHost, let host = selectedHost else { return }\n        Task { await open(host) }\n    }\n\n    func editSelected() {\n        guard hasSelectedHost, let host = selectedHost else { return }\n        form = .edit(host)\n    }\n\n    func duplicateSelected() {\n        guard hasSelectedHost, let host = selectedHost else { return }\n        beginDuplicate(host)\n    }\n\n    /// Luôn đi qua hộp xác nhận (`pendingDelete`).\n    func deleteSelected() {\n        guard hasSelectedHost, let host = selectedHost else { return }\n        pendingDelete = host\n    }\n\n    /// Việc đang chạy, để hỏi trước khi thoát.\n    var quitActivity: QuitActivity {\n        QuitActivity(\n            transfers: jobs.filter { !$0.state.isTerminal }.count, tunnels: tunnels.activeCount,\n            monitorRunning: monitor.isRunning, analystRunning: analyst.isRunning,\n            keyTaskRunning: keys.isBusy)\n    }\n\n    // MARK: - Cài đặt (ADR-021)\n\n    /// Đổi một hay nhiều cài đặt: chuẩn hoá, lưu SQLite, rồi áp dụng ngay vào các service đang chạy.\n    func updateSettings(_ change: (inout AppSettings) -> Void) {\n        var next = settings\n        change(&next)\n        next = next.normalized\n        guard next != settings else { return }\n        let old = settings\n        do { next = try settingsRepository?.save(next) ?? next } catch {\n            show(error, title: \"Không lưu được cài đặt\")\n            return\n        }\n        settings = next\n        settingsStore.update(next)\n        if next.transferConcurrency != old.transferConcurrency {\n            let n = next.transferConcurrency\n            Task { await transfers?.setConcurrency(n) }\n        }\n        if next.transferHistoryLimit != old.transferHistoryLimit {\n            let n = next.transferHistoryLimit\n            Task {\n                await transferRepository?.setRetention(n)\n                if let list = try? await transferRepository?.history() { jobs = list }\n            }\n        }\n        if next.analystRetention != old.analystRetention {\n            let n = next.analystRetention\n            Task { await analystRepository?.setRetention(n) }\n        }\n        if next.monitorIntervalSeconds != old.monitorIntervalSeconds {\n            monitor.applyDefaultInterval(next.monitorIntervalSeconds)\n        }\n        if next.userSSHConfigPath != old.userSSHConfigPath\n            || next.defaultIdentityAgent != old.defaultIdentityAgent\n        {\n            Task {\n                do { try await service?.regenerateSSHConfig() } catch {\n                    show(error, title: \"Không sinh lại được SSH config\")\n                }\n            }\n        }\n    }\n\n    /// Đường dẫn config người dùng đang được Include (nil = không có).\n    var effectiveUserConfigPath: String? { settings.effectiveUserConfigPath() }\n\n    /// Số host đang lưu mật khẩu (cho hộp xác nhận \"Xoá mọi mật khẩu đã lưu\").\n    func savedPasswordCount() async -> Int {\n        (try? await service?.savedPasswordCount()) ?? 0\n    }\n\n    func clearAllPasswords() async {\n        guard let service else { return }\n        do {\n            let r = try await service.clearAllPasswords()\n            await reload()\n            let removed = r.removed + r.setItemsRemoved + r.metricsItemsRemoved\n            let failed = r.failed + r.setItemsFailed + r.metricsItemsFailed\n            if failed > 0 {\n                alert = AppAlert(\n                    title: \"Xoá mật khẩu chưa hoàn tất\",\n                    message:\n                        \"Đã xoá \\(removed) mật khẩu; \\(failed) mục không xoá được (Keychain từ chối). Thử lại sau.\"\n                )\n            } else {\n                showToast(\"Đã xoá \\(removed) mật khẩu đã lưu\")\n            }\n        } catch { show(error, title: \"Không xoá được mật khẩu\") }\n    }\n\n    func revealSSHConfigFolder() {\n        NSWorkspace.shared.activateFileViewerSelecting([paths.sshConfigURL])\n    }\n\n    // MARK: - Thông báo\n\n    func showToast(_ text: String) {\n        toast = text\n        toastTask?.cancel()\n        toastTask = Task { [weak self] in\n            try? await Task.sleep(for: .seconds(4))\n            if !Task.isCancelled { self?.toast = nil }\n        }\n    }\n\n    func show(_ error: Error, title: String) {\n        alert = AppAlert(title: title, message: Self.message(for: error))\n    }\n\n    static func message(for error: Error) -> String {\n        switch error {\n        case DatabaseError.corrupt(let s):\n            return \"File dữ liệu bị hỏng hoặc không phải SQLite (\\(s)). App không tạo file mới đè lên.\"\n        case DatabaseError.newerSchema(let found, let supported):\n            return\n                \"File dữ liệu thuộc phiên bản mới hơn (schema \\(found), app hiểu tới \\(supported)). Hãy dùng bản app mới hơn.\"\n        case DatabaseError.cannotCreate(let s): return \"Không tạo/đọc được file dữ liệu: \\(s)\"\n        case DatabaseError.sqlite(_, let m): return \"Lỗi cơ sở dữ liệu: \\(m)\"\n        case HostRepositoryError.notFound: return \"Không tìm thấy hồ sơ (có thể đã bị xoá).\"\n        case HostRepositoryError.duplicateID: return \"Hồ sơ này đã tồn tại.\"\n        case HostRepositoryError.jumpHostNotFound: return \"Bastion đã chọn không còn tồn tại.\"\n        case HostRepositoryError.jumpCycle: return \"Chuỗi bastion tạo thành vòng lặp.\"\n        case FolderNameError.empty: return \"Tên thư mục không được để trống.\"\n        case FolderNameError.tooLong:\n            return \"Tên thư mục tối đa \\(HostFolders.maxNameLength) ký tự.\"\n        case FolderNameError.controlCharacters: return \"Tên thư mục chứa ký tự điều khiển.\"\n        case HostRepositoryError.folderNameExists: return \"Đã có thư mục trùng tên.\"\n        case let e as PortForwardError: return Self.message(for: e)\n        case let e as HostExchangeError: return e.description\n        case let e as SpreadsheetError: return e.description\n        case let e as InventoryError: return e.description\n        case let e as InventoryTemplateError: return e.description\n        case let e as ColumnMappingError: return e.description\n        case HostRepositoryError.referencedAsJumpHost:\n            return \"Máy này đang là bastion của máy khác.\"\n        case ConnectionServiceError.missingAlias: return \"Hồ sơ thiếu alias SSH.\"\n        case ConnectionServiceError.importedHostReadOnly:\n            return \"Máy chủ import từ SSH config: app không sửa cấu hình của máy này.\"\n        case ConnectionServiceError.notSSHHost: return \"Thao tác này chỉ dành cho máy Linux/SSH.\"\n        case ConnectionServiceError.notWindowsHost: return \"Đây không phải máy Windows.\"\n        case let e as WindowsAppLauncherError: return \"Lỗi ghi file .rdp: \\(e)\"\n        case let e as RDPRenderError: return \"Không sinh được file .rdp: \\(e)\"\n        case ConnectionServiceError.hostNotFound: return \"Không tìm thấy hồ sơ (có thể đã bị xoá).\"\n        case let e as SSHKeyError: return e.description\n        case KeyTaskError.spawnFailed(let s): return \"Không chạy được tiến trình: \\(s)\"\n        case PTYProcessError.helperNotFound:\n            return \"Không tìm thấy helper sshdesk-ctty (cần build đầy đủ app).\"\n        case let e as TransferFormError: return e.issues.map(\\.message).joined(separator: \"\\n\")\n        case TransferManagerError.hostNotFound: return \"Máy chủ không còn tồn tại.\"\n        case TransferManagerError.hostChanged:\n            return \"Alias SSH của máy đã thay đổi kể từ khi tạo tác vụ; hãy tạo tác vụ mới.\"\n        case TransferManagerError.localSourceMissing(let p): return \"Không thấy nguồn local: \\(p)\"\n        case TransferManagerError.symlinksNotSupported(let l):\n            return \"Nguồn chứa symbolic link, chưa được hỗ trợ: \"\n                + l.prefix(TransferFormLimits.symlinkDisplay).joined(separator: \", \")\n        case TransferManagerError.localConflict(let p): return \"Đích đã tồn tại: \\(p)\"\n        case TransferManagerError.jobNotFound: return \"Không tìm thấy tác vụ.\"\n        case TransferManagerError.notAwaitingInput: return \"Tác vụ không còn chờ nhập.\"\n        case TransferManagerError.notCancellable: return \"Tác vụ không huỷ được ở trạng thái này.\"\n        case let e as ScpBuildError: return \"Đường dẫn không hợp lệ: \\(e)\"\n        case let e as HostValidationError: return HostDraft.describe(e).1\n        case let e as SSHConfigError: return \"Cấu hình SSH không hợp lệ: \\(e)\"\n        case let e as WarpLauncherError: return \"Lỗi file cấu hình Warp: \\(e)\"\n        default: return error.localizedDescription\n        }\n    }\n\n    static func message(for e: PortForwardError) -> String {\n        switch e {\n        case .invalidLocalPort(let p):\n            return \"Cổng local \\(p) không hợp lệ: phải từ \\(PortForward.minLocalPort) đến 65535.\"\n        case .invalidRemotePort(let p): return \"Cổng đích \\(p) không hợp lệ: phải từ 1 đến 65535.\"\n        case .invalidRemoteHost:\n            return\n                \"Máy đích không hợp lệ: dùng tên máy/IPv4 (chữ, số, '.', '-', '_') hoặc IPv6 trong [ ]; không có khoảng trắng hay dấu ':'.\"\n        case .invalidName: return \"Tên forward chứa ký tự điều khiển hoặc dài quá \\(PortForward.maxNameLength) ký tự.\"\n        case .localPortTaken(let port, _): return \"Cổng local \\(port) đã được một forward khác của app dùng.\"\n        case .hostNotFound: return \"Không tìm thấy máy chủ (có thể đã bị xoá).\"\n        case .hostNotSupported: return \"Máy Windows không có port forward.\"\n        case .notFound: return \"Không tìm thấy forward (có thể đã bị xoá).\"\n        }\n    }\n\n    // MARK: - Port forward\n\n    /// Trả true nếu lưu được (form đóng).\n    func saveForward(_ forward: PortForward, isNew: Bool) async -> Bool {\n        guard let repo = forwardRepository else { return false }\n        do {\n            if isNew { try await repo.add(forward) } else { try await repo.update(forward) }\n            forwards = try await repo.all()\n            return true\n        } catch {\n            show(error, title: \"Không lưu được port forward\")\n            return false\n        }\n    }\n\n    func deleteForward(_ forward: PortForward) async {\n        guard let repo = forwardRepository else { return }\n        do {\n            await tunnels.manager.stop(forwardID: forward.id)\n            try await repo.delete(id: forward.id)\n            forwards = try await repo.all()\n        } catch { show(error, title: \"Không xoá được port forward\") }\n    }\n\n    func forwards(for hostID: UUID) -> [PortForward] {\n        forwards.filter { $0.hostID == hostID }.sorted { $0.localPort < $1.localPort }\n    }\n}\n"}, "Sources/SSHDesk/BrowserTab.swift": {"group": "Giao diện", "text": "import AppKit\nimport Foundation\nimport Observation\nimport SSHDeskCore\n\n/// Một tab của khung phải: một host = một master ControlMaster (`RemoteSession`) + thao tác file qua sftp.\n/// Quyết định nằm trong SSHDeskCore (`BrowserTabReducer`, `PasswordAutofillPolicy`, `BrowserRows`...).\n@MainActor @Observable\nfinal class BrowserTab: Identifiable {\n    let id = UUID()\n    let hostID: UUID\n    /// Bản chụp hồ sơ host; `FileBrowserModel.hostsChanged()` cập nhật khi hồ sơ đổi.\n    private(set) var host: HostProfile\n    private(set) var state: BrowserTabState = .connecting\n    /// Prompt đang chờ người dùng (không tự điền được).\n    private(set) var pendingPrompt: PromptKind?\n\n    private(set) var history: NavigationHistory?\n    private(set) var allRows: [BrowserRow] = []\n    private(set) var unparsedLines = 0\n    private(set) var isLoading = false\n    var selection = BrowserSelection()\n    var sort = BrowserSort()\n    var query = \"\"\n    var showSearch = false\n    var pathText = \"\"\n    var listError: String?\n    private(set) var home = \"/\"\n\n    private(set) var session: RemoteSession\n    private(set) var files: RemoteFileService\n    private unowned let owner: FileBrowserModel\n    private let socketDirectory: SocketDirectory\n    private var autofilled = false\n    /// Chỉ `close()` phiên đã thực sự chạy master: `RemoteSession.close()` xoá file socket tại ControlPath,\n    /// không được xoá socket của master khác (vd phiên chưa start vì `socketInUse`).\n    private var sessionRan = false\n    private var generation = 0\n    private var eventsTask: Task<Void, Never>?\n\n    init(host: HostProfile, owner: FileBrowserModel, socketDirectory: SocketDirectory) {\n        self.host = host\n        hostID = host.id\n        self.owner = owner\n        self.socketDirectory = socketDirectory\n        let s = Self.makeSession(host: host, owner: owner, socketDirectory: socketDirectory)\n        session = s\n        files = RemoteFileService(session: s)\n    }\n\n    private static func makeSession(\n        host: HostProfile, owner: FileBrowserModel, socketDirectory: SocketDirectory\n    ) -> RemoteSession {\n        RemoteSession(\n            alias: host.sshAlias ?? \"\", configPath: owner.configPath, hostID: host.id,\n            socketDirectory: socketDirectory, helper: ControllingTTYHelper.defaultURL())\n    }\n\n    // MARK: - Hiển thị\n\n    var path: String { history?.current ?? \"\" }\n    var rows: [BrowserRow] { BrowserRows.arranged(allRows, query: query, sort: sort) }\n    var selectedRows: [BrowserRow] { rows.filter { selection.selected.contains($0.id) } }\n    var isBrowsable: Bool { BrowserTabPresentation.isBrowsable(state) }\n    var title: String { host.displayName }\n\n    func updateHost(_ newHost: HostProfile) { host = newHost }\n\n    // MARK: - Kết nối\n\n    /// Khởi chạy master mới (lần đầu hoặc \"Kết nối lại\").\n    func start() async {\n        if case .disconnected = state { apply(.reconnecting) }\n        eventsTask?.cancel()\n        let s: RemoteSession\n        if sessionRan {\n            await session.close()  // phiên cũ: dọn master/socket rồi tạo phiên mới\n            s = Self.makeSession(host: host, owner: owner, socketDirectory: socketDirectory)\n            session = s\n            files = RemoteFileService(session: s)\n        } else {\n            s = session\n        }\n        sessionRan = true\n        pendingPrompt = nil\n        autofilled = false\n        listError = nil\n        let events = s.events\n        eventsTask = Task { [weak self] in\n            for await event in events { self?.handle(event, from: s) }\n        }\n        do {\n            try await owner.prepareConfig()\n            try await s.start()\n        } catch {\n            sessionRan = false  // master chưa chạy: không được `close()` (sẽ xoá socket của master khác)\n            apply(.startFailed(BrowserErrorText.message(for: error)))\n        }\n    }\n\n    /// Chủ của mật khẩu tạm (ADR-029) trong `EphemeralPasswordVault`: một tab cho mỗi host.\n    static func passwordOwner(hostID: UUID) -> String { \"tab-\" + hostID.uuidString }\n\n    func close() async {\n        eventsTask?.cancel()\n        pendingPrompt = nil\n        owner.app?.ephemeralVault.release(hostID: hostID, owner: Self.passwordOwner(hostID: hostID))\n        if sessionRan {\n            await owner.unregisterSession(session, hostID: hostID)\n            await session.close()\n        }\n    }\n\n    private func apply(_ event: BrowserTabEvent) {\n        state = BrowserTabReducer.reduce(state, event)\n        if case .disconnected = state { pendingPrompt = nil }\n    }\n\n    private func handle(_ event: SessionEvent, from source: RemoteSession) {\n        guard source === session else { return }  // sự kiện muộn của phiên cũ\n        apply(.session(event))\n        switch event {\n        case .authPrompt(let kind):\n            Task { await self.answer(kind, from: source) }\n        case .connected:\n            pendingPrompt = nil\n            Task { await owner.registerSession(source, hostID: hostID) }\n            Task { await self.loadInitialDirectory() }\n        case .disconnected:\n            Task { await owner.unregisterSession(source, hostID: hostID) }\n        }\n    }\n\n    /// Tự điền password Keychain (một lần/phiên, theo `PasswordAutofillPolicy`) hoặc hiện thẻ prompt.\n    private func answer(_ kind: PromptKind, from source: RemoteSession) async {\n        // Mật khẩu tạm của tab (ADR-029) được gắn vào bản sao dùng để kết nối, không vào hồ sơ.\n        let connectHost = owner.app?.ephemeralVault.adjusted(host) ?? host\n        if PasswordAutofillPolicy.shouldAutofill(prompt: kind, host: connectHost, alreadyFilled: autofilled),\n            let ref = connectHost.autofillCredentialReference\n        {\n            autofilled = true\n            let store = owner.credentials\n            // Keychain có thể hỏi ACL: không đọc trên main thread.\n            let password = await Task.detached { store.read(ref: ref) }.value\n            guard source === session, state == .awaitingAuth else { return }\n            if let password, !password.isEmpty {\n                apply(.answered)\n                await source.respond(text: password, isSecret: true)\n                return\n            }\n        }\n        pendingPrompt = kind\n    }\n\n    /// Trả lời prompt từ thẻ xác thực. Không lưu/log `text`.\n    func respond(text: String, isSecret: Bool) {\n        guard pendingPrompt != nil else { return }\n        pendingPrompt = nil\n        apply(.answered)\n        let s = session\n        Task { await s.respond(text: text, isSecret: isSecret) }\n    }\n\n    // MARK: - Duyệt\n\n    private func loadInitialDirectory() async {\n        do { home = try await files.home() } catch {\n            noteFailure(error)\n            return\n        }\n        let wanted = host.defaultRemoteDirectory.trimmingCharacters(in: .whitespacesAndNewlines)\n        if !wanted.isEmpty, let resolved = BrowserPath.resolve(wanted, home: home) {\n            if await load(.visit(resolved)) { return }\n            owner.app?.showToast(\"Không mở được thư mục mặc định — dùng thư mục home\")\n        }\n        await load(.visit(home))\n    }\n\n    enum Move {\n        case visit(String)\n        case back, forward, refresh\n    }\n\n    /// Liệt kê rồi mới đổi lịch sử/đường dẫn. Lỗi → giữ nguyên thư mục cũ và đặt `listError`.\n    @discardableResult\n    func load(_ move: Move) async -> Bool {\n        let target: String\n        switch move {\n        case .visit(let p): target = p\n        case .back:\n            guard let t = history?.backTarget else { return false }\n            target = t\n        case .forward:\n            guard let t = history?.forwardTarget else { return false }\n            target = t\n        case .refresh:\n            guard let p = history?.current else { return false }\n            target = p\n        }\n        guard isBrowsable else { return false }\n        generation += 1\n        let g = generation\n        isLoading = true\n        do {\n            let listing = try await files.list(target)\n            guard g == generation else { return false }\n            isLoading = false\n            switch move {\n            case .visit(let p):\n                if history == nil { history = NavigationHistory(start: p) } else { history?.commitVisit(p) }\n            case .back: history?.commitBack()\n            case .forward: history?.commitForward()\n            case .refresh: break\n            }\n            allRows = listing.entries.map { BrowserRow(remote: $0, directory: target) }\n            unparsedLines = listing.unparsedLines\n            selection.retain(Set(allRows.map(\\.id)))\n            pathText = target\n            listError = nil\n            return true\n        } catch {\n            guard g == generation else { return false }\n            isLoading = false\n            noteFailure(error)\n            pathText = path\n            return false\n        }\n    }\n\n    func refresh() async { await load(.refresh) }\n\n    func goUp() async {\n        let parent = BrowserPath.parent(path)\n        if parent != path { await load(.visit(parent)) }\n    }\n\n    /// Enter trong ô đường dẫn.\n    func submitPathText() async {\n        guard let resolved = BrowserPath.resolve(pathText, home: home) else {\n            listError = \"Nhập đường dẫn tuyệt đối (hoặc bắt đầu bằng ~).\"\n            pathText = path\n            return\n        }\n        await load(.visit(resolved))\n    }\n\n    /// Double-click: thư mục và symlink đều thử vào; symlink trỏ tới file thì báo lỗi.\n    func open(_ row: BrowserRow) async {\n        guard row.isSupported, row.isDirectory || row.isSymlink else { return }\n        if !(await load(.visit(row.id))), row.isSymlink {\n            owner.app?.showToast(\"Không vào được liên kết “\\(row.name)” (có thể trỏ tới file)\")\n        }\n    }\n\n    /// Ghi nhận lỗi: mất kết nối → đổi trạng thái tab; còn lại hiện dòng lỗi ở khung.\n    func noteFailure(_ error: Error) {\n        if let e = error as? RemoteFileError, e == .sessionLost { apply(.sessionLost) }\n        listError = BrowserErrorText.message(for: error)\n    }\n\n    // MARK: - Thao tác remote (sau đó làm mới)\n\n    func makeFolder(named name: String) async throws {\n        do { try await files.mkdir(BrowserPath.join(path, name)) } catch {\n            noteFailure(error)\n            throw error\n        }\n        await refresh()\n    }\n\n    /// `overwrite == false` mà đích tồn tại → ném `RemoteFileError.destinationExists`.\n    func rename(_ row: BrowserRow, to newName: String, overwrite: Bool) async throws {\n        do {\n            try await files.rename(\n                from: row.id, to: BrowserPath.join(path, newName), overwrite: overwrite)\n        } catch let e as RemoteFileError {\n            if e != .destinationExists(BrowserPath.join(path, newName)) { noteFailure(e) }\n            throw e\n        }\n        await refresh()\n    }\n\n    func removeFile(_ row: BrowserRow) async throws {\n        do { try await files.remove(file: row.id) } catch {\n            noteFailure(error)\n            throw error\n        }\n        await refresh()\n    }\n\n    func planDelete(_ row: BrowserRow) async throws -> RemoteDeletePlan {\n        do { return try await files.planRecursiveDelete(row.id) } catch {\n            noteFailure(error)\n            throw error\n        }\n    }\n\n    func executeDelete(\n        _ plan: RemoteDeletePlan, progress: @escaping @Sendable (Int, Int) -> Void\n    ) async throws {\n        do {\n            try await files.executeRecursiveDelete(plan, progress: progress)\n        } catch {\n            if case RemoteFileError.deleteInterrupted(_, _, let message) = error,\n                message == BrowserErrorText.remote(.sessionLost)\n            {\n                apply(.sessionLost)\n            }\n            await refresh()\n            throw error\n        }\n        await refresh()\n    }\n\n    func copyPath(_ row: BrowserRow) {\n        NSPasteboard.general.clearContents()\n        NSPasteboard.general.setString(row.id, forType: .string)\n        owner.app?.showToast(\"Đã copy đường dẫn\")\n    }\n}\n"}, "Sources/SSHDesk/CredentialSetViews.swift": {"group": "Giao diện", "text": "import AppKit\nimport SSHDeskCore\nimport SwiftUI\n\n/// Danh sách \"Bộ đăng nhập\" trong Cài đặt → Bảo mật (ADR-030).\nstruct CredentialSetsSection: View {\n    @Bindable var model: AppModel\n    @Local private var editing: EditTarget?\n    @Local private var deleting: CredentialSet?\n    @Local private var usersOf: CredentialSet?\n\n    enum EditTarget: Identifiable {\n        case new\n        case edit(CredentialSet)\n        var id: String {\n            switch self {\n            case .new: return \"new\"\n            case .edit(let s): return s.id.uuidString\n            }\n        }\n    }\n\n    var body: some View {\n        VStack(alignment: .leading, spacing: 8) {\n            HStack {\n                VStack(alignment: .leading, spacing: 2) {\n                    Text(\"Bộ đăng nhập\").font(.system(size: 13.5))\n                    Text(\n                        \"Dùng chung password / key / passphrase / agent cho nhiều máy. Mật khẩu riêng của máy vẫn ưu tiên hơn bộ.\"\n                    )\n                    .font(.caption).foregroundStyle(Theme.textSecondary)\n                }\n                Spacer()\n                Button(\"Thêm bộ…\") { editing = .new }\n            }\n            if model.credentialSets.isEmpty {\n                Text(\"Chưa có bộ đăng nhập nào.\").font(.caption).foregroundStyle(Theme.textTertiary)\n            }\n            ForEach(model.credentialSets) { set in row(set) }\n        }\n        .sheet(item: $editing) { target in\n            CredentialSetEditor(model: model, target: target)\n        }\n        .sheet(item: $usersOf) { set in\n            CredentialSetUsersSheet(model: model, set: set)\n        }\n        .confirmationDialog(\n            \"Xoá bộ “\\(deleting?.name ?? \"\")”?\",\n            isPresented: Binding(get: { deleting != nil }, set: { if !$0 { deleting = nil } }),\n            titleVisibility: .visible\n        ) {\n            Button(\"Xoá bộ\", role: .destructive) {\n                if let d = deleting { Task { await model.deleteCredentialSet(d.id) } }\n                deleting = nil\n            }\n            Button(\"Huỷ\", role: .cancel) { deleting = nil }\n        } message: {\n            let n = deleting.map { model.credentialSetUsage[$0.id] ?? 0 } ?? 0\n            Text(\n                \"\\(n) máy đang dùng bộ này sẽ không còn dùng nó (máy được giữ nguyên). Password/passphrase của bộ bị xoá khỏi Keychain.\"\n            )\n        }\n    }\n\n    private func row(_ set: CredentialSet) -> some View {\n        let hasPw = model.setHasPassword(set.id)\n        let count = model.credentialSetUsage[set.id] ?? 0\n        return HStack(spacing: 8) {\n            VStack(alignment: .leading, spacing: 2) {\n                Text(set.name).font(.system(size: 13, weight: .semibold))\n                Text(\"\\(set.kindLabel(hasPassword: hasPw)) · \\(count) máy\")\n                    .font(.caption).foregroundStyle(Theme.textSecondary)\n                if model.setNeedsReauth(set.id) {\n                    Text(\"Mật khẩu đã lưu không còn dùng được trên máy này — nhập lại\")\n                        .font(.caption).foregroundStyle(Theme.amber)\n                }\n                if let file = set.identityFile,\n                    !FileManager.default.fileExists(\n                        atPath: CredentialResolution.expandTilde(file, home: NSHomeDirectory()))\n                {\n                    Text(\"Không thấy file key \\(file)\").font(.caption).foregroundStyle(Theme.amber)\n                }\n            }\n            Spacer()\n            Button(\"Máy dùng\") { usersOf = set }.disabled(count == 0)\n            Button(\"Sửa…\") { editing = .edit(set) }\n            Button(\"Xoá…\", role: .destructive) { deleting = set }\n        }\n        .padding(.vertical, 4)\n    }\n}\n\n/// Tạo / sửa bộ. Password và passphrase là SecureField; để trống khi sửa = giữ nguyên.\nstruct CredentialSetEditor: View {\n    @Bindable var model: AppModel\n    let target: CredentialSetsSection.EditTarget\n    @Environment(\\.dismiss) private var dismiss\n\n    @Local private var loaded = false\n    @Local private var original: CredentialSet?\n    @Local private var name = \"\"\n    @Local private var user = \"\"\n    @Local private var note = \"\"\n    @Local private var identityFile = \"\"\n    @Local private var preset: IdentityAgentPreset?\n    @Local private var customAgent = \"\"\n    @Local private var password = \"\"\n    @Local private var passphrase = \"\"\n    @Local private var saving = false\n    @Local private var confirmKeyLoss = false\n\n    private var isNew: Bool { original == nil }\n\n    private var agentValue: String? {\n        switch preset {\n        case nil: return nil\n        case .custom?: return customAgent.trimmingCharacters(in: .whitespacesAndNewlines)\n        case let p?: return p.path\n        }\n    }\n\n    private var draftSet: CredentialSet {\n        var s = original ?? CredentialSet(name: \"\")\n        s.name = name\n        s.user = user\n        s.note = note\n        s.identityFile = identityFile\n        s.identityAgent = agentValue\n        return s\n    }\n\n    private var validationError: String? {\n        do { _ = try draftSet.validated() } catch { return AppModel.setMessage(error) }\n        return nil\n    }\n\n    var body: some View {\n        VStack(spacing: 0) {\n            Form {\n                Section(isNew ? \"Bộ đăng nhập mới\" : \"Sửa bộ đăng nhập\") {\n                    TextField(\"Tên\", text: $name)\n                    TextField(\"User gợi ý (tuỳ chọn)\", text: $user)\n                    TextField(\"Ghi chú\", text: $note, axis: .vertical).lineLimit(1...3)\n                }\n                Section(\"Mật khẩu\") {\n                    SecureField(\n                        \"Mật khẩu\", text: $password,\n                        prompt: Text(\n                            original.map { model.setHasPassword($0.id) } == true\n                                ? \"Để trống = giữ mật khẩu hiện tại\" : \"Tuỳ chọn\"))\n                    if let o = original, model.setHasPassword(o.id) {\n                        Button(\"Xoá mật khẩu của bộ\", role: .destructive) {\n                            Task { await model.clearSetSecret(o.id, passphrase: false) }\n                        }\n                    }\n                }\n                Section(\"Key\") {\n                    HStack {\n                        TextField(\"File key (đường dẫn)\", text: $identityFile)\n                        Button(\"Chọn…\") { chooseKey() }\n                        let withPrivate = model.keys.keys.filter(\\.hasPrivateKey)\n                        if !withPrivate.isEmpty {\n                            Menu(\"Key đã quét\") {\n                                ForEach(withPrivate) { k in\n                                    Button(k.name) { identityFile = k.privateKeyPath ?? \"\" }\n                                }\n                            }\n                            .fixedSize()\n                        }\n                    }\n                    if !identityFile.isEmpty,\n                        !FileManager.default.fileExists(\n                            atPath: CredentialResolution.expandTilde(identityFile, home: NSHomeDirectory()))\n                    {\n                        Text(\"Không thấy file key này\").font(.caption).foregroundStyle(Theme.amber)\n                    }\n                    SecureField(\n                        \"Passphrase của key\", text: $passphrase,\n                        prompt: Text(\n                            original.map { model.setHasPassphrase($0.id) } == true\n                                ? \"Để trống = giữ passphrase hiện tại\" : \"Tuỳ chọn\"))\n                    if let o = original, model.setHasPassphrase(o.id) {\n                        Button(\"Xoá passphrase\", role: .destructive) {\n                            Task { await model.clearSetSecret(o.id, passphrase: true) }\n                        }\n                    }\n                    Text(\n                        \"Chỉ lưu đường dẫn, app không đọc nội dung key. Passphrase chỉ tự điền khi mở bằng Warp (ssh hỏi đúng key này). Truyền file, tunnel, Analyst, Monitor luôn hỏi bạn.\"\n                    )\n                    .font(.caption).foregroundStyle(.secondary)\n                }\n                Section(\"Agent\") {\n                    Picker(\"Agent\", selection: $preset) {\n                        Text(\"Theo mặc định (Cài đặt)\").tag(IdentityAgentPreset?.none)\n                        ForEach(IdentityAgentPreset.allCases, id: \\.self) {\n                            Text($0.title).tag(IdentityAgentPreset?.some($0))\n                        }\n                    }\n                    if preset == .custom {\n                        TextField(\"Đường dẫn socket\", text: $customAgent, prompt: Text(\"~/.../agent.sock\"))\n                    }\n                }\n                if let e = validationError, !name.isEmpty || !identityFile.isEmpty {\n                    Text(e).foregroundStyle(Theme.red).font(.caption)\n                }\n            }\n            .formStyle(.grouped)\n            Divider()\n            HStack {\n                Spacer()\n                Button(\"Huỷ\") { dismiss() }.keyboardShortcut(.cancelAction)\n                Button(\"Lưu\") {\n                    if keyLossCount > 0 { confirmKeyLoss = true } else { Task { await save() } }\n                }\n                .keyboardShortcut(.defaultAction)\n                .disabled(saving || validationError != nil)\n            }\n            .padding(12)\n        }\n        .frame(width: 520, height: 600)\n        .onAppear(perform: load)\n        .confirmationDialog(\n            \"Bỏ key của bộ?\", isPresented: $confirmKeyLoss, titleVisibility: .visible\n        ) {\n            Button(\"Vẫn lưu\", role: .destructive) { Task { await save() } }\n            Button(\"Huỷ\", role: .cancel) {}\n        } message: {\n            Text(\"\\(keyLossCount) máy dùng xác thực File khoá đang lấy key từ bộ này sẽ không còn key.\")\n        }\n    }\n\n    /// Số máy `.keyFile` đang lấy key từ bộ sẽ mất key nếu lưu như hiện tại.\n    private var keyLossCount: Int {\n        guard let o = original else { return 0 }\n        return CredentialSet.hostsLosingKey(hosts: model.hosts, before: o, after: draftSet.normalizedForCompare).count\n    }\n\n    private func load() {\n        guard !loaded else { return }\n        loaded = true\n        guard case .edit(let s) = target else { return }\n        original = s\n        name = s.name\n        user = s.user ?? \"\"\n        note = s.note\n        identityFile = s.identityFile ?? \"\"\n        if let agent = s.identityAgent {\n            let p = IdentityAgentPreset.matching(agent)\n            preset = p\n            if p == .custom { customAgent = agent }\n        }\n    }\n\n    private func chooseKey() {\n        let panel = NSOpenPanel()\n        panel.canChooseFiles = true\n        panel.canChooseDirectories = false\n        panel.allowsMultipleSelection = false\n        panel.showsHiddenFiles = true\n        panel.directoryURL = FileManager.default.homeDirectoryForCurrentUser.appendingPathComponent(\".ssh\")\n        panel.prompt = \"Chọn\"\n        if panel.runModal() == .OK, let url = panel.url { identityFile = url.path }\n    }\n\n    private func save() async {\n        saving = true\n        defer { saving = false }\n        let pw = password.isEmpty ? nil : password\n        let pp = passphrase.isEmpty ? nil : passphrase\n        password = \"\"\n        passphrase = \"\"\n        if await model.saveCredentialSet(draftSet, isNew: isNew, password: pw, passphrase: pp) { dismiss() }\n    }\n}\n\n/// Máy đang dùng một bộ.\nstruct CredentialSetUsersSheet: View {\n    @Bindable var model: AppModel\n    let set: CredentialSet\n    @Environment(\\.dismiss) private var dismiss\n\n    var body: some View {\n        VStack(alignment: .leading, spacing: 10) {\n            Text(\"Máy dùng bộ “\\(set.name)”\").font(.headline)\n            let users = model.hosts.filter { $0.credentialSetID == set.id }\n            List(users) { h in\n                HStack {\n                    Text(h.displayName)\n                    Spacer()\n                    if !(h.credentialReference ?? \"\").isEmpty {\n                        Text(\"có mật khẩu riêng (ưu tiên)\").font(.caption).foregroundStyle(.secondary)\n                    }\n                    if h.autofillHold {\n                        Text(\"đang hold\").font(.caption).foregroundStyle(Theme.amber)\n                    }\n                }\n            }\n            .frame(minHeight: 160)\n            HStack {\n                Spacer()\n                Button(\"Đóng\") { dismiss() }.keyboardShortcut(.defaultAction)\n            }\n        }\n        .padding(16).frame(width: 440, height: 300)\n    }\n}\n\n/// \"Gán bộ đăng nhập…\" cho cả thư mục: xem trước số máy và máy có mật khẩu riêng.\nstruct AssignSetSheet: View {\n    @Bindable var model: AppModel\n    let target: AssignSetTarget\n    @Environment(\\.dismiss) private var dismiss\n    @Local private var chosen: UUID?\n\n    var body: some View {\n        let hosts = model.assignableHosts(inFolder: target.folder)\n        let own = hosts.filter { !($0.credentialReference ?? \"\").isEmpty }\n        let current = hosts.filter { $0.credentialSetID != nil }\n        VStack(alignment: .leading, spacing: 12) {\n            Text(\"Gán bộ đăng nhập cho thư mục “\\(target.folder)”\").font(.headline)\n            Picker(\"Bộ đăng nhập\", selection: $chosen) {\n                Text(\"Gỡ bộ khỏi các máy\").tag(UUID?.none)\n                ForEach(model.credentialSets) { Text($0.name).tag(UUID?.some($0.id)) }\n            }\n            VStack(alignment: .leading, spacing: 4) {\n                Text(\"\\(hosts.count) máy sẽ bị ảnh hưởng (máy alias có sẵn trong ~/.ssh/config được bỏ qua).\")\n                if !own.isEmpty {\n                    Text(\"\\(own.count) máy có mật khẩu riêng — mật khẩu riêng vẫn ưu tiên hơn bộ.\")\n                        .foregroundStyle(Theme.amber)\n                }\n                if chosen != nil, !current.isEmpty {\n                    Text(\"\\(current.count) máy đang dùng bộ khác sẽ chuyển sang bộ này.\")\n                }\n                if chosen == nil {\n                    Text(\"\\(current.count) máy đang dùng bộ sẽ được gỡ.\")\n                }\n                Text(\n                    \"Gán thủ công không tạm tắt tự điền. Cần chọn từng máy riêng lẻ? Bảng máy chủ chưa hỗ trợ chọn nhiều — dùng thư mục.\"\n                )\n                .font(.caption).foregroundStyle(.secondary)\n            }\n            .font(.system(size: 12.5))\n            HStack {\n                Spacer()\n                Button(\"Huỷ\") { dismiss() }.keyboardShortcut(.cancelAction)\n                Button(\"Áp dụng\") {\n                    Task {\n                        await model.assignCredentialSet(chosen, to: hosts.map(\\.id))\n                        dismiss()\n                    }\n                }\n                .keyboardShortcut(.defaultAction)\n                .disabled(hosts.isEmpty || (chosen == nil && current.isEmpty))\n            }\n        }\n        .padding(18).frame(width: 460)\n    }\n}\n"}, "Sources/SSHDesk/FileBrowserModel.swift": {"group": "Giao diện", "text": "import AppKit\nimport Foundation\nimport Observation\nimport SSHDeskCore\nimport UniformTypeIdentifiers\n\n/// Nội dung thả vào một khung.\nenum DroppedContent: Sendable {\n    case payload(BrowserDragPayload)\n    /// File kéo từ Finder (chỉ đường dẫn, không đọc nội dung).\n    case files([String])\n}\n\nextension UTType {\n    /// Kiểu kéo thả nội bộ (khai báo trong Info.plist của .app).\n    static let browserItems = UTType(\n        exportedAs: BrowserDragPayload.typeIdentifier, conformingTo: .data)\n}\n\n/// Trạng thái toàn màn \"Truyền file\": khung local, các tab remote, hộp thoại, điều phối kéo thả.\n/// Quyết định (kế hoạch trùng tên, PROD, đích, refresh...) nằm trong SSHDeskCore; ở đây chỉ nối UI với service.\n@MainActor @Observable\nfinal class FileBrowserModel {\n    weak var app: AppModel?\n    let credentials: any CredentialStore\n    let local: LocalPaneModel\n    private(set) var tabs: [BrowserTab] = []\n    var selectedTabID: UUID?\n    var dialog: BrowserDialog?\n    /// Nguồn của lượt kéo đang diễn ra (để không hiện vùng thả trên chính khung nguồn).\n    var dragOrigin: BrowserDragPayload.Origin?\n    private var socketDirectory: SocketDirectory?\n    private var mouseMonitor: Any?\n\n    init(app: AppModel, credentials: any CredentialStore) {\n        self.app = app\n        self.credentials = credentials\n        local = LocalPaneModel(startDirectory: app.settings.resolvedLocalDirectory())\n        // Bắt đầu một thao tác chuột mới thì xoá nguồn kéo cũ (kéo bị huỷ giữa chừng không có callback).\n        mouseMonitor = NSEvent.addLocalMonitorForEvents(matching: .leftMouseDown) { [weak self] event in\n            Task { @MainActor in self?.dragOrigin = nil }\n            return event\n        }\n    }\n\n    var configPath: String { app?.paths.sshConfigURL.path ?? \"\" }\n    var selectedTab: BrowserTab? { tabs.first { $0.id == selectedTabID } }\n    var sessionCount: Int { BrowserTabPresentation.sessionCount(tabs.map(\\.state)) }\n    var hasOpenSessions: Bool { !tabs.isEmpty }\n\n    /// Phiên của tab được chia sẻ với Project Analyst qua `SessionPool` (không mở master thứ hai).\n    func registerSession(_ session: RemoteSession, hostID: UUID) async {\n        await app?.sessionPool.register(hostID: hostID, session: session, owner: .browser)\n    }\n\n    func unregisterSession(_ session: RemoteSession, hostID: UUID) async {\n        await app?.sessionPool.unregister(hostID: hostID, session: session)\n    }\n\n    func prepareConfig() async throws {\n        try await app?.service?.regenerateSSHConfig()\n    }\n\n    func apply(_ outcome: DialogOutcome) {\n        switch outcome {\n        case .done: dialog = nil\n        case .next(let next): dialog = next\n        case .error(let message): dialog = .error(\"Có lỗi\", message)\n        }\n    }\n\n    // MARK: - Tab\n\n    func openTab(_ host: HostProfile) async {\n        if let existing = tabs.first(where: { $0.hostID == host.id }) {\n            selectedTabID = existing.id\n            return\n        }\n        guard HostPicker.isSelectable(host) else {\n            dialog = .error(\"Không mở được “\\(host.displayName)”\", \"Hồ sơ thiếu alias SSH.\")\n            return\n        }\n        switch await app?.sessionPool.owner(of: host.id) {\n        case .analyst:\n            dialog = .error(\n                \"Không mở được “\\(host.displayName)”\",\n                \"Project Analyst đang dùng kết nối của máy này. Hãy thử lại sau khi lần chạy kết thúc.\")\n            return\n        case .monitor:\n            dialog = .error(\n                \"Không mở được “\\(host.displayName)”\",\n                \"Monitor đang dùng kết nối của máy này. Hãy dừng Monitor hoặc rời màn Monitor rồi thử lại.\")\n            return\n        case .browser, nil:\n            break\n        }\n        do {\n            if socketDirectory == nil { socketDirectory = try SocketDirectory.ensure() }\n        } catch {\n            dialog = .error(\"Không tạo được thư mục socket\", BrowserErrorText.message(for: error))\n            return\n        }\n        guard let dir = socketDirectory else { return }\n        // ADR-029: máy chưa lưu mật khẩu -> hỏi trước khi mở tab; không tích lưu thì mật khẩu chỉ sống tới khi tab đóng.\n        if let app, !(await app.preparePasswordForSession(host, owner: BrowserTab.passwordOwner(hostID: host.id))) {\n            return\n        }\n        let tab = BrowserTab(host: host, owner: self, socketDirectory: dir)\n        tabs.append(tab)\n        selectedTabID = tab.id\n        let wanted = host.defaultLocalDirectory.trimmingCharacters(in: .whitespacesAndNewlines)\n        if wanted.hasPrefix(\"/\"), FileManager.default.fileExists(atPath: wanted) {\n            await local.go(.visit(wanted))\n        }\n        await tab.start()\n    }\n\n    /// Nút × của tab: còn job của host này đang chạy thì hỏi trước (scp dùng master của tab sẽ đứt).\n    func requestClose(_ tab: BrowserTab) {\n        let running = TransferPresentation.active(app?.jobs ?? []).filter { $0.hostID == tab.hostID }\n        guard !running.isEmpty else {\n            Task { await closeTab(tab) }\n            return\n        }\n        dialog = .confirm(\n            ConfirmDialog(\n                title: \"Đóng tab “\\(tab.title)”?\",\n                message:\n                    \"Còn \\(running.count) tác vụ truyền file của máy này đang chạy hoặc đang chờ. Đóng tab sẽ ngắt kết nối dùng chung và các tác vụ đó có thể thất bại.\",\n                confirmTitle: \"Đóng tab\", destructive: true\n            ) { [weak self] in\n                await self?.closeTab(tab)\n                return .done\n            })\n    }\n\n    func closeTab(_ tab: BrowserTab) async {\n        guard let i = tabs.firstIndex(where: { $0.id == tab.id }) else { return }\n        tabs.remove(at: i)\n        if selectedTabID == tab.id {\n            selectedTabID = tabs.isEmpty ? nil : tabs[min(i, tabs.count - 1)].id\n        }\n        await tab.close()\n    }\n\n    /// Thoát app: đóng mọi master (ssh -O exit).\n    func closeAll() async {\n        let all = tabs\n        tabs = []\n        selectedTabID = nil\n        for tab in all { await tab.close() }\n    }\n\n    func hostsChanged(_ hosts: [HostProfile]) {\n        for tab in tabs {\n            if let h = hosts.first(where: { $0.id == tab.hostID }) { tab.updateHost(h) }\n        }\n    }\n\n    /// Job của app vừa kết thúc: làm mới khung đích nếu đang xem đúng thư mục đó.\n    func jobFinished(_ job: TransferJob) {\n        for tab in tabs\n        where BrowserRefreshRule.shouldRefreshRemote(\n            job: job, hostID: tab.hostID, currentPath: tab.path)\n        {\n            Task { await tab.refresh() }\n        }\n        if BrowserRefreshRule.shouldRefreshLocal(job: job, currentDirectory: local.path) {\n            Task { await local.refresh() }\n        }\n    }\n\n    // MARK: - Kéo thả\n\n    func shouldShowDropOverlay(onRemote tab: BrowserTab, targeted: Bool) -> Bool {\n        guard targeted, tab.isBrowsable else { return false }\n        return dragOrigin != .remote(hostID: tab.hostID)\n    }\n\n    func shouldShowDropOverlay(onLocal targeted: Bool) -> Bool {\n        targeted && dragOrigin != .local\n    }\n\n    func beginDrag(_ origin: BrowserDragPayload.Origin) { dragOrigin = origin }\n\n    /// Tạo `NSItemProvider` nội bộ (chỉ trong process của app) cho các dòng kéo.\n    func provider(for items: [BatchItem], origin: BrowserDragPayload.Origin) -> NSItemProvider {\n        beginDrag(origin)\n        let provider = NSItemProvider()\n        if let data = BrowserDragPayload(origin: origin, items: items).encoded() {\n            provider.registerDataRepresentation(\n                forTypeIdentifier: BrowserDragPayload.typeIdentifier, visibility: .ownProcess\n            ) { completion in\n                completion(data, nil)\n                return nil\n            }\n        }\n        return provider\n    }\n\n    /// Đọc dữ liệu thả: payload nội bộ hoặc đường dẫn file từ Finder. Không đọc nội dung file.\n    static func decode(_ providers: [NSItemProvider]) async -> DroppedContent? {\n        var files: [String] = []\n        for provider in providers {\n            if provider.hasItemConformingToTypeIdentifier(BrowserDragPayload.typeIdentifier) {\n                let data: Data? = await withCheckedContinuation { cont in\n                    provider.loadDataRepresentation(\n                        forTypeIdentifier: BrowserDragPayload.typeIdentifier\n                    ) { data, _ in cont.resume(returning: data) }\n                }\n                if let data, let payload = BrowserDragPayload.decode(data) {\n                    return .payload(payload)\n                }\n            } else if provider.hasItemConformingToTypeIdentifier(UTType.fileURL.identifier) {\n                let data: Data? = await withCheckedContinuation { cont in\n                    provider.loadDataRepresentation(forTypeIdentifier: UTType.fileURL.identifier) {\n                        data, _ in cont.resume(returning: data)\n                    }\n                }\n                if let data, let url = URL(dataRepresentation: data, relativeTo: nil), url.isFileURL {\n                    files.append(url.path)\n                }\n            }\n        }\n        return files.isEmpty ? nil : .files(files)\n    }\n\n    func handleDrop(_ providers: [NSItemProvider], onRemote tab: BrowserTab) {\n        dragOrigin = nil\n        Task {\n            guard let content = await Self.decode(providers) else { return }\n            await dropOnRemote(tab, content)\n        }\n    }\n\n    func handleDropOnLocal(_ providers: [NSItemProvider]) {\n        dragOrigin = nil\n        Task {\n            guard let content = await Self.decode(providers) else { return }\n            await dropOnLocal(content)\n        }\n    }\n\n    func dropOnRemote(_ tab: BrowserTab, _ content: DroppedContent) async {\n        let paths: [String]\n        switch content {\n        case .payload(let p):\n            if case .remote = p.origin { return }  // thả vào chính khung nguồn: không làm gì\n            paths = p.items.map(\\.path)\n        case .files(let f): paths = f\n        }\n        await startUpload(paths: paths, to: tab)\n    }\n\n    func dropOnLocal(_ content: DroppedContent) async {\n        guard case .payload(let p) = content, case .remote(let hostID) = p.origin else { return }\n        guard let tab = tabs.first(where: { $0.hostID == hostID }) else {\n            dialog = .error(\"Không tải về được\", \"Tab của máy chủ này đã đóng.\")\n            return\n        }\n        await startDownload(items: p.items, from: tab)\n    }\n\n    // MARK: - Upload\n\n    /// Menu \"Tải lên\": các dòng đang chọn ở khung local → thư mục remote hiện tại.\n    func uploadSelectedLocal(to tab: BrowserTab) async {\n        await startUpload(paths: local.selectedRows.filter(\\.isSupported).map(\\.id), to: tab)\n    }\n\n    func startUpload(paths: [String], to tab: BrowserTab) async {\n        guard tab.isBrowsable, !tab.path.isEmpty else {\n            dialog = .error(\n                \"Chưa tải lên được\", \"“\\(tab.title)” chưa kết nối. Đợi kết nối xong hoặc bấm Kết nối lại.\")\n            return\n        }\n        guard !paths.isEmpty else { return }\n        let inspected = await Task.detached { BrowserTransferPlanner.inspectLocalSources(paths) }.value\n        let remoteNames: Set<String>\n        do {\n            let listing = try await tab.files.list(tab.path)  // listing mới nhất (không nguyên tử, có race)\n            remoteNames = Set(listing.entries.map(\\.name))\n        } catch {\n            tab.noteFailure(error)\n            dialog = .error(\"Không kiểm tra được thư mục đích\", BrowserErrorText.message(for: error))\n            return\n        }\n        let plan = BrowserTransferPlanner.planUpload(\n            items: inspected.items, remoteDirectory: tab.path, remoteNames: remoteNames)\n        var notes = inspected.rejections.map(\\.message)\n        notes += plan.unsupported.map { \"“\\($0)”: tên chứa ký tự điều khiển, không hỗ trợ.\" }\n        let proceed: @MainActor () -> DialogOutcome = { [weak self] in\n            self?.continueUpload(plan, to: tab) ?? .done\n        }\n        if notes.isEmpty {\n            apply(proceed())\n        } else if plan.isEmpty {\n            dialog = .notice(\n                NoticeDialog(\n                    title: \"Không có mục nào tải lên được\",\n                    message: \"Các mục sau bị từ chối:\", items: notes))\n        } else {\n            dialog = .notice(\n                NoticeDialog(\n                    title: \"Một số mục bị bỏ qua\",\n                    message: \"Các mục sau bị từ chối, phần còn lại vẫn tiếp tục:\", items: notes,\n                    then: proceed))\n        }\n    }\n\n    private func continueUpload(_ plan: TransferBatchPlan, to tab: BrowserTab) -> DialogOutcome {\n        guard plan.hasConflicts else { return finishUpload(plan, .overwriteAll, to: tab) }\n        let hasDirectory = plan.items.contains { $0.kind == .directory && plan.conflicts.contains($0.name) }\n        return .next(\n            .conflicts(\n                ConflictDialog(\n                    title: \"\\(plan.conflicts.count) mục đã có trên \\(tab.title) trong \\(plan.destinationDirectory)\",\n                    names: plan.conflicts,\n                    note: \"scp không kiểm tra nguyên tử: kiểm tra dựa trên danh sách vừa tải.\"\n                        + (hasDirectory\n                            ? \" Thư mục trùng tên sẽ được gộp vào (file trùng bị ghi đè, file khác giữ nguyên).\"\n                            : \"\"),\n                    allowAutoRename: false,\n                    choose: { [weak self] choice in\n                        guard let self, let choice else { return .done }\n                        return self.finishUpload(plan, choice, to: tab)\n                    })))\n    }\n\n    private func finishUpload(\n        _ plan: TransferBatchPlan, _ choice: BatchConflictChoice, to tab: BrowserTab\n    ) -> DialogOutcome {\n        let planned = BrowserTransferPlanner.uploadJobs(plan, choice: choice)\n        guard !planned.isEmpty else {\n            app?.showToast(\"Không có mục nào để tải lên\")\n            return .done\n        }\n        let host = tab.host\n        let enqueue: @MainActor () async -> DialogOutcome = { [weak self] in\n            guard let self else { return .done }\n            return await self.enqueue(planned, host: host, tab: tab)\n        }\n        guard BrowserSafety.requiresUploadConfirmation(host) else {\n            Task { apply(await enqueue()) }\n            return .done\n        }\n        let names = planned.map { BrowserPath.lastComponent($0.source) }\n        return .next(\n            .confirm(\n                ConfirmDialog(\n                    title: BrowserSafety.uploadConfirmationTitle(host),\n                    message: \"\\(planned.count) mục → \\(tab.path)\",\n                    emphasis: \"Đây là máy PRODUCTION — kiểm tra kỹ đích trước khi tải lên.\",\n                    items: names, confirmTitle: \"Tải lên\", action: enqueue)))\n    }\n\n    // MARK: - Download\n\n    /// Menu \"Tải về\": các dòng remote đang chọn → thư mục local hiện tại.\n    func downloadSelected(from tab: BrowserTab) async {\n        let items = tab.selectedRows.filter(\\.isSupported).map(BatchItem.init(row:))\n        await startDownload(items: items, from: tab)\n    }\n\n    func startDownload(items: [BatchItem], from tab: BrowserTab) async {\n        let destination = local.path\n        let plan = BrowserTransferPlanner.planDownload(items: items, localDirectory: destination)\n        let notes = plan.unsupported.map { \"“\\($0)”: tên chứa ký tự điều khiển, không hỗ trợ.\" }\n        let proceed: @MainActor () -> DialogOutcome = { [weak self] in\n            self?.continueDownload(plan, from: tab) ?? .done\n        }\n        if plan.isEmpty {\n            if !notes.isEmpty {\n                dialog = .notice(NoticeDialog(title: \"Không có mục nào tải về được\", message: \"\", items: notes))\n            }\n        } else if notes.isEmpty {\n            apply(proceed())\n        } else {\n            dialog = .notice(\n                NoticeDialog(\n                    title: \"Một số mục bị bỏ qua\", message: \"Các mục sau không hỗ trợ:\", items: notes,\n                    then: proceed))\n        }\n    }\n\n    private func continueDownload(_ plan: TransferBatchPlan, from tab: BrowserTab) -> DialogOut
