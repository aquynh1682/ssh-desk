      Button(\"Xoá mọi mật khẩu đã lưu…\", role: .destructive) {\n                    Task {\n                        savedPasswordCount = await model.savedPasswordCount()\n                        if savedPasswordCount == 0 {\n                            model.showToast(\"Chưa có mật khẩu nào được lưu\")\n                        } else {\n                            confirmClearPasswords = true\n                        }\n                    }\n                }\n            }\n        }\n    }\n\n    private var analyst: some View {\n        SettingsGroup(\"Project Analyst\") {\n            SettingsRow(\"Số lần chạy giữ mỗi thư mục\") {\n                Stepper(value: bind(\\.analystRetention), in: AppSettings.analystRetentionRange, step: 10) {\n                    Text(\"\\(s.analystRetention)\").monospacedDigit()\n                }\n                .frame(width: 130)\n            }\n            SettingsRow(\n                \"Timeout thử kết nối\", hint: \"Chèn vào lệnh probe (timeout/nc -w) dưới dạng số nguyên 1–10 giây.\"\n            ) {\n                Stepper(\n                    value: Binding(\n                        get: { s.analystProbeTimeout.seconds },\n                        set: { v in model.updateSettings { $0.analystProbeTimeout = ProbeTimeout(v) } }),\n                    in: ProbeTimeout.range\n                ) {\n                    Text(\"\\(s.analystProbeTimeout.seconds) giây\").monospacedDigit()\n                }\n                .frame(width: 130)\n            }\n        }\n    }\n\n    private var monitor: some View {\n        SettingsGroup(\"Monitor\") {\n            SettingsRow(\"Chu kỳ làm mới mặc định\") {\n                Picker(\"\", selection: bind(\\.monitorIntervalSeconds)) {\n                    ForEach(AppSettings.monitorIntervalChoices, id: \\.self) { Text(\"\\($0) giây\").tag($0) }\n                }\n                .labelsHidden().frame(width: 110)\n            }\n            SettingsRow(\"Ngưỡng vàng (%)\") {\n                Stepper(\n                    value: Binding(\n                        get: { s.monitorThresholds.warning },\n                        set: { v in\n                            model.updateSettings {\n                                $0.monitorThresholds = MonitorThresholds(\n                                    warning: v, danger: $0.monitorThresholds.danger)\n                            }\n                        }),\n                    in: MonitorThresholds.warningRange\n                ) {\n                    Text(\"\\(s.monitorThresholds.warning)%\").monospacedDigit()\n                }\n                .frame(width: 130)\n            }\n            SettingsRow(\"Ngưỡng đỏ (%)\", hint: \"Lớn hơn ngưỡng vàng, tối đa \\(MonitorThresholds.maxDanger).\") {\n                Stepper(\n                    value: Binding(\n                        get: { s.monitorThresholds.danger },\n                        set: { v in\n                            model.updateSettings {\n                                $0.monitorThresholds = MonitorThresholds(\n                                    warning: $0.monitorThresholds.warning, danger: v)\n                            }\n                        }),\n                    in: (s.monitorThresholds.warning + 1)...MonitorThresholds.maxDanger\n                ) {\n                    Text(\"\\(s.monitorThresholds.danger)%\").monospacedDigit()\n                }\n                .frame(width: 130)\n            }\n            MetricSourcesSection(model: model)\n        }\n    }\n\n    private var windows: some View {\n        SettingsGroup(\"Windows App\") {\n            Text(\"Mặc định cho máy Windows tạo mới (máy đã có không đổi).\")\n                .font(.caption).foregroundStyle(Theme.textSecondary)\n            SettingsRow(\"Toàn màn hình\") {\n                Toggle(\"\", isOn: bind(\\.rdpFullScreen)).labelsHidden().toggleStyle(.switch)\n            }\n            SettingsRow(\"Nhiều màn hình\") {\n                Toggle(\"\", isOn: bind(\\.rdpMultiMonitor)).labelsHidden().toggleStyle(.switch)\n            }\n            SettingsRow(\"Chia sẻ clipboard\") {\n                Toggle(\"\", isOn: bind(\\.rdpRedirectClipboard)).labelsHidden().toggleStyle(.switch)\n            }\n        }\n    }\n\n    private var data: some View {\n        SettingsGroup(\"Dữ liệu\") {\n            SettingsRow(\"Danh sách máy chủ\", hint: \"File JSON, không chứa mật khẩu.\") {\n                Button(\"Xuất…\") { model.exportHosts(.all) }.disabled(model.hosts.isEmpty)\n                Button(\"Nhập…\") { model.beginImportFile() }\n            }\n            SettingsRow(\"Thư mục dữ liệu\") {\n                Button(\"Mở trong Finder\") { model.revealDataFolder() }\n            }\n            SettingsRow(\"Phiên bản\") {\n                Text(\"SSH Desk \\(Self.appVersion) · schema \\(Database.currentSchemaVersion)\")\n                    .foregroundStyle(Theme.textSecondary)\n            }\n            SettingsRow(\"File SQLite\") {\n                Text(shortPath(model.paths.databaseURL.path)).lineLimit(1).truncationMode(.middle)\n                    .foregroundStyle(Theme.textSecondary).frame(maxWidth: 360, alignment: .trailing)\n                    .textSelection(.enabled)\n            }\n        }\n    }\n\n    // MARK: - Hỗ trợ\n\n    private func bind<T: Equatable>(_ keyPath: WritableKeyPath<AppSettings, T>) -> Binding<T> {\n        Binding(\n            get: { model.settings[keyPath: keyPath] },\n            set: { v in model.updateSettings { $0[keyPath: keyPath] = v } })\n    }\n\n    private static var appVersion: String {\n        Bundle.main.object(forInfoDictionaryKey: \"CFBundleShortVersionString\") as? String ?? \"dev\"\n    }\n\n    private func shortPath(_ p: String) -> String {\n        BrowserPath.display(p, home: NSHomeDirectory())\n    }\n\n    private func chooseLocalDirectory() {\n        let panel = NSOpenPanel()\n        panel.canChooseFiles = false\n        panel.canChooseDirectories = true\n        panel.canCreateDirectories = true\n        panel.allowsMultipleSelection = false\n        panel.directoryURL = URL(fileURLWithPath: s.resolvedLocalDirectory())\n        if panel.runModal() == .OK, let url = panel.url {\n            model.updateSettings { $0.defaultLocalDirectory = url.path }\n        }\n    }\n\n    private func chooseConfigFile() {\n        let panel = NSOpenPanel()\n        panel.canChooseFiles = true\n        panel.canChooseDirectories = false\n        panel.allowsMultipleSelection = false\n        panel.showsHiddenFiles = true\n        panel.directoryURL = FileManager.default.homeDirectoryForCurrentUser.appendingPathComponent(\".ssh\")\n        if panel.runModal() == .OK, let url = panel.url {\n            configPathText = url.path\n            commitConfigPath()\n        }\n    }\n\n    /// Rỗng = mặc định. Ngược lại phải qua `validateUserConfigPath`; sai thì giữ giá trị cũ và báo lỗi.\n    private func commitConfigPath() {\n        let text = configPathText.trimmingCharacters(in: .whitespacesAndNewlines)\n        if text.isEmpty {\n            configPathError = nil\n            model.updateSettings { $0.userSSHConfigPath = \"\" }\n            return\n        }\n        do {\n            try AppSettings.validateUserConfigPath(text)\n            configPathError = nil\n            model.updateSettings { $0.userSSHConfigPath = text }\n        } catch let e as AppSettings.ConfigPathError {\n            configPathError = Self.message(for: e)\n        } catch {\n            configPathError = error.localizedDescription\n        }\n    }\n\n    private static func message(for e: AppSettings.ConfigPathError) -> String {\n        switch e {\n        case .notAbsolute: return \"Phải là đường dẫn tuyệt đối (bắt đầu bằng /), không dùng ~.\"\n        case .controlCharacter: return \"Đường dẫn chứa ký tự điều khiển hoặc xuống dòng.\"\n        case .unsupportedCharacter: return \"Đường dẫn chứa ký tự % (ssh diễn giải ký tự này).\"\n        case .notFound: return \"Không tìm thấy file này.\"\n        case .notAFile: return \"Đây là thư mục, hãy chọn một file config.\"\n        }\n    }\n}\n\n/// Khối một nhóm cài đặt.\nprivate struct SettingsGroup<Content: View>: View {\n    let title: String\n    @ViewBuilder let content: () -> Content\n\n    init(_ title: String, @ViewBuilder content: @escaping () -> Content) {\n        self.title = title\n        self.content = content\n    }\n\n    var body: some View {\n        VStack(alignment: .leading, spacing: 12) {\n            Text(title.uppercased()).font(.system(size: 11, weight: .semibold)).tracking(0.6)\n                .foregroundStyle(Theme.textTertiary)\n            content()\n        }\n        .padding(16)\n        .frame(maxWidth: .infinity, alignment: .leading)\n        .cardStyle()\n    }\n}\n\n/// Một dòng: nhãn (+ chú thích) bên trái, điều khiển bên phải.\nprivate struct SettingsRow<Controls: View>: View {\n    let label: String\n    var hint: String?\n    @ViewBuilder let controls: () -> Controls\n\n    init(_ label: String, hint: String? = nil, @ViewBuilder controls: @escaping () -> Controls) {\n        self.label = label\n        self.hint = hint\n        self.controls = controls\n    }\n\n    var body: some View {\n        HStack(alignment: .center, spacing: 12) {\n            VStack(alignment: .leading, spacing: 2) {\n                Text(label).font(.system(size: 13.5)).foregroundStyle(Theme.textPrimary)\n                if let hint {\n                    Text(hint).font(.caption).foregroundStyle(Theme.textSecondary)\n                        .fixedSize(horizontal: false, vertical: true)\n                }\n            }\n            Spacer(minLength: 12)\n            HStack(spacing: 8, content: controls)\n        }\n    }\n}\n"}, "Sources/SSHDesk/TransferQueueView.swift": {"group": "Giao diện", "text": "import AppKit\nimport SSHDeskCore\nimport SwiftUI\n\n/// \"Hàng đợi truyền\" ở đáy màn Truyền file: tab Đang chạy / Hoàn tất.\nstruct TransferQueueView: View {\n    @Bindable var model: AppModel\n    @Local private var showCompleted = false\n\n    var body: some View {\n        let active = TransferPresentation.active(model.jobs)\n        let done = TransferPresentation.history(model.jobs)\n        let shown = showCompleted ? done : active\n        VStack(spacing: 0) {\n            HStack(spacing: 12) {\n                Text(\"Hàng đợi truyền\").font(.system(size: 16, weight: .semibold))\n                tabButton(\"Đang chạy\", count: active.count, selected: !showCompleted) { showCompleted = false }\n                tabButton(\"Hoàn tất\", count: done.count, selected: showCompleted) { showCompleted = true }\n                Spacer()\n                Button {\n                    Task { await model.clearHistory() }\n                } label: {\n                    Label(\"Xoá mục đã xong\", systemImage: \"trash\")\n                }\n                .buttonStyle(OutlineButtonStyle()).controlSize(.small)\n                .disabled(done.isEmpty)\n                .help(\"Chỉ xoá các dòng trong hàng đợi, không xoá file nào\")\n            }\n            .padding(.horizontal, 16).padding(.vertical, 10)\n            Divider().overlay(Theme.divider)\n            header\n            Divider().overlay(Theme.divider)\n            if shown.isEmpty {\n                Text(showCompleted ? \"Chưa có tác vụ nào hoàn tất.\" : \"Không có tác vụ đang chạy.\")\n                    .font(.system(size: 13)).foregroundStyle(Theme.textSecondary)\n                    .frame(maxWidth: .infinity, maxHeight: .infinity)\n            } else {\n                ScrollView {\n                    LazyVStack(spacing: 0) {\n                        ForEach(shown) { job in\n                            QueueRow(model: model, job: job)\n                            Divider().overlay(Theme.divider)\n                        }\n                    }\n                }\n            }\n        }\n        .cardStyle()\n    }\n\n    private func tabButton(_ title: String, count: Int, selected: Bool, action: @escaping () -> Void)\n        -> some View\n    {\n        Button(action: action) {\n            HStack(spacing: 8) {\n                Text(title)\n                Text(\"\\(count)\").font(.system(size: 11, weight: .semibold))\n                    .padding(.horizontal, 7).padding(.vertical, 1)\n                    .background(Theme.rowSelected, in: Capsule())\n            }\n            .font(.system(size: 13, weight: selected ? .semibold : .regular))\n            .padding(.horizontal, 12).padding(.vertical, 6)\n            .background(selected ? Theme.rowSelected : .clear, in: RoundedRectangle(cornerRadius: 8))\n            .foregroundStyle(Theme.textPrimary)\n        }\n        .buttonStyle(.plain)\n        .accessibilityAddTraits(selected ? .isSelected : [])\n    }\n\n    private var header: some View {\n        HStack(spacing: 0) {\n            Text(\"File\").frame(maxWidth: .infinity, alignment: .leading)\n            Text(\"Từ → Đến\").frame(width: QueueRow.routeWidth, alignment: .leading)\n            Text(\"Tiến độ\").frame(width: QueueRow.progressWidth, alignment: .leading)\n            Text(\"Trạng thái\").frame(width: QueueRow.statusWidth, alignment: .leading)\n        }\n        .font(.system(size: 12)).foregroundStyle(Theme.textSecondary)\n        .padding(.horizontal, 16).padding(.vertical, 6)\n    }\n}\n\nprivate struct QueueRow: View {\n    static let routeWidth: CGFloat = 210\n    static let progressWidth: CGFloat = 230\n    static let statusWidth: CGFloat = 170\n\n    @Bindable var model: AppModel\n    let job: TransferJob\n\n    var body: some View {\n        let route = TransferPresentation.route(for: job)\n        HStack(spacing: 0) {\n            HStack(spacing: 10) {\n                Image(systemName: job.itemKind == .directory ? \"folder\" : \"doc\")\n                    .font(.system(size: 16)).foregroundStyle(Theme.textSecondary).frame(width: 22)\n                Text(TransferPresentation.fileName(for: job)).font(.system(size: 13.5))\n                    .lineLimit(1).truncationMode(.middle)\n            }\n            .frame(maxWidth: .infinity, alignment: .leading)\n            HStack(spacing: 6) {\n                Text(route.from).lineLimit(1)\n                Image(systemName: \"arrow.right\").font(.system(size: 9))\n                Text(route.to).lineLimit(1)\n            }\n            .font(.system(size: 12.5)).foregroundStyle(Theme.textSecondary)\n            .frame(width: Self.routeWidth, alignment: .leading)\n            progress.frame(width: Self.progressWidth, alignment: .leading)\n            HStack(spacing: 6) {\n                status\n                Spacer(minLength: 0)\n                actions\n            }\n            .frame(width: Self.statusWidth, alignment: .leading)\n        }\n        .padding(.horizontal, 16).padding(.vertical, 8)\n        .accessibilityElement(children: .contain)\n    }\n\n    /// Thanh xanh + \"% · tốc độ\" chỉ khi có fraction thật; không thì thanh không xác định.\n    @ViewBuilder\n    private var progress: some View {\n        switch job.state {\n        case .connecting, .transferring, .finalizing:\n            HStack(spacing: 8) {\n                if let f = TransferPresentation.fraction(for: job) {\n                    ProgressView(value: f).tint(Theme.green)\n                } else {\n                    ProgressView().progressViewStyle(.linear).tint(Theme.green)\n                }\n                if let detail = BrowserFormat.progressDetail(for: job) {\n                    Text(detail).font(.system(size: 12)).foregroundStyle(Theme.textSecondary).fixedSize()\n                }\n            }\n            .padding(.trailing, 12)\n        default:\n            if let reason = job.failureReason, job.state != .completed || TransferPresentation.isSkipped(job) {\n                Text(reason).font(.system(size: 12)).lineLimit(1).truncationMode(.tail)\n                    .foregroundStyle(job.state == .failed ? Theme.red : Theme.textSecondary)\n                    .help(reason).padding(.trailing, 12)\n            } else {\n                EmptyView()\n            }\n        }\n    }\n\n    @ViewBuilder\n    private var status: some View {\n        switch job.state {\n        case .completed:\n            label(\n                TransferPresentation.isSkipped(job) ? \"minus.circle.fill\" : \"checkmark.circle.fill\",\n                TransferPresentation.isSkipped(job) ? Theme.textSecondary : Theme.green)\n        case .failed: label(\"exclamationmark.circle.fill\", Theme.red)\n        case .awaitingUserInput: label(\"lock.shield\", Theme.amber)\n        default:\n            Text(TransferPresentation.label(for: job)).font(.system(size: 12.5))\n                .foregroundStyle(Theme.textSecondary).lineLimit(1)\n        }\n    }\n\n    private func label(_ symbol: String, _ color: Color) -> some View {\n        HStack(spacing: 5) {\n            Image(systemName: symbol)\n            Text(TransferPresentation.label(for: job)).lineLimit(1)\n        }\n        .font(.system(size: 12.5)).foregroundStyle(color)\n    }\n\n    @ViewBuilder\n    private var actions: some View {\n        HStack(spacing: 4) {\n            if TransferPresentation.canCancel(job.state) {\n                iconButton(\"xmark\", \"Huỷ\") { Task { await model.cancel(job) } }\n            }\n            if TransferPresentation.canRetry(job.state) {\n                iconButton(\"arrow.clockwise\", \"Thử lại\") { Task { await model.retry(job) } }\n            }\n            if let p = TransferPresentation.revealPath(for: job) {\n                iconButton(\"folder\", \"Mở trong Finder\") {\n                    NSWorkspace.shared.activateFileViewerSelecting([URL(fileURLWithPath: p)])\n                }\n            }\n        }\n    }\n\n    private func iconButton(_ symbol: String, _ help: String, _ action: @escaping () -> Void) -> some View {\n        Button(action: action) {\n            Image(systemName: symbol).font(.system(size: 12)).foregroundStyle(Theme.textSecondary)\n                .frame(width: 24, height: 24).contentShape(Rectangle())\n        }\n        .buttonStyle(.plain).help(help).accessibilityLabel(help)\n    }\n}\n"}, "Sources/SSHDeskCore/Analyst/AnalystCoordinator.swift": {"group": "Core · Analyst", "text": "import Foundation\n\n/// Nơi lấy phiên để chạy lệnh trên từng server (thật: `PooledAnalystSessions`; test: giả).\npublic protocol AnalystSessionProviding: Sendable {\n    /// Ném `SessionConnectError` khi không mở được; `CancellationError` khi bị huỷ.\n    func executor(for host: HostProfile) async throws -> any RemoteCommandExecuting\n    /// Đóng các phiên do provider tự mở (không đụng phiên của màn Truyền file).\n    func finish() async\n}\n\n/// Provider thật: tái dùng phiên đang sống trong `SessionPool` (vd tab Truyền file cùng host), chưa có thì\n/// tự mở qua `SessionConnector` (đăng ký vào pool với owner `.analyst`).\npublic actor PooledAnalystSessions: AnalystSessionProviding {\n    public typealias PromptHandler =\n        @Sendable (HostProfile, PromptKind, @escaping SessionConnector.Respond) -> Void\n\n    private let pool: SessionPool\n    private let connector: SessionConnector\n    private let onPrompt: PromptHandler\n    private var opened: [(UUID, RemoteSession)] = []\n\n    public init(pool: SessionPool, connector: SessionConnector, onPrompt: @escaping PromptHandler) {\n        self.pool = pool\n        self.connector = connector\n        self.onPrompt = onPrompt\n    }\n\n    public func executor(for host: HostProfile) async throws -> any RemoteCommandExecuting {\n        if let live = await pool.liveSession(for: host.id) {\n            return RemoteCommandRunner(session: live)\n        }\n        let handler = onPrompt\n        let session = try await connector.connect(host: host) { kind, respond in\n            handler(host, kind, respond)\n        }\n        await pool.register(hostID: host.id, session: session, owner: .analyst)\n        opened.append((host.id, session))\n        return RemoteCommandRunner(session: session)\n    }\n\n    public func finish() async {\n        let list = opened\n        opened = []\n        for (id, s) in list {\n            await pool.unregister(hostID: id, session: s)\n            await s.close()\n        }\n    }\n}\n\npublic enum AnalystProgress: Sendable, Equatable {\n    case connecting(host: String, index: Int, total: Int)\n    case collecting(done: Int, total: Int, host: String)\n    case testing(done: Int, total: Int)\n    case saving\n}\n\n/// Kết quả bước thu thập: giữ các executor để bước thử dùng lại.\npublic struct AnalystCollection: Sendable {\n    public var folderName: String\n    public var startedAt: Date\n    public var hosts: [HostProfile]\n    public var topology: Topology\n    public var warnings: [AnalystWarning]\n    var executors: [UUID: any RemoteCommandExecuting]\n}\n\n/// Điều phối một lần chạy Project Analyst cho một thư mục: mở phiên → thu thập (song song ≤ 4) →\n/// dựng topology → thử kết nối → lưu. Server mất phiên/thiếu công cụ chỉ ghi cảnh báo.\npublic actor AnalystCoordinator {\n    public static let maxParallel = 4\n\n    /// Lệnh thu thập thật sự có thể chạy (không gồm `hostname`: kết quả không được dùng).\n    public static let collectionCommands: [AnalystCommand] = ProdGuard.collectionCommands.filter {\n        $0 != .hostname\n    }\n\n    private let sessions: any AnalystSessionProviding\n    private let repository: AnalystRunRepository?\n    private let now: @Sendable () -> Date\n    private let probeTimeout: ProbeTimeout\n\n    public init(\n        sessions: any AnalystSessionProviding, repository: AnalystRunRepository?,\n        probeTimeout: ProbeTimeout = .default, now: @escaping @Sendable () -> Date = { Date() }\n    ) {\n        self.probeTimeout = probeTimeout\n        self.sessions = sessions\n        self.repository = repository\n        self.now = now\n    }\n\n    // MARK: - Chạy đủ\n\n    /// Thu thập + thử + lưu. Huỷ → ném `CancellationError` (không lưu). Luôn đóng phiên tự mở khi xong.\n    public func run(\n        folder: String, hosts: [HostProfile], progress: (@Sendable (AnalystProgress) -> Void)? = nil\n    ) async throws -> StoredAnalystRun {\n        do {\n            let collection = try await collect(folder: folder, hosts: hosts, progress: progress)\n            let results = try await test(collection, progress: progress)\n            progress?(.saving)\n            let run = Self.makeRun(collection, results: results, finishedAt: now())\n            if let repository { try await repository.save(run) }\n            await sessions.finish()\n            return run\n        } catch {\n            await sessions.finish()\n            throw error\n        }\n    }\n\n    public static func makeRun(\n        _ c: AnalystCollection, results: [FlowTestResult], finishedAt: Date\n    ) -> StoredAnalystRun {\n        StoredAnalystRun(\n            folderName: c.folderName, startedAt: c.startedAt, finishedAt: finishedAt,\n            status: c.warnings.isEmpty ? .completed : .partial, warnings: c.warnings,\n            topology: c.topology, results: results)\n    }\n\n    // MARK: - Thu thập\n\n    public func collect(\n        folder: String, hosts: [HostProfile], progress: (@Sendable (AnalystProgress) -> Void)? = nil\n    ) async throws -> AnalystCollection {\n        let started = now()\n        var warnings: [AnalystWarning] = []\n        var executors: [UUID: any RemoteCommandExecuting] = [:]\n\n        for (i, host) in hosts.enumerated() {\n            try Task.checkCancellation()\n            guard host.sshAlias != nil else {\n                warnings.append(AnalystWarning(kind: .noAlias, hostID: host.id, hostName: host.displayName))\n                continue\n            }\n            progress?(.connecting(host: host.displayName, index: i + 1, total: hosts.count))\n            do {\n                executors[host.id] = try await sessions.executor(for: host)\n            } catch is CancellationError {\n                throw CancellationError()\n            } catch let e as SessionConnectError {\n                warnings.append(\n                    AnalystWarning(\n                        kind: .sessionFailed, hostID: host.id, hostName: host.displayName,\n                        detail: e.message))\n            } catch {\n                warnings.append(\n                    AnalystWarning(\n                        kind: .sessionFailed, hostID: host.id, hostName: host.displayName,\n                        detail: String(describing: error)))\n            }\n        }\n        try Task.checkCancellation()\n\n        // Thu thập song song ≤ 4.\n        let targets = hosts.filter { executors[$0.id] != nil }\n        var collected: [UUID: Collected] = [:]\n        var done = 0\n        await withTaskGroup(of: (UUID, Collected).self) { group in\n            var next = 0\n            func launch() {\n                let host = targets[next]\n                let exec = executors[host.id]!\n                next += 1\n                group.addTask { (host.id, await Self.collectServer(host: host, executor: exec)) }\n            }\n            while next < min(Self.maxParallel, targets.count) { launch() }\n            while let (id, c) = await group.next() {\n                collected[id] = c\n                done += 1\n                let name = hosts.first { $0.id == id }?.displayName ?? \"\"\n                progress?(.collecting(done: done, total: targets.count, host: name))\n                if next < targets.count, !Task.isCancelled { launch() }\n            }\n        }\n        try Task.checkCancellation()\n\n        var snapshots: [ServerSnapshot] = []\n        for host in hosts {\n            let c = collected[host.id]\n            snapshots.append(\n                ServerSnapshot(\n                    hostID: host.id, displayName: host.displayName, hostName: host.hostName,\n                    addresses: c?.addresses, sockets: c?.sockets))\n            warnings.append(\n                contentsOf: c?.warnings.map {\n                    var w = $0\n                    w.hostName = host.displayName\n                    w.hostID = host.id\n                    return w\n                } ?? [])\n        }\n        let topology = TopologyBuilder.build(snapshots)\n        for w in topology.warnings {\n            if case .duplicateIP(let ip, _) = w {\n                warnings.append(AnalystWarning(kind: .duplicateIP, detail: ip))\n            }\n        }\n        return AnalystCollection(\n            folderName: folder, startedAt: started, hosts: hosts, topology: topology,\n            warnings: warnings, executors: executors)\n    }\n\n    struct Collected: Sendable {\n        var sockets: [SocketRecord]?\n        var addresses: [InterfaceAddress]?\n        var warnings: [AnalystWarning]\n    }\n\n    enum Fetch {\n        case ok(String)\n        case failed(AnalystWarning.Kind, String)\n    }\n\n    /// Thử lần lượt các lệnh; công cụ thiếu thì không thử lệnh dự phòng cùng công cụ.\n    static func fetch(_ commands: [AnalystCommand], _ executor: any RemoteCommandExecuting) async -> Fetch {\n        var last: Fetch = .failed(.collectFailed, \"\")\n        var missing = Set<String>()\n        for cmd in commands {\n            if missing.contains(cmd.primaryTool) { continue }\n            do {\n                let r = try await executor.execute(cmd)\n                if r.exitStatus == 0, !r.timedOut { return .ok(r.stdout) }\n                last = .failed(.collectFailed, \"\")\n            } catch RemoteCommandError.sessionLost {\n                return .failed(.sessionLost, \"\")\n            } catch RemoteCommandError.toolMissing(let t) {\n                missing.insert(cmd.primaryTool)\n                last = .failed(.toolMissing, t)\n            } catch {\n                last = .failed(.collectFailed, \"\")\n            }\n        }\n        return last\n    }\n\n    static func collectServer(host: HostProfile, executor: any RemoteCommandExecuting) async -> Collected {\n        var out = Collected(sockets: nil, addresses: nil, warnings: [])\n        switch await fetch([.sockets, .socketsNoProcess], executor) {\n        case .ok(let text):\n            let parsed = SocketTableParser.parse(text)\n            out.sockets = parsed.records\n            if parsed.unparsed > 0 {\n                out.warnings.append(AnalystWarning(kind: .unparsedLines, detail: String(parsed.unparsed)))\n            }\n        case .failed(let kind, let detail):\n            out.warnings.append(AnalystWarning(kind: kind, detail: detail))\n            if kind == .sessionLost { return out }\n        }\n        switch await fetch([.addresses, .hostnameIPs], executor) {\n        case .ok(let text):\n            let a = AddressParser.parseIPAddr(text)\n            out.addresses = a.addresses.isEmpty ? AddressParser.parseHostnameIPs(text).addresses : a.addresses\n        case .failed(let kind, _):\n            if kind == .sessionLost {\n                if !out.warnings.contains(where: { $0.kind == .sessionLost }) {\n                    out.warnings.append(AnalystWarning(kind: .sessionLost))\n                }\n            } else if IPLiteral(host.hostName) == nil {\n                out.warnings.append(AnalystWarning(kind: .addressesMissing))\n            }\n        }\n        return out\n    }\n\n    // MARK: - Thử\n\n    /// Thử mọi cạnh của topology. Huỷ → ném `CancellationError`.\n    public func test(\n        _ c: AnalystCollection, progress: (@Sendable (AnalystProgress) -> Void)? = nil\n    ) async throws -> [FlowTestResult] {\n        let flows = c.topology.flows\n        if flows.isEmpty { return [] }\n        let tester = ConnectivityTester(executors: c.executors, probeTimeout: probeTimeout)\n        let results = await tester.run(flows: flows) { done, total in\n            progress?(.testing(done: done, total: total))\n        }\n        try Task.checkCancellation()\n        return results\n    }\n\n    /// Thử lại đúng một cạnh (mở lại phiên nếu cần). Gọi `finish()` của provider khi xong.\n    public func retest(\n        flow: TopologyFlow, source: HostProfile, destination: HostProfile\n    ) async throws -> FlowTestResult {\n        defer { Task { [sessions] in await sessions.finish() } }\n        var executors: [UUID: any RemoteCommandExecuting] = [:]\n        for host in [source, destination] {\n            do { executors[host.id] = try await sessions.executor(for: host) } catch is CancellationError {\n                throw CancellationError()\n            } catch {\n                if host.id == source.id {\n                    return FlowTestResult(\n                        flow: flow.flow, outcome: .untestable(.noExecutor), destinationCheck: .unknown,\n                        evidence: [\n                            Evidence(title: \"Không mở được phiên\", detail: \"máy nguồn \\(host.displayName)\")\n                        ], cause: nil)\n                }\n            }\n        }\n        let tester = ConnectivityTester(executors: executors, probeTimeout: probeTimeout)\n        let r = await tester.run(flows: [flow])\n        try Task.checkCancellation()\n        return r.first\n            ?? FlowTestResult(\n                flow: flow.flow, outcome: .untestable(.noExecutor), destinationCheck: .unknown,\n                evidence: [], cause: nil)\n    }\n\n    /// Đóng phiên tự mở (dùng khi huỷ/thoát).\n    public func finish() async { await sessions.finish() }\n}\n"}, "Sources/SSHDeskCore/Analyst/ProdGuard.swift": {"group": "Core · Analyst", "text": "import Foundation\n\n/// Một server sẽ bị chạy lệnh trong lần quét.\npublic struct ProdGuardServer: Sendable {\n    public var hostID: UUID\n    public var displayName: String\n    public var environment: HostEnvironment\n    public var commands: [AnalystCommand]\n\n    public init(\n        hostID: UUID, displayName: String, environment: HostEnvironment, commands: [AnalystCommand]\n    ) {\n        self.hostID = hostID\n        self.displayName = displayName\n        self.environment = environment\n        self.commands = commands\n    }\n}\n\npublic struct ProdGuardEntry: Sendable, Equatable {\n    public var hostID: UUID\n    public var displayName: String\n    public var environment: HostEnvironment\n    /// Chuỗi lệnh CHÍNH XÁC sẽ gửi (đã bỏ lệnh không hỗ trợ).\n    public var commandStrings: [String]\n}\n\npublic struct ProdGuardPrompt: Sendable, Equatable {\n    /// Có ít nhất một server PROD → phải hỏi xác nhận mỗi lần.\n    public var requiresConfirmation: Bool\n    public var entries: [ProdGuardEntry]\n    public var prodNames: [String]\n\n    /// Văn bản mô tả cho hộp xác nhận.\n    public var message: String {\n        var lines = [\n            \"Project có server PROD: \\(prodNames.joined(separator: \", \")). Sẽ chạy các lệnh chỉ-xem sau:\"\n        ]\n        for e in entries {\n            lines.append(\"\")\n            lines.append(\"\\(e.displayName) [\\(e.environment.rawValue)]\")\n            for c in e.commandStrings { lines.append(\"  \\(c)\") }\n        }\n        return lines.joined(separator: \"\\n\")\n    }\n}\n\npublic enum ProdGuard {\n    /// Lệnh thu thập (kể cả dự phòng) chạy trên MỌI server của project.\n    public static let collectionCommands: [AnalystCommand] = [\n        .sockets, .socketsNoProcess, .addresses, .hostnameIPs, .hostname,\n    ]\n\n    public static func prompt(for servers: [ProdGuardServer]) -> ProdGuardPrompt {\n        let entries = servers.map {\n            ProdGuardEntry(\n                hostID: $0.hostID, displayName: $0.displayName, environment: $0.environment,\n                commandStrings: $0.commands.compactMap(\\.commandString))\n        }\n        let prod = servers.filter { $0.environment == .prod }.map(\\.displayName)\n        return ProdGuardPrompt(\n            requiresConfirmation: !prod.isEmpty, entries: entries, prodNames: prod)\n    }\n}\n"}, "Sources/SSHDeskCore/App/ConnectionService.swift": {"group": "Core · App", "text": "import Foundation\n\npublic enum ConnectionServiceError: Error, Equatable {\n    /// Hồ sơ imported thiếu alias.\n    case missingAlias\n    /// Hồ sơ imported: app không sửa (cấu hình nằm trong `~/.ssh/config` của người dùng).\n    case importedHostReadOnly\n    case hostNotFound\n    /// Thao tác chỉ dành cho máy Linux/SSH, nhưng host là máy Windows.\n    case notSSHHost\n    /// Thao tác chỉ dành cho máy Windows.\n    case notWindowsHost\n    /// Không có kho Keychain (không thể xoá mật khẩu thật).\n    case credentialsUnavailable\n    /// Bộ đã xoá khỏi DB nhưng `count` mục trong kho (Keychain) không xoá được.\n    case setDeletedButKeychainFailed(count: Int)\n}\n\n/// Kết quả import: hồ sơ mới tạo và alias bị bỏ qua vì đã import từ cùng file.\npublic struct ImportOutcome: Sendable, Equatable {\n    public var imported: [HostProfile]\n    public var skippedAliases: [String]\n}\n\n/// Kết quả copy mật khẩu Windows lên clipboard (ADR-018). Không chứa mật khẩu.\npublic enum PasswordCopyOutcome: Sendable, Equatable {\n    /// Không có mật khẩu lưu (hoặc không áp dụng): không làm gì.\n    case none\n    case copied\n    /// Cài đặt \"tự điền mật khẩu đã lưu\" đang tắt: không copy (ADR-021).\n    case disabled\n    /// Host đang bị hold tự điền (ADR-026/030): không copy cho tới khi người dùng xác nhận.\n    case held\n    case failed(String)\n}\n\n/// Kết quả \"Xoá mọi mật khẩu đã lưu\" (ADR-021). Không chứa mật khẩu.\npublic struct PasswordPurgeResult: Sendable, Equatable {\n    /// Số host đã gỡ tham chiếu.\n    public var removed: Int\n    /// Số host không xoá được (Keychain/DB lỗi); tham chiếu của các host này được giữ nguyên để thử lại.\n    public var failed: Int\n    /// Số item Keychain của bộ đăng nhập (`set-*`, `setkey-*`) đã xoá (bộ và việc gán được giữ, ADR-030).\n    public var setItemsRemoved = 0\n    /// Số item của bộ đăng nhập không xoá được.\n    public var setItemsFailed = 0\n    /// Số bí mật nguồn số liệu (`metrics-*`, ADR-028) đã xoá; nguồn được giữ, chỉ mất token/password.\n    public var metricsItemsRemoved = 0\n    public var metricsItemsFailed = 0\n}\n\npublic struct WindowsOpenReport: Sendable, Equatable {\n    public var result: RDPLaunchResult\n    public var passwordCopy: PasswordCopyOutcome\n}\n\n/// Nối HostRepository, SSH config của app và WarpLauncher. Không chạy ssh, không mở mạng.\npublic actor ConnectionService {\n    public let repository: HostRepository\n    public let appConfigURL: URL\n    private let userConfigPath: String?\n    private let settings: SettingsStore?\n    private let launcher: WarpLauncher\n    private let rdpLauncher: WindowsAppLauncher\n    private let credentials: (any CredentialStore)?\n    private let secretClipboard: SecretClipboard?\n    private let askpassHelper: URL?\n    private let metricSources: MetricSourceService?\n    private let now: @Sendable () -> Date\n\n    /// `userConfigPath`: nil = không `Include`. Chỉ truyền đường dẫn file đang tồn tại\n    /// (xem `AppPaths.existingUserConfigPath()`). Khi có `settings`, đường dẫn Include lấy từ cài đặt\n    /// (mỗi lần sinh config) và `userConfigPath` bị bỏ qua.\n    public init(\n        repository: HostRepository, appConfigURL: URL, userConfigPath: String?,\n        launcher: WarpLauncher, rdpLauncher: WindowsAppLauncher = WindowsAppLauncher(),\n        credentials: (any CredentialStore)? = nil, secretClipboard: SecretClipboard? = nil,\n        askpassHelper: URL? = nil, settings: SettingsStore? = nil,\n        metricSources: MetricSourceService? = nil,\n        now: @escaping @Sendable () -> Date = { Date() }\n    ) {\n        self.settings = settings\n        self.credentials = credentials\n        self.secretClipboard = secretClipboard\n        self.askpassHelper = askpassHelper\n        self.metricSources = metricSources\n        self.repository = repository\n        self.appConfigURL = appConfigURL\n        self.userConfigPath = userConfigPath\n        self.launcher = launcher\n        self.rdpLauncher = rdpLauncher\n        self.now = now\n    }\n\n    // MARK: - SSH config\n\n    public func regenerateSSHConfig() async throws {\n        try SSHConfigWriter.write(\n            to: appConfigURL,\n            hosts: try await repository.sshSpecs(\n                defaultIdentityAgent: settings?.current.defaultIdentityAgent),\n            userConfigPath: effectiveUserConfigPath)\n    }\n\n    /// Đường dẫn config người dùng được `Include` ngay lúc này.\n    private var effectiveUserConfigPath: String? {\n        if let settings { return settings.current.effectiveUserConfigPath() }\n        return userConfigPath\n    }\n\n    public func sshArguments(for host: HostProfile) throws -> [String] {\n        try SSHConfigWriter.sshInvocation(configPath: appConfigURL.path, alias: try alias(of: host))\n    }\n\n    /// Lệnh để COPY: luôn là lệnh ssh thường, không askpass — người dùng có thể chạy nó ở terminal khác,\n    /// nơi helper/Keychain của app không áp dụng (và biến môi trường không nên rò sang đó).\n    public func copyableSSHCommand(for host: HostProfile) throws -> String {\n        try ZshQuoting.sshCommand(\n            sshPath: \"/usr/bin/ssh\", configPath: appConfigURL.path, alias: try alias(of: host))\n    }\n\n    /// Lệnh chạy trong Tab Config của Warp. Có password / passphrase đã lưu (và có helper) -> dùng SSH_ASKPASS.\n    /// Password hiệu lực = riêng của host > bộ đăng nhập (ADR-030); passphrase chỉ khi key lấy từ bộ.\n    /// `notice` giải thích khi phải dùng lệnh thường dù host có mật khẩu lưu.\n    public func warpSSHCommand(for host: HostProfile) async throws -> (command: String, notice: String?) {\n        let plain = try copyableSSHCommand(for: host)\n        // Đọc lại host để lấy bộ đăng nhập / hold mới nhất (bản của UI có thể cũ).\n        let current = (try? await repository.host(id: host.id)) ?? host\n        let resolved = try? await repository.resolvedCredentials(for: current)\n        let passwordRef = current.effectiveCredentialReference.flatMap {\n            credentials?.exists(ref: $0) == true ? $0 : nil\n        }\n        var passphrase: (ref: String, keyPath: String)?\n        if let r = resolved, let ref = r.passphraseRef, let path = r.passphraseKeyPath,\n            credentials?.exists(ref: ref) == true\n        {\n            passphrase = (ref, path)\n        }\n        guard passwordRef != nil || passphrase != nil else { return (plain, nil) }\n        // Hold (ADR-026/030): không đặt SSHDESK_HOST_REF/KEY_REF, ssh hỏi ngay trong Warp.\n        if current.autofillHold {\n            return (\n                plain,\n                \"Đang tạm tắt tự điền mật khẩu cho máy này — mở chi tiết máy để xác nhận. Nhập mật khẩu trong Warp.\"\n            )\n        }\n        // Tắt tự điền: không đặt SSHDESK_HOST_REF/SSH_ASKPASS, ssh hỏi mật khẩu ngay trong Warp.\n        if let settings, !settings.current.autofillEnabled {\n            return (plain, \"Đang tắt tự điền mật khẩu (Cài đặt) — nhập mật khẩu trong Warp.\")\n        }\n        guard let helper = askpassHelper else {\n            return (plain, \"Không tìm thấy helper đăng nhập tự động — nhập mật khẩu trong Warp.\")\n        }\n        // ProxyJump chạy ssh con dùng chung biến môi trường: tránh gửi password của host đích cho bastion.\n        if current.jumpHostID != nil {\n            return (plain, \"Host dùng bastion: không đăng nhập tự động bằng mật khẩu, nhập trong Warp.\")\n        }\n        let command = try ZshQuoting.askpassSshCommand(\n            helperPath: helper.path, hostRef: passwordRef, keyRef: passphrase?.ref,\n            keyPath: passphrase.flatMap { $0.keyPath.isEmpty ? nil : $0.keyPath },\n            sshPath: \"/usr/bin/ssh\", configPath: appConfigURL.path, alias: try alias(of: host))\n        return (command, nil)\n    }\n\n    // MARK: - Mật khẩu đã lưu (Keychain)\n\n    /// Có password hiệu lực đã lưu không (riêng của host hoặc từ bộ đăng nhập, ADR-030). Chỉ để hiển thị:\n    /// không bị hold chặn (hold chỉ chặn việc TỰ ĐIỀN).\n    public func hasStoredPassword(_ host: HostProfile) -> Bool {\n        guard let ref = host.effectiveCredentialReference, let credentials else { return false }\n        return credentials.exists(ref: ref)\n    }\n\n    /// Ghi password vào Keychain (tạo credentialReference nếu chưa có) rồi lưu tham chiếu vào hồ sơ.\n    @discardableResult\n    public func savePassword(hostID: UUID, password: String) async throws -> HostProfile {\n        guard let credentials else { throw CredentialStoreError.invalidReference }\n        guard var host = try await repository.host(id: hostID) else {\n            throw HostRepositoryError.notFound(hostID)\n        }\n        let created = host.credentialReference == nil\n        let ref = host.credentialReference ?? UUID().uuidString.lowercased()\n        try credentials.save(ref: ref, password: password)\n        if created {\n            host.credentialReference = ref\n            do { host = try await repository.update(host) } catch {\n                try? credentials.delete(ref: ref)\n                throw error\n            }\n        }\n        return host\n    }\n\n    /// Xoá item Keychain và bỏ tham chiếu khỏi hồ sơ.\n    @discardableResult\n    public func clearPassword(hostID: UUID) async throws -> HostProfile {\n        guard var host = try await repository.host(id: hostID) else {\n            throw HostRepositoryError.notFound(hostID)\n        }\n        if let ref = host.credentialReference {\n            try credentials?.delete(ref: ref)\n            host.credentialReference = nil\n            host = try await repository.update(host)\n        }\n        return host\n    }\n\n    /// Nhân bản mật khẩu: đọc từ item của `sourceID`, ghi thành item Keychain MỚI (ref mới) cho `hostID`.\n    /// Không có password gốc thì không làm gì. Password chỉ đi qua biến cục bộ.\n    @discardableResult\n    public func copyPassword(from sourceID: UUID, to hostID: UUID) async throws -> HostProfile? {\n        guard let credentials,\n            let source = try await repository.host(id: sourceID),\n            let sourceRef = source.credentialReference,\n            let password = credentials.read(ref: sourceRef)\n        else { return nil }\n        return try await savePassword(hostID: hostID, password: password)\n    }\n\n    /// Số mục mật khẩu đã lưu: host có tham chiếu riêng + item Keychain của bộ đăng nhập (password và passphrase).\n    public func savedPasswordCount() async throws -> Int {\n        let own = try await repository.all().filter { ($0.credentialReference ?? \"\").isEmpty == false }.count\n        let metrics = metricSources?.savedSecretCount() ?? 0\n        guard let credentials else { return own + metrics }\n        let sets = try await repository.credentialSets().reduce(0) { count, set in\n            count + (credentials.exists(ref: set.passwordReference) ? 1 : 0)\n                + (credentials.exists(ref: set.passphraseReference) ? 1 : 0)\n        }\n        return own + sets + metrics\n    }\n\n    /// Xoá mọi item Keychain theo tham chiếu của từng host rồi gỡ tham chiếu khỏi hồ sơ (ADR-021).\n    /// Chỉ chạm item của app (theo `credentialReference` từng host + account tất định của từng bộ), không quét Keychain.\n    public func clearAllPasswords() async throws -> PasswordPurgeResult {\n        var result = PasswordPurgeResult(removed: 0, failed: 0)\n        let hosts = try await repository.all().filter { ($0.credentialReference ?? \"\").isEmpty == false }\n        // Không có kho Keychain thì không được gỡ tham chiếu (sẽ mồ côi item thật).\n        if !hosts.isEmpty, credentials == nil { throw ConnectionServiceError.credentialsUnavailable }\n        for host in hosts {\n            guard let ref = host.credentialReference, let credentials else { continue }\n            do {\n                try credentials.delete(ref: ref)\n                var updated = host\n                updated.credentialReference = nil\n                _ = try await repository.update(updated)\n                result.removed += 1\n            } catch {\n                result.failed += 1\n            }\n        }\n        // Item của mọi bộ đăng nhập (account tất định). Giữ bộ và việc gán: bộ chỉ trở thành \"chưa có mật khẩu\".\n        if let credentials {\n            for set in try await repository.credentialSets() {\n                for ref in [set.passwordReference, set.passphraseReference] {\n                    // Xoá cả ciphertext lẫn item plaintext cũ còn sót (ADR-004c); chỉ đếm khi có mật khẩu.\n                    let had = credentials.exists(ref: ref)\n                    do {\n                        try credentials.delete(ref: ref)\n                        if had { result.setItemsRemoved += 1 }\n                    } catch {\n                        result.setItemsFailed += 1\n                    }\n                }\n            }\n        }\n        // Token/password của nguồn số liệu (ADR-028): xoá item, giữ nguồn.\n        if let metricSources {\n            let purged = metricSources.purgeSecrets()\n            result.metricsItemsRemoved = purged.removed\n            result.metricsItemsFailed = purged.failed\n        }\n        return result\n    }\n\n    /// File key hiệu lực (của host hoặc bộ) không tồn tại → đường dẫn đó. Chỉ `fileExists`, không đọc nội dung.\n    public func missingKeyFile(\n        for host: HostProfile, exists: (String) -> Bool = { FileManager.default.fileExists(atPath: $0) }\n    ) async -> String? {\n        guard host.kind == .ssh, host.connectionMode == .managed,\n            let resolved = try? await repository.resolvedCredentials(for: host),\n            let file = resolved.identityFile\n        else { return nil }\n        return exists(CredentialResolution.expandTilde(file, home: NSHomeDirectory())) ? nil : file\n    }\n\n    private func alias(of host: HostProfile) throws -> String {\n        guard let alias = repository.sshAlias(for: host) else {\n            throw ConnectionServiceError.missingAlias\n        }\n        return alias\n    }\n\n    // MARK: - Bộ đăng nhập (ADR-030)\n\n    /// Tạo bộ, tuỳ chọn lưu password/passphrase vào Keychain (account tất định). Lỗi Keychain → bỏ bộ vừa tạo.\n    @discardableResult\n    public func createCredentialSet(_ set: CredentialSet, password: String? = nil, passphrase: String? = nil)\n        async throws -> CredentialSet\n    {\n        if password?.isEmpty == false || passphrase?.isEmpty == false, credentials == nil {\n            throw ConnectionServiceError.credentialsUnavailable\n        }\n        let created = try await repository.createCredentialSet(set)\n        do {\n            if let password, !password.isEmpty {\n                try credentials?.save(ref: created.passwordReference, password: password)\n            }\n            if let passphrase, !passphrase.isEmpty {\n                try credentials?.save(ref: created.passphraseReference, password: passphrase)\n            }\n            try await regenerateSSHConfig()\n        } catch {\n            _ = try? await repository.deleteCredentialSet(id: created.id)\n            try? credentials?.delete(ref: created.passwordReference)\n            try? credentials?.delete(ref: created.passphraseReference)\n            throw error\n        }\n        return created\n    }\n\n    /// Sửa bộ (tên, user, key, agent, ghi chú) và sinh lại config: mọi host dùng bộ nhận giá trị mới.\n    @discardableResult\n    public func updateCredentialSet(_ set: CredentialSet) async throws -> CredentialSet {\n        let saved = try await repository.updateCredentialSet(set)\n        try await regenerateSSHConfig()\n        return saved\n    }\n\n    /// Đặt / đổi password của bộ (áp cho mọi host dùng bộ ngay vì ref tất định).\n    public func saveSetPassword(setID: UUID, password: String) async throws {\n        guard let credentials else { throw ConnectionServiceError.credentialsUnavailable }\n        guard let set = try await repository.credentialSet(id: setID) else {\n            throw CredentialSetError.notFound(setID)\n        }\n        try credentials.save(ref: set.passwordReference, password: password)\n    }\n\n    public func saveSetPassphrase(setID: UUID, passphrase: String) async throws {\n        guard let credentials else { throw ConnectionServiceError.credentialsUnavailable }\n        guard let set = try await repository.credentialSet(id: setID) else {\n            throw CredentialSetError.notFound(setID)\n        }\n        try credentials.save(ref: set.passphraseReference, password: passphrase)\n    }\n\n    public func clearSetPassword(setID: UUID) throws {\n        try credentials?.delete(ref: CredentialSet.passwordReference(for: setID))\n    }\n\n    public func clearSetPassphrase(setID: UUID) throws {\n        try credentials?.delete(ref: CredentialSet.passphraseReference(for: setID))\n    }\n\n    public func hasSetPassword(_ setID: UUID) -> Bool {\n        credentials?.exists(ref: CredentialSet.passwordReference(for: setID)) ?? false\n    }\n\n    public func hasSetPassphrase(_ setID: UUID) -> Bool {\n        credentials?.exists(ref: CredentialSet.passphraseReference(for: setID)) ?? false\n    }\n\n    /// Xoá bộ: gỡ khỏi host (một transaction) rồi xoá item Keychain, sinh lại config. Trả id host bị ảnh hưởng.\n    @discardableResult\n    public func deleteCredentialSet(id: UUID) async throws -> [UUID] {\n        let affected = try await repository.deleteCredentialSet(id: id)\n        var failed = 0\n        for ref in [CredentialSet.passwordReference(for: id), CredentialSet.passphraseReference(for: id)] {\n            guard let credentials, credentials.exists(ref: ref) else { continue }\n            do { try credentials.delete(ref: ref) } catch { failed += 1 }\n        }\n        try await regenerateSSHConfig()\n        if failed > 0 { throw ConnectionServiceError.setDeletedButKeychainFailed(count: failed) }\n        return affected\n    }\n\n    /// Gán (hoặc gỡ) bộ cho nhiều host. Gán bằng tay → không hold. Sinh lại config.\n    @discardableResult\n    public func assignCredentialSet(setID: UUID?, to hostIDs: [UUID]) async throws -> Int {\n        let n = try await repository.assignCredentialSet(setID: setID, to: hostIDs)\n        try await regenerateSSHConfig()\n        return n\n    }\n\n    /// Người dùng xác nhận địa chỉ / bộ đăng nhập → bỏ hold tự điền (ADR-026).\n    public func confirmAutofillHold(hostID: UUID) async throws {\n        try await repository.confirmAutofillHold(id: hostID)\n    }\n\n    // MARK: - CRUD (luôn sinh lại config)\n\n    public func add(_ host: HostProfile) async throws {\n        try await repository.insert(host)\n        try await regenerateSSHConfig()\n    }\n\n    @discardableResult\n    public func update(_ host: HostProfile) async throws -> HostProfile {\n        let saved = try await repository.update(host)\n        try await regenerateSSHConfig()\n        return saved\n    }\n\n    /// Đổi host managed sang xác thực bằng key file (sau khi cài key). Host imported: từ chối, không sửa.\n    @discardableResult\n    public func useKey(hostID: UUID, privateKeyPath: String) async throws -> HostProfile {\n        guard var host = try await repository.host(id: hostID) else { throw ConnectionServiceError.hostNotFound }\n        guard host.kind == .ssh else { throw ConnectionServiceError.notSSHHost }\n        guard host.connectionMode == .managed else { throw ConnectionServiceError.importedHostReadOnly }\n        host.authMethod = .keyFile\n        host.identityFile = privateKeyPath\n        return try await update(host)\n    }\n\n    public func delete(id: UUID) async throws {\n        let stored = try await repository.host(id: id)\n        let ref = stored?.credentialReference\n        try await repository.delete(id: id)\n        if let ref { try? credentials?.delete(ref: ref) }\n        try await regenerateSSHConfig()\n        if stored?.kind == .windowsRDP {\n            try rdpLauncher.removeFile(hostID: id)\n        } else {\n            try launcher.removeConfig(hostID: id)\n        }\n    }\n\n    // MARK: - Warp\n\n    /// `newWindow`: nil = theo cài đặt \"Warp mở Tab mới / Cửa sổ mới\".\n    public func openInWarp(_ host: HostProfile, newWindow: Bool? = nil) async -> LaunchResult {\n        await openInWarpReport(host, newWindow: newWindow).result\n    }\n\n    public struct WarpOpenReport: Sendable, Equatable {\n        public var result: LaunchResult\n        /// Lý do không đăng nhập tự động được (nếu host có mật khẩu lưu).\n        public var notice: String?\n    }\n\n    public func openInWarpReport(_ host: HostProfile, newWindow: Bool? = nil) async -> WarpOpenReport {\n        let newWindow = newWindow ?? settings?.current.warpOpenMode.opensNewWindow ?? false\n        var notice: String?\n        guard host.kind == .ssh else {\n            return WarpOpenReport(result: .failed(\"Máy Windows không mở bằng Warp.\"), notice: nil)\n        }\n        do {\n            try host.validate(credentialSet: try await repository.credentialSet(for: host))\n            try await regenerateSSHConfig()\n            let (command, why) = try await warpSSHCommand(for: host)\n            notice = why\n            if let missing = await missingKeyFile(for: host) {\n                notice = [why, \"Không thấy file key \\(missing).\"].compactMap { $0 }.joined(separator: \" \")\n            }\n            let result = await launcher.launch(\n                hostID: host.id, displayName: host.displayName, sshCommand: command,\n                newWindow: newWindow)\n            if result == .requested {\n                try await repository.markLaunchRequested(id: host.id, at: now())\n            }\n            return WarpOpenReport(result: result, notice: notice)\n        } catch {\n            return WarpOpenReport(result: .failed(\"\\(error)\"), notice: nil)\n        }\n    }\n\n    // MARK: - Windows App (RDP)\n\n    /// Sinh file .rdp rồi nhờ Windows App mở. Ghi `lastLaunchRequestedAt` khi `.requested`.\n    public func openInWindowsApp(_ host: HostProfile) async -> RDPLaunchResult {\n        await openInWindowsAppReport(host).result\n    }\n\n    /// Như `openInWindowsApp`; khi `.requested` và host có mật khẩu lưu thì copy mật khẩu lên clipboard\n    /// (đọc Keychain tại đây, không đi qua view). Chỉ máy Windows, đúng một lần mỗi lần mở.\n    public func openInWindowsAppReport(_ host: HostProfile) async -> WindowsOpenReport {\n        guard host.kind == .windowsRDP else {\n            return WindowsOpenReport(result: .failed(\"Đây không phải máy Windows.\"), passwordCopy: .none)\n        }\n        let result = await rdpLauncher.launch(host)\n        guard result == .requested else { return WindowsOpenReport(result: result, passwordCopy: .none) }\n        do { try await repository.markLaunchRequested(id: host.id, at: now()) } catch {\n            return WindowsOpenReport(result: .failed(\"\\(error)\"), passwordCopy: .none)\n        }\n        return WindowsOpenReport(result: result, passwordCopy: await copyStoredWindowsPassword(host))\n    }\n\n    /// Copy mật khẩu đã lưu của máy Windows lên clipboard (tự xoá sau 30 giây). Host SSH: `.failed`.\n    public func copyStoredWindowsPassword(_ host: HostProfile) async -> PasswordCopyOutcome {\n        guard host.kind == .windowsRDP else { return .failed(\"Đây không phải máy Windows.\") }\n        guard let credentials, let secretClipboard else { return .none }\n        let current = settings?.current\n        if let current, !current.autofillEnabled { return .disabled }\n        // Đọc lại host: bộ đăng nhập và hold có thể đã đổi từ lúc UI nạp.\n        let fresh = (try? await repository.host(id: host.id)) ?? host\n        if fresh.autofillHold, fresh.effectiveCredentialReference != nil { return .held }\n        guard let ref = fresh.autofillCredentialReference else { return .none }\n        guard let password = credentials.read(ref: ref) else {\n            return credentials.exists(ref: ref)\n                ? .failed(\"Không đọc được mật khẩu từ Keychain.\") : .none\n        }\n        secretClipboard.copy(\n            password, clearAfter: TimeInterval(current?.clipboardClearSeconds ?? 30))\n        return .copied\n    }\n\n    /// Ghi file .rdp (không mở app) để hiện trong Finder.\n    public func prepareRDPFile(for host: HostProfile) throws -> URL {\n        guard host.kind == .windowsRDP else { throw ConnectionServiceError.notWindowsHost }\n        return try rdpLauncher.prepare(host)\n    }\n\n    // MARK: - Nhập từ file (ADR-020)\n\n    /// Ghi kế hoạch nhập (một transaction) rồi sinh lại SSH config của app.\n    public func applyImport(_ plan: HostExchange.Plan) async throws {\n        try await repository.applyImport(plan)\n        try await regenerateSSHConfig()\n    }\n\n    // MARK: - Nguồn máy chủ (ADR-026)\n\n    /// Áp dụng kế hoạch đồng bộ (một transaction) rồi sinh lại SSH config của app.\n    public func applyInventory(_ plan: InventorySyncPlan) async throws {\n        try await repository.applyInventory(plan)\n        try await regenerateSSHConfig()\n    }\n\n    /// Áp dụng kế hoạch chỉ-thêm-mới (như `applyInventory`: một transaction + sinh lại SSH config). KHÔNG đụng Keychain.\n    /// Trả ghi nhận để Hoàn tác. Từ chối nếu kế hoạch không phải additions-only.\n    public func applyAutoInventory(_ plan: InventorySyncPlan) async throws -> InventoryAutoAddRecord {\n        guard InventorySync.isAdditionsOnly(plan) else { throw InventoryError.notAdditionsOnly }\n        try await applyInventory(plan)\n        return InventoryAutoAddRecord(plan: plan)\n    }\n\n    /// Hoàn tác (xem `HostRepository.undoAutoAdd`), dọn file cấu hình Warp/RDP của host đã xoá, sinh lại SSH config.\n    public func undoAutoAdd(_ record: InventoryAutoAddRecord) async throws -> InventoryUndoOutcome {\n        let kinds = try await repository.all().reduce(into: [UUID: HostKind]()) { $0[$1.id] = $1.kind }\n        let outcome = try await repository.undoAutoAdd(record)\n        try await regenerateSSHConfig()\n        for id in outcome.removed {\n            if kinds[id] == .windowsRDP {\n                try? rdpLauncher.removeFile(hostID: id)\n            } else {\n                try? launcher.removeConfig(hostID: id)\n            }\n        }\n        return outcome\n    }\n\n    public func setInventoryAutoAdd(sourceID: UUID, enabled: Bool) async throws {\n        try await repository.setInventoryAutoAdd(sourceID: sourceID, enabled: enabled)\n    }\n\n    /// Xoá nguồn (gỡ liên kết khỏi host, không xoá host). SSH config không đổi.\n    @discardableResult\n    public func deleteInventorySource(id: UUID) async throws -> Int {\n        try await repository.deleteInventorySource(id: id)\n    }\n\n    /// \"Tách khỏi nguồn\".\n    public func detachFromSource(hostID: UUID) async throws {\n        try await repository.detachFromSource(hostID: hostID)\n    }\n\n    // MARK: - Import\n\n    public func importAliases(_ candidates: [ImportCandidate], sourcePath: String) async throws\n        -> ImportOutcome\n    {\n        var existing = Set(\n            try await repository.all().compactMap { h -> String? in\n                guard h.connectionMode == .existingSSHConfigAlias, let a = h.sshConfigAlias,\n                    let p = h.sshConfigPath\n                else { return nil }\n                return p + \"\\n\" + a\n            })\n        var outcome = ImportOutcome(imported: [], skippedAliases: [])\n        for c in candidates {\n            let key = sourcePath + \"\\n\" + c.alias\n            if !existing.insert(key).inserted {\n                outcome.skippedAliases.append(c.alias)\n                continue\n            }\n            let host = HostProfile(\n                displayName: c.alias, environment: .other,\n                connectionMode: .existingSSHConfigAlias, sshConfigPath: sourcePath,\n                sshConfigAlias: c.alias)\n            try await repository.insert(host)\n            outcome.imported.append(host)\n        }\n        try await regenerateSSHConfig()\n        return outcome\n    }\n}\n"}, "Sources/SSHDeskCore/CLI/AppURLRequest.swift": {"group": "Core · CLI", "text": "import Foundation\n\n/// Cách chỉ tới host trong URL từ bên ngoài.\npublic enum URLHostReference: Equatable, Sendable {\n    case id(UUID)\n    case name(String)\n}\n\n/// URL `sshdesk://` đã được kiểm tra cú pháp (ADR-025). Chỉ có hai dạng; mọi thứ khác bị từ chối.\npublic enum AppURLRequest: Equatable, Sendable {\n    /// `sshdesk://cli?request=<uuid>` — phải đối chiếu với file yêu cầu của CLI.\n    case fromCLI(requestID: UUID)\n    /// `sshdesk://open?id=<uuid>` hoặc `?name=<...>` — nguồn không tin cậy.\n    case external(URLHostReference)\n\n    public static let maxValueLength = 256\n\n    public enum ParseError: Error, Equatable, CustomStringConvertible {\n        case notOurScheme\n        case unknownAction\n        case badQuery(String)\n        case badValue(String)\n\n        public var description: String {\n            switch self {\n            case .notOurScheme: return \"Không phải URL sshdesk://.\"\n            case .unknownAction: return \"URL sshdesk:// không hỗ trợ thao tác này (chỉ open và cli).\"\n            case .badQuery(let s): return \"URL sshdesk:// không hợp lệ: \\(s).\"\n            case .badValue(let s): return \"URL sshdesk:// không hợp lệ: \\(s).\"\n            }\n        }\n    }\n\n    public static func parse(_ url: URL) throws -> AppURLRequest {\n        guard url.scheme?.lowercased() == \"sshdesk\" else { throw ParseError.notOurScheme }\n        guard let c = URLComponents(url: url, resolvingAgainstBaseURL: false) else {\n            throw ParseError.badQuery(\"không phân tích được\")\n        }\n        guard c.user == nil, c.password == nil, c.port == nil, c.fragment == nil,\n            c.path.isEmpty || c.path == \"/\"\n        else { throw ParseError.badQuery(\"có thành phần thừa\") }\n        let action = (c.host ?? \"\").lowercased()\n        guard action == \"open\" || action == \"cli\" else { throw ParseError.unknownAction }\n\n        let items = c.queryItems ?? []\n        guard items.count == 1, let item = items.first else {\n            throw ParseError.badQuery(\"cần đúng một tham số\")\n        }\n        guard let value = item.value else { throw ParseError.badValue(\"tham số thiếu giá trị\") }\n        try checkValue(value)\n\n        switch (action, item.name) {\n        case (\"cli\", \"request\"):\n            guard let id = UUID(uuidString: value) else { throw ParseError.badValue(\"request không phải UUID\") }\n            return .fromCLI(requestID: id)\n        case (\"open\", \"id\"):\n            guard let id = UUID(uuidString: value) else { throw ParseError.badValue(\"id không phải UUID\") }\n            return .external(.id(id))\n        case (\"open\", \"name\"):\n            return .external(.name(value))\n        default:\n            throw ParseError.badQuery(\n                \"tham số “\\(HostResolver.printable(String(item.name.prefix(20))))” không được phép\")\n        }\n    }\n\n    private static func checkValue(_ v: String) throws {\n        if v.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty { throw ParseError.badValue(\"giá trị rỗng\") }\n        if v.count > maxValueLength { throw ParseError.badValue(\"giá trị dài quá \\(maxValueLength) ký tự\") }\n        if v.unicodeScalars.contains(where: HostResolver.isControl) {\n            throw ParseError.badValue(\"giá trị chứa ký tự điều khiển\")\n        }\n    }\n}\n\n/// Nguồn của một yêu cầu mở host.\npublic enum OpenOrigin: Equatable, Sendable {\n    /// URL từ trình duyệt/app khác (không tin cậy).\n    case external\n    /// Có file yêu cầu hợp lệ do CLI ghi trong thư mục app.\n    case cli\n\n    /// Request id lạ/hết hạn/hỏng không phải CLI -> coi là external.\n    public init(consumption: CLIOpenRequest.Outcome) {\n        if case .valid = consumption { self = .cli } else { self = .external }\n    }\n\n    /// external luôn xác nhận; CLI hợp lệ chỉ xác nhận khi PROD.\n    public func requiresConfirmation(environment: HostEnvironment) -> Bool {\n        switch self {\n        case .external: return true\n        case .cli: return environment == .prod\n        }\n    }\n}\n\n/// Yêu cầu mở host đã giải xong từ URL, chưa chọn host.\npublic struct OpenIntent: Equatable, Sendable {\n    public let reference: URLHostReference\n    public let origin: OpenOrigin\n}\n\npublic enum OpenURLFailure: Error, Equatable, CustomStringConvertible {\n    case invalidURL(AppURLRequest.ParseError)\n    /// `cli?request=` không có file hợp lệ: không có host nào để mở.\n    case unknownCLIRequest\n\n    public var description: String {\n        switch self {\n        case .invalidURL(let e): return e.description\n        case .unknownCLIRequest: return \"Yêu cầu từ CLI không còn hiệu lực (hết hạn hoặc không tồn tại).\"\n        }\n    }\n}\n\npublic enum OpenURLHandler {\n    /// Phân tích URL; với `cli?request=` đọc và xoá file yêu cầu.\n    public static func intent(for url: URL, requestsDirectory: URL, now: Date = Date()) -> Result<\n        OpenIntent, OpenURLFailure\n    > {\n        let parsed: AppURLRequest\n        do { parsed = try AppURLRequest.parse(url) } catch let e as AppURLRequest.ParseError {\n            return .failure(.invalidURL(e))\n        } catch { return .failure(.invalidURL(.badQuery(\"lỗi không rõ\"))) }\n        switch parsed {\n        case .external(let ref):\n            return .success(OpenIntent(reference: ref, origin: .external))\n        case .fromCLI(let rid):\n            let outcome = CLIOpenRequest.consume(id: rid, in: requestsDirectory, now: now)\n            guard case .valid(let hostID) = outcome else { return .failure(.unknownCLIRequest) }\n            return .success(OpenIntent(reference: .id(hostID), origin: OpenOrigin(consumption: outcome)))\n        }\n    }\n\n    /// Chọn host đúng một kết quả (cùng quy tắc CLI, loại Windows).\n    public static func host(for intent: OpenIntent, in hosts: [HostProfile]) throws -> HostProfile {\n        switch intent.reference {\n        case .id(let id): return try HostResolver.resolve(id: id, in: hosts)\n        case .name(let n): return try HostResolver.resolve(n, in: hosts)\n        }\n    }\n\n    /// Nội dung hộp xác nhận: tên, môi trường, user@host.\n    public static func confirmationText(for host: HostProfile, origin: OpenOrigin) -> (title: String, message: String) {\n        let target: String\n        if host.connectionMode == .existingSSHConfigAlias, host.hostName.isEmpty {\n            target = \"alias \\(host.sshConfigAlias ?? \"?\") (SSH config)\"\n        } else {\n            target =\n                (host.user.isEmpty ? \"\" : host.user + \"@\") + host.hostName\n                + (host.port == 22 ? \"\" : \":\\(host.port)\")\n        }\n        let source = origin == .cli ? \"Yêu cầu từ lệnh sshdesk\" : \"Yêu cầu từ liên kết bên ngoài\"\n        let prod = host.environment == .prod ? \"\\n\\nĐây là máy PROD.\" : \"\"\n        return (\n            \"Mở “\\(HostResolver.printable(host.displayName))” trong Warp?\",\n            \"\\(source).\\nMôi trường: \\(host.environment.rawValue)\\nKết nối: \\(HostResolver.printable(target))\\(prod)\"\n        )\n    }\n}\n"}, "Sources/SSHDeskCore/CLI/CLIOpenRequest.swift": {"group": "Core · CLI", "text": "import Darwin\nimport Foundation\n\n/// File yêu cầu mở host từ CLI sang app (ADR-025). Nội dung chỉ `{hostID, createdAt}`.\n/// Thư mục 0700, file 0600, ghi atomically (tạo tạm O_EXCL rồi rename), đọc xong xoá ngay, hết hạn sau 30 giây.\npublic enum CLIOpenRequest {\n    public static let timeToLive: TimeInterval = 30\n    /// Cho phép đồng hồ lệch nhẹ; createdAt ở tương lai xa hơn mức này coi là không hợp lệ.\n    static let clockSkew: TimeInterval = 5\n    static let maxFileSize = 4096\n\n    struct Payload: Codable, Equatable {\n        let hostID: UUID\n        let createdAt: Date\n    }\n\n    public enum Outcome: Equatable, Sendable {\n        case valid(hostID: UUID)\n        case missing\n        case expired\n        /// Không phải file thường của đúng user/0600, quá lớn hoặc JSON sai.\n        case invalid\n    }\n\n    public static func directory(in paths: AppPaths) -> URL {\n        paths.baseDirectory.appendingPathComponent(\"requests\", isDirectory: true)\n    }\n\n    private static func fileURL(_ id: UUID, in dir: URL) -> URL {\n        // UUID đã parse -> chỉ chứa hex và '-', không thể thoát khỏi thư mục.\n        dir.appendingPathComponent(id.uuidString.lowercased() + \".json\")\n    }\n\n    /// Ghi yêu cầu, trả về request id. Dọn luôn các file yêu cầu cũ quá hạn.\n    @discardableResult\n    public static func write(hostID: UUID, in dir: URL, now: Date = Date()) throws -> UUID {\n        try ensureDirectory(dir)\n        purgeStale(in: dir, now: now)\n        let requestID = UUID()\n        let enc = JSONEncoder()\n        enc.dateEncodingStrategy = .secondsSince1970\n        let data = try enc.encode(Payload(hostID: hostID, createdAt: now))\n\n        let final = fileURL(requestID, in: dir)\n        let temp = dir.appendingPathComponent(\".\\(UUID().uuidString.lowercased()).tmp\")\n        let fd = open(temp.path, O_WRONLY | O_CREAT | O_EXCL | O_NOFOLLOW, 0o600)\n        guard fd >= 0 else { throw posix(\"không tạo được file yêu cầu\") }\n        var ok = true\n        data.withUnsafeBytes { buf in\n            var off = 0\n            while off < buf.count {\n                let n = Darwin.write(fd, buf.baseAddress! + off, buf.count - off)\n                if n <= 0 {\n                    ok = false\n                    break\n                }\n                off += n\n            }\n        }\n        if ok { ok = fsync(fd) == 0 }\n        close(fd)\n        guard ok, rename(temp.path, final.path) == 0 else {\n            let e = posix(\"không ghi được file yêu cầu\")\n            unlink(temp.path)\n            throw e\n        }\n        return requestID\n    }\n\n    /// Đọc rồi xoá ngay (xoá trước khi phân tích: dùng một lần dù kết quả thế nào).\n    public static func consume(id: UUID, in dir: URL, now: Date = Date()) -> Outcome {\n        let path = fileURL(id, in: dir).path\n        var lst = stat()\n        guard lstat(path, &lst) == 0 else { return .missing }\n        defer { unlink(path) }\n        // Thư mục requests phải là 0700 và của đúng user (nếu không, người khác có thể đã thay file).\n        var dst = stat()\n        guard stat(dir.path, &dst) == 0, (dst.st_mode & S_IFMT) == S_IFDIR, dst.st_uid == getuid(),\n            (dst.st_mode & 0o077) == 0\n        else { return .invalid }\n        // Đọc trên fd đã mở (không theo symlink) rồi fstat: kiểm tra và đọc cùng một file.\n        let fd = open(path, O_RDONLY | O_NOFOLLOW)\n        guard fd >= 0 else { return .invalid }\n        defer { close(fd) }\n        var st = stat()\n        guard fstat(fd, &st) == 0, (st.st_mode & S_IFMT) == S_IFREG, st.st_uid == getuid(),\n            (st.st_mode & 0o077) == 0, st.st_size <= maxFileSize\n        else { return .invalid }\n        var buffer = [UInt8](repeating: 0, count: maxFileSize + 1)\n        let n = read(fd, &buffer, buffer.count)\n        guard n > 0, n <= maxFileSize else { return .invalid }\n        let data = Data(buffer[0..<n])\n        let dec = JSONDecoder()\n        dec.dateDecodingStrategy = .secondsSince1970\n        guard let payload = try? dec.decode(Payload.self, from: data) else { return .invalid }\n        let age = now.timeIntervalSince(payload.createdAt)\n        if age > timeToLive || age < -clockSkew { return .expired }\n        return .valid(hostID: payload.hostID)\n    }\n\n    /// CLI gọi khi không mở được app, để không để lại file.\n    public static func discard(id: UUID, in dir: URL) {\n        unlink(fileURL(id, in: dir).path)\n    }\n\n    // MARK: - Nội bộ\n\n    private static func ensureDirectory(_ dir: URL) throws {\n        let fm = FileManager.default\n        do {\n            if !fm.fileExists(atPath: dir.path) {\n                try fm.createDirectory(\n                    at: dir, withIntermediateDirectories: true, attributes: [.posixPermissions: 0o700])\n            }\n            try fm.setAttributes([.posixPermissions: 0o700], ofItemAtPath: dir.path)\n        } catch { throw RequestError.io(\"không chuẩn bị được thư mục yêu cầu: \\(error)\") }\n    }\n\n    /// Xoá file `*.json`/`.tmp` có mtime quá 2x hạn dùng (kể cả file rác do tiến trình khác bỏ lại).\n    static func purgeStale(in dir: URL, now: Date) {\n        let fm = FileManager.default\n        guard let items = try? fm.contentsOfDirectory(atPath: dir.path) else { return }\n        for name in items {\n            let p = dir.appendingPathComponent(name).path\n            var st = stat()\n            guard lstat(p, &st) == 0, (st.st_mode & S_IFMT) == S_IFREG, st.st_uid == getuid() else { continue }\n            let mtime = Date(timeIntervalSince1970: TimeInterval(st.st_mtimespec.tv_sec))\n            if now.timeIntervalSince(mtime) > timeToLive * 2 { unlink(p) }\n        }\n    }\n\n    private static func posix(_ what: String) -> RequestError {\n        .io(\"\\(what): \\(String(cString: strerror(errno)))\")\n    }\n\n    public enum RequestError: Error, Equatable, CustomStringConvertible {\n        case io(String)\n        public var description: String {\n            switch self {\n            case .io(let s): return s\n            }\n        }\n    }\n}\n"}, "Sources/SSHDeskCore/CLI/HostResolver.swift": {"group": "Core · CLI", "text": "import Foundation\n\npublic enum HostResolveError: Error, Equatable {\n    case notFound(query: String)\n    /// Nhiều host khớp cùng một bước; liệt kê để người dùng chọn bằng id.\n    case ambiguous(query: String, matches: [Match])\n    case windowsUnsupported(name: String)\n\n    public struct Match: Equatable, Sendable {\n        public let id: UUID\n        public let name: String\n    }\n}\n\n/// Giải `<id|alias|tên>` ra đúng một host SSH (ADR-025). Khớp chính xác theo thứ tự:\n/// UUID -> alias imported (`sshConfigAlias`, phân biệt hoa thường như ssh) -> tên hiển thị\n/// (không phân biệt hoa thường/dấu, bỏ khoảng trắng hai đầu). Không fuzzy. Bước nào có >= 1 kết quả thì dừng ở bước đó.\npublic enum HostResolver {\n    public static func resolve(_ rawQuery: String, in hosts: [HostProfile]) throws -> HostProfile {\n        let query = rawQuery.trimmingCharacters(in: .whitespacesAndNewlines)\n        guard !query.isEmpty else { throw HostResolveError.notFound(query: rawQuery) }\n\n        var matches: [HostProfile] = []\n        if let uuid = UUID(uuidString: query) {\n            matches = hosts.filter { $0.id == uuid }\n        }\n        if matches.isEmpty {\n            matches = hosts.filter {\n                $0.connectionMode == .existingSSHConfigAlias && $0.sshConfigAlias == query\n            }\n        }\n        if matches.isEmpty {\n            matches = hosts.filter { sameName($0.displayName, query) }\n        }\n        guard !matches.isEmpty else { throw HostResolveError.notFound(query: rawQuery) }\n        if matches.count > 1 {\n            throw HostResolveError.ambiguous(\n                query: rawQuery,\n                matches: matches.map { .init(id: $0.id, name: $0.displayName) })\n        }\n        let host = matches[0]\n        guard host.kind == .ssh else { throw HostResolveError.windowsUnsupported(name: host.displayName) }\n        return host\n    }\n\n    /// Tìm theo id (đã là UUID) với cùng quy tắc loại Windows.\n    public static func resolve(id: UUID, in hosts: [HostProfile]) throws -> HostProfile {\n        guard let host = hosts.first(where: { $0.id == id }) else {\n            throw HostResolveError.notFound(query: id.uuidString)\n        }\n        guard host.kind == .ssh else { throw HostResolveError.windowsUnsupported(name: host.displayName) }\n        return host\n    }\n\n    private static func sameName(_ a: String, _ b: String) -> Bool {\n        a.trimmingCharacters(in: .whitespacesAndNewlines)\n            .compare(b, options: [.caseInsensitive, .diacriticInsensitive]) == .orderedSame\n    }\n\n    /// Bỏ ký tự điều khiển trước khi in ra terminal/hộp thoại (tên host do người dùng/import đặt).\n    public static func printable(_ s: String) -> String {\n        String(String.UnicodeScalarView(s.unicodeScalars.filter { !isControl($0) }))\n    }\n\n    static func isControl(_ u: Unicode.Scalar) -> Bool {\n        switch u.properties.generalCategory {\n        case .control, .lineSeparator, .paragraphSeparator: return true\n        default: return false\n        }\n    }\n}\n\nextension HostResolveError: CustomStringConvertible {\n    public var description: String {\n        switch self {\n        case .notFound(let q):\n            return \"Không tìm thấy máy chủ khớp “\\(HostResolver.printable(q))”.\"\n        case .ambiguous(let q, let matches):\n            let lines = matches.map { \"  \\($0.id.uuidString.lowercased())  \\(HostResolver.printable($0.name))\" }\n            return \"Có \\(matches.count) máy khớp “\\(HostResolver.printable(q))”, hãy dùng id:\\n\"\n                + lines.joined(separator: \"\\n\")\n        case .windowsUnsupported(let n):\n            return \"“\\(HostResolver.printable(n))” là máy Windows — chưa hỗ trợ mở bằng CLI/URL.\"\n        }\n    }\n}\n"}, "Sources/SSHDeskCore/Credentials/CredentialStore.swift": {"group": "Core · Credentials", "text": "@_exported import AskpassKit\nimport CredentialBackend\nimport Foundation\n\npublic enum CredentialStoreError: Error, Equatable, CustomStringConvertible {\n    case keychain(status: Int32)\n    case invalidReference\n    /// Backend Secure Enclave (ADR-004c); `message` không chứa secret.\n    case secureEnclave(String)\n\n    public var description: String {\n        switch self {\n        case .keychain(let status):\n            let message = KeychainBackendError.mess
