age(for: status)\n            return \"Keychain: \\(message) (\\(status))\"\n        case .invalidReference: return \"Tham chiếu Keychain không hợp lệ.\"\n        case .secureEnclave(let message): return message\n        }\n    }\n}\n\n/// Trạng thái một mục trong kho (K4e/ADR-004c: backend Secure Enclave có thể trả `.undecryptable`).\npublic enum CredentialStatus: Sendable, Equatable {\n    case missing, present, undecryptable\n}\n\n/// Kho bí mật. Không bao giờ log hay trả password qua `description`.\npublic protocol CredentialStore: Sendable {\n    func save(ref: String, password: String) throws\n    /// nil nếu không có item hoặc không đọc được.\n    func read(ref: String) -> String?\n    func delete(ref: String) throws\n    func exists(ref: String) -> Bool\n    /// Mặc định suy từ `exists`; backend khác Keychain có thể phân biệt thêm `.undecryptable`.\n    func status(ref: String) -> CredentialStatus\n}\n\nextension CredentialStore {\n    public func status(ref: String) -> CredentialStatus { exists(ref: ref) ? .present : .missing }\n}\n\n/// Keychain thật: generic password, account = tham chiếu. Mã truy cập Keychain nằm ở `CredentialBackend`\n/// (ADR-004b), dùng chung với helper `sshdesk-askpass`; ở đây chỉ chuyển tiếp và đổi kiểu lỗi.\npublic struct KeychainCredentialStore: CredentialStore, CustomStringConvertible {\n    private let backend: KeychainBackend\n    public var service: String { backend.service }\n    /// Đường dẫn app/helper được tin cậy trong ACL (ngoài chính tiến trình gọi). Rỗng = ACL mặc định.\n    public var trustedApplicationPaths: [String] { backend.trustedApplicationPaths }\n\n    public init(\n        service: String = CredentialConstants.service, trustedApplicationPaths: [String] = []\n    ) {\n        backend = KeychainBackend(service: service, trustedApplicationPaths: trustedApplicationPaths)\n    }\n\n    public var description: String { \"KeychainCredentialStore(service: \\(service))\" }\n\n    public func save(ref: String, password: String) throws {\n        do { try backend.save(account: ref, secret: password) } catch { throw Self.map(error) }\n    }\n\n    public func read(ref: String) -> String? { backend.read(account: ref) }\n\n    public func delete(ref: String) throws {\n        do { try backend.delete(account: ref) } catch { throw Self.map(error) }\n    }\n\n    public func exists(ref: String) -> Bool { backend.exists(account: ref) }\n\n    private static func map(_ error: Error) -> CredentialStoreError {\n        switch error as? KeychainBackendError {\n        case .status(let s)?: return .keychain(status: s)\n        case .invalidAccount?: return .invalidReference\n        case nil: return .keychain(status: -1)\n        }\n    }\n}\n\n/// Kho thật của app (ADR-004c): ECIES với khoá Secure Enclave. Chỉ chuyển tiếp sang `SecureEnclaveBackend`\n/// (dùng chung với helper `sshdesk-askpass`) và đổi kiểu lỗi. Không bao giờ đọc/ghi plaintext.\npublic struct SecureEnclaveCredentialStore: CredentialStore, CustomStringConvertible {\n    public let backend: SecureEnclaveBackend\n\n    public init(trustedApplicationPaths: [String] = []) {\n        backend = SecureEnclaveBackend(trustedApplicationPaths: trustedApplicationPaths)\n    }\n\n    public init(backend: SecureEnclaveBackend) { self.backend = backend }\n\n    public var description: String { \"SecureEnclaveCredentialStore\" }\n\n    public func save(ref: String, password: String) throws {\n        do { try backend.save(account: ref, secret: password) } catch { throw Self.map(error) }\n    }\n    public func read(ref: String) -> String? { backend.read(account: ref) }\n    public func delete(ref: String) throws {\n        do { try backend.delete(account: ref) } catch { throw Self.map(error) }\n    }\n    public func exists(ref: String) -> Bool { backend.exists(account: ref) }\n    public func status(ref: String) -> CredentialStatus {\n        switch backend.status(account: ref) {\n        case .missing: return .missing\n        case .present: return .present\n        case .undecryptable: return .undecryptable\n        }\n    }\n\n    private static func map(_ error: Error) -> CredentialStoreError {\n        switch error as? SecureEnclaveBackendError {\n        case .invalidAccount?: return .invalidReference\n        case .keychain(let s)?: return .keychain(status: s)\n        case let e?: return .secureEnclave(e.message)\n        case nil: return .keychain(status: -1)\n        }\n    }\n}\n\n/// Kho trong bộ nhớ cho test.\npublic final class InMemoryCredentialStore: CredentialStore, CustomStringConvertible,\n    @unchecked Sendable\n{\n    private let lock = NSLock()\n    private var items: [String: String] = [:]\n    private var readCount = 0\n\n    public init() {}\n\n    public var description: String { \"InMemoryCredentialStore(count: \\(lock.withLock { items.count }))\" }\n    /// Số lần `read` đã gọi (test dùng để chắc chắn không đọc thừa).\n    public var reads: Int { lock.withLock { readCount } }\n\n    public func save(ref: String, password: String) throws {\n        guard !ref.isEmpty else { throw CredentialStoreError.invalidReference }\n        lock.withLock { items[ref] = password }\n    }\n    public func read(ref: String) -> String? {\n        lock.withLock {\n            readCount += 1\n            return items[ref]\n        }\n    }\n    public func delete(ref: String) throws { lock.withLock { items[ref] = nil } }\n    public func exists(ref: String) -> Bool { lock.withLock { items[ref] != nil } }\n}\n"}, "Sources/SSHDeskCore/Credentials/PasswordAutofillPolicy.swift": {"group": "Core · Credentials", "text": "import Foundation\n\n/// Quy tắc tự điền password đã lưu vào prompt qua PTY (ADR-010 \"Quy tắc tự điền password qua PTY\").\n/// Dùng chung cho job truyền file (`TransferManager`) và master của tab duyệt file (UI).\n///\n/// - Chỉ điền cho prompt `.password`, tối đa một lần mỗi job/phiên (`alreadyFilled`).\n/// - Host có bastion (`jumpHostID`): KHÔNG điền (ssh con của ProxyJump cũng hỏi password, có thể là của bastion).\n/// - Host managed: chỉ điền khi prompt đúng dạng `<user>@<hostName>'s password:` hoặc (keyboard-interactive,\n///   OpenSSH >= 8.4, ADR-010b) `(<user>@<hostName>) Password:` (host và chữ `Password:` không phân biệt\n///   hoa thường, bỏ khoảng trắng cuối). Prompt của bastion, `Password:` trơn, `Verification code:` không khớp.\n/// - Host imported: điền lần đầu (rủi ro ProxyJump trong `~/.ssh/config` của người dùng: KNOWN_LIMITATIONS).\npublic enum PasswordAutofillPolicy {\n    public static func shouldAutofill(\n        prompt: PromptKind, host: HostProfile, alreadyFilled: Bool\n    ) -> Bool {\n        guard case .password(let text) = prompt else { return false }\n        return shouldAutofill(promptText: text, host: host, alreadyFilled: alreadyFilled)\n    }\n\n    public static func shouldAutofill(\n        promptText: String, host: HostProfile, alreadyFilled: Bool\n    ) -> Bool {\n        guard !alreadyFilled else { return false }\n        // Password hiệu lực (riêng > bộ đăng nhập, ADR-030); nil khi hold (ADR-026).\n        guard let ref = host.autofillCredentialReference, !ref.isEmpty else { return false }\n        guard host.jumpHostID == nil else { return false }\n        switch host.connectionMode {\n        case .existingSSHConfigAlias:\n            return true\n        case .managed:\n            return matchesManagedPrompt(promptText, user: host.user, hostName: host.hostName)\n                || matchesKeyboardInteractivePrompt(promptText, user: host.user, hostName: host.hostName)\n        }\n    }\n\n    // Passphrase KHÔNG bao giờ tự điền qua PTY (ADR-030, QA K4s): server có thể in dòng giả giống prompt\n    // passphrase trong banner, passphrase rơi vào prompt password kế tiếp và bị gửi lên server. Chỉ đường\n    // askpass (Warp) mới điền passphrase vì chỉ ssh mới gọi được helper.\n\n    /// `ssh` in `\"%.30s@%.128s's password: \"` (user cắt 30, host cắt 128 ký tự).\n    static func matchesManagedPrompt(_ text: String, user: String, hostName: String) -> Bool {\n        let trimmed = text.trimmingCharacters(in: .whitespacesAndNewlines)\n        let suffix = \"'s password:\"\n        guard trimmed.lowercased().hasSuffix(suffix) else { return false }\n        let body = String(trimmed.dropLast(suffix.count))\n        guard let at = body.lastIndex(of: \"@\") else { return false }\n        let promptUser = String(body[..<at])\n        let promptHost = String(body[body.index(after: at)...])\n        guard !user.isEmpty, !hostName.isEmpty else { return false }\n        return promptUser == String(user.prefix(30))\n            && promptHost.caseInsensitiveCompare(String(hostName.prefix(128))) == .orderedSame\n    }\n\n    /// Prompt keyboard-interactive `(<user>@<hostName>) Password:` (ADR-010b).\n    static func matchesKeyboardInteractivePrompt(_ text: String, user: String, hostName: String) -> Bool {\n        let trimmed = text.trimmingCharacters(in: .whitespacesAndNewlines)\n        guard trimmed.hasPrefix(\"(\"), let close = trimmed.lastIndex(of: \")\") else { return false }\n        let rest = trimmed[trimmed.index(after: close)...].trimmingCharacters(in: .whitespaces)\n        guard rest.caseInsensitiveCompare(\"password:\") == .orderedSame else { return false }\n        let inner = String(trimmed[trimmed.index(after: trimmed.startIndex)..<close])\n        guard let at = inner.lastIndex(of: \"@\") else { return false }\n        let promptUser = String(inner[..<at])\n        let promptHost = String(inner[inner.index(after: at)...])\n        guard !user.isEmpty, !hostName.isEmpty else { return false }\n        return promptUser == String(user.prefix(30))\n            && promptHost.caseInsensitiveCompare(String(hostName.prefix(128))) == .orderedSame\n    }\n}\n"}, "Sources/SSHDeskCore/Hosts/Database.swift": {"group": "Core · Hosts", "text": "import Foundation\nimport SQLite3\n\npublic enum DatabaseError: Error, Equatable {\n    /// File không phải SQLite hợp lệ hoặc dữ liệu hỏng. File được giữ nguyên.\n    case corrupt(String)\n    /// schema_version trong file cao hơn phiên bản app biết. File được giữ nguyên.\n    case newerSchema(found: Int, supported: Int)\n    case sqlite(code: Int32, message: String)\n    case cannotCreate(String)\n    /// Mở chỉ đọc nhưng file không tồn tại (không bao giờ tạo mới ở chế độ này).\n    case notFound(String)\n    /// Mở chỉ đọc nhưng schema_version khác phiên bản bản này biết (cũ hơn hoặc mới hơn).\n    case schemaMismatch(found: Int, expected: Int)\n}\n\nenum SQLValue: Equatable {\n    case null\n    case int(Int64)\n    case real(Double)\n    case text(String)\n}\n\n/// Bọc một kết nối SQLite. Mọi truy cập đi qua khoá đệ quy nên an toàn khi dùng từ nhiều luồng.\npublic final class Database: @unchecked Sendable {\n    struct Migration {\n        let statements: [String]\n    }\n\n    /// Migration tuần tự: phần tử i đưa DB từ version i lên i+1.\n    static let migrations: [Migration] = [\n        Migration(statements: [\n            \"\"\"\n            CREATE TABLE hosts (\n                id TEXT PRIMARY KEY NOT NULL,\n                display_name TEXT NOT NULL,\n                project TEXT NOT NULL,\n                environment TEXT NOT NULL,\n                tags_json TEXT NOT NULL,\n                notes TEXT NOT NULL,\n                is_favorite INTEGER NOT NULL,\n                connection_mode TEXT NOT NULL,\n                host_name TEXT NOT NULL,\n                port INTEGER NOT NULL,\n                user TEXT NOT NULL,\n                auth_method TEXT NOT NULL,\n                identity_file TEXT,\n                jump_host_id TEXT REFERENCES hosts(id) ON DELETE RESTRICT,\n                ssh_config_path TEXT,\n                ssh_config_alias TEXT,\n                credential_reference TEXT,\n                bookmarks_json TEXT NOT NULL,\n                default_local_directory TEXT NOT NULL,\n                default_remote_directory TEXT NOT NULL,\n                created_at REAL NOT NULL,\n                updated_at REAL NOT NULL,\n                last_launch_requested_at REAL\n            )\n            \"\"\",\n            \"CREATE INDEX idx_hosts_jump ON hosts(jump_host_id)\",\n        ]),\n        // v2: lịch sử/queue truyền file. Không có FK tới hosts để lịch sử sống sau khi xoá host.\n        // Tuyệt đối không có cột password/passphrase/otp/transcript.\n        Migration(statements: [\n            \"\"\"\n            CREATE TABLE transfer_jobs (\n                id TEXT PRIMARY KEY NOT NULL,\n                host_id TEXT NOT NULL,\n                host_display_name TEXT NOT NULL,\n                target_snapshot TEXT NOT NULL,\n                ssh_alias_snapshot TEXT NOT NULL,\n                config_path_snapshot TEXT NOT NULL,\n                direction TEXT NOT NULL,\n                source_path TEXT NOT NULL,\n                destination_path TEXT NOT NULL,\n                item_kind TEXT NOT NULL,\n                overwrite_policy TEXT NOT NULL,\n                overwrite_new_name TEXT,\n                state TEXT NOT NULL,\n                created_at REAL NOT NULL,\n                started_at REAL,\n                finished_at REAL,\n                progress_bytes INTEGER,\n                progress_fraction REAL,\n                progress_bytes_per_second REAL,\n                exit_kind TEXT,\n                exit_value INTEGER,\n                failure_reason TEXT,\n                previous_attempt_id TEXT,\n                temp_partial_path TEXT,\n                seq INTEGER NOT NULL\n            )\n            \"\"\",\n            \"CREATE INDEX idx_transfer_jobs_seq ON transfer_jobs(seq)\",\n        ]),\n        // v3: thư mục rỗng (chưa có host nào). Thư mục có host suy ra từ hosts.project.\n        Migration(statements: [\n            \"CREATE TABLE host_folders (name TEXT PRIMARY KEY NOT NULL)\"\n        ]),\n        // v4: lịch sử Project Analyst (ADR-016). Không FK tới hosts (đọc được sau khi xoá server);\n        // không lưu stdout/stderr thô. Xoá một lần chạy xoá luôn server/luồng của nó (CASCADE).\n        Migration(statements: [\n            \"\"\"\n            CREATE TABLE analyst_runs (\n                id TEXT PRIMARY KEY NOT NULL,\n                folder_name TEXT NOT NULL,\n                started_at REAL NOT NULL,\n                finished_at REAL NOT NULL,\n                status TEXT NOT NULL,\n                warnings_json TEXT NOT NULL\n            )\n            \"\"\",\n            \"CREATE INDEX idx_analyst_runs_folder ON analyst_runs(folder_name, started_at)\",\n            \"\"\"\n            CREATE TABLE analyst_servers (\n                run_id TEXT NOT NULL REFERENCES analyst_runs(id) ON DELETE CASCADE,\n                seq INTEGER NOT NULL,\n                host_id TEXT NOT NULL,\n                display_name TEXT NOT NULL,\n                collected INTEGER NOT NULL,\n                addresses_json TEXT NOT NULL,\n                listening_json TEXT NOT NULL,\n                external_connections INTEGER NOT NULL\n            )\n            \"\"\",\n            \"CREATE INDEX idx_analyst_servers_run ON analyst_servers(run_id)\",\n            \"\"\"\n            CREATE TABLE analyst_flows (\n                run_id TEXT NOT NULL REFERENCES analyst_runs(id) ON DELETE CASCADE,\n                seq INTEGER NOT NULL,\n                source_host_id TEXT NOT NULL,\n                dest_host_id TEXT NOT NULL,\n                port INTEGER NOT NULL,\n                observed_connections INTEGER NOT NULL,\n                dest_ips_json TEXT NOT NULL,\n                source_processes_json TEXT NOT NULL,\n                outcome TEXT NOT NULL,\n                outcome_detail TEXT,\n                latency_ms INTEGER,\n                dest_check TEXT,\n                dest_bind TEXT,\n                evidence_json TEXT NOT NULL\n            )\n            \"\"\",\n            \"CREATE INDEX idx_analyst_flows_run ON analyst_flows(run_id)\",\n        ]),\n        // v5: loại máy Windows (RDP, ADR-017). Dữ liệu cũ nhận giá trị mặc định = ssh.\n        Migration(statements: [\n            \"ALTER TABLE hosts ADD COLUMN kind TEXT NOT NULL DEFAULT 'ssh'\",\n            \"ALTER TABLE hosts ADD COLUMN rdp_username TEXT NOT NULL DEFAULT ''\",\n            \"ALTER TABLE hosts ADD COLUMN rdp_domain TEXT\",\n            \"ALTER TABLE hosts ADD COLUMN rdp_gateway TEXT\",\n            \"ALTER TABLE hosts ADD COLUMN rdp_screen_mode TEXT NOT NULL DEFAULT 'fullScreen'\",\n            \"ALTER TABLE hosts ADD COLUMN rdp_multi_monitor INTEGER NOT NULL DEFAULT 0\",\n            \"ALTER TABLE hosts ADD COLUMN rdp_redirect_clipboard INTEGER NOT NULL DEFAULT 1\",\n            \"ALTER TABLE hosts ADD COLUMN rdp_admin_session INTEGER NOT NULL DEFAULT 0\",\n        ]),\n        // v6: local port forward đã lưu (ADR-011/E3). Xoá host thì xoá luôn forward của nó.\n        // local_port UNIQUE: không hai forward của app dùng chung một cổng local.\n        Migration(statements: [\n            \"\"\"\n            CREATE TABLE port_forwards (\n                id TEXT PRIMARY KEY NOT NULL,\n                host_id TEXT NOT NULL REFERENCES hosts(id) ON DELETE CASCADE,\n                name TEXT NOT NULL,\n                local_port INTEGER NOT NULL,\n                remote_host TEXT NOT NULL,\n                remote_port INTEGER NOT NULL,\n                created_at REAL NOT NULL\n            )\n            \"\"\",\n            \"CREATE UNIQUE INDEX idx_port_forwards_local ON port_forwards(local_port)\",\n            \"CREATE INDEX idx_port_forwards_host ON port_forwards(host_id)\",\n        ]),\n        // v7: cài đặt app (ADR-021). Chỉ khoá/giá trị văn bản, không bí mật.\n        Migration(statements: [\n            \"CREATE TABLE settings (key TEXT PRIMARY KEY NOT NULL, value TEXT NOT NULL)\"\n        ]),\n        // v8: IdentityAgent theo host (ADR-024). NULL = theo mặc định trong Cài đặt.\n        Migration(statements: [\n            \"ALTER TABLE hosts ADD COLUMN identity_agent TEXT\"\n        ]),\n        // v9: bộ đăng nhập dùng chung (ADR-030) + hold tự điền (ADR-026, thêm sớm vì gán bộ từ file cần hold).\n        // Không có cột secret: password ở Keychain `set-<uuid>`, passphrase `setkey-<uuid>`.\n        // Xoá bộ → host mất liên kết (ON DELETE SET NULL), không xoá host.\n        Migration(statements: [\n            \"\"\"\n            CREATE TABLE credential_sets (\n                id TEXT PRIMARY KEY NOT NULL,\n                name TEXT NOT NULL UNIQUE COLLATE NOCASE,\n                user TEXT,\n                identity_file TEXT,\n                identity_agent TEXT,\n                note TEXT NOT NULL DEFAULT '',\n                created_at REAL NOT NULL,\n                updated_at REAL NOT NULL\n            )\n            \"\"\",\n            \"ALTER TABLE hosts ADD COLUMN credential_set_id TEXT REFERENCES credential_sets(id) ON DELETE SET NULL\",\n            \"ALTER TABLE hosts ADD COLUMN autofill_hold INTEGER NOT NULL DEFAULT 0\",\n            \"ALTER TABLE hosts ADD COLUMN autofill_hold_reason TEXT\",\n            \"CREATE INDEX idx_hosts_credential_set ON hosts(credential_set_id)\",\n        ]),\n        // v10: nguồn máy chủ đồng bộ một chiều (ADR-026). Không có cột secret. Xoá nguồn → host mất liên kết\n        // (ON DELETE SET NULL), không xoá host. `source_missing` = host không còn trong nguồn (không bao giờ tự xoá).\n        Migration(statements: [\n            \"\"\"\n            CREATE TABLE inventory_sources (\n                id TEXT PRIMARY KEY NOT NULL,\n                name TEXT NOT NULL,\n                kind TEXT NOT NULL CHECK (kind IN ('excel', 'csv', 'json', 'ansible')),\n                path TEXT NOT NULL,\n                folder TEXT NOT NULL DEFAULT '',\n                default_environment TEXT,\n                config_json TEXT NOT NULL DEFAULT '{}',\n                last_synced_at REAL,\n                last_fingerprint TEXT\n            )\n            \"\"\",\n            \"ALTER TABLE hosts ADD COLUMN source_id TEXT REFERENCES inventory_sources(id) ON DELETE SET NULL\",\n            \"ALTER TABLE hosts ADD COLUMN external_id TEXT\",\n            \"ALTER TABLE hosts ADD COLUMN source_missing INTEGER NOT NULL DEFAULT 0\",\n            \"CREATE INDEX idx_hosts_source ON hosts(source_id)\",\n        ]),\n        // v11: nguồn số liệu Prometheus/Zabbix (ADR-028). KHÔNG có cột secret: token/password ở CredentialStore,\n        // `credential_ref` chỉ là tham chiếu (`metrics-<uuid>`). Gán thư mục -> nguồn ở bảng riêng;\n        // xoá nguồn -> gán biến mất (CASCADE), thư mục quay về đo qua SSH.\n        Migration(statements: [\n            \"\"\"\n            CREATE TABLE metric_sources (\n                id TEXT PRIMARY KEY NOT NULL,\n                name TEXT NOT NULL,\n                kind TEXT NOT NULL CHECK (kind IN ('prometheus', 'zabbix')),\n                base_url TEXT NOT NULL,\n                auth_kind TEXT NOT NULL CHECK (auth_kind IN ('none', 'bearer', 'basic')),\n                basic_user TEXT,\n                credential_ref TEXT,\n                instance_template TEXT NOT NULL,\n                allow_insecure_http INTEGER NOT NULL DEFAULT 0,\n                created_at REAL NOT NULL\n            )\n            \"\"\",\n            \"\"\"\n            CREATE TABLE metric_folder_sources (\n                folder TEXT PRIMARY KEY NOT NULL,\n                source_id TEXT NOT NULL REFERENCES metric_sources(id) ON DELETE CASCADE\n            )\n            \"\"\",\n        ]),\n    ]\n\n    /// Phiên bản schema mà bản app này biết (hiện ở màn Cài đặt).\n    public static var currentSchemaVersion: Int { migrations.count }\n\n    private static let sqliteMagic = Data(\"SQLite format 3\\0\".utf8)\n\n    private var handle: OpaquePointer?\n    private let lock = NSRecursiveLock()\n\n    public convenience init(url: URL) throws {\n        try self.init(url: url, migrations: Database.migrations)\n    }\n\n    init(url: URL, migrations: [Migration]) throws {\n        let fm = FileManager.default\n        let path = url.path\n\n        if fm.fileExists(atPath: path) {\n            // Kiểm tra header trước khi mở: tránh SQLite coi file rác ngắn là DB rỗng rồi ghi đè.\n            try Self.requireSQLiteHeader(path: path)\n        } else {\n            let dir = url.deletingLastPathComponent()\n            if !fm.fileExists(atPath: dir.path) {\n                do {\n                    try fm.createDirectory(\n                        at: dir, withIntermediateDirectories: true,\n                        attributes: [.posixPermissions: 0o700])\n                } catch { throw DatabaseError.cannotCreate(\"\\(error)\") }\n            }\n            guard fm.createFile(atPath: path, contents: nil, attributes: [.posixPermissions: 0o600])\n            else { throw DatabaseError.cannotCreate(path) }\n        }\n\n        var db: OpaquePointer?\n        let rc = sqlite3_open_v2(path, &db, SQLITE_OPEN_READWRITE | SQLITE_OPEN_FULLMUTEX, nil)\n        guard rc == SQLITE_OK, let db else {\n            let msg = db.map { String(cString: sqlite3_errmsg($0)) } ?? \"open failed\"\n            if let db { sqlite3_close(db) }\n            throw DatabaseError.sqlite(code: rc, message: msg)\n        }\n        self.handle = db\n        do {\n            try prepareAndMigrate(migrations)\n        } catch {\n            sqlite3_close(db)\n            self.handle = nil\n            throw error\n        }\n    }\n\n    /// Kết nối chỉ đọc cho CLI (ADR-025). Chỉ nhận handle đã mở READONLY.\n    private init(readOnlyHandle: OpaquePointer) {\n        self.handle = readOnlyHandle\n    }\n\n    /// Mở DB **chỉ đọc**: `SQLITE_OPEN_READONLY`, `busy_timeout` 2000 ms, không migration, không bật WAL,\n    /// không ghi gì. File không có -> `.notFound`; schema_version khác `currentSchemaVersion` -> `.schemaMismatch`.\n    public static func openReadOnly(url: URL) throws -> Database {\n        let path = url.path\n        guard FileManager.default.fileExists(atPath: path) else {\n            throw DatabaseError.notFound(path)\n        }\n        try requireSQLiteHeader(path: path)\n        // DB WAL mà mọi kết nối ghi đã đóng không còn -wal/-shm: mở READONLY thường có thể CANTOPEN\n        // (không tạo được -shm). Thử lần lượt: thường -> URI mode=ro -> immutable=1 (chỉ khi không có -wal,\n        // vì immutable bỏ qua WAL). Không bước nào ghi hay tạo file.\n        let encoded =\n            path.addingPercentEncoding(\n                withAllowedCharacters: CharacterSet(\n                    charactersIn: \"abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/-._~\")\n            ) ?? path\n        var attempts: [(String, Int32)] = [\n            (path, SQLITE_OPEN_READONLY),\n            (\"file:\\(encoded)?mode=ro\", SQLITE_OPEN_READONLY | SQLITE_OPEN_URI),\n        ]\n        if !FileManager.default.fileExists(atPath: path + \"-wal\") {\n            attempts.append((\"file:\\(encoded)?immutable=1\", SQLITE_OPEN_READONLY | SQLITE_OPEN_URI))\n        }\n        var lastError: DatabaseError = .cannotCreate(path)\n        for (target, flags) in attempts {\n            do {\n                return try openVerified(target: target, flags: flags | SQLITE_OPEN_FULLMUTEX)\n            } catch DatabaseError.sqlite(let code, let message)\n                where code == SQLITE_CANTOPEN || code == SQLITE_READONLY\n            {\n                lastError = .sqlite(\n                    code: code,\n                    message: \"\\(message). Hãy mở SSH Desk một lần (để nó đóng/dọn WAL) hoặc kiểm tra quyền đọc \\(path)\")\n            }\n        }\n        throw lastError\n    }\n\n    private static func openVerified(target: String, flags: Int32) throws -> Database {\n        var db: OpaquePointer?\n        let rc = sqlite3_open_v2(target, &db, flags, nil)\n        guard rc == SQLITE_OK, let db else {\n            let msg = db.map { String(cString: sqlite3_errmsg($0)) } ?? \"open failed\"\n            if let db { sqlite3_close(db) }\n            throw DatabaseError.sqlite(code: rc, message: msg)\n        }\n        sqlite3_busy_timeout(db, 2000)\n        let database = Database(readOnlyHandle: db)  // deinit đóng handle nếu các bước sau lỗi\n        let tables = try database.query(\n            \"SELECT name FROM sqlite_master WHERE type='table' AND name='schema_version'\")\n        let version = tables.isEmpty ? 0 : try database.schemaVersion()\n        guard version == currentSchemaVersion else {\n            throw DatabaseError.schemaMismatch(found: version, expected: currentSchemaVersion)\n        }\n        return database\n    }\n\n    deinit {\n        if let handle { sqlite3_close(handle) }\n    }\n\n    private static func requireSQLiteHeader(path: String) throws {\n        guard let fh = FileHandle(forReadingAtPath: path) else {\n            throw DatabaseError.cannotCreate(\"không đọc được \\(path)\")\n        }\n        defer { try? fh.close() }\n        let head = (try? fh.read(upToCount: 16)) ?? Data()\n        // File rỗng là DB SQLite hợp lệ (chưa có gì).\n        if head.isEmpty { return }\n        if head != sqliteMagic { throw DatabaseError.corrupt(\"không phải file SQLite\") }\n    }\n\n    private func prepareAndMigrate(_ migrations: [Migration]) throws {\n        // Kiểm tra đọc được và schema_version TRƯỚC khi bật WAL hay ghi bất cứ gì.\n        let version: Int\n        let tables = try query(\n            \"SELECT name FROM sqlite_master WHERE type='table' AND name='schema_version'\")\n        if tables.isEmpty {\n            version = 0\n        } else {\n            version = try schemaVersion()\n        }\n        if version > migrations.count {\n            throw DatabaseError.newerSchema(found: version, supported: migrations.count)\n        }\n\n        try execute(\"PRAGMA foreign_keys=ON\")\n        _ = try query(\"PRAGMA journal_mode=WAL\")\n\n        if version == migrations.count { return }\n        for target in version..<migrations.count {\n            try transaction {\n                if target == 0 {\n                    try execute(\"CREATE TABLE schema_version (version INTEGER NOT NULL)\")\n                    try execute(\"INSERT INTO schema_version(version) VALUES (0)\")\n                }\n                for sql in migrations[target].statements { try execute(sql) }\n                try execute(\"UPDATE schema_version SET version = ?\", [.int(Int64(target + 1))])\n            }\n        }\n    }\n\n    // MARK: - Truy cập\n\n    func schemaVersion() throws -> Int {\n        let rows = try query(\"SELECT MAX(version) FROM schema_version\")\n        if case .int(let v)? = rows.first?.first { return Int(v) }\n        return 0\n    }\n\n    func transaction<T>(_ body: () throws -> T) throws -> T {\n        lock.lock()\n        defer { lock.unlock() }\n        try execute(\"BEGIN IMMEDIATE\")\n        do {\n            let result = try body()\n            try execute(\"COMMIT\")\n            return result\n        } catch {\n            try? execute(\"ROLLBACK\")\n            throw error\n        }\n    }\n\n    func execute(_ sql: String, _ params: [SQLValue] = []) throws {\n        _ = try run(sql, params)\n    }\n\n    func query(_ sql: String, _ params: [SQLValue] = []) throws -> [[SQLValue]] {\n        try run(sql, params)\n    }\n\n    private func run(_ sql: String, _ params: [SQLValue]) throws -> [[SQLValue]] {\n        lock.lock()\n        defer { lock.unlock() }\n        guard let handle else { throw DatabaseError.sqlite(code: SQLITE_MISUSE, message: \"closed\") }\n        var stmt: OpaquePointer?\n        var rc = sqlite3_prepare_v2(handle, sql, -1, &stmt, nil)\n        guard rc == SQLITE_OK, let stmt else { throw error(rc) }\n        defer { sqlite3_finalize(stmt) }\n\n        let transient = unsafeBitCast(-1, to: sqlite3_destructor_type.self)\n        for (i, p) in params.enumerated() {\n            let idx = Int32(i + 1)\n            switch p {\n            case .null: rc = sqlite3_bind_null(stmt, idx)\n            case .int(let v): rc = sqlite3_bind_int64(stmt, idx, v)\n            case .real(let v): rc = sqlite3_bind_double(stmt, idx, v)\n            case .text(let s): rc = sqlite3_bind_text(stmt, idx, s, -1, transient)\n            }\n            guard rc == SQLITE_OK else { throw error(rc) }\n        }\n\n        var rows: [[SQLValue]] = []\n        while true {\n            rc = sqlite3_step(stmt)\n            if rc == SQLITE_DONE { break }\n            guard rc == SQLITE_ROW else { throw error(rc) }\n            let n = sqlite3_column_count(stmt)\n            var row: [SQLValue] = []\n            for c in 0..<n {\n                switch sqlite3_column_type(stmt, c) {\n                case SQLITE_INTEGER: row.append(.int(sqlite3_column_int64(stmt, c)))\n                case SQLITE_FLOAT: row.append(.real(sqlite3_column_double(stmt, c)))\n                case SQLITE_TEXT:\n                    row.append(.text(String(cString: sqlite3_column_text(stmt, c))))\n                default: row.append(.null)\n                }\n            }\n            rows.append(row)\n        }\n        return rows\n    }\n\n    private func error(_ code: Int32) -> DatabaseError {\n        let msg = handle.map { String(cString: sqlite3_errmsg($0)) } ?? \"\"\n        if code == SQLITE_NOTADB || code == SQLITE_CORRUPT { return .corrupt(msg) }\n        return .sqlite(code: code, message: msg)\n    }\n}\n"}, "Sources/SSHDeskCore/Hosts/HostProfile.swift": {"group": "Core · Hosts", "text": "import Foundation\n\npublic enum HostEnvironment: String, Codable, Sendable, CaseIterable {\n    case dev = \"DEV\"\n    case uat = \"UAT\"\n    case stg = \"STG\"\n    case prod = \"PROD\"\n    case other = \"OTHER\"\n}\n\npublic enum HostConnectionMode: String, Codable, Sendable {\n    /// App tự sinh khối `Host sshdesk-<uuid>` trong file SSH config của app.\n    case managed\n    /// Dùng nguyên alias có sẵn trong SSH config của người dùng.\n    case existingSSHConfigAlias\n}\n\n/// Loại máy: Linux/SSH (mặc định) hoặc Windows mở bằng Windows App qua file `.rdp` (ADR-017).\npublic enum HostKind: String, Codable, Sendable, CaseIterable {\n    case ssh\n    case windowsRDP\n}\n\npublic enum RDPScreenMode: String, Codable, Sendable, CaseIterable {\n    case fullScreen\n    case window\n}\n\npublic enum HostAuthMethod: String, Codable, Sendable, CaseIterable {\n    case agent\n    case keyFile\n    case interactive\n}\n\npublic struct RemoteBookmark: Codable, Sendable, Equatable {\n    public var name: String\n    public var path: String\n\n    public init(name: String, path: String) {\n        self.name = name\n        self.path = path\n    }\n}\n\npublic enum HostValidationError: Error, Equatable {\n    case emptyDisplayName\n    case invalidHostName(String)\n    case invalidUser(String)\n    case invalidPort(Int)\n    case identityFileRequired\n    case invalidIdentityFile\n    case invalidAlias(String)\n    case invalidSSHConfigPath\n    /// Chuỗi tự do chứa NUL. `field` là tên trường.\n    case containsNUL(field: String)\n    case selfJump\n    /// Hồ sơ imported không được có jump host.\n    case jumpHostNotAllowed\n    /// Trường RDP chứa ký tự điều khiển hoặc quá dài. `field` là tên trường.\n    case invalidRDPField(field: String)\n    case invalidRDPGateway(String)\n    /// `IdentityAgent` không hợp lệ (ADR-024).\n    case invalidIdentityAgent(IdentityAgentError)\n    /// `credentialReference` thuộc kho tạm trong bộ nhớ (ADR-029): không bao giờ được lưu vào DB.\n    case ephemeralReference\n}\n\n/// Hồ sơ máy chủ. Không bao giờ chứa password/passphrase — chỉ `credentialReference` trỏ vào Keychain.\npublic struct HostProfile: Codable, Sendable, Identifiable, Equatable {\n    public var id: UUID\n    public var displayName: String\n    public var project: String\n    public var environment: HostEnvironment\n    public var tags: [String]\n    public var notes: String\n    public var isFavorite: Bool\n    public var connectionMode: HostConnectionMode\n    public var kind: HostKind\n\n    // Windows (RDP). Không bao giờ có password: người dùng nhập/lưu trong Windows App.\n    /// `DOMAIN\\user` hoặc `user@domain`; rỗng = để Windows App hỏi.\n    public var rdpUsername: String\n    public var rdpDomain: String?\n    /// `hostname[:port]`.\n    public var rdpGateway: String?\n    public var rdpScreenMode: RDPScreenMode\n    public var rdpMultiMonitor: Bool\n    public var rdpRedirectClipboard: Bool\n    public var rdpAdminSession: Bool\n\n    /// Mặc định cổng RDP.\n    public static let defaultRDPPort = 3389\n    /// Giới hạn độ dài mỗi chuỗi RDP.\n    public static let maxRDPFieldLength = 256\n\n    // Managed\n    public var hostName: String\n    public var port: Int\n    public var user: String\n    public var authMethod: HostAuthMethod\n    public var identityFile: String?\n    /// Đường dẫn socket agent (ADR-024). nil = theo mặc định trong Cài đặt. Không phải secret.\n    public var identityAgent: String?\n    public var jumpHostID: UUID?\n\n    // Imported\n    public var sshConfigPath: String?\n    public var sshConfigAlias: String?\n\n    /// Tham chiếu Keychain RIÊNG của host, KHÔNG phải password. Ưu tiên hơn bộ đăng nhập (ADR-030).\n    /// Để lấy password dùng `effectiveCredentialReference` / `autofillCredentialReference`, đừng đọc trực tiếp.\n    public var credentialReference: String?\n    /// Bộ đăng nhập dùng chung (ADR-030); nil = không dùng bộ.\n    public var credentialSetID: UUID?\n    /// ADR-026/030: đang tạm tắt tự điền cho host này tới khi người dùng xác nhận.\n    public var autofillHold: Bool\n    /// Lý do hold (chỉ giá trị cũ → mới hoặc tên bộ đăng nhập, không secret).\n    public var autofillHoldReason: String?\n    /// Nguồn đồng bộ (ADR-026): các trường do nguồn quản lý chỉ đọc trong form. nil = tạo tay.\n    public var sourceID: UUID?\n    /// Khoá của host trong nguồn (vd cột Tên). Chỉ có nghĩa khi `sourceID != nil`.\n    public var externalID: String?\n    /// Host không còn trong lần đồng bộ gần nhất (không bao giờ tự xoá).\n    public var sourceMissing: Bool\n    public var remoteBookmarks: [RemoteBookmark]\n    public var defaultLocalDirectory: String\n    public var defaultRemoteDirectory: String\n    public var createdAt: Date\n    public var updatedAt: Date\n    public var lastLaunchRequestedAt: Date?\n\n    public init(\n        id: UUID = UUID(),\n        displayName: String,\n        project: String = \"\",\n        environment: HostEnvironment = .other,\n        tags: [String] = [],\n        notes: String = \"\",\n        isFavorite: Bool = false,\n        connectionMode: HostConnectionMode = .managed,\n        kind: HostKind = .ssh,\n        rdpUsername: String = \"\",\n        rdpDomain: String? = nil,\n        rdpGateway: String? = nil,\n        rdpScreenMode: RDPScreenMode = .fullScreen,\n        rdpMultiMonitor: Bool = false,\n        rdpRedirectClipboard: Bool = true,\n        rdpAdminSession: Bool = false,\n        hostName: String = \"\",\n        port: Int = 22,\n        user: String = \"\",\n        authMethod: HostAuthMethod = .agent,\n        identityFile: String? = nil,\n        identityAgent: String? = nil,\n        jumpHostID: UUID? = nil,\n        sshConfigPath: String? = nil,\n        sshConfigAlias: String? = nil,\n        credentialReference: String? = nil,\n        credentialSetID: UUID? = nil,\n        autofillHold: Bool = false,\n        autofillHoldReason: String? = nil,\n        sourceID: UUID? = nil,\n        externalID: String? = nil,\n        sourceMissing: Bool = false,\n        remoteBookmarks: [RemoteBookmark] = [],\n        defaultLocalDirectory: String = \"\",\n        defaultRemoteDirectory: String = \"\",\n        createdAt: Date = Date(),\n        updatedAt: Date = Date(),\n        lastLaunchRequestedAt: Date? = nil\n    ) {\n        self.id = id\n        self.displayName = displayName\n        self.project = project\n        self.environment = environment\n        self.tags = tags\n        self.notes = notes\n        self.isFavorite = isFavorite\n        self.connectionMode = connectionMode\n        self.kind = kind\n        self.rdpUsername = rdpUsername\n        self.rdpDomain = rdpDomain\n        self.rdpGateway = rdpGateway\n        self.rdpScreenMode = rdpScreenMode\n        self.rdpMultiMonitor = rdpMultiMonitor\n        self.rdpRedirectClipboard = rdpRedirectClipboard\n        self.rdpAdminSession = rdpAdminSession\n        self.hostName = hostName\n        self.port = port\n        self.user = user\n        self.authMethod = authMethod\n        self.identityFile = identityFile\n        self.identityAgent = identityAgent\n        self.jumpHostID = jumpHostID\n        self.sshConfigPath = sshConfigPath\n        self.sshConfigAlias = sshConfigAlias\n        self.credentialReference = credentialReference\n        self.credentialSetID = credentialSetID\n        self.autofillHold = autofillHold\n        self.autofillHoldReason = autofillHoldReason\n        self.sourceID = sourceID\n        self.externalID = externalID\n        self.sourceMissing = sourceMissing\n        self.remoteBookmarks = remoteBookmarks\n        self.defaultLocalDirectory = defaultLocalDirectory\n        self.defaultRemoteDirectory = defaultRemoteDirectory\n        self.createdAt = createdAt\n        self.updatedAt = updatedAt\n        self.lastLaunchRequestedAt = lastLaunchRequestedAt\n    }\n\n    /// Bản sao để nhân bản: id mới, tên `<tên> (bản sao)` (thêm số nếu trùng tên đã có), giữ mọi cấu hình.\n    /// Không chép yêu thích, lần mở Warp cuối, credentialReference (mật khẩu xử lý riêng ở service).\n    public func duplicated(newID: UUID = UUID(), now: Date = Date(), existingNames: [String])\n        -> HostProfile\n    {\n        var copy = self\n        copy.id = newID\n        copy.displayName = Self.duplicateName(of: displayName, existingNames: existingNames)\n        copy.isFavorite = false\n        copy.lastLaunchRequestedAt = nil\n        copy.credentialReference = nil\n        // Bản sao là máy tạo tay: không thuộc nguồn (tránh hai host cùng khoá trong một nguồn).\n        copy.sourceID = nil\n        copy.externalID = nil\n        copy.sourceMissing = false\n        copy.createdAt = now\n        copy.updatedAt = now\n        return copy\n    }\n\n    static func duplicateName(of name: String, existingNames: [String]) -> String {\n        let taken = Set(existingNames.map { $0.trimmingCharacters(in: .whitespacesAndNewlines).lowercased() })\n        var candidate = \"\\(name) (bản sao)\"\n        var n = 2\n        while taken.contains(candidate.lowercased()) {\n            candidate = \"\\(name) (bản sao \\(n))\"\n            n += 1\n        }\n        return candidate\n    }\n\n    /// Host có mật khẩu riêng (không tính bộ đăng nhập) — ADR-030/031.\n    public var hasOwnPassword: Bool { !(credentialReference ?? \"\").isEmpty }\n\n    /// Tham chiếu Keychain của password hiệu lực (ADR-030): riêng của host nếu có → `set-<uuid>` nếu có bộ → nil.\n    /// Dùng để HIỂN THỊ \"đã lưu mật khẩu?\"; mọi đường TỰ ĐIỀN phải dùng `autofillCredentialReference`.\n    public var effectiveCredentialReference: String? {\n        if let own = credentialReference, !own.isEmpty { return own }\n        if let setID = credentialSetID { return CredentialSet.passwordReference(for: setID) }\n        return nil\n    }\n\n    /// Như `effectiveCredentialReference` nhưng nil khi đang hold (ADR-026): PasswordAutofillPolicy, askpass,\n    /// Windows clipboard, phiên SFTP, tunnel, cài key đều chỉ được lấy password qua thuộc tính này.\n    public var autofillCredentialReference: String? {\n        autofillHold ? nil : effectiveCredentialReference\n    }\n\n    /// Alias dùng cho `ssh -F <config app> <alias>`; nil nếu hồ sơ imported thiếu alias.\n    public var sshAlias: String? {\n        guard kind == .ssh else { return nil }\n        switch connectionMode {\n        case .managed: return Self.managedAlias(for: id)\n        case .existingSSHConfigAlias: return sshConfigAlias\n        }\n    }\n\n    static func managedAlias(for id: UUID) -> String {\n        \"sshdesk-\" + id.uuidString.lowercased()\n    }\n\n    public func validate(credentialSet: CredentialSet? = nil) throws {\n        if displayName.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {\n            throw HostValidationError.emptyDisplayName\n        }\n        try noNUL(displayName, \"displayName\")\n        try noNUL(project, \"project\")\n        try noNUL(notes, \"notes\")\n        for tag in tags { try noNUL(tag, \"tags\") }\n        for b in remoteBookmarks {\n            try noNUL(b.name, \"remoteBookmarks.name\")\n            try noNUL(b.path, \"remoteBookmarks.path\")\n        }\n        try noNUL(defaultLocalDirectory, \"defaultLocalDirectory\")\n        try noNUL(defaultRemoteDirectory, \"defaultRemoteDirectory\")\n        if let credentialReference {\n            try noNUL(credentialReference, \"credentialReference\")\n            if credentialReference.hasPrefix(EphemeralPasswordVault.referencePrefix)\n                || credentialReference.hasPrefix(\"verify-\")\n            {\n                throw HostValidationError.ephemeralReference\n            }\n        }\n        if let autofillHoldReason { try noNUL(autofillHoldReason, \"autofillHoldReason\") }\n        if let identityAgent {\n            do { try IdentityAgentPath.validate(identityAgent) } catch let e as IdentityAgentError {\n                throw HostValidationError.invalidIdentityAgent(e)\n            }\n        }\n\n        if kind == .windowsRDP {\n            try validateRDP()\n            return\n        }\n\n        switch connectionMode {\n        case .managed:\n            do { try SSHConfigWriter.validateHostName(hostName) } catch {\n                throw HostValidationError.invalidHostName(hostName)\n            }\n            guard (1...65535).contains(port) else { throw HostValidationError.invalidPort(port) }\n            guard\n                (try? SSHConfigWriter.rejectControl(user, field: \"user\")) != nil,\n                user.range(of: #\"^[A-Za-z0-9._][A-Za-z0-9._-]*$\"#, options: .regularExpression)\n                    != nil\n            else { throw HostValidationError.invalidUser(user) }\n            if authMethod == .keyFile {\n                // Hợp lệ khi identityFile hiệu lực có: của host, hoặc của bộ đăng nhập (ADR-030).\n                let own = identityFile ?? \"\"\n                let effective = own.isEmpty ? (credentialSet?.identityFile ?? \"\") : own\n                guard !effective.isEmpty else { throw HostValidationError.identityFileRequired }\n                do { try SSHConfigWriter.validatePath(effective, field: \"identityFile\") } catch {\n                    throw HostValidationError.invalidIdentityFile\n                }\n            }\n            if jumpHostID == id { throw HostValidationError.selfJump }\n        case .existingSSHConfigAlias:\n            let alias = sshConfigAlias ?? \"\"\n            guard\n                alias.range(of: #\"^[A-Za-z0-9][A-Za-z0-9._-]*$\"#, options: .regularExpression)\n                    != nil\n            else { throw HostValidationError.invalidAlias(alias) }\n            guard let sshConfigPath,\n                (try? SSHConfigWriter.validatePath(sshConfigPath, field: \"sshConfigPath\")) != nil\n            else { throw HostValidationError.invalidSSHConfigPath }\n            if jumpHostID != nil { throw HostValidationError.jumpHostNotAllowed }\n        }\n    }\n\n    private func validateRDP() throws {\n        do { try SSHConfigWriter.validateHostName(hostName) } catch {\n            throw HostValidationError.invalidHostName(hostName)\n        }\n        guard (1...65535).contains(port) else { throw HostValidationError.invalidPort(port) }\n        try Self.checkRDPString(rdpUsername, \"rdpUsername\")\n        try Self.checkRDPString(rdpDomain ?? \"\", \"rdpDomain\")\n        let gateway = rdpGateway ?? \"\"\n        try Self.checkRDPString(gateway, \"rdpGateway\")\n        if !gateway.isEmpty && !Self.isValidGateway(gateway) {\n            throw HostValidationError.invalidRDPGateway(gateway)\n        }\n    }\n\n    /// Cấm ký tự điều khiển (nhất là CR/LF: chặn chèn thuộc tính vào file .rdp) và chuỗi quá dài.\n    static func checkRDPString(_ s: String, _ field: String) throws {\n        let bad = s.unicodeScalars.contains {\n            $0.value < 0x20 || $0.value == 0x7F || (0x80...0x9F).contains($0.value)\n                || $0.value == 0x2028 || $0.value == 0x2029\n        }\n        if bad || s.count > maxRDPFieldLength {\n            throw HostValidationError.invalidRDPField(field: field)\n        }\n    }\n\n    /// `hostname`, `hostname:port`, `[ipv6]`, `[ipv6]:port` hoặc IPv6 trần.\n    static func isValidGateway(_ g: String) -> Bool {\n        func hostOK(_ h: String) -> Bool { (try? SSHConfigWriter.validateHostName(h)) != nil }\n        func portOK(_ p: Substring) -> Bool {\n            p.allSatisfy(\\.isASCII) && p.allSatisfy(\\.isNumber) && (Int(p).map { (1...65535).contains($0) } ?? false)\n        }\n        if g.hasPrefix(\"[\") {\n            guard let close = g.firstIndex(of: \"]\") else { return false }\n            let host = String(g[g.index(after: g.startIndex)..<close])\n            let rest = g[g.index(after: close)...]\n            guard hostOK(host), host.contains(\":\") else { return false }\n            if rest.isEmpty { return true }\n            return rest.hasPrefix(\":\") && portOK(rest.dropFirst())\n        }\n        let colons = g.filter { $0 == \":\" }.count\n        if colons == 0 { return hostOK(g) }\n        if colons == 1 {\n            let parts = g.split(separator: \":\", omittingEmptySubsequences: false)\n            return hostOK(String(parts[0])) && portOK(parts[1])\n        }\n        return hostOK(g)\n    }\n\n    private func noNUL(_ s: String, _ field: String) throws {\n        if s.unicodeScalars.contains(where: { $0.value == 0 }) {\n            throw HostValidationError.containsNUL(field: field)\n        }\n    }\n}\n"}, "Sources/SSHDeskCore/Hosts/HostRepository.swift": {"group": "Core · Hosts", "text": "import Foundation\n\npublic enum HostRepositoryError: Error, Equatable {\n    case notFound(UUID)\n    case duplicateID(UUID)\n    case jumpHostNotFound(UUID)\n    /// Chuỗi id tạo thành vòng (vd A→B→A).\n    case jumpCycle([UUID])\n    /// Không xoá được vì các host này đang dùng nó làm jump host.\n    case referencedAsJumpHost([UUID])\n    /// Đổi tên trùng một thư mục khác (giá trị = tên thư mục đang có).\n    case folderNameExists(String)\n}\n\npublic actor HostRepository {\n    let db: Database\n    let now: @Sendable () -> Date\n\n    public init(database: Database, now: @escaping @Sendable () -> Date = { Date() }) {\n        self.db = database\n        self.now = now\n    }\n\n    private static let columns = \"\"\"\n        id, display_name, project, environment, tags_json, notes, is_favorite, connection_mode, \\\n        host_name, port, user, auth_method, identity_file, jump_host_id, ssh_config_path, \\\n        ssh_config_alias, credential_reference, bookmarks_json, default_local_directory, \\\n        default_remote_directory, created_at, updated_at, last_launch_requested_at, \\\n        kind, rdp_username, rdp_domain, rdp_gateway, rdp_screen_mode, rdp_multi_monitor, \\\n        rdp_redirect_clipboard, rdp_admin_session, identity_agent, credential_set_id, \\\n        autofill_hold, autofill_hold_reason, source_id, external_id, source_missing\n        \"\"\"\n\n    // MARK: - Đọc\n\n    public func all() throws -> [HostProfile] {\n        try db.query(\n            \"SELECT \\(Self.columns) FROM hosts ORDER BY display_name COLLATE NOCASE, id\"\n        ).map(Self.decode)\n    }\n\n    public func host(id: UUID) throws -> HostProfile? {\n        try db.query(\n            \"SELECT \\(Self.columns) FROM hosts WHERE id = ?\", [.text(id.uuidString)]\n        ).first.map(Self.decode)\n    }\n\n    public func favorites() throws -> [HostProfile] {\n        try all().filter(\\.isFavorite)\n    }\n\n    /// Tên thư mục (một cấp) đang có: thư mục có host + thư mục rỗng đã tạo, sắp theo tên.\n    public func folders() throws -> [String] {\n        let rows = try db.query(\n            \"SELECT project FROM hosts WHERE project <> '' UNION SELECT name FROM host_folders\")\n        let names = rows.compactMap { row -> String? in\n            if case .text(let s)? = row.first { return s } else { return nil }\n        }\n        return HostFolders.sortedUnique(names)\n    }\n\n    /// Tạo thư mục rỗng. Đã có thư mục trùng tên (không phân biệt hoa thường/dấu) thì dùng lại tên đó.\n    /// Trả tên thư mục thực sự dùng.\n    @discardableResult\n    public func createFolder(_ rawName: String) throws -> String {\n        let name = try HostFolders.normalize(rawName)\n        return try db.transaction {\n            if let existing = try matchingFolder(name, excluding: nil) { return existing }\n            try db.execute(\"INSERT INTO host_folders(name) VALUES (?)\", [.text(name)])\n            return name\n        }\n    }\n\n    /// Đổi tên thư mục: đổi `project` của mọi host trong đó, một transaction.\n    /// Trùng tên thư mục khác → ném `folderNameExists` trừ khi `merge` (gộp vào thư mục đó, giữ cách viết của nó).\n    /// Trả tên thư mục kết quả.\n    @discardableResult\n    public func renameFolder(from old: String, to rawName: String, merge: Bool = false) throws\n        -> String\n    {\n        let new = try HostFolders.normalize(rawName)\n        return try db.transaction {\n            var target = new\n            if let other = try matchingFolder(new, excluding: old) {\n                if !merge { throw HostRepositoryError.folderNameExists(other) }\n                target = other\n            }\n            if target == old { return old }\n            try db.execute(\n                \"UPDATE hosts SET project = ?, updated_at = ? WHERE project = ?\",\n                [.text(target), .real(now().timeIntervalSince1970), .text(old)])\n            try db.execute(\"DELETE FROM host_folders WHERE name = ?\", [.text(old)])\n            try db.execute(\"INSERT OR IGNORE INTO host_folders(name) VALUES (?)\", [.text(target)])\n            return target\n        }\n    }\n\n    /// Xoá thư mục: host trong đó về \"Chưa phân loại\". KHÔNG xoá host. Trả số host bị ảnh hưởng.\n    @discardableResult\n    public func deleteFolder(_ name: String) throws -> Int {\n        try db.transaction {\n            let n = try db.query(\n                \"SELECT COUNT(*) FROM hosts WHERE project = ?\", [.text(name)])\n            try db.execute(\n                \"UPDATE hosts SET project = '', updated_at = ? WHERE project = ?\",\n                [.real(now().timeIntervalSince1970), .text(name)])\n            try db.execute(\"DELETE FROM host_folders WHERE name = ?\", [.text(name)])\n            if case .int(let c)? = n.first?.first { return Int(c) }\n            return 0\n        }\n    }\n\n    /// Chuyển host vào thư mục (`nil`/rỗng = Chưa phân loại). Thư mục dùng cách viết sẵn có nếu trùng tên.\n    public func moveHosts(ids: [UUID], toFolder rawName: String?) throws {\n        let trimmed = rawName?.trimmingCharacters(in: .whitespacesAndNewlines) ?? \"\"\n        try db.transaction {\n            var target = \"\"\n            if !trimmed.isEmpty {\n                let name = try HostFolders.normalize(trimmed)\n                target = try matchingFolder(name, excluding: nil) ?? name\n            }\n            for id in ids {\n                guard let stored = try self.host(id: id) else {\n                    throw HostRepositoryError.notFound(id)\n                }\n                try keepFolder(stored.project, ifLeftBy: target)\n                try db.execute(\n                    \"UPDATE hosts SET project = ?, updated_at = ? WHERE id = ?\",\n                    [.text(target), .real(now().timeIntervalSince1970), .text(id.uuidString)])\n            }\n        }\n    }\n\n    /// Host rời thư mục cũ thì thư mục đó vẫn được giữ lại (kể cả khi thành rỗng).\n    func keepFolder(_ old: String, ifLeftBy new: String) throws {\n        guard !old.isEmpty, old != new else { return }\n        try db.execute(\"INSERT OR IGNORE INTO host_folders(name) VALUES (?)\", [.text(old)])\n    }\n\n    /// Thư mục đã có trùng `name` (không phân biệt hoa thường/dấu), bỏ qua đúng tên `excluding`.\n    func matchingFolder(_ name: String, excluding: String?) throws -> String? {\n        try folders().first { $0 != excluding && HostFolders.sameFolder($0, name) }\n    }\n\n    /// Tìm không phân biệt hoa thường/dấu theo displayName, hostName, user, tags, project.\n    /// Lọc trong Swift nên `%`, `_`, `'` chỉ là ký tự thường, không có SQL nào nối dữ liệu người dùng.\n    public func search(_ query: String) throws -> [HostProfile] {\n        let q = query.trimmingCharacters(in: .whitespacesAndNewlines)\n        let hosts = try all()\n        if q.isEmpty { return hosts }\n        let options: String.CompareOptions = [.caseInsensitive, .diacriticInsensitive]\n        func hit(_ s: String) -> Bool { s.range(of: q, options: options) != nil }\n        return hosts.filter {\n            hit($0.displayName) || hit($0.hostName) || hit($0.user) || hit($0.project)\n                || $0.tags.contains(where: hit)\n        }\n    }\n\n    // MARK: - Ghi\n\n    public func insert(_ host: HostProfile) throws {\n        try db.transaction {\n            try host.validate(credentialSet: try credentialSet(for: host))\n            if try fetchExists(host.id) { throw HostRepositoryError.duplicateID(host.id) }\n            try checkJump(host)\n            try write(host, insert: true)\n        }\n    }\n\n    /// `updatedAt` luôn do repository đặt; `createdAt` giữ giá trị đã lưu.\n    @discardableResult\n    public func update(_ host: HostProfile) throws -> HostProfile {\n        return try db.transaction {\n            try host.validate(credentialSet: try credentialSet(for: host))\n            guard let stored = try self.host(id: host.id) else {\n                throw HostRepositoryError.notFound(host.id)\n            }\n            try checkJump(host)\n            try keepFolder(stored.project, ifLeftBy: host.project)\n            var saved = host\n            saved.createdAt = stored.createdAt\n            // Hold chỉ bỏ bằng `confirmAutofillHold` (ADR-026): sửa tay qua form/bản cũ không được xoá hold.\n            saved.autofillHold = stored.autofillHold\n            saved.autofillHoldReason = stored.autofillHoldReason\n            // Liên kết nguồn chỉ đổi qua đồng bộ / \"Tách khỏi nguồn\" (ADR-026), không qua form.\n            saved.sourceID = stored.sourceID\n            saved.externalID = stored.externalID\n            saved.sourceMissing = stored.sourceMissing\n            saved.updatedAt = now()\n            try write(saved, insert: false)\n            return saved\n        }\n    }\n\n    /// Ghi kết quả nhập (ADR-020) trong MỘT transaction: thư mục, máy (bastion trước), port forward.\n    /// Bất kỳ lỗi nào → không ghi gì. Không bao giờ ghi `credentialReference`/lần mở cuối từ file.\n    public func applyImport(_ plan: HostExchange.Plan) throws {\n        try db.transaction {\n            for name in plan.foldersToCreate {\n                let n = try HostFolders.normalize(name)\n                if try matchingFolder(n, excluding: nil) == nil {\n                    try db.execute(\"INSERT INTO host_folders(name) VALUES (?)\", [.text(n)])\n                }\n            }\n            let stamp = now()\n            for host in plan.hosts {\n                var h = host\n                h.credentialReference = nil\n                h.lastLaunchRequestedAt = nil\n                h.createdAt = stamp\n                h.updatedAt = stamp\n                h.autofillHold = false\n                h.autofillHoldReason = nil\n                h.credentialSetID = nil\n                // Gán bộ đăng nhập từ file (ADR-030): tạo bộ rỗng nếu chưa có, gán và HOLD tự điền\n                // tới khi người dùng xác nhận (chống chuyển password sang máy lạ qua file).\n                if let name = plan.setAssignments[host.id],\n                    let set = try credentialSet(named: name, createIfMissing: true)\n                {\n                    h.credentialSetID = set.id\n                    h.autofillHold = true\n                    h.autofillHoldReason = \"Bộ đăng nhập \\(set.name) được gán từ file\"\n                }\n                // Bộ mới tạo còn rỗng: máy `.keyFile` lấy key từ bộ vẫn nhập được (key đặt cho bộ sau).\n                var validationSet = try credentialSet(for: h)\n                if h.authMethod == .keyFile, validationSet != nil, (h.identityFile ?? \"\").isEmpty,\n                    (validationSet?.identityFile ?? \"\").isEmpty\n                {\n                    validationSet?.identityFile = \"/placeholder\"\n                }\n                try h.validate(credentialSet: validationSet)\n                if try fetchExists(h.id) { throw HostRepositoryError.duplicateID(h.id) }\n                try checkJump(h)\n                try write(h, insert: true)\n            }\n            for forward in plan.forwards {\n                var f = try forward.validated()\n                f.createdAt = stamp\n                try PortForwardRepository.checkHost(db, f.hostID)\n                try PortForwardRepository.checkPortFree(db, f.localPort, excluding: nil)\n                try PortForwardRepository.insertRow(db, f)\n            }\n        }\n    }\n\n    public func delete(id: UUID) throws {\n        try db.transaction {\n            guard try fetchExists(id) else { throw HostRepositoryError.notFound(id) }\n            let refs = try db.query(\n                \"SELECT id FROM hosts WHERE jump_host_id = ?\", [.text(id.uuidString)])\n            let ids = refs.compactMap { row -> UUID? in\n                if case .text(let s)? = row.first { return UUID(uuidString: s) } else { return nil }\n            }\n            if !ids.isEmpty { throw HostRepositoryError.referencedAsJumpHost(ids) }\n            try db.execute(\"DELETE FROM hosts WHERE id = ?\", [.text(id.uuidString)])\n        }\n    }\n\n    public func setFavorite(id: UUID, _ value: Bool) throws {\n        try db.transaction {\n            guard try fetchExists(id) else { throw HostRepositoryError.notFound(id) }\n            try db.execute(\n                \"UPDATE hosts SET is_favorite = ?, updated_at = ? WHERE id = ?\",\n                [.int(value ? 1 : 0), .real(now().timeIntervalSince1970), .text(id.uuidString)])\n        }\n    }\n\n    public func markLaunchRequested(id: UUID, at date: Date) throws {\n        try db.transaction {\n            guard try fetchExists(id) else { throw HostRepositoryError.notFound(id) }\n            try db.execute(\n                \"UPDATE hosts SET last_launch_requested_at = ? WHERE id = ?\",\n                [.real(date.timeIntervalSince1970), .text(id.uuidString)])\n        }\n    }\n\n    // MARK: - SSH config\n\n    /// Spec cho các host managed (host imported dùng nguyên alias gốc, không sinh Host block).\n    /// `defaultIdentityAgent`: mặc định trong Cài đặt (ADR-024); rỗng/nil = không ghi directive.\n    /// User/IdentityFile/IdentityAgent lấy từ `CredentialResolution` (host > bộ đăng nhập > Cài đặt, ADR-030).\n    public func sshSpecs(\n        defaultIdentityAgent: String? = nil,\n        isSecureEnclaveKey: (String) -> Bool = { SecureEnclaveKeyDetector.isSecureEnclaveKey(identityFile: $0) }\n    ) throws -> [SSHHostSpec] {\n        let hosts = try all()\n        let byID = Dictionary(uniqueKeysWithValues: hosts.map { ($0.id, $0) })\n        let sets = Dictionary(uniqueKeysWithValues: try credentialSets().map { ($0.id, $0) })\n        return hosts.filter { $0.kind == .ssh && $0.connectionMode == .managed }.map { h in\n            var jump: String?\n            if let jid = h.jumpHostID, let bastion = byID[jid] { jump = bastion.sshAlias }\n            let resolved = CredentialResolution.resolve(\n                host: h, set: h.credentialSetID.flatMap { sets[$0] },\n                settingsDefaultAgent: defaultIdentityAgent)\n            return SSHHostSpec(\n                alias: HostProfile.managedAlias(for: h.id), hostName: h.hostName, port: h.port,\n                user: resolved.user, identityFile: resolved.identityFile, jumpAlias: jump,\n                identityAgent: resolved.identityAgent,\n                usesSecureEnclaveProvider: resolved.identityFile.map(isSecureEnclaveKey) ?? false)\n        }\n    }\n\n    /// Alias để chạy `ssh -F <config app> <alias>`.\n    public nonisolated func sshAlias(for host: HostProfile) -> String? { host.sshAlias }\n\n    // MARK: - Nội bộ\n\n    func fetchExists(_ id: UUID) throws -> Bool {\n        !(try db.query(\"SELECT 1 FROM hosts WHERE id = ?\", [.text(id.uuidString)])).isEmpty\n    }\n\n    /// Jump host phải tồn tại và chuỗi bastion không quay lại chính host.\n    func checkJump(_ host: HostProfile) throws {\n        guard var current = host.jumpHostID else { return }\n        var path = [host.id]\n        while true {\n            if let idx = path.firstIndex(of: current) {\n                throw HostRepositoryError.jumpCycle(Array(path[idx...]) + [current])\n            }\n            guard let next = try self.host(id: current), next.kind == .ssh else {\n                throw HostRepositoryError.jumpHostNotFound(current)\n            }\n            path.append(current)\n            guard let n = next.jumpHostID else { return }\n            current = n\n        }\n    }\n\n    func write(_ h: HostProfile, insert: Bool) throws {\n        let tags = try Self.json(h.tags)\n        let marks = try Self.json(h.remoteBookmarks)\n        func opt(_ s: String?) -> SQLValue { s.map { .text($0) } ?? .null }\n        let values: [SQLValue] = [\n            .text(h.displayName), .text(h.project), .text(h.environment.rawValue), .text(tags),\n            .text(h.notes), .int(h.isFavorite ? 1 : 0), .text(h.connectionMode.rawValue),\n            .text(h.hostName), .int(Int64(h.port)), .text(h.user), .text(h.authMethod.rawValue),\n            opt(h.identityFile), opt(h.jumpHostID?.uuidString), opt(h.sshConfigPath),\n            opt(h.sshConfigAlias), opt(h.credentialReference), .text(marks),\n            .text(h.defaultLocalDirectory), .text(h.defaultRemoteDirectory),\n            .real(h.createdAt.timeIntervalSince1970), .real(h.updatedAt.timeIntervalSince1970),\n            h.lastLaunchRequestedAt.map { .real($0.timeIntervalSince1970) } ?? .null,\n            .text(h.kind.rawValue), .text(h.rdpUsername), opt(h.rdpDomain), opt(h.rdpGateway),\n            .text(h.rdpScreenMode.rawValue), .int(h.rdpMultiMonitor ? 1 : 0),\n            .int(h.rdpRedirectClipboard ? 1 : 0), .int(h.rdpAdminSession ? 1 : 0),\n            opt(h.identityAgent), opt(h.credentialSetID?.uuidString), .int(h.autofillHold ? 1 : 0),\n            opt(h.autofillHoldReason), opt(h.sourceID?.uuidString), opt(h.externalID),\n            .int(h.sourceMissing ? 1 : 0),\n        ]\n        if insert {\n            let marks = Array(repeating: \"?\", count: values.count + 1).joined(separator: \", \")\n            try db.execute(\n                \"INSERT INTO hosts (\\(Self.columns)) VALUES (\\(marks))\",\n                [.text(h.id.uuidString)] + values)\n        } else {\n            let sets = Self.columns.components(separatedBy: \", \").dropFirst()\n                .map { \"\\($0.trimmingCharacters(in: .whitespaces)) = ?\" }.joined(separator: \", \")\n            try db.execute(\n                \"UPDATE hosts SET \\(sets) WHERE id = ?\", values + [.text(h.id.uuidString)])\n        }\n    }\n\n    private static func json<T: Encodable>(_ v: T) throws -> String {\n        String(decoding: try JSONEncoder().encode(v), as: UTF8.self)\n    }\n\n    private static func decode(_ row: [SQLValue]) throws -> HostProfile {\n        func bad(_ what: String) -> DatabaseError { .corrupt(\"hàng hosts không hợp lệ: \\(what)\") }\n        func text(_ i: Int) throws -> String {\n            if case .text(let s) = row[i] { return s }\n            throw bad(\"cột \\(i)\")\n        }\n        func optText(_ i: Int) -> String? {\n            if case .text(let s) = row[i] { return s } else { return nil }\n        }\n        func int(_ i: Int) throws -> Int64 {\n            if case .int(let v) = row[i] { return v }\n            throw bad(\"cột \\(i)\")\n        }\n        func date(_ i: Int) throws -> Date {\n            switch row[i] {\n            case .real(let v): return Date(timeIntervalSince1970: v)\n            case .int(let v): return Date(timeIntervalSince1970: Double(v))\n            default: throw bad(\"cột \\(i)\")\n            }\n        }\n        guard row.count == 38, let id = UUID(uuidString: try text(0)),\n            let env = HostEnvironment(rawValue: try text(3)),\n            let mode = HostConnectionMode(rawValue: try text(7)),\n            let auth = HostAuthMethod(rawValue: try text(11)),\n            let kind = HostKind(rawValue: try text(23)),\n            let screen = RDPScreenMode(rawValue: try text(27))\n        else { throw bad(\"giá trị\") }\n        let tags = try? JSONDecoder().decode([String].self, from: Data(try text(4).utf8))\n        let marks = try? JSONDecoder().decode(\n            [RemoteBookmark].self, from: Data(try text(17).utf8))\n        guard let tags, let marks else { throw bad(\"JSON\") }\n        var launch: Date?\n        if case .null = row[22] {} else { launch = try date(22) }\n        return HostProfile(\n            id: id, displayName: try text(1), project: try text(2), environment: env, tags: tags,\n            notes: try text(5), isFavorite: try int(6) != 0, connectionMode: mode, kind: kind,\n            rdpUsername: try text(24), rdpDomain: optText(25), rdpGateway: optText(26),\n            rdpScreenMode: screen, rdpMultiMonitor: try int(28) != 0,\n            rdpRedirectClipboard: try int(29) != 0, rdpAdminSession: try int(30) != 0,\n            hostName: try text(8), port: Int(try int(9)), user: try text(10), authMethod: auth,\n            identityFile: optText(12), identityAgent: optText(31),\n            jumpHostID: optText(13).flatMap(UUID.init(uuidString:)),\n            sshConfigPath: optText(14), sshConfigAlias: optText(15),\n            credentialReference: optText(16), credentialSetID: optText(32).flatMap(UUID.init(uuidString:)),\n            autofillHold: try int(33) != 0, autofillHoldReason: optText(34),\n            sourceID: optText(35).flatMap(UUID.init(uuidString:)), externalID: optText(36),\n            sourceMissing: try int(37) != 0, remoteBookmarks: marks,\n            defaultLocalDirectory: try text(18), defaultRemoteDirectory: try text(19),\n            createdAt: try date(20), updatedAt: try date(21), lastLaunchRequestedAt: launch)\n    }\n}\n"}, "Sources/SSHDeskCore/Inventory/CSVReader.swift": {"group": "Core · Inventory", "text": "import Foundation\n\n/// Đọc CSV (ADR-026): UTF-8 (có/không BOM), UTF-16 LE có BOM; tự nhận `,` `;` tab; RFC 4180; ≤ 5 MB.\npublic enum CSVReader {\n    public static let maxBytes = 5 * 1_048_576\n    public static let maxColumns = 200\n    public static let maxRows = 5000\n\n    public static func read(\n        url: URL, headerRow: Int? = nil, maxBytes: Int = CSVReader.maxBytes, keepSecret: SecretColumnValues? = nil\n    ) throws -> TableWorkbook {\n        let url = url.resolvingSymlinksInPath().standardizedFileURL\n        let attrs: [FileAttributeKey: Any]\n        do { attrs = try FileManager.default.attributesOfItem(atPath: url.path) } catch {\n            throw SpreadsheetError.unreadable(error.localizedDescription)\n        }\n        guard (attrs[.type] as? FileAttributeType) == .typeRegular else { throw SpreadsheetError.notRegularFile }\n        guard let size = (attrs[.size] as? NSNumber)?.intValue, size <= maxBytes else {\n            throw SpreadsheetError.fileTooLarge(limitMB: max(1, maxBytes / 1_048_576))\n        }\n        let data: Data\n        do { data = try Data(contentsOf: url) } catch { throw SpreadsheetError.unreadable(error.localizedDescription) }\n        return try parse(data: data, name: \"CSV\", headerRow: headerRow, maxBytes: maxBytes, keepSecret: keepSecret)\n    }\n\n    public static func parse(\n        data: Data, name: String = \"CSV\", headerRow: Int? = nil, maxBytes: Int = CSVReader.maxBytes,\n        keepSecret: SecretColumnValues? = nil\n    ) throws -> TableWorkbook {\n        guard data.count <= maxBytes else {\n            throw SpreadsheetError.fileTooLarge(limitMB: max(1, maxBytes / 1_048_576))\n        }\n        let text = try decode(data)\n        let records = try records(from: text)\n        var builder = TableBuilder()\n        for (i, cells) in records.enumerated() { builder.add(number: i + 1, cells: cells) }\n        guard builder.nonEmptyRows > 0 else { throw SpreadsheetError.emptyFile }\n        if builder.nonEmptyRows > maxRows + 100 { throw SpreadsheetError.tooManyRows(limit: maxRows) }\n        return TableWorkbook(sheets: [builder.finish(name: name, headerRow: headerRow, keep: keepSecret)])\n    }\n\n    static func decode(_ data: Data) throws -> String {\n        let bytes = [UInt8](data.prefix(3))\n        if bytes.count >= 3, bytes[0] == 0xEF, bytes[1] == 0xBB, bytes[2] == 0xBF {\n            guard let s = String(data: data.dropFirst(3), encoding: .utf8) else {\n                throw SpreadsheetError.unsupportedEncoding\n            }\n            return s\n        }\n        if bytes.count >= 2, bytes[0] == 0xFF, bytes[1] == 0xFE {\n            let body = data.dropFirst(2)\n            guard body.count % 2 == 0, let s = String(data: body, encoding: .utf16LittleEndian) else {\n                throw SpreadsheetError.unsupportedEncoding\n            }\n            return s\n        }\n        if bytes.count >= 2, bytes[0] == 0xFE, bytes[1] == 0xFF { throw SpreadsheetError.unsupportedEncoding }\n        guard let s = String(data: data, encoding: .utf8), !s.unicodeScalars.contains(where: { $0.value == 0 }) else {\n            throw SpreadsheetError.unsupportedEncoding\n        }\n        return s\n    }\n\n    /// Dấu phân cách theo dòng không rỗng đầu tiên: ký tự nhiều nhất ngoài dấu nháy trong `, ; \\t`.\n    static func detectDelimiter(_ scalars: [Unicode.Scalar]) -> Unicode.Scalar {\n        var counts: [Unicode.Scalar: Int] = [\",\": 0, \";\": 0, \"\\t\": 0]\n        var inQuotes = false\n        var seenContent = false\n        for c in scalars {\n            if c == \"\\\"\" {\n                inQuotes.toggle()\n                seenContent = true\n                continue\n            }\n            if inQuotes { continue }\n            if c == \"\\n\" || c == \"\\r\" {\n                if seenContent { break }\n                continue\n            }\n            seenContent = true\n            if counts[c] != nil { counts[c]! += 1 }\n        }\n        let best = counts.max { a, b in a.value == b.value ? order(a.key) > order(b.key) : a.value < b.value }\n        return (best?.value ?? 0) > 0 ? best!.key : \",\"\n    }\n\n    private static func order(_ c: Unicode.Scalar) -> Int { c == \",\" ? 0 : (c == \";\" ? 1 : 2) }\n\n    /// RFC 4180: trường có thể được bọc `\"`, `\"\"` là dấu nháy, xuống dòng được phép trong trường có nháy.\n    static func records(from text: String) throws -> [[String]] {\n        let scalars = Array(text.unicodeScalars)\n        let delimiter = detectDelimiter(scalars)\n        var rows: [[String]] = []\n        var row: [String] = []\n        var field = String.UnicodeScalarView()\n        var inQuotes = false\n        var fieldWasQuoted = false\n        var i = 0\n\n        func endField() throws {\n            row.append(String(field))\n            if row.count > maxColumns { throw SpreadsheetError.tooManyColumns(limit: maxColumns) }\n            field = String.UnicodeScalarView()\n            fieldWasQuoted = false\n        }\n        func endRow() throws {\n            try endField()\n            rows.append(row)\n            row = []\n        }\n\n        while i < scalars.count {\n            let c = scalars[i]\n            if inQuotes {\n                if c == \"\\\"\" {\n                    if i + 1 < scalars.count, scalars[i + 1] == \"\\\"\" {\n                        field.append(\"\\\"\")\n                        i += 1\n                    } else {\n                        inQuotes = false\n                    }\n                } else {\n                    field.append(c)\n                }\n            } else if c == \"\\\"\" && field.isEmpty && !fieldWasQuoted {\n                inQuotes = true\n                fieldWasQuoted = true\n            } else if c == delimiter {\n                try endField()\n            } else if c == \"\\n\" || c == \"\\r\" {\n                if c == \"\\r\", i + 1 < scalars.count, scalars[i + 1] == \"\\n\" { i += 1 }\n                try endRow()\n            } else {\n                field.append(c)\n            }\n            i += 1\n        }\n        if !field.isEmpty || !row.isEmpty || fieldWasQuoted { try endRow() }\n        return rows\n    }\n}\n"}, "Sources/SSHDeskCore/Inventory/ColumnMapping.swift": {"group": "Core · Inventory", "text": "import Foundation\n\npublic enum ColumnMappingError: Error, Equatable, CustomStringConvertible {\n    /// Cột giống mật khẩu không ghép được vào bất kỳ trường nào (kể cả ghi chú) — ADR-026.\n    case passwordColumn(header: String)\n\n    public var description: String {\n        switch self {\n        case .passwordColumn(let h):\n            return\n                \"Cột “\\(h)” giống cột mật khẩu — không thể ghép vào trường nào. SSH Desk không nhập mật khẩu từ file.\"\n        }\n    }\n}\n\n/// Cách ghép cột lưu trong `config_json` của nguồn: theo **văn bản tiêu đề** (không theo chỉ số cột).\npublic struct TableMapping: Codable, Equatable, Sendable {\n    /// Tên sheet (nil với CSV).\n    public var sheet: String?\n    /// Dòng tiêu đề (số dòng Excel, từ 1).\n    public var headerRow: Int\n    /// `InventoryField.rawValue` -> văn bản tiêu đề của cột.\n    public var columns: [String: String]\n    /// Trường dùng làm cột khoá (`external_id`); mặc định Tên.\n    public var keyField: InventoryField\n    /// Nhận ra là file mẫu của SSH Desk: kiểm tra chặt (môi trường/loại).\n    public var isTemplate: Bool\n\n    public init(\n        sheet: String? = nil, headerRow: Int = 1, columns: [String: String] = [:], keyField: InventoryField = .name,\n        isTemplate: Bool = false\n    ) {\n        self.sheet = sheet\n        self.headerRow = headerRow\n        self.columns = columns\n        self.keyField = keyField\n        self.isTemplate = isTemplate\n    }\n\n    public func header(for field: InventoryField) -> String? { columns[field.rawValue] }\n\n    /// Ghép (hoặc bỏ ghép, `header == nil`) một trường. **Cột giống mật khẩu bị chặn ở mọi trường.**\n    public mutating func set(_ field: InventoryField, header: String?) throws {\n        guard let header, !header.trimmingCharacters(in: .whitespaces).isEmpty else {\n            columns[field.rawValue] = nil\n            return\n        }\n        if PasswordHeader.matches(header) { throw ColumnMappingError.passwordColumn(header: header) }\n        columns[field.rawValue] = header\n    }\n\n    /// Kết quả đối chiếu với tiêu đề thật của sheet.\n    public struct Resolved: Equatable, Sendable {\n        public var columns: [InventoryField: Int]\n        /// Trường đã ghép nhưng tiêu đề không còn trong sheet (tiêu đề đổi) — cần mở lại màn ghép.\n        public var missing: [InventoryField: String]\n        /// Trường bị chặn vì tiêu đề giống mật khẩu.\n        public var blocked: [InventoryField: String]\n\n        public var needsRemap: Bool { !missing.isEmpty || columns[.hostName] == nil }\n    }\n\n    public func resolve(in sheet: TableSheet) -> Resolved {\n        let header = sheet.rows.first { $0.number == headerRow }?.cells ?? []\n        var index: [String: Int] = [:]\n        for (i, text) in header.enumerated() {\n            let key = HeaderText.normalize(text)\n            if !key.isEmpty, index[key] == nil { index[key] = i }\n        }\n        var result = Resolved(columns: [:], missing: [:], blocked: [:])\n        for field in InventoryField.allCases {\n            guard let text = columns[field.rawValue] else { continue }\n            if PasswordHeader.matches(text) {\n                result.blocked[field] = text\n                continue\n            }\n            if let i = index[HeaderText.normalize(text)] {\n                if sheet.passwordColumns[i] != nil {\n                    result.blocked[field] = text\n                } else {\n                    result.columns[field] = i\n                }\n            } else {\n                result.missing[field] = text\n            }\n        }\n        return result\n    }\n\n    // MARK: - Đoán cột theo tiêu đề\n\n    private static let synonyms: [(InventoryField, [String])] = [\n        (\n            .hostName,\n            [\n                \"ip\", \"ip address\", \"ip hostname\", \"ip/hostname\", \"dia chi\", \"dia chi ip\", \"address\", \"host\",\n                \"hostname\", \"host name\", \"ip server\", \"server ip\",\n            ]\n        ),\n        (\n            .name,\n            [\n                \"ten\", \"ten server\", \"ten may chu\", \"ten may\", \"server name\", \"name\", \"display name\", \"ten hien thi\",\n                \"host name label\",\n            ]\n        ),\n        (.port, [\"port\", \"cong\", \"ssh port\"]),\n        (.user, [\"user\", \"username\", \"user name\", \"tai khoan\", \"login\", \"nguoi dung\", \"ten dang nhap\"]),\n        (.environment, [\"moi truong\", \"env\", \"environment\"]),\n        (.folder, [\"du an\", \"project\", \"thu muc\", \"nhom\", \"folder\", \"group\", \"thu muc du an\", \"thu muc/du
