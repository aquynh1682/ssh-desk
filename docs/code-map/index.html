an\"]),\n        (.notes, [\"ghi chu\", \"mo ta\", \"note\", \"notes\", \"description\", \"comment\"]),\n        (.kind, [\"loai\", \"kind\", \"type\", \"loai may\"]),\n        (.jumpHost, [\"jump host\", \"jumphost\", \"jump\", \"bastion\"]),\n        (.credentialSet, [\"bo dang nhap\", \"credential set\", \"credential\", \"credentials\"]),\n    ]\n\n    private static func score(tokens: [String], synonym: String) -> Int {\n        let syn = HeaderText.tokens(HeaderText.normalize(synonym))\n        guard !syn.isEmpty, tokens.count >= syn.count else { return 0 }\n        if tokens == syn { return 100 + syn.count * 10 }\n        for start in 0...(tokens.count - syn.count) where Array(tokens[start..<(start + syn.count)]) == syn {\n            return syn.count * 10\n        }\n        return 0\n    }\n\n    /// Đoán ghép cột theo tiêu đề (tiếng Việt có/không dấu + tiếng Anh). Cột giống mật khẩu bị loại.\n    /// Cột khoá mặc định: Tên; không có cột tên → IP/Hostname.\n    public static func guess(\n        sheet: TableSheet, restrictTo fields: [InventoryField] = InventoryField.allCases\n    ) -> TableMapping {\n        let header = sheet.rows.first { $0.number == sheet.headerRow }?.cells ?? []\n        var candidates: [(col: Int, field: InventoryField, score: Int)] = []\n        for (i, text) in header.enumerated() {\n            if PasswordHeader.matches(text) || sheet.passwordColumns[i] != nil { continue }\n            let tokens = HeaderText.tokens(HeaderText.normalize(text))\n            if tokens.isEmpty { continue }\n            for (field, list) in synonyms where fields.contains(field) {\n                let best = list.map { score(tokens: tokens, synonym: $0) }.max() ?? 0\n                if best > 0 { candidates.append((i, field, best)) }\n            }\n        }\n        candidates.sort { a, b in\n            if a.score != b.score { return a.score > b.score }\n            if a.col != b.col { return a.col < b.col }\n            return InventoryField.allCases.firstIndex(of: a.field)! < InventoryField.allCases.firstIndex(of: b.field)!\n        }\n        var usedColumns = Set<Int>()\n        var usedFields = Set<InventoryField>()\n        var mapping = TableMapping(sheet: sheet.name, headerRow: sheet.headerRow)\n        for c in candidates where !usedColumns.contains(c.col) && !usedFields.contains(c.field) {\n            usedColumns.insert(c.col)\n            usedFields.insert(c.field)\n            mapping.columns[c.field.rawValue] = header[c.col].trimmingCharacters(in: .whitespacesAndNewlines)\n        }\n        mapping.keyField = mapping.columns[InventoryField.name.rawValue] != nil ? .name : .hostName\n        return mapping\n    }\n}\n\n/// Định dạng file Excel mẫu (ADR-026): tiêu đề cố định và dấu phiên bản.\npublic enum InventoryTemplateFormat {\n    public static let versionMarker = \"sshdesk-template v1\"\n    public static let dataSheetName = \"Máy chủ\"\n    public static let guideSheetName = \"Hướng dẫn\"\n    /// Thứ tự cột cố định, khớp `InventoryField`.\n    public static let columns: [InventoryField] = [\n        .name, .hostName, .port, .user, .environment, .folder, .kind, .jumpHost, .credentialSet, .notes,\n    ]\n    public static var headers: [String] { columns.map(\\.title) }\n\n    /// Nhận ra file mẫu: dòng 1 của một sheet khớp đúng bộ tiêu đề (không phân biệt hoa thường/khoảng trắng thừa)\n    /// hoặc có dấu phiên bản ở A1 của một sheet. Trả sheet dữ liệu và cách ghép cố định (khoá = Tên).\n    public static func recognize(_ workbook: TableWorkbook) -> (sheet: TableSheet, mapping: TableMapping)? {\n        let wanted = headers.map(HeaderText.normalize)\n        func firstRow(_ s: TableSheet) -> TableRow? { s.rows.first { $0.number == 1 } }\n        func exact(_ s: TableSheet) -> Bool {\n            guard let r = firstRow(s) else { return false }\n            return r.cells.map(HeaderText.normalize).filter { !$0.isEmpty } == wanted\n        }\n        func mapping(for s: TableSheet) -> TableMapping? {\n            guard let r = firstRow(s) else { return nil }\n            var m = TableMapping(sheet: s.name, headerRow: 1, keyField: .name, isTemplate: true)\n            for (field, title) in zip(columns, headers) {\n                if let found = r.cells.first(where: { HeaderText.normalize($0) == HeaderText.normalize(title) }) {\n                    m.columns[field.rawValue] = found.trimmingCharacters(in: .whitespacesAndNewlines)\n                }\n            }\n            guard m.columns[InventoryField.name.rawValue] != nil, m.columns[InventoryField.hostName.rawValue] != nil\n            else { return nil }\n            return m\n        }\n        if let s = workbook.sheets.first(where: exact), let m = mapping(for: s) { return (s, m) }\n        let marked = workbook.sheets.contains {\n            firstRow($0)?.cells.first?.trimmingCharacters(in: .whitespacesAndNewlines) == versionMarker\n        }\n        if marked {\n            let candidate =\n                workbook.sheets.first { HeaderText.normalize($0.name) == HeaderText.normalize(dataSheetName) }\n                ?? workbook.sheets.first { firstRow($0)?.cells.first != versionMarker }\n            if let s = candidate, let m = mapping(for: s) { return (s, m) }\n        }\n        return nil\n    }\n}\n"}, "Sources/SSHDeskCore/Inventory/InventoryAutoAdd.swift": {"group": "Core · Inventory", "text": "import Foundation\n\n// ADR-026b: tự áp dụng khi nguồn chỉ có máy mới + Hoàn tác.\n\nextension InventorySource {\n    /// Khoá trong `config_json`. Thiếu khoá = bật (mặc định).\n    static let autoAddKey = \"autoAddNew\"\n\n    /// Nguồn có được tự thêm máy mới khi file đổi không (mặc định bật khi thiếu khoá hoặc config hỏng).\n    public var autoAddNew: Bool {\n        guard let data = configJSON.data(using: .utf8),\n            let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any],\n            let flag = obj[Self.autoAddKey] as? Bool\n        else { return true }\n        return flag\n    }\n\n    /// `configJSON` mới với cờ tự thêm; giữ nguyên mọi khoá khác (vd. ghép cột).\n    public static func configJSON(_ json: String, settingAutoAddNew value: Bool) -> String {\n        var obj: [String: Any] = [:]\n        if let data = json.data(using: .utf8),\n            let parsed = try? JSONSerialization.jsonObject(with: data) as? [String: Any]\n        {\n            obj = parsed\n        }\n        obj[autoAddKey] = value\n        guard let out = try? JSONSerialization.data(withJSONObject: obj, options: [.sortedKeys]) else { return json }\n        return String(decoding: out, as: UTF8.self)\n    }\n\n    /// Cờ tự thêm đã ghi tường minh trong `json` (nil = chưa ghi).\n    static func explicitAutoAdd(in json: String) -> Bool? {\n        guard let data = json.data(using: .utf8),\n            let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any]\n        else { return nil }\n        return obj[autoAddKey] as? Bool\n    }\n}\n\nextension InventorySync {\n    /// Kế hoạch **chỉ có thêm mới** và đủ sạch để tự áp dụng không cần người xem (ADR-026b).\n    /// Đúng khi: có nguồn, có ít nhất một máy mới, và KHÔNG có bất kỳ điều nào sau (nghi ngờ thì chặn):\n    /// - cập nhật máy đã có (`updates`), kể cả \"có lại trong nguồn\";\n    /// - máy \"không còn trong nguồn\" (`missing`);\n    /// - mọi `issues` (lỗi dòng, và cả cảnh báo dòng: jump host không thấy/trùng tên/vòng/là Windows/trỏ chính nó,\n    ///   trùng tên host ngoài nguồn, cột bí mật bị bỏ...);\n    /// - mọi `warnings` chung (cột mật khẩu bị bỏ qua, biến mật khẩu Ansible, nguồn rỗng, thiếu ansible_user...);\n    /// - bộ đăng nhập chưa tồn tại phải tạo mới (`setsToCreate`).\n    public static func isAdditionsOnly(_ plan: InventorySyncPlan) -> Bool {\n        plan.source != nil && !plan.additions.isEmpty && plan.updates.isEmpty && plan.missing.isEmpty\n            && plan.issues.isEmpty && plan.warnings.isEmpty && plan.setsToCreate.isEmpty\n    }\n}\n\n/// Ghi nhận lần tự thêm gần nhất (chỉ trong phiên chạy app) để Hoàn tác. Không chứa secret.\npublic struct InventoryAutoAddRecord: Sendable, Equatable {\n    public var sourceID: UUID\n    public var sourceName: String\n    public var hostIDs: [UUID]\n    /// `updatedAt` của các host lúc thêm; khác đi = host đã bị sửa.\n    public var stamp: Date\n\n    public init(plan: InventorySyncPlan) {\n        sourceID = plan.source?.id ?? UUID()\n        sourceName = plan.source?.name ?? \"\"\n        hostIDs = plan.additions.map(\\.id)\n        stamp = plan.syncedAt\n    }\n}\n\npublic struct InventoryUndoOutcome: Sendable, Equatable {\n    public var removed: [UUID] = []\n    /// Giữ vì đã bị sửa / có mật khẩu riêng / có port forward / là jump host của host khác / đã tách nguồn.\n    public var kept: [UUID] = []\n    /// Đã bị xoá từ trước (không phải do Hoàn tác).\n    public var alreadyGone = 0\n}\n\nextension HostRepository {\n    /// Bật/tắt \"Tự thêm máy mới\" của nguồn (chỉ đổi cờ trong config_json).\n    public func setInventoryAutoAdd(sourceID: UUID, enabled: Bool) throws {\n        try db.transaction {\n            guard var s = try inventorySource(id: sourceID) else { throw InventoryError.sourceNotFound(sourceID) }\n            s.configJSON = InventorySource.configJSON(s.configJSON, settingAutoAddNew: enabled)\n            try Self.writeSource(db, s, insert: false)\n        }\n    }\n\n    /// Hoàn tác lần tự thêm trong MỘT transaction: xoá các host vừa thêm chỉ khi còn nguyên (updatedAt không đổi,\n    /// vẫn thuộc nguồn, không mật khẩu riêng, không port forward, không là jump host của host nằm ngoài tập xoá),\n    /// rồi tắt \"Tự thêm máy mới\" của nguồn (nếu nguồn còn).\n    public func undoAutoAdd(_ record: InventoryAutoAddRecord) throws -> InventoryUndoOutcome {\n        try db.transaction {\n            var outcome = InventoryUndoOutcome()\n            var candidates: [UUID: HostProfile] = [:]\n            for id in record.hostIDs {\n                guard let h = try host(id: id) else {\n                    outcome.alreadyGone += 1\n                    continue\n                }\n                let untouched = abs(h.updatedAt.timeIntervalSince(record.stamp)) < 0.001\n                let own = h.sourceID == record.sourceID && untouched && !h.hasOwnPassword\n                let forwards = try db.query(\n                    \"SELECT COUNT(*) FROM port_forwards WHERE host_id = ?\", [.text(id.uuidString)])\n                var hasForward = true\n                if case .int(let n)? = forwards.first?.first { hasForward = n > 0 }\n                if own && !hasForward { candidates[id] = h } else { outcome.kept.append(id) }\n            }\n            // Host ngoài tập xoá đang dùng làm jump -> giữ; lặp tới khi ổn định (giữ một host có thể kéo theo host khác).\n            let all = try self.all()\n            var changed = true\n            while changed {\n                changed = false\n                for other in all {\n                    guard let j = other.jumpHostID, candidates[j] != nil, candidates[other.id] == nil else { continue }\n                    candidates[j] = nil\n                    outcome.kept.append(j)\n                    changed = true\n                }\n            }\n            // Xoá máy dùng jump trước, bastion sau (khoá ngoại jump_host_id).\n            var remaining = Set(candidates.keys)\n            while !remaining.isEmpty {\n                let usedByRemaining = Set(remaining.compactMap { candidates[$0]?.jumpHostID })\n                let leaves = remaining.filter { !usedByRemaining.contains($0) }\n                if leaves.isEmpty { throw InventoryError.jumpCycle(\"\") }\n                for id in record.hostIDs where leaves.contains(id) {\n                    try db.execute(\"DELETE FROM hosts WHERE id = ?\", [.text(id.uuidString)])\n                    outcome.removed.append(id)\n                }\n                remaining.subtract(leaves)\n            }\n            if var s = try inventorySource(id: record.sourceID) {\n                s.configJSON = InventorySource.configJSON(s.configJSON, settingAutoAddNew: false)\n                try Self.writeSource(db, s, insert: false)\n            }\n            return outcome\n        }\n    }\n}\n"}, "Sources/SSHDeskCore/Inventory/InventoryFile.swift": {"group": "Core · Inventory", "text": "import CryptoKit\nimport Foundation\n\n/// Đọc nguồn dạng bảng (Excel/CSV), vân tay file và phát hiện thay đổi (ADR-026).\npublic enum InventoryFile {\n    public struct Loaded: Sendable {\n        public var url: URL\n        public var kind: InventorySourceKind\n        public var workbook: TableWorkbook\n        public var fingerprint: String\n        /// Nhận ra là file mẫu của SSH Desk -> bỏ qua bước ghép cột.\n        public var template: (sheet: TableSheet, mapping: TableMapping)?\n        /// Giá trị cột mật khẩu được giữ (ADR-031); nil = không giữ. Không nằm trong `workbook`.\n        public var secrets: SecretColumnValues?\n    }\n\n    public static func kind(for url: URL) -> InventorySourceKind? {\n        switch url.pathExtension.lowercased() {\n        case \"xlsx\": return .excel\n        case \"csv\", \"tsv\", \"txt\": return .csv\n        default: return nil\n        }\n    }\n\n    /// Đọc file (chỉ `.xlsx` / `.csv`). `headerRow` nil = tự đoán từng sheet.\n    public static func load(\n        url: URL, headerRow: Int? = nil, xlsxLimits: XLSXLimits = XLSXLimits(), keepSecretColumn: String? = nil\n    ) throws -> Loaded {\n        guard let kind = kind(for: url) else {\n            throw SpreadsheetError.unsupportedExtension(\".\" + url.pathExtension.lowercased())\n        }\n        let fingerprint = try fingerprint(of: url, kind: kind)\n        let workbook: TableWorkbook\n        let secrets = keepSecretColumn.map { SecretColumnValues(title: $0) }\n        do {\n            switch kind {\n            case .excel:\n                workbook = try XLSXReader.read(url: url, headerRow: headerRow, limits: xlsxLimits, keepSecret: secrets)\n            default: workbook = try CSVReader.read(url: url, headerRow: headerRow, keepSecret: secrets)\n            }\n        } catch {\n            secrets?.wipe()\n            throw error\n        }\n        let template = kind == .excel ? InventoryTemplateFormat.recognize(workbook) : nil\n        return Loaded(\n            url: url, kind: kind, workbook: workbook, fingerprint: fingerprint, template: template,\n            secrets: secrets)\n    }\n\n    // MARK: - Vân tay\n\n    public static func sizeLimit(for kind: InventorySourceKind) -> Int {\n        kind == .excel ? XLSXLimits().maxFileBytes : CSVReader.maxBytes\n    }\n\n    /// `sha256hex|mtime(ms)|size`.\n    public static func fingerprint(of url: URL, kind: InventorySourceKind) throws -> String {\n        let resolved = url.resolvingSymlinksInPath()\n        let attrs: [FileAttributeKey: Any]\n        do { attrs = try FileManager.default.attributesOfItem(atPath: resolved.path) } catch {\n            throw SpreadsheetError.unreadable(error.localizedDescription)\n        }\n        guard (attrs[.type] as? FileAttributeType) == .typeRegular else { throw SpreadsheetError.notRegularFile }\n        guard let size = (attrs[.size] as? NSNumber)?.intValue, size <= sizeLimit(for: kind) else {\n            throw SpreadsheetError.fileTooLarge(limitMB: sizeLimit(for: kind) / 1_048_576)\n        }\n        let data: Data\n        do { data = try Data(contentsOf: resolved) } catch {\n            throw SpreadsheetError.unreadable(error.localizedDescription)\n        }\n        let hash = SHA256.hash(data: data).map { String(format: \"%02x\", $0) }.joined()\n        let mtime = (attrs[.modificationDate] as? Date)?.timeIntervalSince1970 ?? 0\n        return \"\\(hash)|\\(Int(mtime * 1000))|\\(size)\"\n    }\n\n    public enum Change: Sendable, Equatable {\n        case unchanged\n        case changed\n        case fileMissing\n        case unreadable(String)\n    }\n\n    /// So file hiện tại với vân tay đã lưu: mtime giống -> không đổi; mtime khác thì so SHA-256.\n    public static func detectChange(path: String, kind: InventorySourceKind, lastFingerprint: String?) -> Change {\n        let url = URL(fileURLWithPath: path)\n        guard FileManager.default.fileExists(atPath: url.path) else { return .fileMissing }\n        guard let last = lastFingerprint else { return .changed }\n        let parts = last.split(separator: \"|\", omittingEmptySubsequences: false)\n        guard parts.count == 3, let storedMTime = Int(parts[1]), let storedSize = Int(parts[2]) else { return .changed }\n        if let attrs = try? FileManager.default.attributesOfItem(atPath: url.resolvingSymlinksInPath().path),\n            let m = attrs[.modificationDate] as? Date, Int(m.timeIntervalSince1970 * 1000) == storedMTime,\n            (attrs[.size] as? NSNumber)?.intValue == storedSize\n        {\n            return .unchanged\n        }\n        do {\n            let now = try fingerprint(of: url, kind: kind)\n            return now.split(separator: \"|\").first == parts[0] ? .unchanged : .changed\n        } catch { return .unreadable(\"\\(error)\") }\n    }\n\n    // MARK: - Từ file tới kế hoạch\n\n    /// Sheet theo cách ghép (hoặc sheet nhận ra là mẫu / sheet đầu).\n    public static func sheet(in workbook: TableWorkbook, for mapping: TableMapping) -> TableSheet? {\n        if let name = mapping.sheet, let s = workbook.sheets.first(where: { $0.name == name }) { return s }\n        return mapping.sheet == nil ? workbook.sheets.first : nil\n    }\n\n    public struct Parsed: Sendable {\n        public var sheet: TableSheet\n        public var mapping: TableMapping\n        public var result: InventoryParseResult\n    }\n\n    /// Parse bảng theo cách ghép. File mẫu luôn dùng cách ghép cố định của mẫu.\n    public static func parse(_ loaded: Loaded, mapping: TableMapping?) throws -> Parsed? {\n        if let t = loaded.template, mapping == nil || mapping?.isTemplate == true {\n            return Parsed(\n                sheet: t.sheet, mapping: t.mapping,\n                result: try InventoryTableParser.parse(sheet: t.sheet, mapping: t.mapping))\n        }\n        guard let mapping, let sheet = sheet(in: loaded.workbook, for: mapping) else { return nil }\n        return Parsed(\n            sheet: sheet, mapping: mapping, result: try InventoryTableParser.parse(sheet: sheet, mapping: mapping))\n    }\n\n    public enum Resync: Sendable {\n        case ready(Loaded, InventorySyncPlan)\n        /// Tiêu đề đổi / thiếu cột bắt buộc: mở lại màn ghép cột với gợi ý.\n        case needsRemap(Loaded, sheet: TableSheet, suggested: TableMapping, reason: String)\n    }\n\n    /// \"Đồng bộ lại\" / \"Xem trước\" một nguồn bảng đã lưu (đọc file, kiểm tiêu đề, dựng kế hoạch).\n    public static func resync(\n        source: InventorySource, pathOverride: URL? = nil, existingHosts: [HostProfile],\n        credentialSets: [CredentialSet], xlsxLimits: XLSXLimits = XLSXLimits(), now: Date = Date()\n    ) throws -> Resync {\n        let url = pathOverride ?? URL(fileURLWithPath: source.path)\n        let saved = source.tableMapping\n        let loaded = try load(url: url, headerRow: saved?.headerRow, xlsxLimits: xlsxLimits)\n        var src = source\n        src.path = url.path\n        if let t = loaded.template {\n            return .ready(\n                loaded,\n                try plan(\n                    source: src, loaded: loaded,\n                    parsed: Parsed(\n                        sheet: t.sheet, mapping: t.mapping,\n                        result: try InventoryTableParser.parse(sheet: t.sheet, mapping: t.mapping)),\n                    existingHosts: existingHosts, credentialSets: credentialSets, now: now))\n        }\n        guard let saved, let sheet = sheet(in: loaded.workbook, for: saved) else {\n            let first = loaded.workbook.sheets[0]\n            return .needsRemap(\n                loaded, sheet: first,\n                suggested: TableMapping.guess(sheet: first, restrictTo: InventoryField.freeMappingFields),\n                reason: \"Không thấy sheet “\\(saved?.sheet ?? \"\")”.\")\n        }\n        let resolved = saved.resolve(in: sheet)\n        if resolved.needsRemap {\n            let titles = resolved.missing.values.sorted().joined(separator: \", \")\n            return .needsRemap(\n                loaded, sheet: sheet,\n                suggested: TableMapping.guess(sheet: sheet, restrictTo: InventoryField.freeMappingFields),\n                reason: resolved.missing.isEmpty ? \"Chưa ghép cột IP/Hostname.\" : \"Tiêu đề đã đổi: \\(titles).\")\n        }\n        let parsed = Parsed(\n            sheet: sheet, mapping: saved, result: try InventoryTableParser.parse(sheet: sheet, mapping: saved))\n        return .ready(\n            loaded,\n            try plan(\n                source: src, loaded: loaded, parsed: parsed, existingHosts: existingHosts,\n                credentialSets: credentialSets, now: now))\n    }\n\n    /// Dựng kế hoạch đồng bộ từ kết quả parse. `source` (đã gắn cách ghép) sẽ được lưu cùng transaction khi áp dụng;\n    /// nil = nhập một lần.\n    public static func plan(\n        source: InventorySource?, loaded: Loaded, parsed: Parsed, existingHosts: [HostProfile],\n        credentialSets: [CredentialSet], now: Date = Date()\n    ) throws -> InventorySyncPlan {\n        var src = source\n        let existing = src?.configJSON ?? \"{}\"\n        src?.configJSON = InventorySource.encodeConfig(parsed.mapping, preserving: existing)\n        return try InventorySync.plan(\n            source: src, records: parsed.result.records, issues: parsed.result.issues,\n            warnings: parsed.result.warnings + loaded.workbook.warnings, failedKeys: parsed.result.failedKeys,\n            managesJump: parsed.result.managedFields.contains(.jumpHost), existingHosts: existingHosts,\n            credentialSets: credentialSets, fingerprint: loaded.fingerprint, now: now)\n    }\n}\n"}, "Sources/SSHDeskCore/Inventory/InventoryRepository.swift": {"group": "Core · Inventory", "text": "import Foundation\n\n/// Nguồn máy chủ + áp dụng kế hoạch đồng bộ trong cùng actor với host để mọi thay đổi là một transaction (ADR-026).\nextension HostRepository {\n    static let sourceColumns =\n        \"id, name, kind, path, folder, default_environment, config_json, last_synced_at, last_fingerprint\"\n\n    // MARK: - Đọc\n\n    public func inventorySources() throws -> [InventorySource] {\n        try db.query(\"SELECT \\(Self.sourceColumns) FROM inventory_sources ORDER BY name COLLATE NOCASE, id\")\n            .map(Self.decodeSource)\n    }\n\n    public func inventorySource(id: UUID) throws -> InventorySource? {\n        try db.query(\n            \"SELECT \\(Self.sourceColumns) FROM inventory_sources WHERE id = ?\", [.text(id.uuidString)]\n        ).first.map(Self.decodeSource)\n    }\n\n    /// Số host của mỗi nguồn / số host đang \"không còn trong nguồn\".\n    public func inventorySourceUsage() throws -> [UUID: (hosts: Int, missing: Int)] {\n        var result: [UUID: (Int, Int)] = [:]\n        let rows = try db.query(\n            \"SELECT source_id, COUNT(*), SUM(source_missing) FROM hosts WHERE source_id IS NOT NULL GROUP BY source_id\")\n        for row in rows {\n            if case .text(let s) = row[0], let id = UUID(uuidString: s), case .int(let n) = row[1] {\n                var m = 0\n                if case .int(let v) = row[2] { m = Int(v) }\n                result[id] = (Int(n), m)\n            }\n        }\n        return result\n    }\n\n    // MARK: - Ghi nguồn\n\n    /// Đổi tên/đường dẫn/ghép cột... của nguồn đã có (không đụng host).\n    public func updateInventorySource(_ source: InventorySource) throws {\n        let source = try Self.validatedSource(source)\n        try db.transaction {\n            guard try inventorySource(id: source.id) != nil else { throw InventoryError.sourceNotFound(source.id) }\n            try Self.writeSource(db, source, insert: false)\n        }\n    }\n\n    /// Xoá nguồn: gỡ `source_id`/`external_id`/`source_missing` khỏi host (KHÔNG xoá host) rồi xoá nguồn.\n    /// Trả số host đã gỡ.\n    @discardableResult\n    public func deleteInventorySource(id: UUID) throws -> Int {\n        try db.transaction {\n            guard try inventorySource(id: id) != nil else { throw InventoryError.sourceNotFound(id) }\n            let n = try db.query(\"SELECT COUNT(*) FROM hosts WHERE source_id = ?\", [.text(id.uuidString)])\n            try db.execute(\n                \"UPDATE hosts SET source_id = NULL, external_id = NULL, source_missing = 0, updated_at = ? WHERE source_id = ?\",\n                [.real(now().timeIntervalSince1970), .text(id.uuidString)])\n            try db.execute(\"DELETE FROM inventory_sources WHERE id = ?\", [.text(id.uuidString)])\n            if case .int(let c)? = n.first?.first { return Int(c) }\n            return 0\n        }\n    }\n\n    /// \"Tách khỏi nguồn\": host thành máy tạo tay, giữ nguyên mọi giá trị.\n    public func detachFromSource(hostID: UUID) throws {\n        try db.transaction {\n            guard try self.host(id: hostID) != nil else { throw HostRepositoryError.notFound(hostID) }\n            try db.execute(\n                \"UPDATE hosts SET source_id = NULL, external_id = NULL, source_missing = 0, updated_at = ? WHERE id = ?\",\n                [.real(now().timeIntervalSince1970), .text(hostID.uuidString)])\n        }\n    }\n\n    // MARK: - Áp dụng đồng bộ\n\n    /// Áp dụng kế hoạch trong MỘT transaction: lưu/cập nhật nguồn, thêm host (jump trước), đổi trường do nguồn quản lý,\n    /// đặt `autofill_hold`, đánh `source_missing` (không xoá host). Bất kỳ lỗi nào -> không ghi gì.\n    /// Chỉ ghi trường do nguồn quản lý: ghi chú (khi không ghép), yêu thích, forward, mật khẩu riêng,\n    /// auth, IdentityFile, IdentityAgent, bookmark của host đã có luôn giữ nguyên.\n    public func applyInventory(_ plan: InventorySyncPlan) throws {\n        try db.transaction {\n            let stamp = plan.syncedAt\n            if var source = plan.source {\n                source = try Self.validatedSource(source)\n                source.lastSyncedAt = stamp\n                source.lastFingerprint = plan.fingerprint ?? source.lastFingerprint\n                let exists = try inventorySource(id: source.id) != nil\n                try Self.writeSource(db, source, insert: !exists)\n            }\n            for name in plan.setsToCreate { _ = try credentialSet(named: name, createIfMissing: true) }\n\n            // Thêm: jump host đã có/đã thêm trước.\n            var pending = plan.additions\n            var guardCount = pending.count + 1\n            while !pending.isEmpty, guardCount > 0 {\n                guardCount -= 1\n                var next: [InventorySyncPlan.Addition] = []\n                for add in pending {\n                    if let j = add.jumpHostID, !(try fetchExists(j)) {\n                        next.append(add)\n                        continue\n                    }\n                    try insertAddition(add, stamp: stamp)\n                }\n                if next.count == pending.count { throw InventoryError.jumpCycle(next[0].host.displayName) }\n                pending = next\n            }\n\n            for update in plan.updates { try applyUpdate(update, stamp: stamp) }\n\n            for m in plan.missing {\n                guard try fetchExists(m.hostID) else { continue }\n                try db.execute(\n                    \"UPDATE hosts SET source_missing = 1, updated_at = ? WHERE id = ?\",\n                    [.real(stamp.timeIntervalSince1970), .text(m.hostID.uuidString)])\n            }\n        }\n    }\n\n    private func insertAddition(_ add: InventorySyncPlan.Addition, stamp: Date) throws {\n        var h = add.host\n        h.createdAt = stamp\n        h.updatedAt = stamp\n        h.credentialSetID = nil\n        h.sourceMissing = false\n        h.autofillHold = false\n        h.autofillHoldReason = nil\n        if !h.project.isEmpty {\n            let name = try Self.normalizeFolder(h.project)\n            h.project = try matchingFolder(name, excluding: nil) ?? name\n        }\n        if let name = add.credentialSetName, let set = try credentialSet(named: name, createIfMissing: true) {\n            // Gán bộ đăng nhập từ nguồn -> hold tới khi người dùng xác nhận (chống chuyển password sang máy lạ).\n            h.credentialSetID = set.id\n            h.autofillHold = true\n            h.autofillHoldReason = \"Bộ đăng nhập \\(set.name) được gán từ nguồn\"\n        }\n        try h.validate(credentialSet: try credentialSet(for: h))\n        if try fetchExists(h.id) { throw HostRepositoryError.duplicateID(h.id) }\n        try checkJump(h)\n        try write(h, insert: true)\n    }\n\n    private func applyUpdate(_ u: InventorySyncPlan.Update, stamp: Date) throws {\n        guard let stored = try self.host(id: u.hostID) else { throw InventoryError.staleHost(u.hostID) }\n        var h = stored\n        let p = u.patch\n        if let v = p.displayName { h.displayName = v }\n        if let v = p.hostName { h.hostName = v }\n        if let v = p.port { h.port = v }\n        if let v = p.user {\n            if h.kind == .windowsRDP { h.rdpUsername = v } else { h.user = v }\n        }\n        if let v = p.environment { h.environment = v }\n        if let v = p.folder {\n            let name = try Self.normalizeFolder(v)\n            h.project = try matchingFolder(name, excluding: nil) ?? name\n        }\n        if p.setsJump { h.jumpHostID = p.jumpHostID }\n        if let name = p.credentialSetName, let set = try credentialSet(named: name, createIfMissing: true) {\n            h.credentialSetID = set.id\n        }\n        if let v = p.notes { h.notes = v }\n        if let v = p.tags { h.tags = v }\n        if u.restored { h.sourceMissing = false }\n        if let reason = u.holdReason {\n            h.autofillHold = true\n            if let old = stored.autofillHoldReason, stored.autofillHold, !old.isEmpty, !old.contains(reason) {\n                h.autofillHoldReason = String((old + \". \" + reason).suffix(InventorySync.maxHoldReasonLength))\n            } else {\n                h.autofillHoldReason = reason\n            }\n        }\n        h.updatedAt = stamp\n        try h.validate(credentialSet: try credentialSet(for: h))\n        try checkJump(h)\n        try keepFolder(stored.project, ifLeftBy: h.project)\n        try write(h, insert: false)\n    }\n\n    // MARK: - Nội bộ\n\n    private static func normalizeFolder(_ raw: String) throws -> String {\n        do { return try HostFolders.normalize(raw) } catch { throw InventoryError.invalidFolder(raw) }\n    }\n\n    static func validatedSource(_ source: InventorySource) throws -> InventorySource {\n        var s = source\n        s.name = s.name.trimmingCharacters(in: .whitespacesAndNewlines)\n        guard !s.name.isEmpty, s.name.count <= 100, !InventoryValidator.hasControl(s.name) else {\n            throw InventoryError.invalidName\n        }\n        guard !s.path.isEmpty, !s.path.unicodeScalars.contains(where: { $0.value == 0 }) else {\n            throw InventoryError.invalidName\n        }\n        s.folder = s.folder.trimmingCharacters(in: .whitespacesAndNewlines)\n        if !s.folder.isEmpty { s.folder = try normalizeFolder(s.folder) }\n        return s\n    }\n\n    static func writeSource(_ db: Database, _ s: InventorySource, insert: Bool) throws {\n        let values: [SQLValue] = [\n            .text(s.name), .text(s.kind.rawValue), .text(s.path), .text(s.folder),\n            s.defaultEnvironment.map { .text($0.rawValue) } ?? .null, .text(s.configJSON),\n            s.lastSyncedAt.map { .real($0.timeIntervalSince1970) } ?? .null,\n            s.lastFingerprint.map { .text($0) } ?? .null,\n        ]\n        if insert {\n            try db.execute(\n                \"INSERT INTO inventory_sources(\\(sourceColumns)) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)\",\n                [.text(s.id.uuidString)] + values)\n        } else {\n            try db.execute(\n                \"UPDATE inventory_sources SET name = ?, kind = ?, path = ?, folder = ?, default_environment = ?, config_json = ?, last_synced_at = ?, last_fingerprint = ? WHERE id = ?\",\n                values + [.text(s.id.uuidString)])\n        }\n    }\n\n    private static func decodeSource(_ row: [SQLValue]) throws -> InventorySource {\n        func bad() -> DatabaseError { .corrupt(\"hàng inventory_sources không hợp lệ\") }\n        func text(_ i: Int) -> String? { if case .text(let s) = row[i] { return s } else { return nil } }\n        guard row.count == 9, let idText = text(0), let id = UUID(uuidString: idText), let name = text(1),\n            let kindText = text(2), let kind = InventorySourceKind(rawValue: kindText), let path = text(3),\n            let folder = text(4), let config = text(6)\n        else { throw bad() }\n        var synced: Date?\n        switch row[7] {\n        case .real(let v): synced = Date(timeIntervalSince1970: v)\n        case .int(let v): synced = Date(timeIntervalSince1970: Double(v))\n        default: break\n        }\n        return InventorySource(\n            id: id, name: name, kind: kind, path: path, folder: folder,\n            defaultEnvironment: text(5).flatMap(HostEnvironment.init(rawValue:)), configJSON: config,\n            lastSyncedAt: synced, lastFingerprint: text(8))\n    }\n}\n"}, "Sources/SSHDeskCore/Inventory/InventorySync.swift": {"group": "Core · Inventory", "text": "import Foundation\n\n/// Một thay đổi của một trường: giá trị cũ -> mới (hiện ở màn xem trước).\npublic struct InventoryFieldChange: Sendable, Equatable {\n    public var label: String\n    public var old: String\n    public var new: String\n\n    public var text: String { \"\\(label): \\(old) → \\(new)\" }\n}\n\n/// Kế hoạch đồng bộ một chiều (ADR-026). Thuần: không chạm DB/Keychain/file.\npublic struct InventorySyncPlan: Sendable, Equatable {\n    /// Giá trị mới sẽ ghi vào host đã có (chỉ trường do nguồn quản lý).\n    public struct Patch: Sendable, Equatable {\n        public var displayName: String?\n        public var hostName: String?\n        public var port: Int?\n        /// SSH: `user`; Windows: `rdpUsername`.\n        public var user: String?\n        public var environment: HostEnvironment?\n        public var folder: String?\n        public var setsJump = false\n        public var jumpHostID: UUID?\n        public var credentialSetName: String?\n        public var notes: String?\n        /// Toàn bộ tag mới của host (tag cũ + tag còn thiếu từ nguồn).\n        public var tags: [String]?\n\n        public var isEmpty: Bool {\n            displayName == nil && hostName == nil && port == nil && user == nil && environment == nil\n                && folder == nil && !setsJump && credentialSetName == nil && notes == nil && tags == nil\n        }\n    }\n\n    public struct Addition: Sendable, Equatable, Identifiable {\n        public var id: UUID { host.id }\n        public var host: HostProfile\n        public var record: InventoryRecord\n        public var jumpHostID: UUID?\n        /// Tên bộ đăng nhập sẽ gán (kèm hold tự điền).\n        public var credentialSetName: String?\n    }\n\n    public struct Update: Sendable, Equatable, Identifiable {\n        public var id: UUID { hostID }\n        public var hostID: UUID\n        public var displayName: String\n        public var changes: [InventoryFieldChange]\n        public var patch: Patch\n        /// Có lý do hold -> đặt `autofill_hold` (đổi địa chỉ / gán bộ từ nguồn).\n        public var holdReason: String?\n        /// Host từng bị đánh \"Không còn trong nguồn\" nay có lại.\n        public var restored: Bool\n    }\n\n    public struct Missing: Sendable, Equatable, Identifiable {\n        public var id: UUID { hostID }\n        public var hostID: UUID\n        public var displayName: String\n    }\n\n    /// Nguồn sẽ được ghi (tạo mới hoặc cập nhật) cùng transaction. nil = nhập một lần, không lưu nguồn.\n    public var source: InventorySource?\n    public var additions: [Addition] = []\n    public var updates: [Update] = []\n    public var missing: [Missing] = []\n    public var unchangedCount = 0\n    public var issues: [InventoryIssue] = []\n    public var warnings: [String] = []\n    public var setsToCreate: [String] = []\n    /// Số dòng nguồn -> id host sẽ có sau khi áp dụng (để gắn mật khẩu cột bí mật, ADR-031). Không chứa giá trị.\n    public var rowHosts: [Int: UUID] = [:]\n    public var fingerprint: String?\n    public var syncedAt = Date()\n\n    public var errorCount: Int { issues.filter { $0.severity == .error }.count }\n    public var warningCount: Int { issues.filter { $0.severity == .warning }.count + warnings.count }\n    public var holdCount: Int {\n        additions.filter { $0.credentialSetName != nil }.count + updates.filter { $0.holdReason != nil }.count\n    }\n    public var hasChanges: Bool {\n        !additions.isEmpty || !updates.isEmpty || !missing.isEmpty\n    }\n}\n\n/// Diff thuần giữa bản ghi từ nguồn và host hiện có của nguồn (ADR-026).\npublic enum InventorySync {\n    public static let maxHoldReasonLength = 500\n\n    public static func plan(\n        source: InventorySource?,\n        records: [InventoryRecord],\n        issues: [InventoryIssue] = [],\n        warnings: [String] = [],\n        failedKeys: Set<String> = [],\n        managesJump: Bool = true,\n        existingHosts: [HostProfile],\n        credentialSets: [CredentialSet],\n        fingerprint: String? = nil,\n        now: Date = Date(),\n        newID: () -> UUID = UUID.init\n    ) throws -> InventorySyncPlan {\n        guard records.count <= InventoryLimits.maxRecords else {\n            throw InventoryError.tooManyRecords(limit: InventoryLimits.maxRecords)\n        }\n        var plan = InventorySyncPlan()\n        plan.source = source\n        plan.issues = issues\n        plan.warnings = warnings\n        plan.fingerprint = fingerprint\n        plan.syncedAt = now\n\n        let key = InventoryTableParser.normalizeKey\n        let sourceHosts = existingHosts.filter { source != nil && $0.sourceID == source?.id }\n        var existingByKey: [String: HostProfile] = [:]\n        for h in sourceHosts {\n            if let e = h.externalID { existingByKey[key(e)] = h }\n        }\n        let hostByID = Dictionary(existingHosts.map { ($0.id, $0) }, uniquingKeysWith: { a, _ in a })\n        let setByID = Dictionary(credentialSets.map { ($0.id, $0) }, uniquingKeysWith: { a, _ in a })\n\n        // 1. Gán id cho từng bản ghi (host có sẵn giữ id; host mới id mới).\n        var idForRecord: [Int: UUID] = [:]\n        var idByKey: [String: UUID] = [:]\n        var idByName: [String: UUID] = [:]\n        var recordByID: [UUID: InventoryRecord] = [:]\n        for (i, r) in records.enumerated() {\n            let id = existingByKey[key(r.externalID)]?.id ?? newID()\n            idForRecord[i] = id\n            idByKey[key(r.externalID)] = id\n            idByName[key(r.name)] = id\n            recordByID[id] = r\n        }\n\n        func displayName(of id: UUID?) -> String {\n            guard let id else { return \"(không)\" }\n            return recordByID[id]?.name ?? hostByID[id]?.displayName ?? \"(không rõ)\"\n        }\n\n        // 2. Jump host: trong file trước (khoá rồi tên), sau đó host đã có theo tên chính xác.\n        var chain: [UUID: UUID] = [:]  // host -> jump hiện hành (để bắt vòng)\n        for h in existingHosts { if let j = h.jumpHostID { chain[h.id] = j } }\n        var jumpFor: [UUID: UUID?] = [:]\n        for (i, r) in records.enumerated() where r.kind == .ssh {\n            let id = idForRecord[i]!\n            guard let ref = r.jumpRef, !ref.isEmpty else {\n                if managesJump { jumpFor[id] = .some(nil) }\n                continue\n            }\n            func warn(_ m: String) {\n                plan.issues.append(InventoryIssue(.warning, row: r.sourceRow, column: InventoryField.jumpHost.title, m))\n                if managesJump { jumpFor[id] = .some(nil) }\n            }\n            var target: UUID?\n            if let t = idByKey[key(ref)] ?? idByName[key(ref)] {\n                target = t\n            } else {\n                let matches = existingHosts.filter { $0.displayName == ref && $0.kind == .ssh }\n                if matches.count == 1 {\n                    target = matches[0].id\n                } else if matches.count > 1 {\n                    warn(\"Có \\(matches.count) máy tên “\\(ref)” — không chọn được jump host, để trống.\")\n                    continue\n                }\n            }\n            guard let target else {\n                warn(\"Không tìm thấy jump host “\\(ref)” — để trống.\")\n                continue\n            }\n            if target == id {\n                warn(\"Jump host trỏ chính nó — để trống.\")\n                continue\n            }\n            if let t = recordByID[target], t.kind != .ssh {\n                warn(\"Jump host “\\(ref)” là máy Windows — để trống.\")\n                continue\n            }\n            if let t = hostByID[target], t.kind != .ssh {\n                warn(\"Jump host “\\(ref)” là máy Windows — để trống.\")\n                continue\n            }\n            // Bắt vòng: đi theo chuỗi jump từ target.\n            var cursor: UUID? = target\n            var steps = 0\n            var cyclic = false\n            while let c = cursor, steps < 10_000 {\n                if c == id {\n                    cyclic = true\n                    break\n                }\n                cursor = chain[c]\n                steps += 1\n            }\n            if cyclic {\n                warn(\"Jump host “\\(ref)” tạo thành vòng — để trống.\")\n                chain[id] = nil\n                continue\n            }\n            chain[id] = target\n            jumpFor[id] = .some(target)\n        }\n\n        // 3. Thêm / đổi.\n        var neededSets: [String] = []\n        func setName(of h: HostProfile) -> String? { h.credentialSetID.flatMap { setByID[$0]?.name } }\n        func findSet(_ name: String) -> CredentialSet? {\n            credentialSets.first { CredentialSet.sameName($0.name, name) }\n        }\n        func effectiveFolder(_ r: InventoryRecord) -> String? {\n            if let f = r.folder, !f.isEmpty { return f }\n            if let f = source?.folder, !f.isEmpty { return f }\n            return nil\n        }\n        let outsideNames = Set(\n            existingHosts.filter { $0.sourceID == nil || $0.sourceID != source?.id }.map { key($0.displayName) })\n\n        for (i, r) in records.enumerated() {\n            let id = idForRecord[i]!\n            let jump: UUID?? = r.kind == .ssh ? jumpFor[id] : .some(nil)\n            let wantedSet: CredentialSet? = r.credentialSetName.flatMap(findSet)\n            if r.sourceRow > 0 { plan.rowHosts[r.sourceRow] = id }\n            if let name = r.credentialSetName, wantedSet == nil, r.kind == .ssh || r.kind == .windowsRDP,\n                !neededSets.contains(where: { CredentialSet.sameName($0, name) })\n            {\n                neededSets.append(name)\n            }\n\n            guard let host = existingByKey[key(r.externalID)] else {\n                var h = InventoryValidator.profile(from: r, folder: effectiveFolder(r) ?? \"\", id: id, now: now)\n                h.environment = r.environment ?? source?.defaultEnvironment ?? .other\n                h.sourceID = source?.id\n                if let t = r.tags { h.tags = t }\n                h.externalID = source == nil ? nil : r.externalID\n                if r.kind == .ssh {\n                    h.authMethod = r.credentialSetName == nil ? .agent : .interactive\n                    h.jumpHostID = jump ?? nil\n                }\n                if let name = r.credentialSetName {\n                    h.autofillHold = true\n                    h.autofillHoldReason = \"Bộ đăng nhập \\(wantedSet?.name ?? name) được gán từ nguồn\"\n                }\n                if outsideNames.contains(key(r.name)) {\n                    plan.issues.append(\n                        InventoryIssue(\n                            .warning, row: r.sourceRow, column: InventoryField.name.title,\n                            \"Đã có máy cùng tên “\\(r.name)” không thuộc nguồn này — vẫn sẽ thêm máy mới.\"))\n                }\n                plan.additions.append(\n                    InventorySyncPlan.Addition(\n                        host: h, record: r, jumpHostID: h.jumpHostID,\n                        credentialSetName: r.credentialSetName.map { wantedSet?.name ?? $0 }))\n                continue\n            }\n\n            if host.kind != r.kind {\n                plan.rowHosts[r.sourceRow] = nil\n                plan.issues.append(\n                    InventoryIssue(\n                        .error, row: r.sourceRow, column: InventoryField.kind.title,\n                        \"Loại máy đổi giữa SSH và Windows — không đồng bộ được. Hãy tách máy “\\(host.displayName)” khỏi nguồn.\"\n                    ))\n                continue\n            }\n\n            var patch = InventorySyncPlan.Patch()\n            var changes: [InventoryFieldChange] = []\n            var holdParts: [String] = []\n\n            if host.displayName != r.name {\n                patch.displayName = r.name\n                changes.append(.init(label: \"Tên\", old: host.displayName, new: r.name))\n            }\n            if host.hostName != r.hostName {\n                patch.hostName = r.hostName\n                changes.append(.init(label: \"IP/Hostname\", old: host.hostName, new: r.hostName))\n                holdParts.append(\"IP/Hostname \\(host.hostName) → \\(r.hostName)\")\n            }\n            if host.port != r.port {\n                patch.port = r.port\n                changes.append(.init(label: \"Port\", old: String(host.port), new: String(r.port)))\n                holdParts.append(\"Port \\(host.port) → \\(r.port)\")\n            }\n            let oldUser = host.kind == .windowsRDP ? host.rdpUsername : host.user\n            if !r.userIsDefault && oldUser != r.user {\n                patch.user = r.user\n                let shown: (String) -> String = { $0.isEmpty ? \"(trống)\" : $0 }\n                changes.append(.init(label: \"User\", old: shown(oldUser), new: shown(r.user)))\n                holdParts.append(\"User \\(shown(oldUser)) → \\(shown(r.user))\")\n            }\n            if let env = r.environment, env != host.environment {\n                patch.environment = env\n                changes.append(.init(label: \"Môi trường\", old: host.environment.rawValue, new: env.rawValue))\n            }\n            if let f = effectiveFolder(r), !HostFolders.sameFolder(f, host.project) {\n                patch.folder = f\n                changes.append(.init(label: \"Thư mục\", old: host.project.isEmpty ? \"(trống)\" : host.project, new: f))\n            }\n            if let j = jump, r.kind == .ssh, j != host.jumpHostID {\n                patch.setsJump = true\n                patch.jumpHostID = j\n                changes.append(\n                    .init(label: \"Jump host\", old: displayName(of: host.jumpHostID), new: displayName(of: j)))\n                holdParts.append(\"Jump host \\(displayName(of: host.jumpHostID)) → \\(displayName(of: j))\")\n            }\n            if let name = r.credentialSetName {\n                let current = setName(of: host)\n                let alreadySame = wantedSet != nil && wantedSet?.id == host.credentialSetID\n                if !alreadySame {\n                    patch.credentialSetName = wantedSet?.name ?? name\n                    changes.append(\n                        .init(label: \"Bộ đăng nhập\", old: current ?? \"(không)\", new: wantedSet?.name ?? name))\n                }\n            }\n            if let wanted = r.tags {\n                let missingTags = wanted.filter { t in\n                    !host.tags.contains { $0.caseInsensitiveCompare(t) == .orderedSame }\n                }\n                if !missingTags.isEmpty {\n                    patch.tags = host.tags + missingTags\n                    changes.append(\n                        .init(\n                            label: \"Tag\", old: host.tags.isEmpty ? \"(trống)\" : host.tags.joined(separator: \", \"),\n                            new: (host.tags + missingTags).joined(separator: \", \")))\n                }\n            }\n            if let notes = r.notes, notes != host.notes {\n                patch.notes = notes\n                func clip(_ s: String) -> String {\n                    let one = s.replacingOccurrences(of: \"\\n\", with: \" \")\n                    return one.count > 60 ? String(one.prefix(60)) + \"…\" : (one.isEmpty ? \"(trống)\" : one)\n                }\n                changes.append(.init(label: \"Ghi chú\", old: clip(host.notes), new: clip(notes)))\n            }\n\n            var hold: String?\n            var parts: [String] = []\n            if !holdParts.isEmpty { parts.append(\"Địa chỉ đổi từ nguồn: \" + holdParts.joined(separator: \"; \")) }\n            if let n = patch.credentialSetName { parts.append(\"Bộ đăng nhập \\(n) được gán từ nguồn\") }\n            if !parts.isEmpty { hold = String(parts.joined(separator: \". \").prefix(maxHoldReasonLength)) }\n\n            if changes.isEmpty && !host.sourceMissing {\n                plan.unchangedCount += 1\n            } else {\n                plan.updates.append(\n                    InventorySyncPlan.Update(\n                        hostID: host.id, displayName: host.displayName, changes: changes, patch: patch,\n                        holdReason: hold, restored: host.sourceMissing))\n            }\n        }\n\n        // 4. Không còn trong nguồn.\n        let presentKeys = Set(records.map { key($0.externalID) }).union(failedKeys.map(key))\n        for h in sourceHosts {\n            guard let e = h.externalID, !presentKeys.contains(key(e)), !h.sourceMissing else { continue }\n            plan.missing.append(InventorySyncPlan.Missing(hostID: h.id, displayName: h.displayName))\n        }\n        if records.isEmpty && !sourceHosts.isEmpty {\n            plan.warnings.append(\n                \"Nguồn không có máy hợp lệ nào — nếu áp dụng, mọi máy của nguồn sẽ bị đánh “Không còn trong nguồn”.\")\n        }\n        plan.setsToCreate = neededSets\n        return plan\n    }\n}\n"}, "Sources/SSHDeskCore/Inventory/InventoryTableParser.swift": {"group": "Core · Inventory", "text": "import Foundation\n\n/// Kiểm một bản ghi bằng đúng validator của form/ADR-020 (`HostDraft` + `HostProfile.validate`).\npublic enum InventoryValidator {\n    public struct Problem: Equatable, Sendable {\n        public var field: InventoryField?\n        public var message: String\n    }\n\n    static func isControl(_ s: Unicode.Scalar) -> Bool { PortForward.isControl(s) }\n    static func hasControl(_ s: String) -> Bool { s.unicodeScalars.contains(where: isControl) }\n\n    /// Dựng host tạm từ bản ghi (id/ngày do bên gọi truyền).\n    static func profile(from r: InventoryRecord, folder: String, id: UUID = UUID(), now: Date = Date()) -> HostProfile {\n        if r.kind == .windowsRDP {\n            return HostProfile(\n                id: id, displayName: r.name, project: folder, environment: r.environment ?? .other,\n                notes: r.notes ?? \"\", kind: .windowsRDP, rdpUsername: r.user, hostName: r.hostName, port: r.port,\n                createdAt: now, updatedAt: now)\n        }\n        return HostProfile(\n            id: id, displayName: r.name, project: folder, environment: r.environment ?? .other, notes: r.notes ?? \"\",\n            hostName: r.hostName, port: r.port, user: r.user, createdAt: now, updatedAt: now)\n    }\n\n    /// nil = hợp lệ.\n    public static func check(_ r: InventoryRecord) -> Problem? {\n        let singleLine: [(InventoryField, String)] = [\n            (.name, r.name), (.hostName, r.hostName), (.user, r.user), (.folder, r.folder ?? \"\"),\n            (.jumpHost, r.jumpRef ?? \"\"), (.credentialSet, r.credentialSetName ?? \"\"),\n        ]\n        for (field, value) in singleLine where hasControl(value) {\n            return Problem(field: field, message: \"\\(field.title) chứa ký tự điều khiển hoặc xuống dòng.\")\n        }\n        if let n = r.notes,\n            n.unicodeScalars.contains(where: { isControl($0) && $0 != \"\\n\" && $0 != \"\\t\" && $0 != \"\\r\" })\n        {\n            return Problem(field: .notes, message: \"Ghi chú chứa ký tự điều khiển.\")\n        }\n        if r.name.count > 200 { return Problem(field: .name, message: \"Tên quá dài (tối đa 200 ký tự).\") }\n        if (r.notes ?? \"\").count > 20_000 { return Problem(field: .notes, message: \"Ghi chú quá dài.\") }\n        if r.name.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {\n            return Problem(field: .name, message: \"Thiếu Tên.\")\n        }\n        if r.hostName.trimmingCharacters(in: .whitespaces).isEmpty {\n            return Problem(field: .hostName, message: \"Thiếu IP/Hostname.\")\n        }\n        do { try SSHConfigWriter.validateHostName(r.hostName) } catch {\n            return Problem(field: .hostName, message: \"IP/Hostname không hợp lệ.\")\n        }\n        if !(1...65535).contains(r.port) { return Problem(field: .port, message: \"Port ngoài khoảng 1–65535.\") }\n        if let f = r.folder, !f.isEmpty {\n            do { _ = try HostFolders.normalize(f) } catch {\n                return Problem(field: .folder, message: \"Tên thư mục không hợp lệ.\")\n            }\n        }\n        let host = profile(from: r, folder: r.folder ?? \"\")\n        let draft = HostDraft(host: host)\n        let problems = draft.errors(basedOn: nil)\n        if let (field, message) = problems.sorted(by: { \"\\($0.key)\" < \"\\($1.key)\" }).first {\n            return Problem(field: map(field), message: message)\n        }\n        do { try host.validate() } catch let e as HostValidationError {\n            let (field, message) = HostDraft.describe(e)\n            return Problem(field: map(field), message: message)\n        } catch { return Problem(field: nil, message: \"Dữ liệu không hợp lệ.\") }\n        return nil\n    }\n\n    private static func map(_ f: HostDraft.Field) -> InventoryField? {\n        switch f {\n        case .displayName: return .name\n        case .hostName: return .hostName\n        case .port: return .port\n        case .user, .rdpUser: return .user\n        case .jumpHost: return .jumpHost\n        default: return nil\n        }\n    }\n}\n\npublic struct InventoryParseResult: Sendable, Equatable {\n    public var records: [InventoryRecord] = []\n    public var issues: [InventoryIssue] = []\n    /// Cảnh báo chung của file (cột mật khẩu, công thức...).\n    public var warnings: [String] = []\n    public var blankRows = 0\n    /// Khoá của các dòng bị loại vì lỗi (nếu xác định được) — để máy đã có không bị coi là \"không còn trong nguồn\".\n    public var failedKeys: Set<String> = []\n    /// Trường nguồn thực sự quản lý (cột đã ghép được).\n    public var managedFields: Set<InventoryField> = []\n\n    public var errorCount: Int { issues.filter { $0.severity == .error }.count }\n}\n\n/// Bảng đã đọc + cách ghép -> bản ghi chuẩn hoá và lỗi theo dòng (ADR-026). Dòng lỗi bị bỏ qua,\n/// dòng trống bỏ qua im lặng; lỗi một dòng không làm hỏng file.\npublic enum InventoryTableParser {\n    public static func parse(sheet: TableSheet, mapping: TableMapping) throws -> InventoryParseResult {\n        var result = InventoryParseResult()\n        result.warnings = sheet.warnings\n        let resolved = mapping.resolve(in: sheet)\n        for (field, header) in resolved.blocked.sorted(by: { $0.key.rawValue < $1.key.rawValue }) {\n            result.warnings.append(\"Cột “\\(header)” giống mật khẩu nên không được ghép vào “\\(field.title)”.\")\n        }\n        for (field, header) in resolved.missing.sorted(by: { $0.key.rawValue < $1.key.rawValue }) {\n            result.issues.append(\n                InventoryIssue(.error, row: 0, column: header, \"Không thấy cột đã ghép cho “\\(field.title)”.\"))\n        }\n        guard let hostColumn = resolved.columns[.hostName] else {\n            result.issues.append(InventoryIssue(.error, row: 0, \"Chưa ghép cột IP/Hostname.\"))\n            return result\n        }\n        _ = hostColumn\n        if !result.issues.isEmpty { return result }\n\n        let rows = sheet.dataRows\n        if rows.filter({ !$0.isBlank }).count > InventoryLimits.maxRecords {\n            throw InventoryError.tooManyRecords(limit: InventoryLimits.maxRecords)\n        }\n        result.managedFields = Set(resolved.columns.keys)\n        let strict = mapping.isTemplate\n        let keyField: InventoryField = resolved.columns[mapping.keyField] != nil ? mapping.keyField : .hostName\n        var seenKeys: [String: Int] = [:]\n\n        func title(_ f: InventoryField) -> String { mapping.header(for: f) ?? f.title }\n\n        for row in rows {\n            if row.isBlank {\n                result.blankRows += 1\n                continue\n            }\n            var rowKey: String?\n            func cell(_ f: InventoryField) -> String? {\n                guard let i = resolved.columns[f] else { return nil }\n                return row.cell(i).trimmingCharacters(in: .whitespacesAndNewlines)\n            }\n            func fail(_ f: InventoryField?, _ message: String) {\n                if let k = rowKey { result.failedKeys.insert(k) }\n                result.issues.append(InventoryIssue(.error, row: row.number, column: f.map(title), message))\n            }\n            func warn(_ f: InventoryField?, _ message: String) {\n                result.issues.append(InventoryIssue(.warning, row: row.number, column: f.map(title), message))\n            }\n\n            var name = cell(.name) ?? \"\"\n            let hostName = cell(.hostName) ?? \"\"\n            rowKey =\n                (keyField == .hostName ? hostName : (cell(keyField) ?? \"\")).isEmpty\n                ? (name.isEmpty ? nil : name) : (keyField == .hostName ? hostName : cell(keyField))\n            if hostName.isEmpty && name.isEmpty {\n                fail(.hostName, \"Thiếu Tên và IP/Hostname.\")\n                continue\n            }\n            if strict && name.isEmpty {\n                fail(.name, \"Thiếu Tên.\")\n                continue\n            }\n            if hostName.isEmpty {\n                fail(.hostName, \"Thiếu IP/Hostname.\")\n                continue\n            }\n            if name.isEmpty { name = hostName }\n\n            // Loại\n            var kind = HostKind.ssh\n            if let k = cell(.kind), !k.isEmpty {\n                switch HeaderText.normalize(k) {\n                case \"ssh\", \"linux\": kind = .ssh\n                case \"windows\", \"win\", \"rdp\": kind = .windowsRDP\n                default:\n                    fail(.kind, \"Loại “\\(clip(k))” không hợp lệ (chỉ SSH hoặc Windows).\")\n                    continue\n                }\n            }\n            // Môi trường\n            var environment: HostEnvironment?\n            if let e = cell(.environment) {\n                if e.isEmpty {\n                    environment = .other\n                } else if let parsed = parseEnvironment(e, strict: strict) {\n                    environment = parsed\n                } else {\n                    fail(.environment, \"Môi trường “\\(clip(e))” không hợp lệ (DEV, UAT, STG, PROD).\")\n                    continue\n                }\n            }\n            // Port\n            var port = kind == .windowsRDP ? HostProfile.defaultRDPPort : 22\n            if let p = cell(.port), !p.isEmpty {\n                guard let parsed = parsePort(p) else {\n                    fail(.port, \"Port “\\(clip(p))” không phải số nguyên.\")\n                    continue\n                }\n                guard (1...65535).contains(parsed) else {\n                    fail(.port, \"Port ngoài khoảng 1–65535.\")\n                    continue\n                }\n                port = parsed\n            }\n            // User\n            let user = cell(.user) ?? \"\"\n            if kind == .ssh && user.isEmpty {\n                fail(.user, \"Thiếu User.\")\n                continue\n            }\n\n            // Jump host (cảnh báo, không loại dòng)\n            var jump = cell(.jumpHost).flatMap { $0.isEmpty ? nil : $0 }\n            if let j = jump {\n                if kind == .windowsRDP {\n                    warn(.jumpHost, \"Máy Windows không có jump host — đã bỏ qua.\")\n                    jump = nil\n                } else if sameKey(j, name) {\n                    warn(.jumpHost, \"Jump host trỏ chính nó — đã bỏ qua.\")\n                    jump = nil\n                }\n            }\n            // Bộ đăng nhập\n            var setName: String?\n            if let s = cell(.credentialSet), !s.isEmpty {\n                do { setName = try CredentialSet.normalizedName(s) } catch {\n                    fail(.credentialSet, \"Tên bộ đăng nhập không hợp lệ.\")\n                    continue\n                }\n            }\n            var folder = cell(.folder)\n            if let f = folder, f.isEmpty { folder = nil }\n\n            let keyValue: String\n            switch keyField {\n            case .hostName: keyValue = hostName\n            case .name: keyValue = name\n            default: keyValue = (cell(keyField) ?? \"\").isEmpty ? name : (cell(keyField) ?? name)\n            }\n\n            var record = InventoryRecord(\n                externalID: keyValue, name: name, hostName: hostName, port: port, user: user, kind: kind,\n                environment: environment, folder: folder, jumpRef: jump, credentialSetName: setName,\n                notes: cell(.notes), sourceRow: row.number)\n            if kind == .windowsRDP { record.jumpRef = nil }\n\n            if let problem = InventoryValidator.check(record) {\n                fail(problem.field, problem.message)\n                continue\n            }\n            let normalizedKey = normalizeKey(record.externalID)\n            if let first = seenKeys[normalizedKey] {\n                fail(keyField, \"Trùng \\(keyField == .name ? \"tên\" : keyField.title.lowercased()) với dòng \\(first).\")\n                continue\n            }\n            seenKeys[normalizedKey] = row.number\n            result.records.append(record)\n        }\n        return result\n    }\n\n    // MARK: - Giá trị\n\n    /// Port: \"22\", \"22.0\", \"2.2E1\" -> số nguyên; nil nếu không phải số nguyên.\n    static func parsePort(_ text: String) -> Int? {\n        let t = text.trimmingCharacters(in: .whitespaces)\n        if let i = Int(t) { return i }\n        guard !t.isEmpty, t.allSatisfy({ \"0123456789.eE+-\".contains($0) }) else { return nil }\n        guard let d = Double(t), d.isFinite, d == d.rounded(), abs(d) < 1e9 else { return nil }\n        return Int(d)\n    }\n\n    static func parseEnvironment(_ text: String, strict: Bool) -> HostEnvironment? {\n        let n = HeaderText.normalize(text)\n        if strict {\n            switch n {\n            case \"dev\": return .dev\n            case \"uat\": return .uat\n            case \"stg\": return .stg\n            case \"prod\": return .prod\n            case \"other\": return .other\n            default: return nil\n            }\n        }\n        switch n {\n        case \"prod\", \"production\", \"prd\": return .prod\n        case \"uat\": return .uat\n        case \"stg\", \"staging\": return .stg\n        case \"dev\", \"development\", \"test\": return .dev\n        default: return .other\n        }\n    }\n\n    static func normalizeKey(_ s: String) -> String {\n        s.trimmingCharacters(in: .whitespacesAndNewlines).lowercased()\n    }\n\n    static func sameKey(_ a: String, _ b: String) -> Bool { normalizeKey(a) == normalizeKey(b) }\n\n    private static func clip(_ s: String) -> String {\n        String(s.unicodeScalars.filter { !InventoryValidator.isControl($0) }.prefix(40).map(Character.init))\n    }\n}\n"}, "Sources/SSHDeskCore/Inventory/SecretColumn.swift": {"group": "Core · Inventory", "text": "import Foundation\n\n/// Bytes bí mật có thể ghi đè 0. Không bao giờ in nội dung.\nfinal class SecretBytes: @unchecked Sendable, CustomStringConvertible, CustomDebugStringConvertible, CustomReflectable {\n    private var bytes: [UInt8]\n    init(_ bytes: [UInt8]) { self.bytes = bytes }\n\n    var count: Int { bytes.count }\n    var snapshot: [UInt8] { bytes }\n    var isAllZero: Bool { bytes.allSatisfy { $0 == 0 } }\n\n    func wipe() {\n        bytes.withUnsafeMutableBytes { buf in\n            if let base = buf.baseAddress, buf.count > 0 { _ = memset_s(base, buf.count, 0, buf.count) }\n        }\n    }\n\n    var description: String { \"••••\" }\n    var debugDescription: String { \"••••\" }\n    var customMirror: Mirror { Mirror(self, children: [], displayStyle: .struct) }\n}\n\n/// Giá trị cột mật khẩu do người dùng cho phép giữ (ADR-031): khoá theo (tên sheet, số dòng) -> bytes UTF-8.\n/// Nằm ngoài `TableSheet`/`InventoryRecord`/kế hoạch. Mọi dạng in đều che hết.\npublic final class SecretColumnValues: @unchecked Sendable, CustomStringConvertible, CustomDebugStringConvertible,\n    CustomReflectable\n{\n    /// Tiêu đề cột đã chọn (không phải giá trị bí mật).\n    public let title: String\n    private let lock = NSLock()\n    private var values: [String: [Int: SecretBytes]] = [:]\n\n    public init(title: String) { self.title = title }\n\n    deinit { wipe() }\n\n    func set(sheet: String, row: Int, bytes: [UInt8]) {\n        lock.lock()\n        defer { lock.unlock() }\n        values[sheet, default: [:]][row]?.wipe()\n        values[sheet, default: [:]][row] = SecretBytes(bytes)\n    }\n\n    /// Bản sao bytes của một dòng (nil nếu không có / đã xoá).\n    public func bytes(sheet: String, row: Int) -> [UInt8]? {\n        lock.lock()\n        defer { lock.unlock() }\n        return values[sheet]?[row]?.snapshot\n    }\n\n    public func rows(sheet: String) -> [Int] {\n        lock.lock()\n        defer { lock.unlock() }\n        return (values[sheet] ?? [:]).keys.sorted()\n    }\n\n    public var count: Int {\n        lock.lock()\n        defer { lock.unlock() }\n        return values.values.reduce(0) { $0 + $1.count }\n    }\n\n    /// Ghi đè 0 mọi buffer rồi bỏ.\n    public func wipe() {\n        lock.lock()\n        defer { lock.unlock() }\n        for sheet in values.values { for b in sheet.values { b.wipe() } }\n        values.removeAll()\n    }\n\n    /// Chỉ cho test: giữ tham chiếu buffer để kiểm sau `wipe()`.\n    func buffer(sheet: String, row: Int) -> SecretBytes? {\n        lock.lock()\n        defer { lock.unlock() }\n        return values[sheet]?[row]\n    }\n\n    public var description: String { \"SecretColumnValues(••••)\" }\n    public var debugDescription: String { \"SecretColumnValues(••••)\" }\n    public var customMirror: Mirror { Mirror(self, children: [], displayStyle: .class) }\n}\n\n/// Bảng đọc xong kèm giá trị cột bí mật (nếu được bật).\npublic enum InventorySecretImport {\n    public static let maxPasswordBytes = 1024\n\n    public struct Entry: Sendable, Equatable {\n        public var hostID: UUID\n        public var row: Int\n        /// Host đã có mật khẩu riêng và sẽ bị ghi đè.\n        public var replaces: Bool\n    }\n\n    /// Kế hoạch lưu mật khẩu. Không chứa giá trị.\n    public struct Plan: Sendable, Equatable {\n        public var entries: [Entry] = []\n        /// Host đã có mật khẩu riêng và bị bỏ qua vì chưa bật ghi đè.\n        public var skippedExisting = 0\n        /// Số dòng có mật khẩu không hợp lệ (ký tự điều khiển/NUL, > 1024 byte).\n        public var invalidRows: [Int] = []\n\n        public var newCount: Int { entries.filter { !$0.replaces }.count }\n        public var replaceCount: Int { entries.filter(\\.replaces).count }\n        public var count: Int { entries.count }\n        public var isEmpty: Bool { entries.isEmpty }\n        public var invalidMessages: [String] {\n            invalidRows.sorted().map { \"Mật khẩu ở dòng \\($0) không hợp lệ — bỏ qua máy này.\" }\n        }\n    }\n\n    public struct Outcome: Sendable, Equatable {\n        public var saved = 0\n        public var failed = 0\n    }\n\n    public static func isValid(_ bytes: [UInt8]) -> Bool {\n        guard !bytes.isEmpty, bytes.count <= maxPasswordBytes,\n            let s = String(bytes: bytes, encoding: .utf8)\n        else { return false }\n        return !s.unicodeScalars.contains(where: PortForward.isControl)\n    }\n\n    /// Ghép dòng có mật khẩu với host trong kế hoạch. `hasOwnPassword` quyết định host đã có mật khẩu riêng.\n    public static func plan(\n        for plan: InventorySyncPlan, secrets: SecretColumnValues, sheet: String, existingHosts: [HostProfile],\n        overwrite: Bool\n    ) -> Plan {\n        let byID = Dictionary(existingHosts.map { ($0.id, $0) }, uniquingKeysWith: { a, _ in a })\n        var out = Plan()\n        var seen = Set<UUID>()\n        for row in secrets.rows(sheet: sheet) {\n            guard let id = plan.rowHosts[row], seen.insert(id).inserted,\n                let bytes = secrets.bytes(sheet: sheet, row: row)\n            else { continue }\n            guard isValid(bytes) else {\n                out.invalidRows.append(row)\n                continue\n            }\n            let has = byID[id]?.hasOwnPassword == true\n            if has && !overwrite {\n                out.skippedExisting += 1\n                continue\n            }\n            out.entries.append(Entry(hostID: id, row: row, replaces: has))\n        }\n        return out\n    }\n\n    /// Lưu từng mật khẩu sau khi transaction DB đã thành công. `save` thường là `ConnectionService.savePassword`.\n    /// Lỗi chỉ được đếm, không bao giờ in giá trị. Luôn `wipe()` container khi xong.\n    public static func save(\n        _ plan: Plan, secrets: SecretColumnValues, sheet: String,\n        using save: @Sendable (UUID, String) async throws -> Void\n    ) async -> Outcome {\n        var outcome = Outcome()\n        for e in plan.entries {\n            guard let bytes = secrets.bytes(sheet: sheet, row: e.row), isValid(bytes),\n                let password = String(bytes: bytes, encoding: .utf8)\n            else {\n                outcome.failed += 1\n                continue\n            }\n            do {\n                try await save(e.hostID, password)\n                outcome.saved += 1\n            } catch { outcome.failed += 1 }\n        }\n        secrets.wipe()\n        return outcome\n    }\n}\n"}, "Sources/SSHDeskCore/Inventory/TableData.swift": {"group": "Core · Inventory", "text": "import Foundation\n\n/// Một dòng của bảng (`number` = số dòng Excel/CSV, bắt đầu từ 1). `cells` đặc, cột 0 = A.\npublic struct TableRow: Sendable, Equatable {\n    public let number: Int\n    public let cells: [String]\n\n    public init(number: Int, cells: [String]) {\n        self.number = number\n        self.cells = cells\n    }\n\n    public func cell(_ index: Int) -> String {\n        index >= 0 && index < cells.count ? cells[index] : \"\"\n    }\n\n    public var isBlank: Bool { cells.allSatisfy { $0.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty } }\n}\n\n/// Một sheet (hoặc cả file CSV) đã đọc. **Cột giống mật khẩu đã bị xoá giá trị** ngay khi dựng bảng:\n/// model này không bao giờ chứa nội dung cột đó (ADR-026).\npublic struct TableSheet: Sendable, Equatable {\n    public var name: String\n    public var rows: [TableRow]\n    /// Dòng tiêu đề đã dùng để nhận diện cột mật khẩu.\n    public var headerRow: Int\n    /// Cột giống mật khẩu: chỉ số cột -> văn bản tiêu đề. Giá trị cột này đã bị bỏ.\n    public var passwordColumns: [Int: String]\n    public var warnings: [String]\n\n    public init(\n        name: String, rows: [TableRow], headerRow: Int, passwordColumns: [Int: String] = [:],\n        warnings: [String] = []\n    ) {\n        self.name = name\n        self.rows = rows\n        self.headerRow = headerRow\n        self.passwordColumns = passwordColumns\n        self.warnings = warnings\n    }\n\n    public var header: TableRow? { rows.first { $0.number == headerRow } }\n\n    public var dataRows: [TableRow] { rows.filter { $0.number > headerRow } }\n}\n\n/// Sổ làm việc đã đọc: các sheet hiển thị (sheet ẩn đã bị loại).\npublic struct TableWorkbook: Sendable, Equatable {\n    public var sheets: [TableSheet]\n    public var warnings: [String]\n\n    public init(sheets: [TableSheet], warnings: [String] = []) {\n        self.sheets = sheets\n        self.warnings = warnings\n    }\n}\n\npublic enum SpreadsheetError: Error, Equatable, CustomStringConvertible {\n    case unsupportedExtension(String)\n    case notRegularFile\n    case unreadable(String)\n    case fileTooLarge(limitMB: Int)\n    case notZip\n    case unsafeEntryName\n    case duplicateEntry\n    case tooManyEntries\n    case entryTooLarge\n    case totalTooLarge\n    case timeout\n    case unzipFailed(Int32)\n    case missingPart(String)\n    case externalRelationship\n    case forbiddenXML\n    case notUTF8\n    case malformedXML(String)\n    case tooManyRows(limit: Int)\n    case tooManyColumns(limit: Int)\n    case noSheets\n    case unsupportedEncoding\n    case emptyFile\n    case cannotRun(String)\n\n    public var description: String {\n        switch self {\n        case .unsupportedExtension(let e):\n            return \"Chỉ nhận file .xlsx hoặc .csv (không nhận “\\(e)”; .xlsm/.xls không được hỗ trợ).\"\n        case .notRegularFile: return \"Đường dẫn không phải file thường.\"\n        case .unreadable(let s): return \"Không đọc được file: \\(s)\"\n        case .fileTooLarge(let mb): return \"File quá lớn (tối đa \\(mb) MB).\"\n        case .notZip: return \"File không phải .xlsx hợp lệ.\"\n        case .unsafeEntryName: return \"File .xlsx có tên thành phần không an toàn — đã từ chối.\"\n        case .duplicateEntry: return \"File .xlsx có thành phần trùng tên — đã từ chối.\"\n        case .tooManyEntries: return \"File .xlsx có quá nhiều thành phần.\"\n        case .entryTooLarge: return \"Một thành phần trong file .xlsx giải nén quá lớn — đã từ chối.\"\n        case .totalTooLarge: return \"File .xlsx giải nén quá lớn — đã từ chối.\"\n        case .timeout: return \"Đọc file quá lâu — đã dừng.\"\n        case .unzipFailed(let c): return \"File .xlsx bị lỗi hoặc hỏng (mã \\(c)).\"\n        case .missingPart(let p): return \"File .xlsx thiếu thành phần \\(p).\"\n        case .externalRelationship: return \"File .xlsx tham chiếu tài nguyên bên ngoài — đã từ chối.\"\n        case .forbiddenXML: return \"File .xlsx chứa khai báo XML không an toàn (DOCTYPE/ENTITY) — đã từ chối.\"\n        case .notUTF8: return \"File .xlsx chứa XML không phải UTF-8.\"\n        case .malformedXML(let s): return \"XML trong file .xlsx không hợp lệ: \\(s)\"\n        case .tooManyRows(let n): return \"Sheet có quá nhiều dòng (tối đa \\(n) dòng dữ liệu).\"\n        case .tooManyColumns(let n): return \"Sheet có quá nhiều cột (tối đa \\(n)).\"\n        case .noSheets: return \"File không có sheet nào hiển thị.\"\n        case .unsupportedEncoding: return \"File CSV phải là UTF-8 hoặc UTF-16 LE có BOM.\"\n        case .emptyFile: return \"File rỗng.\"\n        case .cannotRun(let s): return \"Không chạy được công cụ hệ thống: \\(s)\"\n        }\n    }\n}\n\n/// Phát hiện tiêu đề giống mật khẩu (ADR-026).\npublic enum PasswordHeader {\n    /// So với chuỗi đã bỏ mọi ký tự không phải chữ/số (bắt `Mật_khẩu`, `mat-khau`, `rootPassword`).\n    private static let squashed = [\n        \"password\", \"passwd\", \"passphrase\", \"passcode\", \"matkhau\", \"matma\", \"apikey\", \"credential\", \"token\",\n    ]\n    private static let words: Set<String> = [\n        \"pass\", \"pwd\", \"pw\", \"mk\", \"secret\", \"otp\", \"pin\", \"token\", \"credential\", \"credentials\",\n    ]\n    /// Cặp từ liền kề.\n    private static let pairs: [[String]] = [[\"mat\", \"khau\"], [\"mat\", \"ma\"], [\"api\", \"key\"]]\n    /// Tiêu đề cột hợp lệ của file mẫu, không phải mật khẩu.\n    private static let allowed: Set<String> = [\"bo dang nhap\"]\n\n    public static func matches(_ header: String) -> Bool {\n        let n = HeaderText.normalize(header)\n        if n.isEmpty || allowed.contains(n) { return false }\n        let tokens = HeaderText.tokens(n)\n        if tokens.contains(where: { words.contains($0) }) { return true }\n        for p in pairs where tokens.count >= p.count {\n            for i in 0...(tokens.count - p.count) where Array(tokens[i..<(i + p.count)]) == p { return true }\n        }\n        let flat = tokens.joined()\n        return squashed.contains { flat.contains($0) }\n    }\n}\n\npublic enum HeaderText {\n    /// Bỏ dấu, hoa thường, gộp khoảng trắng. `đ` -> `d`.\n    public static func normalize(_ s: String) -> String {\n        let folded = s.folding(options: [.caseInsensitive, .diacriticInsensitive], locale: Locale(identifier: \"en_US\"))\n            .lowercased().replacingOccurrences(of: \"đ\", with: \"d\")\n        return folded.split(whereSeparator: { $0.isWhitespace }).joined(separator: \" \")\n    }\n\n    /// Tách thành từ theo ký tự không phải chữ/số.\n    public static func tokens(_ normalized: String) -> [String] {\n        normalized.split(whereSeparator: { !($0.isLetter || $0.isNumber) }).map(String.init)\n    }\n}\n\n/// Dựng `TableSheet` từ các dòng thô và xoá cột mật khẩu trước khi trả ra ngoài.\nstruct TableBuilder {\n    static let autoHeaderScanRows = 30\n    private var raw: [TableRow] = []\n    private(set) var nonEmptyRows = 0\n\n    mutating func add(number: Int, cells: [String]) {\n        raw.append(TableRow(number: number, cells: cells))\n        if !TableRow(number: number, cells: cells).isBlank { nonEmptyRows += 1 }\n    }\n\n    /// Dòng tiêu đề tự đoán: dòng đầu (trong 30 dòng đầu) có ≥ 2 ô không rỗng, không thì dòng không rỗng đầu tiên.\n    static func autoHeaderRow(_ rows: [TableRow]) -> Int? {\n        let head = rows.filter { $0.number <= autoHeaderScanRows && !$0.isBlank }\n        func filled(_ r: TableRow) -> Int {\n            r.cells.filter { !$0.trimmingCharacters(in: .whitespaces).isEmpty }.count\n        }\n        return (head.first { filled($0) >= 2 } ?? head.first)?.number\n    }\n\n    func finish(\n        name: String, headerRow requested: Int?, extraWarnings: [String] = [], keep: SecretColumnValues? = nil\n    ) -> TableSheet {\n        let rows = raw.filter { !$0.isBlank || $0.number == requested }\n        let header = requested ?? Self.autoHeaderRow(rows) ?? 1\n        var passwordColumns: [Int: String] = [:]\n        if let h = rows.first(where: { $0.number == header }) {\n            for (i, text) in h.cells.enumerated() where PasswordHeader.matches(text) {\n                passwordColumns[i] = text.trimmingCharacters(in: .whitespacesAndNewlines)\n            }\n        }\n        var warnings = extraWarnings\n        var kept = rows\n        // ADR-031: chỉ khi người dùng bật, giữ MỘT cột (cột đầu có tiêu đề trùng) vào container riêng.\n        var keptColumn: Int?\n        if let keep {\n            keptColumn =\n                passwordColumns.sorted { $0.key < $1.key }\n                .first { $0.value == keep.title.trimmingCharacters(in: .whitespacesAndNewlines) }?.key\n        }\n        if !passwordColumns.isEmpty {\n            // Xoá giá trị cột mật khẩu ở MỌI dòng (trừ tiêu đề) trước khi dữ liệu rời khỏi reader.\n            kept = rows.map { row in\n                guard row.number != header else { return row }\n                var cells = row.cells\n                if let keep,
