m 2026-10-22)\n- File JSON `*.sshdesk.json`: `{format: \"sshdesk-hosts\", version: 1, exportedAt, folders: [...], hosts: [...]}`. Host mang mọi metadata (tên, thư mục, môi trường, tag, ghi chú, yêu thích, loại máy, host/port/user, auth method, identity file path, jump host theo **id trong file**, bookmark, thư mục mặc định, tuỳ chọn RDP, port forward). **Không bao giờ** có password, credentialReference, lịch sử truyền/Analyst. Imported alias (`~/.ssh/config`) xuất kèm alias + path.\n- Xuất qua NSSavePanel, ghi atomically, quyền 0600. Có lựa chọn \"chỉ thư mục đang chọn\" hoặc tất cả.\n- Nhập qua NSOpenPanel: parse + validate bằng đúng validator của form (cấm newline/ký tự điều khiển, port…), file > 5 MB hoặc version lạ → từ chối. Màn xem trước: số host mới / trùng (cùng host+port+user+loại) / lỗi. Trùng: chọn Bỏ qua (mặc định) hoặc Nhập thành bản sao. Luôn sinh UUID mới; ánh xạ lại jump host; jump host thiếu → bỏ trống + cảnh báo. Host dùng password → giữ auth method, ghi chú \"cần nhập lại mật khẩu\".\n- Nhập trong một transaction SQLite; lỗi → không ghi gì. Sau nhập: sinh lại SSH config của app.\n\n## ADR-021: Màn Cài đặt (D4) — Đã chốt (người dùng đồng ý danh sách PM đề xuất 2026-10-22)\n- Mở bằng mục \"Cài đặt\" ở sidebar và ⌘, (Settings scene). Lưu bảng `settings(key TEXT PRIMARY KEY, value TEXT)` (migration mới); đọc qua `AppSettings` (Core, có giá trị mặc định + kẹp phạm vi; key lạ/giá trị hỏng → mặc định, không crash).\n- Nhóm và mặc định:\n  - **Chung:** thư mục local mặc định (mặc định ~/Downloads); khi đóng cửa sổ chính: Thoát app (mặc định) / Giữ chạy nền.\n  - **Warp:** mở Tab mới (mặc định) / Cửa sổ mới.\n  - **Truyền file:** số tác vụ đồng thời 1–4 (mặc định 1); giữ lịch sử 100/500/1000/không giới hạn (mặc định 500).\n  - **SSH config:** đường dẫn config người dùng được Include (mặc định `~/.ssh/config`, phải là đường dẫn tuyệt đối, tồn tại, không có ký tự điều khiển; đổi → sinh lại config app); đường dẫn config app (chỉ xem) + nút Mở thư mục trong Finder.\n  - **Bảo mật:** tự điền mật khẩu đã lưu (bật mặc định; tắt → PTY, askpass và Windows clipboard đều không dùng password lưu, askpass hỏi qua tty); thời gian tự xoá clipboard password Windows 10/30/60/90 giây (mặc định 30); \"Xoá mọi mật khẩu đã lưu\" (liệt kê số mục, xác nhận, xoá item Keychain service `local.sshdesk.credentials` theo tham chiếu của host, gỡ tham chiếu khỏi host).\n  - **Project Analyst:** số lần chạy giữ mỗi thư mục 10–200 (mặc định 50); timeout thử kết nối 1–10 giây (mặc định 3, chèn vào lệnh probe dưới dạng số nguyên đã kẹp).\n  - **Monitor:** chu kỳ mặc định 5/10/30 giây; ngưỡng vàng 50–95 (mặc định 80), đỏ > vàng, ≤ 99 (mặc định 90).\n  - **Windows App:** mặc định cho máy mới: toàn màn hình, nhiều màn hình, chia sẻ clipboard (chỉ áp dụng khi tạo máy mới).\n  - **Dữ liệu:** Xuất / Nhập (ADR-020), mở thư mục dữ liệu, phiên bản app + schema, đường dẫn SQLite.\n- Không có: tắt kiểm tra host key, lưu password ra file, chọn sáng/tối (theo hệ thống).\n- **Đã làm (D4, PM duyệt + QA đạt):** migration **v7** `settings`, `Settings/AppSettings.swift`, `SettingsRepository` + `SettingsStore` (đọc mỗi lần dùng), `AutofillGatedCredentialStore` bọc Keychain cho mọi đường tự điền (QA lần theo từng chỗ gọi). Tắt tự điền áp dụng cho kết nối mở sau đó; tab Warp đang mở giữ askpass tới khi đóng. Ô đường dẫn Include lưu khi Return hoặc rời ô.\n\n## ADR-022: Vòng đời app & hoàn thiện UI (D2) — Đã chốt\n- Thoát app (⌘Q, đóng cửa sổ khi cài đặt là Thoát) khi còn job truyền đang chạy/tunnel/Monitor/Analyst đang chạy → hộp xác nhận liệt kê từng loại. Đồng ý: huỷ job (đánh dấu Bị gián đoạn), dừng tunnel, đóng mọi master (`-O exit`), xoá clipboard password (ADR-018) rồi thoát.\n- Empty state cho mọi màn còn thiếu (danh sách rỗng, tìm không thấy, thư mục rỗng, chưa có key, chưa có lịch sử).\n- Phím tắt: ⌘N máy chủ mới, ⌘F tìm, ⌘D nhân bản, ⌘Return mở (Warp/Windows App), ⌘E sửa, ⌫ xoá (có xác nhận), ⌘, Cài đặt, ⌘1…⌘6 chuyển mục sidebar. Liệt kê trong menu để thấy được.\n- Đồng bộ Theme cho form hồ sơ, màn import, AuthPromptCard, màn lỗi DB (phần còn lại của UI1).\n- **Đã làm (D2, PM duyệt + QA đạt):** `App/QuitActivity.swift` (thêm loại thứ 5: tác vụ SSH Keys). Khi thoát: job **đang chạy → Đã huỷ**, job **đang chờ → Bị gián đoạn** (PM duyệt lệch so với câu chữ ban đầu). Xoá host là ⌘⌫ ở menu + ⌫ trần khi bảng có focus; mỗi phím tắt chỉ một nguồn (menu). \"Giữ chạy nền\": đóng cửa sổ thì Monitor dừng, job/tunnel vẫn chạy. Thoát bằng SIGTERM/crash không dọn được master (KNOWN_LIMITATIONS).\n\n\n---\n# Hướng mở rộng chiến lược (người dùng chọn 2026-10-22, xem `docs/ideas.md` mục \"Hướng mở rộng\")\nThứ tự làm (cập nhật sau khi thêm ADR-029/030): ADR-023 → 024 → 025 → 030 (bộ đăng nhập) → 026 phần khung + Excel/CSV → 029 → 026 phần JSON/Ansible → 027 → 028. Migration: v8 (ADR-024), v9 (ADR-030), v10 (ADR-026), v11 (ADR-028). Nếu thứ tự làm đổi thì số migration theo thứ tự thực tế.\n\n## ADR-023: Ký app bằng chứng chỉ ổn định (H-9a) — Đã chốt\n- **Bối cảnh:** ký ad-hoc làm cdhash đổi sau mỗi lần build. ACL Keychain (SecAccess trusted apps, ADR-010) gắn với designated requirement nên mỗi lần `make install` có thể bị hỏi quyền lại.\n- **Quyết định:**\n  - `scripts/build-app.sh` đọc tên identity từ biến môi trường `SSHDESK_SIGN_IDENTITY`. Makefile có biến `SIGN_IDENTITY ?=` và truyền xuống (`make install SIGN_IDENTITY=\"SSH Desk Local\"` hoặc export biến môi trường).\n  - Có identity: kiểm tra tồn tại bằng `security find-identity -p codesigning` (chỉ đọc), rồi ký từng helper trước (`sshdesk-ctty`, `sshdesk-askpass`, CLI ở ADR-025) rồi tới app: `codesign --force --sign \"<identity>\" --identifier <id cố định>`. Không dùng `--deep`. In ra `codesign -d -r-` để người dùng thấy DR. Không bật hardened runtime/timestamp (không cần cho bản cá nhân).\n  - Không có identity, hoặc identity không tìm thấy: ký ad-hoc như cũ và in **cảnh báo** ra stderr (không làm build lỗi).\n  - Tên identity: từ chối nếu có ký tự điều khiển/newline; luôn truyền như một argv đã quote, không `eval`.\n  - Identifier cố định: app `local.sshdesk.app`, helper `local.sshdesk.ctty`, `local.sshdesk.askpass`, CLI `local.sshdesk.cli`.\n- **App không tạo chứng chỉ, không sửa Keychain.** Người dùng tự tạo chứng chỉ \"Code Signing\" tự ký (Keychain Access → Certificate Assistant → Create a Certificate…, loại Code Signing). doc-writer ghi các bước vào README/TESTING.\n- **Rủi ro chấp nhận:** item Keychain tạo khi app còn ký ad-hoc vẫn mang ACL cũ → lần đầu sau khi đổi sang chứng chỉ có thể hỏi quyền một lần (chọn \"Luôn cho phép\" hoặc lưu lại password). Chứng chỉ tự ký không được Gatekeeper công nhận; app build tại máy không bị quarantine nên không ảnh hưởng. Mất/xoá chứng chỉ → quay về ad-hoc.\n- **Đã làm (K1, QA chặn → sửa → PM duyệt):** Makefile export `SSHDESK_SIGN_IDENTITY` qua môi trường (không nội suy vào dòng lệnh shell; tên chứa `$` thì đặt bằng biến môi trường); script từ chối ký tự điều khiển C0/C1; `security` lỗi → cảnh báo riêng rồi ad-hoc; trùng tên → cảnh báo, chấp nhận SHA-1 40 hex; codesign lỗi với identity → hướng dẫn + exit lỗi (không lặng lẽ hạ ad-hoc). Đổi identifier helper sang `local.sshdesk.*` → item Keychain cũ có thể hỏi quyền thêm một lần.\n- **Kiểm chứng (người dùng thử):** build hai lần với cùng identity, so `codesign -d -r-` giống nhau; askpass đọc Keychain sau `make install` lần hai không hỏi lại.\n\n## ADR-024: Agent ngoài qua `IdentityAgent` (H-2a) — Đã chốt\n- **Model:** `HostProfile.identityAgent: String?` (cột `identity_agent TEXT NULL`, migration **v8**). `nil` = theo mặc định trong Cài đặt. Cài đặt có key `ssh.default_identity_agent` (rỗng = hệ thống, tức không ghi directive).\n- **Lựa chọn trong form (chỉ host managed, loại SSH):** Theo mặc định / Hệ thống (`SSH_AUTH_SOCK`) / 1Password (`~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock`) / Bitwarden / Secretive / Tuỳ chỉnh (đường dẫn). Đường dẫn mẫu (researcher K5r): Bitwarden bản .dmg `~/.bitwarden-ssh-agent.sock` (https://bitwarden.com/help/ssh-agent/; bản App Store dùng `~/Library/Containers/com.bitwarden.desktop/Data/.bitwarden-ssh-agent.sock` — không làm preset, dùng Tuỳ chỉnh); Secretive `~/Library/Containers/com.maxgoedjen.Secretive.SecretAgent/Data/socket.ssh` (**chưa có nguồn chính thức**, ghi rõ trong comment và KNOWN_LIMITATIONS). Chưa cài agent nào trên máy → chưa thử thật.\n- **Sinh config:** `SSHConfigWriter` ghi `IdentityAgent \"<giá trị>\"` trong Host block của app (giá trị hiệu lực = host ?? mặc định). Giá trị `SSH_AUTH_SOCK` (chữ) ghi nguyên văn — dùng khi host muốn bỏ mặc định của Cài đặt. Host imported (`existingSSHConfigAlias`) và Windows: không áp dụng (app không sinh block cho họ), UI ẩn/disable.\n- **Validate (Core, có test riêng):** không rỗng; tối đa 1024 byte; cấm `\\n`, `\\r`, NUL, mọi ký tự điều khiển (Unicode Cc) và DEL; phải bắt đầu bằng `/` hoặc `~/`, hoặc đúng chữ `SSH_AUTH_SOCK`; cấm `%` và `$` (ssh mở rộng token/biến môi trường trong IdentityAgent — chặn để giá trị là literal). Quote/escape bằng đúng hàm quote của writer. **Test chống chèn directive:** giá trị chứa newline + `ProxyCommand ...` bị từ chối; `\"` và `\\` được escape đúng (kiểm bằng `ssh -G` với config tạm như các test writer hiện có nếu có sẵn hạ tầng).\n- Socket không tồn tại → chỉ cảnh báo trong form (\"agent chưa chạy?\"), không chặn lưu. Đường dẫn sau khi mở rộng `~` dài hơn 104 byte → cảnh báo.\n- **Màn SSH Keys (tuỳ chọn trong task):** liệt kê public key của agent đã chọn bằng `/usr/bin/ssh-add -L` với `SSH_AUTH_SOCK=<đường dẫn đã mở rộng>` trong env của process con (đường dẫn socket, không phải secret). Chỉ đọc public key; **không bao giờ đọc private key**, không `ssh-add` thêm/xoá key.\n- **Đã làm (K2, QA đạt, PM duyệt):** migration **v8**, `SSHConfig/IdentityAgent.swift` (validator, preset, `IdentityAgentResolution.effective(layers:)` — ADR-030 chèn tầng set), `Keys/AgentKeyLister.swift` (`ssh-add -L`, env chỉ `SSH_AUTH_SOCK`). PM duyệt: picker Agent nằm trong \"Nâng cao\" của form; Cài đặt không có preset \"Hệ thống\" (rỗng = hệ thống); imported/Windows bị ép nil khi lưu và khi nhập; thẻ \"Key trong agent\" ở màn SSH Keys chỉ chọn preset (đường dẫn tuỳ chỉnh lấy từ Cài đặt/host). `ssh -G` xác nhận escape `\"`/`\\\\`.\n- Ghi chú dùng: với agent ngoài nên để IdentityFile trống, hoặc trỏ tới file `.pub` của key trong agent (kèm `IdentitiesOnly yes`) — doc-writer ghi vào README.\n- Analyst/Monitor/Truyền file/Warp đều dùng `-F` config app nên tự hưởng IdentityAgent. **Chưa kiểm chứng:** hộp duyệt Touch ID của agent khi BatchMode=yes (Analyst/Monitor) — có thể hết timeout nếu duyệt chậm.\n\n## ADR-025: CLI `sshdesk` + URL scheme `sshdesk://` (H-6a) — Đã chốt\n- **CLI:** executable SwiftPM tên **`sshdesk-cli`** (không đặt `sshdesk`: APFS không phân biệt hoa thường, trùng với `SSHDesk` trong `.build/release` và `Contents/MacOS`). `build-app.sh` copy vào `Contents/Helpers/sshdesk` và ký (ADR-023). Người dùng tự tạo symlink (vd `ln -s \"/Applications/SSH Desk.app/Contents/Helpers/sshdesk\" ~/bin/sshdesk`); app/Makefile không sửa PATH, không ghi `/usr/local`.\n- Lệnh: `sshdesk list [--folder <tên>] [--json]`, `sshdesk open <id|alias|tên>`, `sshdesk help`. Không có lệnh nào nhận password, lệnh từ xa, hay tham số ssh tuỳ ý. Argv lạ → lỗi, exit 2.\n- **DB chỉ đọc:** mở SQLite `SQLITE_OPEN_READONLY`, `busy_timeout` 2000 ms; schema_version khác bản CLI biết → báo lỗi, không đọc. CLI không ghi SSH config, Tab Config hay DB; không đọc Keychain.\n- `list --json`: mảng `{id, name, alias, folder, environment, kind, hostName, port, user}`; không có credentialReference hay ghi chú.\n- **Giải host (Core, có test):** khớp chính xác theo thứ tự: UUID → alias imported (`sshConfigAlias`) → tên hiển thị (không phân biệt hoa thường/dấu). Nhiều host khớp → lỗi liệt kê id, không chọn bừa. Không fuzzy. Chỉ host SSH (Windows → \"chưa hỗ trợ\" ở v1).\n- **`open` đi qua app (không tự mở Warp):** CLI ghi file yêu cầu `~/Library/Application Support/SSHDesk/requests/<uuid>.json` (0600, thư mục 0700; nội dung chỉ `{hostID, createdAt}`) rồi mở `sshdesk://cli?request=<uuid>` bằng `NSWorkspace`. App đọc file, **xoá ngay**, bỏ nếu quá 30 giây hoặc không tồn tại. Lý do: trang web gọi được URL nhưng không tạo được file trong thư mục app → app phân biệt được yêu cầu từ CLI. Mở host như nút Mở Warp (cùng ConnectionService, cùng quy tắc askpass/tự điền).\n  - CLI: host PROD → **hộp xác nhận trong app**; host khác mở ngay.\n  - Request id lạ/hết hạn → coi như URL từ bên ngoài (xác nhận như dưới) nếu có host, hoặc bỏ qua.\n- **URL scheme** `sshdesk://open?id=<uuid>` hoặc `sshdesk://open?name=<tên|alias>`: khai báo `CFBundleURLTypes` trong Info.plist. **Luôn hiện hộp xác nhận** (tên, môi trường, user@host) trước khi mở, kể cả host không PROD. Chỉ nhận đúng một tham số `id` hoặc `name`; tham số khác, giá trị > 256 ký tự, ký tự điều khiển → từ chối và báo. Không bao giờ nhận lệnh, secret, tham số ssh.\n- Alfred/Raycast: chỉ viết hướng dẫn (Alfred Script Filter gọi `sshdesk list --json`). Không làm extension.\n- **Đã làm (K3, QA đạt sau sửa, PM duyệt):** `Sources/SSHDeskCore/CLI/` (HostResolver, CLIArguments, CLIHostList, CLIOpenRequest, AppURLRequest/OpenOrigin), `Sources/sshdesk-cli/`, `Database.openReadOnly` (READONLY → URI `mode=ro` → `immutable=1` chỉ khi không có `-wal`; không ghi/tạo file), handler `kAEGetURL` + hàng đợi URL (tối đa 4) trong app, `NSAlert` xác nhận (PROD style critical). PM duyệt: bỏ lệnh `template` tới K4a; không tham số/`-h` → help exit 0; exit 3 cũng dùng cho Windows \"chưa hỗ trợ\"; alias imported khớp phân biệt hoa thường (như ssh), tên hiển thị không phân biệt hoa thường/dấu, nhiều kết quả cùng bước → lỗi; tham số `open` bắt đầu bằng `-` bị từ chối; file request đọc bằng `O_NOFOLLOW`+`fstat`, thư mục phải 0700 đúng owner, unlink trước khi phân tích, `createdAt` tương lai >5 giây coi là hết hạn; `cli?request=` không hợp lệ → chỉ thông báo, không mở.\n- **Chưa kiểm chứng (cần người dùng):** URL scheme đăng ký với LaunchServices sau `make install`; Apple Event khi app tắt/đang chạy (SwiftUI `WindowGroup` có thể mở thêm cửa sổ); `sshdesk open` end-to-end; nhánh dự phòng `mode=ro`/`immutable` có thật sự cần không.\n- **Rủi ro chấp nhận:** process cục bộ cùng user ghi được file request → bỏ qua xác nhận cho host không PROD; process đó vốn đã chạy được `ssh` trực tiếp nên không mở thêm quyền.\n\n## ADR-026: Nguồn máy chủ đồng bộ một chiều (H-1) — Đã chốt\n- **Nguồn đợt này, theo ưu tiên:** (1) **Excel `.xlsx` / CSV** (khách hàng thường gửi Excel — người dùng 2026-10-22), (2) file JSON `*.sshdesk.json` (ADR-020), (3) Ansible inventory tĩnh INI/YAML. **Để sau:** \"lệnh xuất JSON\", NetBox/Proxmox/AWS/Zabbix host.get.\n- **DB (migration v10):** bảng `inventory_sources(id, name, kind ('excel'|'csv'|'json'|'ansible'), path, folder, default_environment, config_json, last_synced_at, last_fingerprint)`; cột host `source_id TEXT NULL`, `external_id TEXT NULL`, `source_missing INTEGER 0`. Cột `autofill_hold INTEGER 0`, `autofill_hold_reason TEXT NULL` (chỉ chứa giá trị cũ → mới của HostName/Port/User/jump hoặc tên bộ đăng nhập, không secret) **được thêm sớm ở v9 cùng ADR-030** (PM chốt 2026-10-23) vì gán bộ đăng nhập khi nhập file đã cần hold.\n- **Đồng bộ một chiều, luôn qua màn xem trước:** thêm / đổi (từng trường cũ → mới) / không còn trong nguồn / lỗi. Người dùng bấm Áp dụng → một transaction; lỗi → không ghi gì; sau đó sinh lại SSH config. App phát hiện file nguồn đổi (mtime + fingerprint SHA-256) khi mở app và khi app được kích hoạt → hiện \"Nguồn có thay đổi\" + nút Xem trước; **không tự áp dụng**. Không bao giờ tự xoá host: host biến mất được đánh dấu `source_missing`.\n- **Trường do nguồn quản lý:** tên, HostName, Port, User, môi trường (nếu nguồn có), thư mục (cột thư mục hoặc thư mục mặc định của nguồn), tag nguồn, jump host (chỉ JSON, ánh xạ trong cùng nguồn). Các trường này chỉ đọc trong form; có \"Tách khỏi nguồn\" (gỡ `source_id`). **Trường của app luôn giữ:** ghi chú (trừ khi nguồn có cột ghi chú được ghép), yêu thích, forward, credentialReference, auth method, IdentityFile, IdentityAgent, bookmark.\n- **BẮT BUỘC — tắt tự điền khi địa chỉ đổi:** khi đồng bộ làm đổi `hostName`, `port`, `user` (hoặc `jumpHostID`) của một host, đặt `autofill_hold = 1`. Khi hold: PasswordAutofillPolicy trả false (PTY), ConnectionService không đặt askpass/SSHDESK_HOST_REF (Warp), không copy clipboard (Windows), mọi đường đọc password qua `AutofillGatedCredentialStore` đều bị chặn cho host đó. Chi tiết host hiện banner \"Địa chỉ đổi từ nguồn: cũ → mới. Đã tạm tắt tự điền mật khẩu\" + nút **Xác nhận địa chỉ** (xoá hold). Sửa tay HostName/Port/User qua form cũng không tự xoá hold — chỉ nút xác nhận. Test bắt buộc: đổi từng trường → hold; trường khác đổi → không hold; hold → policy/askpass/clipboard không dùng password; xác nhận → dùng lại.\n- **Không bao giờ nhập password:** nguồn không mang password vào DB/log/ghi chú. Ansible: bỏ qua `ansible_password`, `ansible_ssh_pass`, `ansible_become_pass`, `ansible_become_password`, giá trị `!vault`; cảnh báo \"đã bỏ qua biến mật khẩu\". Excel/CSV: xem dưới.\n- Giá trị từ nguồn qua đúng validator của form/ADR-020 (cấm newline/ký tự điều khiển, port 1–65535...). Tối đa 5000 host mỗi nguồn. File > giới hạn → từ chối.\n- **Excel/CSV:**\n  - Người dùng chọn file → chọn sheet (xlsx) và dòng tiêu đề → **ghép cột** vào: tên, HostName/IP, Port, User, môi trường, thư mục/dự án, ghi chú, cột khoá. App đoán sẵn theo tiêu đề (tiếng Việt có/không dấu + tiếng Anh, không phân biệt hoa thường), vd `IP|Địa chỉ|Address|Host|HostName` → HostName; `Tên|Tên server|Server name|Name` → tên; `Port|Cổng`; `User|Username|Tài khoản|Login`; `Môi trường|Env|Environment`; `Dự án|Project|Thư mục|Nhóm|Folder`; `Ghi chú|Mô tả|Note|Description`.\n  - **Cột khoá** (`external_id`): mặc định cột tên (đổi IP vẫn nhận ra là cùng host → kích hoạt hold); không có cột tên → HostName.\n  - Giá trị môi trường: `prod|production|prd` → PROD, `uat`, `stg|staging`, `dev|development|test` → DEV, còn lại OTHER. Port dạng `22.0` → 22. Thiếu tên → dùng HostName.\n  - Lưu cách ghép (`config_json`: sheet, dòng tiêu đề, map theo **văn bản tiêu đề**, cột khoá) theo từng nguồn → lần sau \"Đồng bộ lại\" hoặc \"Chọn file mới cho nguồn\" (khách gửi bản mới) là một chạm; tiêu đề đổi → mở lại màn ghép cột.\n  - **Cột giống password** (`password|pass|pwd|passwd|mật khẩu|mat khau|mk|secret|passphrase|otp`, so sau khi bỏ dấu/hoa thường, khớp cả từ trong tiêu đề): cảnh báo \"Phát hiện cột mật khẩu — sẽ bỏ qua\" và **không ghép được vào bất kỳ trường nào** (kể cả ghi chú) — Core chặn, có test. Giá trị cột đó không được đọc vào model, không log, không vào preview. Lưu cột này vào kho: **người dùng cho phép 2026-10-23, xem ADR-031** (mặc định vẫn bỏ qua; vẫn không bao giờ ghép vào trường nào của host).\n  - **CSV:** UTF-8 (có/không BOM), UTF-16 có BOM; tự nhận dấu phân cách `,` `;` tab; quote kiểu RFC 4180; ≤ 5 MB.\n  - **XLSX (không dependency):** đọc bằng `/usr/bin/unzip -p <file> <entry>` qua executable + argv (không `sh -c`), stdout qua pipe, parse bằng `XMLParser`. Chi tiết chốt sau khi researcher kiểm chứng (mục \"Kết quả kiểm chứng XLSX\" bên dưới). Giới hạn: file nén ≤ 20 MB; mỗi entry giải nén đọc tối đa 50 MB, tổng 100 MB — vượt thì kill process và từ chối (chống zip bomb, không tin kích thước khai báo trong header); timeout 15 giây; ≤ 5000 dòng dữ liệu, ≤ 200 cột. Tên entry chỉ lấy từ danh sách cố định (`xl/workbook.xml`, `xl/_rels/workbook.xml.rels`, `xl/sharedStrings.xml`) hoặc khớp regex `^xl/worksheets/[A-Za-z0-9_]+\\.xml$` (không wildcard, không `..`). XMLParser: `shouldResolveExternalEntities = false`; gặp DOCTYPE/khai báo entity → từ chối file. **Không tính công thức**: ô có `<f>` chỉ lấy giá trị cache `<v>` nếu có (là dữ liệu tĩnh), đếm và cảnh báo. Không đọc `xl/externalLinks/*`, hyperlink, `vbaProject.bin`; chỉ nhận đuôi `.xlsx` (từ chối `.xlsm`/`.xls`).\n- **File Excel mẫu — luồng chính (người dùng yêu cầu 2026-10-22, xếp trước ghép cột tự do):**\n  - Sheet \"Máy chủ\", tiêu đề dòng 1 cố định: `Tên`, `IP/Hostname`, `Port`, `User`, `Môi trường`, `Thư mục/Dự án`, `Loại`, `Jump host`, `Bộ đăng nhập`, `Ghi chú`. **Không có cột password.** `Bộ đăng nhập` chỉ là **tên** bộ (ADR-030); tên chưa có → xem trước báo \"sẽ tạo bộ rỗng\", người dùng nhập password sau. Port trống → 22 (SSH) / 3389 (Windows). Môi trường: DEV/UAT/STG/PROD (trống → OTHER). Loại: SSH/Windows (trống → SSH). Jump host = **tên** host khác (trong cùng file trước, rồi host đã có theo tên chính xác; không thấy → cảnh báo, để trống; Windows không có jump host). Với Windows, `User` → `rdpUsername`.\n  - Sheet \"Hướng dẫn\": giải thích từng cột, giá trị hợp lệ, dòng ví dụ; ô A1 chứa dấu phiên bản `sshdesk-template v1`.\n  - Data validation (dropdown) cho Môi trường và Loại bằng `<dataValidations>` trong XML sheet (không dependency).\n  - **Cách tạo (PM chọn cách 2):** Core sinh các entry XML (`[Content_Types].xml`, `_rels/.rels`, `xl/workbook.xml`, `xl/_rels/workbook.xml.rels`, `xl/styles.xml`, 2 sheet, chuỗi inline `inlineStr` để khỏi cần sharedStrings) vào thư mục tạm của app, nén bằng `/usr/bin/zip -X -r` qua executable + argv (cwd = thư mục tạm, không `sh -c`), rồi chuyển tới đường dẫn người dùng chọn (NSSavePanel), xoá thư mục tạm. Lý do: có test round-trip (sinh → đọc lại bằng chính reader XLSX → đúng tiêu đề/validation), không phải giữ file nhị phân bị lệch với code. Bản trong repo `docs/templates/sshdesk-hosts-template.xlsx` sinh bằng `make template` (gọi `sshdesk-cli template <đường dẫn>`, chỉ ghi file mới, không ghi đè).\n  - Nút **\"Tải file mẫu…\"** ở màn nhập/nguồn.\n  - Nhận ra file đúng mẫu khi dòng 1 của sheet đầu khớp đúng bộ tiêu đề (không phân biệt hoa thường/khoảng trắng thừa) hoặc có dấu `sshdesk-template v1` → **bỏ qua bước ghép cột**, vào thẳng xem trước. Khoá (`external_id`) = cột Tên.\n  - **Lỗi theo dòng:** mỗi lỗi có số dòng Excel, cột, lý do (IP/Hostname sai, Port ngoài 1–65535, Môi trường/Loại không hợp lệ, thiếu Tên/IP, trùng tên với dòng N, jump host trỏ chính nó...). Dòng lỗi bị bỏ qua, dòng hợp lệ vẫn nhập được; lỗi một dòng không làm hỏng cả file. Dòng trống hoàn toàn bỏ qua im lặng.\n  - Màn xem trước có lựa chọn \"Lưu làm nguồn để đồng bộ lại\" (mặc định bật) — áp dụng đúng quy tắc đồng bộ/hold ở trên.\n- **Kết quả kiểm chứng XLSX (researcher K4r, 2026-10-22; UnZip 6.00 / Zip 3.0 của Apple):**\n  - `unzip -p` in ra stdout, không ghi file. Tên entry là **wildcard** (`[ ] * ?`), không có `-W`/`--` → chỉ dùng tên cố định hoặc khớp regex không có ký tự wildcard (regex trên đã đảm bảo). Không cần đọc `[Content_Types].xml`.\n  - Chạy unzip với **env rỗng** (unzip đọc biến `UNZIP`). **Exit ≠ 0 → bỏ toàn bộ dữ liệu** (CRC hỏng vẫn in dữ liệu ra stdout, exit 2; entry thiếu exit 11; không phải zip exit 9).\n  - Trước khi đọc: `unzip -Z1 <file>` liệt kê tên; **từ chối nếu tên trùng** (`-p` nối nội dung hai entry trùng tên, exit 0), có `..` hoặc đường dẫn tuyệt đối.\n  - Zip bomb: 200 MB số 0 nén còn ~0,9 MB (229:1), kích thước khai báo không đáng tin → cap theo byte thực khi stream là lớp bảo vệ chính; vượt cap → app tự terminate process.\n  - XMLParser: `shouldResolveExternalEntities` mặc định false nhưng **không có callback cho DOCTYPE** → quét byte, từ chối nếu có `<!DOCTYPE` hoặc `<!ENTITY` trước khi parse; đặt false tường minh; chỉ nhận UTF-8.\n  - Kiểu ô cần xử lý: `s` (sharedStrings, `<si>` gồm `<t>` hoặc nhiều `<r><t>`, bỏ `<rPh>`), `inlineStr`, `str`, `n` (mặc định khi thiếu `t`), `b`, `e` (lỗi → trống + cảnh báo), `d`. Ô có `<f>` chỉ lấy `<v>` (có thể thiếu → trống). Ô định vị theo thuộc tính `r` (có thể bỏ qua ô trống). `sharedStrings.xml` có thể không có.\n  - Target trong `workbook.xml.rels`: tương đối (`worksheets/sheet1.xml`, gốc `xl/`) hoặc tuyệt đối (`/xl/worksheets/sheet1.xml`); `TargetMode=\"External\"` → từ chối. Thứ tự sheet theo `<sheets>`; sheet ẩn (`state=\"hidden\"`/`veryHidden`) không hiện trong danh sách chọn.\n  - CSV: bỏ BOM UTF-8 `EF BB BF`; nhận UTF-16 LE BOM `FF FE`.\n  - Tạo file mẫu: `zip -X -D -r` (không entry thư mục), argv, cwd = thư mục tạm; thứ tự phần tử worksheet `sheetData → dataValidations → pageMargins`; XML tối thiểu đã thử (Spotlight/QuickLook nhận đúng là workbook, hiện đúng dữ liệu) nằm ở `scratchpad/k4r/xlsx/pkg/` của phiên PM — coder dùng lại cấu trúc này. **Chưa kiểm chứng:** mở trong Excel/Numbers và dropdown → người dùng thử file mẫu.\n- **Đã làm (K4a, QA chưa đạt → sửa → PM duyệt):** migration **v10**, `Sources/SSHDeskCore/Inventory/` (BoundedProcess, XLSXReader, CSVReader, ColumnMapping, InventoryTableParser, InventorySync, InventoryRepository, InventoryTemplate, InventoryFile), CLI `sshdesk template`, `make template` → `docs/templates/sshdesk-hosts-template.xlsx`, UI hub \"Nguồn máy chủ\". **unzip hiểu cả đường dẫn file zip là wildcard** (QA tái hiện) → reader copy file vào thư mục tạm 0700 tên cố định `in.xlsx` rồi mới gọi unzip. PM duyệt: cột mật khẩu bị xoá giá trị ngay trong TableBuilder, nhận diện cả biến thể `_`/`-`/không dấu và `token`, `api key`, `credential` (hệ quả: tiêu đề tiếng Anh \"Credential Set\" cũng bị coi là cột bí mật — dùng tiêu đề \"Bộ đăng nhập\"); host mới `.interactive` nếu có bộ, không thì `.agent`; ô Jump host trống → xoá jump; ô Bộ đăng nhập trống không gỡ bộ; khoá external_id so không phân biệt hoa thường; dòng lỗi có khoá không bị coi là \"biến mất\"; đổi loại SSH↔Windows → lỗi dòng; hold đã có → nối lý do (≤500 ký tự); fingerprint `sha256|mtime|size`; Core không chặn sửa trường nguồn (form khoá, \"Tách khỏi nguồn\" là đường hợp lệ). File mẫu có thêm cột rộng, chữ đậm và validation Port 1–65535 so với XML tối thiểu đã kiểm chứng — **chưa mở thử trong Excel/Numbers**.\n- **JSON:** đúng định dạng `sshdesk-hosts` v1 (ADR-020); `external_id` = `id` trong file.\n- **Ansible tĩnh (tự parse, KHÔNG gọi `ansible-inventory` hay bất kỳ process nào):** INI (`[group]`, `[group:vars]`, `[group:children]`, `[all:vars]`, khoảng `web[01:03]` mở rộng có giới hạn) và YAML tập con (`all/hosts/children/vars`, mapping, scalar, quote, comment; anchor/alias/tag `!` khác ngoài `!vault` → báo lỗi dòng). Lấy `ansible_host`/`ansible_ssh_host`, `ansible_port`/`ansible_ssh_port`, `ansible_user`/`ansible_ssh_user` (biến host > group > all); tên group → tag. Không đọc `host_vars/`, `group_vars/`. `external_id` = tên host trong inventory.\n- **Đã làm (K4b, QA đạt có điều kiện → sửa → PM duyệt):** `Inventory/AnsibleYAML.swift`, `AnsibleInventory.swift`, `InventoryStructured.swift` (không process; test quét nguồn). PM duyệt: tag từ nguồn **chỉ cộng thêm** (không gỡ tag người dùng; ≤100/host, khử trùng không phân biệt hoa thường; Ansible lấy group tổ tiên, trừ all/ungrouped); thiếu `ansible_user` → **chỉ host mới** dùng tên đăng nhập macOS (`NSUserName()`, có cảnh báo), host đã có giữ user; ưu tiên biến cùng tầng như Ansible; chỉ giữ 6 biến kết nối, biến tên giống mật khẩu cảnh báo theo tên; lỗi cú pháp YAML = lỗi cả file, lỗi host = bỏ host; pattern host ≤255 ký tự và ≤8 khoảng (chống O(n²)); tổ tiên group có memo, cắt ở 32 cấp/256 tổ tiên; YAML tập con không hỗ trợ chuỗi nhiều dòng/danh sách (báo lỗi dòng); \"Dòng N\" của JSON = thứ tự trong mảng `hosts`; ghi chú trống trong JSON không ghi đè.\n- UI: menu thư mục \"Nguồn…\" (thêm/sửa/xoá nguồn, Đồng bộ, Xem trước); host từ nguồn có huy hiệu nguồn và \"Không còn trong nguồn\".\n\n## ADR-027: Khoá Secure Enclave có sẵn của macOS (H-2b) — Đã chốt (kiểm chứng K5r 2026-10-22)\n- **Kiểm chứng (researcher, macOS 27.0.1, OpenSSH_10.3p1):** `/usr/lib/ssh-keychain.dylib` có `sk_api_version/sk_enroll/sk_sign/sk_load_resident_keys`; `sc_auth create-ctk-identity -l <label> -k p-256-ne -t none -N <label>` (không sudo) → `ssh-keygen -w /usr/lib/ssh-keychain.dylib -K` (trong thư mục tạm) tạo handle `id_ecdsa_sk_rk_<label>` + `.pub` (loại `sk-ecdsa-sha2-nistp256@openssh.com`) → `ssh -o SecurityKeyProvider=/usr/lib/ssh-keychain.dylib -i <handle>` đăng nhập được sshd tạm 127.0.0.1. Thiếu `SecurityKeyProvider` → `Permission denied`. `sc_auth delete-ctk-identity -h <SHA1>` xoá được nhưng **exit 0 cả khi lỗi** → phải kiểm output và `list-ctk-identities` sau khi xoá. **Chưa kiểm chứng:** `-t bio` (Touch ID mỗi lần ký), hành vi prompt PIN/passphrase của `-K` khi chạy từ app.\n- **Quyết định (K5):**\n  - Màn SSH Keys: nút \"Tạo khoá Secure Enclave…\": nhãn `[A-Za-z0-9._-]{1,64}`, chưa trùng với identity có sẵn (`sc_auth list-ctk-identities`); lựa chọn bảo vệ **Touch ID (`-t bio`, mặc định)** / Không (`-t none`). Chạy `/usr/sbin/sc_auth create-ctk-identity -l <label> -k p-256-ne -t <bio|none> -N <label>` (argv), rồi `/usr/bin/ssh-keygen -w /usr/lib/ssh-keychain.dylib -K` qua PTYProcess với **cwd là thư mục tạm của app** (vì `-K` xuất mọi resident key); PIN để trống (Enter), passphrase cho file handle để trống (file chỉ là tham chiếu, key không rời chip). Chỉ chuyển cặp file của đúng nhãn mới sang `~/.ssh/` (tên `id_ecdsa_sk_rk_<label>`), **không ghi đè** file đã có (có thì báo lỗi), quyền 0600/0644; xoá thư mục tạm. Không đụng `~/.ssh/config`.\n  - Khoá SE nhận diện bằng `.pub` loại `sk-ecdsa-sha2-nistp256@openssh.com` (chỉ đọc .pub). Host (hoặc set, ADR-030) dùng identityFile là khoá SE → SSHConfigWriter ghi thêm `SecurityKeyProvider \"/usr/lib/ssh-keychain.dylib\"` vào Host block. Không ghi toàn cục.\n  - Cài lên server: dùng E1 (`ssh-copy-id -i <handle>.pub`).\n  - Xoá: \"Xoá khoá Secure Enclave\" (xác nhận, cảnh báo không khôi phục được) → `sc_auth delete-ctk-identity -h <SHA1>` lấy từ `list-ctk-identities` theo nhãn; kiểm lại bằng list; rồi xoá cặp file handle trong `~/.ssh` chỉ khi đúng tên `id_ecdsa_sk_rk_<label>`.\n  - Test: dùng `-t none` + sshd tạm 127.0.0.1 + thư mục tạm (không ghi `~/.ssh` thật trong test: tham số hoá thư mục đích), dọn identity trong `defer`. Test SE chạy có điều kiện (bỏ qua nếu thiếu dylib/sc_auth).\n\n- **Đã làm (K5, QA đạt, PM duyệt):** `Keys/SecureEnclaveKeyService.swift` (list/create/delete, `SecureEnclaveKeyDetector` đọc `.pub` ≤16 KB không theo symlink), `PTYProcess` thêm `currentDirectory` (kiểm rc chdir), writer ghi `SecurityKeyProvider` theo identityFile hiệu lực (host thắng bộ). PM duyệt: chỉ trả lời Enter trống cho PIN/passphrase của `ssh-keygen -K`, prompt khác → huỷ; file chuyển sang `~/.ssh` bằng `link()` (không ghi đè); identity tạo ngoài app (khác `p-256-ne` hoặc nhãn không hợp lệ) chỉ xem; nhiều identity trùng nhãn → từ chối xoá; timeout 90 giây, không có nút Huỷ; test SE thật chạy tuần tự trong `ProcessGroup`. **Chưa kiểm chứng:** `-t bio` khi tạo và khi ký (Warp/Analyst), `ssh-copy-id` với `.pub` sk-ecdsa trên server thật.\n\n## ADR-028: Monitor đọc từ Prometheus/Zabbix (H-7) — Đã chốt\n- **Bổ sung, không thay thế** Monitor qua SSH (ADR-019). Mỗi thư mục trong Monitor chọn nguồn số liệu: SSH (mặc định) / một nguồn metrics đã cấu hình.\n- **DB (migration v11):** `metric_sources(id, name, kind ('prometheus'|'zabbix'), base_url, auth_kind ('none'|'bearer'|'basic'), basic_user, credential_ref, instance_template, allow_insecure_http INTEGER 0, created_at)`; bảng/khoá cài đặt gán thư mục → nguồn. Token/password **chỉ trong Keychain** (`credential_ref`, qua `CredentialStore` (ADR-004b, account `metrics-<uuid>`)), không vào DB/log/URL/argv/env; gửi qua header `Authorization` trên URLSession.\n- **Chỉ API đọc:** Prometheus `GET /api/v1/query` (instant) với bộ truy vấn node_exporter cố định (CPU %, RAM, swap, load, đĩa theo `mountpoint`, uptime); nhãn ghép host theo mẫu `instance_template` (mặc định `{{hostName}}:9100`), giá trị nhãn escape theo cú pháp chuỗi PromQL và cấm ký tự điều khiển. Zabbix JSON-RPC `api_jsonrpc.php` chỉ whitelist `apiinfo.version`, `host.get`, `item.get` (key `system.cpu.util`, `vm.memory.utilization`, `system.cpu.load[all,avg1]`, `vfs.fs.size[<mount>,pused]`, `system.uptime`); token API: Zabbix ≥ 7.0 qua header Bearer, bản cũ qua trường `auth`. Không hỗ trợ `user.login` bằng password.\n- **TLS:** không bao giờ tắt kiểm tra chứng chỉ (không custom `URLSessionDelegate` chấp nhận mọi cert). CA nội bộ → người dùng tự tin cậy trong macOS. `http://` → **cảnh báo** đỏ trong form và trên Monitor; nếu có token/password và host không phải loopback → phải tick \"Tôi hiểu token gửi không mã hoá\" (`allow_insecure_http`) mới lưu được. Info.plist thêm `NSAppTransportSecurity` → `NSAllowsLocalNetworking = true`; **không** `NSAllowsArbitraryLoads`. Theo tài liệu Apple (K5r), khoá này chỉ mở http tới **IP literal, tên không có dấu chấm và `.local`** — http tới FQDN (kể cả FQDN nội bộ như `prom.corp.example.com`) vẫn bị ATS chặn → app báo lỗi rõ \"ATS chặn http tới tên miền; dùng https hoặc IP\". **Đã đổi theo ADR-028b (người dùng chọn bỏ chặn 2026-10-23).**\n- Làm mới mỗi 30 giây (15/30/60), chỉ khi màn Monitor đang hiện; timeout 10 giây; phản hồi > 5 MB → bỏ. Lỗi hiện trên thẻ, không lộ header. Log chỉ có URL không query, mã lỗi.\n- Test: `URLProtocol` giả (không mạng) cho parser/escape/header; có thể thêm HTTP server giả trên 127.0.0.1. Không gọi server thật.\n- **Đã làm (K6, QA đạt → sửa → PM duyệt):** migration **v11** (`metric_sources`, `metric_folder_sources(folder PK, source_id FK CASCADE)`), `Sources/SSHDeskCore/Metrics/` (MetricsSource, Repository/Service, MetricsTransport với `URLSessionDataDelegate` đọc theo chunk + cap 5 MB, chặn MỌI redirect, session ephemeral không cookie/cache, không xử lý challenge TLS), PrometheusClient (6 truy vấn cố định), ZabbixClient (3 method enum), MetricsMonitorCoordinator, mục Cài đặt \"Nguồn số liệu\", picker nguồn trên Monitor. PM duyệt: token metrics đọc từ kho thô, KHÔNG qua cổng tự điền (tắt tự điền mật khẩu SSH không ảnh hưởng metrics); Zabbix chỉ none/bearer (không basic); `apiinfo.version` gửi không xác thực, \"Thử kết nối\" có token thì gọi thêm `host.get limit 1`; lỗi xác thực Zabbix trả HTTP 200 + error → coi như unauthorized, không tự thử lại; đổi origin/kiểu xác thực/user basic → bắt nhập lại secret; Zabbix lấy thêm tổng RAM/đĩa, số nhân, load 5/15, không có swap; gán nguồn theo **tên** thư mục (đổi tên thư mục → về SSH); nguồn metrics không hỏi xác nhận PROD (không chạy lệnh trên server). Chưa kiểm chứng: Prometheus/Zabbix/TLS thật, ATS runtime.\n- **Không làm đợt này:** nhật ký phiên cục bộ (tuỳ chọn trong H-7), cảnh báo/thông báo macOS, Grafana link.\n\n## ADR-029: Hỏi mật khẩu lần đầu + \"Lưu vào Keychain\" — Đã chốt (người dùng đề xuất 2026-10-22, làm ngay sau K4a)\n- **Bối cảnh:** host nhập từ Excel/nguồn chưa có password; askpass hỏi qua `/dev/tty` mỗi lần, không có cách lưu ngay.\n- **Khi nào hiện sheet (Core `MissingPasswordPrompt.decide`, có test bảng):** tất cả điều kiện: host loại SSH; `authMethod == .interactive`; chưa có `credentialReference` (hoặc item Keychain không tồn tại); `jumpHostID == nil`; không `autofill_hold` (ADR-026); Cài đặt \"Tự điền mật khẩu đã lưu\" bật; Cài đặt mới **\"Hỏi mật khẩu khi máy chưa lưu\"** (`security.prompt_missing_password`, mặc định bật) bật. Thiếu một điều kiện → luồng cũ (askpass/PTY hỏi như hiện nay).\n- **Sheet \"Nhập mật khẩu cho user@host\":** SecureField, checkbox **\"Lưu vào Keychain\"** (mặc định bật), nút \"Tiếp tục\", \"Bỏ qua, nhập trong terminal\" (Warp) / \"Huỷ\". Host PROD: xác nhận PROD trước, rồi mới hiện sheet.\n- **Có tích lưu → kiểm tra trước khi lưu:** kết nối thử ngắn qua PTY dùng `SessionConnector`/`RemoteSession` (mở master `ControlMaster` rồi `-O exit`) với credential **trong bộ nhớ** (CredentialStore tạm, không Keychain), tự điền đúng một lần theo `PasswordAutofillPolicy`. Không `StrictHostKeyChecking=no`; `BatchMode=no`; timeout 20 giây.\n  - Thành công → `ConnectionService.savePassword` (Keychain, ADR-010) → mở Warp như bình thường (askpass tự điền). Master thử được đóng; Analyst/Monitor/Truyền file có thể dùng lại master qua SessionPool thay vì đóng.\n  - Sai mật khẩu (prompt password lần hai hoặc `Permission denied`) → \"Sai mật khẩu\", cho nhập lại; không lưu.\n  - Gặp prompt host key (máy mới/đổi key) → dừng thử, báo \"Chưa xác nhận host key — hãy mở terminal lần đầu (Bỏ qua, nhập trong terminal)\"; không tự trả lời yes. Prompt khác (OTP/MFA) → dừng thử, cùng thông báo.\n  - Lỗi mạng/timeout → hỏi \"Không kiểm tra được. Vẫn lưu?\" — mặc định **Không**.\n- **Không tích lưu:** Warp → không giữ password, mở Warp như hiện nay, người dùng gõ trong terminal (password không qua env/argv/file tạm/Tab Config). Analyst/Monitor/Truyền file → password chỉ trong bộ nhớ cho đúng phiên/job đó (CredentialStore trong bộ nhớ gắn với phiên), bỏ khi phiên đóng; không ghi đâu cả.\n- **Windows (ADR-018):** host Windows chưa có password và bấm Mở → sheet SecureField + \"Lưu vào Keychain\" (không kiểm tra được) → copy clipboard theo ADR-018; không tích → copy một lần, không lưu.\n- **Đã làm (K4c, QA đạt, PM duyệt):** `Credentials/MissingPasswordPrompt.swift`, `PasswordVerifier.swift` (thêm kết quả `hostKeyChanged` tách khỏi `hostKeyUnconfirmed`), `PasswordEntryService.swift`, `EphemeralPasswordVault.swift` (kho tạm gắn owner + `user@hostName:port` lúc nhập; đổi địa chỉ → bỏ mục tạm; bọc: cổng tự điền → vault → SE), ref tạm `verify-`/`ephemeral-` bị `validate` chặn ghi DB. PM duyệt: verifier luôn đóng master (mở thêm một kết nối); host imported alias không hỏi (app không biết user@host thật); Analyst/Monitor hỏi tuần tự, huỷ = bỏ qua máy; Truyền file chỉ hỏi ở sheet Tải về/Tải lên (job từ tab Duyệt file dùng master của tab); picker \"bộ có sẵn\" chỉ liệt kê bộ đã có password; Warp không tích lưu → không nhận password, người dùng gõ trong terminal. Ghi nhận: nút Mở Warp trong UI vốn không có xác nhận PROD (chỉ URL/CLI có) — hành vi cũ, không đổi.\n- **Rủi ro chấp nhận:** password nằm trong bộ nhớ app (String Swift không xoá được chủ động) trong thời gian phiên — giống luồng PTY hiện có.\n\n## ADR-030: Bộ đăng nhập dùng chung (credential set) — Đã chốt (người dùng đề xuất 2026-10-22)\n- **Model (migration v9):** bảng `credential_sets(id TEXT PK, name TEXT UNIQUE COLLATE NOCASE, user TEXT NULL, identity_file TEXT NULL, identity_agent TEXT NULL, note TEXT, created_at, updated_at)`; cột host `credential_set_id TEXT NULL` (xoá set → gỡ khỏi host, không xoá host). Password của set chỉ trong Keychain (service hiện có), account = **tham chiếu tất định `set-<uuid set>`** — không lưu ref riêng trong DB.\n- **Quy tắc nguồn password (rõ ràng, một chỗ):** `HostProfile.effectiveCredentialReference` (thuần) = `credentialReference` riêng nếu có (không rỗng) → **ưu tiên riêng**; không thì `set-<credentialSetID>` nếu có set; không thì nil. **Mọi chỗ** đang đọc `host.credentialReference` để lấy password (ConnectionService/askpass `SSHDESK_HOST_REF`, PasswordAutofillPolicy, SessionConnector, TransferManager, TunnelManager, SSHKeyInstaller, Windows clipboard, AutofillGatedCredentialStore) chuyển sang `effectiveCredentialReference`. Chỗ ghi/xoá password riêng giữ `credentialReference`. UI chi tiết host ghi rõ nguồn: \"Mật khẩu riêng\" / \"Bộ đăng nhập: <tên>\" / \"Mật khẩu riêng (ưu tiên hơn bộ <tên>)\" + nút \"Xoá mật khẩu riêng\".\n- **Set chứa cả key (người dùng yêu cầu 2026-10-22):** mỗi phần đều tuỳ chọn: user, password (Keychain `set-<uuid>`), **IdentityFile** (chỉ lưu đường dẫn, chọn bằng NSOpenPanel hoặc từ danh sách key E1; KHÔNG đọc nội dung private key), **passphrase của key** (Keychain, account tất định `setkey-<uuid>`), **IdentityAgent** (ADR-024). E1 chưa có cơ chế lưu passphrase → đây là cơ chế mới, chỉ dùng cho set.\n- **Một bộ giải quyết duy nhất** `CredentialResolution.resolve(host:set:settings:)` (Core, thuần, có test) trả `user`, `identityFile`, `identityAgent`, `passwordRef`, `passphraseRef`, `passphraseKeyPath`. **Quy tắc ưu tiên nhất quán: giá trị riêng của host > set > mặc định Cài đặt (chỉ IdentityAgent).** Cụ thể: user = host.user nếu không rỗng, không thì set.user; identityFile = host.identityFile nếu có, không thì set.identityFile; identityAgent = host.identityAgent nếu khác nil, không thì set.identityAgent, không thì mặc định Cài đặt; passwordRef như dưới. Host `.keyFile` hợp lệ khi identityFile hiệu lực có (từ host hoặc set). SSHConfigWriter, ConnectionService, PTY/askpass, Analyst/Monitor/Truyền file/Tunnel/E1 đều lấy từ bộ giải quyết này — không đọc thẳng trường của host/set.\n- **Sinh config:** host có identityFile hiệu lực → `IdentityFile \"<path>\"` + `IdentitiesOnly yes`; identityAgent hiệu lực → `IdentityAgent \"<path>\"`. Validate đường dẫn key của set bằng đúng validator IdentityFile hiện có (cấm newline/CR/NUL/ký tự điều khiển, quote/escape của writer) và IdentityAgent theo ADR-024 — kiểm khi lưu set **và** khi sinh config. Đổi key/agent của set → sinh lại config ngay khi lưu set, mọi host dùng set nhận giá trị mới.\n- **Tự điền passphrase:** chỉ khi prompt đúng dạng `Enter passphrase for key '<path>':` và `<path>` (sau khi mở rộng `~` của giá trị trong set) **trùng chính xác** identityFile hiệu lực lấy từ set; tối đa 1 lần mỗi tiến trình ssh/phiên; mọi chặn của tự điền (tắt tự điền, `autofill_hold`, jumpHost) áp dụng như password. Askpass (Warp): env thêm `SSHDESK_KEY_REF=setkey-<uuid>` và `SSHDESK_KEY_PATH=<đường dẫn>` (tham chiếu + đường dẫn, không phải secret); helper chỉ trả passphrase khi prompt khớp đúng path. **PTY: KHÔNG tự điền passphrase** (PM chốt sau QA K4s: server có thể in prompt/banner giả `Enter passphrase for key '<path>':`, passphrase rơi vào prompt password kế tiếp và bị gửi lên server — passphrase là secret server không bao giờ được thấy). Truyền file/Tunnel/Duyệt file/Analyst/Monitor/Cài key gặp prompt passphrase → luôn hỏi người dùng bằng thẻ prompt. Askpass chỉ nhận prompt **bắt đầu đúng** bằng `Enter passphrase for key '` — OpenSSH ≥ 8.4 thêm tiền tố `(user@host) ` cho mọi prompt keyboard-interactive do server gửi, nên prompt giả qua kbd-int không khớp. Path trong prompt bị OpenSSH cắt ở 100 byte (`%.100s`) — so khớp theo phần đã cắt (kiểm chứng K4s với sshd tạm). Passphrase không bao giờ vào config, argv, env (chỉ ref), log, DB. Dạng prompt chính xác của OpenSSH 10.3 (path đã mở rộng hay nguyên văn) phải kiểm chứng bằng sshd tạm trong test.\n- **File key mất/đổi chỗ:** kiểm `fileExists` (không đọc nội dung) khi mở màn set, chi tiết host và trước khi kết nối → cảnh báo \"Không thấy file key <path>\". Không tự tìm, không quét `~/.ssh`.\n- Màn quản lý hiện **loại set**: Password / Key / Password + Key / Agent (kết hợp theo phần đã có) và số host đang dùng.\n- **Quy tắc tự điền KHÔNG đổi:** chỉ điền khi prompt khớp `user@hostName` của chính host (ADR-010/010b), không jumpHost, `autofill_hold` và \"tắt tự điền\" vẫn chặn. Set chỉ đổi nguồn password. `set.user` chỉ là gợi ý: khi gán, user của host khác `set.user` → cảnh báo, không tự sửa.\n- **Chống chuyển password sang máy lạ qua file:** gán set đến từ **nhập/đồng bộ** (Excel, JSON, nguồn ADR-026) — kể cả host mới — đặt `autofill_hold` cho host đó (lý do \"Bộ đăng nhập <tên> được gán từ file\") tới khi người dùng xác nhận. Gán bằng tay trong app (form, gán hàng loạt) không hold.\n- **Quản lý:** Cài đặt → Bảo mật → \"Bộ đăng nhập\": tạo (tên, user tuỳ chọn, ghi chú, password tuỳ chọn), đổi tên, đặt/đổi password (áp dụng cho mọi host dùng set), xem danh sách host dùng set, xoá (hiện số host bị ảnh hưởng, xác nhận, gỡ khỏi host, xoá item Keychain). Tên: 1–100 ký tự, không ký tự điều khiển, duy nhất (không phân biệt hoa thường).\n- **Gán:** picker \"Bộ đăng nhập\" trong form host (chỉ SSH + `.interactive`, và Windows có mật khẩu); \"Gán bộ đăng nhập…\" cho cả thư mục (menu thư mục) và cho nhiều host chọn cùng lúc nếu bảng hỗ trợ chọn nhiều (không có thì chỉ làm theo thư mục). Gán hàng loạt hiện xem trước số host và các host có mật khẩu riêng (vẫn ưu tiên riêng).\n- **Sheet hỏi password lần đầu (ADR-029):** thêm lựa chọn lưu: \"Chỉ lưu cho máy này\" / \"Dùng bộ đăng nhập có sẵn\" (picker) / \"Lưu thành bộ mới: [tên]\". Luôn kiểm tra đăng nhập trước khi lưu. Chọn bộ có sẵn: kiểm tra bằng password của bộ (không nhập lại); đúng → gán; sai → báo \"Mật khẩu của bộ không đúng với máy này\", **không ghi đè password của set** trừ khi người dùng nhập password mới và xác nhận rõ \"Cập nhật mật khẩu của bộ (ảnh hưởng N máy)\".\n- **Xuất/nhập (ADR-020):** xuất chỉ tên set (`credentialSet`), không password, không passphrase, không ref, **không đường dẫn key/agent của set** (định nghĩa set là cấu hình của máy này; IdentityFile riêng của host vẫn xuất như ADR-020 hiện làm). Nhập: tên set chưa có → tạo set rỗng; host dùng set chưa có password → `needsReauth` (ghi chú/badge \"cần nhập mật khẩu\"). Gán set qua nhập → hold như trên.\n- **\"Xoá mọi mật khẩu đã lưu\" (ADR-021)** xoá cả item Keychain của mọi set (giữ set và việc gán, set thành rỗng); số mục liệt kê gồm cả set.\n- **Đã làm (K4s, QA chặn → sửa → PM duyệt):** migration **v9** (`credential_sets`; host `credential_set_id`, `autofill_hold`, `autofill_hold_reason`), target `CredentialBackend` (mọi `SecItem*` chỉ ở đây; helper askpass dùng chung; protocol có `status(ref:)` missing/present/undecryptable cho ADR-004c), `CredentialResolution`, `HostProfile.autofillCredentialReference` (nil khi hold) — test quét nguồn đảm bảo `credentialReference` thô chỉ đọc ở file cho phép. PM duyệt: hold chặn ở nơi gọi (AutofillGatedCredentialStore giữ cờ toàn cục); bảng máy chủ chỉ chọn một dòng → \"Gán bộ đăng nhập…\" theo thư mục; `HostProfile.validate` vẫn bắt buộc `user` của host managed (set.user chỉ gợi ý); bộ chỉ gán cho host managed/Windows; nhập JSON host `.agent` bỏ bộ kèm cảnh báo; xoá bộ lỗi kho → báo \"đã xoá bộ nhưng chưa dọn hết\"; sửa bộ bỏ key khi còn host `.keyFile` dựa vào → xác nhận kèm số host. **Đã tắt tự điền passphrase qua PTY** (xem trên).\n- **Test bắt buộc:** effectiveCredentialReference (riêng > set > nil); CredentialResolution (set chỉ có key, set có cả password + key, host ghi đè set từng trường, agent host > set > Cài đặt); writer với path set chứa newline/CR/ký tự điều khiển → từ chối, `\"`/`\\\\` escape đúng; passphrase chỉ điền khi path khớp, không lọt vào config/argv/env/log; đọc password theo set qua mọi đường (policy, askpass command, PTY); prompt không khớp → không điền dù set có password; hold/tắt tự điền chặn set; xoá set gỡ host + xoá Keychain; đổi password set áp cho mọi host; export không chứa password/ref; nhập gán set → hold; \"Xoá mọi mật khẩu\" xoá item set.\n\n## ADR-004b: Một kho secret duy nhất qua `CredentialStore` — Đã chốt (người dùng chốt 2026-10-22)\n- Password và passphrase **chỉ lưu ở MỘT kho**. Hiện là Keychain (service `local.sshdesk.credentials`). Không thêm kho thứ hai; không lấy password từ `op`/`bw` CLI (H-2d bỏ). Token Prometheus/Zabbix (ADR-028) cũng đi qua cùng abstraction (cùng backend, account/tiền tố riêng `metrics-<uuid>`, không service riêng).\n- **Mọi** đọc/ghi/xoá password, passphrase (host, bộ đăng nhập ADR-030, passphrase key, Windows ADR-018, token metrics) đi qua protocol `CredentialStore` (bọc bởi `AutofillGatedCredentialStore` cho đường tự điền). Không chỗ nào gọi `SecItem*` trực tiếp ngoài backend. Helper `sshdesk-askpass` (target riêng) phải dùng **cùng mã backend** (tách backend vào target nhỏ dùng chung nếu cần), không tự viết truy vấn Keychain riêng — coder K4s xử lý khi đụng askpass.\n- Tham chiếu dạng chuỗi (`<uuid>`, `set-<uuid>`, `setkey-<uuid>`, `metrics-<uuid>`) là account trong backend; DB chỉ giữ tham chiếu.\n- **Backend: Secure Enclave + ECIES** (người dùng chọn 2026-10-23) — xem ADR-004c. Chỉ thay backend + migration, không đổi nơi gọi.\n- QA: grep `SecItem`/`kSecClass` chỉ được xuất hiện trong file backend.\n\n## ADR-004c: Backend secret = Secure Enclave + ECIES, không Touch ID — Đã chốt (người dùng chọn 2026-10-23)\n- **Kiểm chứng (researcher, macOS 27.0.1 Apple silicon, mã thử ở scratchpad `se/`):** CryptoKit `SecureEnclave.P256.KeyAgreement.PrivateKey(accessControl:)` với `SecAccessControl` chỉ `.privateKeyUsage` + `kSecAttrAccessibleWhenUnlockedThisDeviceOnly` chạy được **không cần entitlement**, binary unsigned/ad-hoc đều được; `dataRepresentation` (~324 byte, là handle bị SE bọc, không phải khoá thô) lưu được làm generic password; binary khác restore blob và giải mã được, không prompt → helper askpass dùng chung được. **Không dùng được:** `SecKeyCreateRandomKey` + `kSecAttrTokenIDSecureEnclave` permanent (-34018), entitlement `keychain-access-groups` khi ký ad-hoc (SIGKILL), item kèm `SecAccessControl` trong login keychain (-34018) → **không dùng `.userPresence`/Touch ID**.\n- **Một backend** `SecureEnclaveCredentialStore` (target dùng chung cho SSHDeskCore + `sshdesk-askpass`, ADR-004b) sau protocol `CredentialStore`; `AutofillGatedCredentialStore` bọc ngoài như cũ. Mọi đường (host, bộ đăng nhập, passphrase, askpass, PTY, Windows, token metrics) dùng nó.\n- **Khoá:** một khoá SE cho app, tạo lần đầu cần dùng; blob lưu item Keychain service `local.sshdesk.sekey`, account `default`. **Ciphertext:** item service `local.sshdesk.sealed`, account = tham chiếu (`<uuid>`, `set-<uuid>`, `setkey-<uuid>`, `metrics-<uuid>`). Cả hai item có SecAccess trusted apps (app + helper) như item hiện tại.\n- **Định dạng ciphertext v1:** `0x01 ‖ ephPub (x963, 65 byte) ‖ AES.GCM.combined (nonce 12 + ct + tag 16)`. ECDH(ephemeral P-256, khoá SE) → HKDF-SHA256(salt = ephPub, info = `\"sshdesk-credential-v1\"`, 32 byte) → AES-GCM với **AAD = `\"sshdesk-v1|\" + ref`** (chống tráo ciphertext giữa các item). Version lạ, độ dài sai, tag sai → `undecryptable`.\n- **Logic seal/open thuần, tách được:** protocol `SealingKey` (publicKey + sharedSecret) với hai cài đặt: SE thật và P-256 phần mềm (chỉ test). Test dùng khoá phần mềm; thêm test có điều kiện `SecureEnclave.isAvailable` dùng SE thật với item service `sshdesk-test-*`, xoá trong `defer`.\n- **Trạng thái đọc:** backend phân biệt `missing` / `present` / `undecryptable` (khoá mất, blob hỏng, tag sai). `undecryptable` → không tự điền, UI báo \"Mật khẩu đã lưu không còn dùng được trên máy này — nhập lại\", đánh `needsReauth`; nhập lại → ghi đè ciphertext bằng khoá hiện tại. **Không bao giờ quay về đọc plaintext.** Không crash.\n- **Blob khoá thiếu/hỏng:** tạo khoá mới (để lưu được password mới); ciphertext cũ sẽ ra `undecryptable` như trên. Không xoá ciphertext cũ tự động (người dùng nhập lại sẽ ghi đè).\n- **Máy không có SE** (`SecureEnclave.isAvailable == false`): lưu báo lỗi rõ \"Máy này không có Secure Enclave — không lưu được mật khẩu\"; đọc trả missing. Không lưu plaintext. (Intel không T2 không phải mục tiêu.)\n- **Migration một lần (khi app khởi động, chỉ app, không helper):** với mỗi tham chiếu trong DB (host `credentialReference`, `set-*`, `setkey-*`): nếu đã có item sealed → bỏ qua; nếu còn item plaintext cũ (service `local.sshdesk.credentials`) → đọc → seal → ghi item sealed → **mở lại và so khớp** → chỉ khi khớp mới xoá item plaintext. Lỗi giữa chừng → giữ item cũ, lần khởi động sau thử lại; trong thời gian đó item chưa chuyển coi như `missing` với helper (helper không đọc plaintext). Có cờ trong `settings` ghi đã chạy xong để bỏ qua quét khi không còn item cũ. Không log giá trị.\n- **\"Xoá mọi mật khẩu đã lưu\"** xoá mọi ciphertext (và mọi item plaintext cũ còn sót); **giữ khoá SE** (khoá không phải secret, xoá chỉ làm mất khả năng mở item không còn tồn tại). Có nút phụ trong Cài đặt → Dữ liệu? Không — không cần ở v1.\n- **Rủi ro chấp nhận (KNOWN_LIMITATIONS):** đổi máy, cài lại macOS, khôi phục từ backup sang máy khác → mất toàn bộ password đã lưu (khoá `ThisDeviceOnly`), không có backup/xuất. Process cùng user được Keychain cho phép đọc blob + ciphertext vẫn giải mã được bằng SE trên chính máy này (SE chống trích xuất khoá, không chống process cục bộ được trust) — mức bảo vệ chính vẫn là ACL Keychain (app + helper) như ADR-010.\n- **Đã làm (K4e, QA chặn → sửa → PM duyệt):** `CredentialBackend/CredentialSealing.swift` (SealingKey: SE + phần mềm cho test), `SecureEnclaveBackend.swift`, `SecureEnclaveCredentialStore`, `CredentialMigration` (cờ `credential_migration_se1` chỉ đặt khi quét DB được và failed == 0). PM duyệt: `exists(ref:)` không giải mã (rẻ cho danh sách; undecryptable vẫn hiện \"đã có mật khẩu\" nhưng có cảnh báo nhập lại, askpass/PTY đọc nil → hỏi tay); `delete`/`save` dọn item plaintext sót cùng ref; lỗi đọc blob khoá (ACL từ chối, keychain khoá) → báo \"Không mở được khoá trong Keychain — thử lại\", **không** tạo khoá mới; blob khoá ghi bằng update tại chỗ (không mất khoá), ciphertext ghi bằng xoá-rồi-thêm để làm mới ACL; test SE thật chạy trên máy với service `sshdesk-test-*` và dọn sạch.\n- **Người dùng cần thử:** sau `make install` có ký chứng chỉ (ADR-023), askpass dưới Warp không hiện prompt Keychain; migration chuyển password cũ không mất.\n\n## ADR-031: Lưu mật khẩu từ cột Excel/CSV của khách vào kho — Đã chốt (người dùng cho phép 2026-10-23)\n- **Phạm vi:** chỉ luồng ghép cột cho file của khách (XLSX/CSV, ADR-026). File mẫu của app vẫn KHÔNG có cột mật khẩu. JSON/Ansible không đổi (vẫn bỏ biến mật khẩu).\n- **Mặc định vẫn bỏ qua.** Khi phát hiện cột giống mật khẩu (`PasswordHeader`), màn ghép cột có lựa chọn riêng, mặc định TẮT: \"Lưu mật khẩu từ cột <X> vào kho\". Phải bật lại **mỗi lần nhập/đồng bộ** — không lưu vào `config_json`, đồng bộ tự động (ADR-026b) không bao giờ dùng. Chỉ một cột được chọn.\n- **Xem trước:** hiện số host sẽ được lưu mật khẩu (mới) và số host đã có mật khẩu riêng; mỗi dòng chỉ hiện `••••` (không độ dài thật). Host đã có mật khẩu riêng: KHÔNG ghi đè trừ khi bật thêm \"Ghi đè mật khẩu đã lưu\" (mặc định tắt). Ô trống → không đụng. Bấm Áp dụng → hộp xác nhận \"Lưu mật khẩu cho N máy vào kho mã hoá?\".\n- **Đường đi của giá trị:** reader giữ giá trị cột đã chọn trong một container riêng (`SecretColumnValues`: theo khoá dòng → bytes UTF-8, `description`/`debugDescription`/`Mirror` đều che), KHÔNG vào `InventoryRecord`, `TableSheet`, issue, log, preview, `config_json`, DB. Áp dụng: sau khi transaction DB thành công, ghi từng mật khẩu qua `ConnectionService.savePassword` (CredentialStore → Secure Enclave, ADR-004c) cho đúng host (theo id đã áp dụng); lỗi kho của một host → báo số lỗi, không rollback DB, không in giá trị. Giá trị có ký tự điều khiển/NUL hoặc > 1024 byte → bỏ host đó, báo \"mật khẩu ở dòng N không hợp lệ\" (không in giá trị).\n- **Xoá bộ nhớ:** buffer `[UInt8]`/`Data` được ghi đè 0 ngay sau khi lưu hoặc khi huỷ wizard (trong phạm vi Swift làm được: String tạm do XMLParser/CSV tạo ra không xoá chủ động được — ghi KNOWN_LIMITATIONS). Wizard bỏ container khi đóng.\n- **Quy tắc tự điền không đổi:** host có mật khẩu từ file vẫn theo PasswordAutofillPolicy (khớp user@host, không jumpHost, hold chặn). Host mới từ file có bộ đăng nhập vẫn bị hold như ADR-026/030; mật khẩu lưu là mật khẩu riêng (ưu tiên hơn bộ, ADR-030).\n- **Sau khi nhập:** thông báo nhắc \"Đã lưu mật khẩu cho N máy. Hãy xoá hoặc bảo vệ file Excel gốc — nó chứa mật khẩu dạng rõ.\" (không tự xoá file của người dùng).\n- **Test bắt buộc:** mặc định không lưu; bật → lưu đúng host; không ghi đè khi chưa bật ghi đè; giá trị không xuất hiện trong `\"\\(record)\"`, `\"\\(sheet)\"`, `\"\\(plan)\"`, issue, config_json, file DB; đồng bộ tự động và lần đồng bộ sau không lưu lại; buffer bị ghi 0 sau khi lưu (test qua API container); hold vẫn chặn tự điền.\n\n- **Đã làm (K8a, QA chặn → sửa → PM duyệt):** `Inventory/SecretColumn.swift` (`SecretBytes` ghi 0 bằng `memset_s`, `SecretColumnValues` khoá (sheet, dòng), `InventorySecretImport.plan/save`), `InventorySyncPlan.rowHosts` (dòng → host id, không bí mật), `HostProfile.hasOwnPassword`. PM duyệt: ô chỉ khoảng trắng = trống, mật khẩu không trim; hai cột cùng tiêu đề → chỉ giữ cột đầu; áp dụng lỗi hay xong đều xoá kế hoạch + bộ nhớ, lỗi thì báo bật lại; nhắc xoá file gốc là alert \"Đã hiểu\"; bản sao `[UInt8]`/`String` tạm khi đọc và khi gọi `savePassword` không xoá chủ động được (KNOWN_LIMITATIONS).\n\n## ADR-028b: Cho phép http tới tên miền nội bộ cho nguồn số liệu — Đã chốt (người dùng chọn 2026-10-23)\n- ATS không có ngoại lệ theo wildcard cho tên miền chưa biết lúc build (`NSExceptionDomains` cần tên cố định) → dùng `NSAllowsArbitraryLoads = true`. **Bỏ `NSAllowsLocalNetworking`**: theo tài liệu Apple, trên macOS 10.12+ `NSAllowsArbitraryLoads` bị **bỏ qua** nếu có `NSAllowsLocalNetworking` (hoặc `NSAllowsArbitraryLoadsInWebContent`/`ForMedia`) — coder kiểm lại tài liệu và thử runtime với HTTP server giả trên một tên không phải loopback nếu làm được.\n- **Giữ an toàn cho https:** URLSession của metrics đặt `tlsMinimumSupportedProtocolVersion = .TLSv12` (ArbitraryLoads cho phép TLS yếu hơn ở tầng ATS), vẫn không xử lý challenge (kiểm chứng chỉ mặc định của hệ thống), vẫn chặn mọi redirect. App không có URLSession nào khác gọi mạng (QA kiểm).\n- **http:** cảnh báo đỏ ở form, danh sách nguồn, header Monitor (đã có). Token/password không gửi qua http (kể cả loopback? — giữ quy tắc ADR-028: loopback không cần tick) trừ khi tick `allow_insecure_http` riêng cho nguồn đó (đã có). Thông báo ATS cũ (\"dùng https hoặc IP\") bỏ.\n- **Rủi ro chấp nhận (KNOWN_LIMITATIONS):** ATS nới cho toàn app (hiện chỉ metrics dùng mạng HTTP); http không mã hoá → số liệu có thể bị đọc/sửa trên đường truyền.\n\n## ADR-026b: Tự áp dụng khi nguồn chỉ có máy mới — Đã chốt (người dùng chọn 2026-10-23)\n- Khi phát hiện nguồn đổi (ADR-026) và kế hoạch **chỉ có thêm mới**: không có sửa, không \"không còn trong nguồn\", không lỗi dòng, không cảnh báo jump/bộ đăng nhập thiếu → tự áp dụng (một transaction như thường), không lưu mật khẩu (ADR-031). Có bất kỳ sửa/biến mất/lỗi nào → banner + màn xem trước như cũ.\n- Mỗi nguồn có tuỳ chọn \"Tự thêm máy mới\" (mặc định bật, lưu trong `config_json` hoặc cột cấu hình hiện có; không cần migration nếu dùng config_json).\n- Sau khi tự áp dụng: thông báo \"Đã thêm N máy từ <nguồn>\" với nút **Xem** (lọc danh sách tới các máy vừa thêm) và **Hoàn tác**: xoá đúng các host vừa thêm trong một transaction **chỉ khi** host chưa bị sửa (updatedAt không đổi), chưa có mật khẩu/forward, rồi tắt \"Tự thêm máy mới\" của nguồn đó (để lần sau qua xem trước, tránh thêm lại ngay); host đã bị sửa → giữ và báo. Thông báo hết hạn khi đóng; Hoàn tác chỉ trong phiên chạy app.\n- Host mới tự thêm có bộ đăng nhập từ nguồn → vẫn hold (ADR-026/030).\n- **Đã làm (K8b, QA đạt → sửa → PM duyệt):** `Inventory/InventoryAutoAdd.swift` (`isAdditionsOnly`: chặn mọi update kể cả \"có lại trong nguồn\", missing, lỗi/cảnh báo dòng, cảnh báo chung, bộ đăng nhập cần tạo; `undoAutoAdd` một transaction, xoá leaf trước bastion), cờ `autoAddNew` trong `config_json` (mặc định bật, giữ khi sửa ghép cột), `ConnectionService.applyAutoInventory` kiểm lại additions-only ở Core, banner \"Đã thêm N máy\" + Xem/Hoàn tác/Đóng. PM duyệt: chỉ tự áp dụng khi trạng thái `.changed` (không khi file mất); không tự áp dụng khi hub/wizard/xem trước đang mở hoặc busy (kiểm cả trước và sau khi tính kế hoạch); lỗi tự áp dụng → giữ banner. ATS: `build-app.sh` chỉ `NSAllowsArbitraryLoads` (tài liệu Apple: https://developer.apple.com/documentation/bundleresources/information-property-list/nsapptransportsecurity/nsallowsarbitraryloads), metrics TLS ≥ 1.2, chỉ một URLSession trong Sources.\n- **Ghi nhận PM (2026-10-23):** `ssh-keygen -w /usr/lib/ssh-keychain.dylib -K` hiện báo `Unable to load resident keys: invalid format` trên máy này (macOS 27.0.1, cùng bản lúc K5r/K5 chạy được, không còn identity nào trong `sc_auth list-ctk-identities`) — nguyên nhân chưa rõ. Test e2e SE bỏ qua hẹp đúng lỗi này; luồng tạo khoá SE trong app cần người dùng thử tay (KNOWN_LIMITATIONS).\n\n"}}};

  /* ---------- sơ đồ ---------- */
  function layout(view) {
    var rows = view.lanes.map(function () { return 1; }), cols = 1;
    view.nodes.forEach(function (n) { rows[n.lane] = Math.max(rows[n.lane], n.row + 1); cols = Math.max(cols, n.col + 1); });
    var y = 6, lanes = [];
    view.lanes.forEach(function (name, i) {
      var h = LANE_TOP + rows[i] * NH + (rows[i] - 1) * ROWGAP + LANE_BOTTOM;
      lanes.push({ name: name, y: y, h: h }); y += h + LANE_GAP;
    });
    view.nodes.forEach(function (n) {
      n.x = X0 + n.col * COLW; n.y = lanes[n.lane].y + LANE_TOP + n.row * (NH + ROWGAP); n.w = NW;
    });
    return { lanes: lanes, width: X0 + cols * COLW + 6, height: y - LANE_GAP + 6 };
  }

  function edgePath(a, b) {
    var ax = a.x + a.w / 2, bx = b.x + b.w / 2;
    if (Math.abs(a.y - b.y) < 4) {
      if (Math.abs(a.col - b.col) === 1) {
        var right = a.x < b.x, x1 = right ? a.x + a.w : a.x, x2 = right ? b.x : b.x + b.w, y = a.y + NH / 2;
        /* khe giữa hai khối kề nhau quá hẹp cho chữ → đặt nhãn phía trên khe */
        return { d: "M" + x1 + " " + y + " L" + x2 + " " + y, lx: (x1 + x2) / 2, ly: a.y - 5 };
      }
      /* vòng lên phía trên khi hai khối cùng hàng nhưng không kề nhau; khoảng càng xa vòng càng cao */
      var top = a.y, cy = top - 10 - 4 * Math.abs(a.col - b.col);
      return { d: "M" + ax + " " + top + " C" + ax + " " + cy + " " + bx + " " + cy + " " + bx + " " + top, lx: (ax + bx) / 2, ly: cy + 9 };
    }
    var down = b.y > a.y;
    var y1 = down ? a.y + NH : a.y, y2 = down ? b.y : b.y + NH, my = (y1 + y2) / 2;
    if (a.col === b.col) return { d: "M" + ax + " " + y1 + " L" + bx + " " + y2, lx: ax + 6, ly: my + 3, left: true };
    return { d: "M" + ax + " " + y1 + " C" + ax + " " + my + " " + bx + " " + my + " " + bx + " " + y2, lx: (ax + bx) / 2, ly: my - 3 };
  }

  function drawView(view) {
    svg.textContent = "";
    byId = {}; nodeEls = {}; edgeEls = [];
    view.nodes.forEach(function (n) { byId[n.id] = n; });
    var L = layout(view);
    svg.setAttribute("viewBox", "0 0 " + L.width + " " + L.height);
    svg.setAttribute("aria-label", "Sơ đồ " + view.title);
    var defs = el("defs", {}, svg);
    [["arr", "var(--muted)"], ["arr-on", "var(--accent)"]].forEach(function (m) {
      var mk = el("marker", { id: m[0], viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse" }, defs);
      el("path", { d: "M0 1 L9 5 L0 9 z" }, mk).style.fill = m[1];
    });
    L.lanes.forEach(function (l, i) {
      var r = el("rect", { x: 0, y: l.y, width: L.width, height: l.h, rx: 8, "class": "lane" }, svg);
      r.style.fill = "var(" + LANE_COLORS[i % LANE_COLORS.length] + ")";
      el("text", { x: 10, y: l.y + 16, "class": "lane-label" }, svg).textContent = l.name;
    });
    var labels = [];
    view.edges.forEach(function (e) {
      var a = byId[e[0]], b = byId[e[1]], g = edgePath(a, b);
      var p = el("path", { d: g.d, "class": "edge", "marker-end": "url(#arr)" }, svg);
      var item = { p: p, from: e[0], to: e[1], t: null };
      if (e[2]) item.t = { x: g.lx, y: g.ly, text: e[2], anchor: g.left ? "start" : "middle" };
      edgeEls.push(item); labels.push(item);
    });
    view.nodes.forEach(function (n) {
      var g = el("g", { "class": "node", tabindex: 0, role: "button", "aria-label": n.title + ", " + n.sub }, svg);
      el("rect", { x: n.x, y: n.y, width: n.w, height: NH, rx: 6 }, g);
      el("text", { x: n.x + 10, y: n.y + 23, "class": "t" }, g).textContent = n.title;
      el("text", { x: n.x + 10, y: n.y + 41, "class": "s" }, g).textContent = fit(n.sub, 26);
      var tip = el("title", {}, g); tip.textContent = n.sub;
      g.addEventListener("click", function () { select(n.id, true); });
      g.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n.id, true); } });
      nodeEls[n.id] = g;
    });
    labels.forEach(function (item) {   /* nhãn vẽ sau khối để không bị che */
      if (!item.t) return;
      var t = el("text", { x: item.t.x, y: item.t.y, "class": "edge-label", "text-anchor": item.t.anchor }, svg);
      t.textContent = item.t.text; item.t = t;
    });
    document.getElementById("hint").textContent = view.hint + " Dùng Tab và Enter để duyệt bằng bàn phím.";
  }

  function fit(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }

  /* ---------- tô màu ---------- */
  var SWIFT_KW = ("associatedtype class deinit enum extension fileprivate func import init inout internal let open operator private " +
    "protocol public rethrows static struct subscript typealias var break case catch continue default defer do else fallthrough for " +
    "guard if in repeat return throw throws switch where while as Any false is nil self Self super true try async await actor " +
    "some any final lazy mutating nonisolated override required weak unowned convenience get set willSet didSet indirect isolated sending consuming borrowing").split(" ");
  var KW = {}; SWIFT_KW.forEach(function (k) { KW[k] = 1; });
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function span(cls, s) { return '<span class="' + cls + '">' + esc(s) + "</span>"; }

  function hlSwift(lines) {
    var out = [], mode = null;   /* null | "block" | "mstr" */
    lines.forEach(function (line) {
      var html = "", i = 0;
      while (i < line.length) {
        if (mode === "block" || mode === "mstr") {
          var end = line.indexOf(mode === "block" ? "*/" : '"""', i);
          var stop = end < 0 ? line.length : end + (mode === "block" ? 2 : 3);
          html += span(mode === "block" ? "c" : "s2", line.slice(i, stop));
          if (end >= 0) mode = null;
          i = stop; continue;
        }
        var rest = line.slice(i), m;
        if (rest.indexOf("//") === 0) { html += span("c", rest); break; }
        if (rest.indexOf("/*") === 0) { mode = "block"; html += span("c", "/*"); i += 2; continue; }
        if (rest.indexOf('"""') === 0) { mode = "mstr"; html += span("s2", '"""'); i += 3; continue; }
        if ((m = /^#?"(?:[^"\\]|\\.)*"#?/.exec(rest))) { html += span("s2", m[0]); i += m[0].length; continue; }
        if ((m = /^@?[A-Za-z_][A-Za-z0-9_]*/.exec(rest))) {
          var w = m[0];
          html += w.charAt(0) === "@" || KW[w] ? span("k", w) : /^[A-Z]/.test(w) ? span("ty", w) : esc(w);
          i += w.length; continue;
        }
        if ((m = /^\d[\d_]*(?:\.\d+)?/.exec(rest))) { html += span("m", m[0]); i += m[0].length; continue; }
        html += esc(line.charAt(i)); i++;
      }
      out.push(html);
    });
    return out;
  }
  function hlMarkdown(lines) {
    var fence = false, front = lines[0] === "---";
    return lines.map(function (line, i) {
      if (front) { if (i > 0 && line === "---") front = false; return /^\s*#/.test(line) || line === "---" ? span("c", line) : esc(line); }
      if (/^\s*```/.test(line)) { fence = !fence; return span("c", line); }
      if (fence) return span("s2", line);
      if (/^#{1,6} /.test(line)) return span("h", line);
      if (/^---\s*$/.test(line)) return span("c", line);
      return esc(line).replace(/`([^`]+)`/g, '<span class="s2">`$1`</span>').replace(/\*\*([^*]+)\*\*/g, '<b>**$1**</b>');
    });
  }
  function hlPlain(lines) {
    return lines.map(function (line) { return /^\s*#/.test(line) ? span("c", line) : esc(line); });
  }
  var cache = {};
  function highlighted(path) {
    if (cache[path]) return cache[path];
    var lines = DATA.files[path].text.split("\n");
    if (lines.length > 1 && lines[lines.length - 1] === "") lines.pop();
    var fn = /\.swift$/.test(path) ? hlSwift : /\.md$/.test(path) ? hlMarkdown : hlPlain;
    return (cache[path] = fn(lines));
  }

  /* ---------- khung code ---------- */
  function currentRef() {
    var n = state.id ? byId[state.id] : null;
    return n && n.refs[state.ref] && n.refs[state.ref].file === state.file ? n.refs[state.ref] : null;
  }

  function renderCode() {
    var html = highlighted(state.file), ref = currentRef(), range = ref && ref.range;
    var a = 1, b = html.length;
    if (state.only && range) { a = range[0]; b = range[1]; }
    var rows = [];
    for (var i = a; i <= b; i++) {
      var on = range && i >= range[0] && i <= range[1];
      rows.push("<tr" + (on ? ' class="hl"' : "") + '><td class="n">' + i + "</td><td>" + (html[i - 1] || " ") + "</td></tr>");
    }
    codeEl.innerHTML = "<table><tbody>" + rows.join("") + "</tbody></table>";
    var first = codeEl.querySelector("tr.hl");
    codeEl.scrollTop = first && !state.only ? Math.max(0, first.offsetTop - 48) : 0;
    codeEl.scrollLeft = 0;
  }

  function panel() {
    var n = state.id ? byId[state.id] : null, ref = currentRef();
    document.getElementById("p-title").textContent = n ? n.title : state.file.split("/").pop();
    document.getElementById("p-desc").textContent = n ? n.desc : "Toàn bộ tệp. Chọn một khối trong sơ đồ để xem đoạn liên quan được tô sáng.";
    var refsEl = document.getElementById("p-refs");
    refsEl.textContent = "";
    var refs = n ? n.refs : [{ file: state.file, range: null }];
    refs.forEach(function (r, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "ref" + (r.file === state.file && (!n || i === state.ref) ? " cur" : "");
      b.textContent = r.file + (r.range ? ":" + r.range[0] + "–" + r.range[1] : "");
      b.addEventListener("click", function () { state.ref = i; state.file = r.file; state.only = false; panel(); });
      refsEl.appendChild(b);
    });
    var br = document.getElementById("b-range");
    br.hidden = !(ref && ref.range);
    br.textContent = state.only ? "Cả tệp" : "Chỉ đoạn này";
    var line = ref && ref.range ? ref.range[0] : 1;
    document.getElementById("b-open").href = "vscode://file/" + DATA.root + "/" + state.file + ":" + line;
    document.querySelectorAll(".groups button").forEach(function (b) { b.classList.toggle("cur", b.dataset.f === state.file); });
    renderCode();
  }

  function mark(id) {
    var near = {};
    edgeEls.forEach(function (e) {
      var on = e.from === id || e.to === id;
      e.p.classList.toggle("on", on);
      e.p.setAttribute("marker-end", on ? "url(#arr-on)" : "url(#arr)");
      if (e.t) e.t.classList.toggle("on", on);
      if (on) { near[e.from] = 1; near[e.to] = 1; }
    });
    Object.keys(nodeEls).forEach(function (k) {
      nodeEls[k].classList.toggle("sel", k === id);
      nodeEls[k].classList.toggle("near", k !== id && !!near[k]);
    });
  }

  function select(id, scroll) {
    var n = byId[id]; if (!n) return;
    state.id = id; state.ref = 0; state.file = n.refs[0].file; state.only = false;
    mark(id);
    panel();
    try { history.replaceState(null, "", "#" + state.view.id + "/" + id); } catch (e) {}
    if (scroll && window.matchMedia("(max-width: 960px)").matches) {
      document.querySelector(".panel").scrollIntoView({ block: "start", behavior: "smooth" });
    }
  }

  function openFile(path) {
    var hit = null;
    state.view.nodes.forEach(function (n) {
      n.refs.forEach(function (r, i) { if (!hit && r.file === path) hit = { id: n.id, i: i }; });
    });
    if (hit) { select(hit.id, false); state.ref = hit.i; state.file = path; panel(); }
    else { state.id = null; state.ref = 0; state.file = path; state.only = false; mark(null); panel(); }
    document.querySelector(".panel").scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function showView(id, nodeId) {
    var v = DATA.views.filter(function (x) { return x.id === id; })[0] || DATA.views[0];
    state.view = v;
    document.querySelectorAll("#views button").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.v === v.id); });
    drawView(v);
    select(byId[nodeId] ? nodeId : (START[v.id] || v.nodes[0].id), false);
  }

  /* ---------- nút ---------- */
  document.getElementById("b-range").addEventListener("click", function () { state.only = !state.only; panel(); });
  document.getElementById("b-copy").addEventListener("click", function () {
    var btn = this, ref = currentRef(), text = DATA.files[state.file].text;
    if (state.only && ref && ref.range) text = text.split("\n").slice(ref.range[0] - 1, ref.range[1]).join("\n");
    function done(ok) { btn.textContent = ok ? "Đã sao chép" : "Chọn và sao chép thủ công"; setTimeout(function () { btn.textContent = "Sao chép"; }, 1600); }
    try {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { selectAll(); done(false); });
    } catch (e) { selectAll(); done(false); }
  });
  function selectAll() {
    var r = document.createRange(); r.selectNodeContents(codeEl);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }

  var viewsEl = document.getElementById("views");
  DATA.views.forEach(function (v) {
    var b = document.createElement("button");
    b.type = "button"; b.dataset.v = v.id; b.textContent = v.title; b.setAttribute("role", "tab");
    b.addEventListener("click", function () { showView(v.id); });
    viewsEl.appendChild(b);
  });

  var groups = {}, gEl = document.getElementById("groups");
  Object.keys(DATA.files).forEach(function (p) { (groups[DATA.files[p].group] = groups[DATA.files[p].group] || []).push(p); });
  Object.keys(groups).sort(function (a, b) {
    function rank(g) { return g === "Giao diện" ? 0 : g.indexOf("Core") === 0 ? 1 : g.indexOf("Helper") === 0 ? 2 : 3; }
    return rank(a) - rank(b) || a.localeCompare(b);
  }).forEach(function (g) {
    var d = document.createElement("div"), h = document.createElement("h4"), ul = document.createElement("ul");
    h.textContent = g; d.appendChild(h); d.appendChild(ul);
    groups[g].forEach(function (p) {
      var li = document.createElement("li"), b = document.createElement("button");
      b.type = "button"; b.dataset.f = p; b.textContent = p.replace(/^Sources\/(SSHDeskCore\/|SSHDesk\/)?/, "");
      b.title = p;
      b.addEventListener("click", function () { openFile(p); });
      li.appendChild(b); ul.appendChild(li);
    });
    gEl.appendChild(d);
  });

  var hash = location.hash.slice(1).split("/");
  showView(hash[0], hash[1]);
})();
</script>
</body>
</html>
