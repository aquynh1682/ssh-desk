come {\n        guard plan.hasConflicts else { return finishDownload(plan, .overwriteAll, from: tab) }\n        return .next(\n            .conflicts(\n                ConflictDialog(\n                    title:\n                        \"\\(plan.conflicts.count) mục đã có trong \\(BrowserPath.display(plan.destinationDirectory, home: local.home))\",\n                    names: plan.conflicts, note: nil, allowAutoRename: true,\n                    choose: { [weak self] choice in\n                        guard let self, let choice else { return .done }\n                        return self.finishDownload(plan, choice, from: tab)\n                    })))\n    }\n\n    private func finishDownload(\n        _ plan: TransferBatchPlan, _ choice: BatchConflictChoice, from tab: BrowserTab\n    ) -> DialogOutcome {\n        let planned = BrowserTransferPlanner.downloadJobs(plan, choice: choice)\n        guard !planned.isEmpty else {\n            app?.showToast(\"Không có mục nào để tải về\")\n            return .done\n        }\n        let host = tab.host\n        Task { apply(await enqueue(planned, host: host, tab: tab)) }\n        return .done\n    }\n\n    private func enqueue(_ planned: [PlannedTransfer], host: HostProfile, tab: BrowserTab) async\n        -> DialogOutcome\n    {\n        guard let app else { return .done }\n        do {\n            let jobs = try BrowserTransferPlanner.makeJobs(planned, host: host, configPath: configPath)\n            let queued = try await app.enqueueBrowserJobs(jobs, controlPath: tab.session.controlPath)\n            app.showToast(\"Đã thêm \\(queued) tác vụ vào hàng đợi\")\n            return .done\n        } catch {\n            return .next(.error(\"Không tạo được tác vụ\", AppModel.message(for: error)))\n        }\n    }\n\n    // MARK: - Thao tác remote\n\n    func promptNewRemoteFolder(_ tab: BrowserTab) {\n        dialog = .nameInput(\n            NameInputDialog(\n                title: \"Thư mục mới trên \\(tab.title)\", message: tab.path, initial: \"Thư mục mới\",\n                confirmTitle: \"Tạo\"\n            ) { name in\n                if let issue = EntryNameRules.validate(name) { return .error(issue.message) }\n                do {\n                    try await tab.makeFolder(named: name)\n                    return .done\n                } catch { return .error(BrowserErrorText.message(for: error)) }\n            })\n    }\n\n    func promptRenameRemote(_ tab: BrowserTab, _ row: BrowserRow) {\n        guard row.isSupported else { return }\n        dialog = .nameInput(\n            NameInputDialog(\n                title: \"Đổi tên “\\(row.name)”\", message: nil, initial: row.name, confirmTitle: \"Đổi tên\"\n            ) { [weak self] newName in\n                if let issue = EntryNameRules.validate(newName) { return .error(issue.message) }\n                if newName == row.name { return .done }\n                do {\n                    try await tab.rename(row, to: newName, overwrite: false)\n                    return .done\n                } catch RemoteFileError.destinationExists {\n                    guard let self else { return .done }\n                    return .next(self.overwriteRenameDialog(tab, row, newName))\n                } catch { return .error(BrowserErrorText.message(for: error)) }\n            })\n    }\n\n    private func overwriteRenameDialog(_ tab: BrowserTab, _ row: BrowserRow, _ newName: String)\n        -> BrowserDialog\n    {\n        .confirm(\n            ConfirmDialog(\n                title: \"“\\(newName)” đã tồn tại. Ghi đè?\",\n                message: \"Đổi tên “\\(row.name)” thành “\\(newName)” sẽ thay thế mục cùng tên trên \\(tab.title).\",\n                confirmTitle: \"Ghi đè\", destructive: true\n            ) {\n                do {\n                    try await tab.rename(row, to: newName, overwrite: true)\n                    return .done\n                } catch { return .next(.error(\"Không đổi tên được\", BrowserErrorText.message(for: error))) }\n            })\n    }\n\n    func confirmDeleteRemote(_ tab: BrowserTab, _ row: BrowserRow) {\n        guard row.isSupported else { return }\n        if row.isDirectory {\n            let op = DeleteOperation(tab: tab, row: row)\n            dialog = .delete(op)\n            return\n        }\n        let prod = tab.host.environment == .prod\n        dialog = .confirm(\n            ConfirmDialog(\n                title: \"Xoá “\\(row.name)”?\",\n                message:\n                    \"Xoá vĩnh viễn trên \\(tab.title) (\\(row.id)). Không có Thùng rác; quyền theo user SSH, không dùng sudo.\",\n                emphasis: prod ? \"Đây là máy PRODUCTION.\" : nil, confirmTitle: \"Xoá\", destructive: true\n            ) {\n                do {\n                    try await tab.removeFile(row)\n                    return .done\n                } catch { return .next(.error(\"Không xoá được\", BrowserErrorText.message(for: error))) }\n            })\n    }\n\n    // MARK: - Thao tác local\n\n    func promptNewLocalFolder() {\n        dialog = .nameInput(\n            NameInputDialog(\n                title: \"Thư mục mới\", message: BrowserPath.display(local.path, home: local.home),\n                initial: \"Thư mục mới\", confirmTitle: \"Tạo\"\n            ) { [weak self] name in\n                if let issue = EntryNameRules.validate(name) { return .error(issue.message) }\n                do {\n                    try self?.local.makeFolder(named: name)\n                    await self?.local.refresh()\n                    return .done\n                } catch { return .error(BrowserErrorText.message(for: error)) }\n            })\n    }\n\n    func promptRenameLocal(_ row: BrowserRow) {\n        guard row.isSupported else { return }\n        dialog = .nameInput(\n            NameInputDialog(\n                title: \"Đổi tên “\\(row.name)”\", message: \"Không ghi đè mục đã có.\", initial: row.name,\n                confirmTitle: \"Đổi tên\"\n            ) { [weak self] newName in\n                if let issue = EntryNameRules.validate(newName) { return .error(issue.message) }\n                if newName == row.name { return .done }\n                do {\n                    try self?.local.rename(row, to: newName)\n                    await self?.local.refresh()\n                    return .done\n                } catch { return .error(BrowserErrorText.message(for: error)) }\n            })\n    }\n\n    func confirmTrash(_ rows: [BrowserRow]) {\n        let targets = rows.filter(\\.isSupported)\n        guard !targets.isEmpty else { return }\n        dialog = .confirm(\n            ConfirmDialog(\n                title: targets.count == 1\n                    ? \"Chuyển “\\(targets[0].name)” vào Thùng rác?\"\n                    : \"Chuyển \\(targets.count) mục vào Thùng rác?\",\n                message: \"Có thể khôi phục từ Thùng rác.\", items: targets.map(\\.name),\n                confirmTitle: \"Chuyển vào Thùng rác\", destructive: true\n            ) { [weak self] in\n                do {\n                    try self?.local.trash(targets)\n                    await self?.local.refresh()\n                    return .done\n                } catch {\n                    await self?.local.refresh()\n                    return .next(.error(\"Không chuyển được vào Thùng rác\", BrowserErrorText.message(for: error)))\n                }\n            })\n    }\n}\n"}, "Sources/SSHDesk/HostDetailView.swift": {"group": "Giao diện", "text": "import SSHDeskCore\nimport SwiftUI\n\n/// Cột phải: chi tiết máy chủ đang chọn.\nstruct HostDetailView: View {\n    @Bindable var model: AppModel\n    let host: HostProfile\n\n    var body: some View {\n        ScrollView {\n            VStack(alignment: .leading, spacing: 14) {\n                header\n                if let banner = model.banner { bannerView(banner) }\n                Button {\n                    Task { await model.open(host) }\n                } label: {\n                    Label(\n                        isWindows ? \"Mở Windows App\" : \"Mở Warp\",\n                        systemImage: \"arrow.up.forward.square\")\n                }\n                .buttonStyle(ProminentButtonStyle(fullWidth: true))\n                .help(\n                    isWindows\n                        ? \"Mở kết nối RDP trong Windows App (Return khi đang ở danh sách)\"\n                        : \"Mở phiên SSH trong Warp (Return khi đang ở danh sách)\")\n                loginCard\n                HostSourceCard(model: model, host: host)\n                connectionCard\n                if isWindows {\n                    Text(\n                        model.hasStoredPassword(host)\n                            ? \"Khi mở, mật khẩu được copy để bạn dán (⌘V) vào Windows App; clipboard tự xoá sau 30 giây.\"\n                            : \"Mật khẩu nhập trong Windows App.\"\n                    )\n                    .font(.system(size: 12)).foregroundStyle(Theme.textSecondary)\n                } else {\n                    HStack(spacing: 10) {\n                        Button {\n                            model.transferSheet = .upload(host)\n                        } label: {\n                            Label(\"Tải lên\", systemImage: \"square.and.arrow.up\")\n                        }\n                        .buttonStyle(OutlineButtonStyle(fullWidth: true))\n                        .help(\"Tải file/thư mục từ máy này lên server\")\n                        Button {\n                            model.transferSheet = .download(host)\n                        } label: {\n                            Label(\"Tải về\", systemImage: \"square.and.arrow.down\")\n                        }\n                        .buttonStyle(OutlineButtonStyle(fullWidth: true))\n                        .help(\"Tải file/thư mục từ server về máy này\")\n                    }\n                }\n                if !isWindows { PortForwardSection(model: model, host: host) }\n                infoCard\n            }\n            .padding(18)\n        }\n        .frame(width: Theme.detailWidth)\n    }\n\n    private var isWindows: Bool { host.kind == .windowsRDP }\n\n    private var header: some View {\n        HStack(alignment: .top, spacing: 12) {\n            Image(systemName: isWindows ? \"desktopcomputer\" : \"server.rack\")\n                .font(.system(size: 22)).foregroundStyle(Theme.green)\n                .frame(width: 52, height: 52)\n                .background(Theme.green.opacity(0.12), in: RoundedRectangle(cornerRadius: 12))\n                .overlay(RoundedRectangle(cornerRadius: 12).strokeBorder(Theme.green.opacity(0.4)))\n            VStack(alignment: .leading, spacing: 4) {\n                HStack(spacing: 8) {\n                    Text(host.displayName).font(.system(size: 18, weight: .bold)).lineLimit(2)\n                    EnvironmentBadge(environment: host.environment)\n                }\n                let sub = HostPresentation.subtitle(host)\n                if !sub.isEmpty {\n                    Text(sub).font(.system(size: 13)).foregroundStyle(Theme.textSecondary)\n                        .lineLimit(2)\n                }\n            }\n            Spacer(minLength: 0)\n            Menu {\n                if isWindows {\n                    Button(\"Mở Windows App\") { Task { await model.openInWindowsApp(host) } }\n                    if model.hasStoredPassword(host) {\n                        Button(\"Copy mật khẩu\") { Task { await model.copyWindowsPassword(host) } }\n                    }\n                    Button(\"Hiện file .rdp trong Finder\") {\n                        Task { await model.revealRDPFile(host) }\n                    }\n                    Divider()\n                }\n                Button(\"Sửa…\") { model.form = .edit(host) }\n                Button {\n                    model.beginDuplicate(host)\n                } label: {\n                    Label(\"Nhân bản…\", systemImage: \"plus.square.on.square\")\n                }\n                if !isWindows {\n                    Button(\"Copy lệnh SSH\") { Task { await model.copySSHCommand(host) } }\n                    Button(\"Cài key…\") { model.keys.pickKeyForHost = host }\n                }\n                Divider()\n                Button(\"Xoá…\", role: .destructive) { model.pendingDelete = host }\n            } label: {\n                Image(systemName: \"ellipsis\").foregroundStyle(Theme.textSecondary)\n                    .frame(width: 30, height: 30)\n                    .background(Theme.control, in: RoundedRectangle(cornerRadius: 8))\n                    .overlay(RoundedRectangle(cornerRadius: 8).strokeBorder(Theme.cardStroke))\n            }\n            .menuStyle(.button).buttonStyle(.plain).menuIndicator(.hidden).fixedSize()\n            .accessibilityLabel(\"Thao tác khác\")\n        }\n    }\n\n    /// Nguồn mật khẩu, cảnh báo key mất và banner hold (ADR-026/030).\n    @ViewBuilder\n    private var loginCard: some View {\n        let source = model.passwordSource(for: host)\n        let missingKey = model.missingKeyPath(for: host)\n        let ownOverrides: Bool = { if case .ownOverridesSet = source { return true } else { return false } }()\n        if host.autofillHold || source != .none || missingKey != nil || host.credentialSetID != nil {\n            VStack(alignment: .leading, spacing: 8) {\n                Text(\"Đăng nhập\").font(.system(size: 14, weight: .semibold))\n                if source != .none {\n                    HStack {\n                        Label(source.label, systemImage: \"key.fill\").font(.system(size: 13))\n                        Spacer(minLength: 0)\n                        if ownOverrides || source == .own {\n                            Button(\"Xoá mật khẩu riêng\") {\n                                Task { _ = await model.clearPassword(hostID: host.id) }\n                            }\n                            .controlSize(.small)\n                        }\n                    }\n                } else if let set = model.credentialSet(id: host.credentialSetID) {\n                    Text(\"Bộ đăng nhập: \\(set.name) (chưa có mật khẩu)\")\n                        .font(.system(size: 13)).foregroundStyle(Theme.textSecondary)\n                }\n                if model.needsReauth(host) {\n                    Label(\n                        \"Mật khẩu đã lưu không còn dùng được trên máy này — nhập lại\",\n                        systemImage: \"exclamationmark.triangle.fill\"\n                    )\n                    .font(.system(size: 12.5)).foregroundStyle(Theme.amber)\n                }\n                if let missingKey {\n                    Label(\"Không thấy file key \\(missingKey)\", systemImage: \"exclamationmark.triangle.fill\")\n                        .font(.system(size: 12.5)).foregroundStyle(Theme.amber)\n                }\n                if host.autofillHold {\n                    HStack(alignment: .top) {\n                        Image(systemName: \"hand.raised.fill\").foregroundStyle(Theme.amber)\n                        Text(\n                            \"\\(host.autofillHoldReason ?? \"Cần xác nhận\"). Đã tạm tắt tự điền mật khẩu cho máy này.\"\n                        )\n                        .font(.system(size: 12.5))\n                        Spacer(minLength: 0)\n                        Button(\"Xác nhận\") { Task { await model.confirmAutofillHold(host) } }\n                            .controlSize(.small)\n                    }\n                    .padding(10)\n                    .background(Theme.amber.opacity(0.14), in: RoundedRectangle(cornerRadius: 9))\n                }\n            }\n            .padding(14)\n            .frame(maxWidth: .infinity, alignment: .leading)\n            .cardStyle()\n        }\n    }\n\n    private var connectionCard: some View {\n        let rows = HostPresentation.connectionRows(\n            host, jumpHostName: model.name(of: host.jumpHostID),\n            credentialSet: model.credentialSet(id: host.credentialSetID),\n            hasSavedPassword: isWindows && model.hasStoredPassword(host))\n        return VStack(alignment: .leading, spacing: 0) {\n            Text(\"Kết nối\").font(.system(size: 14, weight: .semibold))\n                .padding(.horizontal, 14).padding(.vertical, 12)\n            ForEach(Array(rows.enumerated()), id: \\.offset) { _, r in\n                Divider().overlay(Theme.divider)\n                HStack(alignment: .firstTextBaseline, spacing: 8) {\n                    Text(r.label).foregroundStyle(Theme.textSecondary)\n                        .frame(width: 92, alignment: .leading)\n                    Text(r.value)\n                        .font(\n                            r.label == \"Xác thực\"\n                                ? .system(size: 13) : .system(size: 13, design: .monospaced)\n                        )\n                        .lineLimit(2).truncationMode(.middle).textSelection(.enabled)\n                        .frame(maxWidth: .infinity, alignment: .leading)\n                    if r.copyable {\n                        Button {\n                            model.copyValue(r.value, label: r.label.lowercased())\n                        } label: {\n                            Image(systemName: \"doc.on.doc\").foregroundStyle(Theme.textSecondary)\n                        }\n                        .buttonStyle(.plain).help(\"Copy \\(r.label)\")\n                        .accessibilityLabel(\"Copy \\(r.label)\")\n                    }\n                }\n                .font(.system(size: 13))\n                .padding(.horizontal, 14).padding(.vertical, 9)\n            }\n        }\n        .cardStyle()\n    }\n\n    @ViewBuilder\n    private var infoCard: some View {\n        let hasInfo =\n            !host.project.isEmpty || !host.tags.isEmpty || !host.notes.isEmpty\n            || !host.remoteBookmarks.isEmpty || host.lastLaunchRequestedAt != nil\n        if hasInfo {\n            VStack(alignment: .leading, spacing: 8) {\n                Text(\"Thông tin\").font(.system(size: 14, weight: .semibold))\n                if !host.project.isEmpty { info(\"Thư mục\", host.project) }\n                if !host.tags.isEmpty { info(\"Tags\", host.tags.joined(separator: \", \")) }\n                if !host.notes.isEmpty { info(\"Ghi chú\", host.notes) }\n                ForEach(Array(host.remoteBookmarks.enumerated()), id: \\.offset) { _, b in\n                    info(\"Bookmark\", \"\\(b.name): \\(b.path)\")\n                }\n                if let last = host.lastLaunchRequestedAt {\n                    info(\n                        isWindows ? \"Mở Windows App lần cuối\" : \"Mở Warp lần cuối\",\n                        last.formatted(date: .abbreviated, time: .shortened))\n                }\n            }\n            .padding(14)\n            .frame(maxWidth: .infinity, alignment: .leading)\n            .cardStyle()\n        }\n    }\n\n    private func info(_ label: String, _ value: String) -> some View {\n        HStack(alignment: .firstTextBaseline, spacing: 8) {\n            Text(label).foregroundStyle(Theme.textSecondary).frame(width: 92, alignment: .leading)\n            Text(value).textSelection(.enabled).frame(maxWidth: .infinity, alignment: .leading)\n        }\n        .font(.system(size: 13))\n    }\n\n    private func bannerView(_ banner: Banner) -> some View {\n        HStack(alignment: .top) {\n            Image(systemName: \"exclamationmark.triangle.fill\").foregroundStyle(Theme.amber)\n            Text(banner.text).font(.system(size: 12.5))\n            Spacer(minLength: 0)\n            if banner.showsAppStoreLink {\n                Button(\"Mở App Store\") { model.openWindowsAppStore() }.controlSize(.small)\n            } else if !isWindows {\n                Button(\"Copy lệnh SSH\") { Task { await model.copySSHCommand(host) } }\n                    .controlSize(.small)\n            }\n            Button {\n                model.banner = nil\n            } label: {\n                Image(systemName: \"xmark\")\n            }\n            .buttonStyle(.borderless)\n        }\n        .padding(10)\n        .background(Theme.amber.opacity(0.14), in: RoundedRectangle(cornerRadius: 9))\n    }\n}\n"}, "Sources/SSHDesk/HostFormView.swift": {"group": "Giao diện", "text": "import AppKit\nimport SSHDeskCore\nimport SwiftUI\n\nstruct HostFormView: View {\n    @Bindable var model: AppModel\n    let target: FormTarget\n    @Environment(\\.dismiss) private var dismiss\n\n    @Local private var draft = HostDraft()\n    @Local private var base: HostProfile?\n    @Local private var loaded = false\n    @Local private var showAdvanced = false\n    @Local private var saving = false\n    @Local private var changingPassword = false\n    @Local private var confirmClear = false\n    @Local private var confirmRemoveOnSave = false\n    @Local private var passwordInput = \"\"\n    @Local private var hasSavedPassword = false\n    @Local private var creatingFolder = false\n    /// Loại máy đang chờ xác nhận khi sửa host có sẵn.\n    @Local private var pendingKind: HostKind?\n    /// Host gốc khi đang nhân bản (nil = thêm/sửa thường).\n    @Local private var duplicateSource: HostProfile?\n    @FocusState private var nameFocused: Bool\n\n    private var isDuplicate: Bool { duplicateSource != nil }\n    private var isNew: Bool { base == nil || isDuplicate }\n    private var isWindows: Bool { draft.kind == .windowsRDP }\n    private var isImported: Bool { base?.connectionMode == .existingSSHConfigAlias }\n    /// Máy đồng bộ từ nguồn (ADR-026): tên, địa chỉ, port, user, môi trường, thư mục, jump host chỉ đọc.\n    private var sourceManaged: Bool { base?.sourceID != nil && !isDuplicate }\n    private var notesManaged: Bool { sourceManaged && base.map { model.inventory.managesNotes($0) } == true }\n    private var errors: [HostDraft.Field: String] {\n        draft.errors(\n            basedOn: base, hasSavedPassword: hasSavedPassword,\n            passwordEntered: !passwordInput.isEmpty, credentialSet: selectedSet,\n            setHasPassword: selectedSet.map { model.setHasPassword($0.id) } ?? false)\n    }\n\n    private var selectedSet: CredentialSet? { model.credentialSet(id: draft.credentialSetID) }\n\n    var body: some View {\n        VStack(spacing: 0) {\n            if isDuplicate {\n                Text(\"Nhân bản máy chủ\").font(.headline)\n                    .frame(maxWidth: .infinity, alignment: .leading)\n                    .padding(.horizontal, 20).padding(.top, 14)\n            }\n            Form {\n                if isImported, let b = base {\n                    Section {\n                        Label(\n                            \"Cấu hình kết nối lấy từ alias \\(b.sshConfigAlias ?? \"?\") trong \\(b.sshConfigPath ?? \"?\"). Ở đây chỉ sửa thông tin quản lý.\",\n                            systemImage: \"link\"\n                        )\n                        .foregroundStyle(.secondary)\n                    }\n                }\n                if sourceManaged, let b = base {\n                    Section {\n                        Label(\n                            \"Máy này đồng bộ từ nguồn “\\(model.inventory.sourceName(for: b) ?? \"?\")”: tên, IP, port, user, môi trường, thư mục, jump host\\(notesManaged ? \", ghi chú\" : \"\") do nguồn quản lý nên chỉ đọc. Sửa trong file nguồn rồi đồng bộ lại, hoặc tách khỏi nguồn.\",\n                            systemImage: \"link\"\n                        )\n                        .foregroundStyle(.secondary)\n                        Button(\"Tách khỏi nguồn\") {\n                            Task {\n                                await model.inventory.detach(b)\n                                dismiss()\n                            }\n                        }\n                    }\n                }\n                Section(\"Thông tin chính\") {\n                    if !isImported { kindPicker.disabled(sourceManaged) }\n                    field(\"Tên\", .displayName) {\n                        TextField(\n                            \"Tên\", text: $draft.displayName,\n                            prompt: Text(isWindows ? \"Windows server\" : \"Web production\")\n                        )\n                        .focused($nameFocused)\n                        .disabled(sourceManaged)\n                    }\n                    if isWindows {\n                        field(\"Host\", .hostName) {\n                            TextField(\"Host\", text: $draft.hostName, prompt: Text(\"192.168.1.10\"))\n                                .disabled(sourceManaged)\n                        }\n                        field(\"Port\", .port) { TextField(\"Port\", text: $draft.portText).disabled(sourceManaged) }\n                        field(\"User\", .rdpUser) {\n                            TextField(\"User\", text: $draft.rdpUsername, prompt: Text(\"DOMAIN\\\\user\"))\n                                .disabled(sourceManaged)\n                        }\n                    } else if !isImported {\n                        LabeledContent(\"Kiểu kết nối\") {\n                            Text(\"Tự cấu hình (app sinh khối Host)\").foregroundStyle(.secondary)\n                        }\n                        field(\"Host\", .hostName) {\n                            TextField(\"Host\", text: $draft.hostName, prompt: Text(\"server.example.com\"))\n                                .disabled(sourceManaged)\n                        }\n                        field(\"User\", .user) {\n                            TextField(\"User\", text: $draft.user, prompt: Text(\"deploy\"))\n                                .disabled(sourceManaged)\n                        }\n                        field(\"Port\", .port) { TextField(\"Port\", text: $draft.portText).disabled(sourceManaged) }\n                    }\n                    authSection\n                }\n                Section {\n                    DisclosureGroup(\"Nâng cao\", isExpanded: $showAdvanced) {\n                        if isWindows {\n                            field(\"Domain\", .rdpDomain) {\n                                TextField(\"Domain\", text: $draft.rdpDomain)\n                            }\n                            field(\"RD Gateway\", .rdpGateway) {\n                                TextField(\n                                    \"RD Gateway\", text: $draft.rdpGateway,\n                                    prompt: Text(\"gateway.example.com[:cổng]\"))\n                            }\n                            Picker(\"Hiển thị\", selection: $draft.rdpScreenMode) {\n                                Text(\"Toàn màn hình\").tag(RDPScreenMode.fullScreen)\n                                Text(\"Cửa sổ\").tag(RDPScreenMode.window)\n                            }\n                            Toggle(\"Nhiều màn hình\", isOn: $draft.rdpMultiMonitor)\n                            Toggle(\"Chia sẻ clipboard\", isOn: $draft.rdpRedirectClipboard)\n                            Toggle(\"Phiên quản trị\", isOn: $draft.rdpAdminSession)\n                        }\n                        if !isImported && !isWindows {\n                            field(\"Bastion\", .jumpHost) {\n                                Picker(\"Bastion\", selection: $draft.jumpHostID) {\n                                    Text(\"Không dùng\").tag(UUID?.none)\n                                    ForEach(HostPresentation.sshHosts(model.hosts).filter { $0.id != base?.id }) { h in\n                                        Text(h.displayName).tag(UUID?.some(h.id))\n                                    }\n                                }\n                                .disabled(sourceManaged)\n                            }\n                        }\n                        if !isImported && !isWindows { agentField }\n                        folderField.disabled(sourceManaged)\n                        Picker(\"Môi trường\", selection: $draft.environment) {\n                            ForEach(HostEnvironment.allCases, id: \\.self) { Text($0.rawValue).tag($0) }\n                        }\n                        .disabled(sourceManaged)\n                        TextField(\"Tags (cách nhau bằng dấu phẩy)\", text: $draft.tagsText)\n                        TextField(\"Ghi chú\", text: $draft.notes, axis: .vertical).lineLimit(2...5)\n                            .disabled(notesManaged)\n                        if !isWindows { bookmarks }\n                    }\n                }\n                if let g = errors[.general] ?? errors[.alias] {\n                    Text(g).foregroundStyle(Theme.red)\n                }\n            }\n            .formStyle(.grouped)\n            .scrollContentBackground(.hidden)\n            Divider().overlay(Theme.divider)\n            HStack {\n                Spacer()\n                Button(\"Huỷ\") { dismiss() }\n                    .buttonStyle(OutlineButtonStyle()).keyboardShortcut(.cancelAction)\n                Button(\"Lưu\") {\n                    if !isDuplicate && draft.removesStoredPassword(hasSavedPassword: hasSavedPassword) {\n                        confirmRemoveOnSave = true\n                    } else {\n                        Task { await save() }\n                    }\n                }\n                .buttonStyle(ProminentButtonStyle())\n                .keyboardShortcut(.defaultAction)\n                .disabled(!errors.isEmpty || folderError != nil || saving)\n                .opacity(!errors.isEmpty || folderError != nil || saving ? 0.5 : 1)\n            }\n            .padding(12)\n        }\n        .background(Theme.windowBackground)\n        .frame(width: 520, height: 560)\n        .onAppear(perform: load)\n        .confirmationDialog(\n            \"Đổi loại máy?\",\n            isPresented: Binding(get: { pendingKind != nil }, set: { if !$0 { pendingKind = nil } })\n        ) {\n            Button(\"Đổi loại\") {\n                if let k = pendingKind { draft.setKind(k) }\n                pendingKind = nil\n            }\n            Button(\"Huỷ\", role: .cancel) { pendingKind = nil }\n        } message: {\n            Text(\n                \"Một số thông tin riêng của loại hiện tại sẽ không còn dùng (mật khẩu đã lưu được giữ nếu bạn vẫn chọn \\\"Mật khẩu\\\", nếu không sẽ bị xoá khi bấm Lưu).\"\n            )\n        }\n        .confirmationDialog(\"Xoá mật khẩu đã lưu?\", isPresented: $confirmClear) {\n            Button(\"Xoá\", role: .destructive) { Task { await clearSavedPassword() } }\n        } message: {\n            Text(\"Mật khẩu sẽ bị xoá khỏi Keychain.\")\n        }\n        .confirmationDialog(\"Xoá mật khẩu đã lưu?\", isPresented: $confirmRemoveOnSave) {\n            Button(\"Xoá và lưu\", role: .destructive) { Task { await save() } }\n        } message: {\n            Text(\"Bạn đã chuyển khỏi \\\"Mật khẩu\\\"; mật khẩu trong Keychain sẽ bị xoá.\")\n        }\n    }\n\n    private var kindPicker: some View {\n        Picker(\n            \"Loại máy\",\n            selection: Binding(\n                get: { draft.kind },\n                set: { newKind in\n                    if isNew {\n                        draft.setKind(newKind)\n                    } else if newKind != draft.kind {\n                        pendingKind = newKind\n                    }\n                })\n        ) {\n            Text(\"Linux / SSH\").tag(HostKind.ssh)\n            Text(\"Windows (RDP)\").tag(HostKind.windowsRDP)\n        }\n        .pickerStyle(.segmented)\n    }\n\n    private var authChoices: [(HostDraft.AuthChoice, String)] {\n        if isWindows {\n            return [(.password, \"Mật khẩu (lưu trong Keychain)\"), (.prompt, \"Nhập trong Windows App\")]\n        }\n        let all: [(HostDraft.AuthChoice, String)] = [\n            (.agent, \"ssh-agent / mặc định\"), (.keyFile, \"File khoá riêng\"),\n            (.password, \"Mật khẩu (lưu trong Keychain)\"), (.prompt, \"Nhập khi kết nối\"),\n        ]\n        // Hồ sơ imported: cấu hình key/agent nằm ở alias; chỉ cho đặt/bỏ mật khẩu.\n        guard isImported else { return all }\n        let cur = draft.authChoice\n        var list = all.filter { $0.0 == .password || $0.0 == .prompt }\n        if cur == .agent || cur == .keyFile { list.insert((cur, \"Theo cấu hình alias\"), at: 0) }\n        return list\n    }\n\n    @ViewBuilder\n    private var authSection: some View {\n        Picker(\"Xác thực\", selection: $draft.authChoice) {\n            ForEach(authChoices, id: \\.0) { Text($0.1).tag($0.0) }\n        }\n        if draft.authChoice == .keyFile && !isImported {\n            field(\"File khoá\", .identityFile) {\n                HStack {\n                    TextField(\"Đường dẫn\", text: $draft.identityFile)\n                    Button(\"Chọn…\") { chooseKey() }\n                }\n            }\n        }\n        if draft.usesCredentialSet && !isImported { credentialSetPicker }\n        if draft.authChoice == .password {\n            if hasSavedPassword && !changingPassword {\n                HStack {\n                    Label(\n                        duplicateSource.map { \"Đã lưu mật khẩu (sao từ \\($0.displayName))\" }\n                            ?? \"Đã lưu mật khẩu\",\n                        systemImage: \"checkmark.shield\")\n                    Spacer()\n                    Button(\"Đổi\") { changingPassword = true }\n                    Button(\"Xoá\") { confirmClear = true }\n                }\n            } else {\n                field(\"Mật khẩu\", .password) {\n                    SecureField(\n                        \"Mật khẩu\", text: $passwordInput,\n                        prompt: Text(\n                            hasSavedPassword\n                                ? \"Để trống = giữ mật khẩu hiện tại\"\n                                : (selectedSet != nil\n                                    ? \"Để trống = dùng mật khẩu của bộ\"\n                                    : (isWindows ? \"Mật khẩu Windows\" : \"Mật khẩu SSH\"))\n                        ))\n                }\n            }\n        }\n        Text(authNote).font(.caption).foregroundStyle(.secondary)\n    }\n\n    /// Bộ đăng nhập dùng chung (ADR-030). Mật khẩu riêng của máy (nếu có) vẫn ưu tiên hơn bộ.\n    @ViewBuilder\n    private var credentialSetPicker: some View {\n        Picker(\"Bộ đăng nhập\", selection: $draft.credentialSetID) {\n            Text(\"Không dùng\").tag(UUID?.none)\n            ForEach(model.credentialSets) { set in\n                Text(\"\\(set.name) — \\(set.kindLabel(hasPassword: model.setHasPassword(set.id)))\")\n                    .tag(UUID?.some(set.id))\n            }\n        }\n        if let set = selectedSet {\n            if let w = draft.userMismatchWarning(for: set) {\n                Text(w).font(.caption).foregroundStyle(Theme.amber)\n            }\n            if let file = set.identityFile,\n                !FileManager.default.fileExists(atPath: CredentialResolution.expandTilde(file, home: NSHomeDirectory()))\n            {\n                Text(\"Không thấy file key \\(file)\").font(.caption).foregroundStyle(Theme.amber)\n            }\n            if hasSavedPassword {\n                Text(\"Máy có mật khẩu riêng: ưu tiên hơn mật khẩu của bộ “\\(set.name)”.\")\n                    .font(.caption).foregroundStyle(.secondary)\n            }\n        }\n    }\n\n    /// Agent ngoài qua `IdentityAgent` (ADR-024). Chỉ host managed SSH.\n    @ViewBuilder\n    private var agentField: some View {\n        Picker(\"Agent\", selection: $draft.identityAgentPreset) {\n            let def = model.settings.defaultIdentityAgent\n            Text(def.isEmpty ? \"Theo mặc định (hệ thống)\" : \"Theo mặc định (\\(def))\")\n                .tag(IdentityAgentPreset?.none)\n            ForEach(IdentityAgentPreset.allCases, id: \\.self) {\n                Text($0.title).tag(IdentityAgentPreset?.some($0))\n            }\n        }\n        if draft.identityAgentPreset == .custom {\n            field(\"Đường dẫn socket agent\", .identityAgent) {\n                TextField(\n                    \"Đường dẫn socket\", text: $draft.identityAgentCustom,\n                    prompt: Text(\"~/.../agent.sock\"))\n            }\n        } else if let e = errors[.identityAgent] {\n            Text(e).font(.caption).foregroundStyle(Theme.red)\n        }\n        let effective = IdentityAgentResolution.effective(\n            host: draft.identityAgentValue, settingsDefault: model.settings.defaultIdentityAgent)\n        if let effective {\n            ForEach(IdentityAgentPath.warnings(for: effective), id: \\.self) { w in\n                Text(w.message).font(.caption).foregroundStyle(Theme.amber)\n            }\n        }\n    }\n\n    private var authNote: String {\n        if isWindows {\n            return draft.authChoice == .password\n                ? \"Khi mở, mật khẩu được copy để bạn dán (⌘V) vào Windows App; clipboard tự xoá sau 30 giây.\"\n                : \"Mật khẩu nhập trong Windows App; SSH Desk không lưu.\"\n        }\n        switch draft.authChoice {\n        case .agent: return \"Dùng key trong ssh-agent hoặc cấu hình SSH mặc định.\"\n        case .keyFile: return \"Passphrase (nếu có) nhập khi kết nối.\"\n        case .password:\n            return \"Mật khẩu chỉ nằm trong Keychain của Mac; tự đăng nhập khi mở Warp (trừ host có bastion).\"\n        case .prompt: return \"Mật khẩu/OTP nhập trong Warp, app không lưu.\"\n        }\n    }\n\n    private func clearSavedPassword() async {\n        // Nhân bản: bản sao chưa có item nào, chỉ bỏ ý định sao chép (không đụng Keychain của host gốc).\n        if isDuplicate {\n            hasSavedPassword = false\n            changingPassword = false\n            passwordInput = \"\"\n            if draft.authChoice == .password { draft.authChoice = .prompt }\n            return\n        }\n        guard let b = base, let updated = await model.clearPassword(hostID: b.id) else { return }\n        base = updated\n        hasSavedPassword = false\n        changingPassword = false\n        passwordInput = \"\"\n        if draft.authChoice == .password { draft.authChoice = .prompt }\n    }\n\n    private var bookmarks: some View {\n        VStack(alignment: .leading) {\n            Text(\"Bookmark thư mục remote\").font(.subheadline)\n            ForEach(draft.bookmarks.indices, id: \\.self) { i in\n                HStack {\n                    TextField(\"Tên\", text: $draft.bookmarks[i].name)\n                    TextField(\"Đường dẫn\", text: $draft.bookmarks[i].path)\n                    Button {\n                        draft.bookmarks.remove(at: i)\n                    } label: {\n                        Image(systemName: \"minus.circle\")\n                    }\n                    .buttonStyle(.borderless)\n                }\n            }\n            Button(\"Thêm bookmark\") { draft.bookmarks.append(RemoteBookmark(name: \"\", path: \"\")) }\n        }\n    }\n\n    /// Trường kèm thông báo lỗi ngay bên dưới.\n    private func field<C: View>(\n        _ label: String, _ f: HostDraft.Field, @ViewBuilder content: () -> C\n    ) -> some View {\n        VStack(alignment: .leading, spacing: 2) {\n            content()\n            if let e = errors[f] { Text(e).font(.caption).foregroundStyle(Theme.red) }\n        }\n    }\n\n    private func load() {\n        guard !loaded else { return }\n        loaded = true\n        if case .new = target { draft = HostDraft(newHostDefaults: model.settings) }\n        if case .duplicate(let source, let copy) = target {\n            duplicateSource = source\n            base = copy\n            hasSavedPassword = model.hasOwnPassword(source)\n            draft = HostDraft(host: copy, hasSavedPassword: hasSavedPassword)\n            showAdvanced = true\n            nameFocused = true\n            // Bôi đen tên sau khi ô nhận focus để gõ là thay luôn.\n            Task { @MainActor in\n                try? await Task.sleep(nanoseconds: 150_000_000)\n                NSApp.sendAction(#selector(NSText.selectAll(_:)), to: nil, from: nil)\n            }\n        }\n        if case .edit(let h) = target {\n            base = h\n            hasSavedPassword = model.hasOwnPassword(h)\n            draft = HostDraft(host: h, hasSavedPassword: hasSavedPassword)\n            showAdvanced = true\n        }\n    }\n\n    /// Chỉ lấy đường dẫn; không đọc nội dung file khoá.\n    private func chooseKey() {\n        let panel = NSOpenPanel()\n        panel.canChooseFiles = true\n        panel.canChooseDirectories = false\n        panel.allowsMultipleSelection = false\n        panel.showsHiddenFiles = true\n        panel.directoryURL = FileManager.default.homeDirectoryForCurrentUser\n            .appendingPathComponent(\".ssh\")\n        panel.prompt = \"Chọn\"\n        if panel.runModal() == .OK, let url = panel.url { draft.identityFile = url.path }\n    }\n\n    private static let newFolderTag = \"\\u{1}new-folder\"\n\n    private var folderError: String? {\n        let t = draft.project.trimmingCharacters(in: .whitespacesAndNewlines)\n        if t.isEmpty { return nil }\n        do { _ = try HostFolders.normalize(t) } catch { return AppModel.message(for: error) }\n        return nil\n    }\n\n    /// Chọn thư mục sẵn có hoặc \"Thư mục mới…\" (hiện ô nhập tên).\n    private var folderField: some View {\n        let creating = creatingFolder\n        return VStack(alignment: .leading, spacing: 6) {\n            Picker(\n                \"Thư mục\",\n                selection: Binding(\n                    get: { creating ? Self.newFolderTag : draft.project },\n                    set: { value in\n                        if value == Self.newFolderTag {\n                            creatingFolder = true\n                            draft.project = \"\"\n                        } else {\n                            creatingFolder = false\n                            draft.project = value\n                        }\n                    })\n            ) {\n                Text(HostFolders.uncategorizedTitle).tag(\"\")\n                ForEach(folderChoices, id: \\.self) { Text($0).tag($0) }\n                Divider()\n                Text(\"Thư mục mới…\").tag(Self.newFolderTag)\n            }\n            if creating {\n                TextField(\"Tên thư mục mới\", text: $draft.project)\n            }\n            if let folderError { Text(folderError).font(.caption).foregroundStyle(.red) }\n        }\n    }\n\n    private var folderChoices: [String] {\n        let cur = draft.project\n        return cur.isEmpty || model.folders.contains(cur) ? model.folders : model.folders + [cur]\n    }\n\n    private func save() async {\n        saving = true\n        defer { saving = false }\n        var profile = draft.profile(basedOn: base)\n        profile.project = model.canonicalFolder(profile.project)\n        // Lấy giá trị ra rồi xoá khỏi state ngay: không giữ password trong view sau khi lưu.\n        let password = draft.authChoice == .password && !passwordInput.isEmpty ? passwordInput : nil\n        passwordInput = \"\"\n        let removeStored =\n            !isDuplicate && draft.removesStoredPassword(hasSavedPassword: hasSavedPassword)\n        let copyFrom =\n            isDuplicate && hasSavedPassword && draft.authChoice == .password ? duplicateSource?.id : nil\n        if await model.save(profile, isNew: isNew, password: password, copyPasswordFrom: copyFrom) {\n            if removeStored { _ = await model.clearPassword(hostID: profile.id) }\n            dismiss()\n        }\n    }\n}\n"}, "Sources/SSHDesk/HostListView.swift": {"group": "Giao diện", "text": "import SSHDeskCore\nimport SwiftUI\n\nstruct EnvironmentBadge: View {\n    let environment: HostEnvironment\n\n    private var style: HostEnvironmentStyle {\n        switch environment {\n        case .prod: return .warm\n        case .stg: return .cool\n        default: return .neutral\n        }\n    }\n\n    var body: some View {\n        let color = Theme.environmentColor(style)\n        Text(HostPresentation.badgeCode(for: environment))\n            .font(.system(size: 11, weight: .bold))\n            .padding(.horizontal, 8).padding(.vertical, 3)\n            .foregroundStyle(color)\n            .background(color.opacity(0.12), in: RoundedRectangle(cornerRadius: 6))\n            .overlay(RoundedRectangle(cornerRadius: 6).strokeBorder(color.opacity(0.55)))\n            .accessibilityLabel(\"Môi trường \\(HostPresentation.title(for: environment))\")\n    }\n}\n\n/// Ô icon server (xanh lá khi đang chọn).\nstruct ServerGlyph: View {\n    var highlighted = false\n    var windows = false\n    var body: some View {\n        Image(systemName: windows ? \"desktopcomputer\" : \"server.rack\")\n            .font(.system(size: 17))\n            .foregroundStyle(highlighted ? Theme.green : Theme.textSecondary)\n            .frame(width: 24)\n    }\n}\n\n/// Quyết định click vào hàng làm gì (thuần, dễ kiểm tra): 1 lần = chọn, 2 lần = mở Warp.\nenum RowTap {\n    enum Action { case select, open }\n    static func action(tapCount: Int) -> Action { tapCount >= 2 ? .open : .select }\n}\n\n/// Cột giữa: tiêu đề, bộ lọc, bảng máy chủ.\nstruct HostListView: View {\n    @Bindable var model: AppModel\n    @FocusState private var listFocused: Bool\n\n    private static let addressWidth: CGFloat = 140\n    private static let envWidth: CGFloat = 76\n\n    var body: some View {\n        VStack(alignment: .leading, spacing: 16) {\n            header\n            Group {\n                if model.hosts.isEmpty {\n                    emptyState\n                } else {\n                    table\n                }\n            }\n            .cardStyle()\n        }\n        .padding(.horizontal, 22).padding(.top, 18).padding(.bottom, 14)\n    }\n\n    // MARK: Header\n\n    private var header: some View {\n        HStack(alignment: .top) {\n            VStack(alignment: .leading, spacing: 2) {\n                Text(model.columnTitle).font(.system(size: 26, weight: .bold))\n                Text(\"Máy chủ của bạn, một nơi\")\n                    .font(.system(size: 14)).foregroundStyle(Theme.textSecondary)\n            }\n            Spacer(minLength: 8)\n            environmentMenu\n            Button {\n                model.form = .new\n            } label: {\n                Label(\"Thêm máy chủ\", systemImage: \"plus\")\n            }\n            .buttonStyle(ProminentButtonStyle())\n            .help(\"Thêm máy chủ (⌘N)\")\n        }\n    }\n\n    private var environmentMenu: some View {\n        let current = model.effectiveEnvironment\n        return Menu {\n            Button(\"Tất cả môi trường\") { model.setEnvironmentFilter(nil) }\n            Divider()\n            ForEach(HostPresentation.environmentOrder, id: \\.self) { env in\n                Button(HostPresentation.title(for: env)) { model.setEnvironmentFilter(env) }\n            }\n        } label: {\n            HStack(spacing: 6) {\n                Text(current.map(HostPresentation.title(for:)) ?? \"Tất cả môi trường\")\n                Image(systemName: \"chevron.down\").font(.system(size: 10, weight: .semibold))\n            }\n            .font(.system(size: 13, weight: .medium))\n            .foregroundStyle(Theme.textPrimary)\n            .padding(.horizontal, 12).padding(.vertical, 8)\n            .background(Theme.control, in: RoundedRectangle(cornerRadius: 9))\n            .overlay(RoundedRectangle(cornerRadius: 9).strokeBorder(Theme.cardStroke))\n        }\n        .menuStyle(.button).buttonStyle(.plain).menuIndicator(.hidden).fixedSize()\n        .help(\"Lọc theo môi trường\")\n    }\n\n    // MARK: Bảng\n\n    private var table: some View {\n        VStack(spacing: 0) {\n            columnHeader\n            Divider().overlay(Theme.divider)\n            let hosts = model.visibleHosts\n            if model.isGroupedTable && (!hosts.isEmpty || !model.folders.isEmpty) {\n                ScrollView {\n                    LazyVStack(spacing: 0) {\n                        ForEach(model.tableGroups, id: \\.name) { group in\n                            groupHeader(group)\n                            if !model.collapsedGroups.contains(group.name) {\n                                ForEach(group.hosts) { host in row(host) }\n                                if group.hosts.isEmpty {\n                                    Text(\"Thư mục trống — kéo máy chủ vào đây ở thanh bên hoặc thêm máy mới.\")\n                                        .font(.system(size: 12)).foregroundStyle(Theme.textTertiary)\n                                        .padding(.horizontal, 40).padding(.vertical, 10)\n                                        .frame(maxWidth: .infinity, alignment: .leading)\n                                }\n                            }\n                        }\n                    }\n                }\n            } else if hosts.isEmpty {\n                noResults.frame(maxWidth: .infinity, maxHeight: .infinity)\n            } else {\n                ScrollView {\n                    LazyVStack(spacing: 0) {\n                        ForEach(hosts) { host in row(host) }\n                    }\n                }\n            }\n        }\n        .focusable()\n        .focused($listFocused)\n        .focusEffectDisabled()\n        // Return = Mở Warp; ↑/↓ đổi chọn; ⌫ xoá. Phím có ⌘ (⌘D/⌘E/⌘Return/⌘⌫) chỉ đi qua menu để khỏi chạy hai lần. Chỉ nhận phím khi bảng đang giữ focus (ô tìm kiếm tự nhận phím của nó).\n        .onKeyPress(.return) {\n            guard let host = model.selectedHost else { return .ignored }\n            Task { await model.open(host) }\n            return .handled\n        }\n        .onKeyPress(.delete) {\n            guard model.selectedHost != nil else { return .ignored }\n            model.deleteSelected()\n            return .handled\n        }\n        .onKeyPress(.upArrow) { moveSelection(-1) }\n        .onKeyPress(.downArrow) { moveSelection(1) }\n    }\n\n    private func groupHeader(_ group: HostGroup) -> some View {\n        let collapsed = model.collapsedGroups.contains(group.name)\n        return Button {\n            model.toggleGroup(group.name)\n        } label: {\n            HStack(spacing: 8) {\n                Image(systemName: collapsed ? \"chevron.right\" : \"chevron.down\")\n                    .font(.system(size: 10, weight: .bold)).frame(width: 14)\n                Image(systemName: group.isUncategorized ? \"tray\" : \"folder\")\n                    .foregroundStyle(Theme.textSecondary)\n                Text(group.title).font(.system(size: 13, weight: .semibold)).lineLimit(1)\n                Text(\"\\(group.hosts.count)\").font(.system(size: 12))\n                    .foregroundStyle(Theme.textSecondary).monospacedDigit()\n                Spacer()\n            }\n            .foregroundStyle(Theme.textPrimary)\n            .padding(.horizontal, 14).padding(.vertical, 8)\n            .frame(maxWidth: .infinity, alignment: .leading)\n            .background(Theme.rowHover)\n            .contentShape(Rectangle())\n        }\n        .buttonStyle(.plain)\n        .help(collapsed ? \"Mở nhóm\" : \"Thu gọn nhóm\")\n        .accessibilityLabel(\"\\(group.title), \\(group.hosts.count) máy chủ, \\(collapsed ? \"đang thu gọn\" : \"đang mở\")\")\n    }\n\n    private func moveSelection(_ delta: Int) -> KeyPress.Result {\n        let hosts = model.navigableHosts\n        guard !hosts.isEmpty else { return .ignored }\n        let current = hosts.firstIndex { $0.id == model.selection }\n        let next = current.map { min(hosts.count - 1, max(0, $0 + delta)) } ?? 0\n        model.selection = hosts[next].id\n        return .handled\n    }\n\n    private var columnHeader: some View {\n        HStack(spacing: 0) {\n            Button {\n                model.sortAscending.toggle()\n            } label: {\n                HStack(spacing: 4) {\n                    Text(\"TÊN\")\n                    Image(systemName: model.sortAscending ? \"chevron.up\" : \"chevron.down\")\n                        .font(.system(size: 8, weight: .bold))\n                }\n            }\n            .buttonStyle(.plain)\n            .disabled(model.sidebar == .recent)\n            .help(model.sidebar == .recent ? \"Gần đây sắp theo thời gian mở\" : \"Đổi thứ tự sắp xếp\")\n            .padding(.leading, 38)\n            .frame(maxWidth: .infinity, alignment: .leading)\n            Text(\"ĐỊA CHỈ\").frame(width: Self.addressWidth, alignment: .leading)\n            Text(\"MÔI TRƯỜNG\").frame(width: Self.envWidth + 14, alignment: .leading)\n            Spacer().frame(width: 28 + 28 + 8)\n        }\n        .font(.system(size: 11, weight: .semibold)).tracking(0.5)\n        .foregroundStyle(Theme.textSecondary)\n        .padding(.horizontal, 14).padding(.vertical, 12)\n    }\n\n    private func row(_ host: HostProfile) -> some View {\n        let selected = model.selection == host.id\n        return HStack(spacing: 0) {\n            HStack(spacing: 10) {\n                ServerGlyph(highlighted: selected, windows: host.kind == .windowsRDP)\n                Text(host.displayName).font(.system(size: 14.5)).lineLimit(1)\n                SourceBadge(host: host, sourceName: model.inventory.sourceName(for: host))\n            }\n            .frame(maxWidth: .infinity, alignment: .leading)\n            Text(HostPresentation.addressText(host))\n                .font(.system(size: 13, design: .monospaced))\n                .lineLimit(1).truncationMode(.middle)\n                .frame(width: Self.addressWidth, alignment: .leading)\n            EnvironmentBadge(environment: host.environment)\n                .frame(width: Self.envWidth + 14, alignment: .leading)\n            Button {\n                Task { await model.toggleFavorite(host) }\n            } label: {\n                Image(systemName: host.isFavorite ? \"star.fill\" : \"star\")\n                    .font(.system(size: 14))\n                    .foregroundStyle(host.isFavorite ? Theme.star : Theme.textSecondary)\n                    .frame(width: 28, height: 28).contentShape(Rectangle())\n            }\n            .buttonStyle(.plain)\n            .help(host.isFavorite ? \"Bỏ yêu thích\" : \"Đánh dấu yêu thích\")\n            .accessibilityLabel(host.isFavorite ? \"Bỏ yêu thích\" : \"Đánh dấu yêu thích\")\n            Menu {\n                hostActions(host)\n            } label: {\n                Image(systemName: \"ellipsis\").font(.system(size: 14))\n                    .foregroundStyle(Theme.textSecondary)\n                    .frame(width: 28, height: 28).contentShape(Rectangle())\n            }\n            .menuStyle(.button).buttonStyle(.plain).menuIndicator(.hidden).fixedSize()\n            .accessibilityLabel(\"Thao tác khác\")\n        }\n        .foregroundStyle(Theme.textPrimary)\n        .padding(.horizontal, 14).padding(.vertical, 9)\n        .background(selected ? Theme.rowSelected : .clear)\n        .contentShape(Rectangle())\n        // Chọn ngay khi nhấn (không chờ phân biệt double-click); double-click = Mở Warp.\n        // Hai cử chỉ chạy đồng thời để single-click không bị trễ/nuốt. Nút sao và ⋯ tự xử lý click của chúng.\n        .simultaneousGesture(\n            TapGesture().onEnded {\n                if RowTap.action(tapCount: 1) == .select {\n                    model.selection = host.id\n                    listFocused = true\n                }\n            }\n        )\n        .simultaneousGesture(\n            TapGesture(count: 2).onEnded {\n                if RowTap.action(tapCount: 2) == .open {\n                    model.selection = host.id\n                    Task { await model.open(host) }\n                }\n            }\n        )\n        .contextMenu { hostActions(host) }\n        .onDrag {\n            model.selection = host.id\n            return NSItemProvider(object: HostFolders.dragPayload([host.id]) as NSString)\n        }\n        .accessibilityElement(children: .combine)\n        .accessibilityAddTraits(selected ? .isSelected : [])\n    }\n\n    @ViewBuilder\n    private func hostActions(_ host: HostProfile) -> some View {\n        if host.kind == .windowsRDP {\n            Button(\"Mở Windows App\") { Task { await model.openInWindowsApp(host) } }\n            if model.hasStoredPassword(host) {\n                Button(\"Copy mật khẩu\") { Task { await model.copyWindowsPassword(host) } }\n            }\n            Button(\"Hiện file .rdp trong Finder\") { Task { await model.revealRDPFile(host) } }\n        } else {\n            Button(\"Mở Warp\") { Task { await model.openInWarp(host) } }\n            Button(\"Copy lệnh SSH\") { Task { await model.copySSHCommand(host) } }\n        }\n        Divider()\n        if !model.folders.isEmpty {\n            Menu(\"Chuyển vào thư mục\") {\n                ForEach(model.folders, id: \\.self) { f in\n                    Button(f) { Task { await model.moveHosts([host.id], toFolder: f) } }\n                        .disabled(host.project == f)\n                }\n                if !host.project.isEmpty {\n                    Divider()\n                    Button(\"Chưa phân loại\") { Task { await model.moveHosts([host.id], toFolder: nil) } }\n                }\n            }\n        }\n        Button(\"Sửa…\") { model.form = .edit(host) }\n        Button {\n            model.beginDuplicate(host)\n        } label: {\n            Label(\"Nhân bản…\", systemImage: \"plus.square.on.square\")\n        }\n        Button(\"Xoá…\", role: .destructive) { model.pendingDelete = host }\n    }\n\n    // MARK: Trống\n\n    private var emptyState: some View {\n        ContentUnavailableView {\n            Label(\"Chưa có máy chủ nào\", systemImage: \"server.rack\")\n        } description: {\n            Text(\"Thêm máy chủ thủ công hoặc import các alias có sẵn trong ~/.ssh/config.\")\n        } actions: {\n            Button(\"Thêm máy chủ\") { model.form = .new }.buttonStyle(.borderedProminent)\n            Button(\"Import từ SSH config\") { model.showImport = true }\n        }\n        .frame(maxWidth: .infinity, maxHeight: .infinity)\n    }\n\n    private var emptyScope: HostEmptyState.Scope {\n        if let env = model.effectiveEnvironment { return .environment(env) }\n        switch model.sidebar {\n        case .favorites: return .favorites\n        case .recent: return .recent\n        case .folder(let name): return .folder(name)\n        case .uncategorized: return .uncategorized\n        default: return .all\n        }\n    }\n\n    private var noResults: some View {\n        let searching = !model.searchText.trimmingCharacters(in: .whitespaces).isEmpty\n        let c = HostEmptyState.content(\n            scope: emptyScope, searching: searching, hasAnyHosts: !model.hosts.isEmpty)\n        return ContentUnavailableView {\n            Label(c.title, systemImage: c.symbol)\n        } description: {\n            Text(c.message)\n        } actions: {\n            if c.offersAdd {\n                Button(\"Thêm máy chủ\") { model.form = .new }.buttonStyle(.borderedProminent)\n            }\n        }\n    }\n}\n"}, "Sources/SSHDesk/InventoryModel.swift": {"group": "Giao diện", "text": "import AppKit\nimport Foundation\nimport Observation\nimport SSHDeskCore\nimport UniformTypeIdentifiers\n\n/// Bước ghép cột của một nguồn bảng đang thêm / sửa (ADR-026). Không giữ giá trị cột mật khẩu: Core đã bỏ.\n@MainActor @Observable\nfinal class InventoryWizard: Identifiable {\n    let id = UUID()\n    var url: URL\n    var loaded: InventoryFile.Loaded\n    /// Nguồn đang sửa; nil = thêm mới.\n    let editing: InventorySource?\n    var sheetName: String\n    var headerRow: Int\n    var mapping: TableMapping\n    var sourceName: String\n    var folder: String\n    var environment: HostEnvironment?\n    var saveAsSource = true\n    var reloading = false\n    var note: String?\n    /// ADR-031: bật từng lần, không lưu vào config_json.\n    var keepPassword = false\n    var overwritePassword = false\n    /// Cột mật khẩu được chọn (một cột).\n    var secretHeader = \"\"\n\n    init(url: URL, loaded: InventoryFile.Loaded, editing: InventorySource?, suggestedNote: String? = nil) {\n        self.url = url\n        self.loaded = loaded\n        self.editing = editing\n        self.note = suggestedNote\n        let saved = editing?.tableMapping\n        let initial = saved.flatMap { InventoryFile.sheet(in: loaded.workbook, for: $0) } ?? loaded.workbook.sheets[0]\n        var map =\n            saved.flatMap { $0.resolve(in: initial).needsRemap ? nil : $0 }\n            ?? TableMapping.guess(sheet: initial, restrictTo: InventoryField.freeMappingFields)\n        map.sheet = loaded.kind == .csv ? nil : initial.name\n        self.sheetName = initial.name\n        self.headerRow = initial.headerRow\n        self.mapping = map\n        self.sourceName = editing?.name ?? url.deletingPathExtension().lastPathComponent\n        self.folder = editing?.folder ?? \"\"\n        self.environment = editing?.defaultEnvironment\n        self.secretHeader = initial.passwordColumns.sorted { $0.key < $1.key }.first?.value ?? \"\"\n    }\n\n    /// Xoá bộ nhớ giá trị cột mật khẩu và tắt lựa chọn.\n    func discardSecrets() {\n        loaded.secrets?.wipe()\n        loaded.secrets = nil\n        keepPassword = false\n        overwritePassword = false\n    }\n\n    var sheet: TableSheet? { loaded.workbook.sheets.first { $0.name == sheetName } }\n\n    var isTemplate: Bool { loaded.template != nil }\n\n    /// Tiêu đề chọn được: bỏ ô trống, bỏ cột giống mật khẩu (không bao giờ ghép được), bỏ trùng.\n    var headerChoices: [String] {\n        var seen = Set<String>()\n        var out: [String] = []\n        for text in sheet?.header?.cells ?? [] {\n            let t = text.trimmingCharacters(in: .whitespacesAndNewlines)\n            guard !t.isEmpty, !PasswordHeader.matches(t), seen.insert(HeaderText.normalize(t)).inserted else {\n                continue\n            }\n            out.append(t)\n        }\n        return out\n    }\n\n    var passwordHeaders: [String] {\n        (sheet?.passwordColumns ?? [:]).sorted { $0.key < $1.key }.map(\\.value)\n    }\n\n    func header(for field: InventoryField) -> String { mapping.header(for: field) ?? \"\" }\n\n    func setHeader(_ text: String, for field: InventoryField) {\n        // Core chặn cột giống mật khẩu; ở đây chỉ gọi, lỗi (không thể xảy ra vì danh sách đã lọc) thì bỏ qua.\n        try? mapping.set(field, header: text.isEmpty ? nil : text)\n        if mapping.keyField == .name && mapping.header(for: .name) == nil { mapping.keyField = .hostName }\n    }\n}\n\n/// Màn xem trước kế hoạch đồng bộ (luôn qua đây trước khi ghi).\n@MainActor @Observable\nfinal class InventoryPreview: Identifiable {\n    let id = UUID()\n    var plan: InventorySyncPlan\n    /// Quay lại bước ghép cột (nếu đi từ wizard).\n    let wizard: InventoryWizard?\n    let title: String\n    /// Kế hoạch lưu mật khẩu cột bí mật (ADR-031); nil = không lưu. Không chứa giá trị.\n    var secretPlan: InventorySecretImport.Plan?\n\n    init(\n        plan: InventorySyncPlan, wizard: InventoryWizard?, title: String,\n        secretPlan: InventorySecretImport.Plan? = nil\n    ) {\n        self.plan = plan\n        self.wizard = wizard\n        self.title = title\n        self.secretPlan = secretPlan\n    }\n}\n\n/// Bước đặt tên / thư mục / môi trường mặc định của nguồn JSON hoặc Ansible (không có ghép cột).\n@MainActor @Observable\nfinal class StructuredSetup: Identifiable {\n    let id = UUID()\n    let url: URL\n    let kind: InventorySourceKind\n    var loaded: InventoryStructured.Loaded\n    let editing: InventorySource?\n    var sourceName: String\n    var folder: String\n    var environment: HostEnvironment?\n    var saveAsSource = true\n\n    init(url: URL, kind: InventorySourceKind, loaded: InventoryStructured.Loaded, editing: InventorySource?) {\n        self.url = url\n        self.kind = kind\n        self.loaded = loaded\n        self.editing = editing\n        self.sourceName = editing?.name ?? url.deletingPathExtension().lastPathComponent\n        self.folder = editing?.folder ?? \"\"\n        self.environment = editing?.defaultEnvironment\n    }\n}\n\n/// Thông báo \"Đã thêm N máy từ <nguồn>\" (ADR-026b). Chỉ sống trong phiên chạy app.\nstruct AutoAddNotice: Identifiable {\n    let id = UUID()\n    let record: InventoryAutoAddRecord\n    var count: Int { record.hostIDs.count }\n}\n\nenum InventoryRoute {\n    case list\n    case structured(StructuredSetup)\n    case wizard(InventoryWizard)\n    case preview(InventoryPreview)\n}\n\n@MainActor @Observable\nfinal class InventoryModel {\n    weak var app: AppModel?\n    private(set) var sources: [InventorySource] = []\n    private(set) var usage: [UUID: (hosts: Int, missing: Int)] = [:]\n    /// Nguồn có file đổi / mất (chỉ giữ trạng thái khác `.unchanged`).\n    private(set) var changes: [UUID: InventoryFile.Change] = [:]\n    var dismissedBanner: Set<UUID> = []\n    var showHub = false\n    var route: InventoryRoute = .list\n    var busy = false\n    /// Thông báo cần bấm \"Đã hiểu\" (vd. nhắc xoá file gốc chứa mật khẩu dạng rõ).\n    var notice: String?\n    var confirmDelete: InventorySource?\n    /// Các lần tự thêm máy chưa đóng (ADR-026b).\n    var autoAdded: [AutoAddNotice] = []\n    private var checking = false\n\n    init(app: AppModel) { self.app = app }\n\n    // MARK: - Dữ liệu\n\n    func refreshData() async {\n        guard let repo = app?.hostRepository else { return }\n        do {\n            sources = try await repo.inventorySources()\n            usage = try await repo.inventorySourceUsage()\n            changes = changes.filter { id, _ in sources.contains { $0.id == id } }\n        } catch { app?.show(error, title: \"Không đọc được danh sách nguồn\") }\n    }\n\n    func source(id: UUID?) -> InventorySource? {\n        guard let id else { return nil }\n        return sources.first { $0.id == id }\n    }\n\n    func sourceName(for host: HostProfile) -> String? { source(id: host.sourceID)?.name }\n\n    /// Nguồn có ghép cột ghi chú -> ghi chú của host cũng do nguồn quản lý.\n    func managesNotes(_ host: HostProfile) -> Bool {\n        source(id: host.sourceID)?.tableMapping?.header(for: .notes) != nil\n    }\n\n    var bannerSources: [InventorySource] {\n        sources.filter { s in\n            if dismissedBanner.contains(s.id) { return false }\n            switch changes[s.id] {\n            case .changed?, .fileMissing?: return true\n            default: return false\n            }\n        }\n    }\n\n    /// Mở app / app được kích hoạt: so mtime rồi SHA-256 với vân tay đã lưu.\n    /// Nguồn bật \"Tự thêm máy mới\" mà kế hoạch chỉ có máy mới (ADR-026b) thì tự áp dụng; còn lại chỉ báo, không ghi gì.\n    func checkChanges() async {\n        guard !checking else { return }\n        checking = true\n        defer { checking = false }\n        await refreshData()\n        let snapshot = sources\n        var result: [UUID: InventoryFile.Change] = [:]\n        for s in snapshot {\n            let change = await Task.detached {\n                InventoryFile.detectChange(path: s.path, kind: s.kind, lastFingerprint: s.lastFingerprint)\n            }.value\n            if change != .unchanged { result[s.id] = change }\n        }\n        for (id, change) in result where changes[id] != change { dismissedBanner.remove(id) }\n        changes = result\n        // Không tự áp dụng khi người dùng đang ở giữa wizard / xem trước (kế hoạch của họ sẽ cũ đi).\n        guard canAutoApply else { return }\n        for s in snapshot where result[s.id] == .changed && s.autoAddNew {\n            await autoApplyIfAdditionsOnly(s)\n        }\n    }\n\n    /// Chỉ tự áp dụng khi không có hub mở ở route khác danh sách, không có việc đang chạy.\n    private var canAutoApply: Bool {\n        guard !busy else { return false }\n        if showHub, case .list = route { return true }\n        return !showHub\n    }\n\n    /// Dựng kế hoạch đồng bộ không đổi route. nil = cần ghép lại cột (không tự xử lý được).\n    private func computePlan(_ source: InventorySource) async throws -> InventorySyncPlan? {\n        guard let app else { return nil }\n        let hosts = app.hosts\n        let sets = app.credentialSets\n        if InventoryStructured.supports(source.kind) {\n            return try await Task.detached {\n                try InventoryStructured.resync(source: source, existingHosts: hosts, credentialSets: sets)\n            }.value\n        }\n        let outcome = try await Task.detached {\n            try InventoryFile.resync(source: source, existingHosts: hosts, credentialSets: sets)\n        }.value\n        if case .ready(_, let plan) = outcome { return plan }\n        return nil\n    }\n\n    /// Tự áp dụng nếu chỉ có máy mới. Không lưu mật khẩu, không giữ cột bí mật (resync không đọc cột đó).\n    /// Mọi lỗi / kế hoạch không sạch -> im lặng, giữ banner \"Nguồn có thay đổi\" để xem trước.\n    private func autoApplyIfAdditionsOnly(_ source: InventorySource) async {\n        guard let app, let service = app.service else { return }\n        guard let plan = try? await computePlan(source), InventorySync.isAdditionsOnly(plan) else { return }\n        // computePlan là async: người dùng có thể đã mở hub / wizard / xem trước trong lúc chờ -> kiểm lại cổng.\n        guard canAutoApply else { return }\n        busy = true\n        defer { busy = false }\n        do {\n            let record = try await service.applyAutoInventory(plan)\n            autoAdded.append(AutoAddNotice(record: record))\n            changes[source.id] = nil\n            await app.reload()\n        } catch {\n            // Không ghi gì (một transaction); người dùng vẫn thấy banner và tự xem trước được.\n        }\n    }\n\n    func setAutoAdd(_ source: InventorySource, enabled: Bool) async {\n        guard let app, let service = app.service else { return }\n        do {\n            try await service.setInventoryAutoAdd(sourceID: source.id, enabled: enabled)\n            await refreshData()\n        } catch { app.show(error, title: \"Không đổi được tuỳ chọn của nguồn\") }\n    }\n\n    func dismissAutoAdded(_ notice: AutoAddNotice) {\n        autoAdded.removeAll { $0.id == notice.id }\n        if app?.focusHostIDs == Set(notice.record.hostIDs) { app?.focusHostIDs = nil }\n    }\n\n    /// \"Xem\": lọc danh sách tới đúng các máy vừa thêm và chọn máy đầu tiên.\n    func showAutoAdded(_ notice: AutoAddNotice) {\n        guard let app else { return }\n        app.sidebar = .all\n        app.searchText = \"\"\n        app.environmentFilter = nil\n        app.focusHostIDs = Set(notice.record.hostIDs)\n        app.selection = notice.record.hostIDs.first { id in app.hosts.contains { $0.id == id } }\n    }\n\n    func undoAutoAdded(_ notice: AutoAddNotice) async {\n        guard let app, let service = app.service else { return }\n        do {\n            let outcome = try await service.undoAutoAdd(notice.record)\n            dismissAutoAdded(notice)\n            await app.reload()\n            await refreshData()\n            var text = \"Đã hoàn tác: xoá \\(outcome.removed.count) máy\"\n            if !outcome.kept.isEmpty { text += \", giữ \\(outcome.kept.count) máy đã bị sửa hoặc đang được dùng\" }\n            app.showToast(text + \". Đã tắt “Tự thêm máy mới” của “\\(notice.record.sourceName)”.\")\n        } catch { app.show(error, title: \"Không hoàn tác được\") }\n    }\n\n    // MARK: - Hub\n\n    func openHub() {\n        route = .list\n        showHub = true\n        Task { await checkChanges() }\n    }\n\n    /// Huỷ wizard/xem trước: xoá bộ nhớ giá trị cột mật khẩu rồi về danh sách.\n    func cancelToList() {\n        if case .wizard(let w) = route { w.discardSecrets() }\n        if case .preview(let p) = route { p.wizard?.discardSecrets() }\n        route = .list\n    }\n\n    func close() {\n        if case .wizard(let w) = route { w.discardSecrets() }\n        if case .preview(let p) = route { p.wizard?.discardSecrets() }\n        showHub = false\n        route = .list\n    }\n\n    // MARK: - Thêm / sửa nguồn\n\n    func addSource() {\n        guard let url = pickFile(title: \"Chọn file Excel hoặc CSV\") else { return }\n        Task { await open(url: url, editing: nil) }\n    }\n\n    func addStructuredSource(kind: InventorySourceKind) {\n        guard let url = pickFile(title: \"Chọn file \\(kind.title)\", kind: kind) else { return }\n        Task { await openStructured(url: url, kind: kind, editing: nil) }\n    }\n\n    private func pickFile(title: String, kind: InventorySourceKind = .excel) -> URL? {\n        let panel = NSOpenPanel()\n        panel.title = title\n        switch kind {\n        case .json:\n            panel.message = \"File xuất của SSH Desk (*.sshdesk.json). Không chứa mật khẩu.\"\n            panel.allowedContentTypes = [.json]\n        case .ansible:\n            panel.message =\n                \"Ansible inventory tĩnh (INI hoặc YAML). App không chạy Ansible, không đọc host_vars/group_vars, bỏ qua biến mật khẩu.\"\n            panel.allowedContentTypes = []\n        default:\n            panel.message =\n                \"Chỉ nhận .xlsx và .csv. Mật khẩu trong file chỉ được lưu khi bạn bật riêng ở bước ghép cột.\"\n            var types: [UTType] = [.commaSeparatedText]\n            if let x = UTType(filenameExtension: \"xlsx\") { types.append(x) }\n            panel.allowedContentTypes = types\n        }\n        panel.canChooseDirectories = false\n        panel.allowsMultipleSelection = false\n        return panel.runModal() == .OK ? panel.url : nil\n    }\n\n    func openStructured(url: URL, kind: InventorySourceKind, editing: InventorySource?) async {\n        busy = true\n        defer { busy = false }\n        do {\n            let loaded = try await Task.detached { try InventoryStructured.load(url: url, kind: kind) }.value\n            route = .structured(StructuredSetup(url: url, kind: kind, loaded: loaded, editing: editing))\n            showHub = true\n        } catch { app?.show(error, title: \"Không đọc được file\") }\n    }\n\n    func showPreview(from setup: StructuredSetup) {\n        guard let app else { return }\n        do {\n            var source: InventorySource?\n            if setup.saveAsSource {\n                let trimmed = setup.sourceName.trimmingCharacters(in: .whitespacesAndNewlines)\n                source = InventorySource(\n                    id: setup.editing?.id ?? UUID(), name: trimmed.isEmpty ? setup.url.lastPathComponent : trimmed,\n                    kind: setup.kind, path: setup.url.path, folder: setup.folder,\n                    defaultEnvironment: setup.environment, configJSON: setup.editing?.configJSON ?? \"{}\",\n                    lastSyncedAt: setup.editing?.lastSyncedAt,\n                    lastFingerprint: setup.editing?.lastFingerprint)\n            }\n            let plan = try InventoryStructured.plan(\n                source: source, loaded: setup.loaded, existingHosts: app.hosts, credentialSets: app.credentialSets)\n            route = .preview(InventoryPreview(plan: plan, wizard: nil, title: setup.url.lastPathComponent))\n        } catch { app.show(error, title: \"Không dựng được bản xem trước\") }\n    }\n\n    func open(url: URL, editing: InventorySource?, note: String? = nil) async {\n        busy = true\n        defer { busy = false }\n        do {\n            let loaded = try await Task.detached {\n                try InventoryFile.load(url: url, headerRow: editing?.tableMapping?.headerRow)\n            }\n            .value\n            let wizard = InventoryWizard(url: url, loaded: loaded, editing: editing, suggestedNote: note)\n            if loaded.template != nil {\n                // File mẫu: bỏ bước ghép cột, vào thẳng xem trước.\n                showPreview(from: wizard)\n            } else {\n                route = .wizard(wizard)\n            }\n            showHub = true\n        } catch { app?.show(error, title: \"Không đọc được file\") }\n    }\n\n    /// Đổi dòng tiêu đề: đọc lại file (để cột mật khẩu được nhận diện theo dòng tiêu đề mới) và đoán lại cột.\n    func changeHeaderRow(_ wizard: InventoryWizard, to row: Int) async {\n        wizard.reloading = true\n        defer { wizard.reloading = false }\n        wizard.discardSecrets()\n        let url = wizard.url\n        do {\n            let loaded = try await Task.detached { try InventoryFile.load(url: url, headerRow: row) }.value\n            wizard.loaded = loaded\n            wizard.headerRow = row\n            wizard.secretHeader = wizard.sheet?.passwordColumns.sorted { $0.key < $1.key }.first?.value ?? \"\"\n            if let sheet = wizard.sheet {\n                wizard.mapping = TableMapping.guess(sheet: sheet, restrictTo: InventoryField.freeMappingFields)\n                wizard.mapping.sheet = loaded.kind == .csv ? nil : sheet.name\n            }\n        } catch { app?.show(error, title: \"Không đọc được file\") }\n    }\n\n    /// Bật/tắt giữ cột mật khẩu: bật -> đọc lại file với cột đó được giữ; tắt -> xoá bộ nhớ.\n    func setKeepPassword(_ wizard: InventoryWizard, _ on: Bool) async {\n        guard on else {\n            wizard.discardSecrets()\n            return\n        }\n        let title = wizard.secretHeader\n        guard !title.isEmpty else { return }\n        wizard.reloading = true\n        defer { wizard.reloading = false }\n        let url = wizard.url\n        let row = wizard.headerRow\n        do {\n            let loaded = try await Task.detached {\n                try InventoryFile.load(url: url, headerRow: row, keepSecretColumn: title)\n            }.value\n            // Wizard đã bị huỷ / đổi route trong lúc đọc: wipe ngay, không gán.\n            guard isShowing(wizard) else {\n                loaded.secrets?.wipe()\n                return\n            }\n            wizard.loaded.secrets?.wipe()\n            wizard.loaded = loaded\n            wizard.keepPassword = loaded.secrets != nil\n        } catch {\n            wizard.discardSecrets()\n            app?.show(error, title: \"Không đọc được file\")\n        }\n    }\n\n    private func isShowing(_ wizard: InventoryWizard) -> Bool {\n        switch route {\n        case .wizard(let w): return w === wizard\n        case .preview(let p): return p.wizard === wizard\n        default: return false\n        }\n    }\n\n    func changeSheet(_ wizard: InventoryWizard, to name: String) {\n        wizard.discardSecrets()\n        wizard.sheetName = name\n        wizard.secretHeader = wizard.sheet?.passwordColumns.sorted { $0.key < $1.key }.first?.value ?? \"\"\n\n        guard let sheet = wizard.sheet else { return }\n        wizard.headerRow = sheet.headerRow\n        wizard.mapping = TableMapping.guess(sheet: sheet, restrictTo: InventoryField.freeMappingFields)\n        wizard.mapping.sheet = wizard.loaded.kind == .csv ? nil : sheet.name\n    }\n\n    func showPreview(from wizard: InventoryWizard) {\n        guard let app else { return }\n        do {\n            var mapping = wizard.mapping\n            mapping.headerRow = wizard.headerRow\n            mapping.sheet = wizard.loaded.kind == .csv ? nil : wizard.sheetName\n            guard let parsed = try InventoryFile.parse(wizard.loaded, mapping: wizard.isTemplate ? nil : mapping)\n            else { return }\n            var source: InventorySource?\n            if wizard.saveAsSource {\n                let trimmed = wizard.sourceName.trimmingCharacters(in: .whitespacesAndNewlines)\n                source = InventorySource(\n                    id: wizard.editing?.id ?? UUID(), name: trimmed.isEmpty ? wizard.url.lastPathComponent : trimmed,\n                    kind: wizard.loaded.kind, path: wizard.url.path, folder: wiz
