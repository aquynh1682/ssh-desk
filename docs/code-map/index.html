let c = keptColumn, c < cells.count,\n                    !cells[c].trimmingCharacters(in: .whitespacesAndNewlines).isEmpty\n                {\n                    keep.set(sheet: name, row: row.number, bytes: Array(cells[c].utf8))\n                }\n                for i in passwordColumns.keys where i < cells.count { cells[i] = \"\" }\n                return TableRow(number: row.number, cells: cells)\n            }\n            warnings.append(\n                keptColumn == nil\n                    ? \"Phát hiện cột mật khẩu — sẽ bỏ qua\"\n                    : \"Cột mật khẩu “\\(passwordColumns[keptColumn!] ?? \"\")” được giữ riêng để lưu vào kho (chỉ khi bạn xác nhận)\"\n            )\n        }\n        return TableSheet(\n            name: name, rows: kept, headerRow: header, passwordColumns: passwordColumns, warnings: warnings)\n    }\n}\n"}, "Sources/SSHDeskCore/Inventory/XLSXReader.swift": {"group": "Core · Inventory", "text": "import Foundation\n\n/// Giới hạn đọc XLSX (ADR-026). Tham số hoá để test dùng giá trị nhỏ.\npublic struct XLSXLimits: Sendable {\n    public var maxFileBytes = 20 * 1_048_576\n    public var maxEntryBytes = 50 * 1_048_576\n    public var maxTotalBytes = 100 * 1_048_576\n    public var timeout: TimeInterval = 15\n    public var maxRows = 5000\n    public var maxColumns = 200\n    public var maxEntries = 10_000\n\n    public init() {}\n}\n\n/// Đọc `.xlsx` không dependency: `/usr/bin/unzip -p` qua executable + argv (env rỗng, không shell),\n/// chỉ các thành phần tên cố định hoặc khớp `^xl/worksheets/[A-Za-z0-9_]+\\.xml$`, parse bằng `XMLParser`.\n/// Không tính công thức (chỉ lấy giá trị `<v>` đã tính sẵn).\npublic enum XLSXReader {\n    static let unzip = \"/usr/bin/unzip\"\n    static let workbookEntry = \"xl/workbook.xml\"\n    static let relsEntry = \"xl/_rels/workbook.xml.rels\"\n    static let sharedStringsEntry = \"xl/sharedStrings.xml\"\n    static let sheetPattern = #\"^xl/worksheets/[A-Za-z0-9_]+\\.xml$\"#\n\n    public static func read(\n        url: URL, headerRow: Int? = nil, limits: XLSXLimits = XLSXLimits(), keepSecret: SecretColumnValues? = nil\n    ) throws -> TableWorkbook {\n        // unzip hiểu tên file zip là wildcard (`a[1].xlsx` có thể đọc nhầm `a1.xlsx`): luôn chạy trên bản sao\n        // trong thư mục tạm 0700 với tên cố định `in.xlsx`.\n        let source = try validateFile(url, limits: limits)\n        let fm = FileManager.default\n        let work = fm.temporaryDirectory.appendingPathComponent(\"sshdesk-xlsx-\\(UUID().uuidString)\", isDirectory: true)\n        do {\n            try fm.createDirectory(at: work, withIntermediateDirectories: true, attributes: [.posixPermissions: 0o700])\n        } catch { throw SpreadsheetError.unreadable(error.localizedDescription) }\n        defer { try? fm.removeItem(at: work) }\n        let copy = work.appendingPathComponent(\"in.xlsx\")\n        do {\n            let data = try Data(contentsOf: URL(fileURLWithPath: source))\n            guard data.count <= limits.maxFileBytes else {\n                throw SpreadsheetError.fileTooLarge(limitMB: max(1, limits.maxFileBytes / 1_048_576))\n            }\n            guard data.count >= 4, data[0] == 0x50, data[1] == 0x4B else { throw SpreadsheetError.notZip }\n            try data.write(to: copy)\n        } catch let e as SpreadsheetError {\n            throw e\n        } catch { throw SpreadsheetError.unreadable(error.localizedDescription) }\n        let path = copy.path\n        let names = try listEntries(path: path, limits: limits)\n        var budget = Budget(limits: limits)\n\n        let workbookData = try readEntry(\n            path: path, entry: workbookEntry, names: names, budget: &budget, limits: limits)\n        let sheetRefs = try parseWorkbook(workbookData)\n        let relsData = try readEntry(path: path, entry: relsEntry, names: names, budget: &budget, limits: limits)\n        let rels = try parseRelationships(relsData)\n\n        var shared: [String] = []\n        var warnings: [String] = []\n        if names.contains(sharedStringsEntry) {\n            let data = try readEntry(\n                path: path, entry: sharedStringsEntry, names: names, budget: &budget, limits: limits)\n            shared = try parseSharedStrings(data)\n        }\n\n        var sheets: [TableSheet] = []\n        for ref in sheetRefs where !ref.hidden {\n            guard let rid = ref.relationshipID, let rel = rels[rid], rel.isWorksheet else { continue }\n            let entry = resolve(target: rel.target)\n            guard entry.range(of: sheetPattern, options: .regularExpression) != nil else {\n                throw SpreadsheetError.unsafeEntryName\n            }\n            let data = try readEntry(path: path, entry: entry, names: names, budget: &budget, limits: limits)\n            sheets.append(\n                try parseSheet(\n                    data, name: ref.name, shared: shared, headerRow: headerRow, limits: limits, keep: keepSecret))\n        }\n        if sheets.isEmpty { throw SpreadsheetError.noSheets }\n        if shared.isEmpty, names.contains(sharedStringsEntry) { warnings.append(\"Bảng chuỗi dùng chung trống.\") }\n        return TableWorkbook(sheets: sheets, warnings: warnings)\n    }\n\n    // MARK: - File & danh sách thành phần\n\n    private static func validateFile(_ url: URL, limits: XLSXLimits) throws -> String {\n        let ext = url.pathExtension.lowercased()\n        guard ext == \"xlsx\" else { throw SpreadsheetError.unsupportedExtension(\".\" + ext) }\n        let resolved = url.resolvingSymlinksInPath().standardizedFileURL\n        let attrs: [FileAttributeKey: Any]\n        do { attrs = try FileManager.default.attributesOfItem(atPath: resolved.path) } catch {\n            throw SpreadsheetError.unreadable(error.localizedDescription)\n        }\n        guard (attrs[.type] as? FileAttributeType) == .typeRegular else { throw SpreadsheetError.notRegularFile }\n        guard let size = (attrs[.size] as? NSNumber)?.intValue, size <= limits.maxFileBytes else {\n            throw SpreadsheetError.fileTooLarge(limitMB: max(1, limits.maxFileBytes / 1_048_576))\n        }\n        guard let fh = FileHandle(forReadingAtPath: resolved.path) else {\n            throw SpreadsheetError.unreadable(resolved.lastPathComponent)\n        }\n        defer { try? fh.close() }\n        let magic = (try? fh.read(upToCount: 4)) ?? Data()\n        guard magic.count == 4, magic[0] == 0x50, magic[1] == 0x4B else { throw SpreadsheetError.notZip }\n        // Đường dẫn tuyệt đối nên không bao giờ bị unzip hiểu thành tuỳ chọn (bắt đầu bằng `-`).\n        return resolved.path\n    }\n\n    private struct Budget {\n        let limits: XLSXLimits\n        var used = 0\n        var remaining: Int { limits.maxTotalBytes - used }\n    }\n\n    static func listEntries(path: String, limits: XLSXLimits) throws -> Set<String> {\n        let result = try BoundedProcess.run(\n            executable: unzip, arguments: [\"-Z1\", path], maxBytes: 4 * 1_048_576, timeout: limits.timeout,\n            exceeded: .tooManyEntries)\n        guard result.status == 0 else {\n            throw result.status == 9 ? SpreadsheetError.notZip : SpreadsheetError.unzipFailed(result.status)\n        }\n        guard let text = String(data: result.stdout, encoding: .utf8) else { throw SpreadsheetError.unsafeEntryName }\n        var lines = text.components(separatedBy: \"\\n\")\n        if lines.last == \"\" { lines.removeLast() }\n        if lines.count > limits.maxEntries { throw SpreadsheetError.tooManyEntries }\n        return try validateEntryNames(lines)\n    }\n\n    /// Từ chối tên trùng (không phân biệt hoa thường), có `..`, đường dẫn tuyệt đối, rỗng hoặc ký tự điều khiển.\n    static func validateEntryNames(_ names: [String]) throws -> Set<String> {\n        var seen = Set<String>()\n        var lowered = Set<String>()\n        for name in names {\n            guard !name.isEmpty, !name.hasPrefix(\"/\"), !name.hasPrefix(\"\\\\\"),\n                !name.unicodeScalars.contains(where: { $0.value < 0x20 || $0.value == 0x7F }),\n                !name.split(separator: \"/\", omittingEmptySubsequences: false).contains(\"..\")\n            else { throw SpreadsheetError.unsafeEntryName }\n            if !lowered.insert(name.lowercased()).inserted { throw SpreadsheetError.duplicateEntry }\n            seen.insert(name)\n        }\n        return seen\n    }\n\n    private static func readEntry(\n        path: String, entry: String, names: Set<String>, budget: inout Budget, limits: XLSXLimits\n    ) throws -> Data {\n        let allowed =\n            [workbookEntry, relsEntry, sharedStringsEntry].contains(entry)\n            || entry.range(of: sheetPattern, options: .regularExpression) != nil\n        guard allowed else { throw SpreadsheetError.unsafeEntryName }\n        guard names.contains(entry) else { throw SpreadsheetError.missingPart(entry) }\n        let cap = min(limits.maxEntryBytes, budget.remaining)\n        let exceeded: SpreadsheetError = budget.remaining < limits.maxEntryBytes ? .totalTooLarge : .entryTooLarge\n        let result = try BoundedProcess.run(\n            executable: unzip, arguments: [\"-p\", path, entry], maxBytes: max(0, cap), timeout: limits.timeout,\n            exceeded: exceeded)\n        guard result.status == 0 else {\n            throw result.status == 11\n                ? SpreadsheetError.missingPart(entry) : SpreadsheetError.unzipFailed(result.status)\n        }\n        budget.used += result.stdout.count\n        return result.stdout\n    }\n\n    /// Target tương đối (gốc `xl/`) hoặc tuyệt đối (`/xl/...`).\n    static func resolve(target: String) -> String {\n        target.hasPrefix(\"/\") ? String(target.dropFirst()) : \"xl/\" + target\n    }\n\n    // MARK: - XML\n\n    /// Từ chối `<!DOCTYPE`/`<!ENTITY`, UTF-16 và mọi thứ không phải UTF-8 trước khi đưa vào XMLParser.\n    static func guardXML(_ data: Data) throws {\n        let b = [UInt8](data.prefix(4))\n        if b.count >= 2, (b[0] == 0xFF && b[1] == 0xFE) || (b[0] == 0xFE && b[1] == 0xFF) {\n            throw SpreadsheetError.notUTF8\n        }\n        if b.count >= 4, b[0] == 0 || b[1] == 0 { throw SpreadsheetError.notUTF8 }\n        let head = String(decoding: data.prefix(200), as: UTF8.self).lowercased()\n        if let r = head.range(of: \"encoding=\") {\n            let tail = head[r.upperBound...].prefix(20)\n            if !tail.contains(\"utf-8\") && !tail.contains(\"utf8\") { throw SpreadsheetError.notUTF8 }\n        }\n        guard String(data: data, encoding: .utf8) != nil else { throw SpreadsheetError.notUTF8 }\n        let doctype = Array(\"doctype\".utf8)\n        let entity = Array(\"entity\".utf8)\n        try data.withUnsafeBytes { (raw: UnsafeRawBufferPointer) in\n            let bytes = raw.bindMemory(to: UInt8.self)\n            var i = 0\n            let n = bytes.count\n            while i + 1 < n {\n                if bytes[i] == 0x3C, bytes[i + 1] == 0x21 {\n                    if matches(bytes, at: i + 2, doctype) || matches(bytes, at: i + 2, entity) {\n                        throw SpreadsheetError.forbiddenXML\n                    }\n                }\n                i += 1\n            }\n        }\n    }\n\n    private static func matches(_ bytes: UnsafeBufferPointer<UInt8>, at start: Int, _ word: [UInt8]) -> Bool {\n        guard start + word.count <= bytes.count else { return false }\n        for (k, w) in word.enumerated() {\n            var c = bytes[start + k]\n            if c >= 0x41 && c <= 0x5A { c += 0x20 }\n            if c != w { return false }\n        }\n        return true\n    }\n\n    private static func runParser(_ data: Data, delegate: XMLParserDelegate & ErrorHolder) throws {\n        try guardXML(data)\n        let parser = XMLParser(data: data)\n        parser.shouldResolveExternalEntities = false\n        parser.shouldProcessNamespaces = false\n        parser.shouldReportNamespacePrefixes = false\n        parser.delegate = delegate\n        let ok = parser.parse()\n        if let e = delegate.failure { throw e }\n        if !ok { throw SpreadsheetError.malformedXML(parser.parserError?.localizedDescription ?? \"không rõ\") }\n    }\n\n    struct SheetRef {\n        var name: String\n        var relationshipID: String?\n        var hidden: Bool\n    }\n\n    static func parseWorkbook(_ data: Data) throws -> [SheetRef] {\n        let d = WorkbookDelegate()\n        try runParser(data, delegate: d)\n        return d.sheets\n    }\n\n    struct Relationship {\n        var target: String\n        var isWorksheet: Bool\n    }\n\n    static func parseRelationships(_ data: Data) throws -> [String: Relationship] {\n        let d = RelsDelegate()\n        try runParser(data, delegate: d)\n        return d.rels\n    }\n\n    static func parseSharedStrings(_ data: Data) throws -> [String] {\n        let d = SharedStringsDelegate()\n        try runParser(data, delegate: d)\n        return d.strings\n    }\n\n    static func parseSheet(\n        _ data: Data, name: String, shared: [String], headerRow: Int?, limits: XLSXLimits,\n        keep: SecretColumnValues? = nil\n    ) throws -> TableSheet {\n        let d = SheetDelegate(shared: shared, limits: limits)\n        try runParser(data, delegate: d)\n        var warnings: [String] = []\n        if d.formulaCount > 0 {\n            warnings.append(\"\\(d.formulaCount) ô có công thức: chỉ lấy giá trị đã tính sẵn, không tính lại.\")\n        }\n        if d.errorCells > 0 { warnings.append(\"\\(d.errorCells) ô lỗi (#REF!...): để trống.\") }\n        if d.badSharedRefs > 0 { warnings.append(\"\\(d.badSharedRefs) ô tham chiếu chuỗi không tồn tại: để trống.\") }\n        return d.builder.finish(name: name, headerRow: headerRow, extraWarnings: warnings, keep: keep)\n    }\n\n    /// Chỉ số cột (0 = A) từ tham chiếu ô như `B3`; nil nếu sai dạng.\n    static func columnIndex(ofReference ref: String) -> Int? {\n        var value = 0\n        var count = 0\n        for u in ref.unicodeScalars {\n            guard u.value >= 0x41 && u.value <= 0x5A || u.value >= 0x61 && u.value <= 0x7A else { break }\n            value = value * 26 + Int(u.value & 0x1F)\n            count += 1\n            if count > 3 { return nil }\n        }\n        return count > 0 ? value - 1 : nil\n    }\n}\n\nprotocol ErrorHolder: AnyObject {\n    var failure: SpreadsheetError? { get }\n}\n\nprivate func localName(_ element: String) -> String {\n    if let i = element.lastIndex(of: \":\") { return String(element[element.index(after: i)...]) }\n    return element\n}\n\nprivate func attribute(_ attrs: [String: String], _ name: String) -> String? {\n    if let v = attrs[name] { return v }\n    return attrs.first { $0.key.hasSuffix(\":\" + name) }?.value\n}\n\nprivate final class WorkbookDelegate: NSObject, XMLParserDelegate, ErrorHolder {\n    var sheets: [XLSXReader.SheetRef] = []\n    var failure: SpreadsheetError?\n\n    func parser(\n        _ parser: XMLParser, didStartElement elementName: String, namespaceURI: String?, qualifiedName qName: String?,\n        attributes attributeDict: [String: String]\n    ) {\n        guard localName(elementName) == \"sheet\", let name = attributeDict[\"name\"] else { return }\n        let state = (attributeDict[\"state\"] ?? \"visible\").lowercased()\n        sheets.append(\n            XLSXReader.SheetRef(\n                name: name, relationshipID: attribute(attributeDict, \"id\"), hidden: state != \"visible\"))\n    }\n}\n\nprivate final class RelsDelegate: NSObject, XMLParserDelegate, ErrorHolder {\n    var rels: [String: XLSXReader.Relationship] = [:]\n    var failure: SpreadsheetError?\n\n    func parser(\n        _ parser: XMLParser, didStartElement elementName: String, namespaceURI: String?, qualifiedName qName: String?,\n        attributes attributeDict: [String: String]\n    ) {\n        guard localName(elementName) == \"Relationship\" else { return }\n        if (attributeDict[\"TargetMode\"] ?? \"\").lowercased() == \"external\" {\n            failure = .externalRelationship\n            parser.abortParsing()\n            return\n        }\n        guard let id = attributeDict[\"Id\"], let target = attributeDict[\"Target\"] else { return }\n        let type = attributeDict[\"Type\"] ?? \"\"\n        rels[id] = XLSXReader.Relationship(target: target, isWorksheet: type.hasSuffix(\"/worksheet\"))\n    }\n}\n\nprivate final class SharedStringsDelegate: NSObject, XMLParserDelegate, ErrorHolder {\n    var strings: [String] = []\n    var failure: SpreadsheetError?\n    private var inSI = false\n    private var inT = false\n    private var inPhonetic = false\n    private var current = \"\"\n\n    func parser(\n        _ parser: XMLParser, didStartElement elementName: String, namespaceURI: String?, qualifiedName qName: String?,\n        attributes attributeDict: [String: String]\n    ) {\n        switch localName(elementName) {\n        case \"si\":\n            inSI = true\n            current = \"\"\n        case \"t\": if inSI && !inPhonetic { inT = true }\n        case \"rPh\": inPhonetic = true\n        default: break\n        }\n    }\n\n    func parser(_ parser: XMLParser, foundCharacters string: String) {\n        if inT { current += string }\n    }\n\n    func parser(\n        _ parser: XMLParser, didEndElement elementName: String, namespaceURI: String?, qualifiedName qName: String?\n    ) {\n        switch localName(elementName) {\n        case \"t\": inT = false\n        case \"rPh\": inPhonetic = false\n        case \"si\":\n            inSI = false\n            strings.append(current)\n        default: break\n        }\n    }\n}\n\nprivate final class SheetDelegate: NSObject, XMLParserDelegate, ErrorHolder {\n    let shared: [String]\n    let limits: XLSXLimits\n    var builder = TableBuilder()\n    var failure: SpreadsheetError?\n    var formulaCount = 0\n    var errorCells = 0\n    var badSharedRefs = 0\n\n    private var rowNumber = 0\n    private var lastRow = 0\n    private var lastColumn = -1\n    private var cells: [Int: String] = [:]\n    private var inCell = false\n    private var column = 0\n    private var cellType = \"\"\n    private var vBuffer = \"\"\n    private var textBuffer = \"\"\n    private var inV = false\n    private var inInline = false\n    private var inT = false\n    private var inPhonetic = false\n\n    init(shared: [String], limits: XLSXLimits) {\n        self.shared = shared\n        self.limits = limits\n    }\n\n    func parser(\n        _ parser: XMLParser, didStartElement elementName: String, namespaceURI: String?, qualifiedName qName: String?,\n        attributes attributeDict: [String: String]\n    ) {\n        switch localName(elementName) {\n        case \"row\":\n            rowNumber = attributeDict[\"r\"].flatMap { Int($0) } ?? (lastRow + 1)\n            lastRow = rowNumber\n            lastColumn = -1\n            cells = [:]\n        case \"c\":\n            inCell = true\n            if let r = attributeDict[\"r\"], let col = XLSXReader.columnIndex(ofReference: r) {\n                column = col\n            } else {\n                column = lastColumn + 1\n            }\n            lastColumn = column\n            cellType = attributeDict[\"t\"] ?? \"\"\n            vBuffer = \"\"\n            textBuffer = \"\"\n        case \"v\": if inCell { inV = true }\n        case \"is\": if inCell { inInline = true }\n        case \"t\": if inInline && !inPhonetic { inT = true }\n        case \"rPh\": inPhonetic = true\n        case \"f\": if inCell { formulaCount += 1 }\n        default: break\n        }\n    }\n\n    func parser(_ parser: XMLParser, foundCharacters string: String) {\n        if inV { vBuffer += string }\n        if inT { textBuffer += string }\n    }\n\n    func parser(\n        _ parser: XMLParser, didEndElement elementName: String, namespaceURI: String?, qualifiedName qName: String?\n    ) {\n        switch localName(elementName) {\n        case \"v\": inV = false\n        case \"t\": inT = false\n        case \"rPh\": inPhonetic = false\n        case \"is\": inInline = false\n        case \"c\":\n            inCell = false\n            finishCell(parser)\n        case \"row\": finishRow(parser)\n        default: break\n        }\n    }\n\n    private func finishCell(_ parser: XMLParser) {\n        let v = vBuffer.trimmingCharacters(in: .whitespacesAndNewlines)\n        var text: String\n        switch cellType {\n        case \"s\":\n            if let i = Int(v), i >= 0, i < shared.count {\n                text = shared[i]\n            } else {\n                if !v.isEmpty { badSharedRefs += 1 }\n                text = \"\"\n            }\n        case \"inlineStr\": text = textBuffer\n        case \"str\": text = vBuffer\n        case \"b\": text = v.isEmpty ? \"\" : (v == \"1\" ? \"TRUE\" : \"FALSE\")\n        case \"e\":\n            errorCells += 1\n            text = \"\"\n        default: text = v\n        }\n        if text.isEmpty { return }\n        if column >= limits.maxColumns {\n            failure = .tooManyColumns(limit: limits.maxColumns)\n            parser.abortParsing()\n            return\n        }\n        cells[column] = text\n    }\n\n    private func finishRow(_ parser: XMLParser) {\n        guard let maxColumn = cells.keys.max() else { return }\n        var dense = [String](repeating: \"\", count: maxColumn + 1)\n        for (k, v) in cells { dense[k] = v }\n        let row = TableRow(number: rowNumber, cells: dense)\n        if row.isBlank { return }\n        builder.add(number: rowNumber, cells: dense)\n        if builder.nonEmptyRows > limits.maxRows + 100 {\n            failure = .tooManyRows(limit: limits.maxRows)\n            parser.abortParsing()\n        }\n    }\n}\n"}, "Sources/SSHDeskCore/Inventory/ZipProcess.swift": {"group": "Core · Inventory", "text": "import Darwin\nimport Foundation\n\n/// Chạy một công cụ hệ thống (executable + argv, env RỖNG, không shell), đọc stdout theo chunk với trần byte và timeout.\n/// Vượt trần/timeout -> terminate tiến trình và ném lỗi. Dùng cho `/usr/bin/unzip` (ADR-026).\nenum BoundedProcess {\n    struct Result {\n        var status: Int32\n        var stdout: Data\n    }\n\n    private final class Flags: @unchecked Sendable {\n        private let lock = NSLock()\n        private var _timedOut = false\n        private var _exceeded = false\n        func setTimedOut() {\n            lock.lock()\n            _timedOut = true\n            lock.unlock()\n        }\n        func setExceeded() {\n            lock.lock()\n            _exceeded = true\n            lock.unlock()\n        }\n        var timedOut: Bool {\n            lock.lock()\n            defer { lock.unlock() }\n            return _timedOut\n        }\n        var exceeded: Bool {\n            lock.lock()\n            defer { lock.unlock() }\n            return _exceeded\n        }\n    }\n\n    /// - Parameters:\n    ///   - maxBytes: trần stdout cho lần chạy này.\n    ///   - exceeded: lỗi ném khi vượt `maxBytes`.\n    static func run(\n        executable: String, arguments: [String], currentDirectory: URL? = nil, maxBytes: Int, timeout: TimeInterval,\n        exceeded: SpreadsheetError\n    ) throws -> Result {\n        let process = Process()\n        process.executableURL = URL(fileURLWithPath: executable)\n        process.arguments = arguments\n        process.environment = [:]\n        if let currentDirectory { process.currentDirectoryURL = currentDirectory }\n        let out = Pipe()\n        process.standardOutput = out\n        process.standardError = FileHandle.nullDevice\n        process.standardInput = FileHandle.nullDevice\n        do { try process.run() } catch { throw SpreadsheetError.cannotRun(executable) }\n\n        let flags = Flags()\n        let pid = process.processIdentifier\n        let timer = DispatchWorkItem {\n            flags.setTimedOut()\n            process.terminate()\n            DispatchQueue.global().asyncAfter(deadline: .now() + 1) {\n                if process.isRunning { kill(pid, SIGKILL) }\n            }\n        }\n        DispatchQueue.global().asyncAfter(deadline: .now() + timeout, execute: timer)\n\n        var data = Data()\n        let reader = out.fileHandleForReading\n        while true {\n            let chunk: Data\n            do { chunk = try reader.read(upToCount: 65_536) ?? Data() } catch { break }\n            if chunk.isEmpty { break }\n            data.append(chunk)\n            if data.count > maxBytes {\n                flags.setExceeded()\n                process.terminate()\n                if process.isRunning { kill(pid, SIGKILL) }\n                break\n            }\n        }\n        try? reader.close()\n        process.waitUntilExit()\n        timer.cancel()\n        if flags.exceeded { throw exceeded }\n        if flags.timedOut { throw SpreadsheetError.timeout }\n        return Result(status: process.terminationStatus, stdout: data)\n    }\n}\n"}, "Sources/SSHDeskCore/Keys/AgentKeyLister.swift": {"group": "Core · Keys", "text": "import CryptoKit\nimport Foundation\n\n/// Một public key trong agent (từ `ssh-add -L`). Chỉ public key: không bao giờ chứa private key.\npublic struct AgentKey: Equatable, Sendable, Identifiable {\n    public var type: String\n    public var comment: String\n    /// `SHA256:...` tính từ public key blob (cùng định dạng `ssh-add -l`).\n    public var fingerprint: String\n    public var id: String { fingerprint + type }\n}\n\npublic enum AgentKeyListing: Equatable, Sendable {\n    case keys([AgentKey])\n    /// Agent chạy nhưng chưa có key nào.\n    case empty\n    /// Không liên lạc được với agent (kèm lý do ngắn, không chứa dữ liệu bí mật).\n    case unavailable(String)\n}\n\n/// Liệt kê key của agent bằng `/usr/bin/ssh-add -L` (ADR-024). Chỉ đọc: không thêm/xoá key.\npublic enum AgentKeyLister {\n    public static let executable = \"/usr/bin/ssh-add\"\n    /// argv cố định: không nhận tham số từ người dùng.\n    public static let arguments = [\"-L\"]\n\n    /// `agent`: giá trị IdentityAgent (đường dẫn, `~/...` hoặc `SSH_AUTH_SOCK`); nil = agent hệ thống.\n    public static func list(\n        agent: String?, home: String = NSHomeDirectory(),\n        environment: [String: String] = ProcessInfo.processInfo.environment,\n        executable: String = AgentKeyLister.executable, timeout: TimeInterval = 5\n    ) async -> AgentKeyListing {\n        let value = agent.flatMap { $0.isEmpty ? nil : $0 } ?? IdentityAgentPath.systemValue\n        guard IdentityAgentPath.isValid(value) else { return .unavailable(\"Đường dẫn agent không hợp lệ.\") }\n        guard let socket = IdentityAgentPath.expanded(value, home: home, environment: environment) else {\n            return .unavailable(\"Không có SSH_AUTH_SOCK: chưa có agent hệ thống nào chạy.\")\n        }\n        // Env tối thiểu: chỉ đường dẫn socket (không phải secret).\n        let env = [\"SSH_AUTH_SOCK\": socket]\n        do {\n            let out = try await SimpleProcess.run(\n                executable: executable, arguments: arguments, environment: env, timeout: timeout)\n            if out.timedOut { return .unavailable(\"Agent không phản hồi (quá \\(Int(timeout)) giây).\") }\n            return parse(stdout: out.stdout, stderr: out.stderr, status: out.status)\n        } catch {\n            return .unavailable(\"Không chạy được ssh-add.\")\n        }\n    }\n\n    /// `ssh-add -L`: exit 0 + mỗi dòng một public key; exit 1 + \"The agent has no identities.\"; exit 2 = lỗi kết nối.\n    static func parse(stdout: String, stderr: String, status: Int32) -> AgentKeyListing {\n        if status == 0 {\n            let keys = stdout.split(whereSeparator: \\.isNewline).compactMap { parseLine(String($0)) }\n            return keys.isEmpty ? .empty : .keys(keys)\n        }\n        if status == 1 { return .empty }\n        return .unavailable(\"Không kết nối được agent (socket chưa có hoặc agent không chạy).\")\n    }\n\n    /// `<type> <base64> [comment]`. Dòng lạ → nil.\n    static func parseLine(_ line: String) -> AgentKey? {\n        let parts = line.split(separator: \" \", maxSplits: 2, omittingEmptySubsequences: true)\n        guard parts.count >= 2, let blob = Data(base64Encoded: String(parts[1])), !blob.isEmpty else {\n            return nil\n        }\n        let type = String(parts[0])\n        guard type.allSatisfy({ $0.isLetter || $0.isNumber || $0 == \"-\" || $0 == \"@\" || $0 == \".\" || $0 == \"_\" })\n        else { return nil }\n        let comment = parts.count > 2 ? sanitized(String(parts[2])) : \"\"\n        return AgentKey(type: type, comment: comment, fingerprint: fingerprint(of: blob))\n    }\n\n    static func fingerprint(of blob: Data) -> String {\n        let digest = Data(SHA256.hash(data: blob)).base64EncodedString()\n        return \"SHA256:\" + digest.replacingOccurrences(of: \"=\", with: \"\")\n    }\n\n    /// Comment do agent trả về: bỏ ký tự điều khiển trước khi hiển thị.\n    private static func sanitized(_ s: String) -> String {\n        String(String.UnicodeScalarView(s.unicodeScalars.filter { $0.properties.generalCategory != .control }))\n    }\n}\n"}, "Sources/SSHDeskCore/Keys/SSHKeyGenerator.swift": {"group": "Core · Keys", "text": "import Darwin\nimport Foundation\n\n/// Tạo key ed25519 mới bằng `/usr/bin/ssh-keygen` qua PTY (ADR-014). Passphrase do người dùng nhập ở\n/// prompt của ssh-keygen (UI SecureField, có thể để trống) — không đi qua argv/env, không lưu.\npublic struct SSHKeyGenerator: Sendable {\n    public static let keygenPath = \"/usr/bin/ssh-keygen\"\n\n    public let directory: URL\n    public let name: String\n    public let comment: String\n    private let keygen: URL\n    private let helper: URL?\n    private let environment: [String: String]\n\n    /// Ném lỗi nếu tên/comment xấu hoặc `<dir>/<name>` hoặc `<dir>/<name>.pub` đã tồn tại\n    /// (kể cả symlink treo) — không bao giờ ghi đè.\n    public init(\n        directory: URL = SSHKeyInventory.defaultDirectory, name: String, comment: String,\n        keygenPath: String = keygenPath, helper: URL? = nil,\n        environment: [String: String] = ProcessEnvironment.inherited()\n    ) throws {\n        try SSHKeyNaming.validateName(name)\n        try SSHKeyNaming.validateComment(comment)\n        self.directory = directory\n        self.name = name\n        self.comment = comment\n        self.keygen = URL(fileURLWithPath: keygenPath)\n        self.helper = helper\n        self.environment = environment\n        for p in [privatePath, publicPath] where SSHKeyInventory.lstatInfo(p) != nil {\n            throw SSHKeyError.alreadyExists(p)\n        }\n    }\n\n    public var privatePath: String { directory.appendingPathComponent(name).path }\n    public var publicPath: String { privatePath + \".pub\" }\n\n    /// Tạo thư mục (0700) nếu chưa có rồi chạy ssh-keygen. Kết quả qua `session.events`.\n    public func start() async throws -> KeyTaskSession {\n        let fm = FileManager.default\n        var isDir: ObjCBool = false\n        if fm.fileExists(atPath: directory.path, isDirectory: &isDir) {\n            guard isDir.boolValue else { throw SSHKeyError.directoryNotUsable(directory.path) }\n        } else {\n            try fm.createDirectory(\n                at: directory, withIntermediateDirectories: true, attributes: [.posixPermissions: 0o700])\n        }\n        // Kiểm tra lại ngay trước khi chạy (giữa init và start có thể có file xuất hiện).\n        for p in [privatePath, publicPath] where SSHKeyInventory.lstatInfo(p) != nil {\n            throw SSHKeyError.alreadyExists(p)\n        }\n        let priv = privatePath\n        let pub = publicPath\n        let session = KeyTaskSession(\n            executable: keygen,\n            arguments: [\"-q\", \"-t\", \"ed25519\", \"-f\", priv, \"-C\", comment],\n            environment: environment, helper: helper, refuseOverwrite: true,\n            evaluate: { exit, tail in\n                guard case .exited(0) = exit else {\n                    return .failure(Self.failureReason(exit, tail))\n                }\n                guard SSHKeyInventory.lstatInfo(priv) != nil, SSHKeyInventory.lstatInfo(pub) != nil else {\n                    return .failure(\"ssh-keygen kết thúc nhưng không thấy file key được tạo.\")\n                }\n                return .success(\"Đã tạo key \\(URL(fileURLWithPath: priv).lastPathComponent).\")\n            })\n        try await session.start()\n        return session\n    }\n\n    static func failureReason(_ exit: ProcessExit, _ tail: [String]) -> String {\n        let detail = tail.suffix(2).joined(separator: \" \")\n        switch exit {\n        case .exited(let code): return \"ssh-keygen thoát với mã \\(code)\" + (detail.isEmpty ? \".\" : \": \\(detail)\")\n        case .signaled(let sig): return \"ssh-keygen bị dừng bởi tín hiệu \\(sig).\"\n        case .cancelled: return \"Đã huỷ.\"\n        }\n    }\n}\n"}, "Sources/SSHDeskCore/Keys/SSHKeyInstaller.swift": {"group": "Core · Keys", "text": "import Foundation\n\n/// Cài public key lên server bằng `/usr/bin/ssh-copy-id -F <config app> -i <pub> <alias>` qua PTY\n/// (ADR-010/014). `ssh-copy-id` là script của OpenSSH, chạy như executable (argv), không qua `sh -c`.\n/// Prompt password/host key/MFA đi lên UI; password đã lưu được tự điền đúng 1 lần theo\n/// `PasswordAutofillPolicy`.\npublic struct SSHKeyInstaller: Sendable {\n    public static let copyIDPath = \"/usr/bin/ssh-copy-id\"\n    public static let connectTimeoutSeconds = 15\n\n    public let configPath: String\n    public let publicKeyPath: String\n    public let alias: String\n    private let host: HostProfile?\n    private let credentials: (any CredentialStore)?\n    private let executable: URL\n    private let helper: URL?\n    private let environment: [String: String]\n    private let remoteTargetPath: String?\n    private let force: Bool\n\n    /// - Parameters:\n    ///   - force: `-f` (bỏ bước \"thử đăng nhập bằng key mới để lọc key đã có\"). Cần khi cấu hình của host\n    ///     đã có `IdentityFile` khác: bước lọc sẽ đăng nhập thành công bằng key cũ và báo nhầm\n    ///     \"key đã có sẵn\". Hệ quả: nếu key đã nằm trên server thì dòng bị thêm lặp (vô hại).\n    ///   - host: hồ sơ để áp `PasswordAutofillPolicy` (nil = không tự điền).\n    ///   - remoteTargetPath: `-t` của ssh-copy-id (mặc định `.ssh/authorized_keys` của user trên server).\n    ///     Chỉ cho `[A-Za-z0-9._/-]`; dùng trong test để không ghi vào authorized_keys thật.\n    public init(\n        configPath: String, publicKeyPath: String, alias: String, host: HostProfile? = nil,\n        credentials: (any CredentialStore)? = nil, executable: String = copyIDPath,\n        helper: URL? = nil, environment: [String: String] = ProcessEnvironment.inherited(),\n        remoteTargetPath: String? = nil, force: Bool = false\n    ) throws {\n        guard publicKeyPath.hasPrefix(\"/\"), publicKeyPath.hasSuffix(\".pub\"),\n            !publicKeyPath.unicodeScalars.contains(where: { $0.value < 0x20 || $0.value == 0x7F }),\n            let st = SSHKeyInventory.lstatInfo(publicKeyPath), st.isRegular\n        else { throw SSHKeyError.invalidPublicKey }\n        guard alias.range(of: #\"^[A-Za-z0-9][A-Za-z0-9._-]*$\"#, options: .regularExpression) != nil\n        else { throw SSHKeyError.invalidAlias }\n        if let remoteTargetPath,\n            remoteTargetPath.isEmpty\n                || remoteTargetPath.range(of: #\"^[A-Za-z0-9._/-]+$\"#, options: .regularExpression) == nil\n                || remoteTargetPath.hasPrefix(\"-\")\n        {\n            throw SSHKeyError.invalidTargetPath\n        }\n        self.configPath = configPath\n        self.publicKeyPath = publicKeyPath\n        self.alias = alias\n        self.host = host\n        self.credentials = credentials\n        self.executable = URL(fileURLWithPath: executable)\n        self.helper = helper\n        self.environment = environment\n        self.remoteTargetPath = remoteTargetPath\n        self.force = force\n    }\n\n    public var arguments: [String] {\n        var args = [\"-F\", configPath, \"-i\", publicKeyPath]\n        if force { args.insert(\"-f\", at: 0) }\n        if let remoteTargetPath { args += [\"-t\", remoteTargetPath] }\n        args += [\"-o\", \"ConnectTimeout=\\(Self.connectTimeoutSeconds)\", alias]\n        return args\n    }\n\n    public func start() async throws -> KeyTaskSession {\n        let latch = AutofillLatch()\n        var autofill: (@Sendable (PromptKind) -> String?)?\n        if let host, let ref = host.autofillCredentialReference, let credentials {\n            autofill = { kind in\n                guard\n                    PasswordAutofillPolicy.shouldAutofill(\n                        prompt: kind, host: host, alreadyFilled: latch.isFilled),\n                    let password = credentials.read(ref: ref)\n                else { return nil }\n                latch.mark()\n                return password\n            }\n        }\n        let session = KeyTaskSession(\n            executable: executable, arguments: arguments, environment: environment, helper: helper,\n            autofill: autofill, evaluate: { exit, tail in Self.evaluate(exit, tail) })\n        try await session.start()\n        return session\n    }\n\n    static func evaluate(_ exit: ProcessExit, _ tail: [String]) -> KeyTaskOutcome {\n        let joined = tail.joined(separator: \"\\n\")\n        let lower = joined.lowercased()\n        guard case .exited(0) = exit else {\n            let detail = tail.suffix(2).joined(separator: \" \")\n            switch exit {\n            case .exited(let code):\n                return .failure(\"ssh-copy-id thoát với mã \\(code)\" + (detail.isEmpty ? \".\" : \": \\(detail)\"))\n            case .signaled(let sig): return .failure(\"ssh-copy-id bị dừng bởi tín hiệu \\(sig).\")\n            case .cancelled: return .cancelled\n            }\n        }\n        if lower.contains(\"number of key(s) added\") { return .success(\"Đã cài key lên máy chủ.\") }\n        if lower.contains(\"already exist\") { return .success(\"Key đã có sẵn trên máy chủ.\") }\n        return .failure(\"ssh-copy-id kết thúc nhưng không xác nhận được key đã được cài.\")\n    }\n}\n"}, "Sources/SSHDeskCore/Metrics/MetricsTransport.swift": {"group": "Core · Metrics", "text": "import Foundation\n\n/// Lỗi đọc số liệu. Thông điệp hiển thị KHÔNG chứa header, body hay URL (ADR-028).\npublic enum MetricsError: Error, Equatable, LocalizedError {\n    case timeout\n    case tooLarge\n    case redirectBlocked\n    case unauthorized(status: Int)\n    case httpStatus(Int)\n    case tlsUntrusted\n    case cannotConnect\n    case network(code: Int)\n    case invalidResponse\n    /// Prometheus `errorType` hoặc mã lỗi Zabbix — không kèm nội dung do server gửi.\n    case apiError(String)\n    case noData\n    case secretMissing\n    case unsupportedVersion\n\n    public var errorDescription: String? {\n        switch self {\n        case .timeout: return \"Hết thời gian chờ (10 giây).\"\n        case .tooLarge: return \"Phản hồi lớn hơn 5 MB — đã bỏ.\"\n        case .redirectBlocked:\n            return \"Máy chủ chuyển hướng sang địa chỉ khác — app không theo. Dùng đúng URL cuối cùng (vd https).\"\n        case .unauthorized(let s):\n            return s == 200\n                ? \"Token bị từ chối hoặc hết hạn — kiểm tra token.\"\n                : \"Bị từ chối (HTTP \\(s)) — kiểm tra token/password.\"\n        case .httpStatus(let s): return \"Máy chủ trả HTTP \\(s).\"\n        case .tlsUntrusted:\n            return \"Chứng chỉ TLS không được tin cậy. Với CA nội bộ, hãy tin cậy CA đó trong Keychain Access của macOS.\"\n        case .cannotConnect: return \"Không kết nối được tới máy chủ số liệu.\"\n        case .network(let code): return \"Lỗi mạng (mã \\(code)).\"\n        case .invalidResponse: return \"Phản hồi không đúng định dạng mong đợi.\"\n        case .apiError(let code): return \"API trả lỗi (\\(code)).\"\n        case .noData: return \"Không có số liệu cho máy này — kiểm tra mẫu instance/tên host.\"\n        case .secretMissing: return \"Chưa có token/password trong kho — nhập lại ở Cài đặt → Nguồn số liệu.\"\n        case .unsupportedVersion: return \"Phiên bản Zabbix không đọc được.\"\n        }\n    }\n\n    /// Chuyển lỗi URLSession sang thông điệp an toàn.\n    static func from(_ error: Error) -> MetricsError {\n        if let e = error as? MetricsError { return e }\n        guard let u = error as? URLError else {\n            return .network(code: (error as NSError).code)\n        }\n        switch u.code {\n        case .timedOut: return .timeout\n        case .serverCertificateUntrusted, .serverCertificateHasBadDate, .serverCertificateHasUnknownRoot,\n            .serverCertificateNotYetValid, .secureConnectionFailed, .clientCertificateRejected:\n            return .tlsUntrusted\n        case .cannotConnectToHost, .cannotFindHost, .notConnectedToInternet, .networkConnectionLost,\n            .dnsLookupFailed:\n            return .cannotConnect\n        case .httpTooManyRedirects: return .redirectBlocked\n        default: return .network(code: u.errorCode)\n        }\n    }\n}\n\npublic struct MetricsHTTPResponse: Sendable, Equatable {\n    public var status: Int\n    public var body: Data\n}\n\n/// Gửi một request HTTP và trả phản hồi 2xx (đã giới hạn kích thước). Mọi lỗi là `MetricsError`.\npublic protocol MetricsTransport: Sendable {\n    func send(_ request: URLRequest) async throws -> MetricsHTTPResponse\n}\n\n/// Delegate của session: chặn mọi redirect (trả `nil` -> URLSession trả luôn phản hồi 3xx, không gửi tiếp;\n/// đặc biệt https -> http hay sang host khác sẽ làm lộ Authorization) và gom body theo chunk với cap cứng.\n/// Không cài hook `didReceive challenge`: kiểm TLS mặc định của hệ thống.\nfinal class MetricsSessionDelegate: NSObject, URLSessionDataDelegate, @unchecked Sendable {\n    private struct Pending {\n        var data = Data()\n        var status = 0\n        var failure: MetricsError?\n        var continuation: CheckedContinuation<MetricsHTTPResponse, Error>\n    }\n\n    private let lock = NSLock()\n    private var pending: [Int: Pending] = [:]\n    private let maxBytes: Int\n\n    init(maxBytes: Int) { self.maxBytes = maxBytes }\n\n    func register(_ task: URLSessionTask, _ c: CheckedContinuation<MetricsHTTPResponse, Error>) {\n        lock.lock()\n        pending[task.taskIdentifier] = Pending(continuation: c)\n        lock.unlock()\n    }\n\n    func urlSession(\n        _ session: URLSession, task: URLSessionTask,\n        willPerformHTTPRedirection response: HTTPURLResponse, newRequest request: URLRequest,\n        completionHandler: @escaping (URLRequest?) -> Void\n    ) {\n        completionHandler(nil)\n    }\n\n    func urlSession(\n        _ session: URLSession, dataTask: URLSessionDataTask, didReceive response: URLResponse,\n        completionHandler: @escaping (URLSession.ResponseDisposition) -> Void\n    ) {\n        var failure: MetricsError?\n        let status = (response as? HTTPURLResponse)?.statusCode ?? 0\n        if status == 0 {\n            failure = .invalidResponse\n        } else if (300..<400).contains(status) {\n            failure = .redirectBlocked\n        } else if status == 401 || status == 403 {\n            failure = .unauthorized(status: status)\n        } else if !(200..<300).contains(status) {\n            failure = .httpStatus(status)\n        } else if response.expectedContentLength > Int64(maxBytes) {\n            failure = .tooLarge  // Content-Length khai báo quá lớn: bỏ ngay, không đọc body.\n        }\n        lock.lock()\n        pending[dataTask.taskIdentifier]?.status = status\n        pending[dataTask.taskIdentifier]?.failure = failure\n        lock.unlock()\n        completionHandler(failure == nil ? .allow : .cancel)\n    }\n\n    func urlSession(_ session: URLSession, dataTask: URLSessionDataTask, didReceive data: Data) {\n        lock.lock()\n        var over = false\n        if var p = pending[dataTask.taskIdentifier] {\n            p.data.append(data)\n            if p.data.count > maxBytes {\n                p.failure = .tooLarge\n                p.data = Data()\n                over = true\n            }\n            pending[dataTask.taskIdentifier] = p\n        }\n        lock.unlock()\n        if over { dataTask.cancel() }\n    }\n\n    func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {\n        lock.lock()\n        let p = pending.removeValue(forKey: task.taskIdentifier)\n        lock.unlock()\n        guard let p else { return }\n        if let failure = p.failure {\n            p.continuation.resume(throwing: failure)\n        } else if let error {\n            p.continuation.resume(throwing: MetricsError.from(error))\n        } else {\n            p.continuation.resume(returning: MetricsHTTPResponse(status: p.status, body: p.data))\n        }\n    }\n}\n\nprivate final class TaskBox: @unchecked Sendable {\n    private let lock = NSLock()\n    private var task: URLSessionTask?\n    private var cancelled = false\n    func set(_ t: URLSessionTask) {\n        lock.lock()\n        task = t\n        let c = cancelled\n        lock.unlock()\n        if c { t.cancel() }\n    }\n    func cancel() {\n        lock.lock()\n        cancelled = true\n        let t = task\n        lock.unlock()\n        t?.cancel()\n    }\n}\n\n/// Transport thật: URLSession ephemeral riêng, timeout 10 giây, tối đa 5 MB (đọc theo chunk), không cookie/cache.\npublic final class URLSessionMetricsTransport: MetricsTransport, @unchecked Sendable {\n    public static let timeout: TimeInterval = 10\n    public static let maxBytes = 5 * 1024 * 1024\n\n    /// Internal để test kiểm cấu hình (TLS tối thiểu).\n    let session: URLSession\n    private let delegate: MetricsSessionDelegate\n\n    /// `protocolClasses` chỉ để test (URLProtocol giả). `maxBytes` mặc định 5 MB.\n    public init(protocolClasses: [AnyClass]? = nil, maxBytes: Int = URLSessionMetricsTransport.maxBytes) {\n        let cfg = URLSessionConfiguration.ephemeral\n        cfg.timeoutIntervalForRequest = Self.timeout\n        cfg.timeoutIntervalForResource = Self.timeout\n        cfg.waitsForConnectivity = false\n        // ADR-028b: Info.plist bật NSAllowsArbitraryLoads nên ATS không còn ép TLS tối thiểu -> tự ép ở đây.\n        cfg.tlsMinimumSupportedProtocolVersion = .TLSv12\n        cfg.httpShouldSetCookies = false\n        cfg.httpCookieStorage = nil\n        cfg.urlCache = nil\n        cfg.requestCachePolicy = .reloadIgnoringLocalAndRemoteCacheData\n        if let protocolClasses { cfg.protocolClasses = protocolClasses }\n        delegate = MetricsSessionDelegate(maxBytes: maxBytes)\n        session = URLSession(configuration: cfg, delegate: delegate, delegateQueue: nil)\n    }\n\n    deinit { session.finishTasksAndInvalidate() }\n\n    public func send(_ request: URLRequest) async throws -> MetricsHTTPResponse {\n        var request = request\n        request.timeoutInterval = Self.timeout\n        request.httpShouldHandleCookies = false\n        request.cachePolicy = .reloadIgnoringLocalAndRemoteCacheData\n        let box = TaskBox()\n        return try await withTaskCancellationHandler {\n            try await withCheckedThrowingContinuation { (c: CheckedContinuation<MetricsHTTPResponse, Error>) in\n                let task = session.dataTask(with: request)\n                delegate.register(task, c)\n                box.set(task)\n                task.resume()\n            }\n        } onCancel: {\n            box.cancel()\n        }\n    }\n}\n\n/// Áp xác thực lên request vào lúc gửi. Bí mật chỉ đọc từ `CredentialStore` ở đây và đặt vào header.\nenum MetricsAuth {\n    static func secret(for source: MetricsSource, credentials: (any CredentialStore)?) throws -> String? {\n        guard let ref = source.credentialRef else { return nil }\n        guard let secret = credentials?.read(ref: ref), !secret.isEmpty else {\n            throw MetricsError.secretMissing\n        }\n        // Kiểm lại lúc gửi: CR/LF hay ký tự điều khiển trong secret sẽ thành header injection.\n        guard (try? MetricSourceService.validateSecret(secret, kind: source.authKind)) != nil else {\n            throw MetricsError.secretMissing\n        }\n        return secret\n    }\n\n    /// Bearer/Basic -> header `Authorization`. `includeBearer == false` dùng cho Zabbix cũ (token đi trong body).\n    static func apply(\n        to request: inout URLRequest, source: MetricsSource, credentials: (any CredentialStore)?,\n        includeBearer: Bool = true\n    ) throws {\n        switch source.authKind {\n        case .none:\n            return\n        case .bearer:\n            guard includeBearer else { return }\n            guard let token = try secret(for: source, credentials: credentials) else { return }\n            request.setValue(\"Bearer \" + token, forHTTPHeaderField: \"Authorization\")\n        case .basic:\n            guard let password = try secret(for: source, credentials: credentials) else { return }\n            let pair = Data(\"\\(source.basicUser ?? \"\"):\\(password)\".utf8).base64EncodedString()\n            request.setValue(\"Basic \" + pair, forHTTPHeaderField: \"Authorization\")\n        }\n    }\n}\n"}, "Sources/SSHDeskCore/Metrics/PrometheusClient.swift": {"group": "Core · Metrics", "text": "import Foundation\n\n/// Nơi cấp snapshot Monitor từ một nguồn số liệu (Prometheus/Zabbix).\npublic protocol MetricsSnapshotProviding: Sendable {\n    func snapshot(for host: HostProfile, at date: Date) async throws -> MonitorSnapshot\n    /// Thử kết nối nguồn; trả mô tả ngắn (phiên bản).\n    func testConnection() async throws -> String\n}\n\n/// Một mẫu của vector Prometheus.\nstruct PromSample: Equatable {\n    var labels: [String: String]\n    var value: Double\n}\n\n/// Bộ truy vấn node_exporter CỐ ĐỊNH (ADR-028). Chỉ giá trị nhãn `instance` (đã escape) được ghép vào.\nenum PromQuery: CaseIterable {\n    case cpu, cores, memory, load, disks, uptime\n\n    /// Filesystem bỏ qua (ảo/tạm). Hằng số cố định, không nhận input.\n    static let ignoredFSTypes =\n        \"tmpfs|devtmpfs|overlay|squashfs|ramfs|nsfs|proc|sysfs|cgroup2fs|autofs|iso9660|fuse.lxcfs\"\n\n    func expression(escapedInstance i: String) -> String {\n        switch self {\n        case .cpu:\n            return \"100 * (1 - avg(rate(node_cpu_seconds_total{instance=\\\"\\(i)\\\",mode=\\\"idle\\\"}[2m])))\"\n        case .cores:\n            return \"count(count by (cpu) (node_cpu_seconds_total{instance=\\\"\\(i)\\\",mode=\\\"idle\\\"}))\"\n        case .memory:\n            return\n                \"{__name__=~\\\"node_memory_(MemTotal|MemAvailable|SwapTotal|SwapFree)_bytes\\\",instance=\\\"\\(i)\\\"}\"\n        case .load:\n            return \"{__name__=~\\\"node_load(1|5|15)\\\",instance=\\\"\\(i)\\\"}\"\n        case .disks:\n            return\n                \"{__name__=~\\\"node_filesystem_(size|avail)_bytes\\\",instance=\\\"\\(i)\\\",fstype!~\\\"\\(Self.ignoredFSTypes)\\\"}\"\n        case .uptime:\n            return \"time() - node_boot_time_seconds{instance=\\\"\\(i)\\\"}\"\n        }\n    }\n}\n\n/// Client Prometheus: chỉ `GET /api/v1/query` (và `/api/v1/status/buildinfo` để thử kết nối).\npublic struct PrometheusClient: MetricsSnapshotProviding {\n    let source: MetricsSource\n    let credentials: (any CredentialStore)?\n    let transport: any MetricsTransport\n\n    public init(\n        source: MetricsSource, credentials: (any CredentialStore)?, transport: any MetricsTransport\n    ) {\n        self.source = source\n        self.credentials = credentials\n        self.transport = transport\n    }\n\n    // MARK: - URL\n\n    /// `<base>/api/v1/<endpoint>` + query dựng bằng URLComponents; giá trị được percent-encode nghiêm\n    /// (chỉ giữ `A-Za-z0-9-._~`) nên `&`, `+`, `#` trong nhãn không thể tách tham số.\n    static func url(base: String, endpoint: String, query: String?) throws -> URL {\n        guard var c = URLComponents(string: base) else { throw MetricsError.invalidResponse }\n        c.percentEncodedPath += \"/api/v1/\" + endpoint\n        if let query {\n            c.percentEncodedQuery = \"query=\" + strictEncode(query)\n        }\n        guard let url = c.url else { throw MetricsError.invalidResponse }\n        return url\n    }\n\n    static func strictEncode(_ s: String) -> String {\n        let allowed = CharacterSet(\n            charactersIn: \"abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-._~\")\n        return s.addingPercentEncoding(withAllowedCharacters: allowed) ?? \"\"\n    }\n\n    private func get(_ url: URL) async throws -> Data {\n        var request = URLRequest(url: url)\n        request.httpMethod = \"GET\"\n        request.setValue(\"application/json\", forHTTPHeaderField: \"Accept\")\n        try MetricsAuth.apply(to: &request, source: source, credentials: credentials)\n        return try await transport.send(request).body\n    }\n\n    // MARK: - Truy vấn\n\n    func instant(_ expression: String) async throws -> [PromSample] {\n        let url = try Self.url(base: source.baseURL, endpoint: \"query\", query: expression)\n        return try PromParser.parseVector(try await get(url))\n    }\n\n    public func snapshot(for host: HostProfile, at date: Date) async throws -> MonitorSnapshot {\n        let raw = try InstanceTemplate.render(\n            source.instanceTemplate, hostName: host.hostName, port: host.port)\n        let instance = PromQL.escapeLabelValue(raw)\n        let results = try await withThrowingTaskGroup(of: (PromQuery, [PromSample]).self) { group in\n            for q in PromQuery.allCases {\n                group.addTask { (q, try await instant(q.expression(escapedInstance: instance))) }\n            }\n            var out: [PromQuery: [PromSample]] = [:]\n            for try await (q, samples) in group { out[q] = samples }\n            return out\n        }\n        return try PromParser.snapshot(results: results, at: date)\n    }\n\n    /// `/api/v1/status/buildinfo`; máy chủ không có endpoint này (404) thì thử `query=up`.\n    public func testConnection() async throws -> String {\n        do {\n            let url = try Self.url(base: source.baseURL, endpoint: \"status/buildinfo\", query: nil)\n            let data = try await get(url)\n            return \"Prometheus \" + (PromParser.parseBuildVersion(data) ?? \"(không rõ phiên bản)\")\n        } catch MetricsError.httpStatus(404) {\n            let samples = try await instant(\"up\")\n            return \"Prometheus API hoạt động (\\(samples.count) target)\"\n        }\n    }\n}\n\nenum PromParser {\n    private struct Envelope: Decodable {\n        var status: String\n        var errorType: String?\n        var data: DataPart?\n        struct DataPart: Decodable {\n            var resultType: String?\n            var result: [Item]?\n            var version: String?\n        }\n        struct Item: Decodable {\n            var metric: [String: String]\n            var value: [JSONScalar]?\n        }\n    }\n\n    /// Phần tử của `value: [ts, \"string\"]`.\n    private enum JSONScalar: Decodable {\n        case number(Double)\n        case string(String)\n        init(from decoder: Decoder) throws {\n            let c = try decoder.singleValueContainer()\n            if let d = try? c.decode(Double.self) {\n                self = .number(d)\n            } else {\n                self = .string(try c.decode(String.self))\n            }\n        }\n    }\n\n    static func parseVector(_ data: Data) throws -> [PromSample] {\n        guard let env = try? JSONDecoder().decode(Envelope.self, from: data) else {\n            throw MetricsError.invalidResponse\n        }\n        guard env.status == \"success\" else {\n            throw MetricsError.apiError(sanitizeToken(env.errorType ?? \"error\"))\n        }\n        guard env.data?.resultType == \"vector\", let items = env.data?.result else {\n            throw MetricsError.invalidResponse\n        }\n        var out: [PromSample] = []\n        for item in items {\n            guard let v = item.value, v.count == 2, case .string(let text) = v[1],\n                let d = Double(text), d.isFinite\n            else { continue }  // NaN/Inf/mẫu hỏng bị bỏ\n            out.append(PromSample(labels: item.metric, value: d))\n        }\n        return out\n    }\n\n    static func parseBuildVersion(_ data: Data) -> String? {\n        guard let env = try? JSONDecoder().decode(Envelope.self, from: data), env.status == \"success\"\n        else { return nil }\n        return env.data?.version.map(sanitizeToken)\n    }\n\n    /// Chỉ giữ ký tự chữ-số/`_.-`, tối đa 40 — chuỗi lấy từ server chỉ dùng để hiển thị.\n    private static func sanitizeToken(_ s: String) -> String {\n        String(\n            s.unicodeScalars.filter {\n                ($0.value < 128) && (CharacterSet.alphanumerics.contains($0) || \"_.-\".unicodeScalars.contains($0))\n            }.prefix(40).map(Character.init))\n    }\n\n    static func snapshot(results: [PromQuery: [PromSample]], at date: Date) throws -> MonitorSnapshot {\n        func scalar(_ q: PromQuery) -> Double? { results[q]?.first?.value }\n        func named(_ q: PromQuery) -> [String: Double] {\n            var m: [String: Double] = [:]\n            for s in results[q] ?? [] { if let n = s.labels[\"__name__\"] { m[n] = s.value } }\n            return m\n        }\n        let cpu = scalar(.cpu).map { min(100, max(0, $0)) }\n        let cores = scalar(.cores).flatMap { $0 >= 1 && $0 < 100_000 ? Int($0) : nil }\n\n        let mem = named(.memory)\n        var memory: MemoryInfo?\n        if let total = mem[\"node_memory_MemTotal_bytes\"], total > 0,\n            let avail = mem[\"node_memory_MemAvailable_bytes\"]\n        {\n            memory = MemoryInfo(\n                totalKB: kb(total), availableKB: kb(avail),\n                swapTotalKB: kb(mem[\"node_memory_SwapTotal_bytes\"] ?? 0),\n                swapFreeKB: kb(mem[\"node_memory_SwapFree_bytes\"] ?? 0))\n        }\n\n        let l = named(.load)\n        var load: LoadAverage?\n        if let one = l[\"node_load1\"], let five = l[\"node_load5\"], let fifteen = l[\"node_load15\"] {\n            load = LoadAverage(one: one, five: five, fifteen: fifteen)\n        }\n\n        let disks = parseDisks(results[.disks] ?? [])\n        let uptime = scalar(.uptime).flatMap { $0 >= 0 ? $0 : nil }\n\n        if cpu == nil, memory == nil, load == nil, disks.isEmpty, uptime == nil { throw MetricsError.noData }\n        return MonitorSnapshot(\n            takenAt: date, cpuPercent: cpu, load: load, cores: cores, memory: memory, disks: disks,\n            uptimeSeconds: uptime)\n    }\n\n    private static func kb(_ bytes: Double) -> UInt64 {\n        guard bytes.isFinite, bytes > 0 else { return 0 }\n        return UInt64(min(bytes / 1024, Double(UInt64.max / 2)))\n    }\n\n    /// Ghép size + avail theo (mountpoint, device); bỏ trùng device; tối đa 4, \"/\" lên đầu.\n    static func parseDisks(_ samples: [PromSample]) -> [DiskUsage] {\n        struct Key: Hashable {\n            var mount: String\n            var device: String\n        }\n        var sizes: [Key: Double] = [:]\n        var avails: [Key: Double] = [:]\n        var fstypes: [Key: String] = [:]\n        for s in samples {\n            guard let mount = s.labels[\"mountpoint\"], !mount.isEmpty, let name = s.labels[\"__name__\"]\n            else { continue }\n            let key = Key(mount: mount, device: s.labels[\"device\"] ?? \"\")\n            fstypes[key] = s.labels[\"fstype\"]\n            if name == \"node_filesystem_size_bytes\" { sizes[key] = s.value }\n            if name == \"node_filesystem_avail_bytes\" { avails[key] = s.value }\n        }\n        var list: [DiskUsage] = []\n        var seenDevices: Set<String> = []\n        let keys = sizes.keys.sorted { a, b in\n            if (a.mount == \"/\") != (b.mount == \"/\") { return a.mount == \"/\" }\n            return a.mount < b.mount\n        }\n        for key in keys {\n            guard let size = sizes[key], size > 0, let avail = avails[key] else { continue }\n            if !key.device.isEmpty, !seenDevices.insert(key.device).inserted { continue }\n            let total = kb(size)\n            let available = min(kb(avail), total)\n            list.append(\n                DiskUsage(\n                    filesystem: key.device.isEmpty ? (fstypes[key] ?? \"\") : key.device, mount: key.mount,\n                    totalKB: total, usedKB: total - available, availableKB: available))\n            if list.count == 4 { break }\n        }\n        return list\n    }\n}\n"}, "Sources/SSHDeskCore/Metrics/ZabbixClient.swift": {"group": "Core · Metrics", "text": "import Foundation\n\n/// Method JSON-RPC duy nhất app được gọi (ADR-028). Không có `user.login` hay method tuỳ ý:\n/// client chỉ nhận enum này nên không thể gửi method khác.\npublic enum ZabbixMethod: String, Sendable, CaseIterable {\n    case apiinfoVersion = \"apiinfo.version\"\n    case hostGet = \"host.get\"\n    case itemGet = \"item.get\"\n}\n\n/// Khoá item cố định (Zabbix agent template Linux). Disk: `vfs.fs.size[<mount>,pused|total]` tìm theo tiền tố.\nenum ZabbixKeys {\n    static let cpuUtil = \"system.cpu.util\"\n    static let memUtil = \"vm.memory.utilization\"\n    static let memTotal = \"vm.memory.size[total]\"\n    static let load1 = \"system.cpu.load[all,avg1]\"\n    static let load5 = \"system.cpu.load[all,avg5]\"\n    static let load15 = \"system.cpu.load[all,avg15]\"\n    static let uptime = \"system.uptime\"\n    static let cpuNum = \"system.cpu.num\"\n    static let fsPrefix = \"vfs.fs.size[\"\n\n    /// Chuỗi dùng với `search` + `searchByAny` (khớp chuỗi con); khớp chính xác làm ở phía client.\n    static let searchTerms = [\n        cpuUtil, memUtil, memTotal, \"system.cpu.load[all,avg\", uptime, cpuNum, fsPrefix,\n    ]\n}\n\npublic struct ZabbixVersion: Equatable, Sendable {\n    public var major: Int\n    public var text: String\n\n    public init?(_ text: String) {\n        let head = text.split(separator: \".\").first.map(String.init) ?? \"\"\n        guard let m = Int(head), m > 0, m < 1000 else { return nil }\n        major = m\n        self.text = String(\n            text.unicodeScalars.filter { $0.value > 0x20 && $0.value < 0x7F }.prefix(20).map(Character.init))\n    }\n\n    /// Zabbix ≥ 7.0: token API qua header `Authorization: Bearer`; cũ hơn: trường `auth` trong body.\n    public var usesBearerHeader: Bool { major >= 7 }\n}\n\n/// Client Zabbix JSON-RPC. Chỉ `apiinfo.version`, `host.get`, `item.get`. Không đăng nhập bằng password.\npublic actor ZabbixClient: MetricsSnapshotProviding {\n    private let source: MetricsSource\n    private let credentials: (any CredentialStore)?\n    private let transport: any MetricsTransport\n    private var version: ZabbixVersion?\n\n    public init(\n        source: MetricsSource, credentials: (any CredentialStore)?, transport: any MetricsTransport\n    ) {\n        self.source = source\n        self.credentials = credentials\n        self.transport = transport\n    }\n\n    // MARK: - Dựng request (thuần, test được)\n\n    static func endpoint(base: String) throws -> URL {\n        guard var c = URLComponents(string: base) else { throw MetricsError.invalidResponse }\n        c.percentEncodedPath += \"/api_jsonrpc.php\"\n        guard let url = c.url else { throw MetricsError.invalidResponse }\n        return url\n    }\n\n    /// Thân JSON-RPC. `auth` != nil chỉ cho Zabbix < 7.0.\n    static func body(method: ZabbixMethod, params: Any, auth: String?) throws -> Data {\n        var object: [String: Any] = [\"jsonrpc\": \"2.0\", \"method\": method.rawValue, \"params\": params, \"id\": 1]\n        if let auth { object[\"auth\"] = auth }\n        return try JSONSerialization.data(withJSONObject: object, options: [.sortedKeys])\n    }\n\n    static func hostGetParams(filterField: String, value: String) -> [String: Any] {\n        [\"output\": [\"hostid\", \"host\", \"name\"], \"filter\": [filterField: [value]], \"limit\": 2]\n    }\n\n    static func hostProbeParams() -> [String: Any] {\n        [\"output\": [\"hostid\"], \"limit\": 1]\n    }\n\n    static func itemGetParams(hostID: String) -> [String: Any] {\n        [\n            \"output\": [\"itemid\", \"key_\", \"lastvalue\"], \"hostids\": hostID, \"searchByAny\": true,\n            \"search\": [\"key_\": ZabbixKeys.searchTerms], \"limit\": 500,\n        ]\n    }\n\n    /// Gọi một method trong whitelist. `apiinfo.version` KHÔNG kèm xác thực (Zabbix không cho phép).\n    private func call(_ method: ZabbixMethod, params: Any) async throws -> Any {\n        let token = try await tokenIfNeeded(for: method)\n        var request = URLRequest(url: try Self.endpoint(base: source.baseURL))\n        request.httpMethod = \"POST\"\n        request.setValue(\"application/json-rpc\", forHTTPHeaderField: \"Content-Type\")\n        request.setValue(\"application/json\", forHTTPHeaderField: \"Accept\")\n        var bodyAuth: String?\n        if let token {\n            if version?.usesBearerHeader ?? true {\n                request.setValue(\"Bearer \" + token, forHTTPHeaderField: \"Authorization\")\n            } else {\n                bodyAuth = token\n            }\n        }\n        request.httpBody = try Self.body(method: method, params: params, auth: bodyAuth)\n        let response = try await transport.send(request)\n        return try ZabbixParser.result(response.body)\n    }\n\n    private func tokenIfNeeded(for method: ZabbixMethod) async throws -> String? {\n        guard method != .apiinfoVersion, source.authKind == .bearer else { return nil }\n        return try MetricsAuth.secret(for: source, credentials: credentials)\n    }\n\n    private func detectVersion() async throws -> ZabbixVersion {\n        if let version { return version }\n        let raw = try await call(.apiinfoVersion, params: [String: Any]())\n        guard let text = raw as? String, let v = ZabbixVersion(text) else {\n            throw MetricsError.unsupportedVersion\n        }\n        version = v\n        return v\n    }\n\n    // MARK: - API\n\n    /// `apiinfo.version` không cần token nên không chứng minh token đúng: có token thì gọi thêm\n    /// `host.get` (limit 1) để xác thực.\n    public func testConnection() async throws -> String {\n        let text = try await detectVersion().text\n        if source.authKind == .bearer {\n            _ = try await call(.hostGet, params: Self.hostProbeParams())\n        }\n        return \"Zabbix \" + text\n    }\n\n    public func snapshot(for host: HostProfile, at date: Date) async throws -> MonitorSnapshot {\n        _ = try await detectVersion()\n        let name = try InstanceTemplate.render(source.instanceTemplate, hostName: host.hostName, port: host.port)\n        var hostID = try await findHost(field: \"host\", value: name)\n        if hostID == nil { hostID = try await findHost(field: \"name\", value: name) }\n        guard let hostID else { throw MetricsError.noData }\n        let raw = try await call(.itemGet, params: Self.itemGetParams(hostID: hostID))\n        return try ZabbixParser.snapshot(items: raw, at: date)\n    }\n\n    private func findHost(field: String, value: String) async throws -> String? {\n        let raw = try await call(.hostGet, params: Self.hostGetParams(filterField: field, value: value))\n        return ZabbixParser.firstHostID(raw)\n    }\n}\n\nenum ZabbixParser {\n    /// Lấy `result`; có `error` -> chỉ báo mã lỗi (không chép message/data của server).\n    static func result(_ data: Data) throws -> Any {\n        guard let obj = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else {\n            throw MetricsError.invalidResponse\n        }\n        if let err = obj[\"error\"] as? [String: Any] {\n            // Lỗi xác thực của Zabbix đi kèm HTTP 200: coi như bị từ chối (không chép nội dung lỗi).\n            let text = \"\\(err[\"message\"] ?? \"\") \\(err[\"data\"] ?? \"\")\".lowercased()\n            if [\"not authorized\", \"not authorised\", \"session terminated\", \"re-login\", \"no permissions\"]\n                .contains(where: text.contains)\n            {\n                throw MetricsError.unauthorized(status: 200)\n            }\n            let code = (err[\"code\"] as? Int).map(String.init) ?? \"?\"\n            throw MetricsError.apiError(code)\n        }\n        guard let result = obj[\"result\"] else { throw MetricsError.invalidResponse }\n        return result\n    }\n\n    static func firstHostID(_ raw: Any) -> String? {\n        guard let list = raw as? [[String: Any]], let id = list.first?[\"hostid\"] as? String,\n            !id.isEmpty, id.allSatisfy(\\.isNumber)\n        else { return nil }\n        return id\n    }\n\n    static func snapshot(items raw: Any, at date: Date) throws -> MonitorSnapshot {\n        guard let list = raw as? [[String: Any]] else { throw MetricsError.invalidResponse }\n        var values: [String: Double] = [:]\n        for item in list {\n            guard let key = item[\"key_\"] as? String, let text = item[\"lastvalue\"] as? String,\n                let v = Double(text), v.isFinite\n            else { continue }\n            values[key] = v\n        }\n        let cpu = values[ZabbixKeys.cpuUtil].map { min(100, max(0, $0)) }\n        let cores = values[ZabbixKeys.cpuNum].flatMap { $0 >= 1 && $0 < 100_000 ? Int($0) : nil }\n\n        var memory: MemoryInfo?\n        var memPercent: Double?\n        if let pct = values[ZabbixKeys.memUtil].map({ min(100, max(0, $0)) }) {\n            if let total = values[ZabbixKeys.memTotal], total > 0 {\n                let totalKB = UInt64(min(total / 1024, Double(UInt64.max / 2)))\n                let usedKB = min(totalKB, UInt64((Double(totalKB) * pct / 100).rounded()))\n                memory = MemoryInfo(\n                    totalKB: totalKB, availableKB: totalKB - usedKB, swapTotalKB: 0, swapFreeKB: 0)\n            } else {\n                memPercent = pct\n            }\n        }\n\n        var load: LoadAverage?\n        if let a = values[ZabbixKeys.load1], let b = values[ZabbixKeys.load5], let c = values[ZabbixKeys.load15] {\n            load = LoadAverage(one: a, five: b, fifteen: c)\n        }\n        let uptime = values[ZabbixKeys.uptime].flatMap { $0 >= 0 ? $0 : nil }\n        let disks = parseDisks(values)\n\n        if cpu == nil, memory == nil, memPercent == nil, load == nil, disks.isEmpty, uptime == nil {\n            throw MetricsError.noData\n        }\n        return MonitorSnapshot(\n            takenAt: date, cpuPercent: cpu, load: load, cores: cores, memory: memory, disks: disks,\n            uptimeSeconds: uptime, reportedMemoryPercent: memPercent)\n    }\n\n    /// `vfs.fs.size[/,pused]` + `vfs.fs.size[/,total]` -> DiskUsage (cần cả hai). Tối đa 4, \"/\" lên đầu.\n    static func parseDisks(_ values: [String: Double]) -> [DiskUsage] {\n        var mounts: Set<String> = []\n        for key in values.keys where key.hasPrefix(ZabbixKeys.fsPrefix) && key.hasSuffix(\",pused]\") {\n            let inner = key.dropFirst(ZabbixKeys.fsPrefix.count).dropLast(\",pused]\".count)\n            var mount = String(inner)\n            if mount.count >= 2, mount.hasPrefix(\"\\\"\"), mount.hasSuffix(\"\\\"\") {\n                mount = String(mount.dropFirst().dropLast())\n            }\n            if !mount.isEmpty { mounts.insert(mount) }\n        }\n        let ordered = mounts.sorted { a, b in\n            if (a == \"/\") != (b == \"/\") { return a == \"/\" }\n            return a < b\n        }\n        var out: [DiskUsage] = []\n        for mount in ordered {\n            guard let pused = values[\"\\(ZabbixKeys.fsPrefix)\\(mount),pused]\"],\n                let total = values[\"\\(ZabbixKeys.fsPrefix)\\(mount),total]\"], total > 0\n            else { continue }\n            let totalKB = UInt64(min(total / 1024, Double(UInt64.max / 2)))\n            let usedKB = UInt64((Double(totalKB) * min(100, max(0, pused)) / 100).rounded())\n            out.append(\n                DiskUsage(filesystem: \"\", mount: mount, totalKB: totalKB, usedKB: usedKB, availableKB: totalKB - usedKB)\n            )\n            if out.count == 4 { break }\n        }\n        return out\n    }\n}\n"}, "Sources/SSHDeskCore/Monitor/MonitorCoordinator.swift": {"group": "Core · Monitor", "text": "import Foundation\n\n/// Nơi lấy phiên để chạy lệnh Monitor (thật: `PooledMonitorSessions`; test: giả).\npublic protocol MonitorSessionProviding: Sendable {\n    /// Ném `SessionConnectError` khi không mở được; `CancellationError` khi bị huỷ.\n    func executor(for host: HostProfile) async throws -> any MonitorCommandExecuting\n    /// Đóng các phiên do provider tự mở (không đụng phiên của màn Truyền file/Analyst).\n    func finish() async\n}\n\n/// Provider thật: tái dùng phiên đang sống trong `SessionPool`, chưa có thì tự mở qua `SessionConnector`\n/// (đăng ký vào pool với owner `.monitor`).\npublic actor PooledMonitorSessions: MonitorSessionProviding {\n    public typealias PromptHandler =\n        @Sendable (HostProfile, PromptKind, @escaping SessionConnector.Respond) -> Void\n\n    private let pool: SessionPool\n    private let connector: SessionConnector\n    private let onPrompt: PromptHandler\n    private var opened: [(UUID, RemoteSession)] = []\n\n    public init(pool: SessionPool, connector: SessionConnector, onPrompt: @escaping PromptHandler) {\n        self.pool = pool\n        self.connector = connector\n        self.onPrompt = onPrompt\n    }\n\n    public func executor(for host: HostProfile) async throws -> any MonitorCommandExecuting {\n        if let live = await pool.liveSession(for: host.id) {\n            return RemoteCommandRunner(session: live)\n        }\n        let handler = onPrompt\n        let session = try await connector.connect(host: host) { kind, respond in\n            handler(host, kind, respond)\n        }\n        if Task.isCancelled {\n            await session.close()\n            throw CancellationError()\n        }\n        await pool.register(hostID: host.id, session: session, owner: .monitor)\n        opened.append((host.id, session))\n        return RemoteCommandRunner(session: session)\n    }\n\n    public func finish() async {\n        let list = opened\n        opened = []\n        for (id, s) in list {\n            await pool.unregister(hostID: id, session: s)\n            await s.close()\n        }\n    }\n}\n\npublic enum MonitorHostStatus: Sendable, Equatable {\n    case connecting\n    case ok\n    /// Lý do ngắn gọn, đã làm sạch.\n    case failed(String)\n    /// Không phải Linux hoặc thiếu `/proc`.\n    case unsupported\n}\n\npublic struct MonitorHostState: Sendable, Equatable {\n    public var hostID: UUID\n    public var status: MonitorHostStatus\n    /// Giữ mẫu cuối cả khi lỗi (hiển thị mờ).\n    public var snapshot: MonitorSnapshot?\n    public var cpuHistory = MonitorHistory()\n    public var memoryHistory = MonitorHistory()\n\n    public init(hostID: UUID, status: MonitorHostStatus) {\n        self.hostID = hostID\n        self.status = status\n    }\n}\n\n/// Vòng làm mới Monitor (ADR-019). Mỗi host độc lập, ≤ 4 host song song, vòng trước chưa xong thì bỏ lượt.\n/// Host kết nối thất bại hoặc không hỗ trợ KHÔNG bị tự thử lại (tránh khoá tài khoản vì sai password lặp);\n/// người dùng bấm thử lại (`retry`) hoặc Dừng/Tiếp tục.\npublic actor MonitorCoordinator {\n    public static let maxParallel = 4\n\n    private let sessions: any MonitorSessionProviding\n    private let now: @Sendable () -> Date\n    private let onUpdate: @Sendable (MonitorHostState) -> Void\n\n    private var hosts: [HostProfile] = []\n    private var interval: TimeInterval = 5\n    private var generation = 0\n    private var running = false\n    private var loopTask: Task<Void, Never>?\n    private var roundTask: Task<Void, Never>?\n    private var roundRunning = false\n\n    private var executors: [UUID: any MonitorCommandExecuting] = [:]\n    private var previousCPU: [UUID: CPUCounters] = [:]\n    private var blocked: Set<UUID> = []\n    public private(set) var states: [UUID: MonitorHostState] = [:]\n\n    public init(\n        sessions: any MonitorSessionProviding, now: @escaping @Sendable () -> Date = { Date() },\n        onUpdate: @escaping @Sendable (MonitorHostState) -> Void = { _ in }\n    ) {\n        self.sessions = sessions\n        self.now = now\n        self.onUpdate = onUpdate\n    }\n\n    public var isRunning: Bool { running }\n\n    // MARK: - Điều khiển\n\n    /// Bắt đầu theo dõi (xoá trạng thái cũ). Vòng đầu chạy ngay.\n    public func start(hosts: [HostProfile], interval: TimeInterval) {\n        cancelTasks()\n        generation += 1\n        self.hosts = hosts.filter { $0.sshAlias != nil }\n        self.interval = max(1, interval)\n        executors = [:]\n        previousCPU = [:]\n        blocked = []\n        states = [:]\n        roundRunning = false\n        running = true\n        startLoop()\n    }\n\n    /// Đổi chu kỳ mà không đóng phiên hay xoá lịch sử.\n    public func setInterval(_ newInterval: TimeInterval) {\n        interval = max(1, newInterval)\n        guard running else { return }\n        loopTask?.cancel()\n        startLoop()\n    }\n\n    /// Dừng vòng và đóng các phiên do Monitor tự mở. Trạng thái cuối vẫn đọc được.\n    public func stop() async {\n        generation += 1\n        running = false\n        cancelTasks()\n        roundRunning = false\n        executors = [:]\n        await sessions.finish()\n    }\n\n    /// Thử lại một host đã lỗi kết nối/không hỗ trợ.\n    public func retry(hostID: UUID) {\n        guard running, blocked.remove(hostID) != nil else { return }\n        executors[hostID] = nil\n        if !roundRunning { launchRound() }\n    }\n\n    private func cancelTasks() {\n        loopTask?.cancel()\n        roundTask?.cancel()\n        loopTask = nil\n        roundTask = nil\n    }\n\n    private func startLoop() {\n        let seconds = interval\n        loopTask = Task { [weak self] in\n            while !Task.isCancelled {\n                await self?.launchRoundIfIdle()\n                do { try await Task.sleep(for: .seconds(seconds)) } catch { return }\n            }\n        }\n    }\n\n    private func launchRoundIfIdle() {\n        guard running, !roundRunning else { return }\n        launchRound()\n    }\n\n    private func launchRound() {\n        roundRunning = true\n        let gen = generation\n        roundTask = Task { [weak self] in\n            await self?.runRound(generation: gen)\n            await self?.roundFinished(generation: gen)\n        }\n    }\n\n    private func roundFinished(generation gen: Int) {\n        if gen == generation { roundRunning = false }\n    }\n\n    /// Chạy đúng một vòng nếu không có vòng nào đang chạy (cho test). Trả false nếu bỏ lượt.\n    @discardableResult\n    func refreshRound() async -> Bool {\n        guard running, !roundRunning else { return false }\n        roundRunning = true\n        let gen = generation\n        await runRound(generation: gen)\n        roundFinished(generation: gen)\n        return true\n    }\n\n    // MARK: - Một vòng\n\n    private func runRound(generation gen: Int) async {\n        let targets = hosts.filter { !blocked.contains($0.id) }\n        await withTaskGroup(of: Void.self) { group in\n            var next = 0\n            func launch() {\n                let host = targets[next]\n                next += 1\n                group.addTask { [self] in await refreshHost(host, generation: gen) }\n            }\n            while next < min(Self.maxParallel, targets.count) { launch() }\n            while await group.next() != nil {\n                if n
